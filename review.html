צמצם מתומן שנפתח מהמרכז ככל שגוללים, כמו עדשת מצלמה, עד שהיא ממלאת את המסך. פתיחה לצלמים ולסטודיו.","when":"צלמים, סטודיו לווידאו, אופטיקה, כל מותג עם עדשה. פתיחת הירו, פעם אחת."},{"id":"g131","name":"כותרת שמתמלאת בנוזל","cat":"gsap","desc":"כותרת ענקית שהאותיות שלה הן מכל: צבע עולה בתוכן מלמטה עם הגלילה, בקו ישר, עד שכל המילה צבועה.","when":"כותרת הירו, מספר גדול, שם מותג. פעם אחת בעמוד, על מילה או שתיים."},{"id":"g132","name":"סרגל מדידה שנע עם הגלילה","cat":"gsap","desc":"סרגל אופקי עם שנתות ומספרים שנע עם הגלילה תחת מחוון קבוע, כמו סרט מדידה. המספר שמתחת למחוון גדל: שנים, קילומטרים, לקוחות.","when":"ציר זמן קומפקטי, \"כמה עשינו\", התקדמות של פרויקט. אחד לעמוד."},{"id":"g134","name":"מעבר דרך הסקשן אל הבא","cat":"gsap","desc":"הסקשן הנוכחי גדל לעבר הצופה ונעלם מעבר למצלמה, והסקשן הבא מתגלה מאחוריו קטן וגדל למקומו. תחושה של לעבור דרך דלת.","when":"מעבר בין שני פרקים באתר חוויה, מהירו לפרק הראשון. פעם אחת בעמוד."},{"id":"g135","name":"קו מפריד שמתכופף עם הגלילה","cat":"gsap","desc":"קו דק בין סקשנים שמתכופף כלפי מטה כשגוללים מהר ומתיישר חזרה כמו מיתר כשעוצרים. מפריד שמרגיש חי.","when":"בין כל שני סקשנים באתר סטודיו או מותג. כל המפרידים בעמוד, אותו קו."},{"id":"g136","name":"שתי תמונות שמתמזגות לאחת","cat":"gsap","desc":"תמונה של \"לפני\" שמתפוגגת לתוך תמונה של \"אחרי\" תוך כדי זום עדין, בקצב הגלילה. בלי קו מחלק, בלי גרירה: דיסולב שהגלילה שולטת בו.","when":"שיפוץ, טיפול, שדרוג מוצר, אתר ישן מול חדש. כשהשתיים צולמו מאותה זווית."},{"id":"g137","name":"מרכאות שנפתחות סביב הציטוט","cat":"gsap","desc":"שני סימני מרכאות ענקיים יושבים צמודים במרכז, וכשהעדות נכנסת הם נפרדים לפינות ומפנים מקום לטקסט שמופיע ביניהם. הציטוט נפתח, לא נוחת.","when":"עדות מרכזית אחת, ציטוט מייסד, משפט מפתח מלקוח. פעם אחת בעמוד."},{"id":"g138","name":"זרקור שנוסע על גריד בגלילה","cat":"gsap","desc":"גריד של לוגואים או פנים שכולו מעומעם, וזרקור עגול נוסע עליו בזיגזג עם הגלילה ומאיר כל פעם קבוצה אחרת. העין הולכת עם האור.","when":"קיר לקוחות, צוות, גלריית פרויקטים בעמוד ארוך. שמונה עד שנים עשר פריטים (שלוש שורות בדסקטופ). ליותר צריך שש עמודות ופריטים קטנים יותר."},{"id":"g139","name":"כותרת שנמחקת בקו ומוחלפת","cat":"gsap","desc":"כותרת ישנה שקו נמתח עליה ומוחק אותה, ומתחתיה עולה הכותרת החדשה בצבע. \"לא עוד X. מעכשיו Y\" שהגלילה מבצעת.","when":"מסר של שינוי: לפני ואחרי, הדרך הישנה מול החדשה, מיצוב מחדש. פעם אחת בעמוד."},{"id":"g140","name":"טבעות יעד שמתמלאות בגלילה","cat":"gsap","desc":"שלוש טבעות מקוננות, כל אחת מייצגת יעד אחר, שמתמלאות בקצב שונה ככל שגוללים, עם מקרא שהמספרים בו רצים. שלושה נתונים בתמונה אחת.","when":"תוצאות לקוח בשלושה מדדים, יעדי שנה, שביעות רצון לפי קטגוריה. בדיוק שלושה."},{"id":"g141","name":"שיחת וואטסאפ שמתנהלת בגלילה","cat":"gsap","desc":"בועות צ'אט שמופיעות אחת אחרי השנייה ככל שגוללים, עם \"מקליד...\" לפני כל תשובה. הסיפור של הליד מהפנייה ועד הפגישה, בפורמט שכולם מכירים.","when":"הדגמת שירות, תסריט מכירה, \"איך זה עובד\" לבוט או לצוות מכירות, עדות בסגנון שיחה. חמש עד עשר הודעות."},{"id":"g142","name":"קבלה שמודפסת בגלילה","cat":"gsap","desc":"פירוט מחיר שמודפס כמו קבלה: הנייר יוצא מהמדפסת שורה אחרי שורה ככל שגוללים, עד לשורת הסיכום והתלישה. תמחור שקוף עם קריצה.","when":"פירוט חבילה ומה כלול במחיר, כסיפור לפני סקשן המחירים. חמש עד תשע שורות. לא בתוך סקשן המחירים או הקופה עצמם: אזור המרה נשאר נקי מתנועה."},{"id":"g143","name":"פסים אופקיים שנפתחים בגלילה","cat":"gsap","desc":"ארבעה פסים אופקיים צרים, כל אחד תמונה. ככל שגוללים, הפס התורן נפתח לגובה מלא והשאר מתכווצים, אחד אחרי השני. אקורדיון תמונות שהגלילה מנגנת.","when":"גלריית עבודות, ארבעה שירותים עם תמונה, סיפור בארבע תמונות. שלושה עד חמישה פסים."},{"id":"g144","name":"תמונה שנקרעת לשניים וחושפת טקסט","cat":"gsap","desc":"תמונת הירו נקרעת לאורך קו משונן לשני חצאים שנפרדים לצדדים, ובפער נחשפת כותרת. קריעה של נייר, בקצב הגלילה.","when":"פתיחה דרמטית לקמפיין, \"שוברים את הכללים\", מעבר מהישן לחדש. פעם אחת בעמוד."},{"id":"g145","name":"מילים שנופלות מהשורה","cat":"gsap","desc":"משפט שהמילים שלו מתנתקות ונופלות אחת אחת, כל אחת בסיבוב ובכיוון קצת אחר, כשגוללים דרכו. מה שנשאר בשורה הוא המסר.","when":"\"מה שלא עובד\", ניקוי מהרעש, פתיחה של סקשן ערכים בסגנון \"פחות זה יותר\". פעם אחת בעמוד."},{"id":"g146","name":"מד מהירות שהמחט שלו זזה בגלילה","cat":"gsap","desc":"מד עגול כמו בלוח מכונית: המחט מטפסת מהאפס לערך ככל שגוללים, הקשת נצבעת מאחוריה והמספר במרכז רץ. ביצועים, ציון, מהירות טעינה.","when":"מהירות אתר, ציון ביקורת, רמת שירות, כל נתון שיש לו סקאלה. אחד לסקשן."},{"id":"g148","name":"כתם דיו שמתפשט וחושף","cat":"gsap","desc":"כתם דיו לא סימטרי שגדל מנקודה עד שהוא מכסה את המסך, וכל מה שבתוכו הוא הסצנה הבאה. חשיפה אורגנית במקום עיגול או פס.","when":"מעבר לפרק אמנותי, אתרי סטודיו, אופנה, קולינריה. פעם אחת בעמוד."},{"id":"b63","name":"שאלות נפוצות כשיחה","cat":"behavior","desc":"כל שאלה נראית כמו הודעה שנשלחה, והתשובה נכנסת כהודעת תגובה עם תמונת פרופיל. הפלוס מסתובב לאיקס, השאלה הפתוחה נצבעת בצבע המותג, ורק אחת פתוחה בכל רגע.","when":"סקשן שאלות נפוצות באתר של נותן שירות, קליניקה, יועץ או קורס: כל עסק שבו הלקוח קונה אדם ולא מוצר. התמונה בתגובה היא בעל העסק, וזה הופך רשימה יבשה לשיחה. באתר תאגידי או במפרט טכני עדיף האקורדיון הרגיל (b30)."},{"id":"b64","name":"תגיות שמצביעות על המסר המרכזי","cat":"behavior","desc":"משפט מרכזי בתוך עיגול, וסביבו תגיות של שירותים או יכולות. לכל תגית חץ קטן כמו סמן של משתמש, שמחושב כך שיכוון תמיד אל מרכז העיגול. בכניסה העיגול גדל והתגיות יוצאות ממנו החוצה, ואחר כך הן מתנדנדות קלות.","when":"סקשן שמסכם הצעת ערך אחת ומראה את כל מה שמרכיב אותה: סוכנות ושירותיה, קורס ונושאיו, מוצר ויכולותיו. עובד כשיש משפט אחד חזק וחמש עד שמונה תגיות קצרות. לא לרשימה ארוכה ולא לתגיות של יותר משתי מילים."},{"id":"lm10","name":"לוגואים שמקבלים את צבע הרקע","cat":"lm","desc":"כל לוגו בקובץ שלו, בכל צבע, משמש כמסכה, והצבע שנשפך דרכה הוא צבע הטקסט של הסקשן. אותה רצועת לקוחות יושבת על רקע בהיר, כהה או בצבע המותג, ומתהפכת לבד בלי קובץ נוסף ובלי פילטר.","when":"כל רצועת לקוחות, שותפים או \"הופענו ב\". במיוחד כשהלוגואים מגיעים מהלקוח בעשרה צבעים שונים, או כשהרצועה יושבת על רקע כהה, או כשהעמוד מחליף ערכת צבע בגלילה (b29)."},{"id":"g149","name":"שתי תמונות שנפרשות לצדדים וחושפות את הפרויקט","cat":"gsap","desc":"בכל כרטיס פרויקט שתי תמונות לאורך מונחות זו על זו במרכז ומסתירות את הטקסט. כשהכרטיס נכנס למסך הן נפרשות לצדדים עם הטיה קלה, כמו שתי תמונות שמזיזים על שולחן, ובאמצע נחשפים שם הפרויקט, התיאור והכפתור.","when":"רשימת פרויקטים של אדריכל, יזם נדל\"ן, מעצב פנים, צלם או סטודיו. גם מקרי בוחן ומוצרים דגל. עובד כשלכל פריט יש שתי תמונות טובות (חוץ ופנים, לפני ואחרי, יום ולילה), וחוזר על עצמו כרטיס אחרי כרטיס בלי להימאס כי הוא לא נועל את הגלילה."},{"id":"b65","name":"הדר עם מגה תפריט בשני טורים","cat":"behavior","desc":"פריט אחד בתפריט פותח פאנל רחב: שני טורים של קישורים עם תיאור קצר, וטור פעולה בצד. הפאנל נפרש מלמעלה והקישורים נכנסים בזה אחר זה. במובייל אותו הדר הופך לכפתור שפותח מגירה עם אקורדיון (b66).","when":"אתרים עם שמונה עמודי שירות ומעלה שמתחלקים לשתי קבוצות: לעסק ולבית, מוצרים ושירותים, לפי קהל או לפי תחום. מחליף תפריט של שנים עשר פריטים ששורה אחת לא מחזיקה."},{"id":"b66","name":"מגירת מובייל עם אקורדיון וכניסה מדורגת","cat":"behavior","desc":"ההמבורגר הופך ל-X, המגירה נוסעת מהצד, השורות נכנסות אחת אחרי השנייה, ותת-תפריט נפתח כאקורדיון בתוך המגירה. ביציאה הכל חוזר מהר ובלי דירוג.","when":"כל אתר עם יותר מחמישה פריטי תפריט או עם תת-תפריט (מגה תפריט בדסקטופ). משתלב עם כל תפריט דסקטופ: b39, b55, b65."},{"id":"hd1","name":"הדר קלאסי: שקוף על ההירו, אטום בגלילה","cat":"header","desc":"לוגו, ניווט וכפתור. על ההירו הוא שקוף ובצבע בהיר, ובגלילה הראשונה מקבל משטח וצל רך ומתהפך לכהה. גוללים למטה והוא יוצא, עולים והוא חוזר.","when":"ברירת המחדל לאתרי תדמית ושירותים עם הירו כהה או צילומי. הוא ההדר שהיה בכל האתרים עד עכשיו, ולכן הוא נבחר רק כשאין סיבה לאחר: עסק מוכר, קהל שמרני, תוכן שהוא העיקר."},{"id":"hd2","name":"הדר מפוצל: הלוגו במרכז, הניווט בצדדים","cat":"header","desc":"הלוגו יושב באמצע כמו כותרת של מגזין, הניווט בצד אחד והפעולה בצד השני. כפתור הפעולה בקו מתאר ולא במילוי, כדי שהלוגו יישאר הדבר הראשון שרואים.","when":"עסקים של טעם ששמם הוא המותג: סטודיו לעיצוב פנים, אדריכלות, מסעדה, בוטיק, צלם, מעצבת תכשיטים. לא לאתר עם יותר מחמישה פריטי ניווט, כי הצד מתמלא לפני המרכז."},{"id":"hd3","name":"הדר גלולה צפה","cat":"header","desc":"קפסולה מעוגלת שמרחפת מעל התוכן במרחק מהקצה, עם זכוכית עמומה. בגלילה היא מתכווצת מעט ומקבלת צל, יוצאת למעלה בגלילה מטה וחוזרת מעלה.","when":"טכנולוגיה, סטארטאפ, סטודיו, מוצר, ייעוץ מודרני. כל אתר שרוצה להיראות עכשווי ולא תבניתי. עד חמישה פריטי ניווט, כי הקפסולה צרה מרוחב המסך."},{"id":"hd4","name":"הדר מינימלי צף עם תפריט מסך מלא","cat":"header","desc":"אין פס בכלל: שבב לוגו בצד אחד וכפתור תפריט עגול בצד השני, צפים מעל התוכן. הכפתור פותח תפריט מסך מלא שנפרש במעגל מהכפתור עצמו, עם קישורים גדולים שנכנסים בזה אחר זה.","when":"תיק עבודות, אדריכלות, צילום, יוקרה, מותג עם מעט עמודים. כשהתוכן הוויזואלי צריך את כל המסך וההדר צריך להיעלם גם כשהוא גלוי. לא לאתר שירות עם עשרה עמודים, כי כל ניווט עולה לחיצה נוספת."},{"id":"hd5","name":"הדר בשתי קומות: פס פרטים ופס ניווט","cat":"header","desc":"פס עליון דק עם טלפון, שעות פעילות ובחירת שפה, ומתחתיו הניווט הראשי. בגלילה הראשונה הפס העליון מתקפל ונשאר רק הניווט, ובהמשך הכל יוצא וחוזר כרגיל.","when":"עסקים שהטלפון והשעות הם חלק מהמכירה: עורכי דין, מרפאות, שירות מקומי, מוסכים, קבלנים, ואתרים דו-לשוניים או תלת-לשוניים. לא לאתר של מותג או חוויה, שם הפס העליון נראה כמו אתר של שנות האלפיים."},{"id":"hd6","name":"הדר עם שורת הודעה","cat":"header","desc":"שורה דקה מעל ההדר עם הודעה אחת או שתיים מתחלפות: מבצע, הרשמה שנפתחה, זמני משלוח. בגלילה הראשונה השורה מתקפלת והניווט נשאר, ובהמשך הכל יוצא וחוזר כרגיל. אפשר לסגור אותה, והיא זוכרת שנסגרה.","when":"חנות, עסק עם קמפיין פעיל, אירוע או הרשמה עם תאריך, עסק עם הודעה עונתית (שעות חג, משלוח חינם). לא כקישוט קבוע: כשאין מה להודיע, השורה לא קיימת וזה hd1, hd3 או hd8."},{"id":"hd7","name":"הדר נחיתה צף: לוגו, טלפון וכפתור אחד","cat":"header","desc":"בלי ניווט בכלל, כדי שלא יהיו יציאות מהמשפך: לוגו, טלפון וכפתור אחד. הכפתור בקו מתאר כל עוד ההירו על המסך (שם יש כפתור גדול משלו), ומתמלא בצבע ברגע שההירו נגמר.","when":"דפי נחיתה של קמפיין, הרשמה לסדנה, שיעור ניסיון, הורדת מדריך. כל עמוד שמטרתו פעולה אחת. לא לאתר תדמית, שם המבקר צריך לנווט."},{"id":"hd8","name":"הדר קפסולה שנפתחת לתפריט","cat":"header","desc":"קפסולה צפה עם לוגו, כפתור תפריט וכפתור פעולה. לחיצה על התפריט לא פותחת מגירה או מסך: הקפסולה עצמה גדלה למטה והופכת לכרטיס עם הקישורים ופרטי הקשר, ובלחיצה נוספת מתקפלת חזרה.","when":"אתרים מודרניים עם חמישה עד שמונה עמודים: סטודיו, מוצר, מסעדה, קליניקה בוטיק. אותו תפריט בדסקטופ ובמובייל, ולכן אין שני תפריטים לתחזק. לא למגה תפריט עם עשרות קישורים (b65)."},{"id":"hd9","name":"גלולה צפה ששקופה מעל ההירו ונצבעת בלבן בגלילה","cat":"header","desc":"קפסולה צפה בלי שום מילוי בראש העמוד: לוגו וקישורים בהירים ישירות על ההירו. בגלילה הראשונה היא מתמלאת בלבן עם זכוכית וצל, הטקסט מתהפך לכהה, והיא מתכווצת מעט. גוללים למטה והיא יוצאת, עולים והיא חוזרת.","when":"הירו כהה או צילומי מלא: וידאו רקע, צילום אווירה, מותג עם נוכחות. כשרוצים שהמסך הראשון יהיה כולו ויז'ואל, בלי פס שמסתיר אותו, ועדיין הדר ברור ברגע שהתוכן הבהיר מתחיל. לא להירו בהיר, שם טקסט בהיר על רקע בהיר לא נקרא (שם hd3)."},{"id":"h1","name":"הירו ממורכז קלאסי עם ויז'ואל מציץ","cat":"hero","desc":"כותרת ממורכזת, משפט הסבר, זוג כפתורים, שורת אמון, ומתחת ויז'ואל רחב שנחתך בקצה המסך. הכותרת והשורות עולות בזו אחר זו, והוויז'ואל נחשף אחרון.","when":"שירות או מוצר שהמסר שלו מילולי: ייעוץ, פיננסים, תוכנה, מערכת. ברירת המחדל של העור השקט. לא לעסק שמוכר חלל, אוכל, גוף או חומר, שם הצילום צריך להוביל."},{"id":"h2","name":"הירו טקסט ותמונה עם כרטיסי נתון","cat":"hero","desc":"טקסט בצד אחד, תמונה גבוהה בצד השני, ושני כרטיסי נתון שיושבים על קצוות התמונה ונכנסים אחרונים. בלי קישוט: התמונה והנתון עושים את העבודה.","when":"עסק שיש לו נתון אמיתי להראות (שנים, לקוחות, זמן תגובה): מערכת, שירות מקצועי, קליניקה, חברת השמה. לא כשהמספרים מומצאים, שם הם מורידים אמון."},{"id":"h3","name":"הירו מדיה מלאה עם שכבת קריאות","cat":"hero","desc":"וידאו או צילום שממלא את המסך, שכבת גרדיאנט שמבטיחה שהטקסט קריא, וכותרת שעולה מתוך חיתוך. הווידאו מתחיל רק כשהוא על המסך, מתנגן לכולם, ויש לו כפתור עצירה גלוי.","when":"עסק שמוכר חוויה, מקום או חומר: מסעדה, מלון, אולם אירועים, סטודיו, תיירות, קבלן. דורש צילום אמיתי וטוב. לא לאתר שירות עם תמונות סטוק."},{"id":"h4","name":"הירו חצי חצי עם הפרדה חדה","cat":"hero","desc":"חצי אחד צילום שמגיע עד הקצה, חצי שני טקסט על משטח נקי, בלי מעבר רך ביניהם. הצילום נושם מ-108% ל-100 והטקסט עולה.","when":"אדריכלות, נדל״ן, עיצוב פנים, אופנה, מותג מוצר. כשיש צילום אחד חזק שמספר את הסיפור. עובד יפה גם כשהטקסט קצר."},{"id":"h5","name":"הירו טיפוגרפי טהור","cat":"hero","desc":"אין תמונה. הכותרת הענקית היא הוויז'ואל, ומסביבה פרטים קטנים: תחום, מיקום, ושורת פעולה. המילים נכנסות אחת אחרי השנייה מלמטה.","when":"כשהטיפוגרפיה היא המוצר, או כשאין נכס ויזואלי בכלל ולא רוצים סטוק: סטודיו, מותג, אירוע, כנס, פרסום, ייעוץ בכיר. דורש פונט תצוגה עם נוכחות (library/fonts.md, קבוצת X או L)."},{"id":"h6","name":"הירו בנטו","cat":"hero","desc":"כרטיס ראשי גדול עם הכותרת והפעולה, ולצידו שלושה כרטיסים קטנים עם תוכן אמיתי: נתון, צילום, ומצב חי. הכרטיסים נכנסים בזה אחר זה, מהכרטיס הראשי החוצה.","when":"מערכת, SaaS, דשבורד, סוכנות עם כמה שירותים, אתר שמציג כמה עולמות בבת אחת. גם כשיש תוכן דינמי להראות (משמרות, מחירים, זמינות)."},{"id":"h7","name":"הירו עם שאלון ניתוב","cat":"hero","desc":"במקום שני כפתורים כלליים, שאלה אחת עם שתיים עד שלוש תשובות. הבחירה מחליפה את המשפט, את רשימת הנקודות ואת הפעולה, ורק אז שולחת לעמוד הנכון.","when":"עסק ששני קהלים שלו מחפשים דברים שונים: לבית מול לעסק, שכיר מול עצמאי, מכירה מול השכרה, פרטי מול מוסדי. במקום לפצל את האתר, מפצלים את הרגע הראשון."},{"id":"h8","name":"הירו רשימת עבודות","cat":"hero","desc":"רשימת פרויקטים או שירותים בשורות טיפוגרפיות גדולות, וריחוף על שורה מציג את הצילום שלה בצד. במגע ובמקלדת, נגיעה או פוקוס על שורה מחליפים את הצילום, והראשון מוצג בהתחלה.","when":"תיק עבודות שהוא עצמו ההצעה: אדריכלות, צילום, הפקה, מיתוג, קבלן שיפוצים, יועץ עם פרויקטים בולטים. דורש בין שלושה לשישה פריטים עם שם אמיתי."},{"id":"h9","name":"הירו כותרת עם תמונות בתוך השורה","cat":"hero","desc":"כותרת גדולה וממורכזת, ובין המילים שלה שלוש תמונות קטנות בצורת גלולה, בגובה האותיות. המילים עולות בזו אחר זו, וכל תמונה נפתחת מהמרכז לצדדים מיד אחרי המילה שלפניה.","when":"עסק שיש לו צילומים קטנים וטובים של העבודה עצמה: מאפייה, בית קפה, סטודיו, קליניקה, חנות מוצר. עובד כשכל תמונה מראה את המילה שלידה. לא כשיש רק צילום אחד, ולא עם צילומי סטוק כלליים."},{"id":"h10","name":"הירו טקסט במרכז ותמונות בכנפיים","cat":"hero","desc":"טור טקסט צר במרכז, וארבע תמונות בגדלים ובגבהים שונים בשני הצדדים, חלקן נחתכות בקצה המסך. התמונות נכנסות מלמעלה ומלמטה, ובגלילה זזות כל אחת במהירות אחרת.","when":"עסק שמוכר אווירה ויש לו כמה צילומים באותה תאורה: בר, מסעדת ערב, מלון בוטיק, אולם אירועים, מותג אופנה. לא כשהטקסט ארוך משלוש שורות, כי הטור צר בכוונה."},{"id":"h11","name":"הירו צילום רחב למעלה וטקסט מתחתיו","cat":"hero","desc":"צילום רחב שתופס את החלק העליון של המסך עד הקצוות, ומתחתיו שורת טקסט על משטח נקי: כותרת גדולה בצד אחד, משפט וכפתור בצד השני. הצילום נחשף מלמעלה למטה ונושם, והכותרת עולה אחריו.","when":"עסק שהצילום שלו רחב ושקט: מטבחים, נגרות, קבלן, נדל״ן, תיירות, אדריכלות נוף. מתאים כשהטקסט לא צריך לשבת על התמונה. לא לצילום אנכי או לצילום עם הרבה פרטים בתחתית."},{"id":"h12","name":"הירו סנדוויץ': שורה, רצועת צילום, שורה","cat":"hero","desc":"הכותרת מתפצלת לשתי שורות ענקיות, ובין השורות רצועת צילום פנורמית ברוחב המסך כולו. השורה הראשונה מיושרת להתחלה והשנייה לסוף, הרצועה נפתחת מהאמצע לגובה, ומתחת יושבים משפט וכפתור.","when":"כשיש צילום אחד חזק ורחב, ומשפט פתיחה שמתחלק טוב לשניים: תיירות, שייט, יקב, מותג, סטודיו, קבלן. עובד גם כשהעסק פשוט, כי המבנה עושה את הרושם. לא לכותרת ארוכה משש מילים."},{"id":"h13","name":"הירו קשתות שעולות מהתחתית","cat":"hero","desc":"כותרת ממורכזת למעלה, ומתחתיה שלוש תמונות בצורת קשת שעולות מקצה המסך התחתון, האמצעית גבוהה מהשתיים שלצידה. הקשת האמצעית עולה ראשונה, והצדדיות אחריה.","when":"עסק עם אופי רך ומוקפד: עיצוב פנים, ספא, קליניקת אסתטיקה, מלון בוטיק, חתונות, נדל״ן יוקרה. דורש שלוש תמונות שעובדות יחד בצבע. לא לעסק טכני או תעשייתי, שם הקשת נראית כקישוט."},{"id":"h14","name":"הירו עם עמודות תמונות שזזות","cat":"hero","desc":"טקסט בצד אחד, ובצד השני שתי עמודות של תמונות שגולשות לאט ובלי סוף, אחת למעלה ואחת למטה. הקצוות נמוגים, ריחוף עוצר את התנועה, ויש כפתור עצירה גלוי.","when":"עסק שיש לו הרבה צילומים טובים ולא צילום אחד מוביל: הפקת אירועים, צלם, מסעדה, חנות, סטודיו, קייטרינג. מראה כמות ואיכות בבת אחת. לא כשיש פחות משש תמונות, כי החזרה בולטת."},{"id":"h15","name":"הירו מצגת מסך מלא עם פסי התקדמות","cat":"hero","desc":"שלוש תמונות במסך מלא שמתחלפות לבד, כל אחת עם שם קצר, ופס התקדמות לכל אחת כמו בסטורי. הכותרת והכפתור נשארים קבועים, נגיעה בשם עוברת לתמונה שלו, ויש כפתור עצירה.","when":"עסק שצריך להראות כמה מקומות או חלקים כבר במסך הראשון: מלון (חוף, חדרים, בר), נדל״ן (בניין, דירה, נוף), אולם, מסעדה עם כמה חללים, אתר תיירות. לא כשיש רק צילום אחד טוב; אז h3."},{"id":"h16","name":"הירו עם טופס לידים בתוך ההירו","cat":"hero","desc":"טקסט בצד אחד וצילום בכרטיס מעוגל בצד השני. במקום כפתור יש שורת טופס קצרה, שם וטלפון ושליחה, שחוצה את הרווח ונכנסת לתוך הצילום. השליחה מחליפה את השורה בתודה, בלי לעזוב את העמוד.","when":"עסק שהפנייה הראשונה אליו היא שיחת טלפון: קליניקה, עורך דין, יועץ משכנתאות, שיפוצים, קורסים. עובד כששני שדות מספיקים. לא כשצריך לבחור שירות, תאריך או כתובת לפני שמדברים; אז h17 או h7."},{"id":"h17","name":"הירו צילום מלא עם שורת הזמנה","cat":"hero","desc":"צילום אווירה במסך מלא, כותרת בפינה התחתונה, ומתחתיה שורת הזמנה על משטח בהיר: תאריך הגעה, מספר לילות, הרכב אורחים וכפתור בדיקת זמינות. התשובה מופיעה מתחת לשורה, בלי לעבור עמוד.","when":"עסק שמוכר זמן: צימרים ובקתות, מלון, השכרת רכב, מתחם אירועים, הזמנת שולחן, סדנאות עם תאריכים. השורה מקצרת את הדרך למנוע ההזמנה. לא לעסק בלי תאריכים; אז h3 או h16."},{"id":"h18","name":"הירו אפליקציה: טלפון שעולה מתחת לכותרת","cat":"hero","desc":"כותרת וכפתורי הורדה במרכז, ומתחתם טלפון שבנוי כולו ב-CSS עם מסך של האפליקציה, שעולה מתחתית ההירו. שני כרטיסים קטנים צפים לצדו: תזכורת ודירוג.","when":"עסק שיש לו אפליקציה או מערכת שהלקוח משתמש בה בטלפון: סטודיו עם הזמנת שיעורים, מרפאה, מועדון לקוחות, משלוחים, מערכת SaaS. המסך בנוי בקוד, ולכן מחליפים בו מילים ולא צילום מסך. לא כשאין מוצר דיגיטלי אמיתי להראות."},{"id":"h19","name":"הירו לפני ואחרי עם ידית גרירה","cat":"hero","desc":"טקסט בצד אחד, ובצד השני אותו חדר פעמיים, לפני ואחרי, עם ידית שגוררים לרוחב. אחרי הכניסה הידית זזה פעם אחת לבד כדי להראות שאפשר, ומשם היא של המבקר: בעכבר, במגע ובמקלדת.","when":"עסק שהתוצאה שלו נראית: תאורה, שיפוצים, ניקיון, צביעה, גינון, אסתטיקה, עריכת תמונות. עובד רק עם זוג צילומים מאותה זווית בדיוק. לא כשאין צילום \"לפני\" אמיתי; אז h11."},{"id":"h20","name":"הירו שם ענק על צילום מלא","cat":"hero","desc":"צילום במסך מלא, משפט פתיחה וכפתור בחלק העליון, ובתחתית שם העסק בענק, כמעט מקצה לקצה, כמו שלט. האותיות עולות אחת אחרי השנייה.","when":"עסק שהשם שלו הוא המותג: מסעדה, בר, מלון בוטיק, גלריה, מותג אופנה, אמן. עובד עם שם קצר, עד שבע אותיות, ועם צילום שהתחתית שלו כהה. לא לשם ארוך או לשם שלא אומר כלום למי שלא מכיר; אז h3."},{"id":"h21","name":"הירו גריד מגזין","cat":"hero","desc":"עמוד פתיחה של מגזין: כותרת גדולה בפונט תצוגה על שבע עמודות, צילום גבוה שתופס את כל הגובה בצד השני, ובתחתית צילום קטן לצד משפט וכפתורים. הצילומים נחשפים מלמטה למעלה, והכותרת עולה ביניהם.","when":"עסק עם טעם ויזואלי ויותר מצילום טוב אחד: סטודיו, בית דפוס, הוצאה לאור, גלריה, מעצבת, מותג קרמיקה או אופנה, אדריכלות. לא לעסק שצריך להמיר מהר עם טופס; אז h16."},{"id":"h22","name":"הירו מניפת כרטיסים","cat":"hero","desc":"כותרת וכפתורים במרכז, ומתחתם חמישה כרטיסים שנפתחים כמו מניפה מתוך ערימה אחת ועולים מתחתית ההירו. בכל כרטיס צילום ושם קצר, והאמצעי הוא כרטיס טקסט בצבע המותג. ריחוף מרים כרטיס.","when":"עסק שיש לו כמה מוצרים או סוגים שכדאי לראות יחד: גלידרייה, קונדיטוריה, חנות קטנה, סדנאות, תפריט עונתי, מותג קוסמטיקה. לא כשיש רק מוצר אחד או פחות מארבעה צילומים; אז h3."},{"id":"h23","name":"הירו מספר ענק עם צילום בתוך הספרות","cat":"hero","desc":"טקסט בצד אחד, ובצד השני מספר אחד ענק שהוא כל הוויז'ואל: הספרות ממולאות בצילום של החומר עצמו, והמספר רץ עד הערך שלו בכניסה. מתחתיו שורה שאומרת מה הוא סופר.","when":"עסק שיש לו מספר אחד שאומר הכול: שנות ותק, פרויקטים, לקוחות, מטרים, קילומטרים. עובד עם מספר של שתיים עד ארבע ספרות וצילום עם טקסטורה (אבן, עץ, בד, מים, אוכל מקרוב). לא כשהמספר קטן או לא מרשים, ולא עם צילום של אנשים, שהספרות חותכות."},{"id":"h24","name":"הירו דירוג למעלה ורצועת ביקורות","cat":"hero","desc":"כותרת ממורכזת שמעליה שורת דירוג: עיגולי ראשי תיבות, כוכבים ומספר הביקורות. מתחת לכפתורים רצועה של כרטיסי ביקורת שגולשת לאט לרוחב, עם קצוות נמוגים, עצירה בריחוף וכפתור עצירה גלוי.","when":"עסק שהלקוח בוחר בו לפי ביקורות ויש לו הרבה כאלה: הובלות, שיפוצים, ניקיון, מרפאה, מוסך, בית ספר לנהיגה, קייטרינג. הביקורות הן הטיעון, ולכן הן במסך הראשון ולא בתחתית העמוד. לא לעסק עם פחות מעשרים ביקורות אמיתיות, ולעולם לא עם ביקורות ממוצאות."},{"id":"h25","name":"הירו מוצר עם בורר צבעים","cat":"hero","desc":"צילום מוצר גדול בצד אחד, ובצד השני שם, מחיר, בורר צבעים וכפתור הוספה לסל. בחירת צבע מחליפה מיד את הצילום ואת שם הצבע, בלי לעבור עמוד.","when":"חנות עם מוצר מוביל אחד שמגיע בכמה צבעים או גרסאות: תיק, נעל, ספל, בקבוק, כרית, צעצוע, תכשיט. דף נחיתה של מוצר יחיד, או מוצר הדגל בעמוד הבית. לא לחנות שמוכרת מאות מוצרים שווים, שם ההירו מוביל לקטגוריות."},{"id":"h26","name":"הירו חלון צילום בתוך הכותרת","cat":"hero","desc":"כותרת ענקית במרכז, ובאמצעה חלון צר וגבוה שמראה את הצילום. החלון נפתח מקו דק, זז קצת לצדדים אחרי העכבר, וכל אות שנכנסת אליו מחליפה צבע בזמן אמת. המשפט והכפתורים יושבים בשני הצדדים, למטה.","when":"עסק שמוכר חוויה או מקום ויש לו צילום אחד חזק: סיורים, מסעדה, מלון, צלם, סטודיו, אדריכלות, אירועים. רגע אחד שזוכרים, בלי וידאו ובלי ספרייה. לא לצילום בהיר מאוד, שהאותיות הבהירות לא נקראות עליו, ולא לכותרת של יותר משתי שורות קצרות."},{"id":"h27","name":"הירו מותג אישי עם דיוקן","cat":"hero","desc":"דיוקן גבוה של בעלת העסק בצד אחד, ובצד השני היכרות קצרה בשמה, ההבטחה, כפתור לשיחת היכרות ושורה של שלוש עובדות. על הדיוקן תווית קטנה של זמינות.","when":"עסק שהוא אדם אחד: יועצת, מאמן, מטפלת, סטייליסטית, עורך דין, צלם, מרצה. הלקוח קונה את האדם, ולכן הפנים במסך הראשון ובגדול. לא בלי צילום מקצועי אמיתי של האדם, ולא לעסק עם צוות, שם h16 או h3."},{"id":"h29","name":"הירו המלצה ככותרת","cat":"hero","desc":"ציטוט של לקוחה בגדול, בפונט תצוגה, הוא הדבר הראשון שקוראים. מעליו שורה קטנה שאומרת מה העסק עושה, מתחתיו שם הלקוחה וכפתור, ולצדו צילום מהבית שלה.","when":"עסק שהתוצאה שלו נשמעת הכי טוב מפי לקוח: התקנות לבית, שיפוצים, אנרגיה סולארית, טיפול, אימון, ייעוץ. עובד כשיש לקוח אמיתי שהסכים לשם ולצילום, ומשפט אחד קצר עם מספר או שינוי מוחשי. לא כשההמלצה כללית (\"שירות מעולה\"), ולא כשאין לקוח שמסכים להופיע."},{"id":"h30","name":"הירו שלושה לוחות שנפתחים","cat":"hero","desc":"כותרת ומשפט למעלה, ומתחת שלושה לוחות צילום זה לצד זה, אחד לכל סוג לקוח. הלוח הפתוח רחב ומראה משפט הסבר; ריחוף או לחיצה על לוח אחר פותחים אותו, והאחרים מצטמצמים.","when":"עסק שמשרת שלושה קהלים או שלושה סוגי עבודה, וכל אחד רוצה לראות את עצמו כבר במסך הראשון: בית, בניין ועסק; פרטי, עסקי ומוסדי; שיפוץ, בנייה ותחזוקה. לא ליותר מארבעה לוחות, שם הסגורים נהיים צרים מדי לשם, ולא כשיש שירות אחד, שם h4."},{"id":"h31","name":"הירו חנות עם עיגולי קטגוריות","cat":"hero","desc":"כותרת ממורכזת עם צילום קטן בצורת גלולה בתוך המשפט, משפט הסבר וזוג כפתורים, ומתחת שורה של עיגולי צילום, אחד לכל קטגוריה, עם שם ומספר פריטים. העיגולים נכנסים בזה אחר זה.","when":"חנות עם ארבע עד שש קטגוריות ברורות שכל אחת מצטלמת יפה: רהיטים לפי חדרים, ביגוד, קוסמטיקה, צעצועים, חנות פרחים, מעדנייה. מי שנכנס קופץ ישר לקטגוריה שלו מהמסך הראשון. לא לחנות עם מוצר מוביל אחד, שם h25, ולא לשירות בלי מוצרים."},{"id":"h32","name":"הירו אירוע עם ספירה לאחור","cat":"hero","desc":"צילום מלא וכהה מהאירוע, ובפינה התחתונה כותרת, תאריך, ספירה לאחור של ימים, שעות ודקות עד הפתיחה, וכפתור כרטיסים. הספרה שמשתנה מחליקה פנימה בעדינות.","when":"אירוע עם תאריך אחד שכל העמוד מוביל אליו: פסטיבל, כנס, הופעה, השקה, סדנה, פתיחה של מקום חדש, מבצע שנגמר. הספירה נותנת סיבה לקנות עכשיו ולא בפעם הבאה. לא לאירוע שחוזר כל שבוע ולא לתאריך רחוק משנה, שם המספר גדול מדי מכדי לדחוף."},{"id":"h33","name":"הירו צילום עם נקודות מוצר","cat":"hero","desc":"שתי עמודות: בצד אחד הכותרת, המשפט והכפתורים, ומתחתם רשימה קצרה של מה שרואים בצילום עם מחירים. בצד השני צילום גבוה של החלל עם נקודה על כל פריט. הרשימה והנקודות מחוברות: מעבר על שורה מדגיש את הנקודה שלה, ולחיצה על שורה או על נקודה פותחת כרטיס ליד הפריט עצמו.","when":"עסק שהעבודה שלו היא חלל שלם ובתוכו פריטים שאפשר להזמין: מטבחים, נגרות, עיצוב פנים, ריהוט, תאורה, אופנה בצילום אווירה, חנות כלי בית. הצילום מוכר את התמונה הגדולה, והרשימה עונה על \"מה זה וכמה זה\" גם למי שלא לוחץ על נקודות. לא ליותר מחמישה פריטים, ולא לצילום שבו הפריטים קטנים מכדי לזהות."},{"id":"h34","name":"הירו סרטון רחב כמו בקולנוע","cat":"hero","desc":"סרטון רחב ונמוך, כמו פתיחה של סרט, שנפתח מקו דק לגובה מלא, ומתחתיו כותרת בצד אחד ומשפט וכפתורים בצד השני. הסרטון מתנגן בלולאה שקטה ויש לו כפתור עצירה.","when":"עסק שיש לו סרטון קצר ושקט שמראה את החוויה: נסיעות וחופשות, מלון, צימר, יקב, אירועים, ספורט ים, אדריכלות. הפורמט הרחב משאיר מקום לטקסט במסך הראשון בלי לכתוב על הסרטון. לא בלי סרטון אמיתי של העסק, ולא לסרטון אנכי מהטלפון, שם h3 עם צילום."},{"id":"ft1","name":"פוטר סוגר ענק","cat":"footer","desc":"הפוטר פותח במשפט סגירה גדול, בטלפון ובכפתור אחד, ורק מתחתיהם שורת פרטים דקה והקישורים המשפטיים. מי שהגיע לתחתית הביע עניין, והפוטר מציע לו את הצעד הבא ולא רק רשימה.","when":"ברירת המחדל לאתרי תדמית, סטודיו, שירות מקצועי ומותג. לא לאתר עם עשרים עמודים שצריך מפת אתר מלאה (ft3), ולא לנחיתה (ft6)."},{"id":"ft2","name":"פוטר עסק מקומי: שעות חיות, מפה בלחיצה, Waze","cat":"footer","desc":"כתובת, טלפון, וואטסאפ וכפתור Waze, שעות פתיחה עם חיווי חי (פתוח עכשיו עד 18:00, או סגור ומתי נפתח), ומפה שנטענת רק כשלוחצים עליה. כולל נתונים מובנים LocalBusiness לגוגל.","when":"כל עסק שמגיעים אליו פיזית או שמתקשרים אליו: מרפאה, מסעדה, מוסך, חנות, סטודיו, קבלן. הנתונים המובנים הם חלק מהפוטר, לא תוספת: הם מה שמזין את התוצאות המקומיות בגוגל."},{"id":"ft3","name":"פוטר קלאסי מורחב, אקורדיון במובייל","cat":"footer","desc":"לוגו, משפט וכפתור, ולצידם ארבעה טורים: ניווט, שירותים, יצירת קשר ורשתות. בדסקטופ הכל פתוח. במובייל כל טור הופך לאקורדיון, כדי שהפוטר לא יהיה מסך וחצי של קישורים.","when":"אתרים עם הרבה עמודים: שירות מקצועי, עורכי דין, רשת, מוסד. כשמפת האתר היא חלק מהניווט. לאתר של חמישה עמודים זה יותר מדי, ft1 מתאים יותר."},{"id":"ft4","name":"פוטר עם סוגר שנמס לתוכו","cat":"footer","desc":"הסקשן הסוגר הוא תמונה ברוחב מלא, והתחתית שלה נמסה בדיוק לצבע של הפוטר. אין תפר, אין פאנל מרחף: העין קוראת את הסוגר ואת הפוטר כגוש אחד שסוגר את העמוד.","when":"אתרי תדמית עם צילום חזק: אדריכלות, מלון, מסעדה, נדל״ן, תעשייה. בלי צילום טוב, ft1."},{"id":"ft5","name":"פוטר חנות","cat":"footer","desc":"רצועת ניוזלטר עם הטבה ובדיקת מייל, ומתחתיה מה שקונה מחפש בתחתית חנות: קטגוריות, שירות לקוחות (משלוחים, החזרות, מעקב הזמנה), החברה, ואמצעי התשלום.","when":"כל חנות אונליין, כולל חנויות Shopify שנבנות ב-Lovable (הכיוון העסקי החדש). לא לאתר תדמית: שם ניוזלטר בפוטר הוא רעש."},{"id":"ft6","name":"פוטר נחיתה בשורה אחת","cat":"footer","desc":"שורה אחת ודקה: לוגו, טלפון, הקישורים המשפטיים והקרדיט. בלי ניווט ובלי יציאות, כי כל קישור בדף נחיתה הוא דרך לצאת מהמשפך.","when":"דפי נחיתה, קמפיינים, הרשמה, שיעור ניסיון. זה החריג היחיד לסעיף 29 ברף הסטודיו (פוטר בגובה ההירו): בנחיתה הפוטר קטן בכוונה, והסוגר שמעליו הוא שעושה את העבודה."},{"id":"ft7","name":"פוטר עם טופס ממיר בשני צעדים","cat":"footer","desc":"בראש הפוטר טופס בשני צעדים: קודם בוחרים במה צריך עזרה בלחיצה אחת, ורק אז שם וטלפון, עם תוויות צפות, טלפון שמסתדר לבד, אישור פרטיות וכפתור שעובר לשליחה. אחרי השליחה: מה קורה עכשיו, ווואטסאפ כחלופה.","when":"עסקי שירות שהליד הוא הכל: קבלנים, התקנות, ביטוח, ייעוץ, מרפאות. כשבאתר אין טופס בכל עמוד, הפוטר הוא הטופס. לא לחנות ולא לתיק עבודות."},{"id":"ft8","name":"פוטר עם חתימת מותג","cat":"footer","desc":"סימן המותג, שלם, בשקיפות של כ-6 אחוז, יושב באזור הריק של הפוטר. מעליו משפט קצר, קישורים והפרטים. זו \"חתימת הסגירה\" מתורת הקונספט: הסימן חותם את העמוד בלי לצעוק.","when":"מותג שיש לו סימן חזק (מונוגרמה, סמל): סטודיו, בוטיק, מסעדה, מלון, משרד. בדסקטופ בלבד. לא עם לוגו טקסטואלי ארוך, ולא כשהסימן חלש: אז ft1."},{"id":"ft9","name":"פוטר סניפים ושפות","cat":"footer","desc":"כרטיס לכל סניף: עיר, כתובת, טלפון, שעות בשורה ו-Waze. ולצידם בחירת שפה (עברית, English, Русский) שמסומנת נכון לקוראי מסך.","when":"עסק עם יותר מכתובת אחת: רשת מרפאות, מכונים, סניפים, משרד עם שני סניפים. וכל אתר דו-לשוני או תלת-לשוני, כמו סברדלוב. עם סניף אחד, ft2."},{"id":"ft10","name":"פוטר אמון: דירוג, תקנים ולקוחות","cat":"footer","desc":"שורת אמון בראש הפוטר: דירוג בגוגל עם מספר הביקורות וקישור אליהן, תקנים והסמכות, ולוגואים של לקוחות. מתחתיה הפרטים הרגילים. מי שמתלבט בתחתית העמוד מקבל את ההוכחה האחרונה.","when":"B2B ושירותים שבהם אמון מוכר: שילוט, קבלנות, תעשייה, IT, ביטוח, מעבדות. רק עם נתונים אמיתיים: דירוג אמיתי, הסמכה בתוקף, לקוחות שהסכימו. בלעדיהם ft1."},{"id":"cv1","name":"פס פעולה בטלפון עם בורר ערוצים ושעות חיות","cat":"conv","desc":"פס תחתון לטלפון: כפתור ראשי אחד, ולידו \"דברו איתנו\" שפותח שלושה ערוצים (וואטסאפ, שיחה, מייל) עם זמן התגובה של כל אחד, ושורה חיה שאומרת אם העסק פתוח עכשיו ומתי ייפתח.","when":"עסק שהלידים שלו מגיעים מהטלפון ובכמה ערוצים: שירות מקצועי, קליניקה, קבלן, סטודיו. בנחיתה עם פעולה אחת בלבד עדיף cv2 או b03."},{"id":"cv2","name":"פס פעולה שמשנה את הפעולה לפי המקטע","cat":"conv","desc":"הכפתור בפס התחתון אומר מה הגולש רוצה במקום שבו הוא נמצא: בשירותים \"לבחירת שירות\", בעבודות \"לפרויקט כזה אצלכם\", במחירים \"לבדיקת מחיר מדויק\". המילים מתחלפות בתנועה קצרה, ומעליהן שם המקטע.","when":"דף נחיתה ארוך או וואן-פייג'ר עם מקטעים שונים באופיים (שירותים, עבודות, מחירים, שאלות). באתר שבו כל העמוד מוביל לאותה פעולה, cv1 או b03 מספיקים."},{"id":"cv3","name":"עמוד תודה עם ציר \"מה קורה עכשיו\"","cat":"conv","desc":"סימן וי שמצטייר, תודה עם השם של מי שהשאיר את הפרטים, וציר של שלושה צעדים: קיבלנו (עם השעה), שיחה קצרה (ומאיזה מספר נתקשר), והצעה מסודרת. בסוף שני קישורים לקריאה בינתיים.","when":"כל טופס ליד באתר תדמית או שירות. זו ברירת המחדל לעמוד תודה. כשיש שעות פעילות ברורות, cv4 נותן הבטחה מדויקת יותר; כשנקבעה פגישה, cv5."},{"id":"cv4","name":"עמוד תודה עם זמן חזרה אמיתי","cat":"conv","desc":"במקום \"נחזור בהקדם\", העמוד מחשב מתי באמת: \"נחזור אליכם היום עד 16:30\", \"מחר עד 11:00\", או \"ביום ראשון עד 11:00\", לפי שעות הפעילות וזמן התגובה של העסק. רצועת שבוע מראה את היום, וסמן זז ממנו אל יום החזרה.","when":"עסק עם שעות פעילות קבועות ולידים שמגיעים גם בערב ובסופ\"ש: שירות מקצועי, מרפאה, משרד. זו ההבטחה שמורידה את הלחץ להתקשר לעוד שלושה ספקים באותו ערב."},{"id":"cv5","name":"עמוד תודה עם הכנה לשיחה ותזכורת ביומן","cat":"conv","desc":"כשהטופס קבע פגישה: כרטיס עם היום והשעה, הוספה ליומן בלחיצה (גוגל, או קובץ לאאוטלוק ולאייפון עם תזכורת רבע שעה לפני), ושלושה דברים להכין לשיחה, עם סימון שנשמר ומונה.","when":"כל טופס שקובע שיחה או פגישה: שיחת היכרות, אבחון, ייעוץ ראשוני, תיאום ביקור. לפגישה שלא תואמה עדיין, cv3 או cv4."},{"id":"cv6","name":"404 שמנחש לאן רציתם להגיע","cat":"conv","desc":"העמוד קורא את הכתובת השבורה ומשווה אותה לעמודי האתר: \"התכוונתם לעיצוב מטבחים?\", עם האותיות שתוקנו מסומנות. מתחת חיפוש שמסנן את עמודי האתר תוך כדי הקלדה, עם ניווט במקלדת.","when":"כל אתר עם יותר מעשרה עמודים, ובמיוחד אחרי מעבר מאתר ישן (וורדפרס, וויקס) כשכתובות ישנות עדיין מסתובבות בגוגל ובוואטסאפ."},{"id":"cv7","name":"404 עם שביל חזרה ודיווח על הקישור","cat":"conv","desc":"הכתובת השבורה מתפרקת לשביל: כל חלק שקיים באתר הוא קישור, החלק השבור נמחק בקו שמצטייר ולידו ההצעה הנכונה. מתחת ארבעת העמודים המבוקשים, וכפתור שמדווח לבעל האתר על הקישור השבור ומאיפה הגיעו אליו.","when":"אתר עם היררכיה (שירותים ותתי-שירותים, קטגוריות ומוצרים), שבו מי שנפל באמצע עדיין רוצה את הקטגוריה. הדיווח שימושי במיוחד בחודשים שאחרי העלאת אתר חדש."},{"id":"cv8","name":"שליחה שלא מאבדת אף ליד","cat":"conv","desc":"כשהשליחה נכשלת, הפרטים נשארים (גם אחרי רענון), העמוד מנסה שוב לבד עם ספירה לאחור בטבעת, ומציע לשלוח את אותם פרטים בוואטסאפ בלחיצה. בלי חיבור לאינטרנט הטופס מחכה, ונשלח לבד כשהחיבור חוזר.","when":"כל טופס ליד, ובמיוחד בקמפיינים ממומנים: ליד שנכשל בשליחה הוא כסף ששולם ונעלם, ואיש לא יודע. מתאים ביחד עם b32 (התוויות והאימות) או cv9."},{"id":"cv9","name":"טופס שמתקן בעדינות","cat":"conv","desc":"הטופס לא צועק תוך כדי הקלדה: הוא בודק כשיוצאים מהשדה, ואחרי טעות אחת בודק תוך כדי ומוריד את השגיאה ברגע שהיא מתוקנת. טלפון מסתדר לבד לפורמט, מייל עם טעות בדומיין מקבל \"התכוונתם ל-gmail.com?\", והשגיאות אומרות בדיוק מה חסר (\"חסרה ספרה אחת\").","when":"כל טופס עם טלפון ומייל, ובמיוחד בטלפון, שם טעויות הקלדה הן הכלל. בטופס של שני שדות זה עדיין שווה: הנרמול של הטלפון לבדו חוסך ליד שחוזר עם מספר שגוי."},{"id":"b67","name":"גלולה תחתונה שנפתחת לתפריט","cat":"behavior","desc":"בתחתית המסך גלולה קטנה עם שם הסקשן שבו הגולש נמצא ועם כפתור תפריט. לחיצה מותחת את הגלולה למעלה לכרטיס ניווט, והקישורים עולים לתוכו בזה אחר זה. שם הסקשן מתגלגל כשעוברים סקשן, והגלולה יורדת מהדרך בגלילה למטה וחוזרת בגלילה למעלה.","when":"אתר שרוב הגולשים שלו בטלפון: קליניקה, מסעדה, סטודיו, נותן שירות. התפריט נמצא באזור האגודל במקום בפינה העליונה, והגולש תמיד יודע איפה הוא בעמוד. לא לאתר עם יותר משבעה קישורים ראשיים, ולא כשכבר יש פס פעולה תחתון (cv1): שניהם יתחרו על אותו מקום."},{"id":"g150","name":"אקורדיון שנפתח בגלילה","cat":"gsap","desc":"רשימת שלבים או שירותים לצד תמונה. בגלילה הסקשן ננעל, והשלב הפעיל נפתח: הכותרת שלו מתכהה, התיאור נפתח מתחתיו, פס דק מתמלא לפי ההתקדמות, והתמונה מתחלפת בחשיפה מלמטה. לחיצה על שלב גוללת אליו. בטלפון זה אקורדיון רגיל בלחיצה, עם תמונה בתוך כל שלב.","when":"תהליך עבודה של ארבעה עד חמישה שלבים, או ארבעה שירותים שלכל אחד תמונה משלו: משרד אדריכלים, קבלן שיפוצים, קליניקה, יועץ. עובד כשיש לכל שלב משפט אחד או שניים. לא לשמונה שלבים (הנעילה מתארכת מעבר לתקציב של קצב העמוד), ולא לשאלות נפוצות."},{"id":"b68","name":"רשת נקודות שנדלקת סביב הסמן","cat":"behavior","desc":"רקע של רשת נקודות קטנות בהירו. סביב הסמן הנקודות נדלקות, גדלות, נצבעות בצבע המותג ונדחפות מעט הצידה, ומשאירות אחריהן שובל שדועך. לחיצה או נגיעה שולחת גל שעובר על כל הרשת. בטלפון, ובלי סמן, נקודת אור איטית משוטטת לבד.","when":"הירו של חברת טכנולוגיה, סוכנות, יועץ או מוצר דיגיטלי, שרוצה חיים ברקע בלי וידאו ובלי תמונה. עובד על רקע כהה ועם טקסט קצר. לא לעסק חם וביתי (מרגיש קר), ולא מתחת לפסקה ארוכה: הנקודות הבהירות מתחת למילים פוגעות בקריאה, ולכן יש שכבת כהות מאחורי עמודת הטקסט."},{"id":"b69","name":"ערימת כרטיסים להחלקה","cat":"behavior","desc":"המלצות כערימה של כרטיסים, זה מאחורי זה בעומק. את העליון גוררים הצידה והוא מסתובב עם היד. מעבר לסף הוא עף מהמסך וחוזר לתחתית הערימה, והשאר עולים מקום. חצים, מקלדת ומונה עובדים גם בלי גרירה, והחץ הקודם מחזיר את הכרטיס מאותו צד שאליו עף.","when":"המלצות, כרטיסי צוות, מוצרים דגל או טיפים: חמישה עד שמונה פריטים שכל אחד שווה רגע של תשומת לב. טבעי במיוחד בטלפון, כי זו התנועה שהאגודל כבר מכיר. לא כשצריך להשוות בין פריטים (רואים רק אחד בכל פעם), ולא ליותר משמונה."},{"id":"g151","name":"קרוסלה על קשת","cat":"gsap","desc":"כרטיסי עבודות או מוצרים יושבים על קשת של גלגל גדול, כל אחד מוטה לאורך הקשת. הכרטיס במרכז מורם מעט, והכותרת שלו מתחלפת מתחת לקשת. הגלגל מתקדם לבד בעצירות, נעצר כשמרחפים, נוגעים או מגיעים אליו במקלדת, ונגרר עם תנופה שנוחתת תמיד על כרטיס. לחיצה על כרטיס צדדי מביאה אותו למרכז.","when":"תיק עבודות, קולקציה, תפריט של מסעדה או מוצרים דגל: שבעה עד שנים עשר פריטים שכל אחד מהם בעיקר תמונה. מחליף שורת קרוסלה שטוחה כשהעסק רוצה רגע של תנועה בלי לנעול את הגלילה. לא לפריטים שדורשים השוואה או מחיר ליד כל אחד, ולא לפחות משבעה פריטים (הקשת נראית ריקה)."},{"id":"b70","name":"כפתור שיתוף שנפרש","cat":"behavior","desc":"כפתור \"שתפו\" שבלחיצה נפרש לשורת עיגולים של וואטסאפ, פייסבוק, לינקדאין, X, מייל והעתקת קישור. העיגולים יוצאים מהכפתור בזה אחר זה, והאייקון בכפתור מסתובב לאיקס. בריחוף כל עיגול מתמלא בצבע הרשת שלו ומראה את שמה. העתקת קישור מחליפה את האייקון לוי ומודיעה \"הקישור הועתק\". בטלפון הכפתור פותח את חלון השיתוף של המכשיר.","when":"סוף מאמר, מדריך, מתכון, דף מוצר, אירוע או הצעת עבודה: כל תוכן שהגולש עשוי לשלוח לחבר או לבן זוג. בישראל וואטסאפ ראשון תמיד. לא בדף נחיתה ממומן (מוציא את הגולש מהדף), ולא בכל כרטיס ברשימה (רעש)."},{"id":"css33","name":"טשטוש הדרגתי בקצה","cat":"css","desc":"תוכן שנגלל מתחת להדר דביק או לסרגל פעולה תחתון נמוג בטשטוש הדרגתי: בקצה עצמו הוא ערפל, ובמרחק קטן כבר חד. בלי קו, בלי כיסוי צבעוני, והתמונות והטקסט נשארים אמיתיים עד הסוף. כפתור קטן מאפשר להשוות בין טשטוש, דהייה לבנה רגילה ובלי טיפול.","when":"הדר דביק מעל תמונות וכתבות, סרגל CTA תחתון במובייל (לתיאום פגישה, הזמנה, התקשרות), קצה של רצועת תמונות, תחתית תמונת הירו שנכנסת מתחת לתפריט. אחד לכל קצה ולא יותר משלושה קצוות בעמוד, כי כל קצה הוא שמונה שכבות שהמעבד מצייר מחדש בגלילה."},{"id":"css34","name":"קצה שמתעמעם רק כשיש עוד","cat":"css","desc":"קופסה שנגללת (שורת צ'יפים, טבלת השוואה רחבה, רשימה ארוכה) מעמעמת את הקצה שלה רק בכיוון שבו יש עוד תוכן: בתחילה ההתחלה חדה, ככל שגוללים ההתחלה דוהה בהדרגה, ובקצה האחרון הדהייה בסוף נעלמת. כשהכל נכנס ואין מה לגלול, אין דהייה בכלל.","when":"שורת קטגוריות או תגיות שגולשת בטלפון, טבלת מחירים או השוואה רחבה בתוך עטיפה אופקית, רשימה ארוכה בתוך פאנל בגובה קבוע. בכל מקום שבו חיתוך חד של תוכן נראה כמו באג ולא כמו הזמנה לגלול."},{"id":"css35","name":"תמונה שגולשת בתוך המסגרת בהחלקה","cat":"css","desc":"קרוסלת תמונות נטיבית עם scroll-snap, שבה בכל החלקה התמונה גולשת בתוך המסגרת שלה לאט יותר מהמסגרת, כמו הצצה דרך חלון. התנועה קשורה למיקום הגלילה, בלי JS. יש חצים, גרירה בעכבר, מקלדת, מונה ופס התקדמות.","when":"גלריית עבודות, מוצרים, צוות או מקרי בוחן בתמונות גדולות, כשהתמונה היא הסיפור והגולש מחליק ביד אחת. לא לצילומי מסמכים או תמונות שחשוב לראות כולן בלי חיתוך, ולא יותר מקרוסלה אחת בעמוד."},{"id":"g152","name":"תמונה שנפתחת בתוך הכותרת","cat":"gsap","desc":"כותרת עריכתית שבין שתי מילים שלה יושב פער סגור. כשהכותרת נכנסת למסך נפתחת בפער קפסולת תמונה, והמילים משני צידיה מתרחקות בהחלקה, כך שהמשפט ממשיך להיקרא כשורה אחת עם תמונה בתוכה.","when":"הירו עריכתי או משפט מניפסט באמצע העמוד: סטודיו, קליניקה, מסעדה, כל עסק שיש לו תמונות טובות והמשפט שלו חשוב לא פחות מהן. תמונה אחת או שתיים בכותרת, פעם אחת בעמוד."},{"id":"b71","name":"רשימה שהשורה בה נפתחת לרצועה זורמת","cat":"behavior","desc":"רשימה גדולה של שורות. כשהסמן נכנס לשורה נכנסת אליה מהקצה הקרוב אליו רצועה בצבע המותג, ובתוכה השם של השורה ותמונה קטנה רצים הצידה בלולאה. ביציאה הרצועה יוצאת דרך הקצה הקרוב ליציאה.","when":"אינדקס פרויקטים, רשימת שירותים, תפריט טיפולים, תפריט מסעדה, חלוקה לקטגוריות. ארבע עד שבע שורות, כל שורה היא קישור אמיתי. במסך מגע הרשימה סטטית, עם תמונה בכל שורה."},{"id":"b72","name":"כרטיס שנפתח לחלון פרטים בלי לאבד את המקום","cat":"behavior","desc":"מסילה אופקית של כרטיסי תמונה גבוהים. לחיצה על כרטיס פותחת אותו לחלון פרטים במרכז: התמונה והכותרת עוברות פיזית למקומן בחלון, והטקסט וכפתור הפעולה נכנסים אחריהן. בסגירה החלון חוזר אל הכרטיס שממנו יצא, והמסילה נשארת איפה שהייתה.","when":"תיק עבודות, שירותים, טיפולים, צוות, סיפורי לקוח: בכל מקום שיש חמישה עד שמונה פריטים עם תמונה, ויש מה להוסיף עליהם בלי לשלוח את הגולש לעמוד נפרד. פעם אחת בעמוד, בדרך כלל בסקשן ה\"עבודות\" או ה\"שירותים\". לא כשיש עשרות פריטים (שם צריך גריד וסינון) ולא כשהפרטים הם עמוד שלם (שם הקישור הוא העיקר)."},{"id":"b73","name":"קיר לוגואים שמתחלפים במקום","cat":"behavior","desc":"שורה של שש משבצות לוגו, וכל משבצת מחליפה את הלוגו שלה בעצמה כל כמה שניות: הישן עולה למעלה ונמוג בטשטוש קל, החדש עולה מלמטה ומתחדד. המשבצות לא מתחלפות יחד, ובסך הכל מופיעים 18 לקוחות בשטח של שישה.","when":"רצועת לקוחות בעמוד הבית או בדף שירות, כשיש יותר לקוחות ממה שנכנס בשורה אחת (12 עד 18 לוגואים) והשטח מוגבל. מתחת לכותרת הראשית או לפני הצעת המחיר. לא כשיש עד שישה לקוחות: אז מציגים את כולם, בלי תנועה."},{"id":"b74","name":"מוצר שעף לעגלה עם משוב על הסל","cat":"behavior","desc":"לחיצה על \"הוספה לסל\" שולחת תמונה קטנה של המוצר במסלול קשת עדין אל כפתור הסל. הסל מתנדנד קצרות, המספר שעליו מתגלגל למעלה, והכפתור הופך ל\"נוסף\" עם וי ואז חוזר. הסל נפתח לרשימה קטנה עם הסרה לכל שורה, ומי שלא רואה מכריזים לו מה נוסף.","when":"חנויות והזמנות אונליין: מאפייה, פרחים, אוכל, חנות קטנה. גם \"שמירה לרשימה\" או \"סל הצעת מחיר\" באתר שירות (בחירת שירותים לפני שיחה). לא כשיש מוצר אחד בעמוד, ולא באתר שבו אין עגלה בכלל: ההגעה של התמונה חייבת להיות למקום שנשאר גלוי."},{"id":"b75","name":"מגירה תחתונה שנסגרת בגרירה","cat":"behavior","desc":"בטלפון נפתחת מהתחתית מגירה עם טופס קצר לתיאום שיחה. אוחזים בידית וגוררים למטה: המגירה עוקבת אחרי האצבע בהתנגדות, הרקע מתבהר, והיא נסגרת כשגררו מספיק או כשהפנו אותה במהירות. אחרת היא חוזרת למקומה. בדסקטופ אותו תוכן בחלון במרכז.","when":"פעולה קצרה מהטלפון: תיאום שיחה, שעות פתיחה והגעה, בחירת משלוח, סינון. טופס של שלושה שדות ומטה. לא לטפסים ארוכים (עמוד נפרד טוב מהם), ולא לתפריט ניווט (b66, b67)."},{"id":"b76","name":"תפריט עם פאנל אחד שמחליק בין הפריטים","cat":"behavior","desc":"ארבעה פריטים בתפריט נפתחים לאותו פאנל. במעבר מפריט לפריט הפאנל לא נסגר ונפתח מחדש: החץ שלו מחליק אל הפריט החדש, הפאנל משנה את גודלו לתוכן, והתוכן נכנס מהצד שאליו זז העכבר.","when":"אתר שירותים או סטודיו עם שלושה עד חמישה פריטי תפריט שמסתתרים מאחוריהם קישורים עשירים (שירותים, תחומים, משאבים, אודות). בלי זה, כל פריט פותח חלון משלו ומי שסורק את התפריט רואה הבהוב. לא למגה תפריט אחד גדול (b65), ולא לאתר עם פחות משלושה קישורים בפאנל."},{"id":"g153","name":"ערימת סקשנים שמכבדת סקשן ארוך","cat":"gsap","desc":"ארבעה סקשנים נערמים זה על זה בגלילה. סקשן שגבוה ממסך נגלל עד סופו, נעצר כשהתחתית שלו מגיעה לתחתית המסך, ורק אז נסוג בזמן שהבא עולה מעליו. סקשן קצר פשוט נעצר ונסוג.","when":"תהליך עבודה, שירותים או סיפור שיש בהם סקשן אחד או יותר עם הרבה תוכן בעברית: פסקאות, רשימה, תמונה. בעיקר בטלפון, שבו כמעט כל סקשן גבוה ממסך. ארבעה עד חמישה סקשנים. כשכל הסקשנים נכנסים במסך, g68 או b37 פשוטים יותר."},{"id":"g160","name":"ענן נקודות שמתכנס לגרף","cat":"gsap","desc":"ענן של כאלף ותשע מאות נקודות מסתובב לאט מעל הגרף. כשגוללים, כל נקודה נדלקת בצבע המותג, יוצאת בקשת למקום שלה ומתיישבת בגרף נקודות של פניות לפי שבוע, מהשבוע הראשון ועד האחרון. בשבוע אחד העמודה גבוהה בהרבה מכל השאר, התווית נדלקת מעליה והמספר מגיע לערך הסופי. בלי GSAP העמוד מציג את הגרף המוכן.","when":"נתון אחד עם סיפור: גרף שבו שבוע, חודש או מוצר אחד בולט מכל השאר. סקשן תוצאות או הוכחה באתר של סוכנות, קליניקה או שירות שיש לו מספרים אמיתיים להראות. פעם אחת בעמוד, ורק כשהנתון אמיתי."},{"id":"b77","name":"שדה ריבועים שגל עובר עליו ומנפח את המילה","cat":"behavior","desc":"רשת של כמה אלפי ריבועים קטנים מכסה את הרקע, וגל עגול עובר עליה בלי הפסקה: כל ריבוע מסתובב, מתכווץ ומתבהר לפי המרחק שלו מנקודת המוצא. בתוך המילה הריבועים גדולים יותר ובצבע המותג, ולכן היא נקראת כמו הדפס רשת שהגל מנפח ומרגיע. הסמן מזיז את נקודת המוצא של הגל, ובלי סמן היא נודדת לאט לאורך הקצה.","when":"פתיחה של עמוד עם מילה אחת חזקה: שם המותג, הנושא או המילה שמגדירה את העסק, עד שש אותיות. מתאים לסטודיו, משרד מקצועי או מוצר, ורק פעם אחת בעמוד. לא מתחת לפסקאות ולא בעמוד שכבר יש בו רקע נע."},{"id":"b78","name":"רשת קווים גלית מאחורי כותרת","cat":"behavior","desc":"שישים קווים דקים בדרגת צבע מצבע המותג לצבע הטקסט יוצרים סרט שמתפתל לאורך הסקשן, מתרחב ומצטמצם, ובין הקווים נוצר מוארה. הסרט נע לאט לכיוון הקריאה, הסמן מסיט אותו הצידה, ועל הקו האמצעי רוכבת נקודה קטנה שעוקבת אחרי הסמן. הכותרת יושבת מעליו על שכבת רקע רכה.","when":"רקע של הירו או של סקשן ״מה אנחנו עושים״ עם כותרת קצרה ושורה אחת של הסבר: שירותי נתונים, כספים, תוכנה, ייעוץ. מתאים כשהקו הוא רעיון (תזרים, מסלול, תהליך). לא מתחת לטקסט ארוך ולא ליד טופס."},{"id":"b79","name":"עיגולים שמתמזגים כמו טיפות","cat":"behavior","desc":"עיגולי צבע מקיפים כתם מרכזי, מתמזגים אליו ונפרדים ממנו כמו טיפות נוזל עם גשר דק ביניהם, ועיגול אחד יוצא מהמסלול ועוקב אחרי הסמן. המיזוג נעשה בפילטר SVG אחד (טשטוש ומטריצת צבע שמחדדת את הקצה), לכן אין חישוב צורה: רק מזיזים עיגולים. בתוך הכתם יושב סמל המותג, והוא לא זז.","when":"אלמנט עיצובי ליד כותרת הירו של מותג שהמוצר שלו רך או נוזלי: קוסמטיקה, מזון, משקאות, בריאות, מוצרי תינוקות. מתאים גם למצב טעינה או למסך ריק. לא לאתר של בנק או של חברת ביטוח, ולא כרקע מאחורי פסקה (המיזוג מושך את העין מהטקסט)."},{"id":"css36","name":"כתם שמשנה צורה ומהפך את המילה","cat":"css","desc":"כתם בצבע המותג משנה את קו המתאר שלו לאט, נע ומסתובב מאחורי מילה גדולה, ובכל מקום שהכתם מכסה את האותיות הן מתהפכות לצבע הטקסט שעל המשטח. שני קווי מתאר דקים מהדהדים את הצורה בפאזה אחרת. הכול CSS, בלי JS ובלי SVG.","when":"כותרת הפתיחה של אתר שהמילה היא הנכס שלו: סטודיו, גלריה, מותג בוטיק, אירוע, מרצה. עובד הכי טוב עם מילה אחת קצרה וגדולה. לא לכותרת של משפט שלם ולא לאתר שצריך להרגיש רציני ושקט."},{"id":"g161","name":"קו אות שהופך לדופק וגלים","cat":"gsap","desc":"קו דק וזוהר מתחיל שטוח ועובר בגלילה דרך חמש צורות: דופק חד אחד, גל סינוס, גל מרובע ובסוף חזרה לקו שקט. נקודה עם תווית ערך רוכבת על הקו, קו סף מקווקו חוצה את הדופק, ומתחת לקו מתחלפת כותרת עם הסבר לכל צורה. בלי GSAP העמוד מציג את הקו השקט ואת חמשת ההסברים ברשימה.","when":"שירות שמראה אות לאורך זמן: ניטור אתרים, תחזוקה, אבטחה, בריאות, אנרגיה, תשתיות. הצורה נקבעת לפי הנתון עצמו, ולכל שלב צריכה להיות שורה אמיתית להגיד. לא כאיור כללי של ״טכנולוגיה״ ולא כשאין מה למדוד."},{"id":"g162","name":"פאות שנצמדות לסמל שלד","cat":"gsap","desc":"הסמל מתחיל כשרטוט דק של קווים ונקודות עם גזע קטן אחד. כשגוללים, עשרים וארבע פאות משולשות נכנסות מבחוץ בסיבוב, אחת אחרי השנייה, מהקרובה לגזע ועד הרחוקה, ונצמדות למקום שלהן על השרטוט. השרטוט נמוג, והסמל המלא מקבל נטייה קלה וזוהר. בלי GSAP מוצג הסמל המוכן.","when":"חשיפה של סמל או צורה שמורכבת מחלקים: לוגו של בניין, מפעל, גינון, תוכנה, בנייה. עובד כשיש לסמל מבנה משולשים אמיתי ויש משמעות לכך שהוא ״נבנה״. פעם אחת בעמוד, ליד הכותרת הראשית של העסק."},{"id":"g164","name":"שמש שעולה מאחורי קו האופק","cat":"gsap","desc":"בגלילה עולה שמש מתחת לקו אופק: דיסק רך שגדל מעט, מקבל הילה, שתי טבעות אור וזוהר שמתפשט לאורך הקו. מעליו המילים של הכותרת עולות מתחת לאותו קו, אחת אחרי השנייה, וכל חלק שעדיין מתחת לאופק נחתך. בסוף השמש יושבת על הקו מאחורי כל הכותרת, האור נשפך גם מתחת לקו, ואז נחשפים הסבר וכפתור. בלי GSAP העמוד מציג את המצב הסופי.","when":"הירו של עסק שיש בו משמעות של עלייה, התחלה או אור: אנרגיה סולארית, שירותי בוקר, קפה, יוגה, שחר חדש בעסק, חברת הובלה ללא לילה. כותרת קצרה של שתיים עד ארבע מילים. לא כשהכותרת ארוכה או כשאין קשר בין העסק לרעיון של זריחה."},{"id":"g180","name":"סמן מתוסרט שמפעיל ממשק דוגמה","cat":"gsap","desc":"חלון של מערכת אוטומציה, וסמן קטן עם תווית סטטוס שעובר בו לבד: מדליק שלושה מתגים בזה אחר זה, מקליד שם עסק בשדה, לוחץ על כפתור ההפעלה, ושורת ריבועים בתחתית מתמלאת בכל צעד. הגולש רואה את המוצר עובד לפני שהוא מנסה אותו.","when":"שירות עם ממשק או תהליך אמיתי שאפשר להראות בשלושה עד ארבעה צעדים: הגדרת אוטומציה, קביעת תור, פתיחת חשבון, הזמנה. סקשן ״איך זה עובד״ או הוכחה בעמוד נחיתה, כשהמילים לא מספיקות והגולש צריך לראות כמה זה פשוט. פעם אחת בעמוד ובחלון אחד."},{"id":"g181","name":"שדה שמקליד שאלה ומחזיר תשובה","cat":"gsap","desc":"שדה חיפוש בצורת גלולה שמקליד לבד שאלה אחת עם סמן מהבהב. הכפתור עובר מאפור לצבע המותג ואז לספינר, מסגרת זוהרת סביב השדה מתבהרת ברגע השאלה, ומתחתיו נפתח כרטיס תשובה עם שורות שנכנסות בזו אחר זו. אפשר לראות מה השירות עושה בשתי שניות.","when":"אתר של שירות שעונה לשאלה אחת מוכרת: חיפוש תור פנוי, בדיקת זמינות, הערכת מחיר, בדיקת כתובת. תחילת העמוד או סקשן ״איך זה עובד״. השאלה והתשובה צריכות להיות אמיתיות, כאלה שהשירות באמת נותן, ולא ארוכות מארבע שורות. פעם אחת בעמוד."},{"id":"g182","name":"רשימת שלבים עם שבבי סטטוס שמתחלפים","cat":"gsap","desc":"כרטיס עם חמישה שלבים, ובכל שלב שבב סטטוס: ״ממתין״ באפור, ״בטיפול״ עם ספינר, ״הושלם״ בצבע המותג עם וי שמצטייר. הכרטיס נעוץ במסך והגלילה מקדמת אותו: שלב אחרי שלב הסטטוס מתחלף, פס ההתקדמות מתמלא והמונה למעלה עולה מאפס לחמש. זה תהליך שרואים מתקדם, לא רשימה שקוראים.","when":"תהליך אמיתי של שלושה עד שישה שלבים שיש להם סטטוס: קליטת לקוח, מעבר דירה או משרד, הקמת חשבון, הזמנה עם כמה שלבי טיפול. סקשן ״איך זה עובד״ או ״מה קורה אחרי שמצטרפים״. השלבים והסטטוסים צריכים להיות אמיתיים ובאים בסדר הזה. פעם אחת בעמוד."},{"id":"g183","name":"כרטיס מוצר שנבנה שלב אחר שלב","cat":"gsap","desc":"הודעה קטנה יורדת מלמעלה מטושטשת ומתחדדת, ומתחתיה נבנה כרטיס של דוח שבועי בסדר קבוע: מתג נדלק, מספר הפניות רץ עד 38, שבעה עמודים עולים בזה אחר זה והאחרון בצבע המותג, שורת אישור מציירת וי, והכפתור מתחלף מ״שליחה עכשיו״ ל״נשלח״. כל הדוח מצטייר בתוך שש שניות בערך.","when":"הצגת תוצאה אחת של מוצר או שירות: דוח, אישור, סיכום, התראה. סקשן הוכחה או ״מה מקבלים״ באתר של כלי, מערכת או שירות דיגיטלי. צריך תוצאה אחת ברורה ולא יותר מחמישה רכיבים בכרטיס. פעם אחת בעמוד."},{"id":"g184","name":"מסגרת סימון שננעלת על יעדים","cat":"gsap","desc":"חשבונית של ספק על המסך, וארבע פינות סימון שנוחתות בזו אחר זו על שלושה דברים בה: שם הספק, התאריך והסכום לתשלום. בכל נעילה הפריט עף כשבב אל כרטיס בצד, הכרטיס מקבל מסגרת בצבע המותג והערך מופיע בו. שורת סטטוס מעל הכרטיסים אומרת על מה הסימון נעול. רואים את המערכת קוראת, בלי להסביר.","when":"הדגמה של זיהוי או חילוץ מידע: קריאת חשבונית, תעודה, טופס, חוזה, כרטיס ביקור, תמונה עם כמה פריטים. סקשן ״איך זה עובד״ באתר של כלי, מערכת או שירות שמוציא נתונים ממסמכים. שלושה עד חמישה יעדים, ולכל אחד ערך קצר שאפשר לקרוא. כשאין מה לחלץ, הסימון הוא קישוט בלבד."},{"id":"g185","name":"פריטים נכנסים למעבד ותוצרים יוצאים","cat":"gsap","desc":"ארבעה שבבי קבצים (PDF, DOCX, קישור, TXT) מרחפים בפינות כרטיס, ונמשכים בזה אחר זה אל אזור הגרירה המקווקו שבמרכזו. כשהאחרון נכנס האזור נצבע ונעלם, ובמקומו עולה שורת קובץ אחת: פס ההעלאה מתמלא, והתווית מתחלפת מ״מעלה״ ל״הועלה״ עם וי שמצטייר. ארבעה פריטים נכנסים, תוצאה אחת יוצאת.","when":"שלב העלאה, קליטה או הרשמה: מסמכים לפתיחת תיק, חומרים לאתר, קבצים לשירות שמעבד אותם. סקשן ״מה קורה כשמעלים״ או ״איך מתחילים״. צריך שלושה עד ארבעה סוגי קבצים אמיתיים ותוצאה אחת ברורה שאומרת שהכל נקלט."},{"id":"g186","name":"איור שנבנה צעד אחרי צעד עם מונה","cat":"gsap","desc":"מטבח באיור איזומטרי נבנה שכבה אחר שכבה בזמן הגלילה: קווי מדידה, ריצוף, ארונות תחתונים עם כיריים, ארונות עליונים עם קולט אדים, ולבסוף אי עם שלוש מנורות. לצד האיור כרטיס שלב עם פס שמתמלא ואחוזים שעולים עד 100, ומתחת שורת עיגולים שנסגרת אחד אחד. בסוף נדלקים ניצוצות קטנים. הגלילה היא שעון ההתקדמות.","when":"תהליך של שלושה עד שישה שלבים שבו חפץ אחד מצטבר: מטבח, חדר, תיק, אריזה, תוכנית. סקשן ״איך זה עובד״ באתר של בונה, מעצב, סטודיו או שירות עם מסירה. האיור צריך להיות בנוי משכבות שמתאימות לשלבים. פעם אחת בעמוד, כי הוא תופס כמה מסכי גלילה."},{"id":"g165","name":"ראש הפעלה על סרגל שמחליף כרטיס","cat":"gsap","desc":"כרטיס תצוגה אחד נעוץ במסך, ומתחתיו סרגל עם שנתות וראש הפעלה. כשגוללים הראש נע לאורך הסרגל, ובכל סימן הכרטיס מסתובב עד שהוא נעלם על הקצה, וחוזר עם התוכן הבא. הכיתוב והתווית שעל הסרגל מתחלפים יחד איתו. התוכן אחד, אבל רואים אותו נע בציר זמן.","when":"סקשן שמציג שלושה עד ארבעה סוגי עבודה, חבילות או שלבים מאותו סוג: סוגי פרויקטים של סטודיו, חבילות שירות, שימושים של מוצר. מתאים כשיש משהו להראות בכל אחד (לא רק כותרת), ורוצים שהקורא ירגיש שהוא עובר ביניהם בעצמו. פעם אחת בעמוד, ולא כשיש יותר מחמישה פריטים."},{"id":"b80","name":"פאנל סליידרים שמשנה את התמונה","cat":"behavior","desc":"פאנל זכוכית עם שלושה מחוונים אמיתיים ליד תמונה גדולה. המחוון הראשון בוחר בין ארבעה גוונים של אותו חדר ומערבב ביניהם בהדרגה, השני מכוון את העוצמה, והשלישי מסיט את גוון הזוהר שמאחורי התמונה. הפאנל הוא הסיבה והתמונה התוצאה, ובכניסה למסך המחוונים זזים פעם אחת מעצמם כדי להראות את הקשר, עד שהמבקר נוגע בהם.","when":"אזור שבו המבקר מכוון תוצאה לפני שהוא פונה: גוון תאורה בחדר, גימור של חומר, רמת חבילה, תצוגה מקדימה של עיצוב. מתאים כשיש שניים או שלושה פרמטרים שבאמת משנים את התמונה, ושלוש עד חמש גרסאות מוכנות שלה. לא כשיש רק אפשרות אחת, ולא בעמוד שהכפתור הראשי שלו צריך להישאר במרכז."},{"id":"g166","name":"עורך עם תצוגה חיה בצד","cat":"gsap","desc":"חלון של כלי כתיבה בפרספקטיבה, ובו שני צדדים: בימין הטקסט הגולמי עם סימני העיצוב, ובשמאל איך הוא ייראה. בגלילה השורות נכתבות אות אחר אות, וכל אחת מופיעה בצד השני בצורתה הסופית באותו רגע: כותרת, פסקה, רשימה, תיבת סימון ומשפט מודגש. פס סריקה וצבע רקע קל עוברים בין שני הצדדים ומראים איזו שורה כותבים עכשיו, והחלון מתיישר ככל שהמסמך מתמלא.","when":"סקשן של מוצר או כלי שבו הערך הוא ההתאמה בין מה שכותבים למה שמקבלים: עורך הצעות, בונה טפסים, מערכת תבניות, כלי תיעוד. מתאים למסמך קצר אחד (עד שמונה שורות) שיש לו צורה כתובה וצורה מוצגת. לא כשהקהל לא מכיר כלי כתיבה, ולא כשהטקסט ארוך."},{"id":"g167","name":"תמונה שעוברת מטלפון למחשב","cat":"gsap","desc":"שני מכשירים זה לצד זה: טלפון עם התראה על מסך הנעילה, ומחשב נייד שפתוח בו עמוד הגלריה של האתר, עם מקום ריק לתמונה חדשה. בגלילה התראה נכנסת, התמונה הקטנה שבה מתרוממת מהמסך, עפה בקשת מעל הרווח שבין המכשירים ונוחתת בדיוק בחריץ הריק, ושם היא הופכת לחלק מהעמוד. אחרי הנחיתה הסטטוס בהתראה מתחלף ל\"נשלחה\" ותווית מופיעה בעמוד.","when":"סקשן של איך זה עובד או של חיבור בין שני מקומות: צילום בשטח שעולה לאתר, חומר שנשלח מהלקוח למערכת, הזמנה שעוברת מהטלפון למשרד. מתאים כשיש שני מסכים אמיתיים ותמונה אחת שעוברת ביניהם, והמעבר הוא חלק מהשירות. פעם אחת בעמוד."},{"id":"g168","name":"מצלמה שעפה לאורך עמוד בפרספקטיבה","cat":"gsap","desc":"עמוד אתר שלם מונח לאחור בפרספקטיבה כמו רצפה, והמצלמה גולשת לאורכו: הקצה הקרוב מיטשטש, הקצה הרחוק נמוג, וארבעה סמלי אפליקציה צפים בפינות. בסוף העמוד כולו מתכווץ לפס צר שרואים בו את כל המבנה, ואז חוזר להיות עמוד בית ישר, בדיוק איפה שהתחיל.","when":"סקשן שמציג עמוד אחד שלם, כמו תיק עבודות, אתר שנבנה ללקוח או מוצר: עמוד עם כמה מקטעים ברורים, שמלמד לראות את כל המבנה לפני שנכנסים לפרטים. מתאים לסטודיו, סוכנות או מוצר שהעמוד שלו הוא ההוכחה. לא באתר שמרני, ולא כשהקהל צריך לקרוא מהר. פעם אחת בעמוד."},{"id":"g169","name":"אותו איור עובר בין עונות עם חלקיקים","cat":"gsap","desc":"איור נוף אחד של בית עם חצר, בארבע שכבות מוערמות שמתחלפות בגלילה: אביב בפריחה, קיץ ירוק, סתיו כתום והעצים מתפשטים, חורף עם שדה לבן. מעל האיור חלקיקים שמתחלפים עם העונה, עלי כותרת, אבקה, עלים ושלג, והאור בחלון ואדי הארובה מתחזקים ככל שהיום קצר יותר.","when":"סקשן שמספר סיפור שנמשך לאורך השנה, כמו גינון ותחזוקה, אירוח, אירועים או כל שירות שהעבודה בו חוזרת בכל עונה. מתאים כשצריך להסביר ללקוח שהקשר לא נגמר אחרי הביקור הראשון, וכשיש איור או צילום אחד שאפשר לצבוע מחדש בשלושה או ארבעה מצבים. לא כשהסיפור לא משתנה בין המצבים, ולא באתר שמרני. פעם אחת בעמוד."},{"id":"g170","name":"חלקים שמתכנסים ונעולים למוצר אחד","cat":"gsap","desc":"ארבעה חלקים של מנורת שולחן תלויים בנפרד על רקע כהה עם קווי מהירות חלשים. בגלילה הם מתקרבים זה לזה תוך כדי סיבוב ונעילים בנקודות החיבור, עם הבזק קטן ומילת חותמת. אחרי הנעילה המנורה נדלקת והתצוגה נכנסת אל המוצר המורכב.","when":"קטע שמציג הצעה שמורכבת מחלקים שאפשר לראות ולהצביע עליהם, כמו ערכה, מארז, מערכת מודולרית או חבילת בית. מתאים כשהמסר הוא שהחלקים משתלבים בלי מאמץ, ויש שלושה עד שישה חלקים עם שמות. לא כשיש יותר משמונה חלקים, ולא באתר שקט שהאפקט הזה יהיה חזק מדי בו. פעם אחת בעמוד."},{"id":"g171","name":"מרכז עם שותפים שמשלמים אליו ומספר שעולה","cat":"gsap","desc":"אריח במרכז, וסביבו על שתי טבעות עיגולים עם ראשי תיבות של שותפים, כל אחד מחובר אליו בקו מנוקד. הרשת נבנית, ואז קופצות שורות \"+₪240\" ליד השותפים בזו אחר זו, נקודה קטנה רצה מהשותף אל האריח, והסכום הגדול מתחת עולה בכל הגעה. רואים שהכסף באמת מגיע ממישהו.","when":"תוכנית שותפים, הפניות, אינטגרציות או קהילה: כל מקום שבו יש מרכז אחד וכמה גורמים שמזינים אותו, ואפשר להראות כמה עבר ביניהם. סקשן הוכחה או \"איך זה עובד\" של תוכנית עמלות. פעם אחת בעמוד. מתאים גם לשילוב בעשרה עד עשרים צמתים, לא יותר."},{"id":"g172","name":"גלובוס נקודות עם סיכות, קשתות ומונה","cat":"gsap","desc":"גלובוס עשוי נקודות מסתובב לאט, בתנועה מימין לשמאל. בכניסה לעמוד הוא מסתובב אל מקום המנוחה, וממרכז אחד יוצאות קשתות אל ערים בעולם. כל קשת שמגיעה מקפיצה סיכה עם שם העיר ומספר, והמספר הגדול לידו עולה עם כל הגעה. הסיכות מתחלפות כשהכדור ממשיך להסתובב.","when":"סקשן שמראה היקף: מדינות, לקוחות, משלוחים, סניפים או שותפים בעולם. מתאים לעסק שמוכר או שולח מחוץ לישראל, לשירות שעובד מרחוק ולחברה עם כמה נקודות פעילות. עמוד אחד, פעם אחת. אם יש רק שתי ערים או שהיעדים כולם באזור אחד, מפה שטוחה תעבוד טוב יותר."},{"id":"g173","name":"שלושה כרטיסים מחוברים בקו שנחתך ומתוקן","cat":"gsap","desc":"שלושה חלונות קטנים בשורה, כל אחד מייצג מערכת. בין הראשון לשני עובר קו מקווקו עם סימן X כהה באמצע, ונקודה שרצה אליו נעצרת ונסוגה: המערכות לא מדברות. הסימן מתכווץ, הקו נצבע ונמתח עד הסוף, הנקודה עוברת בו, ובאמצעו מופיע וי. אותו דבר קורה בין השני לשלישי, וסימוני המצב בכרטיסים מתחלפים מ\"ממתין\" לתוצאה.","when":"סקשן על אינטגרציות, חיבור בין מערכות או תהליך שמתחיל במקום אחד ונגמר במקום אחר: חנות והנהלת חשבונות, טופס ו-CRM, הזמנה ומחסן. מתאים לשירות שמחבר מערכות ללקוח. שלושה כרטיסים לכל היותר, וכל קו במצב אחד. כשיש יותר מכך עדיף להראות דיאגרמה שלמה."},{"id":"g174","name":"פנייה שעוברת מאדם לאדם כשהזמן נגמר","cat":"gsap","desc":"שלושה אנשים בשורה, ומעל כל אחד קשת מקווקוות אל הבא אחריו. עיגול קטן עם מעטפה, הפנייה, נוחת אצל הראשון, ופס הזמן שלו מתרוקן. כשהוא נגמר נכתב \"לא ענתה\", והעיגול דוהר על הקשת אל השני ומשאיר אחריו קו צבוע. אצל השלישי הפס עוצר באמצע, המעטפה הופכת לוי, וכתוב שענתה תוך שלוש דקות.","when":"סקשן שמראה שירות, תור או אחריות: מוקד פניות, רופא תורן, צוות מכירות, אישור בשרשרת, או כל מקום שבו דבר עובר מיד ליד לפי זמן. מתאים כשההבטחה היא שמישהו תמיד יענה. שלושה אנשים ושתי העברות לכל היותר. כשאין מגבלת זמן אמיתית עדיף להראות תהליך רגיל בשלבים."},{"id":"g175","name":"דיאגרמת מערכת שנבנית על רשת","cat":"gsap","desc":"על רקע רשת שרטוט נבנית דיאגרמה של עץ: קופסה אחת מימין, ממנה יוצאים קווים בזוויות ישרות אל שלוש קופסאות, ומכל אחת קו ישר אל כלי בקצה. הקווים מצטיירים בזה אחר זה, הקופסאות נפתחות כשהקו מגיע אליהן, ואחרי שהכול נבנה נקודות מאירות ממשיכות לרוץ לאורך המסלולים, מהשורש עד העלים.","when":"סקשן שמסביר איך השירות מחובר מבפנים: אתר שמזין יומן ותשלום, מוצר שמתחבר לכמה מערכות, תהליך עבודה שמתפצל לשלושה ענפים. מתאים לעסק שמוכר חיבור בין מערכות, ולמי שרוצה להראות סדר ולא רק לספר עליו. שורש אחד, שלושה ענפים ושלושה עלים. יותר מזה הופך לתרשים שאי אפשר לקרוא."},{"id":"g176","name":"איור שמצטייר, נצבע ומקבל הערות","cat":"gsap","desc":"איור קווי של צמח עם שורשים באדמה, ענן וטיפות מצטייר קו אחרי קו כמו ביד, כשהגלילה מזיזה אותו. כשהקווים נגמרים הצבע נכנס לעלים, לעלי הכותרת ולאדמה, ואז צצות ארבע הערות קצרות ליד החלקים, וכל מילה בשורת הכיתוב למטה נדלקת בתורה עד שהמשפט מלא.","when":"סקשן הסבר שמלמד רעיון אחד דרך תמונה: איך תוכן מצטבר לפניות, איך לקוח קטן הופך לקבוע, איך תהליך מתחיל בבסיס ונגמר בתוצאה. מתאים כשיש משפט אחד שאפשר להמחיש בציור פשוט, וארבע הערות לכל היותר. איור שצריך שמונה הערות כבר מתאים יותר לדיאגרמה."},{"id":"g179","name":"מכ\"ם שמגלה צמתים ומסמן אחד","cat":"gsap","desc":"נקודה אחת במרכז נפתחת לארבע טבעות, ומסביב מתפזרות נקודות קטנות. אחר כך קונוס שקוף מסתובב סביב המרכז כמו מחוג מכ\"ם, וכל אדם שהוא עובר עליו נדלק, מקבל גל קטן ותווית עם שם ותחום. בסוף נבחר אחד מהם, הנקודה שלו מוקפת בטבעת, והוא עף החוצה וגדל לכרטיס עם הסיבה שנבחר.","when":"סקשן על גילוי, סריקה או ניטור: לידים שמחכים לשיחה, פניות שדורשות מענה, לקוחות בסיכון, מקורות חדשים לקידום. מתאים כשיש בין שמונה לשתים עשרה תוויות אמיתיות ותוצאה אחת ברורה שצריך להציג כיעד. סריקה בלי תוצאה נבחרת מרגישה כמו קישוט."},{"id":"g187","name":"מילה ענקית שנכנסת במריחה ומתחדדת","cat":"gsap","desc":"מילה ענקית אחת נכנסת מהצד במריחת תנועה, מתחדדת בזמן שהיא מאטה ונעצרת, ובצבע המותג היא מסתיימת בנקודה. המשפט שלה עולה מתחתיה, ואז המילה נמרחת החוצה והבאה נכנסת. בכל רגע על המסך מילה אחת וברורה.","when":"תהליך עבודה, עקרונות או שלבי טיפול של ארבעה עד שישה צעדים, ולכל אחד מילה אחת חזקה ומשפט אחד. סקשן אחד בעמוד, באתר שמרשה לעצמו דרמה. פחות מתאים למילים ארוכות או כשיש הרבה טקסט בכל שלב."},{"id":"g188","name":"אריחי תמונה שנכנסים בטשטוש לרשת מסודרת","cat":"gsap","desc":"שמונה אריחי צילום עפים פנימה מקצות המסך בטשטוש אופקי, שורה אחת מימין ושורה אחת משמאל, ונעצרים ברשת מסודרת. בזמן הגלילה רואים את האריחים מתחדדים ומתיישבים במקום, כמו לוח השראה שמתמלא.","when":"תיק עבודות, גלריית מוצרים או חומרי השראה של סטודיו: שישה עד תשעה צילומים אמיתיים של העבודה. פעם אחת בעמוד, כדי שהרשת תגיע כמסקנה ולא כקישוט. עובד גם באתר שקט, כי הכול נגמר בסדר נקי."},{"id":"css37","name":"שורות מילים בקו מתאר מאחורי הכותרת","cat":"css","desc":"חמש שורות של מילות השירות בקו מתאר דק זורמות באיטיות, כל שורה בכיוון ובקצב אחר, מאחורי כותרת מלאה וכבדה. הכותרת נשארת הדבר הברור בעמוד, והרקע אומר את אותו דבר שוב ושוב כמו טקסטורה.","when":"הירו או פתיח של סטודיו, משרד או מותג שיש לו מילה או שתיים שמגדירות אותו: תכנון, עיצוב, ליווי. הטקסטורה מעשירה עמוד שיש בו מעט תמונות. מחוץ להירו עדיף לוותר, כי שורות זזות ליד פסקאות מפריעות לקריאה."},{"id":"b81","name":"טבעת מילים תלת ממדית שמסתובבת סביב נקודה","cat":"behavior","desc":"שירותי העסק כתובים על טבעת מוטה בתלת ממד, והיא מסתובבת לאט סביב נקודה בצבע המותג. הצד הקרוב בהיר וגדול, הצד הרחוק עמום והפוך. במחשב הטבעת נוטה מעט אחרי העכבר.","when":"הירו או סקשן שירותים של עסק עם חמישה עד שמונה שירותים קצרים של מילה או שתיים: מיתוג, אתרים, צילום. מהלך חתימה אחד בעמוד. פחות מתאים כשצריך לקרוא כל שירות בנחת, כי רק הצד הקרוב קריא בכל רגע."},{"id":"g189","name":"משפט שנשען על חבל וקורה כמו מבנה","cat":"gsap","desc":"חבל דק בצבע המותג נמתח מקצה לקצה, וכל מילה שנוחתת עליו מכופפת אותו, עד שמילה כבדה אחת תלויה ממנו בשני חוטים. בצדדים עולים עמודים של טקסט, הקורה נמתחת ישר והמילה הכבדה עולה איתה, ומילות הסיום נוחתות על הקורה. המשפט בנוי כמו מבנה שמחזיק משקל.","when":"משפט תזה אחד של שלוש או ארבע מילות מפתח, כשיש בו מילה אחת כבדה שהכול נשען עליה: אפיון, אחריות, ניסיון. סקשן אחד בעמוד תדמית של סטודיו או משרד שרוצה לדבר כמו אדריכלים. לא מתאים למשפט ארוך, כי המילים צריכות להתיישב על החבל."},{"id":"g190","name":"מילה שמתחלפת ומביאה איתה כרטיס ורקע","cat":"gsap","desc":"משפט קבוע שנגמר בכפתור מילה: אתר, לוגו, קמפיין, מצגת. בכל גלילה המילה מתחלפת, הרקע עובר לצבע אחר, וכרטיס תואם נכנס לידה: אתר בדפדפן, לוגו על כרטיס, מודעה, שקף. כך רואים בדיוק מה העסק מקבל, ולא רק קוראים.","when":"סטודיו, מוצר או שירות שמייצר כמה סוגי תוצרים (ארבעה עד שישה), ורוצים להראות את כולם בלי רשימה. סקשן הירו או הסבר אחד בעמוד. מתאים כשלכל תוצר יש איור פשוט וברור. פחות מתאים כשהתוצרים דומים זה לזה."},{"id":"g191","name":"מסכים מקוננים שמתקרבים פנימה","cat":"gsap","desc":"חלון הזמנת תור שבתוכו, בצד, מסך קטן שהוא השלב הבא, ובתוכו עוד אחד, ועוד אחד. הגלילה מקרבת את המצלמה פנימה: המסך הקטן גדל עד שהוא ממלא את החלון והופך לשלב הבא, וכך ארבע פעמים, עד לאישור התור. מסך אחד, ארבעה שלבים, בלי חיתוך.","when":"תהליך של שלושה עד חמישה שלבים שרוצים להראות כרצף אחד: הזמנת תור, הרשמה, קניית חבילה, קליטת לקוח. סקשן אחד בעמוד שירות או תהליך. מתאים כשכל שלב הוא מסך אמיתי שאפשר לצייר בפשטות. לא מתאים כשיש הרבה טקסט בכל שלב, כי המסכים הפנימיים קטנים מאוד עד שהם מגיעים אליך."},{"id":"g192","name":"שני גרפים שמונעים על ידי פרמטר אחד","cat":"gsap","desc":"הכמות עולה בגלילה, וסמן אחד נע על שני גרפים בו זמנית: בראשון המחיר ליחידה צונח, בשני המחיר הכולל עולה. שלושה מספרים מתעדכנים מעל הגרפים, ושורות הטבלה למטה נדלקות כשהסמן עובר עליהן. מי שגולל מבין למה הכמות הגדולה משתלמת בלי שאף אחד הסביר.","when":"הסבר תמחור, ריביות, חיסכון או כל קשר בין כמות לעלות. סקשן אחד בעמוד מחירים או מאמר. מתאים כשיש נוסחה אחת פשוטה ושני גדלים שנגזרים ממנה. לא מתאים לנתונים אמיתיים מרובים, כי הגרף כאן הוא עקומה מחושבת."},{"id":"g193","name":"שני מונים במירוץ בזמנים שונים","cat":"gsap","desc":"שתי שעוני עצר זו לצד זו, והמהירה מסתיימת אחרי שנייה אחת עם תג סיום ועלות קטנה, בזמן שהאיטית ממשיכה לספור והעלות שלה ממשיכה לגדול. ההבדל בין ארבע דקות לעשרים ואחת דקות נראה בעין לפני שמישהו קרא מילה.","when":"השוואה בין שתי דרכים לעשות אותו דבר, אנחנו מול הדרך הישנה: תבנית מול מאפס, אוטומציה מול ידני. סקשן אחד בעמוד שירות או מחיר. מתאים כשיש שני זמנים ושני מחירים ברורים. לא מתאים להשוואה של יותר משתי אפשרויות."},{"id":"g194","name":"אריחי בנטו שכל אחד מנגן הדגמה","cat":"gsap","desc":"שישה אריחים בגריד בנטו, וכל אחד מנגן הדגמה קטנה משלו כשהגריד נכנס למסך: קו גרף נמשך עד נקודה בקצהו והאחוז שלידו סופר, טבעת מתמלאת, עמודות עולות, מתג מחליק למצב פעיל, וי נרשם ולחצן הפעלה נלחץ. האריחים קופצים פנימה בזה אחר זה, וההדגמות מתחילות מיד אחריהם.","when":"סקשן יתרונות או תוצאות שיש בו כמה דברים קטנים להראות, ולא משפט אחד להסביר: מערכת, אפליקציה, סטודיו עם כמה שירותים, כלי ניהול. כל אריח מראה דבר אמיתי אחד במקום לתאר אותו. פעם אחת בעמוד, וכשיש חמישה עד שישה דברים שאפשר להראות בתנועה קצרה."},{"id":"g195","name":"מחיר לפי פריט מול מסלול קבוע","cat":"gsap","desc":"שני לוחות זה לצד זה. בלוח הראשון רשימת פריטים במחיר לכל אחד, והשורות מתווספות בגלילה, ארבע ואז תשע, כשהסכום למטה מטפס וסרגל הסכום מתארך. בלוח השני מסלול חודשי קבוע במחיר שלא זז, עם משפט שסופר את אותם פריטים ושבב חיסכון שמופיע ברגע שהרשימה עוברת את המסלול. רואים את המחיר מתנפח ליד מחיר שנשאר במקום.","when":"עמוד מחירים של שירות שנמכר גם לפי יחידה וגם כחבילה חודשית: עיצוב פוסטים, צילום, תיקונים, הדרכות, משלוחים. מראה במקום להסביר למה כדאי לעבור למסלול, ועובד כשהמחיר ליחידה והמחיר הקבוע אמיתיים ומוצגים באותו מבנה. פעם אחת בעמוד, ליד הכפתור שמזמין לבחור מסלול."},{"id":"g196","name":"נקודות שנופלות ונערמות להיסטוגרמה","cat":"gsap","desc":"מאות נקודות נופלות מלמעלה ונערמות לעמודות של היסטוגרמה, עמודה אחרי עמודה, והמספר לידן סופר כל נקודה שנוחתת. בסוף מתמלא פס מוצל עד קו אנכי שיורד לאורך הצד, ועליו התווית של החציון. נקודות הצד המהיר בצבע המותג והשאר באפור, וההתפלגות נראית כמו צורה ולא כמו טבלה.","when":"סיפור נתונים בסקשן הוכחה או אודות: זמני מענה ללקוחות, זמני משלוח, גודל הזמנות, מחירים של עבודות קודמות. מתאים כשיש התפלגות אמיתית ויש חציון או נתון אחד שרוצים להדגיש, ולא ממוצע חד-ספרתי שלא מספר כלום. פעם אחת בעמוד."},{"id":"b82","name":"כרטיס הולוגרפי עם פסי נתונים","cat":"behavior","desc":"כרטיס חבר צוות במסגרת מוזהבת, והעיצוב מעליו מבריק כמו כרטיס אספנות: שכבת צבעי קשת נעה על פני הכרטיס ומשנה גוון בהתאם לנטייה, והכרטיס עצמו נוטה אחרי העכבר עם הברקה שעוקבת אחריו. כשהכרטיס נכנס למסך שלושה פסי נתונים מתמלאים עד 98, 100 ו-99. במגע הכרטיס מתנדנד לאט מעצמו.","when":"כרטיס צוות, כרטיס עדות מרכזי, הגשת נותן שירות מוביל או מוצר אחד שרוצים שירגיש מיוחד. רק כשיש מה להראות בנתונים (שביעות רצון, ותק, פרויקטים), ורק על כרטיס אחד או שניים בעמוד, כי ברק על כל כרטיס מבטל את האפקט. לא בעמוד רשמי של משרד או קליניקה."},{"id":"g197","name":"צביר כרטיסים צף וכרטיס חדש קופץ","cat":"gsap","desc":"בהתחלה שני כרטיסי פנייה מונחים נטויים על הבמה, והמספר שלידם הוא 2. בגלילה כרטיסים חדשים נכנסים אחד אחרי השני, כל אחד עם תג קטן שנדלק ונכבה, והמספר סופר איתם עד 10. אחר כך הערימה המפוזרת מתהדקת למניפה צפופה, כל כרטיס מוזז מעט מקודמו, והחדש ביותר יושב למעלה.","when":"סקשן שמראה נפח של עבודה: פניות שנכנסות לאתר, הזמנות, לקוחות חדשים, קריאות שירות או מועמדים למשרה. מתאים כשיש ספירה אמיתית ואותו סוג פריט שחוזר, ורוצים שהמספר ירגיש כמו ערימה ולא כמו ספרה. פעם אחת בעמוד, ליד כותרת שאומרת מה סופרים. לא כשיש פריט אחד בלבד או כשכל הכרטיסים שונים זה מזה."},{"id":"g198","name":"קיר כרטיסים שמתעקל לגליל","cat":"gsap","desc":"קיר שטוח של שלושים ושניים כרטיסי וידאו אנכיים מתעקל בגלילה לגליל חצי עגול שפונה אל הגולש, עם השתקפות רכה מתחתיו. אחר כך הגליל מסתובב סביב עצמו סיבוב שלם, ובאמצע, כשהוא הכי מהיר, הפרצופים נמרחים ללהקה מטושטשת וחוזרים לחדות.","when":"סקשן עדויות או סרטוני לקוחות כשיש הרבה סרטונים אנכיים קצרים (בין שתים עשרה לשלושים ושניים) ורוצים שהקיר ירגיש כמו גלריה שמסתובבת סביב הגולש. מתאים גם לגלריית עבודות או לצוות גדול. פעם אחת בעמוד, ורק עם תמונות שמחזיקות גם כשהן קטנות ומוטות. במסך צר זה גריד רגיל."},{"id":"g199","name":"דמות חתוכה מול רקעים מתחלפים","cat":"gsap","desc":"דמות חתוכה עומדת במקום במרכז הבמה, והעולם שמאחוריה מתחלף בגלילה: שמיים עם שמש, פודיום עם קרני אור, נקודות של קומיקס, קווי מהירות ורדיד מבריק. כל חילוף הוא חיתוך נקי שנפתח מימין לשמאל, עם מילה גדולה חדשה שעולה מאחורי הדמות ושכבת עיטור משלה, והרשימה שלצד הבמה מדגישה את התחום הפעיל.","when":"סקשן שירותים או אודות שבו אדם אחד (בעל העסק, מרצה, יועץ) מייצג כמה כיוונים. הדמות היא הקבוע והרקע הוא הרעיון, וכך אפשר להראות חמישה תחומים בלי חמש תמונות. פעם אחת בעמוד, עם תמונה חתוכה באיכות טובה. לא כשהדמות אינה חלק מהמותג."},{"id":"g201","name":"טבעת תמונות שנפתחת לשדה מפוזר","cat":"gsap","desc":"כשישים אריחי תמונה יושבים בטבעת צפופה סביב כרטיס מט עם משפט, ובגלילה הטבעת נפתחת: האריחים נודדים החוצה במעגל, כל אחד לפי הסדר שלו, ונוחתים בשדה רחב עם גודל, סיבוב ועומק מטושטש שונים. המשפט שבאמצע נבנה מילה אחר מילה בזמן הפתיחה, ובגלילה לאחור הכול חוזר לטבעת.","when":"סקשן הוכחה חברתית או עבודות: לוגואים של לקוחות, תמונות מתיק העבודות, סרטונים קצרים או צוות קהילה, כשיש ארבעים עד שישים פריטים ומשפט אחד שמסכם אותם. מתאים להעביר מסר של היקף: הרבה עסקים, הרבה פרויקטים. פעם אחת בעמוד, עם תמונות שנראות טוב גם כשהן קטנות ומטושטשות."},{"id":"g227","name":"סמל שנפתח כמניפה ונעצר על הלוגו","cat":"gsap","desc":"שישה עלים גדולים ושישה קטנים מונחים זה על זה כשהם מקופלים, ונפתחים כמניפה תוך כדי סיבוב עד שהם יוצרים סמל. אחרי שהסמל נעצר השם נחשף לידו מימין לשמאל והשורה התחתונה עולה מתחתיו. בסוף נשאר לוגו רגוע ושלם. כשהסקשן חוזר למסך, הכניסה רצה שוב.","when":"פתיחה של אתר או עמוד נחיתה, סיום של סרטון, או הלוגו בראש עמוד האודות. מתאים למותג שהסמל שלו בנוי מחזרה על אותה צורה (עלים, קרניים, טבעות). פעם אחת בעמוד. לא כמסך טעינה שמעכב את התוכן."},{"id":"g228","name":"שם מותג שמתחדד מטשטוש תנועה וטבעת שעוברת עליו","cat":"gsap","desc":"השם נכנס מטושטש לרוחב, כאילו הוא עובר מהר מדי לעין, ומתחדד לאותיות חדות בזמן שטבעת דקה עם זוהר חולפת מעליו מימין לשמאל. אחרי שהטבעת יוצאת, השורה התחתונה עולה, והשם נשאר חד. הטשטוש כיווני: רק אופקי, בלי רפרוף אנכי.","when":"פתיחה של עמוד נחיתה למותג עם שם קצר וחזק, מסך תודה, או כותרת של קמפיין. עובד כשהשם הוא הנכס עצמו ואין סמל נפרד. פעם אחת בעמוד, ולא על כותרות רגילות (לשם יש את css05 ו-css30)."},{"id":"g229","name":"לוגו שמתכווץ לאריח והשם נכתב לידו","cat":"gsap","desc":"אות המותג מופיעה גדולה במרכז על אריח צבעוני, מתכווצת ונעה לפינת השורה כמו אייקון של אפליקציה, ואז השם נכתב לידה בצעדים עם סמן מהבהב. בסוף הסמן נעלם והשורה התחתונה עולה. השם עצמו הוא טקסט אחד, לא אותיות נפרדות.","when":"מוצר דיגיטלי, אפליקציה, מערכת הזמנות או כל מותג שיש לו אייקון. פתיחה של הירו, מסך תודה או כותרת ברכה. עובד כשהאייקון והשם הם שני חלקים של אותו לוגו. פעם אחת בעמוד."},{"id":"g230","name":"נקודה שנמתחת לקו, למישור ולכרטיס בפרספקטיבה","cat":"gsap","desc":"נקודה אחת עם טבעת שמתרחבת סביבה נמתחת לקו דק, הקו מתרחב למישור, והמישור נשכב בפרספקטיבה כשהמילה שעליו מחליקה לאורך המשטח המשופע ונשארת נטויה יחד איתו. הכול בקצב הגלילה: גוללים קדימה והצורה מתפתחת, גוללים אחורה והיא חוזרת לנקודה. ליד הצורה יושבים כותרת ופסקה שנשארות במקומן.","when":"פתיחה של סקשן שמסביר שיטת עבודה או תהליך: תכנון, אפיון, בנייה. הצורה אומרת שמתחילים מדבר קטן ובונים ממנו. מתאים לסטודיו, משרד הנדסה, ייעוץ או כל שירות שיש לו שיטה. פעם אחת בעמוד, בפתיחת החלק של דרך העבודה."},{"id":"b88","name":"גל קול שמתמלא עם הנגן","cat":"behavior","desc":"כרטיס הקלטה עם תמונת הדוברת, שם ושורת פתיחה, ומתחתיה גל קול של חמישים ושישה עמודים דקים. כשלוחצים על ההפעלה, העמודים מתמלאים בצבע המותג בקצב ההקלטה, העמודים סביב נקודת ההשמעה פועמים, מונה הזמן רץ וקו ההתקדמות נמלא. אפשר ללחוץ או לגרור על הגל כדי לקפוץ, ובמקלדת עם החצים. מתחת מופיע תמלול קצר.","when":"פודקאסט, דוגמית קול, הקלטה של לקוח מרוצה, הודעה קולית של בעל העסק או ציטוט מוקלט. עובד כשיש הקלטה קצרה אמיתית (עד חצי דקה), כי הגל הוא ההבטחה שיש מה לשמוע. לא כקישוט בלי שמע."},{"id":"b89","name":"פסי דיתר ונקודות הלפטון שנושמות מאחורי נתונים","cat":"behavior","desc":"פס כהה במרכז הסקשן ומעליו ומתחתיו פסי דיתר שמתדללים מכהה לבהיר בריבועים קטנים, כמו הדפס. בתוך הפס נקודות הלפטון בגדלים משתנים מרכיבות כתמים רכים בפינות ומאחורי כל נתון, ונושמות לאט. הכותרת והנתונים נשארים קריאים מעל, והעמוד מקבל גרגר ותחושה של נייר מודפס.","when":"סקשן נתונים, ״מי אנחנו״ או מפריד בין חלקי עמוד, באתר שיש בו הרבה משטחים חלקים ורוצים בו גרגר. מתאים למשרדי הנדסה, הוצאות לאור, סטודיו, מותגי מזון ואמנות. לא מתחת לטקסט ארוך, ולא יותר מפעם אחת בעמוד."},{"id":"b90","name":"גשם בלילה וקרן פנס שסורקת אותו","cat":"behavior","desc":"סצנה כהה עם גשם דק שנוטה הצידה, וקרן פנס רחבה שיוצאת מהפינה העליונה וסורקת לאט את הסצנה הלוך וחזור. הטיפות שבתוך הקרן נדלקות ובולטות, והטיפות שמחוצה לה כמעט נעלמות בחושך. הכותרת והכפתור יושבים בתחתית, רחוק מהזוהר, ונשארים קריאים.","when":"פתיחה של עסק שקשור לשמירה על דבר יקר: אבטחה, מצלמות, חשמל, ביטוח, שירותי חירום, שעות לילה. הסצנה אומרת שמישהו ער ושומר. מתאים כהירו כהה, או כסקשן ״למה אנחנו״ שמתחיל באווירה. לא לעסק שהמותג שלו קליל וצבעוני."},{"id":"b91","name":"סבך עקומות זוהרות שנשרטט ונמוג","cat":"behavior","desc":"לוח כהה עם קופסת טקסט בצד ומולה סבך של שישה חוטי אור בצבע המותג: ליבה בהירה, הילה סגולה סביבה, ועל הרקע הכהה זה זוהר באמת. החוטים נשרטטים אחד אחרי השני, ובראש כל חוט נקודת אור שמובילה אותו. אחרי שהסבך שלם הוא נע לאט והצורה משתנה, ואז הוא נמוג והמחזור מתחיל שוב. בקצוות הסבך מתפוגג לתוך הרקע בלי מסגרת, ובנקודות שהחוטים נחתכים האור מצטבר לצמתים בוהקים. בלי JS רואים את אותו סבך כשרטוט קבוע. כפתור קטן משהה את התנועה.","when":"עסק שמחבר דברים: אינטגרציות, תוכנה, תקשורת, רשתות, ייעוץ שמקשר בין גורמים. הסבך אומר שיש הרבה חלקים שמסתדרים. מתאים כסקשן ״איך זה עובד״ או כהירו של חברת טכנולוגיה. לא לעסק שמבקש שקט וניקיון."},{"id":"g258","name":"אייקון שנופל, נמעך וקופץ עד שהוא נרגע","cat":"gsap","desc":"אייקון הסל נופל מלמעלה ומתארך בנפילה, נמעך לרגע כשהוא פוגע ברצפה, ואז קופץ שלוש פעמים בקשתות שהולכות וקטנות, עד שהוא נרגע במרכז. מאחוריו נשאר שובל של עיגולים ריקים שדועכים, ובכל נחיתה נרשמת קשת של נקודות. הצל שמתחתיו מצטמצם כשהאייקון באוויר. הריחוף על הכרטיס מפעיל את זה מחדש.","when":"מצב ריק או הודעת סיום שצריכים קצת חיים: סל קניות ריק, תיבת הודעות נקייה, תוצאות חיפוש בלי תוצאות, דף תודה. מתאים לאתר חנות או שירות שמרשה לעצמו נימה ידידותית. תנועה אחת, באלמנט אחד, שנרגעת מהר."},{"id":"g259","name":"נקודות בזווית הזהב שמתמלאות לדיסק בגלילה","cat":"gsap","desc":"הסקשן נעוץ במסך, ובזמן הגלילה 144 נקודות נוחתות אחת אחרי השנייה על ספירלה: כל נקודה מסתובבת 137.5 מעלות מהקודמת, ולכן הן מתפזרות לדיסק צפוף ושווה כמו לב של חמנייה. הצבע עובר ממרכז הדיסק החוצה, והדיסק כולו מתיישר לאט תוך כדי המילוי. מספר גדול בצד סופר את הנקודות שכבר נחתו, ומתחת לדיסק שורת הסבר קצרה על הזווית.","when":"סקשן שמראה כמה: לקוחות, חברי קהילה, פרויקטים, משתתפים, מתנדבים. כל נקודה היא יחידה אחת, ולכן המספר בין 60 ל-200. לא למספרים קטנים (פחות מ-40 נקודות נראות כמו פיזור), ולא כשחשוב לראות כל יחידה כפרצוף או כלוגו."},{"id":"css41","name":"צל עלים שמתנדנד על קיר ועל מסגרת","cat":"css","desc":"על קיר חלק תלוי הדפס ממוסגר, ומעליו נופל צל של ענפים עם עלים, כאילו שמש עוברת דרך עץ ליד חלון. הצל מטושטש, מכסה גם את הקיר וגם את ההדפס, ומתנדנד לאט סביב פינה אחת, כמו ענף ברוח קלה. שתי שכבות של עלים בגדלים שונים נעות במהירויות שונות, כך שהצל אף פעם לא חוזר על עצמו בדיוק. הכול CSS, בלי JS.","when":"תמונת מוצר או הדפס יחיד על רקע חלק: חנות לאמנות, מסגרות, אביזרי בית, נרות, צמחים, קרמיקה, מלון בוטיק. מוסיף חיים לתמונה סטטית בלי להסיח את העין ממנה. לא על תמונה עמוסה או צבעונית מאוד, ולא כשיש כמה מוצרים באותו קיר."},{"id":"g260","name":"דגם אריגה שמצייר את עצמו קו אחר קו","cat":"gsap","desc":"בזמן הגלילה סריג יהלומים מצייר את עצמו על משטח כהה: קודם האלכסונים העולים נמשכים מהצד הימני אחד אחרי השני, אחר כך היורדים, וכל חיתוך נפתח באחד מהקווים לסירוגין, כך שהם נראים שזורים זה בזה. אחרי הקווים נוחתות נקודות במרכזי היהלומים, ובסוף נסגרת מסגרת דקה סביב הכול. הסקשן נעוץ במסך לאורך הציור.","when":"סקשן של סדנה, מלאכה, תרבות, אדריכלות או מתמטיקה, שהדוגמה בו היא התוכן: אריחים, טקסטיל, רהיטים בעבודת יד, סטודיו לעיצוב פנים. הציור נותן לדוגמה זמן להיבנות מול העין. לא למותג טכנולוגי קר, ולא כשאין דוגמה אמיתית שחוזרת על עצמה."},{"id":"b98","name":"רשת ספרות עמומה שמהבהבת מאחורי כותרת","cat":"behavior","desc":"מאחורי הכותרת של סקשן ניטור פרוסה רשת צפופה של ספרות עמומות, כמו מסך נתונים כבוי למחצה. מדי פעם ספרה בודדת מתחלפת ומתלקחת בצבע המותג, ודועכת בחזרה בתוך חצי שנייה, בלי קצב קבוע. בצד הכותרת נקודת סטטוס עם הילה שמפעמת לאט. הרשת דועכת בקצוות, ומתחת לטקסט יושבת שכבה רכה שמשאירה אותו קריא.","when":"הירו או סקשן סטטוס של שירות טכני: ניטור, אבטחה, תשלומים, תשתיות, כלי נתונים, אירוח. הרשת מספרת שיש מערכת שרצה בלי להגיד כלום. לא לאתר של עסק מקומי או של שירות אישי, לא מתחת לטקסט ארוך, ולא ליד טבלה אמיתית של מספרים, כי היא תתחרה בה."},{"id":"g269","name":"פריטים צפים בעומק סביב כותרת מרכזית","cat":"gsap","desc":"שבבי טקסט וגזרי תמונה מרחפים סביב כותרת במרכז, בשלוש שכבות עומק. הרחוקים קטנים ומטושטשים, הקרובים גדולים ומטושטשים אף הם, והאמצעיים חדים. כל פריט מתנדנד לאט במקומו, בגלילה כל שכבה זזה בכמות אחרת, ועם העכבר השכבות הקרובות זזות יותר. בכניסה הפריטים מתקבצים מסביב לכותרת.","when":"הירו או סקשן סיום שיש בו כותרת אחת חזקה ועולם של דברים סביבה: מוצרים, שירותים, מנות, כלים, אנשים. עוזר לעסק שהמוצר שלו רב-פנים (מאפייה, חנות, סטודיו) להראות מגוון בלי רשת. לא מתחת לטקסט ארוך ולא ליד טופס."},{"id":"css44","name":"רצפת רשת בפרספקטיבה שנעה לעבר הצופה","cat":"css","desc":"רצפה של קווים דקים נמתחת עד האופק, והרשת שלה נעה כל הזמן לכיוון הצופה, כך שנדמה שנוסעים קדימה. מעל האופק יושבת שמש שטוחה עם פסי חיתוך שנעשים עבים כלפי מטה, והשמיים מתחממים לכיוון הקו. הכול CSS, בלי סקריפט, ועם סימן אחד אפשר להחליף את הקווים במשבצות.","when":"רקע של הירו לעסק שהמראה שלו רטרו או טכנולוגי: ארקייד, אולפן מוזיקה, משחקים, אירועי לילה, כלי למפתחים. הכותרת יושבת על השמיים הרגועים ולא על הרצפה. פעם אחת בעמוד. לא לעסק שקט ורציני כמו משרד או קליניקה."},{"id":"g270","name":"שבבים שעולים מלמטה ונערמים לערימה","cat":"gsap","desc":"שבבים קטנים בגוונים שונים עולים מהקצה התחתון של הכרטיס בגלים, ומתיישבים בשורות רופפות שחופפות זו לזו. כל גל מוסיף שורה, הערימה גדלה, והמספר שמעליה עולה יחד איתה עד הסך הכול. בסוף נשארת ערימה אחת שמראה כמה דברים יש בפנים.","when":"סקשן יכולות או שירותים עם הרבה פריטים קצרים: עשרים עד שלושים סוגי עבודות, כלים, טכנולוגיות, תחומי התמחות. הערימה מראה את הכמות, והרשימה נשארת טקסט אמיתי שאפשר לקרוא. לא עם שלושה פריטים, ולא כשכל פריט צריך הסבר."},{"id":"b102","name":"גצים שעולים מקו זוהר בתחתית הסקשן","cat":"behavior","desc":"קו זוהר רך לאורך התחתית ושני מוקדי אש בצדדים. מהם עולים גצים קטנים שמתנדנדים ודועכים בדרך למעלה, ובבסיס כל מוקד לשונות חם קצרות. הזוהר מהבהב לאט ובעדינות. לחיצה על הסקשן מוציאה חבורת גצים נוספת מנקודת הלחיצה ומגבירה את הזוהר לרגע.","when":"תחתית של הירו או סקשן סיום לעסק שהחום הוא חלק ממנו: גריל, תנור אבן, מעשנה, חדר כושר, אירוע ערב. הכותרת יושבת למעלה והאש מלמטה. לא מתחת לטקסט ארוך, ולא לעסק רגוע ושקט שבו תנועה חמה תיראה זרה."},{"id":"g271","name":"דמות שמציצה מקצה המסך ומחליפה צד בכל סקשן","cat":"gsap","desc":"דמות איורית ידידותית מציצה מתחתית המסך ואוחזת בקצה. כשסקשן חדש מגיע היא צוללת, עוברת לצד הנגדי לטקסט ועולה שוב, מביטה אל התוכן ומצמצת. כשהסקשן מגיע לאמצע המסך נפתחת מעליה בועת דיבור קצרה בגוף ראשון שמתאימה לו, והדמות מזיזה את הפה בזמן שהמילים נכנסות. לפני הסקשן הראשון ואחרי האחרון היא מסתתרת. השכבה לא חוסמת לחיצות והטקסט נשאר תוכן רגיל.","when":"עמוד תהליך, אודות או שירות עם שלושה עד חמישה סקשנים, כל אחד בגובה של כשבעים אחוז מהמסך עם טקסט בצד אחד ותמונה בצד השני, ודמות אחת שמייצגת את העסק: קמע של המותג או איור של בעל העסק. הדמות מלווה את הקורא לאורך העמוד ומדברת בגוף ראשון. לא בעמוד קצר, לא עם אנשים שאינם חלק מהמותג, ולא כשהטקסט בסקשן מגיע עד הקצה התחתון שלו."},{"id":"g272","name":"סליל דו-גדילי עם קו סריקה שצובע אותו","cat":"gsap","desc":"סליל דו-גדילי מצויר לרוחב הכרטיס: שני גדילים גליים, שלבים שמחברים ביניהם ונקודות שבחזית ובעומק. הגל נע לאט לצד אחד, וקו סריקה דק עובר על פני הסליל לאט ומשאיר מאחוריו את הצבע של המותג, כך שהמקטע הסרוק נדלק והשאר נשאר אפור. בסוף כל הסליל דולק, מחכה רגע, כבה, והסריקה חוזרת.","when":"עסק שהמוצר שלו הוא בדיקה, סריקה או ניתוח של משהו: מעבדה, בדיקות גנטיות, סורק אבטחה, תוכנת אבחון, ביקורת קוד. הסליל הוא האיור של העסק עצמו והסריקה היא ההבטחה. פעם אחת בעמוד, מתחת לכותרת שמסבירה מה נבדק. לא בעסק שאין לו קשר לגנטיקה או למדע, כי הצורה מזוהה מיד."},{"id":"b103","name":"כוכבי שביט שמקפצים בין שני פסים ומדליקים אותם","cat":"behavior","desc":"שלושה כוכבי שביט עם זנב דועך מקפצים לאורך הכרטיס בין שורת פסים למעלה לשורת פסים למטה, וסוטים מעט לצדדים עד שהם פוגעים בקיר. בכל פגיעה הפס שנגעו בו נדלק לרגע בזוהר רך, נפרשת חבורת גצים קטנה, והכוכב חוזר לכיוון השני. הטקסט במרכז יושב על כיסוי רך שמשאיר אותו קריא.","when":"סקשן הירו או סיום לעסק שקשור למשחק, מוזיקה, קצב או מדידה: סטודיו למשחקים, בית תקליטים, אפליקציית כושר, לוח בקרה. הפסים הם האיור של העסק והתנועה נותנת תחושה של משחק גם בלי משחק. לא מעל טקסט ארוך, ולא לעסק רציני ושקט כמו משרד עורכי דין."},{"id":"g273","name":"קרני שמש שנפתחות מאחורי המבצע","cat":"gsap","desc":"קרניים דקות יוצאות מהעיגול שבמרכז ונמסות לקצוות הסקשן. כשהסקשן נכנס למסך הן נפתחות בסריקה אחת סביב העיגול, ואחר כך מסתובבות לאט עם הגלילה ופועמות בעדינות. הכותרת, הטקסט והתמונה נשארים הדבר הברור בעמוד, והקרניים רק מכוונות אליהם את העין.","when":"מבצע, הטבה או אובייקט אחד שצריך להרגיש כמו אירוע: קונוס שני במתנה, יום פתוח, מוצר החודש. סקשן אחד בעמוד, בעיקר באתר של עסק מקומי או של חנות. פחות מתאים לשירות מקצועי שקט, ולסקשן עם כמה אובייקטים, כי הקרניים מצביעות על אחד."},{"id":"g274","name":"שדה כוכבים שנמתח לפסים עם מהירות הגלילה","cat":"gsap","desc":"כוכבים זורמים לאט מהמרכז החוצה מאחורי הכותרת. כשגוללים מהר הם נמתחים לפסים ארוכים והשדה כולו מאיץ, וכשעוצרים הוא נרגע בחזרה. מרכז הבמה נשאר נקי, כדי שהטקסט ייקרא בכל רגע.","when":"הירו של עסק שהמהירות היא הערך שלו: שליחויות, תקשורת, לוגיסטיקה, מוצר דיגיטלי שמבטיח תוצאה מהירה. פעם אחת בעמוד, בפתיח. לא מתאים לעסק שמוכר שקט ואמון, כמו קליניקה או משרד עורכי דין."},{"id":"g275","name":"פסי תנועה אופקיים שחולפים מאחורי הנושא","cat":"gsap","desc":"תמונה גדולה נכנסת מימין ונעצרת במרכז הבמה, ומאחוריה נמתחים אחריה כמה עשרות פסים דקים לרוחב המסך. בתחילה הפסים ארוכים, וככל שהתמונה מאטה הם מתקצרים עד שנשארים מהם קצוות קצרים. מאחורי הכל מילה ענקית בקו מתאר זזה לאט באותו כיוון.","when":"פתיח או סקשן אודות של עסק שעוסק בתנועה: השכרת רכבים, שליחויות, ספורט, נסיעות. הסצנה נעוצה ודורשת מסלול גלילה, ולכן היא מתאימה לעמוד
