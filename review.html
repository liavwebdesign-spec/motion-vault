<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Motion Vault · סבב סקירה</title>

<link rel="stylesheet" href="assets/vault.css?v=8b211157">
<style>
html,body{height:100%}
body.rv{margin:0;display:flex;flex-direction:column;background:var(--bg)}
.rv-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px var(--gutter);border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.rv-bar h1{font-size:16px;margin:0;font-weight:700}
.rv-count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rv-title{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.rv-title .vid{font-size:12px}
.rv-desc{font-size:13px;color:var(--muted);max-width:120ch;line-height:1.45}
.rv-acts{display:flex;gap:8px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}
.rv-nav{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.rv-nav:hover{border-color:var(--ink)}
.rv-kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-inline-start:4px;font-family:ui-monospace,monospace}
.rv-note{display:none;padding:8px var(--gutter);background:#fff5f5;border-bottom:1px solid #f3c3c3}
.rv-note.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rv-note textarea{flex:1;min-width:260px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #f3c3c3;border-radius:8px;resize:vertical;min-height:38px}
.rv-note small{color:#c92a2a}
.rv-frame{flex:1;border:0;width:100%;min-height:0;background:#fff}
.rv-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rv-filters select{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff}
.rv-done{padding:60px var(--gutter);text-align:center}
.rv-done h2{margin:0 0 10px}
.rv-open{font-size:13px;color:var(--accent)}
/* מה השתנה + לפני (30.9.2026): פריט שחזר לממתין אחרי תיקון יזום מראה את השינוי במשפט, וצילום "לפני" מעל הדמו */
.rv-chg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px var(--gutter);background:#f1efff;border-bottom:1px solid var(--line);font-size:14px}
.rv-chg[hidden]{display:none}
.rv-chg b{font-weight:600}
.rv-chg button{font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.rv-chg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rv-stage{position:relative;flex:1;min-height:0;display:flex}
.rv-before{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:contain;object-position:top center;background:#fff}
.rv-before[hidden]{display:none}
@media (max-width:767px){.rv-desc{display:none}.rv-kbd{display:none}}
</style>
</head>
<body class="rv">
<div class="rv-bar">
  <h1>סבב סקירה</h1>
  <span class="rv-count" data-count></span>
  <div class="rv-filters">
    <select data-filter aria-label="מה לסקור">
      <option value="pending">רק ממתינים</option>
      <option value="all">הכל</option>
      <option value="no">רק לא מאושרים</option>
      <option value="changed">רק מה שהשתנה בתיקון</option>
    </select>
    <select data-cat aria-label="קטגוריה"><option value="all">כל הקטגוריות</option></select>
  </div>
  <div class="rv-title"><span class="vid" data-id></span><span data-name></span><a class="rv-open" data-open target="_blank" rel="noopener">פתח בטאב ↗</a></div>
  <div class="rv-acts">
    <button class="rv-nav" data-prev>→ הקודם<span class="rv-kbd">←</span></button>
    <button class="stbtn ok" data-s="ok">מאשר ✓<span class="rv-kbd">A</span></button>
    <button class="stbtn no" data-s="no">לא מאושר ✕<span class="rv-kbd">X</span></button>
    <button class="rv-nav" data-next>הבא ←<span class="rv-kbd">→</span></button>
    <button class="rv-nav" data-report>העתק דוח</button>
    <a class="rv-nav" href="index.html">לכל המאגר</a>
  </div>
</div>
<div class="rv-desc" style="padding:8px var(--gutter) 0" data-desc></div>
<div class="rv-chg" data-chg hidden><b>מה השתנה:</b><span data-chgt></span><button type="button" data-before aria-pressed="false">לפני<span class="rv-kbd">B</span></button></div>
<div class="rv-note" data-note><small>מה לא עובד? (נכנס לדוח)</small><textarea rows="1" data-ta placeholder="לדוגמה: הכרטיסים קופצים בכניסה, הטקסט נחתך במובייל..."></textarea></div>
<div class="rv-stage"><iframe class="rv-frame" data-frame title="דמו"></iframe><img class="rv-before" data-bimg alt="צילום לפני התיקון" hidden></div>
<div class="rv-done" hidden data-done><h2>אין מה לסקור בסינון הזה</h2><p class="rv-desc" style="margin-inline:auto">כל המהלכים שנבחרו כבר מסומנים. אפשר לעבור ל"הכל" כדי לבדוק שוב, או להעתיק את הדוח.</p></div>
<script src="assets/baseline.js?v=b0f4bcc6"></script>
<script src="assets/status.js?v=38ce7fee"></script>
<script src="assets/changes.js?v=b0f4bcc6"></script>
<script>
(function(){
  const ALL=[{"id":"g01","name":"גלילה צידית מוצמדת","cat":"gsap","desc":"הסקשן ננעל למסך והתוכן גולש הצידה במקום למטה. המהלך המבוקש ביותר.","when":"תהליך שלבים, גלריית עבודות, קטגוריות."},{"id":"g02","name":"חשיפת תמונה במסכה בגלילה","cat":"gsap","desc":"התמונה נצבעת מלמטה למעלה בקו חד, בקצב הגלילה, קדימה ואחורה.","when":"תמונת שיא, לפני/אחרי, ויז'ואל הירו משני."},{"id":"g03","name":"חור מסכה שנפתח על מדיה","cat":"gsap","desc":"המדיה מציצה דרך עיגול קטן; בגלילה העיגול מתרחב עד מסך מלא.","when":"רגע שיא קולנועי, חשיפת מוצר או וידאו."},{"id":"g04","name":"טקסט נחשף בגלילה: שלוש רמות","cat":"gsap","desc":"שלוש עוצמות חשיפה לכותרת: מילים עולות מ-clip, מילים מתבהרות, והכותרת נמחקת מהצד.","when":"כותרות סקשן באתרי סטוריטלינג. בעברית מפצלים למילים בלבד, לא לאותיות."},{"id":"g05","name":"מסך מפוצל: תמונות מתחלפות לפי טקסט","cat":"gsap","desc":"צד תמונה דביק וצד טקסט גולל; כל בלוק טקסט שמגיע מחליף את התמונה ב-crossfade.","when":"הצגת שירותים או פרקים עם ויז'ואל לכל אחד."},{"id":"g06","name":"גלריה נגררת עם אינרציה","cat":"gsap","desc":"גריד שגוררים ביד והוא ממשיך בתנופה ונבלם ברכות בגבולות.","when":"פורטפוליו, גלריה חופשית. במגע זה הבית הטבעי שלו."},{"id":"g07","name":"תמונות רודפות עכבר (Image Trail)","cat":"gsap","desc":"מניפת תמונות שרודפת אחרי הסמן במהירויות שונות: הראשונה צמודה, האחרונות משתרכות.","when":"הירו של פורטפוליו או סטודיו, סקשן playful. במובייל כבוי."},{"id":"g08","name":"סמן מותאם + פנס","cat":"gsap","desc":"עיגול סמן שרודף את העכבר וגדל מעל לחיצים, וכתם אור מטושטש שמאיר רקע כהה סביב הסמן.","when":"אתרי וואו כהים, פורטפוליו. במובייל כבוי."},{"id":"g09","name":"זריקה אינרציאלית בהובר","cat":"gsap","desc":"מרחפים על פריט והוא נזרק בכיוון תנועת העכבר וחוזר למקומו ברכות.","when":"גריד לוגואים, תגיות או צ'יפים באתר playful. במובייל כבוי."},{"id":"g11","name":"זכוכית מגדלת על תמונה","cat":"gsap","desc":"עיגול הגדלה עוקב עכבר על תמונה, זום 1.5.","when":"מוצר עתיר פרטים, תיק עבודות, תכשיטים. במובייל כבוי (pinch-zoom טבעי עדיף)."},{"id":"g12","name":"פרלקס עומק רב-שכבתי","cat":"gsap","desc":"שכבות באותו סקשן נעות במהירויות שונות בגלילה, מהעמוקה ועד הקרובה, והכותרת נעה בכיוון ההפוך. עומק בלי אף תמונה.","when":"הירו עשיר, סקשני אווירה. במובייל מקדם מוקטן או כבוי."},{"id":"g13","name":"Batch Reveal לגרידים","cat":"gsap","desc":"כרטיסי גריד נכנסים בקבוצות חכמות: מה שנגלה יחד במסך עולה יחד, עם סטאגר זעיר של 0.08 שניות.","when":"גרידים של 6 פריטים ומעלה. החריג המאושר היחיד לחוק האנטי-סטאגר."},{"id":"g14","name":"מונים בקצב הגלילה","cat":"gsap","desc":"מספרים גדולים שנספרים עם הגלילה, קדימה ואחורה, לא פעם אחת.","when":"סקשן מספרים באתר סטוריטלינג. בעמוד שקט עדיף count-up חד-פעמי (B2)."},{"id":"g15","name":"פרילודר פרימיום (עלייה)","cat":"gsap","desc":"מסך פתיחה שמתרומם ונעלם כשהעמוד באמת נטען. בלי המתנה מלאכותית.","when":"אתרי פרימיום כבדי מדיה בלבד. פרילודר על אתר מהיר הוא עיכוב מיותר."},{"id":"g15b","name":"פרילודר דלתות","cat":"gsap","desc":"שני חצאי מסך שנפתחים לצדדים כמו דלתות וחושפים את האתר. כאן הוא מוצג בתוך מסגרת כדי שאפשר יהיה לראות אותו, ובאתר אמיתי החלק הזה הוא position:fixed על כל המסך.","when":"וריאנט דרמטי של הפרילודר. לוטי קצר במרכז ואז פתיחה."},{"id":"g16","name":"מילים מתרוקנות בהובר","cat":"gsap","desc":"מרחפים על מילה בכותרת והיא הופכת למתאר חלול; עוזבים והיא מתמלאת חזרה.","when":"כותרת הירו אינטראקטיבית. עובד מצוין בעברית. במובייל כבוי."},{"id":"g17","name":"כרטיסים מתעופפים פנימה","cat":"gsap","desc":"שלושה כרטיסים טסים למקומם משני הצדדים עם סיבוב, בקצב הגלילה.","when":"הצגת שלושה שירותים או מוצרים בכניסה דרמטית."},{"id":"g18","name":"סצנת סיפור מוצמדת (Master Timeline)","cat":"gsap","desc":"הסקשן ננעל והופך לבמה: כותרת נכנסת ונמוגה, שנייה מחליפה אותה, והמדיה נפתחת מגלולה זעירה למסך כמעט מלא. גלול לאט, גם אחורה.","when":"סקשן שיא אחד באתר סטוריטלינג. אחד לאתר: זה מהלך חתימה, לא תבנית."},{"id":"g19","name":"פיזור חפצים נופלים","cat":"gsap","desc":"שמונה אלמנטים נופלים למקומם יחד, כל אחד עם סיבוב וציר סיבוב משלו.","when":"סקשן מספרים או הטבות, אווירה playful, המחשת שפע."},{"id":"g20","name":"טיימליין אופקי עם קו התקדמות","cat":"gsap","desc":"גלילה צידית שקו נמתח לאורכה וכל תחנה נדלקת כשהוא מגיע אליה.","when":"תהליך עבודה, מסע לקוח, אבני דרך. הוא או G1, לא שניהם באותו עמוד."},{"id":"g22","name":"עיגול תהליך נצבע בגלילה","cat":"gsap","desc":"קשת צבעונית נצבעת סביב עיגול גדול בקצב הגלילה, כל תחנה נדלקת בתורה והתוכן במרכז מתחלף.","when":"תהליך של 3-5 שלבים. האלטרנטיבה המעגלית לטיימליין האופקי."},{"id":"g46","name":"גרף תוצאות שנמתח בגלילה","cat":"gsap","desc":"קו גרף שמצייר את עצמו בקצב הגלילה, נקודה שרצה על הקו, ומספר שמטפס יחד איתה עד לערך הסופי. השטח מתחת לקו מתמלא בהדרגה.","when":"סקשן תוצאות בכל עסק: גידול בפניות, החזר על השקעה, מטופלים, מכירות, חיסכון. מחליף מספר סטטי בהוכחה שמתרחשת מול העיניים."},{"id":"g23","name":"Flip: פריט קופץ לגריד וחזרה","cat":"gsap","desc":"לחיצה על כרטיס מעבירה אותו מהגריד לתצוגה מורחבת, וה-Flip מנפיש את המסע בין שני המצבים אוטומטית.","when":"גלריה שנפתחת לפריט מורחב, מיון וסינון עם תזוזה חלקה, שינוי לייאאוט חי."},{"id":"g25","name":"MotionPath: אלמנט נוסע על מסלול","cat":"gsap","desc":"אייקון שנוסע לאורך מסלול SVG מפותל בקצב הגלילה, ומסתובב לכיוון הנסיעה.","when":"המחשת מסע לקוח, לוגו שמטייל בין תחנות, אינפוגרפיקה חיה."},{"id":"g30","name":"סקשנים ננעלים עם Snap","cat":"gsap","desc":"שלושה מסכים אופקיים שהגלילה נצמדת אליהם: עוזבים את הגלגלת והמסך מתיישר לסקשן הקרוב.","when":"מצגות מוצר, סיפור בפרקים. גרסה ממושמעת של גלילה צידית."},{"id":"g31","name":"גלריה אנכית נגררת עם מונה","cat":"gsap","desc":"ערימת מדיה אנכית: הפריט המרכזי גדול, השכנים מציצים מעליו ומתחתיו. גרירה, החלקה או גלגלת מעבירים פריט, המונה מתעדכן, והכותרת מפוצלת לשני צידי הערימה.","when":"הירו של אתרי פורטפוליו ואולפנים, תצוגת פרויקטים נבחרים. הגלגלת עוברת פריטים רק בתוך הגלריה, ובקצוות היא משחררת את הדף (אין מלכודת גלילה)."},{"id":"g35","name":"טקסט ענק זורם על גל בגלילה","cat":"gsap","desc":"משפט ענק, רחב מהמסך, מוצמד למסך ונוסע לרוחבו בקצב הגלילה. כל מילה מתנדנדת על גל משלה, כך שהשורה נראית כמו סרט שמתגלגל ולא כמו טקסט שזז.","when":"סיום העמוד לפני ה-CTA, הצהרת מותג, מעבר בין פרקים. משפט אחד קצר, מילים גדולות. בעברית הגל על מילים, לא על אותיות."},{"id":"g36","name":"מעבר סקשן בקשת שמתיישרת","cat":"gsap","desc":"הגבול בין סקשן בהיר לכהה הוא קשת עגולה. ככל שגוללים אליו, הקשת מתיישרת לקו ישר. מעבר רך במקום חיתוך, בלי תמונה ובלי clip-path קופצני.","when":"מעבר מהירו לסקשן הבא, כניסה לציטוט או לסקשן אודות. פעם או פעמיים בעמוד. עובד על כל שני צבעי רקע."},{"id":"g37","name":"ענן תמונות מרחפות בעומק","cat":"gsap","desc":"סקשן מוצמד שבו תמונות מפוזרות במרחב בגדלים שונים. בגלילה כל תמונה עולה במהירות משלה לפי העומק שלה, והעכבר מזיז את כולן בעדינות בפרלקסה.","when":"הצגת אוסף: לקוחות, פרויקטים, קהילה, מוצרים. במקום גריד מסודר, תחושת מרחב. 7 עד 12 תמונות, לא יותר."},{"id":"g38","name":"Lenis + ScrollTrigger: גלילה חלקה","cat":"gsap","desc":"תשתית ולא אפקט: Lenis מחליק את הגלילה של כל העמוד, ומחובר לטיקר של GSAP כך שכל ה-ScrollTriggers נשארים מסונכרנים. כפתור צף מכבה ומדליק כדי להרגיש את ההבדל.","when":"אתרי חוויה ותדמית-וואו שבהם רוב המהלכים מבוססי גלילה. לא באתרי המרה, טפסים ומערכות: שם הגלילה הטבעית מנצחת. תמיד בתוך prefers-reduced-motion."},{"id":"g39","name":"טקסט מתעקל על קשת בגלילה","cat":"gsap","desc":"משפט שמתחיל כשורה ישרה ומתעקל לקשת ככל שגוללים: כל תו מסתובב סביב ציר רחוק מתחת לשורה, כך שהמילים מתעגלות סביב מרכז דמיוני ולא רק זזות.","when":"רגע דקורטיבי אחד בעמוד: מעל סקשן הטבות, סביב תמונה עגולה, לפני ה-CTA. משפט קצר בלבד. המשפט המלא נשמר בטקסט נסתר לקוראי מסך."},{"id":"g40","name":"סצנה אופקית שכל אלמנט בה מתעורר בתורו","cat":"gsap","desc":"סקשן שננעל למסך והתוכן גולש הצידה, אבל הפעם כל פריט בתוך המסלול מקבל טריגר משלו לפי המיקום האופקי שלו: הוא נכנס כשהוא מגיע לאזור הצפייה, ולא כשהסקשן כולו נכנס. אלמנט אחד בפנים גם מסתובב בסקראב משלו.","when":"סיפור אופקי עם תחנות: מסע לקוח, ציר זמן, שלבי תהליך. זה מה שהופך גלילה צידית מרצועה שזזה לסצנה שמתרחשת. ההבדל מ-MV:g01 הוא בדיוק זה."},{"id":"g42","name":"קו מצויר ביד מתחת לכותרת","cat":"gsap","desc":"קו לא מושלם, כמו שרבוט של עיפרון, שנמתח מימין לשמאל מתחת למילה כשהכותרת נכנסת למסך. שלושה סוגים: קו תחתון, עיגול סביב מילה, וחץ שמצביע.","when":"הדגשת מילת מפתח בכותרת ראשית, מחיר, או הבטחה. עובד יפה במותגים חמים ואנושיים. אחד או שניים בעמוד, לא יותר."},{"id":"g43","name":"רשימת פרויקטים עם תצוגה מקדימה שעוקבת אחרי הסמן","cat":"gsap","desc":"רשימת שורות נקייה. כשהסמן נכנס לשורה, חלונית תמונה נפתחת וצפה ליד הסמן, ומתחלפת ברכות בכל מעבר לשורה אחרת. יציאה מהרשימה סוגרת אותה.","when":"תיק עבודות, רשימת שירותים, מאמרים. הדרך להציג עשרים פרויקטים בלי גריד כבד ובלי לטעון עשרים תמונות בכניסה."},{"id":"g45","name":"מפת סביבה: קו שנמתח עם תחנות ומרחקים","cat":"gsap","desc":"קו מפותל נמתח לרוחב הסקשן בקצב הגלילה, ובכל נקודה שהוא מגיע אליה צצה תחנה עם שם ומרחק בדקות נסיעה.","when":"נדל\"ן, קליניקות, מלונות ומסעדות: הסקשן שעונה על \"מה יש בסביבה ובכמה זמן מגיעים\". מחליף מפת גוגל סטטית בסיפור שנבנה מול העיניים."},{"id":"b01","name":"מרקי (רצועה נעה)","cat":"behavior","desc":"רצועת תוכן שזורמת בלולאה מושלמת: העותקים משוכפלים לפי רוחב המסך, ההזזה היא רוחב קבוצה מדויק, ומסכת קצה ממיסה את החיתוך. הובר עוצר.","when":"נקודות אמון בתחתית הירו, רצועת לוגואים, פסי אווירה."},{"id":"b02","name":"Count-Up (מספר שסופר)","cat":"behavior","desc":"מספר גדול שנספר פעם אחת כשהוא נכנס למסך, עם ease-out טבעי ושמירת סיומת.","when":"סקשן מספרים ונתונים. פעם אחת, לא בכל גלילה."},{"id":"b02b","name":"Hotspots על תמונה עם רשימה מסונכרנת","cat":"behavior","desc":"נקודות ממוספרות על תמונה, כל אחת פותחת כרטיס מידע בהובר; הובר על נקודה מדליק את השורה ברשימה ולהפך.","when":"תוכן שמצביע על אזורים בתמונה: נכס, מוצר, תרשים. במובייל הנקודות נעלמות והרשימה נושאת הכל."},{"id":"b03","name":"CTA דביק חכם","cat":"behavior","desc":"כפתור צף שמופיע רק כשאף CTA ראשי לא נמצא על המסך, ונעלם כשיש.","when":"עמודים ארוכים. במובייל בר תחתון מלא עם safe-area."},{"id":"b10","name":"קווי שיער (Hairlines)","cat":"behavior","desc":"מפריד בגובה פיקסל שנמס בקצוות במקום להיחתך.","when":"הפרדות עדינות בין בלוקים בלי משקל ויזואלי."},{"id":"b11","name":"נקודת דופק (Pulse)","cat":"behavior","desc":"נקודה ירוקה עם גלי דופק. אינדיקטור חי שמושך תשומת לב בעדינות.","when":"זמין עכשיו, שידור חי, סטטוס מערכת."},{"id":"b15","name":"שלדים (Skeletons)","cat":"behavior","desc":"מצייני טעינה בצורת התוכן עם הבהוב שמאלה-ימינה, במקום ספינר.","when":"מערכות ודשבורדים בזמן טעינת דאטה."},{"id":"b16","name":"Toast (הודעה קופצת)","cat":"behavior","desc":"הודעת אישור קטנה שעולה מתחתית המסך, נשארת שלוש שניות ונעלמת.","when":"אחרי שליחת טופס, העתקה, שמירה."},{"id":"b17","name":"תג HUD: מה על המסך עכשיו","cat":"behavior","desc":"תגית קטנה וקבועה בפינת המסך שמראה את מספר הפריט או הסקשן שנמצא כרגע במרכז. כשהמספר מתחלף, התג קופץ קפיצה זעירה כדי שהעין תתפוס את השינוי.","when":"עמודים ארוכים עם רשימת פריטים ממוספרים: קטלוג, מהלכים, פרקים, שלבים. גם כאינדיקטור התקדמות אלגנטי במקום פס."},{"id":"b18","name":"הדר שמחליף ערכת צבע לפי הסקשן","cat":"behavior","desc":"הדר דביק שנשאר קריא על כל רקע: כשהוא עובר מעל סקשן כהה הוא הופך לבהיר, ומעל סקשן בהיר חוזר לכהה. הטריגר נמדד בגובה ההדר עצמו, לא באמצע המסך.","when":"כל אתר עם הדר שקוף או דביק וסקשנים בצבעים מתחלפים. חוסך את הפשרה של הדר אטום לבן."},{"id":"b19","name":"כרטיס וידאו שמתנגן בהובר","cat":"behavior","desc":"גריד כרטיסים שבו כל אחד מציג תמונת פוסטר בלבד. בהובר הווידאו נטען ומתנגן בשקט, וביציאה נעצר וחוזר להתחלה. שום וידאו לא יורד לפני שנגעו בו.","when":"גלריית עבודות, קטלוג מוצרים, רשימת פרויקטים. הדרך הנכונה לשים הרבה וידאו בעמוד בלי להרוג את זמן הטעינה."},{"id":"b20","name":"מחיר שמתגלגל בהחלפת מסלול","cat":"behavior","desc":"מתג בין מסלול חודשי לשנתי, והמחיר לא מתחלף בקפיצה: הספרה הישנה נגללת למעלה ויוצאת, החדשה נכנסת מלמטה, וכל ספרה בעיכוב קטן משלה.","when":"כל סקשן מחירים עם שני מסלולים. ההתגלגלות מוכיחה שהמספר באמת השתנה, במקום שהעין תפספס את ההנחה."},{"id":"b22","name":"סקשן וידאו שמתנגן רק כשרואים אותו","cat":"behavior","desc":"סרטון ברוחב מלא שמתחיל לנגן כשהסקשן נכנס למסך ונעצר כשהוא יוצא. עד אז מוצג פוסטר בלבד, והדפדפן לא מוריד את הווידאו.","when":"סקשני אווירה באתרי תדמית, קליניקות, מסעדות ונדל\"ן. הדרך הנכונה לשים וידאו גדול בעמוד בלי לשלם עליו בזמן טעינה."},{"id":"b23","name":"תפריט מסך מלא עם כניסה מדורגת","cat":"behavior","desc":"לחיצה על הכפתור פורשת שכבה על כל המסך, הקישורים נכנסים אחד אחרי השני, והגלילה מאחור ננעלת. סגירה בכפתור, ב-Escape או בבחירת קישור.","when":"כמעט כל אתר תדמית. במובייל זו ברירת המחדל, ובדסקטופ זו בחירה עיצובית שמפנה מקום לכותרת ולתוכן."},{"id":"b24","name":"כפתור שהאותיות בו מתחלפות בהובר","cat":"behavior","desc":"שתי שכבות של אותו טקסט זו מעל זו. בהובר העליונה מחליקה למעלה והתחתונה עולה במקומה, אות אחרי אות, כך שהמילה מתגלגלת ולא סתם משנה צבע.","when":"כפתור ראשי, קישור ניווט, כפתור מוצר. מיקרו-אינטראקציה שמסמנת ליטוש. בעברית האותיות אינן מחוברות ולכן פיצול לאותיות בטוח."},{"id":"b27","name":"טאבים צפים שמחליפים מדיה מלאה","cat":"behavior","desc":"שורת כפתורים צפה מעל תמונה במסך מלא. לחיצה מחליפה את המדיה שמאחור בהצלבה רכה, והמחוון מחליק אל הכפתור הפעיל.","when":"עמוד שירותים שמציג תחומים שונים, קטלוג לפי קטגוריה, או תיק עבודות לפי סוג. מחליף שלושה סקשנים נפרדים בסקשן אחד."},{"id":"b29","name":"רקע העמוד שמחליף צבע לפי הסקשן","cat":"behavior","desc":"כל סקשן מכריז על ערכת הצבע שלו, והרקע והטקסט של העמוד עוברים אליה. שני מצבים: בקפיצה רכה כשסקשן תופס את רוב המסך, או ברצף שצמוד לגלילה, שבו הרקע נמזג מצבע לצבע בדיוק בקצב שהגולש גולל.","when":"אתרי תדמית וסיפור מותג, עמודי מוצר ארוכים. נותן תחושת פרקים בלי קווים מפרידים ובלי סקשנים עם קצוות חדים. הקפיצה מתאימה לפרקים נפרדים, והרצף מתאים לעמוד שמתכהה בהדרגה (מבהיר בפתיחה לכהה ביוקרה), כמו שנראה ב-academy.shiruziel.com."},{"id":"b30","name":"אקורדיון שאלות ותשובות","cat":"behavior","desc":"רשימת שאלות שנפתחות בגובה אמיתי, בלי לקפוץ ובלי לחשב פיקסלים. לחיצה פותחת וסוגרת, וכברירת מחדל רק אחת פתוחה בכל רגע.","when":"כל עסק, בלי יוצא מן הכלל. סקשן שאלות נפוצות, מפרט מוצר, תנאי שירות, תהליך עבודה. זה הרכיב שחזר על עצמו בכמעט כל אתר שסרקנו."},{"id":"b31","name":"סליידר המלצות עם גרירה, חצים ונקודות","cat":"behavior","desc":"רצועת ציטוטים שנגררת באצבע ובעכבר, נצמדת לכל כרטיס, ומסונכרנת עם חצים ונקודות. בנוי על גלילה נטיבית, ולכן חלק במובייל ולא נשבר.","when":"המלצות לקוחות, לוגואים, מקרי בוחן, מוצרים נבחרים. אחרי אקורדיון זה הרכיב הכי נפוץ שראינו, וכל עסק צריך אותו."},{"id":"b32","name":"טופס עם תוויות צפות, שגיאות ומצב שליחה","cat":"behavior","desc":"התווית יושבת בתוך השדה ועולה למעלה ברגע שמקלידים. שגיאה נכנסת עם ריצוד עדין והודעה מתחת לשדה, והכפתור עובר למצב שליחה ואז לאישור.","when":"כל טופס בכל אתר: יצירת קשר, קביעת תור, הרשמה לרשימה, בקשת הצעת מחיר. זה הרכיב שקובע אם ליד נשלח או ננטש."},{"id":"b33","name":"גלריה עם לייטבוקס","cat":"behavior","desc":"גריד תמונות שנפתח למסך מלא בלחיצה, עם מעבר בין תמונות בחצים ובמקלדת, סגירה ב-Escape או בלחיצה על הרקע, וגלילה נעולה מאחור.","when":"מסעדות, קליניקות, נדל\"ן, אולמות, סטודיו, חנויות. בכל אתר שיש בו תמונות שאנשים ירצו לראות גדול."},{"id":"css01","name":"הרמת כרטיס בהובר","cat":"css","desc":"הכרטיס עולה 5 פיקסלים, הצל מתעמק, והמסגרת מתכהה מעט בגוון המשטח ולא במבטא. הובר הכרטיס של המנוע.","when":"כל כרטיס לחיץ. הטרנספורם תמיד איטי מהצבע (0.4 מול 0.3). ההובר רק במכשיר עם עכבר, כדי שנגיעה בטלפון לא תשאיר את הכרטיס באוויר. בפרויקט הכרטיס הוא קישור (או מכיל קישור), ואותו מצב מופיע גם בפוקוס מקלדת. כרטיס בלי גבול מקבל רק הרמה וצל."},{"id":"css02","name":"קו תחתון שנמתח (RTL-נכון)","cat":"css","desc":"קו שנמתח מתחת ללינק מכיוון הקריאה. הסוד: transform-origin לוגי שמתהפך נכון בעברית.","when":"לינקים בניווט ובטקסט רץ. הקו נמתח גם בפוקוס מקלדת, וההובר רק במכשיר עם עכבר (בטלפון נגיעה בקישור עוגן לא משאירה קו תקוע). 0.16 שנייה, כי מרחפים על ניווט עשרות פעמים."},{"id":"css03","name":"מילוי כפתור מהצד","cat":"css","desc":"רקע הכפתור מתמלא בצבע מהצד בהובר, והטקסט מתהפך.","when":"כפתורים משניים באתרי אופי. לא בעור השקט (שם ההובר הוא הכהיה). צבע הטקסט בהובר הוא צבע הרקע של העור ולא לבן קבוע, כך שגם בעור כהה הכפתור נקרא. המילוי נכנס מצד תחילת הקריאה (מימין בעברית, משמאל באתר LTR), גם בפוקוס מקלדת, וההובר רק במכשיר עם עכבר."},{"id":"css05","name":"כניסת Blur-In","cat":"css","desc":"האלמנט נכנס מטושטש ומתחדד למקומו. תחושה יוקרתית בלי אף ספרייה.","when":"ויז'ואלים וכותרות באתרי פרימיום. ההסתרה יושבת מאחורי המחלקה js שהסקריפט שם על html: אם הסקריפט לא רץ, הוויז'ואל פשוט גלוי."},{"id":"css06","name":"אקורדיון חלק","cat":"css","desc":"פתיחה וסגירה חלקות עם הטריק המודרני: grid-template-rows מ-0fr ל-1fr, בלי JS שמודד גבהים.","when":"שאלות ותשובות, מפרטים. הכפתור מדווח aria-expanded, ותשובה סגורה מקבלת visibility:hidden אחרי שהסגירה נגמרת, כך שקורא מסך לא מקריא אותה וטאב לא נוחת על קישור שבתוכה."},{"id":"css07","name":"ספינר + שלוש נקודות","cat":"css","desc":"שני מצייני הטעינה הקלאסיים: טבעת מסתובבת ושלוש נקודות מדלגות.","when":"טעינות קצרות. לטעינת תוכן ארוכה עדיף שלד (B15). כל מחוון נושא role=\"status\" ושם (\"טוען\"), כדי שקורא מסך יודע שמשהו נטען. בהפחתת תנועה הטבעת ממשיכה להסתובב לאט והנקודות עומדות מעומעמות, כדי שהמחוון לא ייראה תקוע."},{"id":"css08","name":"ברק חולף על טקסט","cat":"css","desc":"פס אור שחולף על הכותרת בלולאה. עדין ויוקרתי.","when":"כותרת הירו או לוגו טקסטואלי. אחד לעמוד."},{"id":"css09","name":"רעידת שגיאה","cat":"css","desc":"שדה שנרעד אופקית כששולחים ערך לא תקין. פידבק שמרגישים בלי לקרוא.","when":"ולידציית טפסים. תמיד יחד עם הודעת טקסט, לא במקומה: ההודעה מקושרת לשדה (aria-describedby) ומוכרזת (aria-live), והשדה מסומן aria-invalid. בהפחתת תנועה אין רעידה, והגבול האדום וההודעה עושים את העבודה."},{"id":"css12","name":"גבול גרדיאנט מסתובב","cat":"css","desc":"מסגרת גרדיאנט שמסתובבת סביב הכרטיס בלולאה. אפקט פרימיום מודרני.","when":"כרטיס מודגש אחד: ההצעה המרכזית, באדג' AI."},{"id":"css13","name":"טקסט גרדיאנט נושם","cat":"css","desc":"כותרת בגרדיאנט שזז לאט הלוך ושוב. חיים בלי הסחת דעת.","when":"כותרת הירו או מילת מפתח באתרי טק ופרימיום."},{"id":"css15","name":"כרטיס תלת-ממד עוקב עכבר","cat":"css","desc":"הכרטיס מוטה בעדינות לכיוון הסמן, עם הבזק אור שנע על הפנים.","when":"כרטיס מוצר או הצעה מרכזית. אחד-שניים לעמוד, דסקטופ בלבד: הכרטיס מוטה רק כשיש עכבר ולא ביקשו הפחתת תנועה, ובטלפון הוא נשאר שטוח."},{"id":"css16","name":"זום פנימי בהובר","cat":"css","desc":"התמונה גדלה בתוך המסגרת החתוכה. הקלאסיקה שכל גלריה צריכה.","when":"כרטיסי בלוג, גלריות, קטגוריות חנות. ההובר רק במכשיר עם עכבר (בטלפון נגיעה לא משאירה תמונה מוגדלת), אותו זום בפוקוס מקלדת על הכרטיס או על קישור בתוכו, ובהפחתת תנועה התמונה לא זזה."},{"id":"css17","name":"פס התקדמות קריאה","cat":"css","desc":"פס בראש המסך שמתמלא עם התקדמות הגלילה. מומש כולו ב-CSS עם animation-timeline: scroll().","when":"מאמרים ועמודים ארוכים. תמיכה: כרום ואדג'. ספארי (כנראה מגרסה 26) ופיירפוקס: לאמת מול caniuse לפני שמבטיחים ללקוח. בדפדפן בלי תמיכה הפס פשוט לא מופיע, בלי שבירה; כשצריך אותו בכל דפדפן, מוסיפים fallback של JS שמעדכן scaleX בגלילה."},{"id":"css19","name":"מרקי אנכי (עדויות)","cat":"css","desc":"טור עדויות שזורם כלפי מעלה בלולאה, עם מסכת קצוות ועצירה בהובר.","when":"הוכחה חברתית כשיש הרבה עדויות קצרות. הסט המשוכפל של הלופ עטוף ב-aria-hidden ו-inert, כך שכל עדות מוקראת פעם אחת. padding-bottom בגודל ה-gap סוגר את הלופ בלי קפיצה. בהפחתת תנועה הטור עומד ומציג את העדויות במלואן, בלי מסכה ובלי העותק."},{"id":"css20","name":"הבזק אור על כפתור","cat":"css","desc":"פס אור אלכסוני שחולף על הכפתור כל כמה שניות ומזכיר את קיומו.","when":"ה-CTA הראשי בעמוד. אחד בלבד."},{"id":"css21","name":"טוגל ומתג מונפשים","cat":"css","desc":"מתג הפעלה וצ'קבוקס עם וי שמצויר: המיקרו-אינטראקציות שגורמות לטופס להרגיש חי.","when":"טפסים, הגדרות, בחירת מסלול חודשי/שנתי. המתג הוא checkbox אמיתי עם role=\"switch\" ושם נגיש, לשני הפקדים יש טבעת פוקוס במקלדת, ושטח הלחיצה של המתג מורחב לכ-44 פיקסלים בלי לשנות את גודלו."},{"id":"css23","name":"מעבר מצבים חלק (View Transitions)","cat":"css","desc":"החלפת תוכן בלי קפיצה: הדפדפן מצלם את המצב הישן והחדש ומנפיש ביניהם לבד. פריט שנבחר גדל למקומו החדש כי שני הצדדים חולקים אותו view-transition-name.","when":"מעבר מגריד לתצוגת פריט, החלפת טאבים, מיון רשימה. חלופה נטיבית ל-Flip כשלא רוצים ספרייה. בדפדפן שלא תומך התוכן פשוט מתחלף מיד, בלי שבירה."},{"id":"css24","name":"מרקר שנמתח מאחורי מילה","cat":"css","desc":"מילה שמקבלת פס צבע מאחוריה, נמתח מימין לשמאל בזמן שהיא נכנסת למסך. בלי JS: הרקע הוא גרדיאנט שגדל, והתזמון מגיע מ-animation-timeline של הגלילה.","when":"הדגשת מילת מפתח במשפט פתיחה, ציטוט, הבטחה מרכזית. אחת או שתיים בעמוד, אחרת זה הופך לצבע ולא להדגשה."},{"id":"b34","name":"גריד מסונן עם מעבר חלק","cat":"behavior","desc":"שורת קטגוריות מעל גריד. לחיצה מסננת, והפריטים שנשארים מחליקים למקומם החדש במקום להיעלם ולקפוץ. הנעלמים דוהים והחדשים נכנסים.","when":"תיק עבודות, קטלוג מוצרים, תפריט מסעדה, רשימת שירותים, מאמרים, צוות. הרכיב הזה הופיע ביותר ממחצית האתרים שנסרקו."},{"id":"b35","name":"ציר תהליך אנכי עם קו שמתמלא","cat":"behavior","desc":"שלבים אחד מתחת לשני, וקו אנכי שמתמלא בקצב הגלילה. כל שלב נדלק כשהקו מגיע אליו, והמספר שלו מתמלא בצבע.","when":"איך עובדים איתנו, מסלול טיפול, שלבי פרויקט, מה קורה אחרי שמשאירים פרטים. הגרסה האנכית עובדת מצוין במובייל, בניגוד לציר אופקי."},{"id":"b36","name":"טופס רב-שלבי עם התקדמות","cat":"behavior","desc":"שאלה אחת בכל מסך במקום טופס ארוך ומפחיד. פס התקדמות למעלה, מעבר מונפש בין השלבים, ולידציה לפני מעבר, וסיכום לפני שליחה.","when":"כל טופס שמבקש יותר משלושה שדות: בקשת הצעת מחיר, קביעת תור, שאלון אפיון, חישוב עלות. מעלה השלמות מול טופס אחד ארוך."},{"id":"b37","name":"כרטיסים שנערמים בגלילה","cat":"behavior","desc":"כל כרטיס נעצר בראש המסך והבא אחריו מטפס מעליו, בזמן שהקודם מתכווץ מעט ומתעמעם. נוצרת ערימה במקום רשימה ארוכה.","when":"שירותים, חבילות, יתרונות, שלבי עבודה. מכווץ ארבעה סקשנים לאורך של אחד, ועובד מצוין גם במובייל."},{"id":"b38","name":"הדר שמתחבא בגלילה וחוזר","cat":"behavior","desc":"בגלילה למטה ההדר מחליק החוצה ומפנה מסך, ובגלילה קלה למעלה הוא חוזר מיד. בראש העמוד הוא שקוף ומתמלא ברקע ברגע שיוצאים מהירו. כאן הוא רץ בתוך מסגרת גלילה עצמאית, כדי שאפשר יהיה לשפוט אותו בלי ההדר של המאגר מעליו.","when":"כל אתר. זו התנהגות ההדר הנפוצה ביותר, והיא פותרת את הקונפליקט בין ניווט תמיד זמין לבין מסך נקי לתוכן."},{"id":"b39","name":"תפריט נפתח עם פאנל מונפש","cat":"behavior","desc":"פריט בתפריט שפותח פאנל רחב עם קישורים מקובצים. נפתח בהובר בדסקטופ ובלחיצה במגע, נסגר ב-Escape או בלחיצה בחוץ, ורק אחד פתוח בכל רגע.","when":"אתרים עם יותר מחמישה עמודים: קטלוג, שירותים לפי תחום, אזור לקוחות. מונע תפריט עמוס ומאפשר להסביר כל קטגוריה במילה."},{"id":"b40","name":"פוטר שנחשף מאחורי העמוד","cat":"behavior","desc":"הפוטר יושב קבוע מאחורי התוכן, והעמוד מחליק מעליו כמו וילון. בסוף הגלילה הוא נחשף במלואו, בלי אנימציה, ושורת JS אחת רק מודדת את גובהו.","when":"כל אתר תדמית או פורטפוליו. נותן סיום מכובד לעמוד ומרוויח מקום לפרטי קשר גדולים, בלי להאריך את הגלילה."},{"id":"b41","name":"סקשן מוצמד שהתוכן בו מתחלף בגלילה","cat":"behavior","desc":"רשימת נושאים שנשארת במקום, וכל אחד נפתח מעצמו כשמגיע תורו בגלילה, יחד עם התמונה שמתחלפת לצידו. אקורדיון שהגלילה מפעילה במקום לחיצה.","when":"פיצ'רים, שירותים, שלבי עבודה, יתרונות. הדפוס הזה חזר שש פעמים באוסף הקלונאבלס של Webflow ועוד פעם ב-21st.dev, והוא מחליף ארבעה סקשנים בסקשן אחד."},{"id":"b42","name":"מרקי שמגיב למהירות הגלילה","cat":"behavior","desc":"רצועה שזורמת לבד, מאיצה כשגוללים מהר, מתהפכת בכיוון כשגוללים אחורה, ומתעוותת קלות לפי המהירות. כשעוצרים היא חוזרת לקצב הבסיס, בכיוון של הגלילה האחרונה.","when":"רצועת לוגואים, פס אמון, כותרות ענק, שמות שירותים. שדרוג ישיר של מרקי רגיל: הוא מרגיש חי במקום לולאה מכנית."},{"id":"b43","name":"מחשבון עם סליידר וגרף חי","cat":"behavior","desc":"סליידר אחד שמזיז את כל המסך: העמודות משנות גובה, המספרים מתעדכנים, והשורה התחתונה מחושבת בזמן אמת.","when":"הערכת מחיר, החזר על השקעה, חיסכון חודשי, גודל חבילה. עונה על \"כמה זה יעלה לי\" בלי טופס, ומכשיר את הליד לפני שהוא פונה."},{"id":"b44","name":"סקשן תמחור עם השוואה והדגשת חבילה","cat":"behavior","desc":"שלוש חבילות זו לצד זו, אחת מודגשת כמומלצת, ומתג שמחליף בין תצוגת כרטיסים לטבלת השוואה מלאה. הכרטיסים נכנסים בהדרגה, והמומלצת ראשונה.","when":"כל עסק שמוכר חבילות: אתרים, טיפולים, מנויים, תחזוקה, ליווי. הסקשן שקובע אם הליד פונה או ממשיך לחפש."},{"id":"b45","name":"החלפת תצוגה בין גריד לרשימה","cat":"behavior","desc":"מתג אחד שמחליף בין גריד כרטיסים לרשימה שורות, והפריטים מחליקים בין שתי הפריסות במקום לקפוץ. גם התמונות והטקסט זזים יחד.","when":"תיק עבודות, קטלוג מוצרים, בלוג, מקרי לקוח, רשימת נכסים. המבקר בוחר איך נוח לו לסרוק, וזה מגדיל את הסיכוי שיישאר."},{"id":"b46","name":"עמודות שנפתחות בהובר","cat":"behavior","desc":"שורת עמודות שרק אחת מהן פתוחה. מעבר עכבר פותח את הבאה וסוגר את הקודמת, והרוחב נע ברציפות. בעמודה סגורה הכותרת יושבת אנכית ברצועה, ובפתוחה מתחלפת בכותרת מלאה עם טקסט.","when":"קטגוריות שירות, תחומי התמחות, ענפים, צוות. סקשן אחד שמציג ארבעה עד שישה נושאים בלי לגלול ובלי מודאל."},{"id":"g47","name":"אלמנט שנוסע בין תחנות לאורך הגלילה","cat":"gsap","desc":"פריט אחד שעובר בין מסגרות ריקות שפזורות לאורך העמוד: משנה מקום, גודל וזווית תוך כדי גלילה, כאילו הוא מלווה את הקורא משלב לשלב.","when":"תהליך עבודה, מסע לקוח, הצגת מוצר בכמה הקשרים. במקום ארבע תמונות נפרדות יש אובייקט אחד שממשיך, וזה מה שיוצר את תחושת הרצף."},{"id":"lm1","name":"שכבות סחיפה","cat":"lm","desc":"אלמנטים צפים שנסחפים במהירויות שונות בגלילה, עם הטיה קלה. במרכז המסך כל שכבה יושבת במקום שעוצבה, ומשם היא נסחפת לשני הכיוונים. שכבה איטית מרגישה רחוקה, מהירה מרגישה קרובה.","when":"הירו וסקשני אווירה. עד 4 שכבות לסקשן. נכרה מכל האתרים של ליאב (מדרג 1/2/4)."},{"id":"lm3","name":"הצטלבות (Converging)","cat":"lm","desc":"זוג בלוקים שמתקרבים משני צדדים בקצב הגלילה ונפגשים במרכז. המרחק ביניהם הוא ההתקדמות, והסימן במפגש מסתובב ונדלק כשהם נוגעים. קדימה ואחורה.","when":"לפני/אחרי, בעיה/פתרון, שני צדדים של סיפור. פעם-פעמיים בעמוד."},{"id":"lm4","name":"ערימה דביקה מדורגת","cat":"lm","desc":"כרטיסים שנערמים זה על זה בגלילה עם offset מדורג. כל כרטיס נדבק מעט נמוך מקודמו.","when":"למה דווקא אנחנו 01-04, שלבי שירות. עד 5 כרטיסים."},{"id":"lm5","name":"סולם כניסות הירו (150ms)","cat":"lm","desc":"רכיבי ההירו נכנסים בזה אחר זה במדרגות של 150 אלפיות: לוגו, ניווט, כותרת, ליד, כפתורים.","when":"רגע הזהות בלבד. בשאר העמוד reveal אחיד בלי סטאגר. החריג המאושר."},{"id":"lm7","name":"אוצר ההובר: לחיצה / הרמה / צמיחה","cat":"lm","desc":"שלוש משפחות ההובר של שכבת הבסיס: מדיה נלחצת פנימה (0.97), כרטיס תוכן מתרומם 5 פיקסלים למעלה עם צל עמוק יותר, ו-CTA צומח. משפחה אחת לאלמנט, לעולם לא שתיים.","when":"כל אתר, גם שקט: זו משפחת ההובר של שכבת הבסיס (engine/motion.md 2 ו-3). הבחירה לפי סוג האלמנט, ורק על מה שבאמת לחיץ."},{"id":"lm8","name":"מרקי מוטה ונגרר","cat":"lm","desc":"רצועה שזורמת בלולאה, מוטה 3 מעלות, וגם נגררת עם הגלילה. שתי תנועות מצטברות.","when":"פסי אווירה באתרי וואו. פעם אחת בעמוד."},{"id":"lm9","name":"צל מוזח קשיח + רדיוס חד-צדדי","cat":"lm","desc":"שני מהלכי הקרפט מהעבודה החדשה: צל קשיח בצבע מותג בהיסט 45 מעלות, ורדיוס שמעוגל רק בצד אחד.","when":"כרטיסי מפתח בעורות עם אופי. שפת צל אחת לעמוד: או מוזח או רך, לא שניהם."},{"id":"b47","name":"סליידר השוואה לפני ואחרי","cat":"behavior","desc":"שתי תמונות באותה מסגרת וידית שנגררת ביניהן. גרירה ימינה או שמאלה חושפת יותר מכל צד, וגם החצים במקלדת מזיזים אותה.","when":"שיפוץ, שיניים, אסתטיקה, כושר, ניקיון, עיצוב מחדש, לפני ואחרי של אתר. ההוכחה החזקה ביותר שיש: הלקוח רואה את ההבדל במקום לקרוא עליו."},{"id":"b48","name":"ניווט עם התקדמות לפי סקשן","cat":"behavior","desc":"תפריט עוגנים צף שבו הפריט של הסקשן הנוכחי מתמלא בהדרגה תוך כדי הגלילה בו, ומתרוקן כשעוברים הלאה. אין הבהוב של \"פעיל\" או \"לא פעיל\".","when":"עמוד נחיתה ארוך, עמוד שירות, מסמך תנאים, מדריך. המבקר יודע כל הזמן איפה הוא ברצף וכמה נשאר, וזה מוריד נטישה באמצע."},{"id":"b49","name":"טאבים שמתקדמים לבד עם פס זמן","cat":"behavior","desc":"שורת טאבים שמתחלפת מעצמה, כשמתחת לכל כותרת רץ פס שמראה כמה זמן נשאר. מעבר עכבר עוצר, לחיצה קופצת לטאב ועוצרת את ההתקדמות האוטומטית, והכל מתחיל רק כשרואים את הסקשן.","when":"הצגת יכולות, שלבי שירות, סוגי לקוחות, פיצ'רים. המבקר רואה את כל התוכן גם אם לא לחץ על כלום, וזה בדיוק מה שקורה ברוב הביקורים."},{"id":"b50","name":"מתג מצב כהה עם מעבר וזיכרון","cat":"behavior","desc":"כפתור שמחליף בין בהיר לכהה בגל עגול שנפתח מהכפתור עצמו. הבחירה נשמרת לביקור הבא, וברירת המחדל היא ההגדרה של המכשיר.","when":"בלוג, תיק עבודות, מערכת, דוקומנטציה, כל אתר שקוראים בו הרבה. מצב כהה הוא היום ציפייה בסיסית, והמעבר הוא ההזדמנות להראות איכות בשנייה אחת."},{"id":"b51","name":"באנר עוגיות עם הגדרות וזיכרון","cat":"behavior","desc":"באנר שעולה מלמטה עם שלוש אפשרויות: אישור הכל, רק ההכרחיות, או פאנל הגדרות עם מתגים לכל קטגוריה. הבחירה נשמרת, ויש כפתור קטן לשנות אותה אחר כך.","when":"כל אתר לקוח בלי יוצא מן הכלל. הרכיב מטפל בממשק ובשמירת הבחירה; אילו קטגוריות קיימות ומה הניסוח המשפטי זו החלטה של הלקוח ושל עורך הדין שלו."},{"id":"g48","name":"פסקה שנצבעת מילה-מילה בגלילה","cat":"gsap","desc":"פסקת מניפסט שמתחילה אפורה ונצבעת מילה אחרי מילה בקצב הגלילה, כשמילות המפתח מקבלות הדגשה צבעונית שנפתחת מאחוריהן.","when":"סקשן \"מי אנחנו\", אמירה עסקית, ערכים, פתיח למאמר. הדפוס הזה חזר בשלושה קלונאבלס נפרדים, והוא הופך פסקה שאף אחד לא קורא לרגע שעוצרים בשבילו."},{"id":"b52","name":"הירו שמתקפל לתפריט דביק","cat":"behavior","desc":"הירו במסך מלא שמתכווץ בגלילה עד שהוא הופך לרצועת תפריט, ואז נשאר דבוק למעלה לשארית העמוד. אותו אלמנט לכל אורך הדרך, בלי החלפה בין שני מצבים.","when":"עמוד בית, עמוד שירות, תיק עבודות. פותר את המעבר המגושם בין הירו לתפריט הדביק, ונותן לגלילה הראשונה תחושת כוונה."},{"id":"b53","name":"מילים שמתעבות לפי קרבת הסמן","cat":"behavior","desc":"כותרת או תפריט שבהם כל מילה מתעבה ככל שהעכבר מתקרב אליה ונרגעת כשהוא מתרחק. תנועה רציפה, בלי מצבי הובר בינאריים.","when":"תפריט ראשי, כותרת הירו, רשימת שירותים, פוטר. מיקרו-אינטראקציה אחת שנותנת לעמוד שלם תחושת חיים, בלי אנימציה שגוזלת תשומת לב."},{"id":"b54","name":"הובר שנכנס מהכיוון שממנו בא הסמן","cat":"behavior","desc":"שכבת הובר שלא מופיעה סתם: היא נכנסת מהצד שממנו העכבר נכנס לכרטיס, ויוצאת לצד שממנו הוא יצא. התנועה עוקבת אחרי היד ולא אחרי הקוד.","when":"גריד עבודות, כרטיסי שירות, צוות, מוצרים, קטגוריות. אותו הובר שיש לכולם, רק שהוא מרגיש נכון במקום מכני. במסך מגע אין הובר, ולכן שם התיאור גלוי בתחתית הכרטיס מההתחלה."},{"id":"b55","name":"מחוון שמחליק בין פריטי תפריט","cat":"behavior","desc":"כדור צבע אחד שיושב מאחורי הפריט הפעיל ומחליק אליו כשעוברים עכבר או בוחרים אחר. משתנה גם ברוחב, ולכן זה עובד עם מילים באורך שונה.","when":"תפריט ראשי, טאבים, מסנני קטגוריה, מתגי תצוגה. אלמנט אחד שהופך שורת קישורים לממשק."},{"id":"b56","name":"טולטיפ נגיש שמתהפך ליד קצה המסך","cat":"behavior","desc":"הסבר קצר שנפתח מעל המילה, עובר מתחתיה כשאין מקום למעלה, ונצמד פנימה כשהוא נוגע בקצה המסך. נפתח גם בפוקוס מקלדת ונסגר ב-Escape.","when":"טבלת מחירים, שדות בטופס, מונחים מקצועיים, דשבורד, תנאי שימוש. במקום להעמיס את העמוד בהסברים, הם נפתחים למי שביקש."},{"id":"g49","name":"וידאו שמתקדם עם הגלילה","cat":"gsap","desc":"סרטון שלא מתנגן לבד: הגלילה היא שמזיזה אותו קדימה ואחורה, פריים אחרי פריים. עוצרים והוא עוצר, גוללים אחורה והוא חוזר.","when":"הדגמת מוצר מכל הזוויות, תהליך ייצור, לפני ואחרי, אנימציית מותג. הרגע שבו המבקר מבין שהוא שולט במה שקורה על המסך."},{"id":"g50","name":"וילון מעבר בין עמודים","cat":"gsap","desc":"לחיצה על קישור לא מכבה את המסך: וילון עולה, מכסה, ורק אז העמוד מתחלף. בטעינה הוא יורד חזרה, כך שהמעבר מרגיש רציף ולא כמו ניתוק.","when":"אתר תדמית רב-עמודי, תיק עבודות, בלוג. הדפוס הכי נפוץ בגלריה, והוא מה שמפריד בין אתר שמרגיש כמו אפליקציה לאתר שמרגיש כמו אוסף קבצים."},{"id":"g51","name":"שתי עמודות שנעות בכיוונים הפוכים","cat":"gsap","desc":"קיר תמונות שבו עמודה אחת עולה עם הגלילה והשנייה יורדת. תנועה קטנה שהופכת גריד סטטי לרקע חי, בלי לגזול תשומת לב מהטקסט.","when":"קיר עבודות, גלריית מוצרים, לוגואים של לקוחות, תמונות צוות, רקע לסקשן המלצות. עובד גם כשיש רק שש תמונות."},{"id":"g54","name":"גריד מפוזר שמתכנס בגלילה","cat":"gsap","desc":"תמונות שמפוזרות בחלל, מסובבות וקטנות, ומתכנסות לגריד מסודר בקצב הגלילה. גוללים אחורה והן מתפזרות בחזרה.","when":"פתיחת סקשן עבודות, קיר לקוחות, גלריית מוצרים, מעבר בין פרק לפרק. רגע אחד שאומר \"יש כאן מישהו ששולט בפרטים\", ואחריו התוכן מתנהג רגיל."},{"id":"g56","name":"מדיה שנפתחת לרוחב מלא בגלילה","cat":"gsap","desc":"תמונה שמתחילה ככרטיס קטן ומעוגל במרכז המסך ונפתחת בגלילה עד שהיא ממלאת את המסך. הכותרת נמוגה באמצע הפתיחה, ומשפט המשך עולה כשהתמונה כמעט מלאה.","when":"פתיחת עמוד בית, מעבר לסקשן מוצר, סוף סיפור מותג. הרגע שבו התמונה מפסיקה להיות איור ומתחילה להיות סצנה."},{"id":"g57","name":"גלגל תמונות שמסתובב בגלילה","cat":"gsap","desc":"תמונות מסודרות על היקף מעגל ענק שרובו מחוץ למסך. הגלילה מסובבת את הגלגל, כל תמונה עולה לראש הקשת בתורה, וכל אחת נשארת ישרה כלפי הצופה.","when":"תיק עבודות, קטלוג שירותים, ציר שנים, גלריית לקוחות. מחליף קרוסלה רגילה ברגע שנשאר בזיכרון, בלי כפתורים ובלי חצים."},{"id":"g58","name":"כותרת ענקית שרואים דרכה את המדיה","cat":"gsap","desc":"מילה אחת בגודל ענק שהאותיות שלה הן חלון: מאחוריהן נעה תמונה בקצב הגלילה. הטקסט הוא המסכה, לא הצבע.","when":"פתיחת עמוד, מעבר בין פרקים, שם המותג בסוף העמוד. רגע יחיד בעמוד, ובדיוק בגלל זה הוא נזכר."},{"id":"g59","name":"כרטיסים שמתקרבים מהעומק בגלילה","cat":"gsap","desc":"כרטיסים שמגיעים מרחוק, מטושטשים וקטנים, וחולפים על פני הצופה אחד אחרי השני בקצב הגלילה. מי שקרוב חד, מי שרחוק מטושטש.","when":"שלבי תהליך, יתרונות, ציטוטי לקוחות, מעבר בין פרקים בעמוד ארוך. נותן לרצף פריטים תחושת מסע במקום רשימה."},{"id":"g60","name":"מילה שמתחלפת בתוך משפט בגלילה","cat":"gsap","desc":"משפט אחד שנשאר על המסך, ומילה אחת בתוכו מתגלגלת ומתחלפת בקצב הגלילה. מתחתיו מתחלף גם משפט המשנה, כך שכל מצב עומד בפני עצמו.","when":"הירו של עמוד הבית, סקשן שירותים, הצהרת מיצוב. במקום לכתוב ארבעה משפטים נפרדים, כותבים אחד שמתגלגל בין ארבע התשובות."},{"id":"g61","name":"תמונה שמתאספת מרצועות בגלילה","cat":"gsap","desc":"התמונה מפורקת לרצועות אנכיות שנעות בכיוונים מתחלפים ובקצב שונה. ככל שגוללים הן מתיישרות, וברגע מסוים התמונה מתאחדת לחתיכה אחת.","when":"מעבר בין פרקים, פתיחת סקשן עבודות, רגע חשיפה של מוצר. עובד גם הפוך: התמונה מתפרקת כשממשיכים לגלול."},{"id":"g62","name":"לפני ואחרי שנחשף בגלילה","cat":"gsap","desc":"שתי תמונות באותה מסגרת, וקו החשיפה נע ביניהן לפי הגלילה במקום לפי גרירה. המבקר לא צריך לדעת שאפשר לגרור, זה קורה לו מעצמו.","when":"שיפוץ, שיניים, אסתטיקה, כושר, ניקיון, עיצוב מחדש, לפני ואחרי של אתר. הגרסה הפסיבית של ההוכחה החזקה ביותר שיש."},{"id":"g63","name":"סקשן שמתקפל כמו דף בגלילה","cat":"gsap","desc":"הסקשן לא נגלל החוצה אלא מתקפל אחורה על ציר עליון, כמו דף שמתהפך, והסקשן הבא נחשף מתחתיו.","when":"מעבר בין פרקים בעמוד ארוך, סוף סקשן הירו, מעבר בין שירות לשירות. הופך את הרווח בין שני סקשנים לרגע במקום לחתך."},{"id":"g64","name":"מדיה שעוברת בין שתי שכבות של הכותרת","cat":"gsap","desc":"אותה כותרת מודפסת פעמיים, אחת מאחורי התמונה ואחת לפניה. התמונה עולה בגלילה ונכנסת בין השתיים, כך שהיא נראית מונחת בתוך הטקסט.","when":"הירו של עמוד הבית, פתיחת סקשן מוצר, שם המותג. אחד מהרגעים הבודדים שגורמים למבקר לעצור ולהסתכל שוב."},{"id":"g65","name":"רצועה אופקית שהפריט במרכזה גדל","cat":"gsap","desc":"רצועת כרטיסים שנעה לרוחב לפי הגלילה האנכית, וכל כרטיס גדל ומתחדד כשהוא מגיע למרכז המסך ומתכווץ כשהוא יוצא ממנו.","when":"תיק עבודות, קטלוג מוצרים, ציר שנים, המלצות. מפנה את תשומת הלב לפריט אחד בכל רגע במקום להציג שורה שטוחה."},{"id":"g66","name":"רקע שמתחלף בין סקשנים בחשיפה מסכתית","cat":"gsap","desc":"רקע אחד קבוע מאחורי כל הסקשנים, שמתחלף בין תמונות בחשיפה מלמטה כשעוברים מסקשן לסקשן. הטקסט נשאר בחזית ורק העולם שמאחוריו משתנה.","when":"עמוד סיפור מותג, שלבי תהליך, פרקי שירות, עמוד אודות. נותן לעמוד ארוך תחושת רצף במקום רצף של קופסאות."},{"id":"g67","name":"קלפים שנפרשים כמניפה בגלילה","cat":"gsap","desc":"ערימת קלפים אחת במרכז שנפרשת בגלילה למניפה, כל קלף בזווית ובגובה משלו, ונאספת בחזרה בגלילה למעלה.","when":"סקשן שירותים, יתרונות, חבילות, צוות. לוקח ארבעה עד שישה פריטים והופך את ההצגה שלהם לרגע אחד במקום לרשימה."},{"id":"editorial","name":"המסגרת העריכתית","cat":"misc","desc":"קונטיינר אחד של 1300, סולם רוחבים צרים שכל בלוק מתכנס אליו לפי תפקידו (1000, 760, 640, 460), וגרידים ייעודיים ברשימה סגורה. אין 12 עמודות, וזו הדוקטרינה. הרוחב והתפקיד של כל בלוק כתובים עליו ב-data-w.","when":"רק כשליאב ביקש מסגרת עריכתית (ברירת המחדל מ-22.9.2026 היא הנוזלית, MV:fluid). מתאימה כשרוצים קריאה ממוסגרת: המרה, שירותים, חנויות, מערכות. התורה: engine/grid.md."},{"id":"fluid","name":"המסגרת הנוזלית (Fluid Frame)","cat":"misc","desc":"העמוד נושם עם רוחב המסך: כותרות, מרזבים וריווחים גדלים וקטנים יחד, תחומים ב-clamp, והטקסט הרץ נשאר תחום ב-measure. אין קונטיינר: הסקשן הוא המסך, והמרזב הוא השוליים. גרור את חלון הדפדפן וראה את הכל משתנה יחד.","when":"ברירת המחדל בכל פרויקט מ-22.9.2026: דפי נחיתה, תדמית, חנויות ואתרי חוויה, גם עתירי תוכן, כי הטקסט הרץ תחום ב-measure. מסגרת אחרת רק כשהוגדרה במפורש. התורה: engine/fluid-frame.md."},{"id":"breakout","name":"מסגרת הפריצה (Breakout Frame)","cat":"misc","desc":"גריד אחד לכל עמוד הקריאה עם ארבע דרגות רוחב בשמות: content (640), popout (760), feature (1000), full. כל ילד רק אומר לאיזו דרגה הוא שייך, בלי דיבים עוטפים. במובייל הפריצות נסגרות מעצמן.","when":"תוכן ארוך: מאמרים, מדריכים, בלוג, שיעורי קורס, עמודי מדיניות, עמוד שירות שמסביר. התורה: engine/breakout-frame.md."},{"id":"bento","name":"מסגרת הבנטו (Bento Frame)","cat":"misc","desc":"העמוד בנוי מלוחות של אריחים בארבעה גדלים סגורים (1×1, 2×1, 1×2, 2×2), בתוך הקונטיינר העריכתי, עם יחידת תא אחת ומרזב אחד. גיבור אחד לכל לוח, הלוח תמיד נסגר, וכל אריח עושה דבר אחד. במובייל שתי עמודות ומפת span שנכתבת מחדש.","when":"עמודי מוצר ו-SaaS, סקירת יכולות, \"למה אנחנו\", תיק עבודות מסכם, עמוד אפליקציה. כשהקורא סורק ולא קורא. התורה: engine/bento-frame.md."},{"id":"modular","name":"המסגרת המודולרית השוויצרית (Modular Frame)","cat":"misc","desc":"12 עמודות ו-baseline של 8 פיקסלים, שש הנחות קנוניות ברשימה סגורה, הכל מיושר לצד ההתחלה, קווי שיער כשלד, ושטח ריק שהוא חלק מהקומפוזיציה. הטיפוגרפיה היא הוויז'ואל.","when":"סטודיו, אדריכלים, צלמים, מוסדות תרבות, מותגי עיצוב ואופנה, B2B פרימיום טיפוגרפי. כשהעמוד צריך להיראות כמו דוח שנתי, לא כמו דף נחיתה. התורה: engine/modular-frame.md."},{"id":"g68","name":"סקשנים שדוחפים זה את זה בגלילה","cat":"gsap","desc":"כל סקשן עולה מלמטה ומכסה את הקודם, בזמן שהקודם נסוג לאחור ומתעמעם. לא גלילה של רשימה אלא חפיסה של מסכים שמתחלפים.","when":"עמוד עם שלושה עד חמישה פרקים שווי משקל: שירותים, יתרונות, שלבים, ערכים. הופך עמוד ארוך לרצף קצר שמרגיש מכוון."},{"id":"g69","name":"חשיפת פיקסלים בגלילה","cat":"gsap","desc":"רשת ריבועים שמכסה את התמונה ונעלמת בגלילה בסדר אקראי, כמו תמונה שנטענת בחיבור איטי. התמונה מתגלה חתיכה אחרי חתיכה.","when":"חשיפת מוצר, פתיחת סקשן עבודות, מעבר בין פרקים. אפקט חשיפה שמרגיש דיגיטלי ולא קולנועי, ומתאים למותגי טק ומוצר."},{"id":"g70","name":"כותרת שמתכווצת ומתעגנת לפינה","cat":"gsap","desc":"כותרת פרק במרכז המסך שמתכווצת בגלילה, נעה לפינה העליונה והופכת לתווית קטנה שמלווה את התוכן. בגלילה אחורה היא חוזרת להיות כותרת.","when":"עמוד ארוך עם פרקים, מדריך, תיק עבודות לפי קטגוריות, מסמך תנאים. המבקר תמיד יודע באיזה פרק הוא נמצא בלי תפריט צף נוסף."},{"id":"g71","name":"שתי תמונות שמחליפות מקומות בגלילה","cat":"gsap","desc":"שתי תמונות זו לצד זו שעוברות אחת על פני השנייה ומחליפות צדדים בגלילה: אחת נסוגה וקטנה, והשנייה גדלה ובסוף עולה קדימה.","when":"השוואה בין שתי אפשרויות, לפני ואחרי, שני קהלים, שני שירותים. מספר ויזואלית שיש כאן שתי אפשרויות שמתחלפות ביניהן."},{"id":"g72","name":"סקשן שמתהפך בין שתי פאות בגלילה","cat":"gsap","desc":"סקשן אחד עם שתי פאות, שמסתובב בגלילה על ציר אנכי ומגלה את הצד השני. אותו שטח מסך מספר שני דברים.","when":"שאלה ותשובה, בעיה ופתרון, לפני ואחרי, שתי חבילות. במקום שני סקשנים זה אחרי זה, אחד שמתהפך."},{"id":"c01","name":"חצי-חצי קלאסי","cat":"comp","desc":"טקסט מול ויז'ואל, 50/50 או 60/40 (טקסט רחב יותר כשהוא העיקר). המבנה הבסיסי של האינטרנט.","when":"הסבר עם המחשה, אודות, פיצ'ר יחיד."},{"id":"c02","name":"חצי-חצי חופף","cat":"comp","desc":"כמו C1, אבל שכבה אחת פולשת לשנייה: כרטיס טקסט שרוכב על הרקע של תמונה שממלאת את כל המסגרת שלה, או ויז'ואל שנשפך מתחת לטקסט.","when":"אותם תכנים כמו C1, כשרוצים עומק ועניין."},{"id":"c03","name":"ציר מדורג (זיגזג)","cat":"comp","desc":"שורות C1 שמתחלפות כיוון: טקסט מימין וויז'ואל משמאל, ואז הפוך. שתיים עד ארבע שורות.","when":"סדרת פיצ'רים או שירותים שכל אחד ראוי לפירוט."},{"id":"c04","name":"גריד כרטיסים","cat":"comp","desc":"שתיים עד ארבע עמודות של פריטים שקולים. ברירת המחדל של האינטרנט, ולכן גם הבנאלית ביותר.","when":"פריטים באמת שקולים: מוצרים, מאמרים, חברי צוות."},{"id":"c05","name":"בנטו","cat":"comp","desc":"גריד עם תאים בגדלים שונים: תא גיבור 2 על 2, השאר קטנים. כל תא עולם משלו.","when":"תוכן מעורב סוגים (מספר, תמונה, טקסט, גרף), פיצ'רים עם היררכיה."},{"id":"c06","name":"ציר אנכי ממוספר","cat":"comp","desc":"עמוד שדרה אנכי (קו ומספרים 01 עד 04) שהתוכן נתלה עליו לסירוגין או בצד אחד.","when":"תהליך, שלבים, טיימליין, \"איך זה עובד\"."},{"id":"c07","name":"מילה ענקית ולוויינים","cat":"comp","desc":"מילה או מספר ענק (8 עד 14vw) כמרכז הקומפוזיציה, ופריטי תוכן קטנים מרחפים סביבו או נערמים לצדו.","when":"הצהרת מותג, מספר גיבור (שנות ניסיון, לקוחות), רגע דרמטי."},{"id":"c08","name":"עריכתי, טקסט עוטף","cat":"comp","desc":"פריסת מגזין: ויז'ואל נטוע בתוך גוש הטקסט (float) או טור טקסט צר עם הערות שוליים ויזואליות.","when":"סיפור, אודות ארוך, מאמר, תוכן שרוצים שירגיש \"כתבה\"."},{"id":"c09","name":"שכבות צפות","cat":"comp","desc":"ויז'ואל מרכזי אחד, ועליו או סביבו שניים עד ארבעה כרטיסים קטנים צפים: סטטיסטיקה, תג, ציטוט מיני.","when":"הירו, מוצר גיבור, הדגמת מערכת (צילום מסך ונתונים צפים)."},{"id":"c10","name":"פס רץ (Band)","cat":"comp","desc":"רצועה צרה מקצה לקצה שחוצה את העמוד: לוגואים רצים, שורת מספרים, ציטוט יחיד, רצועת CTA.","when":"הפוגה בין סקשנים כבדים, הוכחה חברתית, הנעה ביניים."},{"id":"c11","name":"מסך מפוצל דביק","cat":"comp","desc":"צד אחד קבוע (sticky: כותרת, ויז'ואל או ניווט משנה) בזמן שהצד השני גולל תוכן ארוך.","when":"רשימה ארוכה עם הקשר קבוע: תפריט, מפרט, שלבי שירות, עמודי פורטפוליו."},{"id":"c12","name":"מסדרון אופקי","cat":"comp","desc":"שורת פריטים שגולשת אופקית עם peek, הפריט הבא מציץ. קרוסלה שהיא פריסה, לא וידג'ט.","when":"גלריות, המלצות רבות, מוצרים, כשיש יותר פריטים מרוחב."},{"id":"c13","name":"פסיפס אסימטרי","cat":"comp","desc":"פריטים על גריד, אבל עם הסטות מכוונות: גבהים שונים, offset אנכי, רוטציה עדינה של עד שתי מעלות.","when":"פורטפוליו, גלריה, עדויות. תוכן ויזואלי שרוצים שירגיש אנושי ולא תבניתי."},{"id":"c14","name":"מונולוג ממורכז","cat":"comp","desc":"בלוק טקסט יחיד ממורכז על רקע נקי או אווירה: הצהרה, ציטוט, שאלה. אפס אלמנטים מתחרים.","when":"רגע אווירה, מעבר בין פרקי עמוד, משפט המותג."},{"id":"c15","name":"דו-קומה","cat":"comp","desc":"קומה עליונה: פריט גיבור רחב (רוחב מלא או שני שלישים). קומה תחתונה: שורת שלושה או ארבעה פריטים קטנים.","when":"תוכן עם היררכיה ברורה: מוצר דגל ומשלימים, מאמר ראשי ועוד, שירות עיקרי ומשניים."},{"id":"c16","name":"שער כפול","cat":"comp","desc":"שני בלוקים גדולים זה לצד זה, כל אחד שער לעולם אחר: שני קהלים, שני מסלולים, לפני ואחרי.","when":"פיצול קהלים (\"לעסקים / לפרטיים\"), השוואה, שתי הצעות שקולות."},{"id":"p01","name":"מדורג קלאסי","cat":"rhythm","desc":"רחב, צר, רחב, צר: סקשן עשיר (C3 או C5) ואז ממוקד (C14 או C10) וחוזר חלילה. ברירת המחדל, מקצב נשימה טבעי.","when":"כמעט כל עמוד שאין לו סיבה למקצב אחר."},{"id":"p02","name":"קרשנדו","cat":"rhythm","desc":"הצפיפות והעוצמה עולות לקראת ה-CTA הסופי: פתיחה אוורירית, אמצע עשיר בהוכחות, סגירה אינטנסיבית.","when":"דפי נחיתה ומכירה."},{"id":"p03","name":"נשימות","cat":"rhythm","desc":"אחרי כל שניים או שלושה סקשני תוכן, סקשן אוויר (C14, C10 או אווירה).","when":"עמודים ארוכים ואתרי תדמית פרימיום. האוויר הוא חלק מהיוקרה."},{"id":"p04","name":"סיפור-גלילה","cat":"rhythm","desc":"הסקשנים נקשרים לרצף נרטיבי אחד: אלמנט חוזר (קו, מספור, דמות) מלווה את הגלילה, וכל סקשן ממשיך את קודמו. C6 כעמוד שדרה מלא.","when":"\"איך זה עובד\", אודות, מסע לקוח."},{"id":"p05","name":"סנדוויץ'","cat":"rhythm","desc":"פתיחה וסגירה חזקות (הירו דרמטי ו-CTA דרמטי), אמצע שקט ותכל'סי.","when":"קהל ענייני שרוצה מידע. הדרמה בקצוות, המידע נקי באמצע."},{"id":"s01","name":"סקיאומורפיזם","cat":"style","desc":"אלומיניום מוברש, אנודייז שחור ונייר חם, מואר ממקור אחד למעלה משמאל. בקרים שמתנהגים פיזית: מקש שנלחץ פנימה וחוגה אמיתית שמזיזה את התמונה. כאן כעמוד אמיתי של מעבדת פילם ותיקון מצלמות (דמיונית), בגרסה מרוסנת, לא כמו 2011.","when":"מעבדות ובתי מלאכה: צילום ופילם, שעונים, נגינה ואודיו, אופניים, נגרות, קפה מיוחד, מספרות ישנות, כל עסק שמוכר מגע, מכונה וחומר ורוצה שהאתר ירגיש כמו חפץ שמחזיקים ביד. מתאים כשיש חפץ אחד אמיתי שאפשר לפרק ולתאר, וצילום אמיתי עם אור כיווני."},{"id":"s02","name":"נאומורפיזם","cat":"style","desc":"אותו גוון קר לקרקע ולבקר, צל כפול רך, ומבטא גחלת יחיד. כאן הגרסה הבוגרת: העומק רק על חוגה, בוררים, מתגים ושדות, והטקסט והמצבים נשארים קריאים בלי הצל. עמוד אמיתי של מותג חוגות לקיר (דמיוני) עם לוח בקרה שעובד.","when":"מוצרים פיזיים-דיגיטליים עם בקרים: בית חכם, מדחום וחוגות, נגנים, חיישנים, ציוד אודיו, אפליקציות בקרה ופאנלי הגדרות. כשהאתר מוכר חפץ שמסובבים ולוחצים עליו, ואפשר להראות את הבקר עצמו עובד. מעט אלמנטים, הרבה אווירה, קהל שמעריך שקט."},{"id":"s04","name":"קליימורפיזם","cat":"style","desc":"חימר שנשאר בוגר: חפצים עגולים עם הילה פנימית ובטן, צבעים רוויים בתפקידים קבועים, כפתור שמתכווץ וקופץ, ומעגל חשמלי מחימר שמדליק נורה. בנוי כאתר חוג המצאות לילדים (עסק לדוגמה).","when":"ילדים, הורים, חינוך, חוגים, אונבורדינג ומוצרים חמים שרוצים ידיים ולא זכוכית: כל מקום שבו משטח שאפשר ללחוץ עליו הוא חלק מהמסר."},{"id":"s06","name":"מקסימליזם","cat":"style","desc":"מקסימום, אבל מכוון: צילום אמיתי בשכבות, רצועות צבע, שלושה צבעים עם תפקיד ושורות פוסטרים נעות. כל שיא בא אחרי הפוגה, והצהוב נשמר לכפתור. כאן כעמוד של פסטיבל מוזיקה ואוכל (דמיוני), לא כאוס צבעוני.","when":"מוזיקה, פסטיבלים ואירועים, אופנה ווינטג', קונספט סטורים, ברים ושווקי אוכל, קמפיינים שחיים על אנרגיה ועל תרבות. עסק שמוכר חוויה ושמותר לו להיות רועש, כשיש לו צילום אמיתי של אנשים וצבע."},{"id":"s07","name":"ברוטליזם","cat":"style","desc":"גולמי בכוונה: שדות צבע שטוחים, קצוות חדים, כותרות ענקיות וצל קשיח אחד שמוסט בלי טשטוש. נייר, דיו וכתום, מספרי מערכת במונו וצילום שחור לבן. כאן כעמוד אמיתי של דפוס ריזו (דמיוני), לא שלד צבוע.","when":"סטודיואים, דפוסים ועסקי יצירה, מגזינים ומו״לות, בתי קפה וברים עם אופי, אדריכלות פנים, תערוכות ופסטיבלים, מותגי רחוב ומוזיקה, ומי שהמוצר שלו הוא עמדה. כל עסק שרוצה שיזכרו אותו ולא ישכחו, כשהתוכן ישר וההזמנה פשוטה."},{"id":"s08","name":"ליקוויד גלאס","cat":"style","desc":"זכוכית מעושנת על צילום אמיתי: קצה מבריק, עדשה שנעה על הנתון, ותנועה איטית. הזכוכית היא שכבה מעל הרקע, והתוכן יושב על משטחים רגילים. גרסה 2 (6.10.2026), כוללת את הגלסמורפיזם שהוכנס לארכיון.","when":"פיננסים, פנסיה והשקעות, טכנולוגיה פרימיום, קליניקות יוקרה ומוצרי AI: עסק שמוכר בהירות ואמון ויש לו צילום עשיר או גרדיאנט עמוק לשים מאחורי הזכוכית. עובד טוב כשיש נתון אחד שאפשר להראות דרך עדשה."},{"id":"s09","name":"Soft Modern","cat":"style","desc":"לבנדר ולבן בשכבות, כרטיסים רכים, רדיוסים גדולים ובאדג' חץ בכפתור. דף אמיתי של מרפאת ילדים ומשפחה עם צילום אמיתי: הירו מפוצל עם כרטיסי ממשק צפים, בנטו בשלושה עומקים, ביקור שנדלק שלב אחרי שלב, מסלולים וטופס שקט.","when":"ייעוץ, בריאות, טק, שירותים לבית ולמשפחה, כל עסק שרוצה להיראות מודרני, נגיש ורך בלי להיות ילדותי, ושיש לו צילום אנושי חם."},{"id":"s10","name":"בנטו גריד","cat":"style","desc":"מפה של אריחים בגדלים סגורים: אריח אחד לכל תפקיד (מסר, מספר, צילום, מצב חי, ציטוט, גרף), דיו אחד וסגול אחד בכל לוח, ואפס קווים. כאן כעמוד אמיתי של חברת טעינה לבניינים (דמיונית), עם 'חניון חי' שבו כל אריח הוא חניה.","when":"מוצר ו-SaaS, חברות שירות מודרניות, סטודיו, עמוד יכולות ו'למה אנחנו': כל מקום שהקורא סורק מפה ולא קורא זרם, ושיש בו כמה סוגי מידע (מסר, מספר, צילום, מצב חי, ציטוט, גרף) שכדאי להניח זה לצד זה. עובד עם צילום אמיתי ועם נתונים אמיתיים."},{"id":"s11","name":"ממפיס","cat":"style","desc":"ממפיס של שנות ה-80, מעודכן: צורות גיאומטריות מצוירות, שדות צבע שטוחים בארבעה צבעים, דוגמאות וקצה משולשים, וצילום אמיתי בהיר. כאן כעמוד אמיתי של גלידריה דמיונית, 'כדור ומשולש', שבה הצבע הוא משפחת הטעם והדוגמה היא הטעם.","when":"מותגים שמוכרים שמחה בלי להיות ילדותיים: גלידריות ובתי קפה עם אופי, חנויות ספרים ומשחקים, סטודיו ליצירה וסדנאות, מקומות לאירועים, בתי ספר ומחנות, אפליקציות צעירות. מתאים כשיש מוצר צבעוני או צילום עם שדות צבע נקיים והעסק רוצה להיראות כמו מישהו עם דעה."},{"id":"s12","name":"רטרו שנות ה-70","cat":"style","desc":"חרדל, כתום, חלודה וזית על שמנת עם גרעין. פסים ושמש כתכשיט, חלון קשת לצילום, וכותרת גדולה וטוחה ב-Google Sans. כאן כעמוד אמיתי של השכרת קרוואנים (דמיוני), בלי פונט תקופתי ובלי קליפ-ארט.","when":"מותגי נסיעות, אירוח ופנאי, אוכל וקפה, אופנה ותרבות, סדנאות, סטודיו לעיצוב, כל עסק קטן שהאופי שלו הוא חלק מהמוצר ושהלקוח מגיע אליו מתוך חשק ולא מתוך צורך. האחות הקולנית והגרפית של s14: אותו חום, יותר צבע ויותר צורה."},{"id":"s13","name":"כהה יוקרתי","cat":"style","desc":"השקט של המינימליזם העריכתי, בלילה. קרקע ירוקה-שחורה עם גרעין, שנהב, ואור במקום צבע: מי שמוצג כאן הוא אתר של סטודיו לאדריכלות פנים, עם צילום אמיתי, הירו שנמס לקרקע, ותמונה אחת שהאור שלה נדלק איפה שמסבירים.","when":"עורכי דין, פיננסים, ביטחון ומיגון, אדריכלות ועיצוב פנים, נדל\"ן יוקרתי, טכנולוגיה פרימיום, ואתרי סטודיו עם צילום חזק. כל מי שמוכר סמכות, שקט ואור ולא חום."},{"id":"s14","name":"חם אורגני","cat":"style","desc":"פשתן, טרקוטה וירוק מרווה על נייר עם גרעין. צילום חם אמיתי, צורות עגולות וקצב איטי: מרגיש כמו חדר טיפולים או מאפייה שכונתית באור של בוקר, לא כמו אפליקציה. כאן כעמוד אמיתי של מאפייה ובית קפה (דמיוני), לא שלד צבוע.","when":"מאפיות ובתי קפה, מזון טבעי, קוסמטיקה וסדנאות, קליניקות ומטפלים, יוגה, דולות, סטודיו לקרמיקה ואירוח. כל עסק קטן ושכונתי שמוכר רוגע, מגע וחומר, כשהתוכן הוא הכוכב והצילום אמיתי. האלטרנטיבה החמה והבהירה ל-s05."},{"id":"s15","name":"ניו-דקו","cat":"style","desc":"ארט-דקו של שנות ה-20 בגרסה של 2026: שנהב, בורדו, נחושת ושיש אדום, סריף עם ניגוד חד, תמונות בקשת וקישוט של צורות ממולאות במקום קווים. מרגיש כמו ערב חגיגי בבר של מלון ישן. כאן כעמוד אמיתי של בר קוקטיילים (דמיוני), לא שלד צבוע.","when":"ברים ומסעדות ערב, מלונות בוטיק, תכשיטים ושעונים, מספרות וסלונים יוקרתיים, קליניקות אסתטיקה, יין ואלכוהול, אירועים וחתונות, תיאטרון והופעות. כל עסק שמוכר ערב, טקס או מתנה, ורוצה להיראות חגיגי בלי להיות כהה. הטרנד של Pinterest Predicts 2026 (\"Neodeco\", חיפושי שיש אדום עלו ב-80%)."},{"id":"s05","name":"מינימליזם עריכתי","cat":"style","desc":"רק מה שחייב. מרחב נשימה ענק, טיפוגרפיה חזקה, צבע אחד. השקט הוא הלוקסוס. גרסה 2 (7.9.2026): ברמת סטודיו, מול רף 30 הסעיפים.","when":"פרימיום, פורטפוליו, SaaS מקצועי, חנויות ומערכות, כשהתוכן הוא הכוכב. עור ברירת המחדל."},{"id":"s05d","name":"מינימליזם עריכתי · פרטים","cat":"style","desc":"כל רכיב של העור בכל מצב, בבידוד: כפתורים (3 רמות × 5 מצבים), שדות (5 מצבים), כרטיס, באדג', צ'יפים, eyebrow, מספרים, טאבים, אקורדיון, טבלת השוואה, מפרידים ורדיוסים. זה מה שהעין בודקת בזום 200%.","when":"פרימיום, פורטפוליו, SaaS מקצועי, חנויות ומערכות, כשהתוכן הוא הכוכב. עור ברירת המחדל."},{"id":"a01","name":"מרכוז מזויף","cat":"anti","desc":"כותרת ממורכזת ופסקה שנראית מיושרת לימין, כי text-align:center מרכז רק בתוך קופסת ה-measure שדבוקה לצד ההתחלה.","when":"כל סקשן ממורכז בעמוד שיש בו p{max-width} גלובלי, כלומר כמעט כל עמוד."},{"id":"a02","name":"כפתור תלוי באוויר","cat":"anti","desc":"סקשן מיושר לימין שהכפתור שלו ממורכז, או להפך: הכפתור לא שייך לאף ציר של הסקשן.","when":"כל סקשן עם כפתור סוגר."},{"id":"a03","name":"עמוד שכולו צמוד-ימין","cat":"anti","desc":"כל הסקשנים מיושרים לאותו צד. אין נשימה, אין טקס, הגלילה מונוטונית.","when":"עמודים ארוכים, במיוחד כשכל הסקשנים נבנו מאותה תבנית."},{"id":"a04","name":"מצב \"אין\" שלא נקרא","cat":"anti","desc":"צ'יפ מאפיין שלילי (אין מחסן) שמסומן רק בגבול מקווקו. בלי הצ'יפ החיובי לידו, אי אפשר לדעת שהוא שלילי.","when":"רשימות מאפיינים בוליאניים: נדל\"ן, מפרטים, חבילות."},{"id":"a05","name":"אייקון ענק, טקסט זעיר","cat":"anti","desc":"צ'יפ עם אייקון 28px וטקסט 11px. הטקסט נראה מנופח או מגומד, והצ'יפ לא קריא בזום 100%.","when":"צ'יפים, תגים, שורות מאפיינים עם אייקון."},{"id":"a06","name":"CTA סוגר על לבן ריק","cat":"anti","desc":"סקשן הסגירה של העמוד: כותרת וכפתור על רקע לבן, בלי שום שכבה. במילות ליאב: \"משעמם ברמות\".","when":"הסקשן האחרון לפני הפוטר, בכל עמוד כולל עמודים פנימיים."},{"id":"a08","name":"דקורציה מעל התוכן","cat":"anti","desc":"כתם רקע אבסולוטי שנוסף אחרי התוכן ב-DOM, בלי z-index מפורש, ומכסה את הטקסט.","when":"כל תכשיט מוזרק: בלובים, קווים, צורות, אורורה."},{"id":"a09","name":"זכוכית על לבן","cat":"anti","desc":"כרטיס גלסמורפיזם מעל רקע לבן או חלש. אין מה לטשטש, והזכוכית נעלמת.","when":"כל שימוש ב-backdrop-filter."},{"id":"a10","name":"ברוטליזם מרוכך","cat":"anti","desc":"מסגרת שחורה עבה עם פינה מעוגלת וצל רך. לא ברוטליזם ולא עור אחר, אלא חצי-חצי שנראה כמו טעות.","when":"כל פרויקט בשפה קיצונית."},{"id":"a11","name":"hover בלי transition","cat":"anti","desc":"כפתור שקופץ למצב ה-hover שלו בלי מעבר. נסו: העבירו עכבר על שני הכפתורים.","when":"כל property שמשתנה ב-hover."},{"id":"a12","name":"ריווח אותיות חיובי בעברית","cat":"anti","desc":"טקסט רץ עברי עם letter-spacing חיובי. האותיות מתפרקות למילה, ובמיוחד המילים הקצרות.","when":"כל טקסט רץ. מותר רק על כותרות לטיניות קטנות באותיות גדולות."},{"id":"a13","name":"אותה קומפוזיציה שלוש פעמים","cat":"anti","desc":"שלושה סקשנים רצופים שכולם גריד כרטיסים. העמוד הופך לקטלוג, והקורא מפסיק להבחין בין הסקשנים.","when":"עמודים שנבנו מ\"עוד שלושה כרטיסים\" בכל פעם."},{"id":"a14","name":"טקסט על הנקודה הבהירה","cat":"anti","desc":"טקסט לבן על תמונה, בדיוק במקום שבו התמונה הכי בהירה. הניגודיות נמדדה על הממוצע, לא על הנקודה.","when":"הירו עם תמונה, כרטיס עם תמונת רקע, סקשן CTA."},{"id":"a15","name":"קווים ומסגרות בכל מקום","cat":"anti","desc":"קו מעל כל טור, מסגרת לכל כרטיס, קו מתחת לכל שורה, וקו קטן לפני כל תווית. כל אחד נראה מסודר לבד, וביחד העמוד נראה כמו טבלה שנוצרה אוטומטית.","when":"שורות שירותים, טורי יתרונות, כרטיסי המלצה, פוטר, תוויות סקשן. בעיקר אחרי שמורידים כרטיסים ומחליפים אותם בקווים."},{"id":"a16","name":"מספור וכרטיס תבנית","cat":"anti","desc":"כל סקשן נפתח ב-01, 02, וכל כרטיס בנוי מאותו מכלול: מספר, קטגוריה, כותרת, שורת תיאור וקישור עם חץ, על משטח תכלת מעוגל. כל חלק נראה סביר לבד, וביחד זו התבנית שכל מחולל מוציא.","when":"ראשי סקשן, כרטיסי מדריכים ומאמרים, שירותים, דרכי קשר (01 התקשרו, 02 וואטסאפ, 03 השאירו פרטים)."},{"id":"ar01","name":"דף נחיתה ממומן","cat":"arch","desc":"עמוד אחד, מטרה אחת: ליד. נבנה כקרשנדו, מהצהרה אוורירית דרך הוכחות אל סגירה צפופה.","when":"יעד של מודעות מטא או גוגל. הקורא הגיע מהבטחה ספציפית וצריך לראות אותה מיד."},{"id":"ar02","name":"וואן-פייג'ר לעסק שירות","cat":"arch","desc":"עמוד אחד שמחליף אתר: מי, מה, איך, הוכחה, קשר. תפריט עוגנים ולא עמודים.","when":"עסק קטן עם שירות ברור: מטפל, יועץ, קבלן, סטודיו."},{"id":"ar03","name":"עמוד בית לאתר תדמית","cat":"arch","desc":"עמוד הבית של אתר רב-עמודי: מציג את הרוחב, לא את העומק. כל סקשן פותח דלת לעמוד פנימי.","when":"פירמה, משרד, חברה עם כמה שירותים ועמודים פנימיים."},{"id":"ar04","name":"עמוד שירות פנימי","cat":"arch","desc":"עמוד של שירות אחד באתר רב-עמודי: למי, מה כלול, איך, שאלות, פעולה. ענייני באמצע, חזק בקצוות.","when":"כל שירות שיש לו עמוד משלו. גם עמודי \"תחומי עיסוק\" במשרדים."},{"id":"ar05","name":"עמוד מחירים שקוף","cat":"arch","desc":"המחירים הם התוכן: כמה מוצרים, לכל אחד שלוש חבילות, והקורא בוחר ומשאיר פרטים. הדגם של /start.","when":"עסק שמוכן להראות מחיר לפני שיחה, ורוצה לידים שכבר יודעים כמה זה עולה."},{"id":"ar06","name":"אודות כסיפור","cat":"arch","desc":"עמוד אודות שמספר סיפור בפרקים לאורך עמוד שדרה, במקום פסקה ותמונה.","when":"עסק עם סיפור אמיתי: מייסד, מפנה, דרך. בלי סיפור זה C6 ארוך."},{"id":"ar07","name":"פורטפוליו ועבודות","cat":"arch","desc":"העבודות הן הטקסט. הירו קטן, סינון, גלריית מזונרי, מקרה בוחן אחד מודגש, וסגירה.","when":"סטודיו, מעצב, צלם, אדריכל, כל מי שהעבודה מדברת."},{"id":"ar08","name":"עמוד בית לחנות","cat":"arch","desc":"חנות: מבצע גיבור, קטגוריות, מוצרים נבחרים, למה לקנות כאן, קולקציה, ביקורות, ניוזלטר.","when":"חנות איקומרס (Lovable + Shopify). עמוד הבית הוא חלון ראווה, לא קטלוג."},{"id":"ar09","name":"עמוד מוצר","cat":"arch","desc":"גלריה מול קופסת קנייה, ואז פרטים, מפרט, מוצרים דומים וביקורות. הכל משרת את כפתור ההוספה לסל.","when":"כל מוצר בחנות."},{"id":"ar10","name":"דף תודה","cat":"arch","desc":"אחרי הטופס: אישור ברור, מה קורה עכשיו, ופעולה אחת נוספת (וואטסאפ). קצר.","when":"כל טופס. וגם היעד של אירוע ההמרה בפיקסל."},{"id":"ar11","name":"קורס או וובינר","cat":"arch","desc":"דף מכירה לקורס: וידאו, מה תדעו, סילבוס, מי מלמד, לוח מחיר אחד, שאלות, הרשמה.","when":"קורס דיגיטלי, וובינר, סדנה. הדגם של דף הקורס של ליאב וזיו."},{"id":"ar12","name":"מאמר בבלוג","cat":"arch","desc":"עמוד קריאה: כותרת ומטא, תמונה, גוף במידת measure עם כותרות ביניים וציטוט, ומאמרים קשורים.","when":"בלוג, מדריכים, עמודי SEO. תוכן שנקרא ולא נסרק."},{"id":"css25","name":"בנטו עם כוריאוגרפיית הובר","cat":"css","desc":"גריד בנטו שכל כרטיס בו מגיב להובר בשלוש שכבות בבת אחת: הטקסט עולה, האייקון מתכווץ, וקישור נחשף מלמטה. תנועה אחת שמרגישה כמו שלוש.","when":"סקשן פיצ'רים עם היררכיה (תא אחד גדול, השאר קטנים). חוק התאים הריקים חל: כל תא חייב תוכן אמיתי."},{"id":"css26","name":"קיר אריחים נסחף בפרספקטיבה","cat":"css","desc":"קיר אינסופי של אריחים בפרספקטיבה קלה שנסחף אנכית בלי סוף, כל עמודה בקצב אחר. הובר עוצר את העמודה ומרים אריח.","when":"רקע אווירה חי מאחורי הירו של תיק עבודות, קיר לוגואים של לקוחות, סקשן \"עבדנו עם\". תמיד עם שכבת טקסט מעל."},{"id":"css27","name":"לוויינים במסלול סביב מרכז","cat":"css","desc":"אלמנט מרכזי ושני מסלולים סביבו, שבכל אחד אייקונים מקיפים אותו במהירות וכיוון שונים. האייקונים נשארים זקופים כי הם מסתובבים נגד המסלול.","when":"הצגת אקוסיסטם: אינטגרציות סביב מוצר, כישורים סביב לוגו, שותפים סביב חברה. אחד לעמוד."},{"id":"css28","name":"אדוות רקע מאחורי אלמנט","cat":"css","desc":"מעגלים קונצנטריים שנושמים בגל מאחורי אלמנט מרכזי: כל טבעת מתכווצת מעט וחוזרת, רגע אחרי הקודמת, והחיצוניות כמעט שקופות. שקט מאוד, ונותן לכפתור או ללוגו נוכחות.","when":"מאחורי CTA ראשי, לוגו בהירו, או אייקון \"זמין עכשיו\". עדין מספיק כדי לשבת מאחורי טקסט."},{"id":"css30","name":"מילים שמתבהרות מהערפל","cat":"css","desc":"כותרת שנכנסת מילה אחרי מילה, כל מילה מטושטשת ומעט למטה ומתבהרת למקומה. פיצול למילים בלבד, אף פעם לא לאותיות בעברית.","when":"כותרת הירו או משפט מפתח אחד בעמוד. הפיצול למילים שומר על הקריאות של עברית מחוברת."},{"id":"css31","name":"זוהר צפוני ברקע (בלי WebGL)","cat":"css","desc":"שלושה כתמי צבע מטושטשים שנעים אחד על השני במסלולים מנוגדים ויוצרים רקע גלי רך, כמו זוהר צפוני. אפס JS, אפס WebGL, עובד בכל מכשיר.","when":"רקע הירו באתרי טכנולוגיה ופרימיום כהים, מאחורי כותרת אחת. אחד לעמוד."},{"id":"css32","name":"קרן אור שזורמת בין שני אלמנטים","cat":"css","desc":"קו SVG מחבר שני כרטיסים, ופולס של אור זורם עליו שוב ושוב ומראה שהם מדברים. דיאגרמה שמרגישה חיה.","when":"איך זה עובד, חיבורי מערכות, אינטגרציות, זרימת נתונים. שניים עד ארבעה קווים לכל היותר."},{"id":"b57","name":"גריד Masonry עם כניסה מונפשת","cat":"behavior","desc":"פריטים בגבהים שונים נארזים בעמודות בלי חורים, נכנסים מלמטה בסטאגר, ומסתדרים מחדש בחלקות כשהחלון משתנה. RTL: העמודה הראשונה מימין.","when":"גלריות ובלוגים עם תמונות בגבהים שונים, תיק עבודות, פיד. כשהגבהים אחידים גריד רגיל עדיף."},{"id":"b58","name":"דוק אייקונים שמתנפחים ליד הסמן","cat":"behavior","desc":"שורת אייקונים שכל אחד מהם גדל ככל שהסמן קרוב אליו, והשכנים גדלים פחות. בדיוק כמו הדוק של מק. במגע הכל נשאר בגודל אחיד.","when":"ניווט צף בתחתית המסך באתרי פורטפוליו ומוצר, סרגל כלים, קישורים חברתיים. דסקטופ בלבד, במובייל זה סרגל רגיל."},{"id":"b59","name":"רשימה חיה שפריטים נכנסים אליה","cat":"behavior","desc":"פריט חדש נכנס לראש הרשימה בקפיצה קטנה, והקודמים נדחפים למטה בחלקות במקום לקפוץ. הרשימה מרגישה כמו פיד חי.","when":"פיד התראות, הדגמת מערכת שעובדת, לוג פעילות, \"מה קרה היום\". מקסימום חמישה פריטים גלויים."},{"id":"b60","name":"וידאו שנפתח מתמונת ההירו","cat":"behavior","desc":"תמונת פתיחה עם כפתור נגן. בלחיצה היא גדלה למודאל וידאו במעבר רציף מהמקום שלה, ובסגירה חוזרת אליו. הוידאו נטען רק בלחיצה.","when":"הירו עם סרטון תדמית. הדרך הנכונה לשים וידאו בלי להכביד על הטעינה הראשונה."},{"id":"b61","name":"משיכה מגנטית לעבר הסמן","cat":"behavior","desc":"כפתור שנמשך בעדינות לעבר הסמן כשהוא מתקרב, עד שליש מהמרחק, וחוזר למקומו כשהסמן מתרחק. מספיק כדי להרגיש שהכפתור \"רוצה\" שילחצו עליו.","when":"CTA ראשי אחד בעמוד, אייקונים חברתיים, לוגו בהדר. דסקטופ בלבד, ולעולם לא על טקסט רץ."},{"id":"b62","name":"קרוסלת עומק תלת-ממדית","cat":"behavior","desc":"כרטיסים על מסילה תלת-ממדית: הפעיל קדימה ובגודל מלא, השאר נסוגים לעומק ומתכהים. גרירה, חיצים, מקלדת ואוטו-פליי שנעצר במגע.","when":"תיק עבודות, מוצרים נבחרים, סיפורי לקוח. שלושה עד שבעה פריטים, כשרוצים נוכחות קולנועית בלי גריד."},{"id":"g74","name":"משקל הפונט זורם בגלילה","cat":"gsap","desc":"כותרת גדולה שהמילים בה מתעבות מדק לשמן בגל שעובר מימין לשמאל, בכיוון הקריאה, עם הגלילה, וחוזר. פונט משתנה עושה את זה בלי שום שכבה נוספת.","when":"כותרת מניפסט, משפט ערך מרכזי, פתיח לסקשן. פעם אחת בעמוד, על פונט משתנה (Google Sans, Ploni Variable)."},{"id":"g76","name":"סמן-תווית שמשתנה לפי האלמנט","cat":"gsap","desc":"עיגול קטן שעוקב אחרי הסמן, ומעל תמונות וקישורים הוא גדל ומקבל מילה: \"צפייה\", \"פתיחה\", \"גרירה\". הסמן הופך להנחיה.","when":"גלריות עבודות, רשימות פרויקטים, קרוסלות. דסקטופ בלבד: במגע הסמן לא קיים והתווית עוברת לכיתוב קבוע על הפריט."},{"id":"g77","name":"כותרת מקו מתאר למילוי בגלילה","cat":"gsap","desc":"כותרת ענקית שמתחילה כקו מתאר בלבד, והמילים מתמלאות בצבע אחת אחרי השנייה ככל שגוללים. הקריאה נעשית פיזית.","when":"מניפסט, משפט ערך, כותרת סקשן דרמטית באתרי סטודיו וסוכנויות. אחת לעמוד."},{"id":"g78","name":"חזרה למעלה עם טבעת התקדמות","cat":"gsap","desc":"כפתור עגול בפינה שמופיע אחרי מסך אחד, וטבעת סביבו מתמלאת לפי כמה מהעמוד כבר נקרא. לחיצה גוללת חלק למעלה.","when":"כל עמוד ארוך: בלוג, מחירון, עמוד שירות. הטבעת נותנת תחושת מקום בלי פס התקדמות בראש העמוד."},{"id":"g79","name":"מוצר מוצמד עם קריאות שנדלקות בגלילה","cat":"gsap","desc":"תמונת מוצר או מסך נשארת במקום, ובזמן הגלילה נדלקות סביבה קריאות (callouts) אחת אחרי השנייה: נקודה על התמונה ותיאור שנדלק בעמודה לצידה. סיור מודרך במוצר בלי לחיצות.","when":"עמוד מוצר, מערכת, אפליקציה, מכשיר. שלוש עד חמש קריאות, לא יותר."},{"id":"g81","name":"פרלקס עכבר בהירו","cat":"gsap","desc":"שכבות ההירו (רקע, תמונה, כותרת, תג צף) זזות בעדינות בכיוון הסמן, כל אחת בעומק אחר. תחושת תלת-ממד בלי שום ספרייה תלת-ממדית.","when":"הירו עם ויז'ואל מרכזי: מוצר, אפליקציה, דמות. דסקטופ בלבד. במובייל השכבות עומדות, או זזות מעט עם הגלילה."},{"id":"g82","name":"הטיה לפי מהירות הגלילה","cat":"gsap","desc":"כרטיסים או תמונות שנוטים קלות בכיוון הגלילה ככל שגוללים מהר, ומתיישרים ברגע שעוצרים. העמוד מרגיש שיש לו משקל.","when":"גריד עבודות, רשימת מוצרים, פיד תמונות. כל מה שגוללים דרכו מהר. לא על טקסט רץ."},{"id":"g83","name":"תג טקסט מעגלי שמסתובב","cat":"gsap","desc":"תג עגול שהוא קישור: טקסט שרץ על המעגל סביב חץ פעולה, מסתובב לאט, מאיץ כשגוללים ובריחוף, ונרגע בחזרה. האותיות מפוזרות לפי הרוחב האמיתי שלהן, כך שהמרווח ביניהן אחיד.","when":"ליד CTA או בפינת הירו: \"זמינים לפרויקטים\", \"שיחת היכרות\", \"לתיק העבודות\". אחד לעמוד, 120 עד 170 פיקסלים. לא כרמז גלילה (\"גלול למטה\" הוא תג AI אסור, SKILL 11ב)."},{"id":"g84","name":"סקשן יוצא מפוקוס כשהבא נכנס","cat":"gsap","desc":"בזמן שהסקשן הבא עולה מלמטה, הקודם מתכווץ מעט, מתטשטש ומתכהה, כאילו הוא נשאר מאחור. מעבר עמוק בין פרקים בלי מסכות.","when":"בין פרקי סיפור באתר תדמית פרימיום: הירו לערכים, ערכים לעבודות. שניים עד ארבעה מעברים בעמוד."},{"id":"g85","name":"זרקור על כרטיסים אחרי הסמן","cat":"gsap","desc":"גריד כרטיסים כהה שמסגרת של כל כרטיס נדלקת בעדינות היכן שהסמן קרוב, וזרקור רך זז בתוך הכרטיס. אפקט של פאנל טכנולוגי.","when":"גריד פיצ'רים או יתרונות באתרי SaaS ומערכות, על רקע כהה. דסקטופ: זרקור. מגע: מסגרת קבועה עדינה."},{"id":"g86","name":"אייקוני קו שמציירים את עצמם בכניסה","cat":"gsap","desc":"אייקוני קו בסקשן היתרונות נכנסים כשהקו מצייר את עצמו מהתחלה לסוף, בסטאגר, והטקסט עולה מתחתיו. במקום אייקון שקופץ, אייקון שנולד.","when":"סקשן יתרונות, שלבים, שירותים, כל מקום עם אייקוני קו. שלושה עד שישה."},{"id":"g87","name":"מחיקת צבע שחושפת טקסט","cat":"gsap","desc":"פס צבע עובר על השורה מימין לשמאל, ומאחוריו הטקסט כבר שם. כמו מברשת שמגלה במקום מכסה. שורה אחרי שורה.","when":"כותרות סקשן, ציטוטים, שלוש נקודות חשובות. כניסה עם אופי בלי לשבור את הפריסה."},{"id":"g89","name":"מעבר דרך הכותרת (Zoom Through)","cat":"gsap","desc":"כותרת ענקית היא חור במסך אטום. בגלילה החור גדל עד שהצופה עובר דרך האותיות אל הסצנה שמאחור. פתיחה קולנועית לעמוד.","when":"הירו של אתר תדמית פרימיום, פתיחת קמפיין, מעבר לסקשן הגיבור. פעם אחת בעמוד, בראש."},{"id":"g90","name":"שכבות מוצר שמתפרקות ומתחברות","cat":"gsap","desc":"מוצר שמוצג כערימת שכבות באיזומטריה. בגלילה השכבות מתרחקות זו מזו, כל אחת מקבלת תווית, ובסוף חוזרות ומתחברות. תרשים מפורק (exploded view) חי.","when":"מוצר עם שכבות אמיתיות (מזרן, נעל, מכשיר, ארכיטקטורת מערכת, חבילת שירות). שלוש עד חמש שכבות."},{"id":"g91","name":"טקסט שנוסע במנהרה לעומק","cat":"gsap","desc":"שורות טקסט מונחות זו אחרי זו בעומק. הגלילה מסיעה את הצופה קדימה: כל שורה גדלה, חולפת על פניו ונעלמת, והבאה מגיעה מהרחוק. מניפסט שנקרא כמו מסע.","when":"מניפסט, ערכים, \"מה אנחנו מאמינים\", פתיחת סיפור מותג. ארבע עד שבע שורות קצרות."},{"id":"g92","name":"חפיסה שמתהפכת קלף אחר קלף","cat":"gsap","desc":"ערימת קלפים מוצמדת למסך. כל גלילה הופכת את הקלף העליון על צירו האופקי, חושפת את הבא, והקלף ההפוך נעלם מאחור. עדויות או יתרונות בקצב של קריאה.","when":"עדויות, שאלות ותשובות, ארבעה עד שישה יתרונות. כשרוצים שהקורא יעצור על כל אחד בנפרד."},{"id":"g94","name":"מצלמה שנוסעת על תמונה בגלילה","cat":"gsap","desc":"תמונה גדולה אחת (מפה, תוכנית קומה, איור) ומצלמה שנוסעת עליה עם הגלילה: זום לנקודה, כיתוב, נסיעה לנקודה הבאה. סיור מודרך בלי שהצופה זז.","when":"מפת פרויקט, תוכנית דירה, איור תהליך, קמפוס, תפריט מסעדה מאויר. שלוש עד חמש תחנות."},{"id":"g95","name":"קובייה שמסתובבת פאה-פאה בגלילה","cat":"gsap","desc":"ארבע פאות של קובייה, כל אחת נושאת עדות או יתרון. הגלילה מסובבת את הקובייה 90 מעלות בכל שלב, עם עצירה קצרה על כל פאה.","when":"עדויות, ארבעה עקרונות, ארבע חבילות. בדיוק ארבעה פריטים, שקולים זה לזה."},{"id":"g96","name":"סקשן שמתרומם מהשולחן","cat":"gsap","desc":"כרטיסים שוכבים שטוחים בפרספקטיבה, כמו על שולחן, ובזמן שהם נכנסים למסך הם מתרוממים לזקוף, אחד אחרי השני. כניסה עם עומק במקום עוד fade-up.","when":"גריד יתרונות, חבילות, צוות. כל סקשן כרטיסים שרוצים לתת לו נוכחות. פעם או פעמיים בעמוד."},{"id":"g97","name":"קו סריקה שהופך שלד לצבע","cat":"gsap","desc":"מסך מוצר מופיע כשלד אפור עם קווי מתאר. קו סריקה יורד עם הגלילה, וכל מה שהוא עבר מקבל צבע וחיים. \"לפני ואחרי\" שהגלילה עצמה מציירת.","when":"מוצר דיגיטלי, מערכת, אפליקציה, \"מה אנחנו בונים\". פעם אחת בעמוד."},{"id":"g98","name":"אריחים שמתהפכים בגל בגלילה","cat":"gsap","desc":"גריד אריחים שכולם מראים את הצד הכהה. ככל שגוללים, גל של היפוכים עובר עליהם באלכסון וחושף תמונה או צבע בכל אריח. פסיפס שנבנה מול העיניים.","when":"קיר לוגואים, גלריית פרויקטים, \"במספרים\" עם אריח לכל נתון. שנים עשר עד עשרים אריחים."},{"id":"g99","name":"גליל טקסט תלת-ממדי","cat":"gsap","desc":"שורות טקסט מודבקות על גליל שמסתובב סביב ציר אופקי עם הגלילה. השורה הקדמית קריאה ומלאה, האחרות מתעקלות למעלה ולמטה ודוהות. רולודקס של שירותים.","when":"רשימת שירותים, ערכים, ענפים שעובדים איתם. חמש עד תשע שורות קצרות."},{"id":"g100","name":"לוח שלטים מתהפך (Split-flap)","cat":"gsap","desc":"מילה שבנויה מלוחיות כמו לוח הטיסות הישן. בכל סקשן שנכנס הלוחיות מתהפכות אחת אחרי השנייה ומרכיבות מילה חדשה.","when":"כותרת דביקה שמתחלפת בין פרקים, מונה \"עכשיו בונים: ...\", לוח סטטוס. שלוש עד ארבע מילים באורך דומה."},{"id":"g101","name":"עדשת רנטגן שנוסעת בגלילה","cat":"gsap","desc":"שתי גרסאות של אותה תמונה זו על זו (חוץ ופנים, לפני ואחרי, שרטוט ומוצר), ועדשה עגולה שנוסעת על פניהן עם הגלילה וחושפת את השכבה התחתונה רק בתוכה.","when":"אדריכלות ושיפוצים, רפואה, מכונאות, כל \"מה מתחת לפני השטח\". תמונה אחת, מסלול של שלוש עד ארבע נקודות."},{"id":"g102","name":"תריסים: פסים שעולים בין סקשנים","cat":"gsap","desc":"מעבר בין שני סקשנים דרך שמונה פסים אנכיים שעולים בזה אחר זה ומכסים את הראשון, ואז נאספים למעלה וחושפים את השני. וילון בשכבות במקום גלילה רגילה.","when":"מעבר בין שני פרקים שרוצים להפריד בחדות: הירו לשירותים, סיפור לתמחור. פעם או פעמיים בעמוד."},{"id":"g103","name":"מספר פרק ענק שמתחלף בגלילה","cat":"gsap","desc":"ספרה ענקית ודהויה יושבת ברקע ומחליפה ערך כשעוברים פרק: הישנה נדחפת למעלה ויוצאת, החדשה נכנסת מלמטה. הגולש תמיד יודע איפה הוא.","when":"עמוד שירות ארוך עם שלושה עד שישה פרקים, מדריך, תהליך. אחת לעמוד."},{"id":"g104","name":"מוצר שמחליף צבע בגלילה","cat":"gsap","desc":"מוצר אחד מוצמד, ובכל סקשן שנכנס הוא מחליף גוון במעבר חלק, והשלב עם השם והמחיר של אותו גוון מודגש. דף מוצר עם ווריאנטים בלי לחיצה אחת.","when":"מוצר עם צבעים או גימורים (ריהוט, ביגוד, מכשירים, רכב). שלושה עד חמישה ווריאנטים."},{"id":"g105","name":"מרקי שמתקבע לכותרת","cat":"gsap","desc":"רצועת מילים שרצה בלי סוף, וככל שגוללים היא מאטה, נעצרת, ונגררת עד שמילה אחת נוחתת בדיוק במרכז המסך. תנועה שהופכת לאמירה.","when":"פתיחת סקשן ערכים או שירותים: קודם השטף, אחר כך המסר. פעם אחת בעמוד."},{"id":"g106","name":"חלונות אל תמונה קבועה","cat":"gsap","desc":"תמונה אחת גדולה עומדת במקום מאחורי העמוד, והסקשנים שגוללים מעליה חתוכים בחלונות. דרך כל חלון רואים חלק אחר של אותה תמונה, כאילו מציצים דרך קיר.","when":"אתרי אדריכלות, אירוח, תיירות, אמנות. תמונה אחת חזקה שרוצים לחזור אליה לאורך העמוד. שלושה עד חמישה חלונות."},{"id":"g107","name":"שנה דביקה שמתחלפת בציר זמן","cat":"gsap","desc":"ציר זמן שבו השנה יושבת דבוקה בצד, ואירועים גוללים לצידה. כשעוברים לשנה הבאה הספרות מתגלגלות למעלה כמו מונה, והקו מתמלא.","when":"היסטוריה של חברה, אבני דרך, סיפור מסע. ארבע עד שמונה שנים."},{"id":"g108","name":"שורות כותרת שנפתחות ומגלות תמונה","cat":"gsap","desc":"כותרת של שתי שורות צמודות. בגלילה השורות מתרחקות זו מזו, ובמרווח שנפתח ביניהן מתגלה תמונה שנפתחת לגובה מלא. הטקסט הופך למסגרת.","when":"הירו של אתר תדמית, פתיחת פרויקט בתיק עבודות, סקשן \"מי אנחנו\". פעם אחת בעמוד."},{"id":"g109","name":"כותרת שמתפרקת לעומקים","cat":"gsap","desc":"מילות הכותרת נראות שורה רגילה, אבל בגלילה כל מילה נעה בקצב אחר, כאילו היא יושבת בעומק אחר. פרלקס בתוך משפט אחד.","when":"כותרת הירו או כותרת סקשן דרמטית באתרי סטודיו ואופנה. אחת לעמוד, ארבע עד שבע מילים שנכנסות בשורה אחת."},{"id":"g110","name":"טקסט שנכתב עם הגלילה","cat":"gsap","desc":"פסקה שמופיעה אות אחרי אות בקצב הגלילה, עם סמן שמסמן איפה הכתיבה נמצאת. גוללים לאט, קוראים לאט. חוזרים למעלה, הטקסט נמחק.","when":"משפט מפתח או פסקת מניפסט שרוצים שייקראו עד הסוף. עד 220 תווים, פעם אחת בעמוד."},{"id":"g111","name":"מסך טלפון מוצמד עם מסכים שמתחלפים","cat":"gsap","desc":"מסגרת טלפון נשארת במקום, ובזמן שהטקסט גולל לצידה המסכים בתוכה מתחלפים: כל פיצ'ר מקבל מסך משלו שנכנס מלמטה. עמוד אפליקציה קלאסי.","when":"אפליקציה, מערכת, כל מוצר עם מסכים. שלושה עד חמישה פיצ'רים."},{"id":"g112","name":"מפלס שעולה: מילוי גלי בגלילה","cat":"gsap","desc":"מכל עגול שמתמלא בנוזל ככל שגוללים, עם גל שמתנדנד על פני השטח ומספר שעולה יחד עם המפלס. יעד, אחוז השלמה, שביעות רצון.","when":"נתון אחד שהוא אחוז: שביעות רצון, יעד גיוס, אחוז לקוחות חוזרים. אחד לסקשן."},{"id":"g115","name":"מחשב נייד שנפתח בגלילה","cat":"gsap","desc":"מחשב נייד סגור שהמכסה שלו נפתח ככל שגוללים, והמסך נדלק ומראה את המוצר. המחשב מתרומם קלות לזווית צפייה.","when":"מערכת, SaaS, דשבורד, כל מוצר שחי במסך גדול. הירו או סקשן הדגמה, פעם אחת."},{"id":"g116","name":"יחס שמשתנה בגלילה","cat":"gsap","desc":"שני משטחים צבעוניים שמייצגים יחס: לפני ואחרי, אנחנו מול השוק, שתי אפשרויות. בגלילה הגבול ביניהם זז והמספרים משתנים יחד איתו.","when":"נתון השוואתי אחד חזק: מ-20% ל-80%, חצי מהזמן, פי שלושה. אחד לעמוד."},{"id":"g117","name":"גלגלות סלוט שמתייצבות בגלילה","cat":"gsap","desc":"שלושה מספרים או מילים על גלגלות אנכיות שמסתובבות מהר כשהסקשן נכנס, ומתייצבות אחת אחרי השנייה על הערך הנכון. \"במספרים\" עם דרמה.","when":"סקשן מספרים: שנות ניסיון, פרויקטים, לקוחות. שלושה עד ארבעה ערכים. פעם אחת בעמוד."},{"id":"g118","name":"אלכסון צבע שמסתובב מאחורי העמוד","cat":"gsap","desc":"משטח צבע ענק ואלכסוני שיושב מאחורי כמה סקשנים ומסתובב לאט עם הגלילה, כך שהגבול בין הצבעים חוצה את התוכן בזווית אחרת בכל רגע. רקע שנושם בלי להסיח.","when":"אתרי מותג עם צבע חזק, עמודי קמפיין, סקשני ביניים ארוכים. אחד לעמוד, מאחורי שניים עד ארבעה סקשנים."},{"id":"g119","name":"אייקון שמתגלגל לאייקון הבא","cat":"gsap","desc":"אייקון אחד גדול ודביק שמשנה צורה בכל שלב בתהליך: עיגול הופך לחץ, חץ לווי, ווי לכוכב. הצורה מספרת את השלב במקום להחליף תמונה.","when":"תהליך עבודה בשלושה עד חמישה שלבים, מסע לקוח, אונבורדינג. אייקונים בקו פשוט עם מספר נקודות דומה."},{"id":"g120","name":"רשימה שהפריט במרכז שלה גדל","cat":"gsap","desc":"רשימה ארוכה של שירותים או פריטים, והפריט שנמצא במרכז המסך גדל, מתמלא ומקבל תיאור, בזמן שהשכנים קטנים ודהויים. עין דג אנכית שהגלילה מזיזה.","when":"תפריט, רשימת שירותים, קטלוג טקסטואלי, שמות של אנשי צוות. שמונה עד עשרים פריטים."},{"id":"g121","name":"יציאה מזום: מתמונה אחת לפסיפס שלם","cat":"gsap","desc":"מתחילים צמוד לתמונה אחת שממלאת את המסך, והגלילה מרחיקה את המצלמה עד שמתגלה פסיפס של עשרים תמונות שהיא רק אחת מהן. \"זה חלק ממשהו גדול\".","when":"תיק עבודות, צוות גדול, קהילה, לקוחות. שתים עשרה עד עשרים וארבע תמונות."},{"id":"g123","name":"מסוע אופקי שנע עם הגלילה","cat":"gsap","desc":"שתי שורות של תמונות או לוגואים שנעות אופקית בכיוונים מנוגדים, לא בלולאה אלא בקשר ישיר לגלילה: גוללים למטה, השורה העליונה נוסעת ימינה והתחתונה שמאלה. עוצרים, הכל עוצר.","when":"קיר לוגואים, גלריית פרויקטים, פס תמונות בין סקשנים. ששה עד עשרה פריטים בשורה."},{"id":"g124","name":"טבלת השוואה שמתמלאת בגלילה","cat":"gsap","desc":"טבלת \"אנחנו מול הדרך הישנה\" שהשורות שלה נדלקות אחת אחרי השנייה בכניסה, וסימני הווי מציירים את עצמם בעמודה שלנו בזמן שהאיקסים בעמודה השנייה נמחקים. השוואה שקוראים בקצב.","when":"עמוד מכירה, השוואת חבילות, \"למה אנחנו\". ארבע עד שבע שורות, שתי עמודות."},{"id":"g125","name":"כרטיס זכוכית שמטה ומבריק בגלילה","cat":"gsap","desc":"כרטיס (חברות, אשראי, כרטיס מוצר) שמטה בתלת-ממד ככל שגוללים, ופס אור עובר עליו באלכסון בדיוק ברגע ההטיה. כמו להחזיק אותו ביד מול החלון.","when":"כרטיס חברות, מנוי, כרטיס מתנה, הצגת מוצר שטוח. פעם אחת בעמוד."},{"id":"g126","name":"גרף קו שנמשך עם נקודה בקצה","cat":"gsap","desc":"גרף צמיחה שהקו שלו נמשך משמאל לימין בקצב הגלילה, נקודה רוכבת על הקצה, והערך מעליה מתעדכן. סיפור צמיחה בלי טבלה.","when":"תוצאות לקוח, צמיחת החברה, \"לפני ואחרי\" במספרים. גרף אחד, נתון אחד."},{"id":"g127","name":"מעבר לכהה בגלילה: עיגול שגדל ומחליף ערכה","cat":"gsap","desc":"אותו סקשן בשתי ערכות, בהירה וכהה, זה על זה. עיגול קטן בפינה גדל עם הגלילה עד שהוא מכסה הכל, והערכה הכהה תופסת את המסך. מעבר יום ולילה בלי חיתוך.","when":"מעבר בין חלק \"בעיה\" לחלק \"פתרון\", כניסה לפרק כהה של האתר, פתיחת סקשן פרימיום. פעם אחת בעמוד."},{"id":"g128","name":"מגירה שנפתחת מתחת לסקשן","cat":"gsap","desc":"הסקשן העליון נדחק הצידה, והבא נכנס מהצד ומונח מעליו כמו דף, עד שהוא תופס את המסך. מעבר צדדי במקום עוד גלילה למטה.","when":"מעבר לסקשן \"הפתעה\": מבצע, פרויקט נבחר, הצעה מיוחדת. פעם אחת בעמוד."},{"id":"g129","name":"מדרגות כרטיסים שנבנות בגלילה","cat":"gsap","desc":"כרטיסים שעולים מלמטה ומתייצבים כגרם מדרגות בפרספקטיבה: כל כרטיס גבוה יותר ורחוק יותר מהקודם. תהליך שנראה כמו טיפוס.","when":"תהליך עבודה, רמות שירות, מסלול לימודים. שלושה או ארבעה שלבים שיש להם סדר עולה, ולכל אחד משפט קצר אחד."},{"id":"g130","name":"צמצם מצלמה שנפתח בגלילה","cat":"gsap","desc":"תמונת הירו חבויה מאחורי
