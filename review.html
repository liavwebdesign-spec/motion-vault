 נחיתה או לסקשן אחד בולט, פעם אחת. צריך תמונה חזקה אחת שעומדת בפני עצמה."},{"id":"g276","name":"טבעות מקטעים שמסתובבות בקצבים שונים","cat":"gsap","desc":"חמש טבעות מקטעים בגדלים שונים מסתובבות סביב עיגול במרכז, כל אחת בקצב ובכיוון משלה, ובכניסה פורצים מהמרכז קווים דקים החוצה. גלילה מהירה מאיצה את כולן לרגע. לצד הגרפיקה רשימה שמסבירה מה כל טבעת מייצגת.","when":"מחזורים שחוזרים בקצבים שונים: תחזוקה, גבייה, ביקורות, טיפולים, עדכוני אתר. חמישה פריטים לכל היותר, כל אחד עם שם וקצב. מתאים לסקשן תהליך או שירותים בעסק שמנהל דברים לאורך זמן. לא מתאים כשצריך להשוות כמויות, כי הטבעות מראות קצב ולא גודל."},{"id":"g277","name":"קו דהוי שנדלק כניאון","cat":"gsap","desc":"איור קווי של כוס קפה מצויר לאט על רקע כהה בצבע עמום, ואז נדלק כמו שלט ניאון: הבהוב קצר, עוד הבהוב, וזוהר שמתייצב. ליד האיור הטקסט נשאר קבוע וקריא לכל אורך התנועה.","when":"אייקון אחד שמסמל את העסק ושמתאים לערב ולחושך: בית קפה פתוח עד מאוחר, בר, מועדון, חנות לילה, מסעדה. פעם אחת בעמוד, בסקשן סיום או בהירו. לא מתאים לעסק שמדבר בשקט, כי הזוהר מושך תשומת לב."},{"id":"g278","name":"ספרה ענקית בקו מתאר שמתמלאת","cat":"gsap","desc":"ספרה ענקית נראית בהתחלה רק כקו מתאר חלש, ואז הקו מתחזק והצבע עולה בתוכה מלמטה למעלה בקצב הגלילה, עד שהיא מלאה. ליד הספרה הטקסט שמסביר מה היא מונה, ואפשר לקרוא אותו לכל אורך התנועה.","when":"נתון אחד גדול שמוכיח משהו: שנות ניסיון, מספר לקוחות, פרויקטים שנמסרו. סקשן הוכחה או אודות, פעם אחת בעמוד. עובד טוב עם מספר של שתיים או שלוש ספרות שמרשים בפני עצמו, ופחות עם מספר שצריך הסבר כדי להתרשם ממנו."},{"id":"css45","name":"פסי מואר מסתובבים זה מול זה","cat":"css","desc":"שתי שכבות של פסים דקים שיוצאים ממרכזים סמוכים מסתובבות לאט בכיוונים הפוכים. החפיפה ביניהן יוצרת דוגמת מואר שמשתנה כל הזמן, בניגודיות נמוכה, כך שהכותרת שמעליה נשארת ברורה.","when":"רקע לכותרת גדולה בסקשן פתיחה או הרשמה, בעיקר באתר של סטודיו, קורס או אירוע שמרשה לעצמו להיראות גרפי. עובד מאחורי כותרת ופסקה קצרה אחת. לא מתאים מאחורי טופס או טקסט ארוך, ולא באתר שקט."},{"id":"css46","name":"פסי סריקה וגרעין מעל הסקשן","cat":"css","desc":"מעל סקשן רגיל נפרשים פסי סריקה עדינים וגרעין נייר שזז בקפיצות קטנות, ובמרווחים ארוכים חולף פס בהיר לאורך הסקשן. התוכן שמתחת נשאר חד, והסקשן מקבל מראה של מסך ישן או של דפוס.","when":"הירו או רצועה בעסק עם אופי רטרו: חנות תקליטים, קומיקס, גיימינג, בית דפוס, אירוע נוסטלגי. שכבה אחת על הסקשן, בלי תוכן משלה. לא מתאים לעסק רפואי, פיננסי או משפטי, ולא על טקסט קטן."},{"id":"b104","name":"הדפס כפול עם סטייה","cat":"behavior","desc":"כותרת וצורות מודפסות כמו בדפוס בשני צבעים שלא התיישר בדיוק: מאחורי הכותרת השחורה נראית הדפסה שנייה בצבע המותג עם קווי מילוי, והעיגולים מתכהים איפה שהם חופפים. כשהעכבר זז על הסקשן, ההדפסה השנייה זזה איתו ומגדילה את הסטייה.","when":"פוסטר, כרטיס פתיחה או אירוע של סטודיו, בית דפוס, חנות עיצוב, גלריה או פסטיבל. כותרת אחת וצורות גדולות בסקשן אחד. עובד על רקע בהיר בלבד: על רקע כהה החפיפה נבלעת. במסך מגע נשארת סטייה קבועה, והמהלך עדיין נראה."},{"id":"b99","name":"רשת אריחי קשתות שמתהפכים בגל","cat":"behavior","desc":"רקע של 288 אריחים, ובכל אחד שתי קשתות שמתחברות לקווים רצופים, כמו מבוך. לחיצה או נגיעה בנקודה מפעילה גל: האריחים מסתובבים רבע סיבוב אחד אחרי השני, לפי המרחק מהנקודה, ובכל אריח שהגל נוגע בו הקשתות נצבעות לרגע בצבע המותג ואז דוהות. כשאף אחד לא נוגע, גל חדש יוצא מנקודה אחרת כל כמה שניות והמבוך מסדר את עצמו מחדש.","when":"פתיחה או סגירה של עמוד שרוצה רקע עם אופי: סדנה, סטודיו עיצוב, מותג של חומרים, אריחים או טקסטיל. הכותרת יושבת על לוח אטום באמצע והרקע עצמו לא נושא תוכן. פעם אחת בעמוד, ולא בעמוד שיש בו כבר רקע נע."},{"id":"g261","name":"צורות מקוננות שמסתובבות כמנהרה","cat":"gsap","desc":"שמונה ריבועים מקוננים, לסירוגין בצבע המותג ובצבע הטקסט, נפתחים מנקודה במרכז כשגוללים. כל אחד גדל למקומו ומסתובב נגד הקודם, מהפנימי החוצה, עד שהם נעצרים במדרגות של שבע מעלות והופכים למנהרה. במרכז, על הריבוע הפנימי, מילה אחת עולה מטשטוש ומתחדדת בסוף.","when":"פתיחה או אודות של סטודיו, מוצר או שירות שאפשר לסכם במילה אחת: מחקר, עומק, דיוק, סדר. הצורות הן קישוט שמוביל את העין למילה, ולכן עדיף כשהטקסט לידן קצר. פעם אחת בעמוד."},{"id":"g262","name":"נוף שעובר משקיעה ללילה בגלילה","cat":"gsap","desc":"תמונת נוף של שעת שקיעה על המים נעוצה בצד המסך, וכשגוללים בין שלבי הערב היא משתנה: הכחול מעמיק, הירח עולה מהאופק ומשאיר פס אור על המים, מופיעים כוכבים, ובפינה שעון קטן מתקדם מ-18:30 ל-22:00. רואים את האור משתנה, ולא רק קוראים על שעות.","when":"מקום שמוכר חוויה לאורך ערב או יום: גן אירועים, מסעדה על המים, מלון, חוף, אתר מורשת. שלושה שלבים של זמן עם נוף אחד שמשתנה לידם. פעם אחת בעמוד, בסקשן התהליך או בסיפור המקום."},{"id":"g263","name":"צורות גיאומטריות שנכנסות להרכב","cat":"gsap","desc":"לוח ריבועי אחד ובו הרכב בסגנון באוהאוס: עיגול גדול בצבע המותג, משולש כהה, פס מוטה, נקודה, ריבוע קטן וקרן עיגול בפינה. כשגוללים כל צורה נכנסת מקצה אחר של הלוח ונעצרת במקומה, אחת אחרי השנייה, ולבסוף רשת של 16 ריבועים קטנים נבנית בפינה.","when":"אודות או סיפור מותג של סטודיו עיצוב, אדריכלות או מיתוג, שהשפה שלו היא צורות וגרפיקה. הצבעים לקוחים מהמותג, ולכן ההרכב משתנה עם הפלטה. לא לעסק שקט שנשען על תמונות ואנשים. פעם אחת בעמוד."},{"id":"css42","name":"שני מישורי נקודות מוטים בעומק","cat":"css","desc":"שני מישורי נקודות צפים אחד מעל השני בזווית, על שדה כהה ועם אור חם שביניהם. הנקודות של כל מישור נעות לאט בכיוון אחר, והמישורים עצמם מתנדנדים קלות. במעבר עכבר הזווית נפתחת והמרחק בין השכבות גדל.","when":"סקשן שמסביר עניין של שכבות: נתונים ודוחות מעליהם, תשתית ואפליקציה, בסיס ושירות. התמונה אומרת שכבה על שכבה בלי לצייר מוצר. מתאים לעסקי טכנולוגיה, דאטה ותשתיות, ליד כותרת קצרה. פעם אחת בעמוד."},{"id":"css43","name":"פסי אזהרה אלכסוניים עם תיבת מילה","cat":"css","desc":"רצועה רחבה מלאה בפסים אלכסוניים עבים, בצבע המבטא ובצבע הטקסט, כמו סרט אזהרה, שמחליקים לאט לאורך האלכסון בלולאה בלי קפיצה. באמצע יושבת תיבה בהירה עם מילה אחת כבדה, כמו תווית שהודבקה על הסרט, והיא קופצת פנימה (גדלה מ-80% ל-100%) כשהרצועה נכנסת למסך.","when":"מקום שצריך להדגיש מילה אחת בקול: פינוי מלאי, סוף עונה, סגור לשיפוצים, מבצע לזמן מוגבל. בחנות או בדף נחיתה של מבצע. לא באתר שקט, כי הפסים צועקים. פעם אחת בעמוד."},{"id":"g213","name":"פסים ושורות דירוג שמתמלאים לערכים","cat":"gsap","desc":"כרטיס עם חמש שורות דירוג, ובכל אחת שם, פס ואחוז. בכניסה למסך הפסים נמתחים מימין לאורך שלהם בזה אחר זה, והאחוזים סופרים מאפס באותו קצב. המקום הראשון בצבע המותג ושאר השורות באפור, ולכן רואים מיד מי מוביל ובכמה.","when":"תוצאות, השוואה או דירוג עם ארבע עד שבע שורות: מאיפה הגיעו הפניות, איזה שירות הכי מבוקש, חלוקת התקציב, תוצאות סקר. סקשן הוכחה או ״במספרים״. פעם אחת בעמוד, על הנתון שהכי חשוב להראות."},{"id":"b87","name":"טאבים שמחליפים תוכן בלוח אחד","cat":"behavior","desc":"כרטיס נתונים עם שלושה טאבים בראשו: 24 שעות, 12 שבועות, 12 חודשים. לחיצה על טאב מזיזה אליו את הסמן, המספר הגדול רץ לערך החדש, הקו בגרף מתעוות לצורה של התקופה החדשה, והנקודה והטולטיפ שבקצה הקו עוברים למקומם. לוח אחד, שלוש תקופות.","when":"תוצאות או מקרה בוחן עם נתון אחד בכמה רזולוציות: פניות, מכירות, מבקרים, זמן תגובה. סקשן הוכחה או עמוד תוצאות. מחליף שלושה גרפים נפרדים בלוח אחד שהגולש מפעיל בעצמו, ומתאים כשהתקופות מספרות סיפור שונה."},{"id":"g214","name":"סימונים ותוויות שנוספים אחד אחרי השני","cat":"gsap","desc":"פס אחד מחולק לארבעה חלקים לפי המחיר של כל אחד. בגלילה מצטיירים סוגריים מסולסלים מתחת לכל חלק, ולידם מופיעה תווית עם השם והסכום, אחד אחרי השני. בסוף נפתח סוגר גדול אחד מעל כל הפס, והסכום הכולל סופר מאפס.","when":"הסבר שמורכב מכמה חלקים: מה כלול במחיר, איך מתחלקת תוכנית, שלבי פרויקט, מרכיבי שירות. סקשן מחירים, תהליך או הוכחה. שלושה עד חמישה חלקים, ולכל אחד שם קצר ומספר. הסיכום מופיע רק אחרי שהקורא ראה את החלקים."},{"id":"g215","name":"טולטיפ עוקב אחרי קו עם כרטיסי אירוע","cat":"gsap","desc":"גרף הכנסות מצטברות, ובו קו שיער אנכי ונקודה שנעים לאורך הקו בקצב הגלילה, וטולטיפ שמראה את הסכום והיום. כשהקו עובר ליד יום של פנייה או הזמנה, כרטיס חדש מחליק פנימה לעמודה שלצד הגרף ודוחף את הקודמים צעד למטה.","when":"דשבורד או סקשן תוצאות שבו אירועים אמיתיים מסבירים את העלייה: פניות, הזמנות, תשלומים, הרשמות. מראה גם את הסכום וגם מה גרם לו. שלושה כרטיסים לכל היותר, וכרטיס אחד לכל קפיצה בקו."},{"id":"g216","name":"עמודות ושורות שמחליפות מקום לפי הערכים","cat":"gsap","desc":"דירוג של חמישה מקורות פניות שמתעדכן חודש אחרי חודש בגלילה. הפסים מתארכים ומתקצרים לפי הערך, השורות מחליפות מקום כשערך אחד עוקף אחר, המספרים משתנים, והמוביל הנוכחי בצבע המותג. שם החודש הגדול מתחלף בתחתית. בסוף רואים את הדירוג הנוכחי ואת הדרך שבה הגיע אליו.","when":"סיפור של שינוי בדירוג לאורך זמן: מקורות פניות, מוצרים רבי מכר, שירותים לפי ביקוש, מתחרים. סקשן הוכחה או תוכן. עד שבע שורות ועד שישה שלבי זמן, ולפחות כמה עקיפות כדי שיהיה מה לראות."},{"id":"g217","name":"גרף קו עם פסי תקופות מסומנים","cat":"gsap","desc":"גרף קו דק שמצויר בגלילה, ובקצהו נקודה זוהרת. כשהקו עובר על תקופה, פס שקוף נדלק מעליה ועליו תווית קצרה: פסח, עונת השיא, החופש הגדול. שני הפסים שמעל הירידות מודגשים בצבע המותג, ולצד הגרף מילה גדולה שמסכמת את הדפוס.","when":"סיפור של עונתיות או מגמה: פניות לפי חודש, מכירות לפי עונה, עומס בקליניקה. סקשן הוכחה, תוכן או הסבר. סדרה אחת של עשר עד שתים עשרה נקודות, ושלוש עד ארבע תקופות מסומנות שיש לכל אחת סיבה ידועה."},{"id":"g218","name":"טקסט שמוצג כפסים בצבעים","cat":"gsap","desc":"פסקה שלמה מוצגת כשורות של פסים מעוגלים, פס לכל מילה לפי אורכה. בכניסה למסך כל הפסים אפורים, ואז הם מקבלים את צבעם מילה אחרי מילה: מילים מוכרות בכהה, מילים ארוכות ונדירות באפור בהיר, ומונחים מקצועיים בצבע המותג. ליד הפסקה מספר שסופר את המונחים.","when":"ביקורת קריאות, בדיקת טקסט או הסבר איך קוראים אתר: מונחים שהלקוחות לא מכירים, מילים שדורשות הסבר, חלק מהטקסט שנקרא בפועל. סקשן הוכחה או שירות שבודק משהו בטקסט. מתאים כשצריך להראות נתון על טקסט בלי להכריח לקרוא אותו."},{"id":"g252","name":"גרף עקומת האטה עם נקודה נעה","cat":"gsap","desc":"גרף גדול של עקומת קצב, ונקודה שרצה עליה בקצב הגלילה עם קווי עזר לשני הצירים. לידו שש שורות, ובכל אחת נקודה שעוברת אותו מרחק באותו זמן בקצב אחר: אחיד, מתחיל לאט, נגמר לאט, זינוק, קפיצות. אחרי כל עשירית מהזמן נשארת בשורה נקודה קטנה, והמרווחים ביניהן מראים איפה התנועה מהירה ואיפה איטית. לא קוראים את העקומה, מרגישים אותה.","when":"הסבר על קצב, בלי קשר לתחום: איך אנחנו עובדים (שלב איטי ויסודי בהתחלה, מהיר באמצע, גימור רגוע בסוף), סטודיו לאנימציה או עיצוב ממשקים שמסביר למה תנועה אחת מרגישה נכונה, קורס, או כל שירות שמתקדם בקצב לא אחיד. פעם אחת בעמוד, ורק כשהקצב הוא באמת חלק מהסיפור."},{"id":"g253","name":"רשת אריחים שמתרוממת למפת גבהים","cat":"gsap","desc":"רשת שטוחה של אריחים, כל אריח שעה ביום מסוים, שמתרוממת בגלילה למפת גבהים בהקרנה אלכסונית. העמודים עולים מהמרכז החוצה, הגובה והצבע מראים כמה פניות נכנסו, ובסוף השיא נדלק בצבע המותג עם תווית, והמספר הגדול סופר עד הערך שלו. רואים בדיוק איפה העומס ואיפה השקט, בלי לקרוא טבלה.","when":"פילוח של ביקוש לפי שני ממדים: שעה ויום במוקד שירות, חדר טיפולים, מסעדה או חנות. מתאים גם למחיר לפי עונה ושעה, או לכמות פרויקטים לפי שנה וסוג. כשיש שלושה ערכים בלבד עמודות רגילות עדיפות. פעם אחת בעמוד, וכשהשיא הוא ההחלטה העסקית."},{"id":"g254","name":"תרשים עוגה מנקודות","cat":"gsap","desc":"תרשים עוגה שבנוי ממאות נקודות קטנות על שבע טבעות, שמתמלא בגלילה בסיבוב אחד סביב המרכז. כל נקודה היא פנייה אחת, הצבע מתחלף בכל מעבר לקטע הבא, והאחוז שבמרכז ובמקרא סופרים יחד איתו. אפשר פשוט לספור נקודות ולהבין את החלוקה, בלי לקרוא מספר.","when":"חלוקה של סך אחד לשניים עד ארבעה חלקים: מאיפה מגיעים לקוחות, פרויקטים לפי סוג, הרכב הצוות, תוצאות סקר. כשיש יותר מארבעה חלקים או הבדלים קטנים ביניהם עמודות קריאות יותר. עם אותו קוד אפשר לעבור לחצי עיגול כשיש הרבה יחידות קטנות, כמו מושבים או מקומות. פעם אחת בעמוד."},{"id":"g255","name":"נרות מחירים שזורמים בזמן אמת","cat":"gsap","desc":"גרף נרות של שער הדולר שנבנה על קנבס וזז בזמן אמת: נר חדש נוסף כל כמה שניות מצד אחד, הנר האחרון מתנדנד עם כל עדכון, ונקודה זוהרת עם תווית מחיר יושבת על השער הנוכחי. כשהגרף נכנס למסך הוא מתקרב מתצוגה רחבה לחלון של כמה עשרות נרות, והמספר הגדול שמעליו מתעדכן יחד איתו. מחוץ למסך הכול עוצר.","when":"אתר עם נתון חי שאפשר להראות: שערי מטבע, מחיר חומרי גלם, מלאי שמתרוקן או ביקוש בזמן אמת. מתאים לבית השקעות, למתווך מט\"ח, ליצואן או לכל עסק שהמחיר שלו זז. כשהנתון לא אמיתי חייבים לסמן אותו כנתוני הדגמה. פעם אחת בעמוד."},{"id":"g256","name":"קווים שמתפצלים מנקודה אחת לתוויות קצה","cat":"gsap","desc":"מניפה של קווים דקים שיוצאים מנקודה אחת וצומחים בגלילה, כל קו תרחיש אחר של אותו עסק, ומעליהם נמשכים חמישה קווים מודגשים עם ערך בקצה. מונה בצד סופר כמה תרחישים נבדקו. הקווים נפתחים קודם, הקווים המודגשים אחריהם, והתוויות נדלקות אחרונות, כך שהעין מבינה קודם את הטווח ורק אחר כך את המספרים.","when":"תחזית, טווח או השוואת תרחישים: הכנסה צפויה לשנה, זמן מסירה לפי מורכבות, תוצאה של שלוש חבילות מחיר. מתאים לפיננסים, ייעוץ, נדל\"ן ועסקים שמוכרים הערכה. כשהנתונים לא אמיתיים חובה לסמן אותם כנתוני הדגמה. כשיש שני תרחישים בלבד עדיף גרף קווים פשוט, ופעם אחת בעמוד."},{"id":"g257","name":"היסטוגרמה עם הדגשה שנודדת מעמודה לעמודה","cat":"gsap","desc":"שלושים עמודות של פניות, אחת לכל יום בחודש, ואחת מהן דולקת בצבע המותג. בגלילה ההדגשה עוברת מעמודה לעמודה כמו ראש נגינה: העמודות שכבר עברה מתכהות, אלה שלפניה בהירות, ופס דק עם מספר היום זז איתה מתחת לציר. המספר הגדול שמעל הגרף והנתונים הקטנים לידו, תאריך, סך הכל וממוצע, מתעדכנים בכל עמודה. אין זכוכית מגדלת ואין הגדלה, רק תנועה לאורך הציר.","when":"נתון שמתפרש על ציר זמן קצר ויש בו סיפור בתוכו: פניות לפי יום, הזמנות לפי שעה, מבקרים לפי שבוע, מכירות לפי חודש. מתאים לסקשן תוצאות או דוח חודשי, כשרוצים שהקורא יעבור על הימים בסדר ויראה איפה הייתה העלייה. כשיש פחות מעשר עמודות, או כשכל עמודה היא קטגוריה ולא רגע בזמן, עמודות רגילות מספיקות. פעם אחת בעמוד."},{"id":"g237","name":"שכבת מדדים על המסך שמתעדכנת עם הסצנות","cat":"gsap","desc":"צילום גדול של פרויקט, ומעליו שכבת מדידה כמו במצלמה: ארבעה סימני פינה, סרגל עם שנתות, תוויות קטנות בכתב מונוספייס ומספר גדול בפינה. כשגוללים, הצילומים מתחלפים והמספרים מתעדכנים יחד איתם: השבוע, אחוז ההתקדמות, ימי העבודה והתקציב שנוצל, והסמן נע על הסרגל. הקורא רואה את הפרויקט מתקדם ולא רק קורא עליו.","when":"סיפור שיש לו ציר אמיתי של התקדמות: שיפוץ או עיצוב דירה לפי חדרים ושבועות, הקמת אתר לפי שלבים, מסע של לקוח, פרויקט עם תקציב ולוח זמנים. הערכים חייבים להיות אמיתיים, כי המספרים הם ההוכחה. מתאים לסקשן מקרה בוחן או \"איך אנחנו עובדים\", פעם אחת בעמוד. לא לעמוד שאין בו מה למדוד."},{"id":"g238","name":"כיתוב בצורת גלולה שמתחלף ומשנה רוחב בכל צעד","cat":"gsap","desc":"תמונה גדולה שנחשפת מלמטה למעלה בכל צעד של תהליך, ובתחתית שלה גלולת כיתוב אחת. כשהצעד מתחלף, הטקסט הישן עולה החוצה והחדש נכנס מלמטה, והגלולה מתרחבת או מצטמצמת בדיוק לרוחב המשפט החדש. שורת נקודות בתוכה מראה באיזה צעד אנחנו. הגולש קורא את התהליך כמו כתוביות, בלי להסיט את העיניים מהתמונה.","when":"תהליך של שלושה עד חמישה צעדים שכל אחד מהם יש לו תמונה: ביקור במרפאה, יום עבודה בסטודיו, הרכבה, מסירה, מסע של לקוח. מתאים כשהמשפט הקצר חשוב יותר מפסקה והתמונה היא העיקר. לא לתהליך שדורש הסבר מפורט בכל צעד, ולא לפני שיש תמונה אמיתית לכל צעד."},{"id":"g239","name":"שלושה מכשירים יוצאים מאחורי המכשיר המרכזי אל המסגרת","cat":"gsap","desc":"בתחילת הגלילה רואים טלפון אחד במרכז. כשגוללים, שני טלפונים נוספים מחליקים החוצה מאחוריו לשני הצדדים, גדלים מעט ונעמדים לידו, והכיתוב שמתחת לכל אחד מהם נכנס אחריו. כל טלפון מראה מסך אחר של אותו מוצר. הגולש מבין בגלילה אחת שזו מערכת שלמה ולא מסך בודד.","when":"מוצר או שירות שיש לו שלושה צדדים שכדאי להראות יחד: אפליקציה של עסק מקומי (הזמנה, מעקב, מועדון), פורטל לקוחות, מערכת תורים. מתאים לסקשן ״מה מקבלים״ בעמוד נחיתה או בעמוד מוצר, פעם אחת בעמוד. לא למוצר שיש בו מסך אחד בלבד, ולא כשאין מסכי דוגמה אמיתיים להציג."},{"id":"b94","name":"כרטיס מוצר שעובר בין טעינה, מצב ריק ומצב מלא","cat":"behavior","desc":"כרטיס של פורטל לקוחות עם רשימת מסמכים, ולידו שלוש לשוניות: בטעינה, ריק, מלא. בכניסה לעמוד הכרטיס עובר לבד פעם אחת: שורות אפורות עם ברק שעובר עליהן, אחר כך מסך ריק עם הסבר, ואז רשימה שנכנסת שורה אחרי שורה. אחרי זה הגולש בוחר לבד איזה מצב לראות. הוא מבין שהמערכת חשבה גם על הרגע שבו אין עדיין כלום.","when":"שירות שיש לו ממשק ללקוח: פורטל, אפליקציה, מערכת הזמנות, לוח מעקב. מתאים לסקשן ״מה הלקוח רואה״ כשהאמון תלוי בכך שגם המצבים הלא יפים מטופלים. שלוש לשוניות, פעם אחת בעמוד. לא למוצר שאין לו ממשק, ולא כשיש רק מצב אחד אמיתי להראות."},{"id":"g240","name":"מסמך שמסמנים בו משפטים והערה צפה עוברת ביניהם","cat":"gsap","desc":"מסמך של הצעת מחיר, ובו שלושה משפטים שמסומנים בגלילה אחד אחרי השני: צבע עובר על המשפט מההתחלה ועד הסוף, ותחתיו קו דק. ליד כל סימון מופיעה הערה קטנה של מנהלת הפרויקטים שמסבירה אותו במילים פשוטות, וההערה גם מחליקה אל המשפט הבא כשעוברים אליו. הגולש קורא את המסמך בעצמו, אבל מישהו מראה לו איפה כדאי לעצור.","when":"מסמך שיש בו כמה משפטים שחשוב להסביר: הצעת מחיר, הסכם, תקנון, הנחיות לפני טיפול או לפני מסירה. מתאים לסקשן ״איך אנחנו עוברים איתכם על ההצעה״, כשההסבר בנוי כהערות על הטקסט ולא כפסקה נפרדת. שלושה סימונים, פעם אחת בעמוד. לא למסמך ארוך מאוד, ולא כשההערות הן שיווק ולא הסבר."},{"id":"b95","name":"מסגרת שמחליפה יחס בלחיצה והתמונה נחתכת מחדש תוך כדי תנועה","cat":"behavior","desc":"תמונה בתוך מסגרת, ולידה ארבע אפשרויות עם סמל קטן של היחס: רחב, ריבוע, אינסטגרם וסטורי. בלחיצה המסגרת עוברת בהחלקה ליחס החדש, והתמונה שבתוכה נחתכת מחדש בזמן אמת במקום להימתח או לקפוץ. כיתוב בפינה מתחלף ואומר איפה משתמשים בפורמט הזה. הגולש רואה את אותו צילום בכל הפורמטים בלי לדמיין.","when":"עסק שמוסר אותו תוצר בכמה פורמטים: סרטוני תדמית, צילום מוצר, באנרים, תמונות לרשתות חברתיות. מתאים לסקשן ״מה מקבלים״ או לדף שירות. ארבע אפשרויות לכל היותר, פעם אחת בעמוד. לא לתוצר שיש לו פורמט אחד, ולא כשאין צילום אחד שנראה טוב בכל החיתוכים."},{"id":"g241","name":"זכוכית מגדלת שעוברת על גרף ומגדילה עד שהמספר נעצר","cat":"gsap","desc":"גרף עמודות של שנים עשר שבועות, ועליו זכוכית מגדלת עגולה עם ידית וכיתוב קטן של מספר ההגדלה. בגלילה היא יוצאת מהשבוע הראשון, זזה לאורך הגרף ומגדילה יותר ויותר, והכיתוב סופר מ-1.0 עד 2.4. היא נעצרת על העמודה האחרונה ומראה אותה גדולה, עם המספר שלה. הגולש רואה בדיוק איפה הסיפור קורה בנתונים.","when":"נתון אחד שיש לו רגע אחד חשוב: קפיצה במספר הפניות אחרי עליית אתר, ירידה בזמן המתנה, שיפור בציון. מתאים לסקשן תוצאות או מקרה בוחן, כשהמספר הסופי הוא ההוכחה. פעם אחת בעמוד. לא לגרף שאין בו אזור אחד שמעניין יותר מהשאר, ולא לנתונים שלא ניתן להראות."},{"id":"g242","name":"מפה מוטה שנעמדים עליה סמנים אחד אחרי השני","cat":"gsap","desc":"מפה שטוחה של אזור שירות, שבתחילת הגלילה מוצגת כמעט מלמעלה ואז מתכופפת אחורה לזווית של מבט אלכסוני. אחרי שהיא נוטה, חמישה סמנים נופלים עליה מלמעלה בזה אחר זה, כל אחד עם תווית של עיר, וטבעת נפתחת מתחתיו במקום שבו נחת. ברשימה שמתחת לכל עיר נדלקת כשהסמן שלה מגיע. הגולש רואה את תחום השירות נבנה ולא רק קורא עליו.","when":"עסק שהכיסוי הגיאוגרפי שלו הוא חלק מהמכירה: טכנאים, שליחויות, מכון בדיקות, מקום שיש לו סניפים, מי שמגיע ללקוח. מתאים לסקשן ״איפה אנחנו פועלים״ בעמוד שירות או בדף הבית. עד שבעה סמנים, פעם אחת בעמוד. לא לעסק שפועל ברחבי הארץ בלי הבדל, ולא כשאין מה להגיד על כל אזור."},{"id":"g243","name":"כרטיסי משימה שעוברים בין עמודות בלוח וגרף שיורד יחד איתם","cat":"gsap","desc":"לוח משימות עם שלוש עמודות: לביצוע, בעבודה והושלם. בגלילה חמש משימות עוברות מעמודה לעמודה אחת אחרי השנייה, ובכל מעבר הכרטיס מתרומם קצת ומתיישר במקומו החדש בעמודה, כשהכרטיסים שנשארו מתכנסים למעלה. לצד הלוח גרף שמתחיל גבוה ויורד, ומונה של משימות פתוחות יורד איתו עד שהוא מגיע לאפס. הגולש רואה פרויקט שמתקדם ולא רק קורא על תהליך.","when":"עסק שהמכירה שלו היא תהליך עבודה שקוף: סוכנות, אולפן, חברת שיפוצים, מי שמוסר פרויקט בשלבים ורוצה להראות שיש סדר. מתאים לסקשן ״איך אנחנו עובדים״ או ״מה קורה אחרי שסוגרים״. חמש עד שש משימות, פעם אחת בעמוד. לא כשהתהליך אצלכם לא באמת מתנהל בלוח, ולא עם משימות שהשם שלהן לא אומר כלום ללקוח."},{"id":"g244","name":"חלון טרמינל שמקליד פלט","cat":"gsap","desc":"חלון כהה עם שלוש נקודות בכותרת. שורת הפקודה מוקלדת תו אחרי תו עם סמן שנע אחרי התו האחרון, ומתחתיה שלוש שורות תוצאה שנכתבות מהר יותר, כל אחת עם סימן וי שקופץ לפניה. כשהשורה נגמרת המספרים והמילים החשובות בה נצבעים, ובסוף מגיעה שורת סיכום עם הזמן שלקח.","when":"שירות שמריץ משהו מאחורי הקלעים ויכול להראות את זה בשלוש שורות: אוטומציה, סנכרון הזמנות, גיבוי, מערכת חשבוניות, חיבור בין כלים. מתאים לסקשן ״איך זה עובד״ או להוכחה שהשירות באמת עושה את העבודה. לא לשירות שאין לו תוצאה שאפשר למנות: שורות של יומן עבודה בלי מספר אמיתי נראות מוזרות."},{"id":"g245","name":"אתר בתוך חלון דפדפן שעובר בין עמודים","cat":"gsap","desc":"חלון דפדפן עם שורת כתובת, ובתוכו אתר של מאפייה. העמוד גולל לאט כלפי מטה, ואז מתחלף לעמוד הבא שעולה מלמטה, וכתובת האתר למעלה מתעדכנת בכל מעבר: דף הבית, התפריט, ובסוף טופס הזמנה. כל זה קורה בזמן הגלילה, ואפשר לעצור באמצע ולחזור אחורה.","when":"סקשן שמראה את האתר או המוצר של הלקוח כמו שהוא נראה: תיק עבודות של סטודיו, הצגת מערכת הזמנות, דוגמה לאתר שנבנה, הסבר על שלושה עמודים שהשירות כולל. כדאי שיהיו שלושה עד ארבעה מסכים אמיתיים של אתר אחד. לא לאתר שאין לו מה להראות בפנים: חלון דפדפן ריק רק מסתיר את העמוד."},{"id":"g246","name":"ידיות בחירה שמותחות ומסובבות תמונה","cat":"gsap","desc":"תמונה על לוח עבודה, סביבה מסגרת בחירה עם שמונה ידיות ועם ידית סיבוב מעליה. סמן קטן תופס את הפינה ומותח את התמונה עד הגודל המלא, ואז תופס את ידית הסיבוב ומטה אותה בכמה מעלות. תווית המידות מתחת לתמונה ולוח הנתונים בפינה מתעדכנים בזמן אמת.","when":"שירות שקשור לעיצוב, צילום או עריכה: סטודיו קריאייטיב, צילום מוצר, עיצוב מודעות, בניית אתרים. אפשר להראות כך ״מתאימים לכם את התמונה למקום״ בלי לצלם מסך של תוכנה אמיתית. מתאים לראש עמוד או לסקשן ״איך אנחנו עובדים״. לא לעסק שאין לו עריכה של תמונות: ידיות בחירה בלי עבודה מאחוריהן נראות כקישוט."},{"id":"g247","name":"מקלדת על המסך שמקישה את ההודעה","cat":"gsap","desc":"טלפון עם שיחה פתוחה. מקלדת עברית עולה מתחת לשדה ההודעה, המקשים נלחצים אחד אחרי השני והאותיות מופיעות בשדה בדיוק באותו קצב, והחץ בצד השדה נצבע. בסוף מקש השליחה נדלק ונלחץ, המקלדת יורדת וההודעה נשארת בשיחה כבועה שנשלחה.","when":"שירות שמדבר עם לקוחות בצ׳אט או בוואטסאפ: קביעת תורים, תשובות לפניות, מוקד שירות, מענה אוטומטי. מראה שהתשובה לוקחת שנייה ובאה מהטלפון. מתאים לסקשן ״איך זה עובד״ או לראש עמוד של שירות שיחות. לא לשירות שאין בו שיחה: מקלדת שמקישה בלי הודעה אמיתית היא רעש."},{"id":"g248","name":"מסגרת שסורקת ימי שבוע ונעצרת על יום אחד","cat":"gsap","desc":"שבעה אריחי ימים בשורה. מסגרת קטנה קופצת מיום ליום, מהר בהתחלה ובהאטה הולכת וגוברת, ונעצרת על יום אחד. שאר הימים מתעמעמים, היום שנבחר נצבע, והמשפט שמתחת מתחלף לתאריך ולשעות הפנויות. קו דק מתמלא לאורך הסריקה.","when":"שירות עם תורים או מועדים: קליניקה, ייעוץ, פגישות, מועד השקה, אירוע. התנועה אומרת בלי מילים ״בדקנו בשבילכם ובחרנו את היום הקרוב ביותר״. לא מתאים כשהלקוח בוחר יום בעצמו: סריקה שנגמרת בבחירה של המערכת מבטיחה בחירה אוטומטית, ואם אין כזו זה מטעה."},{"id":"g249","name":"כתובת ארוכה שמצטמצמת לתווית עגולה קצרה","cat":"gsap","desc":"קישור ארוך מאוד נכתב תו אחר תו בשורה אחת, עם קצוות שדוהים וסמן מהבהב. בסוף השורה כולה מתכווצת לתווית עגולה וכהה ובה הקישור הקצר, כשהחלק האחרון שלו נצבע. מתחת מופיעה שורה שסופרת כמה תווים נחסכו.","when":"שירות שמקצר, מפשט או מארגן: קישורים לקמפיינים, כתובות שנשלחות ללקוחות, חבילה מורכבת שהופכת להצעה אחת. טוב לכניסה למסך של פיצ׳ר קטן. לא לעסק שאין לו מה לקצר: אותה תנועה על טקסט שקצר ממילא נראית כמו תרגיל."},{"id":"g250","name":"חלון שעובר על תמונה גסה ומצייר מפת קצוות","cat":"gsap","desc":"תמונה מפוקסלת לרשת של ארבע עשרה על ארבע עשרה משבצות. מסגרת קטנה עוברת עליה שורה אחרי שורה לפי הגלילה, ובפאנל שליד נצבעת מפה של המקומות שבהם הצבע משתנה בבת אחת. בין שני הפאנלים מילה גדולה אחת שנותנת שם לפעולה, ומתחת מונה שסופר כמה משבצות נסרקו.","when":"סקשן ״איך זה עובד״ של שירות שמנתח משהו: בדיקת איכות בייצור, זיהוי מוצרים בתמונה, ניתוח מסמכים, חיפוש לפי תמונה. הגלילה היא סרגל ההתקדמות, והמבקר רואה את הניתוח נבנה במקום לקרוא עליו. לא לשירות שאין בו ניתוח אמיתי: מפה שנצבעת בלי שום משמעות היא קישוט שמבטיח יותר מדי."},{"id":"g251","name":"קשקוש על תמונה שמוחק את האובייקט","cat":"gsap","desc":"תמונת מוצר עם שלושה גביעי גלידה בשורה. קו קשקוש נצבע בזיגזג על הגביע הימני, והגביע נמחק והרקע משלים את עצמו. אחר כך אותו דבר על השמאלי. בסוף קופצת תווית קטנה שמספרת מה הוסר.","when":"שירות של עריכת תמונה, ניקוי רקע, צילום מוצר או שיפור תמונות בבינה מלאכותית: ״מסמנים מה מפריע והוא נעלם״. מתאים לדמו בראש עמוד או לסקשן של ״לפני ואחרי״. לא לשירות שלא מנקה תמונה בפועל: המחיקה כאן היא הבטחה שמישהו יבדוק על תמונה שלו."},{"id":"g205","name":"מילת הדגשה שנכנסת אחרונה בסגנון אחר","cat":"gsap","desc":"כותרת בשתי שורות שנכנסת מילה אחרי מילה, והביטוי המודגש בכל שורה מגיע רגע אחרי כולן: בצבע המותג, בעיצוב אחר, ומתבהר מתוך טשטוש קל. השורה השנייה ממשיכה באותו מקצב. הכותרת נקראת כמשפט אחד, והדגש נוחת כמו הסיומת שלו.","when":"כותרת הירו או פתיחה של סקשן, כשיש בה ביטוי אחד שהוא הלב של המסר: מה הלקוח מקבל או למי זה מיועד. עובד באתר שקט ובאתר חוויתי, כי זו כניסה אחת. פעם אחת בעמוד, בכותרת הראשית. לא לכותרת ארוכה, ולא כשאין בה ביטוי אחד שנבדל מהשאר."},{"id":"g208","name":"שורות טקסט שזורמות על מסלולים מעוקלים","cat":"gsap","desc":"שלוש שורות של שירותים מופרדים בנקודות מתעקלות על שלושה מסלולים בעקומות שונות, כל אחת במשקל ובצבע אחר: מלאה, מתווה וצבועה. השורות זורמות לכיוונים מנוגדים, ומהירות הזרימה גדלה כשגוללים. יחד הן נראות כסרט טיפוגרפי שחולף בעמוד.","when":"רצועת מעבר בין שני סקשנים, או רקע של הירו, כשיש שישה עד עשרה שירותים או תחומים קצרים להזכיר. מתאים לסטודיו, למשרד, לקבלן ולמרפאה עם כמה תחומי עיסוק. פעם אחת בעמוד. לא כשהמילים צריכות להיקרא לעומק, כי זה גם קישוט."},{"id":"g209","name":"משפט שנבנה מתגיות גלולה שנכנסות אחת אחרי השנייה","cat":"gsap","desc":"משפט הצעה אחד שחלק ממילותיו הן גלולות צבעוניות. בכניסה למסך המילים הרגילות מופיעות והגלולות קופצות פנימה אחת אחרי השנייה, מימין לשמאל, וכל אחת מביאה מתחתיה שורה קטנה של פרט. בסוף מתווספת הערת אגב בנטייה מתחת למשפט.","when":"סיכום שירות או הצעת ערך שאפשר לומר במשפט אחד עם ארבעה עד שישה מונחים שחשוב שיזכרו. סקשן הירו משני, שירותים, או \"איך אנחנו עובדים\". עובד גם באתר שקט. פעם אחת בעמוד. לא למשפט ארוך, ולא כשלכל מונח אין פרט שמלווה אותו."},{"id":"g211","name":"שורות שנוספות אחת אחרי השנייה והישנות מתעמעמות","cat":"gsap","desc":"משפט פתיחה אחד נעוץ במסך, ובכל גלילה נוספת שורה חדשה מתחתיו. השורה שנכנסה זה עתה היא היחידה בצבע הטקסט המלא, והקודמת מתעמעמת לאפור. כך הרשימה נבנית כמו משפט מצטבר, והעין תמיד יודעת איפה הקורא נמצא.","when":"שירותים, שלבי עבודה או התחייבויות של עסק, בארבע עד שש שורות קצרות שכל אחת משלימה את הקודמת. מתאים לעמוד שירות, לאודות ולתהליך עבודה. פעם אחת בעמוד, בסקשן הנעוץ היחיד. לא לשורות ארוכות ולא כשהסדר ביניהן לא חשוב."},{"id":"g212","name":"רצועת שמות שנעה והשם במרכזה מואר","cat":"gsap","desc":"רצועה של שמות לקוחות זורמת בלי הפסקה, כשכל השמות מתווה ריק חוץ מזה שנמצא במרכז: הוא נצבע במלואו בצבע המותג, ובדרך החוצה חוזר להיות מתווה. השם המואר מתחלף ברציפות, ומתחת לרצועה עומד נתון אחד גדול.","when":"רצועת לקוחות, שותפים או מותגים שאין להם לוגו מוכן, או שרוצים להאיר בהם אחד בכל פעם. מתאים לסקשן הוכחה, מתחת להירו או לפני הצעה. פעם אחת בעמוד. לא כשיש פחות משישה שמות, ולא כשהשמות הם הבטחה משפטית."},{"id":"css38","name":"מילה ענקית שגולשת מהמסגרת עם עותקים מטושטשים בעומק","cat":"css","desc":"מילה אחת בגודל כזה שהיא חורגת מהמסגרת ונחתכת בקצוות, ומאחוריה שני עותקים מטושטשים בצבע המותג. כשגוללים, שלוש השכבות זזות בקצבים שונים: הרחוקה והמטושטשת הכי הרבה, החדה הכי מעט. נוצר עומק של כרזה, בלי JavaScript.","when":"פתיחה בסגנון כרזה לעסק עם שם או מוצר של מילה אחת חזקה: קפה, לחם, ספה, פרחים. מתאים להירו, לסקשן הפרדה או לקריאה לפעולה. פעם אחת בעמוד. לא למילה ארוכה ולא למשפט, ולא לאתר שהטקסט בו צריך להיקרא ראשון."},{"id":"g231","name":"מילה גדולה עם הדים שנגררים אחריה","cat":"gsap","desc":"מילה אחת גדולה מצוירת כמה פעמים מאחורי עצמה: חמישה עותקים בקו מתאר בצבע המותג, כל אחד מוסט מעט יותר מהקודם ובהיר פחות. כשהעמוד נכנס למסך העותקים נפתחים מהמילה אחד אחרי השני. כשגוללים מהר או מזיזים את העכבר המילה זזה, והעותקים נגררים אחריה בהשהיה, אחד אחרי השני, ואחרי רגע חוזרים ונשארים כערימה מוסטת מאחוריה. בלי GSAP ובהפחתת תנועה הערימה עומדת במקומה.","when":"כותרת הירו או פתיח של עמוד שכולו מילה אחת קצרה וחזקה, באתר עם אופי נועז: סטודיו, מותג צעיר, אירוע או קולקציה. מילה של עד שש אותיות, פעם אחת בעמוד. כשצריך לקרוא משפט שלם ההדים רק מפריעים."},{"id":"g232","name":"אותיות שנוחתות במתיחה ובמעיכה","cat":"gsap","desc":"כותרת נבנית אות אחרי אות, לפי סדר הקריאה. כל אות יורדת מלמעלה ארוכה וצרה, עם צל בצבע המותג שנגרר מעליה, נמעכת לרגע כשהיא פוגעת בקו הבסיס, קופצת מעט למעלה ומתיישבת בגודל הרגיל. הקפיצה והמעיכה בנויות משלוש תנועות עוצמה רגילות בזו אחר זו, בלי עקומות קפיץ. בלי GSAP ובהפחתת תנועה הכותרת מוצגת סגורה.","when":"כותרת הירו קצרה, עד עשרים וארבעה תווים בשורה, בעמוד של מותג עם אופי שובב או חזק: מטבחים, קייטרינג, מותג לילדים, חדר כושר. פעם אחת בעמוד, בכותרת הראשית בלבד."},{"id":"g233","name":"פרוסות של מילה שקופצות הצידה וחוזרות למקום","cat":"gsap","desc":"מילה גדולה שממולאת בתמונה נחתכת לשבע פרוסות אופקיות. כשהיא נכנסת למסך הפרוסות קופצות הצידה בצעדים חדים, בכיוונים מתחלפים, ופסים דקים בצבע המותג מחליקים עליהן. אחר כך כל הפרוסות נשמטות חזרה ליישור והמילה נשארת שלמה. אותו דבר קורה שוב בכל ריחוף בעכבר. בלי GSAP ובהפחתת תנועה המילה מוצגת שלמה.","when":"מילה אחת שמסמלת את הרגע שבו העמוד נפתח, באתר של עסק שרוצה חדות ותנועה: הפלגות, מוזיקה, אירועים, מותג לצעירים. התמונה שממלאת את המילה חייבת להיות צבעונית וברורה, והמילה עבה מספיק כדי שהתמונה תיראה בתוכה."},{"id":"g234","name":"אותיות שנוחתות על קווי הנחיה","cat":"gsap","desc":"ארבעה קווי הנחיה אופקיים נמתחים לרוחב הסקשן, מהצד שבו מתחילה הקריאה: קו עליון לאותיות הגבוהות, קו לגובה האות, קו בסיס וקו תחתון לאותיות שיורדות. אחר כך אותיות הכותרת יורדות מלמעלה אחת אחרי השנייה, מסתובבות מעט ונוחתות על קו הבסיס, והקו נדלק בצבע המותג כשהמילה שלמה. בלי GSAP ובהפחתת תנועה המילה מוצגת עם הקווים הדהויים.","when":"סקשן שמציג מלאכה שקשורה לאותיות: קליגרפיה, מיתוג, הוצאה לאור, עיצוב גרפי, בית דפוס. מילה אחת גדולה, פעם אחת בעמוד, וכדאי שיהיו בה אות גבוהה (כמו ל) ואות יורדת (כמו ק), כדי שהקווים יסבירו משהו."},{"id":"g235","name":"כותרת עם אווטארים שמתחלפים ומילה שמתגלגלת","cat":"gsap","desc":"בתוך משפט הכותרת יושבת חבילה של ארבעה עיגולים חופפים עם פנים של אנשים, בין שתי מילים. כל כמה שניות הפנים מתחלפות בגלגול אנכי, עיגול אחרי עיגול, והמילה האחרונה במשפט מתגלגלת יחד איתן למילה אחרת. כשהכותרת נכנסת למסך החבילה צומחת עיגול אחרי עיגול. בלי GSAP ובהפחתת תנועה מוצגות ארבע פנים והמילה הראשונה.","when":"כותרת הירו של סוכנות, קליניקה או שירות שמאחוריו אנשים אמיתיים, כשיש ארבע עד שמונה תמונות פנים באיכות טובה. המילה המתגלגלת היא מי שהעסק משרת. כשאין תמונות פנים אמיתיות עדיף לוותר על המהלך."},{"id":"g236","name":"שם המותג ענק שנחתך בקצה הפוטר","cat":"gsap","desc":"בתחתית הפוטר, מתחת לעמודות הקישורים, יושבת מילת המותג ברוחב של כל המשטח, בגוון בהיר שכמעט נבלע בו, והשליש התחתון שלה נחתך בקצה. כשהפוטר נכנס למסך עמודות הקישורים עולות בעדינות, והמילה עולה מלמטה ומתיישבת. בלי GSAP ובהפחתת תנועה המילה עומדת חתוכה במקומה.","when":"סוף עמוד באתר של עסק עם שם קצר וזכיר: סטודיו, מותג, חנות. הפוטר צריך לכלול קישורים אמיתיים, והמילה היא סגירה ולא אלמנט ניווט. פעם אחת בעמוד, בפוטר בלבד, ובשם של עד שש אותיות."},{"id":"b92","name":"עדשת זכוכית שמגדילה ומעקמת את הטקסט","cat":"behavior","desc":"עדשה עגולה מזכוכית מרחפת מעל משפט גדול ומגדילה את האותיות שמתחתיה, והקצוות שלהן מתעקמים כמו בכדור אמיתי. בעכבר העדשה עוקבת אחרי המצביע בהשהיה קלה, ובלי עכבר, כמו בטלפון, היא מחליקה לבד לאורך המשפט. בלי GSAP ובהפחתת תנועה אין עדשה והמשפט מוצג כרגיל.","when":"משפט מרכזי באתר של עסק שעוסק בפרטים: משרד עורכי דין, רואה חשבון, מעבדה, בית מלאכה. מושך את העין לקריאה סבלנית של משפט אחד. לא כשהמשפט ארוך מארבע שורות, ולא כשיש כמה אזורים אינטראקטיביים באותו מסך."},{"id":"b93","name":"מילה שמחליפה משפחת גופן במקום","cat":"behavior","desc":"מילה גדולה כתובה בגופן סנס ישר וחד, ושלושה קווי הנחיה מאחוריה (קו עליון, קו בסיס וקו תחתון) לא זזים. כשהמילה מגיעה לאמצע המסך, או כשמרחפים מעליה, היא מתחלפת בטשטוש רך לאותה מילה בגופן סריף חם ואישי, באותו גובה ועל אותו קו בסיס. תווית קטנה מתחת מראה באיזה קול המילה נמצאת עכשיו. בלי GSAP ובהפחתת תנועה מוצג רק הגופן הראשון.","when":"כשרוצים להראות שני קולות של אותו עסק, הרשמי והאישי. מילה אחת בכותרת, באתר של סטודיו, יועץ או חנות בוטיק. כשהגופנים דומים מדי זה לזה אין מה להראות, וכשהשורה מכילה כמה מילים הדגש הולך לאיבוד."},{"id":"g202","name":"חותמות ומדבקות שנדבקות בטריקה","cat":"gsap","desc":"שלוש חותמות ומדבקות נוחתות על תמונת מוצר אחת אחרי השנייה. כל אחת מגיעה גדולה ומסובבת, נופלת מהר ונעצרת בבת אחת, והתמונה כולה רועדת קצת מהמכה. כל חותמת נושאת מילה אחת על המוצר: חדש, אפוי הבוקר, נשארו 6.","when":"כרטיס מוצר, מבצע או עבודה מוצגת שצריך לסמן במילה אחת: חדש, אושר, נמסר, אזל המלאי. סקשן הצעה, הוכחה או תיק עבודות. עד שלוש חותמות על תמונה, פעם אחת בכניסה, ורק עם מילים שנכונות בפועל."},{"id":"g203","name":"כרטיס סיום: לוגו, כותרת וכפתור בזה אחר זה","cat":"gsap","desc":"כרטיס הסגירה של העמוד נבנה בסדר קבוע: המשטח נרגע במקומו, הסמל והשם מתיישבים במרכז, הכותרת עולה מילה אחרי מילה והקו מתחת לביטוי המרכזי נמתח, ואז הכפתור נכנס עם נחיתה קטנה ושורת הפרטים הקטנים מופיעה אחרון. בסוף רואים הכול ביחד, ואין ספק איפה ללחוץ.","when":"סקשן הסגירה של דף נחיתה, וואן-פייג'ר או אתר תדמית, במקום פוטר עם כפתור. מתאים לכל עסק שיש לו שם, משפט אחד וקריאה אחת לפעולה. פעם אחת בעמוד, בסוף. עובד גם באתר שקט, כי כל מה שזז הוא כניסה אחת בסדר קריאה."},{"id":"g204","name":"מנעול שנסגר עם קשת שיורדת","cat":"gsap","desc":"מנעול גדול עם הקשת מורמת. כשהסקשן נכנס למסך הקשת יורדת ונעצרת בגוף המנעול, יש לו רעד קטן, טבעת אור אחת מתפשטת ממנו ודועכת, ואז כרטיס הפרטים נפתח לידו ושורות הכרטיס נכנסות אחת אחרי השנייה. ההבטחה נחתמת לפני שקוראים אותה.","when":"סקשן אבטחה, גיבוי או פרטיות: מערכת עם מידע של לקוחות, משרד שמחזיק מסמכים, שירות עם שחזור. רק כשיש מאחורי המנעול הבטחה אמיתית אחת שאפשר לפרט בשלוש שורות. פעם אחת בעמוד."},{"id":"b83","name":"פיצוץ קונפטי או ניצוצות בהצלחה","cat":"behavior","desc":"טופס קצר עם כפתור אמיתי. אחרי השליחה הטופס מתחלף באישור: עיגול עם וי שמצטייר, ומסביבו קווים קצרים ונקודות מתפזרים החוצה ודועכים תוך פחות משניית אחת, כשהעיגול רועד קצת. תנועה אחת קצרה שאומרת שזה עבד.","when":"אחרי פעולה שהמבקר מחכה לה: טופס פנייה, קביעת תור, הרשמה, תשלום ששולם. רק כשמדובר בחדשות טובות ופעם אחת, לא על כל לחיצה. לא אחרי טופס רגיש (רפואי, משפטי, כספי): שם מספיק וי שקט."},{"id":"b84","name":"מספרים שקופצים ונערמים בכל לחיצה","cat":"behavior","desc":"בונים הצעה בלחיצות. כל לחיצה על שירות מקפיצה את המחיר שלו כמספר \"+\" מעל השורה, והמספר נוחת בראש ערימה בצד: השורות הישנות יורדות, הישנה ביותר יוצאת, וסך ההצעה שבפינה רץ למעלה אל הערך החדש ונדחף קצת. אפשר לראות מה נוסף ומה זה עשה לסכום, בלי לחפש.","when":"מחשבון הצעת מחיר, בחירת תוספות, חבילת שירותים שמרכיבים בעצמם, או כל מקום שבו כל פעולה מוסיפה ערך שהמבקר רוצה לראות נצבר. שלוש עד שש אפשרויות. לא כשיש בחירה אחת או מחיר קבוע."},{"id":"b85","name":"כפתור שהופך לפס התקדמות ולאישור","cat":"behavior","desc":"כפתור \"אישור ההצעה\" רחב. בלחיצה הוא מתכווץ לגלולה: התווית מתגלגלת למעלה ומוחלפת באייקון, במילה \"מאשרים\" ובאחוז שעולה, ופס דק בתוכה מתמלא. בסוף הגלולה מתכווצת עוד, הצבע מתהפך, וי מצטייר ועולה המילה \"אושרה\", והכרטיס ננעל.","when":"פעולה שיש לה אורך אמיתי: אישור הצעת מחיר או הזמנה, שליחת קבצים, תשלום, חתימה על מסמך. כשהכפתור הוא הרגע שהמבקר מחליט, והוא צריך לראות שמשהו קורה ושזה נגמר. לא כשהפעולה מיידית, ולא כשהאחוזים לא משקפים תהליך אמיתי."},{"id":"b86","name":"טבעת פינג בנקודת הלחיצה","cat":"behavior","desc":"בכל לחיצה על כפתור יוצאת טבעת דקה בדיוק מהנקודה שנלחצה, מתרחבת מעבר לכפתור ודועכת, והכפתור נלחץ פנימה קצת. בלחיצה במקלדת הטבעת יוצאת מהמרכז. שלושה כפתורים בגדלים וצבעים שונים, והטבעת נראית על כל אחד מהם.","when":"כפתורי הקריאה לפעולה הראשיים: קביעת שיחה, שליחה, הזמנה. נותן לכל לחיצה תחושה של משהו שהגיב, בלי להסתיר את הכפתור. לא על כל כפתור בעמוד, ולא על כפתור שמעביר מיד לעמוד אחר."},{"id":"g264","name":"קיר צילומים שמתעמעם ושלושה כרטיסים צפים קדימה","cat":"gsap","desc":"קיר של שלושים ושניים צילומים ממלא את הבמה. בגלילה הקיר מתעמעם ומיטשטש, ושלושה צילומים יוצאים מהמקום שלהם בקיר אל מרכז המסך: הם גדלים, מסתובבים קצת וחופפים זה את זה. הם נשארים חדים ועם כיתוב, והקיר נשאר מאחוריהם כרקע. הקורא מבין מה נבחר בלי שמישהו אמר לו להסתכל.","when":"ארכיון גדול ובתוכו מעט פריטים שהם העניין: שלוש העבודות המובילות בתיק עבודות של סטודיו, שלושה פרויקטים בדף של קבלן, שלוש חבילות בחנות. הקיר מראה כמה יש, והכרטיסים מראים מה בחרנו. פעם אחת בעמוד, ליד כותרת שאומרת למה בחרנו דווקא אותם. לא מתאים כשכל הפריטים שווים בחשיבותם."},{"id":"g265","name":"אותו צילום בפסים ובתשע פלטות צבע","cat":"gsap","desc":"אותו פורטרט חוזר בחמישה פסים אנכיים, וכל פס צבוע בשני גוונים אחרים מהפלטה של האתר, כשהפס האמצעי נשאר בצבע המלא. אחרי עצירה קצרה הפסים נמסים, ובמקומם נפתחת רשת של תשע גרסאות של אותו צילום, כל אחת בפלטה אחרת ועם רשת נקודות דקה. המספר ליד המסגרת עובר מחמש לתשע.","when":"מקום שבו צריך להשוות בין מראות של אותו דבר: פלטות צבע של מותג, גרסאות צבע של מוצר, אותו פורטרט בכמה סגנונות הדפסה. מתאים לדף של סטודיו לעיצוב או להדפסה, לחנות עם וריאציות צבע ולתיק עבודות. פעם אחת בעמוד, כשהבחירה בצבע היא הנושא. לא כשיש צילום אחד שאין לו שום אפשרות אחרת."},{"id":"g266","name":"אריחי צילום שנופלים לתאי לוח שנה","cat":"gsap","desc":"לוח של חודש נובמבר מונח על הבמה, ותשעה אריחי צילום נופלים אליו מלמעלה, אחד אחרי השני לפי סדר התאריכים. כל אריח נוחת בתא של היום שלו, נמעך לרגע ומתיישר, והמספר ליד הלוח סופר את הימים שנסגרו. מימין רשימה של אותם תשעה ימים, עם שם העסק ומה מצלמים בו.","when":"כל עמוד שיש בו תאריכים אמיתיים: לוח צילומים של סטודיו, מועדי מפגשים, הרצאות, השקות, ימי ביקור של קבלן בשכונות. הנפילה אומרת שהיומן מתמלא, והרשימה אומרת במה. פעם אחת בעמוד, כשהתאריכים הם הסיפור. לא כשיש יותר מתשעה או עשרה אירועים בחודש, וגם לא כשאין תאריכים אמיתיים."},{"id":"b101","name":"תמונות ממוזערות: פוסלים ושומרים","cat":"behavior","desc":"כרטיס תוצאות עם מספר גדול וקו עולה, ומתחתיו שלוש תמונות לבדיקה. כשהקטע נכנס למסך שתי התמונות החלשות מקבלות סימן X ונעמעמות, אחת אחרי השנייה, ואז נשרטטת מסגרת סביב התמונה שנשארת, והמספר רץ לערך שלה והקו נשרטט איתו. אפשר ללחוץ על כל תמונה כדי לראות אותה כזוכה, והמספר והקו עוברים אליה.","when":"דף תוצאות או בדיקה: בדיקת A/B של מודעות, שלוש גרסאות של עמוד נחיתה, שלוש טיוטות של לוגו, שלושה צילומי מוצר ומה שהמכירות אמרו עליהם. מתאים כשיש מספר אמיתי לכל אפשרות ורוצים להראות למה נבחרה אחת. שלוש אפשרויות, פעם אחת בעמוד. לא כשאין בדיקה אמיתית מאחורי המספרים."},{"id":"g267","name":"ערימת צילומים שמצטמצמת לרשת מספרים לבחירה","cat":"gsap","desc":"תשעה צילומים נערמים במרכז הבמה כמו חבילת קלפים, כל אחד מוטה קצת אחרת. בגלילה הם עוברים מהעליון למטה ומצטמצמים אל רשת של 3 על 3, וכשהם מתיישבים מופיע על כל אחד מספר ושם. ליד הרשת מופיעה שאלה גדולה, ואפשר לבחור צילום ולראות את השם שלו בשורה מתחת.","when":"סקשן בחירה בלי טופס: כיוון עיצוב לבית, סגנון לוגו, חבילת צילום, תפריט מראות לחנות. שישה עד תשעה פריטים, וכל אחד צריך שם קצר. הערימה מראה את כל האפשרויות בבת אחת והרשת נותנת לבחור. פעם אחת בעמוד, לפני טופס או כפתור של שיחה. לא כשיש פחות משישה פריטים או כשהמספרים אינם מעבירים מידע."},{"id":"g268","name":"פסיפס צילומים שצץ מהמרכז עם מונים רצים","cat":"gsap","desc":"פסיפס רחב של 160 אריחי צילום ממלא את המסגרת. האריחים צצים בגל מהמרכז החוצה, כל אחד בגודל התחלה ובקצב קצת אחרים, והשוליים מחשיכים בהדרגה. באמצע נכנס כרטיס עם שני מספרים גדולים שרצים למעלה ושורת הסבר מתחתיהם.","when":"סקשן שמראה היקף: ארכיון של סטודיו, ספריית תמונות, מאגר מוצרים, מספר הלקוחות והפרויקטים. הפסיפס אומר 'יש הרבה' לפני שמישהו קרא מספר, והמספרים נותנים את הפירוט. פעם אחת בעמוד, ליד הוכחה או 'אודות'. לא כשאין ארכיון אמיתי גדול, ולא כשהמספרים אינם נכונים."},{"id":"g279","name":"קווים שמתפצלים ואחד מהם נבחר","cat":"gsap","desc":"צומת אחד כבר הושלם, ומתוכו יוצאים ארבעה קווים דקים לארבע אפשרויות. האפשרויות נגלות אחת אחרי השנייה, ואז אחת נבחרת: הקו שלה מתעבה וצובע את עצמו, הצומת מתמלא בצבע ומקבל תווית, והשלוש האחרות נחלשות. הגלילה מובילה את הבחירה, וגלילה אחורה מחזירה את כל האפשרויות לפתוחות.","when":"סקשן שמראה איך מכמה כיוונים מגיעים לתוכנית אחת: בחירת מסלול התחלה, חבילה, גרסה מומלצת או כיוון עיצובי. מתאים כשיש שלוש עד ארבע אפשרויות אמיתיות ואחת מהן היא ההמלצה שלכם. לא כשיש רק שתי אפשרויות, ולא כשהבחירה שייכת למבקר ולא לכם. פעם אחת בעמוד."},{"id":"g280","name":"קו מפותל שהופך לישר בין שני צמתים","cat":"gsap","desc":"בין עיגול לריבוע נמתח קו מפותל עם לולאות, ועליו תלויות ארבע תוויות כמו חרוזים על חוט. בגלילה הלולאות נפתחות לגלים, הגלים מתיישרים לקו אחד, וצבע הקו עובר מאפור לצבע המותג. התוויות נמשכות עם הקו ונעצרות מסודרות לאורכו, בזמן שהצמתים עצמם לא זזים.","when":"מעבר מבלגן לסדר: חומרים מפוזרים שהופכים לתוכנית, תהליך עבודה שהיה מסובך והפך לפשוט, מסלול ישיר בין הבקשה למוצר. סקשן ״איך זה עובד״ או ״הבעיה והפתרון״. מתאים כשיש שני קצוות ברורים וארבע דוגמאות לבלגן שביניהם. פעם אחת בעמוד."},{"id":"g281","name":"צמתי קלט שמתכנסים להחלטה","cat":"gsap","desc":"שלושה צמתי קלט מחוברים בקווים דקים לצומת מרכזי, ועל כל קו משקל קטן. בגלילה הקלטים נדלקים אחד אחד, כל קו מתמלא בצבע, והציון בצומת המרכזי עולה ומראה מאילו חלקים הוא מורכב. כשהציון חוצה את הסף על הסרגל, ההחלטה מימין מתהפכת מ״ממתינים״ ל״מקבלים את הפרויקט״.","when":"הסבר איך מתקבלת החלטה: אם לקחת פרויקט, מה נכנס לשיקול בהצעת מחיר, איך נקבע שלב בתהליך. מתאים כשיש שלושה גורמים אמיתיים עם משקל, סף ברור ותוצאה אחת. סקשן ״איך אנחנו מחליטים״, ״איך נבנה המחיר״ או ״איך זה עובד״. לא כשהמשקלות מומצאים, כי הדיאגרמה נראית מדויקת ויוצרת ציפייה. פעם אחת בעמוד."},{"id":"g283","name":"מעגל תהליך עם הדגשה שנודדת","cat":"gsap","desc":"ארבעה שלבים סביב מעגל, עם חצים מעוגלים ביניהם. הדגשה עוברת משלב לשלב: השלב נדלק, פס ההתקדמות שבתוכו מתמלא, החץ אל השלב הבא מצטייר, והשלב הבא נדלק. אחרי הרביעי המחזור מתאפס וחוזר מההתחלה, והתנועה נעצרת כשהסקשן יוצא מהמסך. בטלפון המעגל הופך לרשימה אנכית עם חץ חזרה בצד.","when":"שירות שחוזר על עצמו: תחזוקה חודשית של אתר, מחזור קמפיין, בדיקה תקופתית, ריטיינר. מתאים כשיש ארבעה עד חמישה שלבים בסדר קבוע והמחזור חוזר מההתחלה, כי המעגל מראה את זה בלי להסביר. לא לתהליך שיש לו סוף, כמו פרויקט חד פעמי. פעם אחת בעמוד."},{"id":"g219","name":"לוח צבע אלכסוני שעובר ומחליף תמונה","cat":"gsap","desc":"שתי תמונות מלאות זו על זו, וכשגוללים לוח צבע אלכסוני רחב עובר על המסך מימין לשמאל, ומאחוריו נחשפת התמונה השנייה. מיד אחריו חולף לוח שני, דק ובהיר יותר. המעבר מכסה את הראשונה ומגלה את הבאה בתנועה אחת, בלי קפיצה.","when":"מעבר בין שני פרקים של אותו סיפור שלכל אחד תמונה גדולה משלו: בית קפה ואז המאפייה, לפני ואחרי, שני מוצרים, שני מקומות. פעם אחת בעמוד, ורק כשהתמונות חזקות מספיק כדי לשאת את המעבר."},{"id":"g220","name":"סרט פסים עבה שנמתח על המסך וחושף את הסקשן הבא","cat":"gsap","desc":"סרט עבה בכמה פסי צבע, עם מסגרת כהה וראש מעוגל, נכנס מימין המסך ושוחה במסלול מתעקל עד הקצה השמאלי. מאחורי הראש נחשף הסקשן הבא, והזנב ממשיך לחלוף עד שהסרט יוצא מהמסך. המעבר מרגיש כמו משיכת קו אחת שמעבירה אתכם הלאה.","when":"מעבר בין שני סקשנים חזקים באתר שיש לו אופי גרפי ושובב: סטודיו, מותג לילדים, אירוע, מרפאה ידידותית. פעם אחת בעמוד, כשיש סקשן אחד שנגמר ואחד שמתחיל, ושניהם עם תוכן. באתר רציני וקפדני עדיף לוח שקט."},{"id":"g221","name":"מעבר מהיר בין מסכי מוצר עם טשטוש תנועה","cat":"gsap","desc":"חלון דפדפן אחד נעוץ במסך, ובתוכו שלושה מסכי מערכת בשורה. בגלילה המצלמה לא גוררת אלא מזנקת: המסך הנוכחי נזרק הצידה במהירות עם טשטוש תנועה אופקי, והבא נוחת במקומו חד ויציב. הטשטוש תלוי במהירות בלבד, אז כשעוצרים באמצע הוא נעלם.","when":"הסבר של זרימה אמיתית במערכת או באפליקציה: הזמנה, תשלום, ניהול. שלושה מסכים ברורים שלכל אחד תפקיד. מתאים להראות שהמערכת פשוטה ושהשלבים באים בזה אחר זה. לא לשימוש כשכל מסך מלא טקסט קטן שצריך לקרוא בזמן המעבר."},{"id":"g222","name":"שם שמתכווץ לקו דק ונפתח לסקשן הבא","cat":"gsap","desc":"שם הסטודיו בגדול על רקע כהה. בגלילה הוא נמעך לגובה אפס ונהפך לקו אור דק, כמו מסך ישן שנכבה. הקו מתארך לרוחב המסך, ואז נפתח מהמרכז למעלה ולמטה כמו עפעפיים, ובמרווח שנפתח מופיע הסקשן הבא עם התמונה והטקסט שלו.","when":"פתיחה או מעבר ראשון של אתר סטודיו, צילום, עיצוב או אדריכלות, שמתחיל בשם ואז נכנס לעבודה. מעבר דרמטי, לכן פעם אחת בעמוד ובין שני סקשנים שיש להם משקל."},{"id":"g223","name":"תמונה מלאה שמצטמצמת לפאנל ליד טקסט","cat":"gsap","desc":"תמונה אחת על כל המסך עם כותרת. בגלילה תמונה שנייה נכנסת מהצד הימני ותופסת את המקום, ואז היא מצטמצמת לצד אחד והמסך נחתך לשני פאנלים: התמונה ובצדה משטח כהה עם פרטי הפרויקט. קווי שיער נמתחים על המשטח ומסדרים אותו.","when":"תיק עבודות, מקרי בוחן או גלריית פרויקטים שבה כל פרויקט מקבל רגע משלו: תמונה גדולה, ואז הפרטים. מתאים לאדריכלות, עיצוב פנים, צילום, בנייה. פעם אחת בעמוד, על פרויקט מוביל."},{"id":"g224","name":"מחיקה מעגלית כמו מחוג שמחליפה מספר","cat":"gsap","desc":"עיגול גדול עם טבעת דקה וסימני שעון, ובמרכזו מספר ענק. בגלילה מחוג דק מסתובב סביב המרכז, ומאחוריו המספר הבא מחליף את הקודם בצבע אחר, פלח אחר פלח, כמו שעון שנסגר. קו אור אופקי מהבהב על פני המסך בכל סיבוב, והטקסט שלצד העיגול מתחלף יחד איתו.","when":"תהליך עבודה בשלושה שלבים ברורים: ייעוץ, תכנון, ביצוע. כל מקום שבו המספר הוא מידע ולא קישוט, ושלושה שלבים באים אחד אחרי השני. מתאים גם לספירה לאחור של הצעה או מבצע."},{"id":"g225","name":"מונה לאחור על מסך פתיחה קצר","cat":"gsap","desc":"מסך פתיחה כהה ובמרכזו מספר ענק עם צל קשיח בצבע המותג, בתוך טבעת דקה עם סימני שעון. הוא סופר שלוש, שתיים, אחת, כשהטבעת נצבעת עם הזמן, ואז המסך כולו מתרומם ומגלה את האתר, שכל חלקיו נכנסים מיד אחריו. כל זה במהירות של שנייה וחצי.","when":"אתר חוויה, סטודיו, השקה או אירוע שמתחילים בדרמה קצרה לפני הדף. רק כשהדף באמת נטען לאט מהמסך, או פעם אחת בכל ביקור. באתר שבו המבקר מחפש תשובה מהר, אל תשתמשו בו."},{"id":"g226","name":"תמונה מוטה שעפה אל הצופה עם טשטוש רדיאלי","cat":"gsap","desc":"תמונה קטנה ומוטה במרכז המסך. בגלילה היא מסתובבת ישר ומתקרבת אל הצופה, ומסביבה נמתחים עותקים חיוורים וקרני אור שיוצאות מהמרכז, כמו צילום בזום מהיר. כשהיא נוחתת במקומה, הקרניים נעלמות והמספר שלצדה כבר קפץ לערך גדול.","when":"סקשן הוכחה או פתיחה של אתר מוצר, צילום או מותג עם תמונה אחת חזקה ונתון אחד גדול: כמה לקוחות, כמה מוצרים, כמה שנים. פעם אחת בעמוד. בטלפון זה רק התקרבות וסיבוב, בלי הטשטוש."},{"id":"g158","name":"צורה אחת שעוברת בין מצבי המוצר","cat":"gsap","desc":"צורה כהה אחת נעוצה בצד המסך, והשלבים גוללים לידה. בכל שלב היא משנה גודל, פינות וצבע והופכת לחלק אחר במוצר: כפתור \"קביעת פגישה\", יומן עם שעות פנויות, הודעת אישור, ולבסוף עיגול עם וי. זה לא ארבעה כרטיסים, זה אותו דבר שמתפתח.","when":"\"איך זה עובד\" של שירות או מוצר עם זרימה אמיתית: הזמנת תור, הזמנה בחנות, הרשמה, תשלום, אפליקציה. שלושה עד חמישה מצבים שבאים אחד מהשני. פעם אחת בעמוד, בסקשן התהליך."},{"id":"g159","name":"נקודה שקופצת מכותרת לכותרת","cat":"gsap","desc":"כל כותרת בעמוד נגמרת בנקודה בצבע המותג, אבל זו אותה נקודה. כשגוללים היא ניתקת מהכותרת, קופצת בקשת, נמתחת בנפילה, נמעכת לרגע כשהיא נוחתת, ומתיישבת כנקודה בסוף הכותרת הבאה. סימן פיסוק שמלווה את הקורא לאורך הסיפור.","when":"עמוד תדמית או סטודיו עם כמה כותרות קצרות וחזקות, מרוחקות זו מזו, ומותג שיש לו נקודה או עיגול בלוגו. הנקודה הופכת לחתימה שעוברת בין הסקשנים ונוחתת בסוף על הקריאה לפעולה."},{"id":"g154","name":"צלילה לתוך עדשת המשקפיים","cat":"gsap","desc":"פורטרט במשקפי שמש, ובעדשה מתנגן סרטון כמו השתקפות. בגלילה המצלמה צוללת לתוך העדשה עד שהיא ממלאת את המסך, ואז הסרטון יוצא ממנה ומתיישב במסגרת מעוגלת באמצע העמוד, וממשיך מאותה שנייה.","when":"הירו של סטודיו, צלם, מעצב, או מותג אופנה ואופטיקה, כשיש פורטרט אמיתי וסרטון שמראה את העבודה. הצלילה היא הדרך מהפנים אל העבודה: קודם מי אנחנו, ואז מה אנחנו עושים. פעם אחת בעמוד, בראש."},{"id":"g155","name":"יציאה מתוך אות (מעבר לסקשן בצבע הפוך)","cat":"gsap","desc":"המסך בצבע העמוד הוא בעצם החלק הפנימי של אות ענקית. בגלילה המצלמה מתרחקת, האות מתכווצת למקומה בתוך משפט, והמשפט נגלה על רקע בצבע ההפוך. מעבר בין סקשן בהיר לכהה (או להפך, בעור כהה) בלי חיתוך.","when":"מעבר בין שני סקשנים בצבעים הפוכים, לפני הצהרה, ערכים או משפט מפתח. משפט קצר, עד שתי שורות, בגופן עבה. פעם אחת בעמוד."},{"id":"g156","name":"אות הלוגו שנפתחת לתמונה","cat":"gsap","desc":"אות הלוגו מצוירת כקו, מתמלאת, ואז דרכה רואים תמונה. בגלילה האות גדלה מהמקום הכי עבה שלה עד שהתמונה ממלאת את כל המסך, והכיתוב עולה עליה.","when":"פתיחה של אודות או של הסטודיו, אחרי ההירו, כשללוגו יש אות בולטת ועבה ויש תמונה אחת שמחזיקה מסך מלא: המקום, האנשים, העבודה. פעם אחת בעמוד."}], CATS={"comp":"קומפוזיציות","rhythm":"מקצבי עמוד","style":"שפות עיצוב","anti":"אנטי-פטרנים","arch":"ארכיטיפים","gsap":"GSAP","behavior":"התנהגויות","header":"הדרים","hero":"הירו","footer":"פוטרים","conv":"המרה ומצבים","css":"CSS טהור","lm":"חתימה (LM)","misc":"מסגרת"}, CHG=window.MV_CHANGES||{};

  }
  function paint(){
    const s=cur?MV.state(cur.id):"pending";
    document.querySelectorAll(".stbtn").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
    note.classList.toggle("on",s==="no"); ta.value=cur?MV.note(cur.id):"";
  }
  function mark(s){
    if(!cur)return;
    const now=MV.state(cur.id);
    if(now===s){MV.set(cur.id,null);paint();return;}   // לחיצה חוזרת מחזירה לממתין
    MV.set(cur.id,s,s==="no"?ta.value:"");
    paint();
    if(s==="ok")next();  // אישור זורם הלאה; דחייה נשארת כדי לכתוב סיבה
    else ta.focus();
  }
  function next(){ if(fsel.value==="pending"){ list=list.filter(e=>MV.state(e.id)==="pending"); i=Math.min(i,list.length-1); if(i<0)i=0; show(); } else { i=Math.min(list.length-1,i+1); show(); } }
  function prev(){ i=Math.max(0,i-1); show(); }
  ta.addEventListener("input",()=>{ if(cur&&MV.state(cur.id)==="no")MV.set(cur.id,"no",ta.value); });
  document.querySelectorAll(".stbtn").forEach(b=>b.addEventListener("click",()=>mark(b.dataset.s)));
  $("[data-next]").addEventListener("click",next); $("[data-prev]").addEventListener("click",prev);
  function toggleBefore(){const b=$("[data-before]"),img=$("[data-bimg]");if($("[data-chg]").hidden)return;const on=img.hidden;img.hidden=!on;b.setAttribute("aria-pressed",String(on));}
  $("[data-before]").addEventListener("click",toggleBefore);
  fsel.addEventListener("change",()=>{i=0;build();}); csel.addEventListener("change",()=>{i=0;build();});
  $("[data-report]").addEventListener("click",function(){
    const txt=MV.report(ALL); navigator.clipboard.writeText(txt).then(()=>{this.textContent="הועתק ✓";setTimeout(()=>this.textContent="העתק דוח",1500);});
  });
  document.addEventListener("keydown",e=>{
    if(e.target===ta)return;
    if(e.key==="ArrowRight")next(); else if(e.key==="ArrowLeft")prev();
    else if(e.key==="a"||e.key==="A"||e.key==="ש")mark("ok");
    else if(e.key==="x"||e.key==="X"||e.key==="ס")mark("no");
    else if(e.key==="b"||e.key==="B"||e.key==="נ")toggleBefore();
  });
  // סימון מתוך ה-iframe (הפאנל של העמוד עצמו) מתעדכן כאן דרך localStorage
  window.addEventListener("storage",paint);
  build();
})();
</script>
</body>
</html>
