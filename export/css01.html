<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS01 · הרמת כרטיס בהובר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS01 · הרמת כרטיס בהובר */
.lift-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap, clamp(16px, 1.6vw, 36px));padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.lift{background:#fff;border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);padding:26px;cursor:pointer;
transition:border-color .3s,box-shadow .3s,transform .4s cubic-bezier(.2,.6,.2,1)}
.lift:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(22,24,43,.11);border-color:#b3a8ff}
@media(max-width:767px){.lift-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="stage tight"><div class="lift-row">
<div class="lift"><h3 style="margin:0 0 6px">כרטיס א</h3><p style="margin:0;color:var(--muted)">עבור עליי עם העכבר.</p></div>
<div class="lift"><h3 style="margin:0 0 6px">כרטיס ב</h3><p style="margin:0;color:var(--muted)">גם עליי.</p></div>
<div class="lift"><h3 style="margin:0 0 6px">כרטיס ג</h3><p style="margin:0;color:var(--muted)">ועליי.</p></div>
</div></div>



</body>
</html>
