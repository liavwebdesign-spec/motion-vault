<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C12 · מסדרון אופקי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-f{background:linear-gradient(160deg,#c92a2a,#ff8787)}

/* C12 · מסדרון אופקי */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c12h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.c12h .ttl{margin:0}
.c12nav{display:flex;gap:8px;flex:none}
.c12nav button{width:46px;height:46px;border-radius:50%;border:0;padding:0;background:var(--card, #fff);color:var(--ink, #16182b);cursor:pointer;display:grid;place-items:center;transition:opacity .25s cubic-bezier(.2,.6,.2,1),transform .25s cubic-bezier(.2,.6,.2,1)}
.c12nav button:hover{transform:scale(1.06)}
.c12nav button[aria-disabled="true"]{opacity:.35;cursor:default;transform:none}
.c12nav button:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.c12{--gap:16px;display:flex;gap:var(--gap, clamp(16px, 1.6vw, 36px));overflow-x:auto;scroll-snap-type:x mandatory;padding-block:6px 14px;scrollbar-width:thin}
.c12:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:4px}
.c12 .ph{flex:0 0 calc((100% - 3 * var(--gap, clamp(16px, 1.6vw, 36px))) / 3.4);aspect-ratio:4/5;border-radius:var(--r, 14px);scroll-snap-align:start}
@media (hover:none) and (pointer:coarse){.c12nav{display:none}}
@container (max-width:767px){.c12 .ph{flex-basis:78%}.c12nav{display:none}}
</style>
</head>
<body>

<div class="cwrap cstage"><div class="c12w">
<div class="c12h"><h3 class="ttl">גלול הצידה, הפריט הבא מציץ</h3>
  <div class="c12nav">
    <button type="button" data-dir="prev" aria-label="הקודם"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" data-dir="next" aria-label="הבא"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div></div>
<div class="c12" tabindex="0" role="region" aria-label="גלריה, גלילה הצידה">
  <div class="ph ph-a"></div><div class="ph ph-b"></div><div class="ph ph-c"></div><div class="ph ph-d"></div><div class="ph ph-e"></div><div class="ph ph-f"></div>
</div></div></div>


<script>
document.querySelectorAll(".c12w").forEach(function(w){
  var t=w.querySelector(".c12"),p=w.querySelector("[data-dir=prev]"),n=w.querySelector("[data-dir=next]");
  if(!t||!p||!n)return;
  var rm=matchMedia("(prefers-reduced-motion: reduce)");
  function step(){var f=t.firstElementChild;return f?f.getBoundingClientRect().width+(parseFloat(getComputedStyle(t).columnGap)||0):t.clientWidth*.8}
  function sign(){return getComputedStyle(t).direction==="rtl"?-1:1}
  function upd(){var max=t.scrollWidth-t.clientWidth,x=Math.abs(t.scrollLeft);p.setAttribute("aria-disabled",x<=2?"true":"false");n.setAttribute("aria-disabled",x>=max-2?"true":"false")}
  function go(d){t.scrollBy({left:d*step()*sign(),behavior:rm.matches?"auto":"smooth"})}
  p.addEventListener("click",function(){go(-1)});
  n.addEventListener("click",function(){go(1)});
  t.addEventListener("scroll",upd,{passive:true});
  addEventListener("resize",upd);
  upd();
});
</script>
</body>
</html>
