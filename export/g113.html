<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G113 · גריד שמסתדר מחדש בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}

/* G113 · גריד שמסתדר מחדש בגלילה */
.rg{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap, clamp(16px, 1.6vw, 36px));align-items:start;max-width:1100px;margin-inline:auto}
.rg-pin{position:sticky;top:0;height:100vh;display:grid;align-content:center}
.rg-grid{display:grid;gap:12px;width:100%}
.rg-grid.l1{grid-template-columns:1fr}
.rg-grid.l1 .rg-c{height:52px;flex-direction:row;align-items:center;justify-content:space-between}
.rg-grid.l2{grid-template-columns:repeat(3,1fr)}
.rg-grid.l2 .rg-c{aspect-ratio:1}
.rg-grid.l3{grid-template-columns:repeat(3,1fr);grid-auto-rows:110px}
.rg-grid.l3 .rg-c:first-child{grid-column:span 2;grid-row:span 2}
.rg-c{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:14px;border-radius:14px;color:#fff;font-weight:700;font-size:14px;overflow:hidden}
.rg-c small{font-weight:500;opacity:.8;font-size:12px}
.rg-steps{display:flex;flex-direction:column;gap:40vh;padding-block:36vh}
.rg-step h3{margin:0 0 8px;font-size:clamp(22px,2.6vw,36px)}
.rg-step p{margin:0;color:var(--muted, #6a6d85);line-height:1.7;max-width:36ch}
@media(max-width:767px){.rg{grid-template-columns:1fr}.rg-pin{height:52vh;top:0;z-index:2;background:var(--bg, #f7f7fa)}.rg-grid.l2{grid-template-columns:1fr 1fr}.rg-grid.l3{grid-template-columns:1fr 1fr;grid-auto-rows:70px}.rg-steps{gap:24vh;padding-block:6vh 30vh}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage tight"><div class="rg">
  <div class="rg-pin"><div class="rg-grid l1">
    <div class="rg-c ph-a" style="background:linear-gradient(160deg,#3b5bdb,#748ffc)">קליניקה<small>אתר תדמית</small></div>
    <div class="rg-c" style="background:linear-gradient(160deg,#5f3dc4,#9775fa)">חנות<small>איקומרס</small></div>
    <div class="rg-c" style="background:linear-gradient(160deg,#0b7285,#3bc9db)">משרד<small>שלוש שפות</small></div>
    <div class="rg-c" style="background:linear-gradient(160deg,#2b8a3e,#69db7c)">סטודיו<small>תיק עבודות</small></div>
    <div class="rg-c" style="background:linear-gradient(160deg,#e8590c,#ffa94d)">קורס<small>דף נחיתה</small></div>
    <div class="rg-c" style="background:linear-gradient(160deg,#c2255c,#f783ac)">מערכת<small>CRM</small></div>
  </div></div>
  <div class="rg-steps">
    <div class="rg-step"><h3>רשימה</h3><p>כשרוצים לסרוק מהר: שם, סוג, וזהו.</p></div>
    <div class="rg-step"><h3>גריד</h3><p>כשכולם שווים ורוצים לראות את הכמות.</p></div>
    <div class="rg-step"><h3>בנטו</h3><p>כשיש פרויקט אחד שמוביל והשאר תומכים.</p></div>
  </div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger, Flip);

(function(){
  const grid=document.querySelector(".rg-grid"),steps=gsap.utils.toArray(".rg-step"),layouts=["l1","l2","l3"];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let cur=0;
  function go(k){if(k===cur)return;cur=k;
    const state=Flip.getState(".rg-c");
    grid.classList.remove(...layouts);grid.classList.add(layouts[k]);
    if(reduce)return;
    // absolute:false: המכל שומר על גובהו והעמוד לא קופץ (המלכודת של g23 ו-b34)
    Flip.from(state,{duration:.8,ease:"power3.inOut",stagger:.03,absolute:false});
  }
  steps.forEach((s,i)=>ScrollTrigger.create({trigger:s,start:"top 60%",end:"bottom 40%",onEnter:()=>go(i),onEnterBack:()=>go(i)}));
})();
</script>
</body>
</html>
