<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G37 · ענן תמונות מרחפות בעומק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-f{background:linear-gradient(160deg,#c92a2a,#ff8787)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* G37 · ענן תמונות מרחפות בעומק */
html,body{overflow-x:clip}
.cloud{height:100vh;position:relative;overflow:hidden;background:#0f1020}
/* המיקום והגודל ב-CSS (משתנים על כל תמונה), כך שהענן מסודר גם בלי JS ומתעדכן בסיבוב מסך */
.cloud-img{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1vw);height:calc(var(--w)*.75vw);
  border-radius:10px;font-size:16px;will-change:transform;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.cloud-title{position:absolute;inset:auto var(--gutter, clamp(24px, 5vw, 96px)) 10%;color:#fff;font-size:clamp(24px,2.6vw,42px);font-weight:700;max-width:520px;pointer-events:none}
.cloud-cta{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:999px;background:var(--card, #fff);color:var(--ink, #16182b);font-size:15px;font-weight:500;
  pointer-events:auto;text-decoration:none;transition:background .18s,color .18s}
@media(hover:hover) and (pointer:fine){.cloud-cta:hover{background:var(--accent, #4a3aff);color:var(--accent-ink, #fff)}}
.cloud-cta:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
/* בטלפון התמונות גדולות יותר כדי להיקרא, ולא יוצאות מהקצה */
@media(max-width:767px){.cloud-img{width:calc(var(--w)*1.9vw);height:calc(var(--w)*1.425vw);left:min(calc(var(--x)*1%),calc(100% - var(--w)*1.9vw - 8px))}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="cloud">
  <div class="cloud-img ph ph-a" style="--x:8;--y:12;--w:16" data-d="1.4"><span class="ph-l">1</span></div>
  <div class="cloud-img ph ph-b" style="--x:30;--y:6;--w:22" data-d="0.9"><span class="ph-l">2</span></div>
  <div class="cloud-img ph ph-c" style="--x:58;--y:14;--w:10" data-d="1.8"><span class="ph-l">3</span></div>
  <div class="cloud-img ph ph-d" style="--x:74;--y:4;--w:18" data-d="1.1"><span class="ph-l">4</span></div>
  <div class="cloud-img ph ph-e" style="--x:14;--y:48;--w:12" data-d="1.6"><span class="ph-l">5</span></div>
  <div class="cloud-img ph ph-f" style="--x:40;--y:42;--w:26" data-d="0.7"><span class="ph-l">6</span></div>
  <div class="cloud-img ph ph-a" style="--x:70;--y:40;--w:14" data-d="1.3"><span class="ph-l">7</span></div>
  <div class="cloud-img ph ph-b" style="--x:86;--y:58;--w:9" data-d="2"><span class="ph-l">8</span></div>
  <div class="cloud-img ph ph-c" style="--x:4;--y:76;--w:20" data-d="1"><span class="ph-l">9</span></div>
  <div class="cloud-title">קהילה שבונה דברים יפים<br><a class="cloud-cta" href="#">לכל הפרויקטים ←</a></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;
  const sec=document.querySelector(".cloud"),imgs=[...sec.querySelectorAll(".cloud-img")];
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    gsap.set(imgs,{autoAlpha:0,scale:.9});
    gsap.to(imgs,{autoAlpha:1,scale:1,duration:.9,ease:"power3.out",stagger:{each:.06,from:"random"},scrollTrigger:{trigger:sec,start:"top 70%",toggleActions:"play none none none"}});
    const tl=gsap.timeline({scrollTrigger:{trigger:sec,start:"top top",end:"+=160%",pin:true,scrub:.6,invalidateOnRefresh:true}});
    imgs.forEach(el=>tl.to(el,{y:()=>-innerHeight*0.55*(+el.dataset.d),ease:"none"},0));
    if(matchMedia("(hover:hover)").matches){
      const setters=imgs.map(el=>({x:gsap.quickTo(el,"x",{duration:.9,ease:"power3"}),d:+el.dataset.d}));
      const move=e=>{const r=sec.getBoundingClientRect();const nx=(e.clientX-r.left)/r.width-.5;setters.forEach(s=>s.x(-nx*60*s.d));};
      sec.addEventListener("mousemove",move);
      return ()=>sec.removeEventListener("mousemove",move);
    }
  });
})();
</script>
</body>
</html>
