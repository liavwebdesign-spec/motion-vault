<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G05 · מסך מפוצל: תמונות מתחלפות לפי טקסט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* G05 · מסך מפוצל: תמונות מתחלפות לפי טקסט */
.sync{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap, clamp(16px, 1.6vw, 36px));padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.sync-media{position:sticky;top:15vh;height:70vh}
.sync-media .ph{position:absolute;inset:0;font-size:24px}
.sync-texts .block{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.sync-texts h2{font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px))}
.sync-texts p{color:var(--muted, #6a6d85);max-width:40ch}
/* בטלפון המדיה דביקה בראש המסך והטקסט עובר מתחתיה. static כאן הוציא את התמונות (absolute) אל ה-body */
@media(max-width:767px){.sync{grid-template-columns:1fr}.sync-media{position:sticky;top:0;height:38vh;order:-1;z-index:1}.sync-texts .block{min-height:60vh}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="sync">
<div class="sync-texts">
  <div class="block sync-t"><h2>פרק ראשון</h2><p>כשהבלוק הזה במרכז המסך רואים את הכחול.</p></div>
  <div class="block sync-t"><h2>פרק שני</h2><p>הגעת לכאן? הסגול נכנס בהדרגה מעל הכחול.</p></div>
  <div class="block sync-t"><h2>פרק שלישי</h2><p>והירוק סוגר את הסיפור.</p></div>
</div>
<div class="sync-media">
  <div class="ph ph-a si-1"><span class="ph-l">תמונה 1</span></div>
  <div class="ph ph-b si-2" style="opacity:1"><span class="ph-l">תמונה 2</span></div>
  <div class="ph ph-d si-3" style="opacity:1"><span class="ph-l">תמונה 3</span></div>
</div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP נשארת התמונה העליונה והטקסט כולו קריא
  const texts=gsap.utils.toArray(".sync-t");
  gsap.matchMedia().add({desk:"(min-width: 768px)",mob:"(max-width: 767px)",rm:"(prefers-reduced-motion: reduce)"},ctx=>{
    const {mob,rm}=ctx.conditions;
    // בטלפון הטקסט עובר מתחת למדיה הדביקה, ולכן ההחלפה מתחילה ונגמרת נמוך יותר במסך
    const start=mob?"top 85%":"top 60%",end=mob?"top 55%":"top 30%",mid=mob?"top 70%":"top 45%";
    texts.forEach((txt,i)=>{
      if(!i)return;
      const img=".si-"+(i+1);
      if(rm){                               // הפחתת תנועה: התמונה מתחלפת מיד, בלי דהייה
        gsap.set(img,{autoAlpha:0});
        ScrollTrigger.create({trigger:txt,start:mid,end:"max",onToggle:s=>gsap.set(img,{autoAlpha:s.isActive?1:0})});
        return;
      }
      // autoAlpha: תמונה שקופה מקבלת גם visibility:hidden, ולא מכסה את זו שמתחתיה
      gsap.from(img,{autoAlpha:0,ease:"none",scrollTrigger:{trigger:txt,start,end,scrub:1}});
    });
  });
})();
</script>
</body>
</html>
