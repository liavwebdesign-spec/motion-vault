<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G97 · קו סריקה שהופך שלד לצבע</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G97 · קו סריקה שהופך שלד לצבע */
.sc{position:relative;height:220vh}
.sc-pin{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
.sc-frame{position:relative;width:min(760px,90vw);aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--card, #fff);border:1px solid var(--line, #e4e4ee);box-shadow:0 30px 70px rgba(0,0,0,.12)}
.sc-ui{position:absolute;inset:0;padding:22px;display:grid;grid-template-columns:1fr 2fr;gap:14px}
.sc-ui i{display:block;border-radius:10px}
.sc-side{display:grid;gap:10px;align-content:start}
.sc-side i{height:14px;background:var(--line, #e4e4ee)}
.sc-side i:first-child{height:34px;background:var(--accent, #4a3aff)}
.sc-main{display:grid;grid-template-rows:auto 1fr;gap:12px}
.sc-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc-kpis i{height:56px;background:var(--bg, #f7f7fa);border:1px solid var(--line, #e4e4ee)}
.sc-chart{border:1px solid var(--line, #e4e4ee);border-radius:12px;background:linear-gradient(180deg,transparent 60%,color-mix(in srgb,var(--accent, #4a3aff) 20%,transparent));position:relative}
.sc-chart::after{content:"";position:absolute;inset:auto 10% 20% 10%;height:3px;background:var(--accent, #4a3aff);border-radius:3px}
.sc-wire{filter:grayscale(1) contrast(.5);opacity:.55}
.sc-wire i,.sc-wire .sc-chart{background:transparent!important;border:1.5px dashed var(--muted, #6a6d85)!important}
.sc-wire .sc-chart::after{background:var(--muted, #6a6d85)}
.sc-color{clip-path:inset(0 0 100% 0);will-change:clip-path}
.sc-line{position:absolute;inset-inline:0;top:0;height:2px;background:var(--accent, #4a3aff);box-shadow:0 0 18px var(--accent, #4a3aff);will-change:transform}
.sc-cap{position:absolute;bottom:26px;font-size:13px;color:var(--muted, #6a6d85)}
@media(max-width:767px){.sc-frame{aspect-ratio:4/5}.sc-ui{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sc-kpis i{height:40px}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="sc">
  <div class="sc-pin"><div class="sc-frame">
    <div class="sc-ui sc-wire"><div class="sc-side"><i></i><i></i><i></i><i></i><i></i></div><div class="sc-main"><div class="sc-kpis"><i></i><i></i><i></i></div><div class="sc-chart"></div></div></div>
    <div class="sc-ui sc-color"><div class="sc-side"><i></i><i></i><i></i><i></i><i></i></div><div class="sc-main"><div class="sc-kpis"><i></i><i></i><i></i></div><div class="sc-chart"></div></div></div>
    <div class="sc-line"></div>
  </div><p class="sc-cap">גלול כדי לסרוק</p></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const frame=document.querySelector(".sc-frame"),color=document.querySelector(".sc-color"),line=document.querySelector(".sc-line");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(color,{clipPath:"inset(0 0 0% 0)"});gsap.set(line,{opacity:0});return;}
  gsap.timeline({scrollTrigger:{trigger:".sc",start:"top top",end:"bottom bottom",scrub:.5,invalidateOnRefresh:true}})
    .fromTo(color,{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0% 0)",ease:"none",duration:1},0)
    .fromTo(line,{y:0},{y:()=>frame.clientHeight,ease:"none",duration:1},0)
    .to(line,{opacity:0,duration:.05},.96)
    .to(".sc-cap",{opacity:0,duration:.1},0);
})();
</script>
</body>
</html>
