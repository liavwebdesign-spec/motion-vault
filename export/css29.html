<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS29 · מטאורים חולפים ברקע</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS29 · מטאורים חולפים ברקע */
.met{position:relative;height:clamp(340px,56vh,520px);overflow:hidden;border-radius:var(--r, 14px);background:var(--ink, #16182b);display:grid;place-items:center;color:var(--bg, #f7f7fa);text-align:center;padding:24px}
.met h2{margin:0;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px));position:relative;z-index:1}
.met p{margin:10px 0 0;color:color-mix(in srgb,var(--bg, #f7f7fa) 72%,transparent);position:relative;z-index:1}
.met-s{position:absolute;top:-4px;left:var(--x);width:2px;height:2px;border-radius:50%;background:#fff /* qa-allow: white, ידית/סמן ולא משטח טקסט */;box-shadow:0 0 0 1px rgba(255,255,255,.1);transform:rotate(215deg);
  animation:met-fall var(--d,5s) linear infinite;animation-delay:var(--w,0s);opacity:0}
.met-s::before{content:"";position:absolute;top:50%;transform:translateY(-50%);width:80px;height:1px;background:linear-gradient(90deg,#fff,transparent)}
@keyframes met-fall{0%{transform:rotate(215deg) translateX(0);opacity:1}70%{opacity:1}100%{transform:rotate(215deg) translateX(-620px);opacity:0}}
@media (prefers-reduced-motion: reduce){.met-s{animation:none;opacity:.35}}
</style>
</head>
<body>

<div class="stage tight"><div class="met">
  <span class="met-s" style="--x:8%;--d:4.2s;--w:0s"></span><span class="met-s" style="--x:22%;--d:6s;--w:1.4s"></span><span class="met-s" style="--x:35%;--d:5.1s;--w:2.6s"></span>
  <span class="met-s" style="--x:48%;--d:7s;--w:.8s"></span><span class="met-s" style="--x:57%;--d:4.6s;--w:3.9s"></span><span class="met-s" style="--x:69%;--d:6.4s;--w:2.1s"></span>
  <span class="met-s" style="--x:78%;--d:5.4s;--w:4.8s"></span><span class="met-s" style="--x:88%;--d:6.8s;--w:1.9s"></span><span class="met-s" style="--x:96%;--d:4.9s;--w:3.2s"></span>
  <span class="met-s" style="--x:15%;--d:7.4s;--w:5.6s"></span><span class="met-s" style="--x:42%;--d:5.8s;--w:6.3s"></span><span class="met-s" style="--x:63%;--d:4.4s;--w:7.1s"></span>
  <div><h2>הגרסה הבאה בדרך</h2><p>נעדכן אתכם כשהיא עולה.</p></div>
</div></div>



</body>
</html>
