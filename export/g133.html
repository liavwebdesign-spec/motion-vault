<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G133 · רצפת רשת בפרספקטיבה שנעה בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G133 · רצפת רשת בפרספקטיבה שנעה בגלילה */
.fg{position:relative;min-height:120vh;overflow:hidden;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);display:grid;place-items:center;perspective:600px}
.fg-floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:70%;transform-origin:50% 100%;transform:rotateX(64deg);
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent, #4a3aff) 45%,transparent) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,color-mix(in srgb,var(--accent, #4a3aff) 45%,transparent) 0 2px,transparent 2px 80px);
  background-position:0 var(--fy,0px);mask-image:linear-gradient(180deg,transparent,#000 35%);-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%)}
.fg-glow{position:absolute;inset-inline:0;top:38%;height:30%;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--accent, #4a3aff) 45%,transparent),transparent 70%);pointer-events:none}
.fg-txt{position:relative;z-index:1;text-align:center;max-width:30ch;padding:24px}
.fg-txt h2{margin:0 0 10px;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px))}
.fg-txt p{margin:0;opacity:.8}
@media(max-width:767px){.fg-floor{transform:rotateX(58deg)}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="fg"><div class="fg-floor"></div><div class="fg-glow"></div>
  <div class="fg-txt"><h2>הדור הבא של המערכת</h2><p>מהיר יותר, פשוט יותר, ובעברית מהיום הראשון.</p></div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const floor=document.querySelector(".fg-floor");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const o={y:0};
  gsap.to(o,{y:640,ease:"none",scrollTrigger:{trigger:".fg",start:"top bottom",end:"bottom top",scrub:.3},onUpdate(){floor.style.setProperty("--fy",o.y+"px");}});
})();
</script>
</body>
</html>
