<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G01 · גלילה צידית מוצמדת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-f{background:linear-gradient(160deg,#c92a2a,#ff8787)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* G01 · גלילה צידית מוצמדת */
/* בלי GSAP ובהפחתת תנועה הרצועה נגללת לצד ביד. החיתוך, הגובה והמירכוז רק כשהמהלך רץ */
.wrapper{transition:all 0s !important;overflow-x:auto;background:var(--bg, #f7f7fa)}
.wrapper.gsap-live{overflow:hidden;height:100vh;display:flex;align-items:center}
.scroll{flex:none;display:flex;gap:24px;width:max-content;padding:80px var(--gutter, clamp(24px, 5vw, 96px))}
.scroll .ph{flex:0 0 clamp(300px,26vw,460px);height:clamp(240px,20vw,360px);font-size:22px}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="wrapper"><div class="scroll">
<div class="ph ph-a"><span class="ph-l">כרטיס 01</span></div><div class="ph ph-b"><span class="ph-l">כרטיס 02</span></div><div class="ph ph-c"><span class="ph-l">כרטיס 03</span></div>
<div class="ph ph-e"><span class="ph-l">כרטיס 04</span></div><div class="ph ph-d"><span class="ph-l">כרטיס 05</span></div><div class="ph ph-f"><span class="ph-l">כרטיס 06</span></div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הרצועה נשארת גלילה צידית רגילה
  const wrap=document.querySelector(".wrapper"),container=wrap.querySelector(".scroll");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    wrap.classList.add("gsap-live");
    // נמדד מחדש בכל refresh: אחרי שינוי גודל או סיבוב מסך הכרטיס האחרון לא נחתך
    const total=()=>container.scrollWidth-wrap.clientWidth;
    gsap.to(container,{x:()=>total(),ease:"none",   // אתר עברי: x חיובי. אתר אנגלי: -total()
      scrollTrigger:{trigger:wrap,start:"top top",end:()=>"+="+total(),scrub:true,pin:true,anticipatePin:1,invalidateOnRefresh:true}});
    return()=>wrap.classList.remove("gsap-live");
  });
})();
</script>
</body>
</html>
