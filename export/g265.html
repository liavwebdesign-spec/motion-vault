<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G265 · אותו צילום בפסים ובתשע פלטות צבע</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G265 · אותו צילום בפסים ובתשע פלטות צבע */
.pp{max-width:1180px;margin-inline:auto}
.pp .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pp-pin{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);align-items:center;gap:clamp(24px,5vw,72px)}
.pp-txt{display:grid;gap:14px;max-width:34ch}
.pp-txt h2{margin:0;font-size:clamp(28px,3.2vw,48px);font-weight:700;line-height:1.12;text-wrap:balance}
.pp-txt p{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.pp-cap{display:flex;align-items:baseline;gap:12px;margin:8px 0 0}
.pp-num{display:grid}
.pp-num i{grid-area:1 / 1;font-style:normal;font-size:clamp(56px,7vw,96px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pp-num i:first-child{display:none}
.pp.is-live .pp-num i:first-child{display:block}
.pp-cap span{color:var(--muted, #6a6d85);font-size:clamp(17px,1.4vw,20px)}
.pp-cap .pp-num{color:var(--ink, #16182b)}
.pp-frame{position:relative;aspect-ratio:5 / 3;overflow:hidden;border-radius:clamp(16px,2vw,28px);background:var(--card, #fff)}
.pp-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:4px}
.pp-stripes{position:absolute;inset:0;display:none;grid-template-columns:repeat(5,minmax(0,1fr))}
.pp.is-live .pp-stripes{display:grid}
/* דו-גוון: רקע בבהיר, צילום שחור לבן ב-multiply, ושכבה בכהה ב-lighten. הגוונים מהטוקנים */
.pp-p{position:relative;margin:0;overflow:hidden;isolation:isolate;background:var(--c2)}
.pp-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1) contrast(1.05);mix-blend-mode:multiply}
.pp-p::after{content:"";position:absolute;inset:0;background:var(--c1);mix-blend-mode:lighten;pointer-events:none}
.pp-grid .pp-p::before{content:"";position:absolute;inset:0;z-index:1;background-image:radial-gradient(circle,var(--c1) 0 1px,transparent 1.6px);background-size:6px 6px;opacity:.22;mix-blend-mode:multiply;pointer-events:none}
.pp-c1{--c1:var(--ink, #16182b);--c2:var(--bg, #f7f7fa)}
.pp-c2{--c1:var(--accent, #4a3aff);--c2:var(--card, #fff)}
.pp-c3{--c1:var(--ink, #16182b);--c2:color-mix(in oklab,var(--accent, #4a3aff) 36%,var(--card, #fff))}
.pp-c4{--c1:color-mix(in oklab,var(--accent, #4a3aff) 72%,var(--ink, #16182b));--c2:color-mix(in oklab,var(--accent, #4a3aff) 20%,var(--bg, #f7f7fa))}
.pp-c5{--c1:var(--ink, #16182b);--c2:color-mix(in oklab,var(--muted, #6a6d85) 34%,var(--card, #fff))}
.pp-c6{--c1:var(--accent, #4a3aff);--c2:color-mix(in oklab,var(--accent, #4a3aff) 12%,var(--card, #fff))}
.pp-c7{--c1:color-mix(in oklab,var(--ink, #16182b) 78%,var(--accent, #4a3aff));--c2:var(--card, #fff)}
.pp-c8{--c1:color-mix(in oklab,var(--accent, #4a3aff) 48%,var(--ink, #16182b));--c2:var(--bg, #f7f7fa)}
.pp-o{--c1:var(--ink, #16182b);--c2:var(--card, #fff)}
.pp-o img{filter:none;mix-blend-mode:normal}
.pp-o::after{display:none}
.pp.is-live{height:300vh}
.pp.is-live .pp-pin{position:sticky;top:0;height:100vh;height:100svh}
@media(max-width:767px){
  .pp-pin{grid-template-columns:minmax(0,1fr);align-content:center;gap:24px}
  .pp-txt{max-width:none}
  .pp-frame{aspect-ratio:1 / 1}
  .pp-grid{gap:3px}
  .pp-num i{font-size:56px}
}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="pp">
  <div class="pp-pin">
    <div class="pp-txt">
      <h2>אותו צילום בכל הפלטות של המותג</h2>
      <p>מעבירים את אותו פורטרט דרך כל פלטות הצבע, כך שאפשר לראות מה עובד לכרטיס ביקור, לאתר ולשלט לפני שמדפיסים.</p>
      <p class="pp-cap"><span class="pp-num" aria-hidden="true"><i>5</i><i>9</i></span><span aria-hidden="true">גרסאות צבע</span><span class="sr-only">תשע גרסאות צבע של אותו פורטרט.</span></p>
    </div>
    <div class="pp-frame" role="img" aria-label="אותו פורטרט של אישה במשקפי שמש בתשע גרסאות צבע, מדו-גוון עד הצבע המקורי באמצע">
      <div class="pp-grid">
        <figure class="pp-p pp-c1"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c2"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c3"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c4"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-o"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c5"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c6"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c7"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c8"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
      </div>
      <div class="pp-stripes" aria-hidden="true">
        <figure class="pp-p pp-c1"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c4"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-o"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c2"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
        <figure class="pp-p pp-c6"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></figure>
      </div>
    </div>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;      // בלי GSAP הרשת של תשע הגרסאות כבר במארקאפ
  const root=document.querySelector(".pp"),stripes=[...root.querySelectorAll(".pp-stripes .pp-p")],tiles=[...root.querySelectorAll(".pp-grid .pp-p")];
  const n5=root.querySelector(".pp-num i:first-child"),n9=root.querySelector(".pp-num i:last-child");
  // בהפחתת תנועה הפונקציה לא רצה, והרשת נשארת
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("is-live");
    const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:root,start:"top 70%",end:"bottom bottom",scrub:.6,invalidateOnRefresh:true}});
    // 1. חמשת הפסים נחשפים מלמעלה, אחד אחרי השני מימין לשמאל
    gsap.set(stripes,{clipPath:"inset(0 0 100% 0)"});gsap.set(tiles,{scale:.4,autoAlpha:0});      // מצב פתיחה מפורש (ה-stagger לא תמיד מציג אותו מיד)
    tl.fromTo(stripes,{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0% 0)",duration:.7,ease:"power3.out",stagger:.14},0);
    tl.to({},{duration:1});                                      // עצירה עם חמשת הפסים
    // 2. הפסים נמסים והתשעה צצים מהמרכז החוצה
    const t=tl.duration();
    tl.fromTo(tiles,{scale:.4,autoAlpha:0},{scale:1,autoAlpha:1,duration:.7,ease:"power3.out",stagger:{each:.1,from:"center",grid:[3,3]}},t);
    tl.to(stripes,{autoAlpha:0,duration:.5,ease:"power1.in"},t);
    tl.fromTo(n5,{autoAlpha:1,y:0},{autoAlpha:0,y:-14,duration:.35,ease:"power1.in"},t+.1);
    tl.fromTo(n9,{autoAlpha:0,y:14},{autoAlpha:1,y:0,duration:.45,ease:"power2.out"},t+.3);
    tl.to({},{duration:.8});
    return()=>{root.classList.remove("is-live");gsap.set([...stripes,...tiles,n5,n9],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
