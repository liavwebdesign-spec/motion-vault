<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>B142 · שני גדילי תמונות שמתפתלים זה סביב זה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B142 · שני גדילי תמונות שמתפתלים זה סביב זה */
.dn{position:relative}
.dn-s{display:grid;gap:clamp(24px,3vw,48px);padding:clamp(24px,4vw,64px) clamp(20px,5vw,72px)}
.dn-t{display:grid;gap:16px;justify-items:start}
.dn-k{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--accent, #4a3aff)}
.dn-t h2{margin:0;font-size:clamp(34px,4.4vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.dn-t p:not(.dn-k){margin:0;max-width:44ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
.dn-cta{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-weight:700;text-decoration:none}
.dn-cta:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.dn-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:16px}
.dn-i{margin:0}
.dn-i img{display:block;width:100%;height:auto;aspect-ratio:5/4;object-fit:cover;border-radius:12px}
.dn.is-on .dn-s{overflow-x:clip}
.dn.is-on .dn-v{position:relative;perspective:1400px;height:clamp(380px,64vh,640px);cursor:grab;touch-action:pan-y;user-select:none}
.dn.is-on .dn-g{display:block;position:absolute;inset:0;transform-style:preserve-3d}
.dn.is-on .dn-i{position:absolute;inset:0;margin:auto;height:fit-content;width:clamp(150px,19vw,280px)}
.dn-t{justify-items:center;text-align:center}
.dn-t p:not(.dn-k){text-align:center}
</style>
</head>
<body>

<div class="stage"><section class="dn" data-dn><div class="dn-s">
  <div class="dn-t">
    <p class="dn-k">קיץ 2027</p>
    <h2>שלושה ימים, שתי במות</h2>
    <p>מוזיקה עד הזריחה, אוכל מהדוכנים וקרוואנים בשדה.</p>
    <a class="dn-cta" href="#">לכרטיסים</a>
  </div>
  <div class="dn-v" data-view><div class="dn-g" data-scene><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/dancers.webp" width="1500" height="1212" alt="חברים רוקדים בפסטיבל" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/singer.webp" width="1800" height="1012" alt="זמרת על במה" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/hug.webp" width="1500" height="1100" alt="שתי חברות מתחבקות בפסטיבל" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s12/dusk-camp.webp" width="1000" height="1000" alt="קרוואן בשדה עם דמדומים" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/hands.webp" width="2560" height="1400" alt="ידיים מורמות מול השמש" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s12/hero-window.webp" width="1100" height="1100" alt="שלושה חברים בחלון קרוואן" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/food.webp" width="1300" height="1000" alt="ילד מקבל מנה מדוכן" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s12/van-door.webp" width="1000" height="1200" alt="חברים בדלת קרוואן" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liav ם בדלת קרוואן" loading="lazy" decoding="async" draggable="false"></figure><figure class="dn-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s12/thermos.webp" width="900" height="1200" alt="מוזגים קפה מתרמוס" loading="lazy" decoding="async" draggable="false"></figure></div></div>
</div></section></div>


<script>
(function(){
function mod(v,n){return((v%n)+n)%n;}
function ss(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function mv3(root,o){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const view=root.querySelector("[data-view]"),scene=root.querySelector("[data-scene]"),all=[...root.querySelectorAll("[data-i]")];
  const phone=innerWidth<800,items=phone&&o.phoneN?all.slice(0,o.phoneN):all;
  all.slice(items.length).forEach(e=>e.remove());
  root.classList.add("is-on");
  const a={N:items.length,items,root,view,scene,phone,p:o.p0||0,q:o.q0||0,t:0,mx:0,my:0,w:1,h:1};
  let tp=a.p,tq=a.q,vp=0,vq=0,dn=false,lx=0,ly=0,last=0,idle=0,raf=0,seen=false,mxT=0,myT=0,first=true;
  const ease=o.ease||.09;
  function sp(){const r=root.getBoundingClientRect(),d=r.height-innerHeight;return d>0?Math.min(1,Math.max(0,-r.top/d)):0;}
  function size(){a.w=view.clientWidth||1;a.h=view.clientHeight||1;if(o.size)o.size(a);kick();}
  function frame(now){raf=0;if(!seen)return;
    const dt=Math.min(.05,last?(now-last)/1000:.016);last=now;a.t+=dt;
    if(o.range){const g=o.range(a);tp=g[0]+(g[1]-g[0])*sp();if(first){a.p=tp;first=false;}}
    if(o.drag&&!dn){tp+=vp;tq+=vq;vp*=.94;vq*=.94;if(idle>0)idle-=dt;else if(o.auto)tp+=o.auto*dt;}
    if(o.qMax)tq=Math.max(-o.qMax,Math.min(o.qMax,tq));
    a.p+=(tp-a.p)*ease;a.q+=(tq-a.q)*ease;a.mx+=(mxT-a.mx)*.06;a.my+=(myT-a.my)*.06;
    if(o.frame)o.frame(a);
    for(let i=0;i<a.N;i++)o.place(items[i],i,a);
    if(o.auto||o.always||dn||Math.abs(tp-a.p)>.0004||Math.abs(vp)>.00005||Math.abs(mxT-a.mx)>.002||Math.abs(myT-a.my)>.002)raf=requestAnimationFrame(frame);}
  function kick(){if(!raf&&seen){last=0;raf=requestAnimationFrame(frame);}}
  new IntersectionObserver(([e])=>{seen=e.isIntersecting;if(seen)kick();},{rootMargin:"120px"}).observe(root);
  new ResizeObserver(size).observe(view);
  addEventListener("scroll",kick,{passive:true});
  root.addEventListener("pointermove",e=>{const r=view.getBoundingClientRect();mxT=((e.clientX-r.left)/r.width-.5)*2;myT=((e.clientY-r.top)/r.height-.5)*2;kick();});
  if(o.drag){
    view.addEventListener("pointerdown",e=>{dn=true;lx=e.clientX;ly=e.clientY;vp=vq=0;view.style.cursor="grabbing";try{view.setPointerCapture(e.pointerId);}catch(_){}kick();});
    view.addEventListener("pointermove",e=>{if(!dn)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;vp=dx*o.drag;tp+=vp;if(o.dragQ){vq=dy*o.dragQ;tq+=vq;}});
    const up=()=>{dn=false;idle=1.4;view.style.cursor="";kick();};
    view.addEventListener("pointerup",up);view.addEventListener("pointercancel",up);
  }
  size();
}
mv3(document.querySelector("[data-dn]"),{phoneN:12,drag:-.0065,auto:.32,
size:function(a){const t=a.items[0].offsetWidth||200;a.gap=t*1.03;a.tw=a.gap*1.5;a.A=Math.min(a.h*.27,t*.62);a.L=Math.floor(a.N/2)*a.gap;},
place:function(e,i,a){const s=i>>1,x=mod(s*a.gap-a.p*a.gap+a.L/2,a.L)-a.L/2,g=x/a.tw+(i&1?Math.PI:0),f=1-ss(a.L*.36,a.L*.5,Math.abs(x));
e.style.transform="translate3d("+x.toFixed(1)+"px,0,0) rotateX("+g.toFixed(3)+"rad) translateZ("+a.A.toFixed(1)+"px)";
e.style.opacity=(f*(.42+.58*ss(-.5,.4,Math.cos(g)))).toFixed(3);}});
})();
</script>
</body>
