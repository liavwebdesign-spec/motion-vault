<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>R13 · BorderBeam: קרן על מסגרת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.gbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding-inline:28px;border-radius:999px;background:var(--accent, #4a3aff);color:#fff;font-weight:500;font-size:16px;border:0;cursor:pointer;font-family:inherit}
.vback{font-size:14px;font-weight:500;color:var(--muted, #6a6d85);border:1px solid var(--line, #e4e4ee);border-radius:999px;padding:7px 16px;background:#fff;text-decoration:none;transition:color .18s,border-color .18s}
.vback:hover{color:var(--accent, #4a3aff);border-color:var(--accent, #4a3aff)}

/* R13 · BorderBeam: קרן על מסגרת */
.rload{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-inline:var(--gutter, clamp(24px, 5vw, 96px));margin-bottom:16px}
.rframe{display:none;border-block:1px solid var(--line, #e4e4ee);background:#0e0f1a}
.rframe.on{display:block}
.rframe iframe{width:100%;height:min(82vh,780px);border:0;display:block}
.rinstall{padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.rinstall code{font-size:12.5px;background:#ececf4;border:1px solid var(--line, #e4e4ee);border-radius:8px;padding:8px 14px;direction:ltr;display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap}
.rdeps{font-size:13px;color:var(--muted, #6a6d85);padding:8px var(--gutter, clamp(24px, 5vw, 96px)) 0}
</style>
</head>
<body>
<div class="rinstall"><code>npx shadcn@latest add "https://magicui.design/r/border-beam.json"</code></div>
<div class="rdeps">תלויות npm: <b>motion</b></div>
<div class="rload">
  <button class="gbtn rbtn">טען דמו חי כאן</button>
  <a class="vback" href="https://magicui.design/docs/components/border-beam" target="_blank" rel="noopener">פתח באתר המקור ↗</a>
</div>
<div class="rframe"></div>

<script>
const btn=document.querySelector(".rbtn"),wrap=document.querySelector(".rframe");
btn.addEventListener("click",()=>{
  if(wrap.classList.contains("on")){wrap.classList.remove("on");wrap.innerHTML="";btn.textContent="טען דמו חי כאן";return;}
  wrap.innerHTML='<iframe loading="lazy" src="https://magicui.design/docs/components/border-beam"></iframe>';
  wrap.classList.add("on");btn.textContent="סגור דמו";
});
</script>
</body>
</html>
