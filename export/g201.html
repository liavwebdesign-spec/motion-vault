<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>G201 · טבעת תמונות שנפתחת לשדה מפוזר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G201 · טבעת תמונות שנפתחת לשדה מפוזר */
.rgf{--p:1}
.rgf-field{position:relative;height:min(100svh,780px);border-radius:28px;overflow:hidden;container-type:size;background:color-mix(in srgb,var(--ink, #16182b) 4%,var(--bg, #f7f7fa))}
.rgf-tiles{position:absolute;inset:0}
.rgf-t{--q:clamp(0,calc((var(--p) - var(--d)) / .7),1);--e:calc(var(--q) * var(--q) * (3 - 2 * var(--q)));--tw:max(5.6cqw,5.2cqh);
  position:absolute;left:calc(50% - var(--tw) / 2);top:calc(50% - var(--tw) * .667);display:block;width:var(--tw);height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--card, #fff);
  box-shadow:0 10px 24px -14px color-mix(in srgb,var(--ink, #16182b) 50%,transparent);
  transform:translate(calc(var(--rx) * 1cqmin * (1 - var(--e)) + var(--sx) * 1cqw * var(--e)),calc(var(--ry) * 1cqmin * (1 - var(--e)) + var(--sy) * 1cqh * var(--e))) rotate(calc((var(--rr) * (1 - var(--e)) + var(--sr) * var(--e)) * 1deg)) scale(calc(.9 * (1 - var(--e)) + var(--ss) * var(--e)))}
.rgf-b{filter:blur(calc(var(--bl) * var(--e) * 1px))}
.rgf-pill{position:absolute;left:50%;top:50%;z-index:40;width:max-content;max-width:max(24cqmin,152px);padding:16px 24px;border-radius:32px;transform:translate(-50%,-50%);text-align:center;
  background:color-mix(in srgb,var(--card, #fff) 58%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 18px 40px -24px color-mix(in srgb,var(--ink, #16182b) 55%,transparent)}
.rgf-h{margin:0;font-size:clamp(20px,2.4vw,32px);line-height:1.2;font-weight:700;text-wrap:balance}
.rgf-w{display:inline-block}
.rgf.is-live{height:320vh}
.rgf.is-live .rgf-field{position:sticky;top:0;height:100vh;height:100svh}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP נשאר השדה המפוזר והמשפט מלא
  const root=document.querySelector(".rgf"),words=[...root.querySelectorAll(".rgf-w")];
  // בהפחתת תנועה הפונקציה לא רצה
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("is-live");
    const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6}});
    // --p על השורש מזיז את כל האריחים דרך calc(), לכן אין כאן לולאה על האריחים
    tl.fromTo(root,{"--p":0},{"--p":1,duration:4,ease:"power1.inOut"},.7)
      .from(words,{autoAlpha:0,y:14,duration:.5,stagger:.45,ease:"power3.out"},.2)
      .to({},{duration:.6});
    return()=>{root.classList.remove("is-live");};
  });
})();
</script>
