<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C21 · אנחנו מול האחרים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C21 · אנחנו מול האחרים */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.mk{position:relative;display:inline-block;flex:none;width:20px;height:20px;border-radius:50%;vertical-align:middle}
.mk.y{background:var(--ink, #16182b)}
.mk.y::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--bg, #f7f7fa);border-width:0 2px 2px 0;transform:rotate(45deg)}
.mk.n::after{content:"";position:absolute;left:4px;top:9px;width:12px;height:2px;border-radius:2px;background:currentColor;opacity:.7}
.c21h{text-align:center}
.c21{width:100%;max-width:880px;border-collapse:separate;border-spacing:0;margin:clamp(20px,3cqi,40px) auto 0;font-size:clamp(15px,1.3cqi,17px)}
.c21 th,.c21 td{padding:clamp(14px,1.8cqi,20px) clamp(12px,2cqi,24px);text-align:start;vertical-align:middle}
.c21 thead th{font-size:14px;font-weight:700;color:var(--muted, #6a6d85)}
.c21 tbody th{font-weight:600;width:40%}
.c21 .us{background:var(--card, #fff);font-weight:700}
.c21 thead .us{color:var(--ink, #16182b);border-start-start-radius:var(--r, 14px);border-start-end-radius:var(--r, 14px)}
.c21 tbody tr:last-child .us{border-end-start-radius:var(--r, 14px);border-end-end-radius:var(--r, 14px)}
.c21 td:not(.us){color:var(--muted, #6a6d85)}
.c21 .mk{margin-inline-end:10px}
@container (max-width:767px){.c21{font-size:14px}.c21 th,.c21 td{padding:12px 8px}.c21 .mk{display:none}}
</style>
</head>
<body>

<div class="cwrap cstage"><h3 class="ttl c21h">מה ההבדל, נקודה אחרי נקודה</h3>
<table class="c21">
  <thead><tr><td></td><th scope="col" class="us">אצלנו</th><th scope="col">בדרך כלל</th></tr></thead>
  <tbody>
    <tr><th scope="row">זמן עד סקיצה ראשונה</th><td class="us"><span class="mk y" aria-hidden="true"></span>שבוע</td><td><span class="mk n" aria-hidden="true"></span>חודש ויותר</td></tr>
    <tr><th scope="row">מי כותב את הטקסטים</th><td class="us"><span class="mk y" aria-hidden="true"></span>אנחנו</td><td><span class="mk n" aria-hidden="true"></span>אתם</td></tr>
    <tr><th scope="row">סבבי תיקונים</th><td class="us"><span class="mk y" aria-hidden="true"></span>עד שזה נכון</td><td><span class="mk n" aria-hidden="true"></span>שניים</td></tr>
    <tr><th scope="row">אחרי ההשקה</th><td class="us"><span class="mk y" aria-hidden="true"></span>חודש ליווי</td><td><span class="mk n" aria-hidden="true"></span>לפי שעה</td></tr>
  </tbody>
</table></div>



</body>
</html>
