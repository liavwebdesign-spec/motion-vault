<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G176 · איור שמצטייר, נצבע ומקבל הערות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G176 · איור שמצטייר, נצבע ומקבל הערות */
.il{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-areas:"head fig" "cap fig";gap:32px 72px;max-width:1120px;margin-inline:auto}
.il-head{grid-area:head;align-self:end}
.il-head h2{margin:0;font-size:clamp(30px,3.4vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.il-cap{grid-area:cap;align-self:start;margin:0;max-width:30ch;font-size:clamp(20px,2vw,28px);font-weight:600;line-height:1.45}
.il-fig{grid-area:fig;margin:0;position:relative}
.il-svg{display:block;width:100%;height:auto;overflow:visible}
.il-f{stroke:none}
.il-f[data-g="soil"]{fill:color-mix(in srgb,var(--muted, #6a6d85) 16%,var(--card, #fff))}
.il-f[data-g="leaves"]{fill:color-mix(in srgb,var(--accent, #4a3aff) 34%,var(--card, #fff))}
.il-f[data-g="petals"]{fill:var(--accent, #4a3aff)}
.il-f[data-g="core"]{fill:var(--ink, #16182b)}
.il-f[data-g="cloud"]{fill:color-mix(in srgb,var(--muted, #6a6d85) 14%,var(--card, #fff))}
.il-f[data-g="rain"]{fill:color-mix(in srgb,var(--accent, #4a3aff) 24%,var(--card, #fff))}
.il-s{fill:none;stroke:var(--ink, #16182b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.il-ld{fill:none;stroke:var(--muted, #6a6d85);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.il-labs{list-style:none;margin:0;padding:0}
.il-labs li{position:absolute;left:var(--x);top:var(--y);transform:translateY(-50%)}
.il-labs span{display:block;font-size:clamp(14px,1.3vw,18px);font-weight:600;line-height:1.3;white-space:nowrap;transform:rotate(-3deg);text-decoration:underline wavy var(--accent, #4a3aff);text-decoration-thickness:1.5px;text-underline-offset:4px}
@media(max-width:767px){
.il{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "fig" "cap";gap:24px}
.il-cap{max-width:none}
.il-labs span{font-size:13px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  const root=document.querySelector(".il");if(!root)return;
  if(typeof gsap==="undefined")return;       // בלי GSAP: האיור צבוע, ההערות והמשפט מלאים
  gsap.registerPlugin(ScrollTrigger);
  const q=s=>[...root.querySelectorAll(s)],mm=gsap.matchMedia();
  mm.add("(prefers-reduced-motion: no-preference)",()=>{
    const g=n=>q('.il-s[data-g="'+n+'"]'),f=n=>q('.il-f[data-g="'+n+'"]');
    const lines=q(".il-s"),fills=q(".il-f"),leads=q(".il-ld"),labs=q(".il-labs span"),words=q(".il-cap span");
    gsap.set([...lines,...leads],{strokeDashoffset:1});
    gsap.set(fills,{autoAlpha:0});
    gsap.set(words,{opacity:.22});
    const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:root,start:"top 75%",end:"bottom 45%",scrub:.6}});
    const draw=(els,at,each,gap)=>els.forEach((el,i)=>tl.to(el,{strokeDashoffset:0,duration:each},at+i*gap));
    const fade=(els,at,each,gap)=>els.forEach((el,i)=>tl.to(el,{autoAlpha:1,duration:each},at+i*gap));
    draw(g("soil"),0,1.2,0);
    draw(g("roots"),1,.9,.25);
    draw(g("stem"),3,1,0);
    draw(g("leaves"),3.8,.6,.25);
    draw([...g("petals"),...g("core")],5,.5,.15);
    draw(g("cloud"),5.6,.8,0);
    draw(g("rain"),6.2,.5,.2);
    fade(f("soil"),6.6,.8,0);
    fade(f("leaves"),6.9,.6,.2);
    fade(f("petals"),7.4,.5,.1);
    fade(f("core"),7.9,.4,0);
    fade(f("cloud"),7.8,.6,0);
    fade(f("rain"),7.9,.5,.15);
    draw(leads,8,.3,.4);
    labs.forEach((el,i)=>tl.fromTo(el,{autoAlpha:0,scale:.8,rotation:-9},{autoAlpha:1,scale:1,rotation:-3,duration:.4,ease:"power3.out"},8.3+i*.4));
    tl.to(words,{opacity:1,duration:.4,stagger:{each:9.4/(words.length-1)}},1);
    return()=>{if(tl.scrollTrigger)tl.scrollTrigger.kill();tl.kill();gsap.set([...lines,...leads,...fills,...labs,...words],{clearProps:"all"});};
  });
})();
</script>
