<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G178 · קשתות שמחברות מילים קשורות במשפט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G178 · קשתות שמחברות מילים קשורות במשפט */
.aw{display:grid;gap:56px;max-width:1120px;margin-inline:auto}
.aw-head{display:grid;gap:16px;max-width:48ch}
.aw-head h2{margin:0;font-size:clamp(30px,3.4vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.aw-head p{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.aw-box{position:relative;padding-top:96px}
.aw-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.aw-t{fill:none;stroke:var(--muted, #6a6d85);stroke-opacity:.55;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.aw-h{fill:none;stroke:var(--accent, #4a3aff);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.aw-d{fill:var(--muted, #6a6d85);fill-opacity:.7}
.aw-d.is-hot{fill:var(--accent, #4a3aff);fill-opacity:1}
.aw-sent{position:relative;margin:0;display:flex;flex-wrap:nowrap;gap:12px;font-size:clamp(20px,calc((min(100vw,1168px) - 48px)/28),44px);font-weight:800;line-height:1.15;letter-spacing:-.02em}
.aw-w{position:relative;display:block;padding-bottom:16px;white-space:nowrap}
.aw-w b{font-weight:inherit}
.aw-bar{position:absolute;inset-inline:0;bottom:0;height:4px;border-radius:2px;background:color-mix(in srgb,var(--muted, #6a6d85) 45%,transparent);transform:scaleX(.22);transform-origin:right}
.aw-bar u{position:absolute;inset:0;border-radius:inherit;background:var(--accent, #4a3aff);opacity:0}
.aw-w.is-n .aw-bar{transform:none}
.aw-w.is-p .aw-bar{transform:scaleX(.6)}
.aw-w.is-n .aw-bar u,.aw-w.is-p .aw-bar u{opacity:1}
@media(max-width:767px){
.aw{gap:40px}
.aw-box{padding-top:0;padding-inline-start:48px}
.aw-sent{flex-direction:column;align-items:flex-start;gap:12px;font-size:24px}
}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><div class="aw">
  <div class="aw-head">
    <h2>המערכת מבינה למה מתייחסת כל מילה</h2>
    <p>בהודעה של לקוח, המילה אותה מחזירה אל ההצעה. כך התשובה האוטומטית עונה על ההצעה הנכונה ולא על משהו אחר.</p>
  </div>
  <div class="aw-box">
    <svg class="aw-svg" aria-hidden="true" focusable="false"><path class="aw-t" pathLength="1" data-a="0" data-b="1"/><path class="aw-t" pathLength="1" data-a="0" data-b="2"/><path class="aw-t" pathLength="1" data-a="2" data-b="3"/><path class="aw-t" pathLength="1" data-a="4" data-b="6"/><path class="aw-t" pathLength="1" data-a="5" data-b="6"/><path class="aw-t" pathLength="1" data-a="6" data-b="7"/><path class="aw-t" pathLength="1" data-a="6" data-b="8"/><path class="aw-h" pathLength="1" data-a="0" data-b="7"/><circle class="aw-d is-hot" data-i="0" r="5"/><circle class="aw-d" data-i="1" r="2.5"/><circle class="aw-d" data-i="2" r="2.5"/><circle class="aw-d" data-i="3" r="2.5"/><circle class="aw-d" data-i="4" r="2.5"/><circle class="aw-d" data-i="5" r="2.5"/><circle class="aw-d" data-i="6" r="2.5"/><circle class="aw-d is-hot" data-i="7" r="5"/><circle class="aw-d" data-i="8" r="2.5"/></svg>
    <p class="aw-sent">
      <span class="aw-w is-n"><b>ההצעה</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w"><b>המעודכנת</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w"><b>נשלחה</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w"><b>אתמול,</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w"><b>והלקוח</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w"><b>כבר</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w"><b>קרא</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w is-p"><b>אותה</b><i class="aw-bar"><u></u></i></span>
      <span class="aw-w"><b>פעמיים</b><i class="aw-bar"><u></u></i></span>
    </p>
  </div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  const box=document.querySelector(".aw-box");if(!box)return;
  const svg=box.querySelector(".aw-svg"),words=[...box.querySelectorAll(".aw-w")],
        arcs=[...svg.querySelectorAll(".aw-t,.aw-h")],dots=[...svg.querySelectorAll(".aw-d")],
        mq=matchMedia("(max-width:767px)");
  const num=v=>Math.round(v*10)/10;
  // מודד את מרכז כל מילה וכותב את הקשתות. רץ גם בלי GSAP, ובכל שינוי גודל
  function layout(){
    const cb=box.getBoundingClientRect(),w=cb.width,h=cb.height,mob=mq.matches;
    svg.setAttribute("viewBox","0 0 "+num(w)+" "+num(h));
    const P=words.map(el=>{const r=el.querySelector("b").getBoundingClientRect();
      return mob?{x:w-40,y:r.top-cb.top+r.height/2}:{x:r.left-cb.left+r.width/2,y:r.top-cb.top-8};});
    dots.forEach(d=>{const p=P[+d.dataset.i];d.setAttribute("cx",num(p.x));d.setAttribute("cy",num(p.y));});
    arcs.forEach(a=>{const A=P[+a.dataset.a],B=P[+a.dataset.b];
      if(mob){const hh=Math.min(32,8+Math.abs(A.y-B.y)*.12);a.setAttribute("d","M"+num(A.x)+" "+num(A.y)+" Q"+num(A.x+hh*2)+" "+num((A.y+B.y)/2)+" "+num(B.x)+" "+num(B.y));}
      else{const hh=Math.min(80,18+Math.abs(A.x-B.x)*.28);a.setAttribute("d","M"+num(A.x)+" "+num(A.y)+" Q"+num((A.x+B.x)/2)+" "+num(A.y-hh*2)+" "+num(B.x)+" "+num(B.y));}});
  }
  layout();
  if(window.ResizeObserver)new ResizeObserver(layout).observe(box);else addEventListener("resize",layout);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  if(typeof gsap==="undefined")return;       // בלי GSAP: הקשתות והפסים מוצגים כבר במצב הסופי
  gsap.registerPlugin(ScrollTrigger);
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const wd=words.map(w=>w.querySelector("b")),bars=words.map(w=>w.querySelector(".aw-bar")),
          thin=arcs.filter(a=>a.classList.contains("aw-t")),hot=svg.querySelector(".aw-h"),
          soft=dots.filter(d=>!d.classList.contains("is-hot")),hotDots=dots.filter(d=>d.classList.contains("is-hot")),
          noun=box.querySelector(".is-n .aw-bar"),pron=box.querySelector(".is-p .aw-bar"),fills=[noun,pron].map(b=>b.querySelector("u"));
    gsap.set(wd,{opacity:.3});
    gsap.set([...thin,hot],{strokeDashoffset:1});
    gsap.set(dots,{opacity:0});
    gsap.set(bars,{scaleX:.22});
    gsap.set(fills,{opacity:0});
    const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:box,start:"top 75%",end:"bottom 35%",scrub:.6,invalidateOnRefresh:true}});
    tl.to(wd,{opacity:1,duration:.6,stagger:.15},0)
      .to(thin,{strokeDashoffset:0,duration:.6,stagger:.3},1.5)
      .to(soft,{opacity:1,duration:.3,stagger:.25},1.5)
      .to(hot,{strokeDashoffset:0,duration:2},4.5)
      .to(hotDots,{opacity:1,duration:.3,stagger:1.7},4.5)
      .to(noun,{scaleX:1,duration:2},6.5)
      .to(pron,{scaleX:.6,duration:1.5},6.5)
      .to(fills,{opacity:1,duration:1.5},6.5)
      .to({},{duration:1.5},8.5);
    return()=>{if(tl.scrollTrigger)tl.scrollTrigger.kill();tl.kill();gsap.set([...wd,...thin,hot,...dots,...bars,...fills],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
