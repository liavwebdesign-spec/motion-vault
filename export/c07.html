<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C07 · מילה ענקית ולוויינים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C07 · מילה ענקית ולוויינים */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c7{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"a core b" "c core d";column-gap:clamp(20px,3.6cqi,56px);row-gap:14px;align-items:center;padding-block:clamp(24px,6cqi,80px)}
.c7 .core{grid-area:core;text-align:center}
.c7 .big{font-size:clamp(64px,15cqi,220px);font-weight:900;line-height:.92;letter-spacing:-.02em;margin:0}
.c7 .sub{color:var(--muted, #6a6d85);margin:10px 0 0;font-size:clamp(15px,1.4cqi,18px)}
.c7 .sats{display:contents}
.c7 .sat{display:flex;flex-direction:column;gap:4px;margin:0;background:var(--card, #fff);border-radius:16px;padding:14px 22px;max-width:240px;box-shadow:0 14px 34px rgba(22,24,43,.08)}
.c7 .sat b{font-size:clamp(20px,2.3cqi,30px);line-height:1.1;font-variant-numeric:tabular-nums}
.c7 .sat span{font-size:14px;color:var(--muted, #6a6d85)}
.c7 .s1{grid-area:a;justify-self:end;align-self:end;transform:translateY(-10px)}
.c7 .s2{grid-area:b;justify-self:start;align-self:end}
.c7 .s3{grid-area:c;justify-self:end;align-self:start;margin-inline-end:clamp(12px,2.4cqi,36px)}
.c7 .s4{grid-area:d;justify-self:start;align-self:start;transform:translateY(12px)}
@container (max-width:767px){
  .c7{grid-template-columns:1fr 1fr;grid-template-areas:"core core" "a b" "c d";row-gap:10px;column-gap:10px}
  .c7 .core{margin-bottom:14px}
  .c7 .big{font-size:clamp(56px,22cqi,120px)}
  .c7 .sat{justify-self:stretch;max-width:none;margin:0;transform:none}
}
</style>
</head>
<body>

<div class="cwrap cstage"><div class="c7">
  <div class="core"><p class="big"><bdi dir="ltr">340+</bdi></p><p class="sub">אתרים שעלו לאוויר</p></div>
  <div class="sats">
    <p class="sat s1"><b>12</b><span>שנות ניסיון</span></p>
    <p class="sat s2"><b>4.9</b><span>ממוצע ביקורות</span></p>
    <p class="sat s3"><b>יום אחד</b><span>זמן מענה</span></p>
    <p class="sat s4"><b><bdi dir="ltr">100%</bdi></b><span>מותאם אישית</span></p>
  </div>
</div></div>



</body>
</html>
