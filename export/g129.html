<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G129 · מדרגות כרטיסים שנבנות בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G129 · מדרגות כרטיסים שנבנות בגלילה */
.st{position:relative;height:240vh}
.st-pin{position:sticky;top:0;height:100vh;display:grid;place-items:end center;perspective:1200px;overflow:hidden;padding-bottom:10vh}
.st-stage{position:relative;width:min(760px,90vw);height:60vh;transform-style:preserve-3d}
.st-card{position:absolute;inset-inline:0;bottom:0;height:42%;border-radius:18px;background:var(--card, #fff);border:1px solid var(--line, #e4e4ee);padding:22px 24px;display:grid;align-content:start;gap:6px;box-shadow:0 30px 60px rgba(0,0,0,.14);will-change:transform;transform-origin:50% 100%}
.st-card b{font-size:12px;color:var(--accent, #4a3aff);letter-spacing:.14em}
.st-card h3{margin:0;font-size:clamp(18px,2.2vw,28px)}
.st-card p{margin:0;color:var(--muted, #6a6d85);font-size:14px}
@media(max-width:767px){.st{height:200vh}.st-stage{height:64vh}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="st">
  <div class="st-pin"><div class="st-stage">
    <div class="st-card"><b>שלב 01</b><h3>שיחת היכרות</h3><p>עשרים דקות, בלי התחייבות.</p></div>
    <div class="st-card"><b>שלב 02</b><h3>אפיון</h3><p>מסמך של עמוד שקובע הכל.</p></div>
    <div class="st-card"><b>שלב 03</b><h3>עיצוב</h3><p>מסך אחרי מסך, עד שנכון.</p></div>
    <div class="st-card"><b>שלב 04</b><h3>עלייה לאוויר</h3><p>ומדידה מהיום הראשון.</p></div>
  </div></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const cards=gsap.utils.toArray(".st-card"),n=cards.length;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){cards.forEach((c,i)=>gsap.set(c,{y:-i*90,z:-i*80}));return;}
  const mob=matchMedia("(max-width:767px)").matches,dy=mob?78:104,dz=mob?70:110;
  gsap.set(cards,{y:220,opacity:0,zIndex:(i)=>n-i});
  const tl=gsap.timeline({scrollTrigger:{trigger:".st",start:"top top",end:"bottom bottom",scrub:.6}});
  cards.forEach((c,i)=>tl.to(c,{y:-i*dy,z:-i*dz,opacity:1,duration:1,ease:"power3.out"},i*.35));
})();
</script>
</body>
</html>
