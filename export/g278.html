<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G278 · ספרה ענקית בקו מתאר שמתמלאת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G278 · ספרה ענקית בקו מתאר שמתמלאת */
.ol{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px);max-width:1040px;margin-inline:auto;padding-block:6vh 18vh;color:var(--ink, #16182b)}
.ol-n{--p:1;--so:1;margin:0;direction:ltr;font-size:clamp(176px,30vw,420px);font-weight:900;line-height:.82;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:transparent;
  -webkit-text-stroke:clamp(2px,.5vw,5px) color-mix(in oklab,var(--ink, #16182b) calc(var(--so) * 100%),transparent);
  background:linear-gradient(to top,var(--accent, #4a3aff) 0 45.5%,transparent 54.5%) 0 calc(var(--p) * 100%) / 100% 220% no-repeat;-webkit-background-clip:text;background-clip:text}
.ol-txt{display:grid;gap:14px;max-width:30ch}
.ol-txt h2{margin:0;font-size:clamp(26px,3vw,44px);font-weight:700;line-height:1.15;text-wrap:balance}
.ol-txt p{margin:0;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.ol .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:767px){.ol{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.ol-txt{justify-items:center}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="ol">
  <p class="ol-n" aria-hidden="true">15</p>
  <div class="ol-txt">
    <h2><span class="sr-only">15 </span>שנים של שיפוצי דירות בתל אביב</h2>
    <p>ליווינו כמה מאות דירות מהתכנון ועד המפתח, ורובן הגיעו אלינו בהמלצה של שכנים או של לקוחות קודמים.</p>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הספרה מלאה והקו מלא (במארקאפ)
  const num=document.querySelector(".ol-n");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    // הסקשן נעוץ קצר במרכז המסך, והמילוי עולה לאורך כל הנעיצה: בכניסה רק קו, באמצע חצי, ביציאה מלא
    gsap.timeline({scrollTrigger:{trigger:".ol",start:"center center",end:"+=75%",pin:true,scrub:.4}})
      .fromTo(num,{"--so":.2},{"--so":1,duration:.25,ease:"none"},0)
      .fromTo(num,{"--p":0},{"--p":1,duration:1,ease:"power1.inOut"},0);
    return()=>{gsap.set(num,{clearProps:"--p,--so"});};
  });
})();
</script>
</body>
</html>
