<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G273 · קרני שמש שנפתחות מאחורי המבצע</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G273 · קרני שמש שנפתחות מאחורי המבצע */
.sb{position:relative;isolation:isolate;overflow:clip;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(32px,5vw,72px);min-height:clamp(520px,52vw,680px);padding:clamp(40px,6vw,96px);border-radius:clamp(20px,2.4vw,32px);background:var(--card, #fff);color:var(--ink, #16182b)}
.sb-txt{display:grid;gap:18px;justify-items:start;max-width:34rem}
.sb-txt h2{margin:0;font-size:clamp(38px,5vw,70px);font-weight:800;line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.sb-txt p{margin:0;max-width:34ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.sb-cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:600;text-decoration:none}
.sb-obj{position:relative;justify-self:center;width:clamp(260px,34vw,440px);aspect-ratio:1}
.sb-obj img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 58%}
.sb-badge{position:absolute;inset-block-start:2%;inset-inline-end:-4%;display:grid;place-items:center;width:clamp(92px,10vw,132px);aspect-ratio:1;border-radius:50%;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);text-align:center;font-size:clamp(15px,1.5vw,20px);font-weight:700;line-height:1.15;transform:rotate(-10deg)}
/* הקרניים: עטיפה ממורכזת על האובייקט עם מסכה רדיאלית, ובתוכה השכבה שמסתובבת ונפתחת */
.sb-fade{position:absolute;left:50%;top:50%;z-index:-1;width:max(1500px,130vw);aspect-ratio:1;translate:-50% -50%;pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 16%,transparent 100%);mask-image:radial-gradient(closest-side,#000 16%,transparent 100%)}
.sb-rays{position:absolute;inset:0;--sw:1;
  background:repeating-conic-gradient(color-mix(in oklab,var(--accent, #4a3aff) 15%,transparent) 0 5deg,transparent 5deg 10deg);
  -webkit-mask-image:conic-gradient(#000 calc(var(--sw) * 1turn),transparent 0deg);mask-image:conic-gradient(#000 calc(var(--sw) * 1turn),transparent 0deg)}
@media(max-width:767px){.sb{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding:40px 20px}.sb-txt{justify-items:center}.sb-obj{order:-1;width:min(300px,76vw)}.sb-badge{inset-inline-end:-2%}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="sb">
  <div class="sb-txt">
    <h2>קונוס שני במתנה</h2>
    <p>בכל יום חמישי אחרי הצהריים בוחרים שני טעמים מהמקרר, והקונוס השני עלינו. ההטבה חלה על כל הטעמים, כולל הטעמים המשתנים של השבוע.</p>
    <a class="sb-cta" href="#">לכל הטעמים</a>
  </div>
  <div class="sb-obj">
    <div class="sb-fade" aria-hidden="true"><div class="sb-rays"></div></div>
    <img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s11/hero-scoops.webp" width="1400" height="1750" alt="שלושה כדורי גלידה ורודים ולבנים עם סוכריות" loading="lazy" decoding="async">
    <span class="sb-badge">ימי<br>חמישי</span>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הקרניים סטטיות ופתוחות במלואן (במארקאפ)
  const root=document.querySelector(".sb"),rays=root.querySelector(".sb-rays"),fade=root.querySelector(".sb-fade"),badge=root.querySelector(".sb-badge");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    // פתיחה חד פעמית כשהסקשן נכנס: הסריקה סובבת את הקרניים ואחריה ההטבה נכנסת
    gsap.timeline({scrollTrigger:{trigger:root,start:"top 75%",once:true}})
      .fromTo(rays,{"--sw":0},{"--sw":1,duration:1.5,ease:"power2.inOut"},0)
      .fromTo(badge,{scale:.7,autoAlpha:0},{scale:1,autoAlpha:1,duration:.7,ease:"power3.out"},.55);
    // סיבוב איטי שנקשר לגלילה, ופעימה של העטיפה שנעצרת כשהסקשן מחוץ למסך
    gsap.fromTo(rays,{rotation:-16},{rotation:16,ease:"none",scrollTrigger:{trigger:root,start:"top bottom",end:"bottom top",scrub:.8}});
    const pulse=gsap.to(fade,{opacity:.7,duration:2.2,ease:"sine.inOut",yoyo:true,repeat:-1,paused:true});
    ScrollTrigger.create({trigger:root,start:"top bottom",end:"bottom top",onToggle:s=>s.isActive?pulse.play():pulse.pause()});
    return()=>{gsap.set([rays,fade,badge],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
