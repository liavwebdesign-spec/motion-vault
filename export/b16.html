<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B16 · Toast (הודעה קופצת)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.gbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding-inline:28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:500;font-size:16px;border:0;cursor:pointer;font-family:inherit}
.center{text-align:center}

/* B16 · Toast (הודעה קופצת) */
/* left+translate ממרכזים זהה בעברית ובאנגלית, בלי כלל נפרד ל-RTL. visibility מוציא את ההודעה מסדר הקריאה כשהיא סגורה */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;translate:-50% 20px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);padding:13px 26px;border-radius:12px;font-size:15px;opacity:0;visibility:hidden;transition:opacity .24s,translate .24s,visibility 0s .24s;z-index:95;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;translate:-50% 0;visibility:visible;transition-delay:0s}
.toast b{color:#12b76a}
@media (prefers-reduced-motion: reduce){.toast{translate:-50% 0}}
</style>
</head>
<body>

<div class="stage tight center"><button class="gbtn show-t">שלח טופס (דמו)</button></div>
<div class="toast" role="status" aria-live="polite"><b aria-hidden="true">✓</b><span class="toast-msg"></span></div>


<script>
(function(){
  // הטקסט נכתב לתוך אזור ה-live רק ברגע ההצגה: כך קורא מסך מודיע עליו, והוא לא יושב בדף כשההודעה סגורה
  const t=document.querySelector(".toast"),msg=t.querySelector(".toast-msg");
  let tmr,clr;
  document.querySelector(".show-t").addEventListener("click",()=>{
    clearTimeout(tmr);clearTimeout(clr);
    msg.textContent="קיבלנו! נחזור אליכם היום";
    t.classList.add("on");
    tmr=setTimeout(()=>{t.classList.remove("on");clr=setTimeout(()=>msg.textContent="",300);},3000);
  });
})();
</script>
</body>
</html>
