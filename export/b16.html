<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B16 · Toast (הודעה קופצת)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.gbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding-inline:28px;border-radius:999px;background:var(--accent, #4a3aff);color:#fff;font-weight:500;font-size:16px;border:0;cursor:pointer;font-family:inherit}
.center{text-align:center}

/* B16 · Toast (הודעה קופצת) */
.toast{position:fixed;bottom:24px;inset-inline-start:50%;translate:-50% 20px;background:#16182b;color:#fff;padding:13px 26px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .24s,translate .24s;z-index:95;display:flex;gap:10px;align-items:center}
html[dir="rtl"] .toast{translate:50% 20px}
.toast.on{opacity:1;translate:-50% 0}
html[dir="rtl"] .toast.on{translate:50% 0}
.toast b{color:#12b76a}
</style>
</head>
<body>
<div class="stage tight center"><button class="gbtn show-t">שלח טופס (דמו)</button></div>
<div class="toast"><b>✓</b>קיבלנו! נחזור אליכם היום</div>

<script>
let tmr;
document.querySelector(".show-t").addEventListener("click",()=>{
  const t=document.querySelector(".toast");
  t.classList.add("on");clearTimeout(tmr);
  tmr=setTimeout(()=>t.classList.remove("on"),3000);
});
</script>
</body>
</html>
