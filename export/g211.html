<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G211 · שורות שנוספות אחת אחרי השנייה והישנות מתעמעמות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G211 · שורות שנוספות אחת אחרי השנייה והישנות מתעמעמות */
.cs{max-width:1000px;margin-inline:auto}
.cs-st{display:flex;flex-direction:column;justify-content:center;gap:24px;padding-block:48px}
.cs-k{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px))}
.cs-ls{display:grid;gap:clamp(12px,1.6vw,24px)}
.cs-l{margin:0;font-size:clamp(26px,3.7vw,56px);font-weight:600;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;color:var(--muted, #6a6d85)}
.cs-l:last-child{color:var(--ink, #16182b)}
/* המהלך רץ: גובה של מסך ועוד 56% לכל שורה, והבמה נעוצה למעלה */
.cs.is-live{height:calc(100vh + (var(--n) - 1) * 56vh);height:calc(100svh + (var(--n) - 1) * 56svh)}
.cs.is-live .cs-st{position:sticky;top:0;height:100vh;height:100svh;padding-block:0}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="cs">
  <div class="cs-st">
    <p class="cs-k">איך עובדים איתנו</p>
    <div class="cs-ls">
      <p class="cs-l">כל פרויקט מתחיל בהיכרות עם העסק.</p>
      <p class="cs-l">אחרי זה בונים תכנית עבודה שאפשר לקרוא בלי מילון.</p>
      <p class="cs-l">לכל שלב יש תאריך ואדם אחראי.</p>
      <p class="cs-l">שינויים קטנים נכנסים בלי תוספת תשלום.</p>
      <p class="cs-l">ובסוף מקבלים אתר שאפשר לנהל לבד.</p>
    </div>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP כל השורות מוצגות, הישנות באפור והאחרונה במלואה
  const root=document.querySelector(".cs"),ls=[...root.querySelectorAll(".cs-l")];
  // בהפחתת תנועה הפונקציה לא רצה, והרשימה נשארת במצב הסופי
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const muted=getComputedStyle(ls[0]).color,ink=getComputedStyle(ls[ls.length-1]).color;
    root.classList.add("is-live");root.style.setProperty("--n",ls.length);
    gsap.set(ls,{color:ink});gsap.set(ls.slice(1),{opacity:0,y:28});
    const tl=gsap.timeline({defaults:{ease:"power2.out"},
      scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.5,invalidateOnRefresh:true}});
    // בכל צעד: השורה החדשה עולה והקודמת מתעמעמת באותו רגע
    ls.slice(1).forEach((l,i)=>{
      tl.to(ls[i],{color:muted,duration:.5,ease:"none"},i+.2).to(l,{opacity:1,y:0,duration:.6},i+.2);
    });
    tl.to({},{duration:.5});      // עצירה בסוף, כדי שהשורה האחרונה תישאר במלואה רגע לפני שהעמוד ממשיך
    return()=>{if(tl.scrollTrigger)tl.scrollTrigger.kill();tl.kill();root.classList.remove("is-live");root.style.removeProperty("--n");gsap.set(ls,{clearProps:"color,opacity,transform"});};
  });
})();
</script>
</body>
</html>
