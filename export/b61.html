<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B61 · משיכה מגנטית לעבר הסמן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.gbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding-inline:28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:500;font-size:16px;border:0;cursor:pointer;font-family:inherit}

/* B61 · משיכה מגנטית לעבר הסמן */
.mg-wrap{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;padding-block:88px}
/* demo only: with a real mouse the 40px pull zones must not meet, so the items sit 88px apart; on touch the effect is off */
@media (hover:hover) and (pointer:fine){.mg-wrap{gap:88px}}
.mg{display:inline-block;vertical-align:middle}
.mg .gbtn,.mg .mg-ic{translate:var(--x,0) var(--y,0);transition:translate .25s cubic-bezier(.2,.6,.2,1)}
.mg.leave .gbtn,.mg.leave .mg-ic{transition-duration:.6s}
.mg-ic{width:56px;height:56px;border-radius:50%;background:var(--card, #fff);border:1px solid var(--line, #e4e4ee);display:grid;place-items:center;font-weight:700;color:var(--ink, #16182b);text-decoration:none}
.mg-ic:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.mg .gbtn,.mg .mg-ic{transition:none;translate:none}}
</style>
</head>
<body>

<div class="stage tight"><div class="mg-wrap">
  <div class="mg"><button class="gbtn">בואו נדבר</button></div>
  <div class="mg"><a class="mg-ic" href="#" aria-label="לינקדאין">in</a></div>
  <div class="mg"><a class="mg-ic" href="#" aria-label="אינסטגרם">ig</a></div>
</div></div>


<script>
(function(){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const PULL=.35,REACH=40;   // PULL: כמה מהמרחק הכפתור עובר לעבר הסמן (1 = דבוק לסמן, כבר לא אלגנטי). REACH: אזור המשיכה סביב האלמנט
  const zones=[...document.querySelectorAll(".mg")].map(z=>({z,el:z.firstElementChild,on:false}));
  let x=-1e5,y=-1e5,raf=0;
  function tick(){
    raf=0;
    zones.forEach(o=>{
      const r=o.z.getBoundingClientRect();   // העטיפה לא זזה, רק הילד, לכן המלבן שלה הוא מקום המנוחה
      if(x>r.left-REACH&&x<r.right+REACH&&y>r.top-REACH&&y<r.bottom+REACH){
        o.on=true;o.z.classList.remove("leave");
        o.el.style.setProperty("--x",((x-(r.left+r.width/2))*PULL).toFixed(1)+"px");o.el.style.setProperty("--y",((y-(r.top+r.height/2))*PULL).toFixed(1)+"px");
      }else if(o.on){o.on=false;o.z.classList.add("leave");o.el.style.setProperty("--x","0px");o.el.style.setProperty("--y","0px");}
    });
  }
  const req=()=>{if(!raf)raf=requestAnimationFrame(tick);};
  document.addEventListener("mousemove",e=>{x=e.clientX;y=e.clientY;req();},{passive:true});
  document.addEventListener("mouseleave",()=>{x=y=-1e5;req();});
  addEventListener("scroll",req,{passive:true});   // גלילה בלי תזוזת עכבר משנה את המרחק
})();
</script>
</body>
</html>
