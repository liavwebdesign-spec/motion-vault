<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G164 · שמש שעולה מאחורי קו האופק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G164 · שמש שעולה מאחורי קו האופק */
.sr{position:relative;max-width:1100px;margin-inline:auto}
.sr-pin{--g:clamp(16px,2.4vw,32px);--h:clamp(260px,calc(100svh - 360px),560px);--d:min(56vw,calc(var(--h) * .7),520px);display:grid;align-content:center;gap:var(--g);padding-block:clamp(16px,3vw,48px)}
.sr-k{margin:0;text-align:center;font-size:15px;font-weight:600;color:var(--muted, #6a6d85)}
.sr-sky{position:relative;overflow:hidden;height:var(--h);container-type:inline-size}
.sr-sky::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink, #16182b) 30%,transparent) 14%,color-mix(in srgb,var(--ink, #16182b) 30%,transparent) 86%,transparent)}
.sr-wash{position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--accent, #4a3aff) 18%,transparent),color-mix(in srgb,var(--accent, #4a3aff) 6%,transparent) 48%,transparent 88%);-webkit-mask-image:linear-gradient(90deg,transparent,black 16%,black 84%,transparent);mask-image:linear-gradient(90deg,transparent,black 16%,black 84%,transparent)}
.sr-bloom{position:absolute;left:calc(50% - var(--d) * 1.3);bottom:calc(var(--d) * -.45);width:calc(var(--d) * 2.6);height:calc(var(--d) * .9);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent, #4a3aff) 40%,transparent),transparent)}
.sr-lit{position:absolute;left:calc(50% - var(--d) * 1.1);bottom:0;width:calc(var(--d) * 2.2);height:2px;background:linear-gradient(90deg,transparent,var(--accent, #4a3aff),transparent)}
.sr-sun{position:absolute;left:50%;margin-left:calc(var(--d) / -2);bottom:calc(var(--d) * -.04);width:var(--d);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent, #4a3aff) 12%,var(--bg, #f7f7fa)),color-mix(in srgb,var(--accent, #4a3aff) 50%,var(--bg, #f7f7fa)))}
.sr-ring{position:absolute;inset:-15%;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent, #4a3aff) 34%,transparent);pointer-events:none}
.sr-ring2{inset:-34%;border-color:color-mix(in srgb,var(--accent, #4a3aff) 18%,transparent)}
.sr-halo{position:absolute;inset:-30%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent, #4a3aff) 30%,transparent),transparent)}
.sr-h{position:absolute;inset-inline:0;bottom:0;z-index:1;margin:0;display:flex;justify-content:center;gap:.28em;padding-bottom:.1em;font-size:clamp(30px,12.4cqi,160px);font-weight:800;line-height:1.02;letter-spacing:-.02em;white-space:nowrap}
.sr-w{display:inline-block}
.sr-refl{position:relative;height:0;margin-top:calc(var(--g) * -1)}
.sr-refl::before{content:"";position:absolute;left:calc(50% - var(--d) * .9);top:0;width:calc(var(--d) * 1.8);height:calc(var(--d) * .4);background:radial-gradient(farthest-side at 50% 0,color-mix(in srgb,var(--accent, #4a3aff) 24%,transparent),transparent)}
.sr-ground{position:relative;display:grid;gap:16px;justify-items:center;text-align:center}
.sr-lead{margin:0;max-width:52ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
.sr-link{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;border:1px solid var(--line, #e4e4ee);background:var(--card, #fff);color:var(--ink, #16182b);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.sr-link:hover{transform:translateY(-2px)}}
.sr-link:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:3px}
/* המהלך רץ: הסקשן גבוה והבמה נעוצה במסך, והשמש עולה עם הגלילה */
.sr.is-live{height:280vh}
.sr.is-live .sr-pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
@media(prefers-reduced-motion:reduce){.sr-link{transition:none}}
@media(max-width:767px){
  .sr-pin{--h:clamp(260px,calc(100svh - 400px),440px);--d:min(62vw,calc(var(--h) * .7))}
  .sr-halo{inset:-22%}
  .sr-ring{inset:-8%}
  .sr-ring2{inset:-20%}
  .sr-bloom,.sr-lit{left:calc(50% - var(--d) * .7);width:calc(var(--d) * 1.4)}
  .sr-refl::before{left:calc(50% - var(--d) * .7);width:calc(var(--d) * 1.4)}
}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="sr">
  <div class="sr-pin">
    <p class="sr-k">אלון סולאר, מערכות סולאריות לבתים פרטיים</p>
    <div class="sr-sky">
      <div class="sr-wash" aria-hidden="true"></div>
      <div class="sr-bloom" aria-hidden="true"></div>
      <div class="sr-sun" aria-hidden="true"><div class="sr-halo"></div><i class="sr-ring"></i><i class="sr-ring sr-ring2"></i></div>
      <div class="sr-lit" aria-hidden="true"></div>
      <h2 class="sr-h"><span class="sr-w">חשמל</span><span class="sr-w">מהגג</span><span class="sr-w">שלכם</span></h2>
    </div>
    <div class="sr-refl" aria-hidden="true"></div>
    <div class="sr-ground">
      <p class="sr-lead">מתכננים, מתקינים ומחברים מערכת סולארית לבית פרטי, כולל הטיפול באישורים מול חברת החשמל.</p>
      <a class="sr-link" href="#">לקבלת הצעה לגג שלכם</a>
    </div>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP נשארת השמש מעל הקו והכותרת המלאה
  const root=document.querySelector(".sr"),sun=root.querySelector(".sr-sun"),halo=root.querySelector(".sr-halo"),
    gr=root.querySelector(".sr-ground"),words=[].slice.call(root.querySelectorAll(".sr-w")),
    wash=root.querySelector(".sr-wash"),bloom=root.querySelector(".sr-bloom"),lit=root.querySelector(".sr-lit"),
    refl=root.querySelector(".sr-refl"),rings=[].slice.call(root.querySelectorAll(".sr-ring"));
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("is-live");
    // השמש והמילים מוזזות רק ב-yPercent: הקצה התחתון של קופסת השמיים הוא קו האופק והוא חותך כל מה שמתחתיו
    const tl=gsap.timeline({scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6,invalidateOnRefresh:true}});
    tl
      .fromTo(sun,{yPercent:112,scale:.86},{yPercent:0,scale:1,duration:.78,ease:"power2.out"},0)
      .fromTo(wash,{opacity:0},{opacity:1,duration:.8,ease:"power1.in"},0)
      .fromTo(bloom,{opacity:0,scaleX:.5},{opacity:1,scaleX:1,duration:.7,ease:"power1.out"},.1)
      .fromTo(halo,{opacity:0,scale:.7},{opacity:1,scale:1,duration:.5,ease:"none"},.3)
      .fromTo(rings,{opacity:0,scale:.88},{opacity:1,scale:1,duration:.3,ease:"power1.out",stagger:.08},.46)
      .fromTo(lit,{opacity:0,scaleX:.3},{opacity:1,scaleX:1,duration:.4,ease:"power1.out"},.46)
      .fromTo(refl,{opacity:0},{opacity:1,duration:.3,ease:"none"},.6)
      .fromTo(gr,{autoAlpha:0,y:24},{autoAlpha:1,y:0,duration:.2,ease:"power2.out"},.72);
    // כל מילה בטווח משלה (ולא stagger): כך שכל המילים מוסתרות מתחת לאופק כבר בטעינה
    words.forEach((w,i)=>tl.fromTo(w,{yPercent:115},{yPercent:0,duration:.3,ease:"power3.out"},.3+i*.1));
    return()=>{gsap.set([sun,halo,gr,wash,bloom,lit,refl].concat(rings,words),{clearProps:"all"});root.classList.remove("is-live");};
  });
})();
</script>
</body>
</html>
