<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G203 · כרטיס סיום: לוגו, כותרת וכפתור בזה אחר זה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G203 · כרטיס סיום: לוגו, כותרת וכפתור בזה אחר זה */
.ec{max-width:1040px;margin-inline:auto;min-height:clamp(420px,58vh,560px);display:grid;place-content:center;justify-items:center;gap:28px;padding:clamp(40px,6vw,88px) clamp(24px,5vw,72px);border-radius:32px;background:var(--card, #fff);text-align:center}
.ec-logo{display:flex;align-items:center;gap:14px}
.ec-mark{width:48px;height:48px;overflow:visible}
.ec-mark .a{fill:var(--accent, #4a3aff)}
.ec-mark .d{fill:var(--card, #fff)}
.ec-word{font-size:clamp(24px,2.4vw,32px);font-weight:700;letter-spacing:-.01em}
.ec-h{margin:0;max-width:20ch;font-size:clamp(32px,5vw,68px);font-weight:700;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.ec-w{display:inline-block}
.ec-key{position:relative;display:inline-block;white-space:nowrap}
.ec-ul{position:absolute;inset-inline:0;bottom:-.04em;height:.12em;border-radius:99px;background:var(--accent, #4a3aff);transform-origin:100% 50%}
.ec-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:16px 40px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-size:20px;font-weight:600;text-decoration:none}
.ec-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ec-btn:focus-visible{outline:3px solid var(--ink, #16182b);outline-offset:4px}
.ec-fine{margin:0;color:var(--muted, #6a6d85);font-size:15px}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="ec" aria-labelledby="ec-h">
  <div class="ec-logo">
    <svg class="ec-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="a" d="M7 44V22a17 17 0 0 1 34 0v22z"/><path class="d" d="M18 44V27a6 6 0 0 1 12 0v17z"/></svg>
    <span class="ec-word">סטודיו ארז</span>
  </div>
  <h2 class="ec-h" id="ec-h"><span class="ec-w">נתחיל</span> <span class="ec-w">בשיחה</span> <span class="ec-w">של</span> <span class="ec-key"><span class="ec-w">עשרים</span> <span class="ec-w">דקות</span><i class="ec-ul" aria-hidden="true"></i></span> <span class="ec-w">בלי</span> <span class="ec-w">עלות</span></h2>
  <a class="ec-btn" href="#"><span>לקביעת שיחה</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <p class="ec-fine">חוזרים אליכם בתוך יום עסקים</p>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;      // בלי GSAP הכרטיס כבר שלם (במארקאפ)
  const root=document.querySelector(".ec"),q=s=>root.querySelector(s);
  const mark=q(".ec-mark"),word=q(".ec-word"),words=root.querySelectorAll(".ec-w"),ul=q(".ec-ul"),btn=q(".ec-btn"),fine=q(".ec-fine");
  const all=[root,mark,word,...words,ul,btn,fine];
  // בהפחתת תנועה הפונקציה לא רצה, והכרטיס נשאר שלם
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const tl=gsap.timeline({paused:true,defaults:{ease:"power3.out"}});
    tl.from(root,{autoAlpha:0,y:24,duration:.6})
      .from(mark,{autoAlpha:0,scale:.6,transformOrigin:"50% 50%",duration:.5},.25)
      .from(word,{autoAlpha:0,x:16,duration:.5},.4)
      .from(words,{autoAlpha:0,y:22,duration:.55,stagger:.07},.65)
      .fromTo(ul,{scaleX:0},{scaleX:1,duration:.5,ease:"power2.inOut"},1.15)
      // הכפתור נוחת בשני שלבים: קצת מעל הגודל המלא וחזרה. בלי ease של קפיצה
      .fromTo(btn,{autoAlpha:0,scale:.9},{autoAlpha:1,scale:1.04,duration:.3},1.3)
      .to(btn,{scale:1,duration:.18,ease:"power2.inOut"})
      .from(fine,{autoAlpha:0,y:8,duration:.5},">-.05");
    const st=ScrollTrigger.create({trigger:root,start:"top 72%",once:true,onEnter:()=>tl.play()});
    return()=>{st.kill();tl.kill();gsap.set(all,{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
