<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G61 · תמונה שמתאספת מרצועות בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* G61 · תמונה שמתאספת מרצועות בגלילה */
.bl{height:300vh;position:relative}
.bl-stick{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
.bl-frame{position:relative;width:min(880px,90vw);aspect-ratio:16/10;border-radius:18px;overflow:hidden;
  display:flex;background:var(--card, #fff)}
/* כל רצועה מציגה חלק אחר של אותה תמונה: הרקע רחב פי מספר הרצועות */
.bl-slice{flex:1;height:100%;background-image:linear-gradient(115deg,#3b5bdb,#0b7285 34%,#2b8a3e 58%,#e8590c 82%,#5f3dc4);
  background-repeat:no-repeat;will-change:transform}
.bl-cap{position:absolute;bottom:9vh;inset-inline:0;text-align:center;color:var(--muted, #6a6d85);font-size:15px}
.bl-after{padding:14vh var(--gutter, clamp(24px, 5vw, 96px));max-width:min(680px,92vw);margin-inline:auto;text-align:center;
  color:var(--muted, #6a6d85);font-size:17px;line-height:1.9}
</style>
</head>
<body>
<div class="bl"><div class="bl-stick">
  <div class="bl-frame"></div>
  <p class="bl-cap">גלול. הרצועות מתיישרות והתמונה מתאחדת.</p>
</div></div>
<p class="bl-after">במקום גרדיאנט אפשר לשים תמונה אחת של הלקוח, ואותו קוד יפרק אותה לרצועות בלי לחתוך שום קובץ מראש.</p>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const N=9;
  const frame=document.querySelector(".bl-frame");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const slices=[];
  for(let i=0;i<N;i++){
    const s=document.createElement("div");
    s.className="bl-slice";
    // הרקע ברוחב הפריים כפול מספר הרצועות, וכל רצועה מוסטת בחלק שלה
    s.style.backgroundSize=(N*100)+"% 100%";
    s.style.backgroundPosition=(i/(N-1)*100)+"% 50%";
    frame.appendChild(s);slices.push(s);
  }
  if(reduce)return;
  gsap.fromTo(slices,
    {yPercent:i=>(i%2?1:-1)*(60+i*7),opacity:.25},
    {yPercent:0,opacity:1,ease:"none",
     scrollTrigger:{trigger:".bl",start:"top top",end:"bottom bottom",scrub:.6}});
})();
</script>
</body>
</html>
