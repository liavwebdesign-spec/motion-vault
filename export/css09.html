<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS09 · רעידת שגיאה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.gbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding-inline:28px;border-radius:999px;background:var(--accent, #4a3aff);color:#fff;font-weight:500;font-size:16px;border:0;cursor:pointer;font-family:inherit}

/* CSS09 · רעידת שגיאה */
.err-demo{display:flex;flex-direction:column;gap:10px;align-items:center}
.err-input{font-family:inherit;font-size:16px;padding:13px 18px;border:1px solid var(--line, #e4e4ee);border-radius:12px;width:min(320px,80vw)}
.err-input.shake{animation:shake .35s;border-color:#d92d20}
@keyframes shake{0%,100%{translate:0}20%{translate:8px 0}40%{translate:-8px 0}60%{translate:5px 0}80%{translate:-5px 0}}
.err-msg{font-size:13px;color:#d92d20;opacity:0;transition:opacity .2s}
.err-msg.on{opacity:1}
</style>
</head>
<body>
<div class="stage tight"><div class="err-demo">
<input class="err-input" placeholder="הקלד משהו ולחץ שלח">
<span class="err-msg">המספר לא נראה תקין, אפשר לבדוק?</span>
<button class="gbtn err-send">שלח</button>
</div></div>

<script>
document.querySelector(".err-send").addEventListener("click",()=>{
  const i=document.querySelector(".err-input");
  i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");
  document.querySelector(".err-msg").classList.add("on");
});
</script>
</body>
</html>
