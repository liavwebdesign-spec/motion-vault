<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G131 · כותרת שמתמלאת בנוזל</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G131 · כותרת שמתמלאת בנוזל */
.lt{min-height:140vh;display:grid;place-items:center;padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.lt h2{margin:0;font-size:clamp(56px,14vw,220px);font-weight:900;line-height:1;text-align:center;
  color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink, #16182b) 40%,transparent);
  background:linear-gradient(0deg,var(--accent, #4a3aff) 0 50%,transparent 50% 100%) 0 var(--lvl,0%) / 100% 200% no-repeat;
  -webkit-background-clip:text;background-clip:text}
.lt p{text-align:center;color:var(--muted, #6a6d85);margin:14px 0 0}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="lt"><div><h2>מלא</h2><p>גלול, והכותרת מתמלאת</p></div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const h=document.querySelector(".lt h2");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){h.style.setProperty("--lvl","100%");return;}
  const o={l:0};
  gsap.to(o,{l:100,ease:"none",scrollTrigger:{trigger:".lt",start:"top 70%",end:"bottom 60%",scrub:.5},onUpdate(){h.style.setProperty("--lvl",o.l+"%");}});
})();
</script>
</body>
</html>
