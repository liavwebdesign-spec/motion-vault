<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C26 · קיר לוגואים עם כוכב</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C26 · קיר לוגואים עם כוכב */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c26h{text-align:center}
.c26{list-style:none;margin:clamp(20px,3cqi,40px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(88px,10cqi,128px);gap:clamp(8px,1.2cqi,16px)}
.c26 li{background:var(--card, #fff);border-radius:var(--r, 14px);display:grid;place-items:center}
.c26 .lg{font-weight:800;letter-spacing:.08em;color:var(--muted, #6a6d85);font-size:15px}
.c26 .wide{grid-column:span 2}
.c26 .wide .lg{font-size:20px}
.c26 .star{grid-column:span 2;grid-row:span 2;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);place-items:end start;align-content:end;gap:8px;padding:clamp(20px,3cqi,36px)}
.c26 .star .lg{color:inherit;font-size:clamp(26px,3.2cqi,40px)}
.c26 .star p{margin:0;max-width:30ch;font-size:15px;line-height:1.5;opacity:.8}
.c26 .star a{color:inherit;font-weight:700;font-size:15px}
@container (max-width:767px){.c26{grid-template-columns:1fr 1fr;grid-auto-rows:80px}.c26 .star{grid-row:span 2}}
</style>
</head>
<body>

<div class="cwrap cstage"><h3 class="ttl c26h">עובדים איתנו</h3>
<ul class="c26">
  <li class="star"><span class="lg">BRAND</span><p>שורה אחת על מה שעשינו יחד, ומה זה שינה אצלם.</p><a href="#">לפרויקט ←</a></li>
  <li><span class="lg">LOGO</span></li>
  <li><span class="lg">STUDIO</span></li>
  <li><span class="lg">HOUSE</span></li>
  <li><span class="lg">LABS</span></li>
  <li class="wide"><span class="lg">GROUP</span></li>
  <li class="wide"><span class="lg">COMPANY</span></li>
</ul></div>



</body>
</html>
