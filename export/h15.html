<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>H15 · הירו מצגת מסך מלא עם פסי התקדמות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* H15 · הירו מצגת מסך מלא עם פסי התקדמות */
/* ---- demo frame and top row (scaffolding, not part of the hero) ---- */
.hf{position:relative;margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--bg, #f7f7fa);isolation:isolate}
.hf-top{position:absolute;inset-inline:0;top:0;z-index:6;display:flex;align-items:center;gap:24px;padding:20px 28px;font-size:15px;font-weight:500}
.hf-top b{font-size:18px;font-weight:800}
.hf-top nav{display:flex;gap:18px;margin-inline-start:auto;opacity:.8}
@media (max-width:760px){.hf-top nav{display:none}}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:12px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);text-decoration:none;
  font-size:16px;font-weight:600;white-space:nowrap;transition:transform .18s cubic-bezier(.2,.6,.2,1),box-shadow .3s cubic-bezier(.2,.6,.2,1)}
.hbtn.ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
@media (hover:hover) and (pointer:fine){.hbtn:hover{transform:translateY(-2px)}}
.hkick{font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.75}
.hlead{margin:0;font-size:clamp(17px,1.2vw,20px);line-height:1.55;opacity:.82}
.hmicro{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;opacity:.7}
.hcta{display:flex;flex-wrap:wrap;gap:12px}

/* the resting state is the visible one. opacity:1 on .rv also keeps the no-JS look identical to the look after the entrance */
.rv{opacity:1;transition:opacity .5s cubic-bezier(.2,.6,.2,1),transform .5s cubic-bezier(.2,.6,.2,1)}
.open-anim .rv{opacity:0;transform:translateY(18px);animation:rv-fs 0s 2.5s forwards}
/* --t0: on a page with a header, 0.2s so the header comes down first (motion.md 2) */
.is-in .rv{opacity:1;transform:none;transition-duration:.7s;transition-delay:calc(var(--t0,0s) + var(--i,0) * 90ms)}
.rv-on .rv{animation:none}
@keyframes rv-fs{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv,.is-in .rv{transition-duration:.01ms!important;transition-delay:0s!important}
  .hbtn{transition-duration:.01ms!important}.hbtn:hover{transform:none!important}}

.hpp{width:44px;height:44px;flex:none;border:0;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  background:color-mix(in srgb,var(--ink, #16182b) 55%,transparent);color:var(--bg, #f7f7fa);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .18s cubic-bezier(.2,.6,.2,1)}
.hpp svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hpp .i-play{display:none;fill:currentColor}
.hpp[aria-pressed="true"] .i-pause{display:none}
.hpp[aria-pressed="true"] .i-play{display:block}
.hpp:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.hpp:hover{background:color-mix(in srgb,var(--ink, #16182b) 75%,transparent)}}
.h15h{position:relative;min-height:min(84vh,760px);display:flex;flex-direction:column;justify-content:flex-end;padding:112px 28px 40px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);overflow:hidden;isolation:isolate}
/* the incoming slide fades in on top while the outgoing one stays whole underneath and drops only when the fade is done,
   so the middle of a change never shows the background through two half-transparent photos */
.h15-sl{position:absolute;inset:0;z-index:-3;opacity:0;transition:opacity 0s 1s}
.h15-sl.on{z-index:-2;opacity:1;transition:opacity 1s cubic-bezier(.2,.6,.2,1)}
.h15-sl img{width:100%;height:100%;object-fit:cover;display:block}
/* the slow push-in runs only on the slide that is showing, and pauses with the rest */
.h15-sl.on img{animation:h15kb 7s linear forwards}
@keyframes h15kb{from{transform:scale(1.08)}to{transform:scale(1)}}
/* diagonal scrim from the corner where the text sits (heroes.md): dark under the words, clear on the far side */
.h15-scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(to top left,color-mix(in srgb,var(--ink, #16182b) 82%,transparent) 0%,color-mix(in srgb,var(--ink, #16182b) 40%,transparent) 45%,transparent 75%)}
[dir="ltr"] .h15-scrim{background:linear-gradient(to top right,color-mix(in srgb,var(--ink, #16182b) 82%,transparent) 0%,color-mix(in srgb,var(--ink, #16182b) 40%,transparent) 45%,transparent 75%)}
.h15-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.h15-txt{display:flex;flex-direction:column;align-items:flex-start;gap:20px;max-width:620px}
.h15h h3{margin:0;font-size:clamp(36px,min(4.8vw,7.8vh),78px);line-height:1.02;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.h15h .hlead{opacity:.9}
.h15-nav{display:flex;align-items:flex-end;gap:16px;width:min(380px,40%)}
.h15-tab{flex:1;display:flex;flex-direction:column;gap:10px;min-height:44px;justify-content:flex-end;padding:0;border:0;background:none;color:inherit;font:inherit;font-size:14px;font-weight:600;text-align:start;cursor:pointer;opacity:.7;transition:opacity .2s cubic-bezier(.2,.6,.2,1)}
.h15-tab[aria-current="true"]{opacity:1}
.h15-tab:focus-visible{outline:2px solid var(--bg, #f7f7fa);outline-offset:4px;border-radius:4px}
.h15-bar{position:relative;display:block;height:3px;border-radius:3px;background:color-mix(in srgb,var(--bg, #f7f7fa) 30%,transparent);overflow:hidden}
.h15-bar i{position:absolute;inset:0;background:var(--bg, #f7f7fa);transform:scaleX(0);transform-origin:right}
[dir="ltr"] .h15-bar i{transform-origin:left}
.h15-tab.done .h15-bar i{transform:scaleX(1)}
.h15-tab[aria-current="true"] .h15-bar i{animation:h15fill 6s linear forwards}
.h15h.still .h15-tab[aria-current="true"] .h15-bar i{animation:none;transform:scaleX(1)}
@keyframes h15fill{to{transform:scaleX(1)}}
.h15h.paused .h15-bar i,.h15h.paused .h15-sl img{animation-play-state:paused}
@media (hover:hover) and (pointer:fine){.h15-tab:hover{opacity:1}}
@media (prefers-reduced-motion:reduce){.h15-sl.on img{animation:none}.h15-sl,.h15-sl.on{transition:none}}
@media (max-width:860px){.h15h{padding:96px 20px 32px;min-height:min(88vh,720px)}.h15-foot{flex-direction:column-reverse;align-items:stretch;gap:28px}.h15-nav{width:100%}}
</style>
</head>
<body>

<script>if(matchMedia("(prefers-reduced-motion:no-preference)").matches)document.documentElement.classList.add("open-anim")</script>
<div class="hf"><div class="hf-top" style="color:var(--bg)"><b>לוגו</b><nav><span>שירותים</span><span>פרויקטים</span><span>אודות</span></nav></div>
  <section class="h15h" id="h15" aria-roledescription="מצגת">
    <div class="h15-sl on"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/sea.webp" alt="הים מול המלון בשעת שקיעה" fetchpriority="high" decoding="async"></div>
    <div class="h15-sl" aria-hidden="true"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s02/night-room.webp" alt="חדר שינה לבן ושקט" decoding="async"></div>
    <div class="h15-sl" aria-hidden="true"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/room.webp" alt="לאונג' עם כורסה ומנורה" decoding="async"></div>
    <span class="h15-scrim"></span>
    <div class="h15-foot">
      <div class="h15-txt">
        <span class="hkick rv">מלון בוטיק, נתניה</span>
        <h3 class="rv">לישון מול הים, ולהתעורר בלי שעון</h3>
        <p class="hlead rv">עשרים ושניים חדרים, כולם עם מרפסת לים, וארוחת בוקר עד הצהריים.</p>
        <div class="hcta rv"><a class="hbtn" href="#h15">לבדיקת זמינות</a></div>
      </div>
      <div class="h15-nav rv">
        <button class="h15-tab" type="button" aria-current="true"><span>החוף</span><span class="h15-bar"><i></i></span></button>
        <button class="h15-tab" type="button" aria-current="false"><span>החדרים</span><span class="h15-bar"><i></i></span></button>
        <button class="h15-tab" type="button" aria-current="false"><span>הלאונג'</span><span class="h15-bar"><i></i></span></button>
        <button class="hpp" type="button" aria-pressed="false" aria-label="עצירת המצגת"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
      </div>
    </div>
  </section>
</div>


<script>
// in view = fire. Measured directly on scroll and resize, not through IntersectionObserver:
// an observer does not update while the tab is throttled (and on a real site the hero is usually
// on screen at load anyway), and an entrance that never fires leaves the hero invisible.
function inView(el,f){
  var ro;
  function chk(){
    var r=el.getBoundingClientRect();
    if(r.top<innerHeight*.9&&r.bottom>0){off();f();}
  }
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);if(ro)ro.disconnect();}
  addEventListener("scroll",chk,{passive:true}); addEventListener("resize",chk);
  // a layout change with no scroll (a bar above it closes, a font swaps in) can also bring it into view
  if(window.ResizeObserver){ro=new ResizeObserver(chk);ro.observe(document.body);}
  requestAnimationFrame(chk); setTimeout(chk,300);
}
function enter(root){
  var els=root.querySelectorAll(".rv");
  els.forEach(function(el,i){if(!el.style.getPropertyValue("--i"))el.style.setProperty("--i",i);});
  // a script that ran late, after the 2.5s CSS failsafe already showed the hero: keep it shown, no second entrance
  if(els.length&&getComputedStyle(els[0]).opacity==="1")root.classList.add("is-in");
  root.classList.add("rv-on");
  inView(root,function(){root.classList.add("is-in");});
}
(function(){
  var root=document.getElementById("h15"), pp=root.querySelector(".hpp"); enter(root);
  var sl=[].slice.call(root.querySelectorAll(".h15-sl")), tabs=[].slice.call(root.querySelectorAll(".h15-tab")), cur=0;
  // reduced motion: no autoplay, the names still switch; the button has nothing to stop, so it leaves
  var auto=matchMedia("(prefers-reduced-motion:no-preference)").matches;
  if(!auto){root.classList.add("still"); pp.hidden=true;}
  function go(n){
    cur=(n+sl.length)%sl.length;
    sl.forEach(function(s,k){s.classList.toggle("on",k===cur); s.setAttribute("aria-hidden",String(k!==cur));});
    tabs.forEach(function(t,k){t.setAttribute("aria-current",String(k===cur)); t.classList.toggle("done",k<cur);
      // restart the bar: drop the animation for one frame
      var i=t.querySelector("i"); i.style.animation="none"; void i.offsetWidth; i.style.animation="";});
  }
  // the bar of the current slide is the clock: when it fills, the next slide comes
  tabs.forEach(function(t,k){
    t.addEventListener("click",function(){go(k);});
    t.querySelector("i").addEventListener("animationend",function(){if(auto&&k===cur)go(cur+1);});
  });
  pp.addEventListener("click",function(){var on=!root.classList.contains("paused"); root.classList.toggle("paused",on);
    pp.setAttribute("aria-pressed",String(on)); pp.setAttribute("aria-label",on?"הפעלת המצגת":"עצירת המצגת");});
})();
</script>
</body>
</html>
