<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G36 · מעבר סקשן בקשת שמתיישרת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#b9bcd0;font-size:14px}

/* ===== הרכיב ===== */
/* G36 · מעבר סקשן בקשת שמתיישרת */
.arc-light{background:#fff;padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));text-align:center}
.arc-dark{background:#0f1020;color:#fff;position:relative;padding:0 var(--gutter, clamp(24px, 5vw, 96px)) var(--sec, clamp(120px, 12vw, 260px))}
.arc-svg{display:block;width:100%;height:clamp(60px,14vw,220px)}
.arc-svg path{fill:#fff}
.arc-inner{max-width:720px;margin-inline:auto;padding-top:clamp(40px,5vw,80px);text-align:center}
.arc-card{background:#fff;color:var(--ink, #16182b);border-radius:20px;padding:36px 28px;margin-top:32px;display:inline-block;min-width:min(360px,80vw)}
.arc-card b{font-size:clamp(44px,5vw,80px);display:block;line-height:1}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<section class="arc-light"><h2 style="font-size:var(--fs-demo);margin:0">הכל מתחיל בסקשן בהיר</h2><p style="color:var(--muted)">גלול, ותראה את הקשת מתיישרת בכניסה לסקשן הכהה</p></section>
<section class="arc-dark">
  <svg class="arc-svg" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
    <path id="arcA" d="M0,0 H100 V0 C78,40 22,40 0,0 Z"/>
    <path id="arcB" d="M0,0 H100 V0 C78,0 22,0 0,0 Z" style="display:none"/>
  </svg>
  <div class="arc-inner"><p style="letter-spacing:.14em;font-size:12px;color:#9a9cb8">מחיר אחד, פשוט</p>
  <div class="arc-card"><b>250 ₪</b><span style="color:var(--muted)">לחודש, ללא התחייבות</span></div></div>
</section>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger, MorphSVGPlugin);

gsap.to("#arcA",{morphSVG:"#arcB",ease:"none",
  scrollTrigger:{trigger:".arc-svg",start:"top 95%",end:"top 25%",scrub:1}});
</script>
</body>
</html>
