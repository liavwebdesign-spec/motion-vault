<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G225 · מונה לאחור על מסך פתיחה קצר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G225 · מונה לאחור על מסך פתיחה קצר */
/* בלי GSAP ובהפחתת תנועה: אין מסך פתיחה, האתר מוצג מיד. המסך מופיע רק כשהסקריפט מפעיל .is-armed */
.cd{position:relative;max-width:1180px;margin-inline:auto;padding:var(--gutter, clamp(24px, 5vw, 96px));display:grid;gap:16px;justify-items:start}
.cd-site{position:relative;overflow:hidden;width:100%;box-sizing:border-box;min-height:min(76svh,680px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px);padding:clamp(24px,5vw,72px);border-radius:28px;background:var(--card, #fff);box-shadow:inset 0 0 0 1px var(--line, #e4e4ee)}
.cd-copy{display:grid;gap:16px;justify-items:start}
.cd-copy h2{margin:0;font-size:clamp(32px,4vw,64px);font-weight:700;line-height:1.05;text-wrap:balance}
.cd-copy p{margin:0;max-width:38ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.55}
.cd-cta{display:inline-flex;padding:14px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:600;text-decoration:none}
.cd-photo{margin:0;aspect-ratio:4/3;border-radius:20px;overflow:hidden}
.cd-photo img{display:block;width:100%;height:100%;object-fit:cover}
.cd-over{display:none;position:absolute;inset:0;z-index:3;place-items:center;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);pointer-events:none}
.cd.is-armed .cd-over{display:grid}
.cd-dial{position:relative;display:grid;place-items:center;width:min(78%,420px,64svh);aspect-ratio:1;container-type:size}
.cd-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cd-ring circle{fill:none}
.cd-t0{stroke:color-mix(in oklab,var(--bg, #f7f7fa) 26%,transparent);stroke-width:.4}
.cd-tk{stroke:color-mix(in oklab,var(--bg, #f7f7fa) 50%,transparent);stroke-width:3;stroke-dasharray:.06 .94}
.cd-arc{stroke:var(--accent, #4a3aff);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.cd-num{font-size:62cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-shadow:.05em .05em 0 var(--accent, #4a3aff)}
.cd-replay{padding:12px 24px;border:0;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font:inherit;font-weight:600;cursor:pointer}
.cd-replay[hidden]{display:none}
.cd-replay:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:4px}
@media(max-width:767px){
  .cd-site{grid-template-columns:minmax(0,1fr);align-content:center;min-height:min(80svh,720px)}
  .cd-photo{order:-1;aspect-ratio:16/10}
}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage full" style="padding-block:0"><div class="cd">
  <div class="cd-site">
    <div class="cd-copy">
      <h2>הפלגות שקיעה מנמל הרצליה</h2>
      <p>יציאה כל ערב, שעתיים על הים, עם יין וכיבוד קל. עד שמונה אנשים בסירה.</p>
      <a class="cd-cta" href="#">לבדיקת מועדים</a>
    </div>
    <figure class="cd-photo"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/hero.webp" alt="שקיעה כתומה מעל הים" width="2560" height="1707" loading="lazy" decoding="async"></figure>
    <div class="cd-over" aria-hidden="true">
      <div class="cd-dial">
        <svg class="cd-ring" viewBox="0 0 100 100"><circle class="cd-t0" cx="50" cy="50" r="49.6"/><circle class="cd-tk" cx="50" cy="50" r="46" pathLength="60"/><circle class="cd-arc" cx="50" cy="50" r="49.6" pathLength="1" transform="rotate(-90 50 50)"/></svg>
        <span class="cd-num">3</span>
      </div>
    </div>
  </div>
  <button class="cd-replay" type="button" hidden>הפעלה חוזרת של הספירה</button>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;      // בלי GSAP אין מסך פתיחה
  const root=document.querySelector(".cd"),site=root.querySelector(".cd-site"),over=root.querySelector(".cd-over"),num=root.querySelector(".cd-num"),
    arc=root.querySelector(".cd-arc"),btn=root.querySelector(".cd-replay"),parts=root.querySelectorAll(".cd-copy>*,.cd-photo");
  // בהפחתת תנועה הפונקציה לא רצה, ולכן המסך לא מופיע והאתר מוצג מיד
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const STEP=.42;let tl=null;
    const arm=()=>{root.classList.add("is-armed");num.textContent="3";gsap.set(over,{yPercent:0});gsap.set(arc,{strokeDashoffset:1});gsap.set(parts,{opacity:0});btn.hidden=true;};
    // בפרויקט קוראים ל-play() בטעינה, ובביקור ראשון בלבד
    const play=()=>{
      if(tl)tl.kill();
      tl=gsap.timeline({onComplete:()=>{root.classList.remove("is-armed");btn.hidden=false;}});
      [3,2,1].forEach((v,i)=>{
        tl.call(()=>{num.textContent=v;},null,i*STEP)
          .fromTo(num,{scale:1.16,opacity:0},{scale:1,opacity:1,duration:.2,ease:"power3.out"},i*STEP);
      });
      tl.to(arc,{strokeDashoffset:0,duration:STEP*3,ease:"none"},0)
        .to(over,{yPercent:-100,duration:.6,ease:"power3.inOut"},STEP*3+.04)
        .to(parts,{opacity:1,y:0,duration:.5,ease:"power2.out",stagger:.08},STEP*3+.2);
      gsap.set(parts,{y:24});
    };
    arm();
    const st=ScrollTrigger.create({trigger:site,start:"top 70%",once:true,onEnter:play});
    btn.addEventListener("click",()=>{arm();play();});
    return()=>{st.kill();if(tl)tl.kill();root.classList.remove("is-armed");btn.hidden=true;gsap.set([over,num,arc,parts],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
