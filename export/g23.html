<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G23 · Flip: פריט קופץ לגריד וחזרה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}
.center{text-align:center}

/* G23 · Flip: פריט קופץ לגריד וחזרה */
.flip-zone{padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.flip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative;overflow:hidden}
.flip-item{height:120px;cursor:pointer;border:0;padding:0;font-family:inherit;font-size:15px}
.flip-item:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.flip-item.big{grid-column:1/-1;height:320px;font-size:26px}
@media(max-width:767px){.flip-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="stage tight flip-zone"><p class="center" style="color:var(--muted);font-size:14px;margin-top:0">לחץ על כרטיס כדי להגדיל אותו, ולחץ שוב כדי להחזיר</p>
<div class="flip-grid">
<button type="button" class="flip-item ph ph-a" aria-expanded="false"><span class="ph-l"><span>1</span></span></button><button type="button" class="flip-item ph ph-b" aria-expanded="false"><span class="ph-l"><span>2</span></span></button>
<button type="button" class="flip-item ph ph-c" aria-expanded="false"><span class="ph-l"><span>3</span></span></button><button type="button" class="flip-item ph ph-d" aria-expanded="false"><span class="ph-l"><span>4</span></span></button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(Flip);

(function(){
const grid=document.querySelector(".flip-grid");
const items=[...grid.querySelectorAll(".flip-item")];
const rm=matchMedia("(prefers-reduced-motion: reduce)");
const D=.55,E="power2.inOut";
let busy=false;

// החלפת המצב עצמה: רצה תמיד, גם בהפחתת תנועה וגם כש-GSAP לא נטען (CDN חסום). רק המעבר מותנה.
function swap(item){
  items.forEach(b=>{if(b!==item)b.classList.remove("big")});
  item.classList.toggle("big");
  items.forEach(b=>b.setAttribute("aria-expanded",b.classList.contains("big")));
}

items.forEach(item=>{
  item.addEventListener("click",()=>{
    if(busy)return;
    if(typeof Flip==="undefined"||rm.matches){swap(item);return;}
    busy=true;

    const state=Flip.getState(items);
    const h0=grid.getBoundingClientRect().height;
    const fs0=items.map(el=>getComputedStyle(el).fontSize);

    swap(item);

    const h1=grid.getBoundingClientRect().height;
    const fs1=items.map(el=>getComputedStyle(el).fontSize);

    // absolute:true מוציא את כל הפריטים מהזרימה, הגריד מתרוקן ומתכווץ לאפס,
    // וכל מה שמתחת קופץ למעלה ובחזרה. מנפישים את גובה הגריד במקביל.
    gsap.fromTo(grid,{height:h0},{height:h1,duration:D,ease:E,
      onComplete:()=>gsap.set(grid,{clearProps:"height"})});

    // Flip לא מאינטרפל font-size, ולכן הטקסט קופץ למידה החדשה בפריים הראשון.
    items.forEach((el,i)=>{
      if(fs0[i]===fs1[i])return;
      gsap.fromTo(el,{fontSize:fs0[i]},{fontSize:fs1[i],duration:D,ease:E,
        onComplete:()=>gsap.set(el,{clearProps:"fontSize"})});
    });

    Flip.from(state,{duration:D,ease:E,absolute:true,onComplete:()=>{busy=false}});
  });
});
})();
</script>
</body>
</html>
