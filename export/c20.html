<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C20 · מחירים עם עוגן מורם</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C20 · מחירים עם עוגן מורם */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c20h{text-align:center}
.c20{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:clamp(12px,1.6cqi,20px);align-items:center;margin-top:clamp(24px,4cqi,48px)}
.c20 .tier{background:var(--card, #fff);border-radius:var(--r, 14px);padding:clamp(20px,2.6cqi,32px)}
.c20 .anchor{background:var(--ink, #16182b);color:var(--bg, #f7f7fa);padding-block:clamp(32px,4.4cqi,56px)}
.c20 .tag{display:inline-block;background:color-mix(in srgb,var(--bg, #f7f7fa) 16%,transparent);font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;margin-bottom:12px}
.c20 h4{margin:0;font-size:18px}
.c20 .pr{margin:12px 0 16px;display:flex;align-items:baseline;gap:8px}
.c20 .pr b{font-size:clamp(30px,3.4cqi,44px);line-height:1;font-variant-numeric:tabular-nums}
.c20 .pr small{color:var(--muted, #6a6d85);font-size:14px}
.c20 .anchor .pr small{color:inherit;opacity:.75}
.c20 ul{list-style:none;margin:0;padding:0}
.c20 li{display:flex;align-items:center;gap:10px}
.c20 li::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.c20 li .tx{flex:1;margin:8px 0}
.c20 .btn{display:block;text-align:center;margin-top:20px}
.c20 .tier:not(.anchor) .btn{background:transparent;color:var(--ink, #16182b);box-shadow:inset 0 0 0 1.5px var(--ink, #16182b)}
.c20 .anchor .btn{background:var(--accent, #4a3aff);color:var(--accent-ink, #fff)}
@container (max-width:767px){.c20{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="cwrap cstage"><h3 class="ttl c20h">שלוש חבילות, אחת בולטת</h3>
<div class="c20">
  <div class="tier"><h4>בסיס</h4><p class="pr"><b>₪1,900</b><small>תשלום אחד</small></p><ul><li><div class="tx l"></div></li><li><div class="tx m"></div></li><li><div class="tx m"></div></li></ul><span class="btn">לבחור</span></div>
  <div class="tier anchor"><span class="tag">הכי נבחרת</span><h4>מלאה</h4><p class="pr"><b>₪4,900</b><small>תשלום אחד</small></p><ul><li><div class="tx l"></div></li><li><div class="tx m"></div></li><li><div class="tx l"></div></li><li><div class="tx m"></div></li><li><div class="tx s"></div></li></ul><span class="btn">לבחור</span></div>
  <div class="tier"><h4>פרימיום</h4><p class="pr"><b>₪8,900</b><small>תשלום אחד</small></p><ul><li><div class="tx l"></div></li><li><div class="tx m"></div></li><li><div class="tx l"></div></li></ul><span class="btn">לבחור</span></div>
</div></div>



</body>
</html>
