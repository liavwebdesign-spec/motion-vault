<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CV3 · עמוד תודה עם ציר "מה קורה עכשיו"</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* CV3 · עמוד תודה עם ציר "מה קורה עכשיו" */
.cx *{box-sizing:border-box}
.cx{--cx-err:color-mix(in srgb,#d23b22 72%,var(--ink, #16182b));font-size:16px;line-height:1.6;color:var(--ink, #16182b)}
.cx :where(a){color:inherit}
.cx :where(h2,h3){text-wrap:balance}
.cx :where(p,small,li){text-wrap:pretty}
.cx :focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px;border-radius:8px}
.cx-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:14px;
  background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font:inherit;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;
  transition:transform .18s cubic-bezier(.2,.6,.2,1),background .2s cubic-bezier(.2,.6,.2,1),box-shadow .2s cubic-bezier(.2,.6,.2,1)}
.cx-btn svg{width:20px;height:20px;flex:none}
.cx-btn:active{transform:scale(.97)}
.cx-btn.is-ghost{background:transparent;color:var(--ink, #16182b);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink, #16182b) 22%,transparent)}
@media (hover:hover) and (pointer:fine){.cx-btn:hover{transform:translateY(-1px)}.cx-btn.is-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink, #16182b)}
  .cx a:hover .ic-arr,.cx-btn:hover .ic-arr{transform:translateX(-4px)}}
.ic-arr{transition:transform .2s cubic-bezier(.2,.6,.2,1)}
[dir="ltr"] .ic-arr{rotate:180deg}
.cx-rv{opacity:0;transform:translateY(16px);transition:opacity .5s cubic-bezier(.2,.6,.2,1),transform .5s cubic-bezier(.2,.6,.2,1);transition-delay:calc(var(--i,0) * 80ms)}
.is-in .cx-rv{opacity:1;transform:none}
.cx-t{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
/* the demo switch: lets the reviewer see every state. Not part of the component you copy. */
.cx-demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 24px;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--ink, #16182b) 5%,transparent);font-size:13px;width:max-content;max-width:100%}
.cx-demo > span{padding:0 10px;font-weight:600;color:var(--muted, #6a6d85)}
.cx-demo button{min-height:36px;padding:0 14px;border:0;border-radius:10px;background:none;font:inherit;font-weight:600;color:var(--ink, #16182b);cursor:pointer;transition:background .18s cubic-bezier(.2,.6,.2,1),color .18s cubic-bezier(.2,.6,.2,1)}
.cx-demo button[aria-pressed="true"]{background:var(--card, #fff);box-shadow:0 1px 3px color-mix(in srgb,var(--ink, #16182b) 14%,transparent)}
.cx-demo input{min-height:36px;padding:0 12px;border:0;border-radius:10px;background:var(--card, #fff);font:inherit;font-size:14px;color:var(--ink, #16182b);width:220px}
@media (prefers-reduced-motion:reduce){.cx *,.cx *::before,.cx *::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important;animation-iteration-count:1!important}.cx-rv{opacity:1;transform:none}}
.cxw{margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border-radius:var(--r, 14px);background:var(--bg, #f7f7fa);box-shadow:0 0 0 1px var(--line, #e4e4ee);overflow:hidden;isolation:isolate}
.cxw-in{max-width:640px;margin-inline:auto;padding:72px 24px 88px}
@media (max-width:700px){.cxw-in{padding:48px 20px 64px}}
.ty-check{width:56px;height:56px;margin-bottom:24px;fill:none;stroke:var(--accent, #4a3aff);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ty-check circle{stroke-dasharray:164;stroke-dashoffset:164;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .7s cubic-bezier(.2,.6,.2,1)}
.ty-check path{stroke-dasharray:36;stroke-dashoffset:36;transition:stroke-dashoffset .35s cubic-bezier(.2,.6,.2,1) .5s}
.is-in .ty-check circle,.is-in .ty-check path{stroke-dashoffset:0}
.ty-h{margin:0 0 12px;font-size:clamp(30px,4vw,44px);line-height:1.1;font-weight:700}
.ty-lead{margin:0 0 32px;color:var(--muted, #6a6d85);font-size:17px}
.ty-steps{position:relative;list-style:none;margin:0 0 48px;padding:0;display:grid;gap:28px}
/* the track is the information here (how far along), not a divider */
.ty-steps::before,.ty-steps::after{content:"";position:absolute;inset-inline-start:11px;top:12px;bottom:12px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--ink, #16182b) 10%,transparent)}
.ty-steps::after{bottom:auto;height:var(--fill,0px);background:var(--accent, #4a3aff);transform:scaleY(0);transform-origin:top;transition:transform .6s cubic-bezier(.2,.6,.2,1) .9s}
.is-in .ty-steps::after{transform:scaleY(1)}
.ty-steps li{position:relative;display:grid;grid-template-columns:24px 1fr;gap:16px;align-items:start}
.ty-steps li > i{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--bg, #f7f7fa);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink, #16182b) 18%,transparent)}
.ty-steps li.is-done > i{background:var(--accent, #4a3aff);box-shadow:none;color:var(--accent-ink, #fff)}
.ty-steps li.is-done > i svg{width:14px;height:14px}
.ty-steps li.is-now > i{box-shadow:inset 0 0 0 2px var(--accent, #4a3aff)}
.ty-steps li.is-now > i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent, #4a3aff)}
/* two soft rings, then still: it says "this is where you are", it does not nag */
.is-in .ty-steps li.is-now > i::before{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 0 2px var(--accent, #4a3aff);animation:ty-ring 1.4s cubic-bezier(.2,.6,.2,1) 1.3s 2 both}
@keyframes ty-ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.9);opacity:0}}
.ty-steps b{display:block;font-size:17px;line-height:1.3}
.ty-steps small{display:block;margin-top:4px;font-size:15px;line-height:1.5;color:var(--muted, #6a6d85)}
.ty-steps li:not(.is-done):not(.is-now) b{color:var(--muted, #6a6d85)}
.ty-more > small{display:block;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--muted, #6a6d85)}
.ty-more div{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ty-more a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:16px 20px;border-radius:16px;background:var(--card, #fff);text-decoration:none;font-weight:600;
  transition:transform .2s cubic-bezier(.2,.6,.2,1),box-shadow .2s cubic-bezier(.2,.6,.2,1)}
.ty-more a svg{width:20px;height:20px}
@media (hover:hover) and (pointer:fine){.ty-more a:hover{transform:translateY(-2px);box-shadow:0 12px 28px color-mix(in srgb,var(--ink, #16182b) 10%,transparent)}}
@media (max-width:560px){.ty-more div{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="cx cxw"><div class="cxw-in" id="cv3" data-thanks data-demo-name="דנה">
  <svg class="ty-check" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26"/><path d="M18 29l7 7 14-15"/></svg>
  <h2 class="ty-h cx-rv">תודה<span data-name-wrap>, <span data-name></span></span>. הפרטים אצלנו.</h2>
  <p class="ty-lead cx-rv" style="--i:1">ככה זה ממשיך מכאן, כדי שלא תצטרכו לנחש:</p>
  <ol class="ty-steps cx-rv" style="--i:2">
    <li class="is-done"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><div><b>קיבלנו את הפנייה</b><small>היום, <span class="cx-t" data-now>14:32</span></small></div></li>
    <li class="is-now"><i></i><div><b>שיחה קצרה איתך</b><small>בדרך כלל תוך שעתיים, בשעות הפעילות. נתקשר מ-<span class="cx-t" dir="ltr">050-000-0000</span>, כדאי לשמור אותו.</small></div></li>
    <li><i></i><div><b>הצעה מסודרת במייל</b><small>אחרי השיחה, בתוך יום עבודה</small></div></li>
  </ol>
  <div class="ty-more cx-rv" style="--i:3"><small>בינתיים, אם בא לכם</small><div><a href="#cv3">איך אנחנו עובדים <svg class="ic-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><a href="#cv3">פרויקטים אחרונים <svg class="ic-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a></div></div>
</div></div>


<script>
function inView(el,f){
  function chk(){var r=el.getBoundingClientRect();if(r.top<innerHeight*.9&&r.bottom>0){off();f();}}
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);}
  addEventListener("scroll",chk,{passive:true});addEventListener("resize",chk);requestAnimationFrame(chk);setTimeout(chk,300);
}
function fireLead(){
  try{if(sessionStorage.getItem("lead-fired"))return;sessionStorage.setItem("lead-fired","1");}catch(e){}
  (window.dataLayer=window.dataLayer||[]).push({event:"generate_lead"});
  if(typeof window.fbq==="function")window.fbq("track","Lead");
}
(function(){
  var root=document.getElementById("cv3"),q=new URLSearchParams(location.search),n="";
  // the name: from ?name= (the form redirects with it) or from what the form stored; on a real site no demo fallback
  try{n=q.get("name")||sessionStorage.getItem("lead-name")||"";}catch(e){}
  n=(n||root.getAttribute("data-demo-name")||"").trim().split(" ")[0];
  if(n)root.querySelector("[data-name]").textContent=n;else root.querySelector("[data-name-wrap]").remove();
  var d=new Date();root.querySelector("[data-now]").textContent=d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes();
  // the progress track fills from the first marker to the current one
  var ol=root.querySelector(".ty-steps"),now=ol.querySelector(".is-now > i"),first=ol.querySelector("li > i");
  function fill(){ol.style.setProperty("--fill",(now.getBoundingClientRect().top-first.getBoundingClientRect().top)+"px");}
  fill();addEventListener("resize",fill);
  inView(root,function(){root.classList.add("is-in");fireLead();});
})();
</script>
</body>
</html>
