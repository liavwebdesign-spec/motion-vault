<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G202 · חותמות ומדבקות שנדבקות בטריקה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G202 · חותמות ומדבקות שנדבקות בטריקה */
.sk{max-width:920px;margin-inline:auto;display:grid;gap:20px}
.sk-photo{position:relative}
.sk-photo img{display:block;width:100%;height:auto;aspect-ratio:16 / 10;object-fit:cover;object-position:50% 62%;border-radius:20px}
/* כל חותמת נושאת את הזווית שלה ב---r. GSAP מטווין סביבה, והניקוי מחזיר אותה לכאן */
.sk-st{position:absolute;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1;transform:rotate(var(--r,0deg))}
.sk-seal{--r:-12deg;left:5%;top:7%;width:clamp(96px,14vw,148px);aspect-ratio:1;border-radius:50%;align-content:center;gap:4px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);
  box-shadow:inset 0 0 0 4px var(--accent, #4a3aff),inset 0 0 0 6px var(--accent-ink, #fff),-5px 6px 0 var(--ink, #16182b)}
.sk-seal small{font-size:clamp(12px,1.3vw,16px);font-weight:600}
.sk-seal b{font-size:clamp(28px,3.8vw,48px);font-weight:800}
.sk-stamp{--r:5deg;right:5%;bottom:9%;padding:10px 24px;border:3px solid var(--ink, #16182b);border-radius:8px;background:var(--bg, #f7f7fa);color:var(--ink, #16182b);font-size:clamp(20px,2.8vw,34px);box-shadow:-5px 6px 0 var(--accent, #4a3aff)}
.sk-tag{--r:-4deg;right:6%;top:50%;padding:8px 20px;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-size:clamp(16px,1.8vw,22px);white-space:nowrap;box-shadow:0 0 0 4px var(--bg, #f7f7fa),-5px 6px 0 4px var(--ink, #16182b)}
.sk-cap{display:grid;gap:4px}
.sk-cap b{font-size:clamp(22px,2.2vw,30px);font-weight:700}
.sk-cap span{color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.5}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><figure class="sk" style="margin-block:0">
  <div class="sk-photo">
    <img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s14/croissants.webp" alt="שני קרואסונים על מפית יוטה ולידם כוס קפה" width="1250" height="1000" loading="lazy" decoding="async">
    <span class="sk-st sk-seal"><small>בתפריט</small><b>חדש</b></span>
    <span class="sk-st sk-stamp">אפוי הבוקר</span>
    <span class="sk-st sk-tag">נשארו 6</span>
  </div>
  <figcaption class="sk-cap"><b>קרואסון חמאה</b><span>אפוי כל בוקר מחמאה צרפתית, עד שהכמות נגמרת.</span></figcaption>
</figure></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;      // בלי GSAP החותמות כבר בזווית הסופית (CSS)
  const root=document.querySelector(".sk"),photo=root.querySelector(".sk-photo"),stamps=[...root.querySelectorAll(".sk-st")];
  // בהפחתת תנועה הפונקציה לא רצה, והחותמות נשארות במקומן
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const rot=stamps.map(s=>parseFloat(getComputedStyle(s).getPropertyValue("--r"))||0);
    gsap.set(stamps,{autoAlpha:0});
    const tl=gsap.timeline({paused:true});
    stamps.forEach((s,i)=>{
      const t=.15+i*.6,r=rot[i];
      tl.set(s,{autoAlpha:1},t+.04)
        // נפילה: מתחילה לאט ופוגעת במהירות. הפגיעה נבנית משני טווינים קצרים של power, בלי ease של קפיצה
        .fromTo(s,{scale:1.9,rotation:r+16},{scale:1,rotation:r,duration:.22,ease:"power4.in"},t)
        .fromTo(s,{scaleY:.88,scaleX:1.06},{scaleY:1,scaleX:1,duration:.26,ease:"power2.out",immediateRender:false},t+.22)
        .to(photo,{y:5,duration:.05,ease:"power2.out"},t+.22)
        .to(photo,{y:0,duration:.2,ease:"power2.out"},t+.27);
    });
    const st=ScrollTrigger.create({trigger:root,start:"top 70%",once:true,onEnter:()=>tl.play()});
    return()=>{st.kill();tl.kill();gsap.set([photo,...stamps],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
