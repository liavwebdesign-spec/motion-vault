<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B19 · כרטיס וידאו שמתנגן בהובר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.center{text-align:center}

/* B19 · כרטיס וידאו שמתנגן בהובר */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap, clamp(16px, 1.6vw, 36px));padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.vcardx{position:relative;border-radius:var(--r, 14px);overflow:hidden;background:#0f1020;aspect-ratio:16/10;cursor:pointer}
.vcardx img,.vcardx video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vcardx video{opacity:0;transition:opacity .3s ease}
.vcardx.playing video{opacity:1}
.vcardx figcaption{position:absolute;inset-inline:0;bottom:0;padding:14px 16px;color:#fff;font-size:14px;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:2}
.vcardx .badge{position:absolute;top:12px;inset-inline-end:12px;z-index:2;background:rgba(255,255,255,.92);color:#111;border-radius:999px;padding:5px 12px;font-size:11px;letter-spacing:.08em}
@media(max-width:767px){.vgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stage tight"><div class="vgrid">
  <figure class="vcardx"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-a.jpg" alt=""><video preload="none" muted loop playsinline poster="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-a.jpg" data-src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-a.mp4"></video><span class="badge">וידאו</span><figcaption>פרויקט ראשון</figcaption></figure>
  <figure class="vcardx"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-b.jpg" alt=""><video preload="none" muted loop playsinline poster="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-b.jpg" data-src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-b.mp4"></video><span class="badge">וידאו</span><figcaption>פרויקט שני</figcaption></figure>
  <figure class="vcardx"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-a.jpg" alt=""><video preload="none" muted loop playsinline poster="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-a.jpg" data-src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-a.mp4"></video><span class="badge">וידאו</span><figcaption>פרויקט שלישי</figcaption></figure>
</div>
<p class="center" style="color:var(--muted);font-size:14px">בדסקטופ: הובר מנגן. במובייל: נגיעה מנגנת ועוצרת.</p></div>

<script>
(function(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hoverable=matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".vcardx").forEach(card=>{
    const v=card.querySelector("video");
    let loaded=false;
    const play=()=>{
      if(reduce)return;
      if(!loaded){v.src=v.dataset.src;loaded=true;}
      card.classList.add("playing");
      const p=v.play();if(p&&p.catch)p.catch(()=>{});
    };
    const stop=()=>{card.classList.remove("playing");v.pause();try{v.currentTime=0;}catch(e){}};
    if(hoverable){
      card.addEventListener("mouseenter",play);
      card.addEventListener("mouseleave",stop);
      card.addEventListener("focusin",play);
      card.addEventListener("focusout",stop);
    }else{
      card.addEventListener("click",()=>card.classList.contains("playing")?stop():play());
    }
  });
})();
</script>
</body>
</html>
