<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B57 · גריד Masonry עם כניסה מונפשת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* B57 · גריד Masonry עם כניסה מונפשת */
.ms{position:relative;max-width:1100px;margin-inline:auto}
.ms-item{position:absolute;top:0;right:0;width:var(--w);opacity:0;translate:0 40px;transition:transform .6s cubic-bezier(.2,.6,.2,1),opacity .6s,translate .6s cubic-bezier(.2,.6,.2,1);transition-delay:var(--d,0s)}
.ms.ready .ms-item{opacity:1;translate:0 0}
.ms-item .ph{width:100%;height:var(--h);border-radius:var(--r, 14px);font-size:22px}
.ms-item.ph-l{background:none}
@media (hover:hover) and (pointer:fine){.ms-item .ph{transition:transform .5s cubic-bezier(.2,.6,.2,1)}.ms-item:hover .ph{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.ms-item{transition:none}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage tight"><div class="ms">
  <div class="ms-item" style="--h:220px"><div class="ph ph-a"><span class="ph-l">1</span></div></div><div class="ms-item" style="--h:320px"><div class="ph ph-b"><span class="ph-l">2</span></div></div>
  <div class="ms-item" style="--h:180px"><div class="ph ph-c"><span class="ph-l">3</span></div></div><div class="ms-item" style="--h:260px"><div class="ph ph-d"><span class="ph-l">4</span></div></div>
  <div class="ms-item" style="--h:340px"><div class="ph ph-e"><span class="ph-l">5</span></div></div><div class="ms-item" style="--h:200px"><div class="ph ph-a"><span class="ph-l">6</span></div></div>
  <div class="ms-item" style="--h:280px"><div class="ph ph-b"><span class="ph-l">7</span></div></div><div class="ms-item" style="--h:240px"><div class="ph ph-c"><span class="ph-l">8</span></div></div>
  <div class="ms-item" style="--h:300px"><div class="ph ph-d"><span class="ph-l">9</span></div></div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>

<script>
(function(){
  const grid=document.querySelector(".ms"),items=[...grid.querySelectorAll(".ms-item")],GAP=16;
  function layout(){
    const W=grid.clientWidth,cols=W<560?1:W<900?2:3,w=(W-GAP*(cols-1))/cols,tops=new Array(cols).fill(0);
    items.forEach((it,i)=>{
      const c=tops.indexOf(Math.min(...tops)),h=parseFloat(getComputedStyle(it).getPropertyValue("--h"));
      it.style.setProperty("--w",w+"px");
      // RTL: העמודה 0 מימין, לכן מזיזים שמאלה (ערך שלילי)
      it.style.transform="translate("+(-(c*(w+GAP)))+"px,"+tops[c]+"px)";
      it.style.setProperty("--d",(i*70)+"ms");
      tops[c]+=h+GAP;
    });
    grid.style.height=Math.max(...tops)-GAP+"px";
  }
  layout();requestAnimationFrame(()=>grid.classList.add("ready"));
  new ResizeObserver(()=>layout()).observe(grid);
})();
</script>
</body>
</html>
