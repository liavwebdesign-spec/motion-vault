<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS48 · שני פסי מילים שמצטלבים באיקס</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS48 · שני פסי מילים שמצטלבים באיקס */
.wm{position:relative;display:grid;place-items:center;min-height:clamp(280px,32vw,400px);overflow-x:clip;overflow-y:visible;border-radius:clamp(20px,2.4vw,32px);background:var(--bg, #f7f7fa)}
.wm-x{width:100%;display:grid;place-items:center}
.wm-band{grid-area:1/1;width:130%;padding-block:clamp(14px,1.6vw,24px);overflow:hidden;box-shadow:0 12px 40px color-mix(in srgb,var(--ink, #16182b) 14%,transparent)}
.wm-a{background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);transform:rotate(-6deg)}
.wm-b{background:var(--ink, #16182b);color:var(--bg, #f7f7fa);transform:rotate(5deg)}
.wm-track{display:flex;width:max-content;animation:wm-run var(--wm-dur,30s) linear infinite}
.wm-track:dir(ltr){--wm-sign:-1}
.wm-b .wm-track{animation-direction:reverse}
.wm-set{display:flex;align-items:center;gap:clamp(24px,3vw,48px);padding-inline-end:clamp(24px,3vw,48px)}
.wm-set span{font-size:clamp(28px,4.4vw,60px);font-weight:800;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.wm-set i{width:clamp(10px,1vw,14px);aspect-ratio:1;flex:none;border-radius:50%;background:currentColor;opacity:.55}
@keyframes wm-run{to{transform:translateX(calc(var(--wm-shift,50%) * var(--wm-sign,1)))}}
.wm.is-paused .wm-track,.wm.is-off .wm-track{animation-play-state:paused}
@media(hover:hover) and (pointer:fine){.wm:hover .wm-track{animation-play-state:paused}}
.wm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wm-pp{position:absolute;inset-block-end:16px;inset-inline-end:16px;z-index:3;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border:0;border-radius:999px;background:var(--card, #fff);color:var(--ink, #16182b);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px color-mix(in srgb,var(--ink, #16182b) 6%,transparent),0 6px 20px color-mix(in srgb,var(--ink, #16182b) 5%,transparent)}
.wm-pp[hidden]{display:none}
.wm-pp svg{width:16px;height:16px;fill:currentColor}
.wm-pp .i-pl,.wm.is-paused .wm-pp .i-pa{display:none}
.wm.is-paused .wm-pp .i-pl{display:block}
.wm-pp:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.wm-track{animation:none}}
</style>
</head>
<body>

<div class="stage"><section class="wm" data-wm>
  <div class="wm-x" aria-hidden="true">
    <div class="wm-band wm-a"><div class="wm-track"><div class="wm-set"><span>גיטרה</span><i></i><span>פסנתר</span><i></i><span>תופים</span><i></i><span>שירה</span><i></i><span>כינור</span><i></i><span>בס</span><i></i><span>סקסופון</span><i></i></div></div></div>
    <div class="wm-band wm-b"><div class="wm-track"><div class="wm-set"><span>שיעור ראשון עלינו</span><i></i><span>מגיל שש ועד שמונים</span><i></i><span>הופעה בסוף כל שנה</span><i></i><span>הרכבים ולהקות</span><i></i></div></div></div>
  </div>
  <ul class="wm-sr" aria-label="מה לומדים אצלנו"><li>גיטרה</li><li>פסנתר</li><li>תופים</li><li>שירה</li><li>כינור</li><li>בס</li><li>סקסופון</li><li>שיעור ראשון עלינו</li><li>מגיל שש ועד שמונים</li><li>הופעה בסוף כל שנה</li><li>הרכבים ולהקות</li></ul>
  <button class="wm-pp" type="button" data-pp hidden><svg class="i-pa" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><svg class="i-pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg><span>עצירת התנועה</span></button>
</section></div>


<script>
(function(){
  const root=document.querySelector("[data-wm]");
  if(!root)return;
  const bands=[...root.querySelectorAll(".wm-band")];
  // כמה עותקים צריך: אחרי הזזה של קבוצה אחת, מה שנשאר חייב עדיין לכסות את כל הפס
  const build=b=>{
    const track=b.querySelector(".wm-track"),proto=track.firstElementChild;
    [...track.children].slice(1).forEach(c=>c.remove());
    const w=proto.offsetWidth;if(!w)return;
    const need=Math.ceil(b.offsetWidth/w)+1;
    for(let i=1;i<need;i++)track.appendChild(proto.cloneNode(true));
    track.style.setProperty("--wm-shift",w+"px");
    track.style.setProperty("--wm-dur",(w/70).toFixed(2)+"s");   // אותו קצב בפיקסלים בשני הפסים
  };
  const all=()=>bands.forEach(build);
  all();
  // מדידה לפני שהפונט נטען יוצאת קצרה, והלולאה קופצת בכל סיבוב
  if(document.fonts)document.fonts.ready.then(all);
  let t;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(all,200);});
  const pp=root.querySelector("button[data-pp]");
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches)pp.hidden=false;
  pp.addEventListener("click",()=>{
    const on=!root.classList.contains("is-paused");
    root.classList.toggle("is-paused",on);
    pp.querySelector("span").textContent=on?"המשך התנועה":"עצירת התנועה";
  });
  // מחוץ למסך התנועה עומדת
  if("IntersectionObserver" in window)new IntersectionObserver(es=>es.forEach(e=>root.classList.toggle("is-off",!e.isIntersecting))).observe(root);
})();
</script>
</body>
</html>
