<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS12 · גבול גרדיאנט מסתובב</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS12 · גבול גרדיאנט מסתובב */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.gb{position:relative;width:min(340px,80vw);margin-inline:auto;border-radius:18px;padding:2px;
background:conic-gradient(from var(--ang),#4a3aff,#c2255c,#e8590c,#4a3aff);
animation:rot 3.5s linear infinite}
@keyframes rot{to{--ang:360deg}}
.gb-in{background:#fff;border-radius:16px;padding:30px;text-align:center}
.gb-in h3{margin:0 0 6px}
.gb-in p{margin:0;color:var(--muted, #6a6d85);font-size:14px}
@media(prefers-reduced-motion:reduce){.gb{animation:none}}
</style>
</head>
<body>
<div class="stage tight"><div class="gb"><div class="gb-in"><h3>הכרטיס המודגש</h3><p>הגבול מסתובב סביבי בלי סוף.</p></div></div></div>


</body>
</html>
