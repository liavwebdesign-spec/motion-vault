<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G127 · מעבר לכהה בגלילה: עיגול שגדל ומחליף ערכה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.gbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding-inline:28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:500;font-size:16px;border:0;cursor:pointer;font-family:inherit}

/* G127 · מעבר לכהה בגלילה: עיגול שגדל ומחליף ערכה */
.tn2{position:relative}
.tn2-l{display:grid;place-items:center;text-align:center;padding:24px;min-height:70vh}
.tn2-l.light{background:var(--bg, #f7f7fa);color:var(--ink, #16182b)}
.tn2-l.dark{background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
.tn2-live{height:220vh}
.tn2-live .tn2-pin{position:sticky;top:0;height:100vh;overflow:hidden}
.tn2-live .tn2-l{position:absolute;inset:0;min-height:0}
.tn2-live .tn2-l.dark{will-change:clip-path}
.tn2-l h2{margin:0 0 12px;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px));max-width:20ch}
.tn2-l p{margin:0;opacity:.75;max-width:40ch;line-height:1.7}
.tn2-l .gbtn{margin-top:22px}
.tn2-l.dark .gbtn{background:var(--bg, #f7f7fa);color:var(--ink, #16182b)}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="tn2">
  <div class="tn2-pin">
    <div class="tn2-l light"><div><h2>ביום זה נראה ככה</h2><p>אתר רגיל, מסודר, כמו כולם.</p><button class="gbtn">להתחיל</button></div></div>
    <div class="tn2-l dark"><div><h2>ובלילה זה מקבל אופי</h2><p>אותו תוכן, ערכה אחרת, ותחושה אחרת לגמרי.</p><button class="gbtn">להתחיל</button></div></div>
  </div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP שני הסקשנים זה מתחת לזה
  const tn=document.querySelector(".tn2"),light=tn.querySelector(".tn2-l.light"),dark=tn.querySelector(".tn2-l.dark");
  gsap.matchMedia().add({desk:"(min-width: 768px) and (prefers-reduced-motion: no-preference)",mob:"(max-width: 767px) and (prefers-reduced-motion: no-preference)"},ctx=>{
    const at=ctx.conditions.mob?"50% 8%":"88% 12%";
    tn.classList.add("tn2-live");
    // רק השכבה שרואים נגישה לטאב ולקורא מסך. העיגול עובר את מרכז המסך ב-40% מהסקראב
    const swap=on=>{dark.inert=!on;light.inert=on;};
    swap(false);
    gsap.fromTo(dark,{clipPath:"circle(0% at "+at+")"},{clipPath:"circle(150% at "+at+")",ease:"none",
      scrollTrigger:{trigger:tn,start:"top top",end:"bottom bottom",scrub:.5},onUpdate(){swap(this.progress()>.4);}});
    return()=>{tn.classList.remove("tn2-live");dark.inert=false;light.inert=false;};
  });
})();
</script>
</body>
</html>
