<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B149 · בקבוק במרכז וטבעות תמונות שמקיפות אותו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B149 · בקבוק במרכז וטבעות תמונות שמקיפות אותו */
.ob{position:relative}
.ob-s{display:grid;gap:clamp(24px,3vw,48px);padding:clamp(24px,4vw,64px) clamp(20px,5vw,72px)}
.ob-t{display:grid;gap:16px;justify-items:start}
.ob-k{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--accent, #4a3aff)}
.ob-t h2{margin:0;font-size:clamp(34px,4.4vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.ob-t p:not(.ob-k){margin:0;max-width:44ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
.ob-cta{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-weight:700;text-decoration:none}
.ob-cta:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.ob-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:16px}
.ob-i{margin:0}
.ob-i img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:12px}
.ob.is-on .ob-s{overflow-x:clip}
.ob.is-on .ob-v{position:relative;perspective:2000px;height:clamp(460px,78vh,780px);cursor:grab;touch-action:pan-y;user-select:none}
.ob.is-on .ob-g{display:block;position:absolute;inset:0;transform-style:preserve-3d}
.ob.is-on .ob-i{position:absolute;inset:0;margin:auto;height:fit-content;width:clamp(58px,8.5vw,132px)}
.ob-t{justify-items:center;text-align:center}
.ob-t p:not(.ob-k){text-align:center}
.ob-b{display:block;width:clamp(150px,24vw,340px);height:auto;margin-inline:auto}
.ob.is-on .ob-b{position:absolute;inset:0;margin:auto}
</style>
</head>
<body>

<div class="stage"><section class="ob" data-ob><div class="ob-s">
  <div class="ob-t">
    <p class="ob-k">LUMA</p>
    <h2>ריח אחד, והעולם שסביבו</h2>
    <p>ענבר, עשן ומלח. בקבוק שנמזג ביד, במהדורה של 400.</p>
    <a class="ob-cta" href="#">להזמנה מוקדמת</a>
  </div>
  <div class="ob-v" data-view><div class="ob-g" data-scene><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s15/marble.webp" width="1600" height="1000" alt="שיש אדום כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/sea.webp" width="2560" height="1706" alt="שמש נמוכה מעל ים כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s15/hero-glass.webp" width="1100" height="1375" alt="כוס קוקטייל על שולחן שיש" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/hero.webp" width="2560" height="1707" alt="שמיים בפסים כתומים וכחולים" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/hero.webp" width="2560" height="1435" alt="אור שקיעה על קיר כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s07/ink-hands.webp" width="1000" height="1000" alt="ידיים פורשות דיו כתום" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s01/street-light.webp" width="1700" height="1138" alt="רחוב אבן בשקיעה" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/proj-b.webp" width="1200" height="1600" alt="פינה כהה עם מראה ועציץ" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s02/dial-detail.webp" width="1600" height="1067" alt="חוגת טמפרטורה לבנה בתקריב" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/hands.webp" width="2560" height="1400" alt="ידיים מורמות מול השמש" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s15/pour.webp" width="1000" height="1250" alt="ברמנית מוזגת לכוס" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/glass.webp" width="2560" height="1440" alt="בניין זכוכית כחול מלמטה" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s15/flute.webp" width="1000" height="1250" alt="גביע שמפניה" loading="lazy" decoding="async" draggable="false"></figure><figure class="ob-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s01/negatives.webp" width="1400" height="933" alt="רצועות נגטיב של פילם" loading="lazy" decoding="async" draggable="false"></figure></div></div>
</div></section></div>


<script>
(function(){
function mod(v,n){return((v%n)+n)%n;}
function ss(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function mv3(root,o){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const view=root.querySelector("[data-view]"),scene=root.querySelector("[data-scene]"),all=[...root.querySelectorAll("[data-i]")];
  const phone=innerWidth<800,items=phone&&o.phoneN?all.slice(0,o.phoneN):all;
  all.slice(items.length).forEach(e=>e.remove());
  root.classList.add("is-on");
  const a={N:items.length,items,root,view,scene,phone,p:o.p0||0,q:o.q0||0,t:0,mx:0,my:0,w:1,h:1};
  let tp=a.p,tq=a.q,vp=0,vq=0,dn=false,lx=0,ly=0,last=0,idle=0,raf=0,seen=false,mxT=0,myT=0,first=true;
  const ease=o.ease||.09;
  function sp(){const r=root.getBoundingClientRect(),d=r.height-innerHeight;return d>0?Math.min(1,Math.max(0,-r.top/d)):0;}
  function size(){a.w=view.clientWidth||1;a.h=view.clientHeight||1;if(o.size)o.size(a);kick();}
  function frame(now){raf=0;if(!seen)return;
    const dt=Math.min(.05,last?(now-last)/1000:.016);last=now;a.t+=dt;
    if(o.range){const g=o.range(a);tp=g[0]+(g[1]-g[0])*sp();if(first){a.p=tp;first=false;}}
    if(o.drag&&!dn){tp+=vp;tq+=vq;vp*=.94;vq*=.94;if(idle>0)idle-=dt;else if(o.auto)tp+=o.auto*dt;}
    if(o.qMax)tq=Math.max(-o.qMax,Math.min(o.qMax,tq));
    a.p+=(tp-a.p)*ease;a.q+=(tq-a.q)*ease;a.mx+=(mxT-a.mx)*.06;a.my+=(myT-a.my)*.06;
    if(o.frame)o.frame(a);
    for(let i=0;i<a.N;i++)o.place(items[i],i,a);
    if(o.auto||o.always||dn||Math.abs(tp-a.p)>.0004||Math.abs(vp)>.00005||Math.abs(mxT-a.mx)>.002||Math.abs(myT-a.my)>.002)raf=requestAnimationFrame(frame);}
  function kick(){if(!raf&&seen){last=0;raf=requestAnimationFrame(frame);}}
  new IntersectionObserver(([e])=>{seen=e.isIntersecting;if(seen)kick();},{rootMargin:"120px"}).observe(root);
  new ResizeObserver(size).observe(view);
  addEventListener("scroll",kick,{passive:true});
  root.addEventListener("pointermove",e=>{const r=view.getBoundingClientRect();mxT=((e.clientX-r.left)/r.width-.5)*2;myT=((e.clientY-r.top)/r.height-.5)*2;kick();});
  if(o.drag){
    view.addEventListener("pointerdown",e=>{dn=true;lx=e.clientX;ly=e.clientY;vp=vq=0;view.style.cursor="grabbing";try{view.setPointerCapture(e.pointerId);}catch(_){}kick();});
    view.addEventListener("pointermove",e=>{if(!dn)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;vp=dx*o.drag;tp+=vp;if(o.dragQ){vq=dy*o.dragQ;tq+=vq;}});
    const up=()=>{dn=false;idle=1.4;view.style.cursor="";kick();};
    view.addEventListener("pointerup",up);view.addEventListener("pointercancel",up);
  }
  size();
}
const obView=document.querySelector(".ob-g"),bottle=new Image();bottle.className="ob-b";bottle.width=600;bottle.height=750;bottle.alt="בקבוק בושם LUMA";bottle.draggable=false;const B="https://liavwebdesign-spec.github.io/motion-vault/assets/media/luma/";bottle.src=B+"t-2-06.webp";obView.prepend(bottle);
const fr=[];let shownF=6,asked=false;function loadF(){if(asked)return;asked=true;for(let q=0;q<13;q++){const im=new Image();im.decoding="async";im.src=B+"t-2-"+String(q).padStart(2,"0")+".webp";fr.push(im);}}
mv3(document.querySelector("[data-ob]"),{phoneN:10,drag:-.0042,auto:.2,
size:function(a){const nar=a.w<560,tilt=nar?.95:.56;a.R1=Math.min(a.w*.46,a.h*.72);a.R2=a.R1*(nar?.9:.74);a.ct=Math.ceil(a.N/2);a.cz=Math.sin(tilt);a.cc=Math.cos(tilt);loadF();},
frame:function(a){a.scene.style.transform="rotateX("+(-a.my*6).toFixed(2)+"deg) rotateY("+(a.mx*11).toFixed(2)+"deg)";
const f=Math.max(0,Math.min(12,Math.round(6+a.mx*6)));if(f!==shownF&&fr[f]&&fr[f].complete){shownF=f;bottle.src=fr[f].src;}},
place:function(e,i,a){const r=i&1,g=(i>>1)/a.ct*6.283+a.p*(r?-.8:1),R0=r?a.R2:a.R1,ps=r?-.3:.16,x=R0*Math.cos(g),s=R0*Math.sin(g),y=s*a.cz,z=s*a.cc,cs=Math.cos(ps),sn=Math.sin(ps);
e.style.transform="translate3d("+(x*cs-y*sn).toFixed(1)+"px,"+(x*sn+y*cs).toFixed(1)+"px,"+z.toFixed(1)+"px) rotateY("+(-Math.cos(g)*.5).toFixed(3)+"rad)";
e.style.opacity=(.5+.5*ss(-.6,.4,Math.sin(g))).toFixed(3);}});
})();
</script>
</body>
</html>
