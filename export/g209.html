<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G209 · משפט שנבנה מתגיות גלולה שנכנסות אחת אחרי השנייה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G209 · משפט שנבנה מתגיות גלולה שנכנסות אחת אחרי השנייה */
.pc{max-width:1120px;margin-inline:auto;display:grid;gap:32px}
.pc-s{margin:0;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 14px;font-size:clamp(28px,4.6vw,68px);font-weight:600;line-height:1.1;letter-spacing:-.01em}
.pc-w{padding-block:.24em}
.pc-c{display:flex;flex-direction:column;align-items:center;gap:8px}
.pc-p{display:block;padding:.24em .62em;border-radius:999px;white-space:nowrap}
.pc-c small{font-size:max(.2em,14px);font-weight:500;line-height:1.2;color:var(--muted, #6a6d85);white-space:nowrap}
.pc-1 .pc-p{background:var(--accent, #4a3aff);color:var(--accent-ink, #fff)}
.pc-2 .pc-p{background:color-mix(in oklab,var(--accent, #4a3aff) 18%,var(--card, #fff));color:var(--ink, #16182b)}
.pc-3 .pc-p{background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
.pc-4 .pc-p{background:color-mix(in oklab,var(--ink, #16182b) 9%,var(--card, #fff));color:var(--ink, #16182b)}
.pc-5 .pc-p{background:color-mix(in oklab,var(--accent, #4a3aff) 42%,var(--card, #fff));color:var(--ink, #16182b)}
.pc-a{margin:0;max-width:40ch;color:var(--muted, #6a6d85);font-style:italic;font-size:clamp(20px,1.9vw,30px);line-height:1.4}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><div class="pc">
  <p class="pc-s">
    <span class="pc-w">אנחנו</span>
    <span class="pc-c pc-1"><span class="pc-p">מתכננים</span><small>שבועיים</small></span>
    <span class="pc-c pc-2"><span class="pc-p">מייצרים</span><small>שישה שבועות</small></span>
    <span class="pc-c pc-3"><span class="pc-p">ומתקינים</span><small>שלושה ימי עבודה</small></span>
    <span class="pc-w">מטבחים</span>
    <span class="pc-c pc-4"><span class="pc-p">בנגרייה אחת</span><small>בחדרה, מאז 2009</small></span>
    <span class="pc-c pc-5"><span class="pc-p">ובמחיר סגור</span><small>בלי תוספות</small></span>
  </p>
  <p class="pc-a">וכן, גם את פירוק המטבח הישן אנחנו לוקחים.</p>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP המשפט כבר מוצג עם כל הגלולות
  const root=document.querySelector(".pc"),items=[...root.querySelectorAll(".pc-w,.pc-c")],aside=root.querySelector(".pc-a");
  // בהפחתת תנועה הפונקציה לא רצה, והמשפט נשאר במצב הסופי
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const tl=gsap.timeline({paused:true});
    items.forEach((it,i)=>{
      const chip=it.classList.contains("pc-c"),body=chip?it.querySelector(".pc-p"):it;
      // הגלולה קופצת פנימה ב-expo.out, ללא overshoot. המילה הרגילה רק עולה ומתבהרת
      tl.fromTo(body,chip?{opacity:0,scale:.55,y:26,transformOrigin:"50% 60%"}:{opacity:0,y:14},
        chip?{opacity:1,scale:1,y:0,duration:.75,ease:"expo.out"}:{opacity:1,y:0,duration:.5,ease:"power2.out"},i*.2);
      if(chip)tl.fromTo(it.querySelector("small"),{opacity:0,y:8},{opacity:1,y:0,duration:.5,ease:"power2.out"},i*.2+.4);
    });
    tl.fromTo(aside,{opacity:0,y:14},{opacity:1,y:0,duration:.7,ease:"power2.out"},">-.1");
    const st=ScrollTrigger.create({trigger:root,start:"top 80%",once:true,onEnter:()=>tl.play()});
    const clear=[...items,aside,...root.querySelectorAll(".pc-p,.pc-c small")];
    return()=>{st.kill();tl.kill();gsap.set(clear,{clearProps:"opacity,transform"});};
  });
})();
</script>
</body>
</html>
