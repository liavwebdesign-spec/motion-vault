<html lang="he" dir="rtl">
<head>

<title>B91 · סבך עקומות זוהרות שנשרטט ונמוג</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B91 · סבך עקומות זוהרות שנשרטט ונמוג */
.lj{display:grid;place-items:center;padding-block:clamp(24px,4vw,64px)}
.lj-box{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center;gap:clamp(24px,4vw,56px);width:min(1100px,100%);padding:clamp(32px,5vw,72px);border-radius:32px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);overflow:hidden}
.lj-in{display:grid;gap:20px;justify-items:start}
.lj-in h2{margin:0;font-size:clamp(28px,3.4vw,48px);line-height:1.14;text-wrap:balance}
.lj-in p{margin:0;max-width:40ch;color:color-mix(in srgb,var(--bg, #f7f7fa) 78%,transparent);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.lj-cta{display:inline-flex;align-items:center;padding:14px 24px;border-radius:99px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.lj-cta:hover{transform:translateY(-2px)}}
.lj-cta:focus-visible{outline:2px solid var(--bg, #f7f7fa);outline-offset:4px}
.lj-art{position:relative;aspect-ratio:1200 / 520;min-width:0}
.lj-svg,.lj-cv{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s cubic-bezier(.2,.6,.2,1)}
.lj-svg{overflow:visible;fill:none}
.lj-svg path{vector-effect:non-scaling-stroke;stroke-width:1.2}
.lj-p0{stroke:var(--accent, #4a3aff);opacity:.6}
.lj-p1{stroke:color-mix(in srgb,var(--accent, #4a3aff) 55%,var(--bg, #f7f7fa));opacity:.42}
.lj-cv{opacity:0}
.lj-art.is-on .lj-cv{opacity:1}
.lj-art.is-on .lj-svg{opacity:0}
@media(max-width:767px){.lj-box{grid-template-columns:minmax(0,1fr)}.lj-art{order:-1}}
@media(prefers-reduced-motion:reduce){.lj-svg,.lj-cv{transition:none}}
</style>
</head>

<script>
(function(){
  const root=document.querySelector(".lj"),art=root.querySelector(".lj-art"),cv=art.querySelector(".lj-cv"),ctx=cv.getContext("2d");
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  // אותן עקומות כמו ב-SVG הסטטי: [a, b, זווית התחלה]
  const SET=[[3,2,.2],[5,4,1.1],[4,3,2.0],[7,5,.7],[5,3,2.7],[7,4,1.6],[9,8,.4],[3,4,2.3]];
  const CYCLE=18,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sm=x=>x*x*(3-2*x);

  // הצבע נקרא מהטוקן בזמן ריצה
  const probe=document.createElement("canvas").getContext("2d");
  function accRGB(){
    probe.fillStyle="#000";probe.fillStyle=getComputedStyle(root).getPropertyValue("--accent").trim()||"#88f";const h=probe.fillStyle;
    if(h.charAt(0)==="#")return[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)).join(",");
    return h.slice(h.indexOf("(")+1,h.lastIndexOf(")")).split(",").slice(0,3).map(parseFloat).join(",");
  }
  // t: זמן ההיסחפות. cyc: שנייה בתוך המחזור (שרטוט, החזקה, דעיכה)
  function paint(t,cyc){
    ctx.clearRect(0,0,1200,520);   // המטריצה כבר מכפילה ב-W/1200, לכן מנקים במרחב 1200 על 520
    ctx.globalCompositeOperation="lighter";ctx.lineJoin="round";ctx.lineWidth=1.3*1200/W;
    const fade=cyc>14.5?clamp(1-(cyc-14.5)/3.2,0,1):1;

      const a=SET[i][0],b=SET[i][1],d=SET[i][2]+t*.16*(i%2?1:-1)*(.7+i*.08);
