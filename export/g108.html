<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G108 · שורות כותרת שנפתחות ומגלות תמונה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}

/* G108 · שורות כותרת שנפתחות ומגלות תמונה */
.sp2{position:relative;height:220vh}
.sp2-pin{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
.sp2-stack{display:grid;justify-items:center;text-align:center;width:100%}
.sp2-l{font-size:clamp(34px,7vw,110px);font-weight:900;line-height:1;margin:0;will-change:transform}
.sp2-img{width:min(1100px,94vw);height:min(46vh,470px);border-radius:var(--r, 14px);overflow:hidden;transform:scaleY(0);transform-origin:50% 50%;will-change:transform}
.sp2-img .ph{width:100%;height:100%;border-radius:0;font-size:0}
.sp2-cap{position:absolute;bottom:4vh;inset-inline:0;text-align:center;color:var(--muted, #6a6d85);opacity:0}
@media(max-width:767px){.sp2-img{height:34vh}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="sp2">
  <div class="sp2-pin"><div class="sp2-stack">
    <h2 class="sp2-l">בונים מקומות</h2>
    <div class="sp2-img"><div class="ph ph-c"></div></div>
    <h2 class="sp2-l">שאנשים חוזרים אליהם</h2>
  </div><p class="sp2-cap">סטודיו לאדריכלות, מאז 2011</p></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const img=document.querySelector(".sp2-img"),lines=gsap.utils.toArray(".sp2-l");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(img,{scaleY:1});gsap.set(".sp2-cap",{opacity:1});return;}
  const mob=matchMedia("(max-width:767px)").matches;
  // התמונה תופסת מקום בגריד גם כשהיא scaleY(0), ולכן השורות מתחילות צמודות דרך y ונפתחות ל-0
  gsap.set(lines[0],{y:()=>img.offsetHeight/2});gsap.set(lines[1],{y:()=>-img.offsetHeight/2});
  gsap.timeline({scrollTrigger:{trigger:".sp2",start:"top top",end:"bottom bottom",scrub:.6,invalidateOnRefresh:true}})
    .to(lines,{y:0,duration:1,ease:"power3.inOut"},0)
    .fromTo(img,{scaleY:0},{scaleY:1,duration:1,ease:"power3.inOut"},0)
    .to(lines,{scale:mob?.92:.86,duration:.4,ease:"power2.out"},.7)
    .to(".sp2-cap",{opacity:1,duration:.3},.8);
})();
</script>
</body>
</html>
