<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G147 · סרט צילום שמתגלגל בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* G147 · סרט צילום שמתגלגל בגלילה */
.fl{position:relative;height:320vh}
.fl-pin{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden;background:#111}
.fl-strip{width:min(420px,84vw);background:#1a1a1a;padding:0 34px;position:relative;will-change:transform}
.fl-strip::before,.fl-strip::after{content:"";position:absolute;top:0;bottom:0;width:18px;background:repeating-linear-gradient(180deg,transparent 0 10px,#444 10px 26px,transparent 26px 40px)}
.fl-strip::before{left:8px}.fl-strip::after{right:8px}
.fl-f{aspect-ratio:3/2;margin:14px 0;border-radius:4px;overflow:hidden;position:relative}
.fl-f .ph{position:absolute;inset:0;border-radius:0;font-size:18px}
.fl-f span{position:absolute;bottom:8px;inset-inline-start:10px;font-size:11px;color:#fff;opacity:.7;letter-spacing:.1em}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="fl">
  <div class="fl-pin"><div class="fl-strip">
    <div class="fl-f"><div class="ph ph-a"><span class="ph-l">1</span></div><span>FRAME 01</span></div><div class="fl-f"><div class="ph ph-b"><span class="ph-l">2</span></div><span>FRAME 02</span></div>
    <div class="fl-f"><div class="ph ph-c"><span class="ph-l">3</span></div><span>FRAME 03</span></div><div class="fl-f"><div class="ph ph-d"><span class="ph-l">4</span></div><span>FRAME 04</span></div>
    <div class="fl-f"><div class="ph ph-e"><span class="ph-l">5</span></div><span>FRAME 05</span></div><div class="fl-f"><div class="ph ph-a"><span class="ph-l">6</span></div><span>FRAME 06</span></div>
  </div></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const strip=document.querySelector(".fl-strip"),frames=gsap.utils.toArray(".fl-f"),pin=document.querySelector(".fl-pin");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const yFor=i=>pin.clientHeight/2-(frames[i].offsetTop+frames[i].offsetHeight/2);   // הפריים i במרכז המסך
  const tl=gsap.timeline({scrollTrigger:{trigger:".fl",start:"top top",end:"bottom bottom",scrub:.5,invalidateOnRefresh:true}});
  tl.set(strip,{y:()=>yFor(0)});
  for(let i=1;i<frames.length;i++)tl.to(strip,{y:()=>yFor(i),duration:1,ease:"power2.inOut"},i-1+.25);   // שהייה קצרה על כל פריים
})();
</script>
</body>
</html>
