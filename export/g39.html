<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G39 · טקסט מתעקל על קשת בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#b9bcd0;font-size:14px}

/* ===== הרכיב ===== */
/* G39 · טקסט מתעקל על קשת בגלילה */
html,body{overflow-x:clip}
.arc-t{height:100vh;display:grid;place-items:center;background:#fff;border-block:1px solid var(--line, #e4e4ee);overflow:hidden}
.arc-line{font-size:clamp(30px,5.2vw,86px);font-weight:800;white-space:nowrap;direction:rtl;will-change:transform}
.arc-line .ch{display:inline-block;transform-origin:50% 620px;will-change:transform}
.arc-hint{position:absolute;bottom:24px;inset-inline:0;text-align:center;font-size:13px;color:var(--muted, #6a6d85)}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="arc-t">
  <div class="arc-line" aria-label="עיצוב שנראה טוב גם כשעוצמים עיניים"><span aria-hidden="true">עיצוב שנראה טוב גם כשעוצמים עיניים</span></div>
  <p class="arc-hint">גלול והשורה מתעקלת</p>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const line=document.querySelector(".arc-line"),src=line.querySelector("span");
  // פיצול ידני לתווים: שומר על סדר RTL ועל רווחים, בלי להישען על SplitText
  const text=src.textContent;
  src.textContent="";
  const chars=[...text].map(c=>{
    const s=document.createElement("span");
    s.className="ch";
    s.textContent=c===" "?"\u00a0":c;
    src.appendChild(s);
    return s;
  });
  const mid=(chars.length-1)/2;
  const MAX=1.55; // מעלות לכל תו בקצה הקשת
  gsap.set(chars,{rotation:0});
  gsap.to(chars,{
    rotation:i=>(i-mid)*MAX,
    y:i=>Math.abs(i-mid)*1.1,
    ease:"none",
    scrollTrigger:{trigger:".arc-t",start:"top bottom",end:"bottom top",scrub:1}
  });
})();
</script>
</body>
</html>
