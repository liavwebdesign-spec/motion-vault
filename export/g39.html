<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G39 · טקסט מתעקל על קשת בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G39 · טקסט מתעקל על קשת בגלילה */
html,body{overflow-x:clip}
.arc-t{position:relative;height:100vh;display:grid;place-items:center;background:var(--bg, #f7f7fa);border-block:1px solid var(--line, #e4e4ee);overflow:hidden}
.arc-line{position:relative;margin:0;font-size:clamp(22px,5.2vw,86px);font-weight:800;white-space:nowrap;direction:rtl}
.arc-line .ch{display:inline-block;will-change:transform}
.arc-hint{position:absolute;bottom:24px;inset-inline:0;margin:0;text-align:center;font-size:13px;color:var(--muted, #6a6d85)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="arc-t">
  <p class="arc-line"><span class="sr-only">עיצוב שנראה טוב גם כשעוצמים עיניים</span><span aria-hidden="true">עיצוב שנראה טוב גם כשעוצמים עיניים</span></p>
  <p class="arc-hint">גלול והשורה מתעקלת</p>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;
  const line=document.querySelector(".arc-line"),src=line.querySelector("span[aria-hidden]");
  const text=src.textContent;
  const ANG=25*Math.PI/180;   // הזווית של התו הקיצוני בסוף הקשת
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    // פיצול ידני לתווים: שומר על סדר RTL ועל רווחים, בלי להישען על SplitText
    src.textContent="";
    const chars=[...text].map(c=>{
      const s=document.createElement("span");
      s.className="ch";
      s.textContent=c===" "?"\u00a0":c;
      src.appendChild(s);
      return s;
    });
    // R: רדיוס הקשת. D: המרחק האופקי של מרכז כל תו ממרכז השורה, נמדד מהפריסה ולא מסדר ה-DOM,
    // ולכן אותו קוד עובד בעברית ובאנגלית בלי להפוך סימן.
    let R=1,D=[];
    const measure=()=>{
      const half=line.offsetWidth/2;
      R=half/ANG;
      D=chars.map(c=>c.offsetLeft+c.offsetWidth/2-half);
      gsap.set(chars,{transformOrigin:"50% "+R+"px"});
    };
    measure();
    gsap.fromTo(chars,{rotation:0,x:0},{
      rotation:i=>D[i]/R*180/Math.PI,
      x:i=>-D[i],
      ease:"none",
      scrollTrigger:{trigger:".arc-t",start:"top bottom",end:"bottom top",scrub:.6,invalidateOnRefresh:true,onRefreshInit:measure}
    });
    return ()=>{src.textContent=text;};
  });
})();
</script>
</body>
</html>
