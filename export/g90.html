<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G90 · שכבות מוצר שמתפרקות ומתחברות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* G90 · שכבות מוצר שמתפרקות ומתחברות */
.ex{position:relative;height:260vh}
.ex-pin{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:var(--gap, clamp(16px, 1.6vw, 36px));padding-inline:var(--gutter, clamp(24px, 5vw, 96px));overflow:hidden}
.ex-stage{perspective:1400px;display:grid;place-items:center;height:70vh}
.ex-stack{position:relative;width:min(34vw,380px);aspect-ratio:1;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-32deg)}
.ex-layer{position:absolute;inset:0;border-radius:22px;transform-style:preserve-3d;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 30px 60px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.35)}
.ex-copy h2{margin:0 0 12px;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px))}
.ex-copy p{margin:0 0 22px;color:var(--muted, #6a6d85)}
.ex-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ex-list li{display:flex;gap:12px;align-items:baseline;opacity:.3;transition:opacity .35s}
.ex-list li.on{opacity:1}
.ex-list b{font-size:12px;color:var(--accent, #4a3aff);letter-spacing:.12em;min-width:2.4em}
@media(max-width:767px){.ex{height:200vh}.ex-pin{grid-template-columns:1fr;align-content:center;gap:10px}.ex-stage{height:44vh}.ex-stack{width:56vw;transform:rotateX(52deg) rotateZ(-28deg)}.ex-copy h2{font-size:clamp(22px,6vw,32px)}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="ex">
  <div class="ex-pin">
    <div class="ex-stage"><div class="ex-stack">
      <div class="ex-layer ph-a" style="background:linear-gradient(160deg,#3b5bdb,#748ffc)"><span class="ph-l">בסיס</span></div>
      <div class="ex-layer" style="background:linear-gradient(160deg,#0b7285,#3bc9db)">מנוע</div>
      <div class="ex-layer" style="background:linear-gradient(160deg,#5f3dc4,#9775fa)">ממשק</div>
      <div class="ex-layer" style="background:linear-gradient(160deg,#e8590c,#ffa94d)">מעטפת</div>
    </div></div>
    <div class="ex-copy"><h2>מה יש בפנים</h2><p>ארבע שכבות שעובדות ביחד. גלול כדי לפרק.</p>
      <ul class="ex-list"><li><b>01</b>בסיס נתונים מאובטח, גיבוי יומי</li><li><b>02</b>מנוע אוטומציות שרץ ברקע</li><li><b>03</b>ממשק בעברית, לכל מכשיר</li><li><b>04</b>מעטפת שירות ותמיכה</li></ul></div>
  </div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const layers=gsap.utils.toArray(".ex-layer"),items=gsap.utils.toArray(".ex-list li");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){items.forEach(l=>l.classList.add("on"));layers.forEach((l,i)=>gsap.set(l,{z:i*40}));return;}
  const GAP=matchMedia("(max-width:767px)").matches?70:130;
  const tl=gsap.timeline({scrollTrigger:{trigger:".ex",start:"top top",end:"bottom bottom",scrub:.5}});
  layers.forEach((l,i)=>{
    tl.to(l,{z:i*GAP,duration:1,ease:"power2.inOut",onStart:()=>items[i].classList.add("on"),onReverseComplete:()=>items[i].classList.remove("on")},i*.25);
  });
  tl.to({},{duration:.6});                                    // רגע של שהייה במצב המפורק
  tl.to(layers,{z:(i)=>i*10,duration:1.2,ease:"power2.inOut",stagger:{each:.08,from:"end"}});   // מתחבר חזרה מלמעלה למטה
})();
</script>
</body>
</html>
