<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C25 · תמונה ראשית ופס ממוזערות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-f{background:linear-gradient(160deg,#c92a2a,#ff8787)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* C25 · תמונה ראשית ופס ממוזערות */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c25{max-width:960px;margin-inline:auto}
.c25 .main{aspect-ratio:16/9;border-radius:var(--r, 14px);position:relative}
.c25 .cap{position:absolute;bottom:16px;inset-inline-start:16px}
.c25 .thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1cqi,12px);margin-top:clamp(8px,1.2cqi,16px)}
.c25 .thumbs button{aspect-ratio:4/3;border:0;padding:0;cursor:pointer;border-radius:10px;opacity:.5;font:inherit;transition:opacity .25s cubic-bezier(.2,.6,.2,1)}
.c25 .thumbs button:hover{opacity:.85}
.c25 .thumbs button[aria-pressed="true"]{opacity:1;outline:2px solid var(--ink, #16182b);outline-offset:3px}
.c25 .thumbs button:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
</style>
</head>
<body>

<div class="cwrap cstage"><div class="c25">
  <div class="main ph ph-a" role="img" aria-label="תמונה 1 מתוך 6"><span class="cap ph-l"><bdi dir="ltr">1 / 6</bdi></span></div>
  <div class="thumbs" role="group" aria-label="בחירת תמונה">
    <button type="button" class="ph ph-a" data-ph="ph-a" aria-pressed="true" aria-label="תמונה 1"></button>
    <button type="button" class="ph ph-b" data-ph="ph-b" aria-pressed="false" aria-label="תמונה 2"></button>
    <button type="button" class="ph ph-c" data-ph="ph-c" aria-pressed="false" aria-label="תמונה 3"></button>
    <button type="button" class="ph ph-d" data-ph="ph-d" aria-pressed="false" aria-label="תמונה 4"></button>
    <button type="button" class="ph ph-e" data-ph="ph-e" aria-pressed="false" aria-label="תמונה 5"></button>
    <button type="button" class="ph ph-f" data-ph="ph-f" aria-pressed="false" aria-label="תמונה 6"></button>
  </div>
</div></div>


<script>
document.querySelectorAll(".c25").forEach(function(g){
  var main=g.querySelector(".main"),cap=main.querySelector(".cap bdi"),bs=[].slice.call(g.querySelectorAll(".thumbs button"));
  bs.forEach(function(b,i){b.addEventListener("click",function(){
    bs.forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
    main.className="main ph "+b.dataset.ph;
    main.setAttribute("aria-label","תמונה "+(i+1)+" מתוך "+bs.length);
    cap.textContent=(i+1)+" / "+bs.length;
  })});
});
</script>
</body>
</html>
