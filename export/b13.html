<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B13 · תכשיטי צורה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* B13 · תכשיטי צורה */
.jw{position:relative;padding:80px var(--gutter, clamp(24px, 5vw, 96px));text-align:center;overflow:hidden}
.jw .j{position:absolute;z-index:0}
.j1{width:46px;height:46px;border-radius:50%;background:#ffd43b;top:18%;inset-inline-start:16%}
.j2{width:34px;height:34px;background:#63e6be;transform:rotate(45deg);bottom:20%;inset-inline-end:18%}
.j3{width:0;height:0;border-inline:20px solid transparent;border-bottom:34px solid #ff8787;top:30%;inset-inline-end:30%}
.jw h2{position:relative;z-index:1;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px))}
</style>
</head>
<body>
<div class="jw"><span class="j j1"></span><span class="j j2"></span><span class="j j3"></span><h2>הכותרת במרכז, התכשיטים מסביב</h2></div>


</body>
</html>
