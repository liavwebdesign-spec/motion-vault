<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G30 · סקשנים ננעלים עם Snap</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* G30 · סקשנים ננעלים עם Snap */
.snapw{overflow:hidden;transition:all 0s !important}
/* בלי GSAP ובהפחתת תנועה הפרקים נערמים זה מתחת לזה ונקראים בגלילה רגילה.
   הרצועה האופקית נבנית רק כשהסקריפט רץ ומוסיף .is-live */
.snapc{display:flex;flex-direction:column}
.snapp{width:100%;min-height:70vh;display:flex;align-items:center;justify-content:center;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px));font-weight:700;color:#fff}
.snapw.is-live .snapc{flex-direction:row;width:300vw}
.snapw.is-live .snapp{width:100vw;height:100vh;min-height:0;flex:none}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="snapw"><div class="snapc">
<div class="snapp ph-a ph"><span class="ph-l">פרק ראשון</span></div>
<div class="snapp ph-b ph"><span class="ph-l">פרק שני</span></div>
<div class="snapp ph-c ph"><span class="ph-l">פרק שלישי</span></div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;
  const wrap=document.querySelector(".snapw"),track=wrap.querySelector(".snapc");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    wrap.classList.add("is-live");
    // עמוד עברי: הרצועה מתחילה מהקצה הימני והגלישה יוצאת שמאלה, ולכן x חיובי.
    // המצלמה נעה שמאלה בתוך התוכן, בדיוק ככיוון הקריאה. באתר אנגלי מוסיפים מינוס.
    gsap.to(track,{x:()=>track.scrollWidth-innerWidth,ease:"none",
      // שני מסכים של גלילה לשני מעברים, בכל גודל מסך (התקציב: עד 2.5 מסכים לסצנה מוצמדת)
      scrollTrigger:{trigger:wrap,start:"top top",end:()=>"+="+Math.round(innerHeight*2),scrub:.6,pin:true,anticipatePin:1,
        invalidateOnRefresh:true,snap:{snapTo:1/2,duration:.4,ease:"power2.inOut"}}});
    return ()=>wrap.classList.remove("is-live");
  });
})();
</script>
</body>
</html>
