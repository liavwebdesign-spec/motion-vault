<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G235 · כותרת עם אווטארים שמתחלפים ומילה שמתגלגלת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G235 · כותרת עם אווטארים שמתחלפים ומילה שמתגלגלת */
.ga{max-width:1100px;margin-inline:auto;display:grid;gap:32px;justify-items:start}
.ga .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ga-h{margin:0;font-size:clamp(36px,6.6vw,96px);font-weight:700;line-height:1.3;letter-spacing:-.015em;text-wrap:balance}
.ga-av{display:inline-flex;vertical-align:middle;margin-inline:.12em}
.ga-s{--s:.9em;position:relative;flex:none;width:var(--s);height:var(--s);margin-inline-start:-.3em;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--accent, #4a3aff) 16%,var(--card, #fff));box-shadow:0 0 0 .07em var(--bg, #f7f7fa)}
.ga-s:first-child{margin-inline-start:0}
.ga-s img{position:absolute;display:block;max-width:none;height:calc(var(--s) * var(--z));width:auto;left:calc(var(--s) * (.5 - var(--x) * var(--z) * var(--ar)));top:calc(var(--s) * (.5 - var(--y) * var(--z)))}
.ga-roll{display:inline-grid;vertical-align:bottom;overflow:hidden;height:1.3em;line-height:1.3}
.ga-roll>span{grid-area:1 / 1;justify-self:start;white-space:nowrap}
.ga-roll>span+span{opacity:0}
.ga-body{display:flex;flex-wrap:wrap;align-items:center;gap:20px 32px;max-width:640px}
.ga-body p{margin:0;flex:1 1 320px;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.ga-cta{display:inline-flex;align-items:center;min-height:48px;padding:0 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="ga">
  <h2 class="ga-h"><span class="sr-only">אנחנו בונים אתרים למסעדות</span><span class="ga-vis" aria-hidden="true">אנחנו <span class="ga-av"><span class="ga-s"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s02/hero-panel.webp" alt="" width="2200" height="1468" loading="lazy" decoding="async" style="--x:.3;--y:.45;--z:3.2;--ar:1.499"></span><span class="ga-s"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s09/step-2-welcome.webp" alt="" width="1500" height="1200" loading="lazy" decoding="async" style="--x:.65;--y:.27;--z:2.8;--ar:1.25"></span><span class="ga-s"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s12/hero-window.webp" alt="" width="1100" height="1100" loading="lazy" decoding="async" style="--x:.48;--y:.33;--z:2.5;--ar:1"></span><span class="ga-s"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/hug.webp" alt="" width="1500" height="1100" loading="lazy" decoding="async" style="--x:.35;--y:.5;--z:2.8;--ar:1.364"></span></span> בונים אתרים <span class="ga-roll"><span>למסעדות</span><span>למרפאות</span><span>לחנויות</span><span>לסטודיואים</span></span></span></h2>
  <div class="ga-body">
    <p>צוות של ארבעה אנשים שעובד ישירות מול בעלי העסק, בלי מתווכים ובלי חבילות מוכנות.</p>
    <a class="ga-cta" href="#">לשיחת היכרות</a>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
(function(){
  if(typeof gsap==="undefined"||typeof IntersectionObserver==="undefined")return;      // בלי GSAP מוצגות ארבע פנים והמילה הראשונה
  const root=document.querySelector(".ga"),slots=[...root.querySelectorAll(".ga-s")],words=[...root.querySelectorAll(".ga-roll>span")];
  const IMG="https://liavwebdesign-spec.github.io/motion-vault/assets/media/";
  // [תמונה, רוחב, גובה, x, y, z]: x ו-y הם מיקום הפנים כשבר מהתמונה, z ההגדלה. ארבעת הראשונים הם מה שבמארקאפ
  const POOL=[["real/s02/hero-panel",2200,1468,.3,.45,3.2],["real/s09/step-2-welcome",1500,1200,.65,.27,2.8],["real/s12/hero-window",1100,1100,.48,.33,2.5],["real/s06/hug",1500,1100,.35,.5,2.8],
    ["real/s12/hero-window",1100,1100,.2,.37,2.5],["real/s09/hero-corridor",2000,1666,.26,.22,3],["real/s09/step-1-booking",1500,1200,.22,.28,2.8],["real/s12/hero-window",1100,1100,.86,.32,2.5]];
  // בהפחתת תנועה הפונקציה לא רצה, והחבילה והמילה נשארות במצב הראשון
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const init=slots.map(s=>s.innerHTML);
    let t=0,w=0,loop=null,warm=false,intro=false;
    const mk=p=>{
      const i=document.createElement("img");
      i.src=IMG+p[0]+".webp";i.alt="";i.width=p[1];i.height=p[2];i.decoding="async";
      i.style.cssText="--x:"+p[3]+";--y:"+p[4]+";--z:"+p[5]+";--ar:"+(p[1]/p[2]).toFixed(3);return i;
    };
    const step=()=>{
      t++;
      slots.forEach((s,i)=>{
        const old=s.querySelector("img:last-child"),nu=mk(POOL[(i+t)%POOL.length]),d=i*.12;
        s.appendChild(nu);
        gsap.fromTo(nu,{yPercent:100},{yPercent:0,duration:.7,ease:"power3.inOut",delay:d});
        gsap.to(old,{yPercent:-100,duration:.7,ease:"power3.inOut",delay:d,onComplete:()=>old.remove()});
      });
      const cur=words[w];w=(w+1)%words.length;
      gsap.fromTo(words[w],{yPercent:110},{yPercent:0,duration:.7,ease:"power3.inOut",delay:.1});
      gsap.to(cur,{yPercent:-110,duration:.7,ease:"power3.inOut",delay:.1});
    };
    const tick=()=>{step();loop=gsap.delayedCall(2.8,tick);};
    gsap.set(words.slice(1),{yPercent:110,opacity:1});
    gsap.set(slots,{scale:.5,opacity:0});
    // הסבב רץ רק כשהכותרת על המסך: IntersectionObserver במקום ScrollTrigger
    const io=new IntersectionObserver(es=>{es.forEach(e=>{
      if(loop){loop.kill();loop=null;}
      if(!e.isIntersecting)return;
      if(!warm){warm=true;POOL.forEach(p=>{new Image().src=IMG+p[0]+".webp";});}
      if(!intro){intro=true;gsap.to(slots,{scale:1,opacity:1,duration:.6,ease:"power3.out",stagger:.08});}
      loop=gsap.delayedCall(1.2,tick);
    });},{threshold:.2});
    io.observe(root);
    return()=>{
      io.disconnect();if(loop)loop.kill();
      gsap.killTweensOf(slots.concat(words));slots.forEach(s=>gsap.killTweensOf(s.querySelectorAll("img")));
      slots.forEach((s,i)=>{s.innerHTML=init[i];});gsap.set(slots.concat(words),{clearProps:"all"});
    };
  });
})();
</script>
</body>
</html>
