<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS03 · מילוי כפתור מהצד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.center{text-align:center}

/* CSS03 · מילוי כפתור מהצד */
.fill-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;
min-height:52px;padding-inline:34px;border-radius:999px;border:2px solid var(--ink, #16182b);background:transparent;
color:var(--ink, #16182b);font-weight:600;font-size:16px;cursor:pointer;font-family:inherit;z-index:0;transition:color .35s}
.fill-btn::before{content:"";position:absolute;inset:0;background:var(--ink, #16182b);z-index:-1;
transform:translateX(101%);transition:transform .35s cubic-bezier(.2,.6,.2,1)}
.fill-btn:hover{color:#fff}
.fill-btn:hover::before{transform:translateX(0)}
</style>
</head>
<body>
<div class="stage tight center"><button class="fill-btn">עבור עליי עם העכבר</button></div>


</body>
</html>
