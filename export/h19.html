<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>H19 · הירו לפני ואחרי עם ידית גרירה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* H19 · הירו לפני ואחרי עם ידית גרירה */
/* ---- demo frame and top row (scaffolding, not part of the hero) ---- */
.hf{position:relative;margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--bg, #f7f7fa);isolation:isolate}
.hf-top{position:absolute;inset-inline:0;top:0;z-index:6;display:flex;align-items:center;gap:24px;padding:20px 28px;font-size:15px;font-weight:500}
.hf-top b{font-size:18px;font-weight:800}
.hf-top nav{display:flex;gap:18px;margin-inline-start:auto;opacity:.8}
@media (max-width:760px){.hf-top nav{display:none}}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:12px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);text-decoration:none;
  font-size:16px;font-weight:600;white-space:nowrap;transition:transform .18s cubic-bezier(.2,.6,.2,1),box-shadow .3s cubic-bezier(.2,.6,.2,1)}
.hbtn.ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
@media (hover:hover) and (pointer:fine){.hbtn:hover{transform:translateY(-2px)}}
.hkick{font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.75}
.hlead{margin:0;font-size:clamp(17px,1.2vw,20px);line-height:1.55;opacity:.82}
.hmicro{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;opacity:.7}
.hcta{display:flex;flex-wrap:wrap;gap:12px}

/* the resting state is the visible one. opacity:1 on .rv also keeps the no-JS look identical to the look after the entrance */
.rv{opacity:1;transition:opacity .5s cubic-bezier(.2,.6,.2,1),transform .5s cubic-bezier(.2,.6,.2,1)}
.open-anim .rv{opacity:0;transform:translateY(18px);animation:rv-fs 0s 2.5s forwards}
/* --t0: on a page with a header, 0.2s so the header comes down first (motion.md 2) */
.is-in .rv{opacity:1;transform:none;transition-duration:.7s;transition-delay:calc(var(--t0,0s) + var(--i,0) * 90ms)}
.rv-on .rv{animation:none}
@keyframes rv-fs{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv,.is-in .rv{transition-duration:.01ms!important;transition-delay:0s!important}
  .hbtn{transition-duration:.01ms!important}.hbtn:hover{transform:none!important}}
.h19h{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;min-height:min(84vh,760px);padding:88px 28px 28px;background:color-mix(in srgb,var(--ink, #16182b) 4%,var(--bg, #f7f7fa))}
.h19-txt{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:24px;padding-block:24px 40px}
.h19h h3{margin:0;max-width:12ch;font-size:clamp(34px,min(4vw,7.8vh),66px);line-height:1.04;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.h19h .hlead{max-width:40ch}
/* the comparison is always left to right, with "before" on the right, the side a Hebrew reader meets first; --p is the handle */
.h19-cmp{--p:50%;position:relative;border-radius:20px;overflow:hidden;background:var(--ink, #16182b);clip-path:inset(0 round 20px);transition:clip-path .9s cubic-bezier(.2,.6,.2,1);
  cursor:ew-resize;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.h19-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 50%;display:block;pointer-events:none;-webkit-user-drag:none}
.h19-bef{clip-path:inset(0 0 0 var(--p));filter:grayscale(.7) brightness(.45) contrast(.9)}
.h19-lab{position:absolute;top:16px;z-index:1;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--ink, #16182b) 55%,transparent);color:var(--bg, #f7f7fa);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none;transition:opacity .3s cubic-bezier(.2,.6,.2,1)}
.h19-lab.b{right:16px}
.h19-lab.a{left:16px}
/* a label leaves when its side closes, so "before" never sits on the after picture */
.h19-cmp.no-b .h19-lab.b,.h19-cmp.no-a .h19-lab.a{opacity:0}
/* the handle layer is as wide as the picture, so translateX(--p) puts the line exactly under the pointer, without moving left */
.h19-hdl{position:absolute;inset:0;z-index:1;transform:translateX(var(--p));pointer-events:none}
.h19-hdl::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--bg, #f7f7fa);transform:translateX(-50%)}
.h19-knob{position:absolute;top:50%;left:0;width:52px;height:52px;border-radius:999px;display:grid;place-items:center;background:var(--bg, #f7f7fa);color:var(--ink, #16182b);transform:translate(-50%,-50%);
  box-shadow:0 10px 30px -8px color-mix(in srgb,var(--ink, #16182b) 50%,transparent);transition:scale .2s cubic-bezier(.2,.6,.2,1)}
.h19-cmp.drag .h19-knob{scale:1.08}
.h19-knob svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* the range is for the keyboard and the screen reader only; the pointer is read on the picture, so the line follows it to the pixel */
.h19-rng{position:absolute;inset:0;z-index:2;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.h19-rng:focus-visible+.h19-hdl .h19-knob{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.open-anim .h19-cmp{clip-path:inset(5% 8% round 20px);animation:h19-fs 0s 2.5s forwards}
.is-in .h19-cmp{clip-path:inset(0 round 20px);transition-delay:calc(var(--t0,0s) + .1s)}
.rv-on .h19-cmp{animation:none}
@keyframes h19-fs{to{clip-path:inset(0 round 20px)}}
@media (prefers-reduced-motion:reduce){.h19-cmp{transition-duration:.01ms!important;transition-delay:0s!important}}
@media (max-width:860px){.h19h{grid-template-columns:1fr;gap:20px;min-height:0;padding:88px 20px 24px}.h19-txt{padding-block:0;gap:16px}
  .h19h h3{font-size:clamp(28px,7.6vw,38px)}.h19-cmp{height:clamp(240px,38vh,340px)}}
</style>
</head>
<body>

<script>if(matchMedia("(prefers-reduced-motion:no-preference)").matches)document.documentElement.classList.add("open-anim")</script>
<div class="hf"><div class="hf-top"><b>לוגו</b><nav><span>שירותים</span><span>פרויקטים</span><span>אודות</span></nav></div>
  <section class="h19h" id="h19">
    <div class="h19-txt">
      <span class="hkick rv">תכנון תאורה לבתים</span>
      <h3 class="rv">אותו חדר. רק עם אור שתוכנן נכון</h3>
      <p class="hlead rv">תאורה בשכבות, עמעום לפי שעות היום, וגופים שנבחרו לחדר, במקום עוד ספוט בתקרה.</p>
      <div class="hcta rv"><a class="hbtn" href="#h19">לתיאום פגישת תכנון</a><a class="hbtn ghost" href="#h19">פרויקטים</a></div>
    </div>
    <div class="h19-cmp" dir="ltr">
      <img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/room.webp" alt="הסלון אחרי תכנון התאורה: מנורת קריאה ומדפים מוארים" fetchpriority="high" decoding="async">
      <img class="h19-bef" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/room.webp" alt="הסלון לפני: אור שטוח וחשוך" decoding="async">
      <span class="h19-lab a" aria-hidden="true">אחרי</span><span class="h19-lab b" aria-hidden="true">לפני</span>
      <input class="h19-rng" type="range" min="0" max="100" value="50" aria-label="השוואה בין לפני לאחרי">
      <span class="h19-hdl"><span class="h19-knob"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></span></span>
    </div>
  </section>
</div>


<script>
// in view = fire. Measured directly on scroll and resize, not through IntersectionObserver:
// an observer does not update while the tab is throttled (and on a real site the hero is usually
// on screen at load anyway), and an entrance that never fires leaves the hero invisible.
function inView(el,f){
  var ro;
  function chk(){
    var r=el.getBoundingClientRect();
    if(r.top<innerHeight*.9&&r.bottom>0){off();f();}
  }
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);if(ro)ro.disconnect();}
  addEventListener("scroll",chk,{passive:true}); addEventListener("resize",chk);
  // a layout change with no scroll (a bar above it closes, a font swaps in) can also bring it into view
  if(window.ResizeObserver){ro=new ResizeObserver(chk);ro.observe(document.body);}
  requestAnimationFrame(chk); setTimeout(chk,300);
}
function enter(root){
  var els=root.querySelectorAll(".rv");
  els.forEach(function(el,i){if(!el.style.getPropertyValue("--i"))el.style.setProperty("--i",i);});
  // a script that ran late, after the 2.5s CSS failsafe already showed the hero: keep it shown, no second entrance
  if(els.length&&getComputedStyle(els[0]).opacity==="1")root.classList.add("is-in");
  root.classList.add("rv-on");
  inView(root,function(){root.classList.add("is-in");});
}
(function(){
  var root=document.getElementById("h19"); enter(root);
  var cmp=root.querySelector(".h19-cmp"), rng=root.querySelector(".h19-rng"), touched=false;
  var cur=50, anim=0, down=null, moved=false, x0=0, y0=0, calm=!matchMedia("(prefers-reduced-motion:no-preference)").matches;
  function set(v){cur=Math.max(0,Math.min(100,v)); cmp.style.setProperty("--p",cur.toFixed(2)+"%"); cmp.classList.toggle("no-b",cur>86); cmp.classList.toggle("no-a",cur<14);}
  function say(){rng.value=Math.round(cur); rng.setAttribute("aria-valuetext",Math.round(cur)+" אחוז מהתמונה אחרי");}
  function at(e){var b=cmp.getBoundingClientRect(); return (e.clientX-b.left)/b.width*100;}
  // a click far from the line glides there in a fifth of a second instead of jumping
  function glide(to){
    cancelAnimationFrame(anim);
    if(calm){set(to); say(); return;}
    var from=cur, t0=0;
    anim=requestAnimationFrame(function f(now){
      if(!t0)t0=now; var k=Math.min((now-t0)/220,1);
      set(from+(to-from)*(1-Math.pow(1-k,3)));
      if(k<1)anim=requestAnimationFrame(f); else say();
    });
  }
  // a mouse moves the line on press; a finger only when it moves sideways or taps, so scrolling the page never moves it
  cmp.addEventListener("pointerdown",function(e){
    if(e.button>0)return; touched=true; down=e.pointerId; moved=e.pointerType==="mouse"; x0=e.clientX; y0=e.clientY;
    cmp.setPointerCapture(e.pointerId);
    if(moved){e.preventDefault(); cmp.classList.add("drag"); glide(at(e));}
  });
  cmp.addEventListener("pointermove",function(e){
    if(e.pointerId!==down)return;
    if(!moved){var dx=Math.abs(e.clientX-x0); if(dx<8||dx<Math.abs(e.clientY-y0))return; moved=true; cmp.classList.add("drag");}
    cancelAnimationFrame(anim); set(at(e));
  });
  function end(e){
    if(e.pointerId!==down)return; down=null; cmp.classList.remove("drag");
    if(e.type==="pointerup"&&!moved)glide(at(e)); else say();
  }
  cmp.addEventListener("pointerup",end); cmp.addEventListener("pointercancel",end);
  // the keyboard: arrows move five percent, Home and End go to the edges (native)
  rng.addEventListener("keydown",function(e){
    var d={ArrowRight:5,ArrowUp:5,ArrowLeft:-5,ArrowDown:-5}[e.key]; if(!d)return;
    e.preventDefault(); touched=true; cancelAnimationFrame(anim); set(Math.round(cur)+d); say();
  });
  rng.addEventListener("input",function(){touched=true; cancelAnimationFrame(anim); set(+rng.value); say();});
  say();
  // one hint, once: after the entrance the handle swings right and back, only when motion is allowed and nobody touched it
  if(calm)return;
  inView(root,function(){setTimeout(function(){
    var t0=0;
    requestAnimationFrame(function f(now){
      if(touched)return; if(!t0)t0=now;
      var k=Math.min((now-t0)/1200,1);
      set(k<1?50+16*Math.sin(k*Math.PI*2)*(1-k/2):50);
      if(k<1)requestAnimationFrame(f);
    });
  },1000);});
})();
</script>
</body>
</html>
