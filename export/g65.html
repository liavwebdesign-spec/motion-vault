<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G65 · רצועה אופקית שהפריט במרכזה גדל</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-f{background:linear-gradient(160deg,#c92a2a,#ff8787)}

/* G65 · רצועה אופקית שהפריט במרכזה גדל */
.ctr{height:340vh;position:relative}
.ctr-stage{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;align-content:center}
/* בעמוד עברי הרצועה נשארת RTL, אבל המדידה של ScrollTrigger דורשת הקשר LTR על המעטפת */
.ctr-view{direction:ltr;overflow:hidden}
.ctr-track{display:flex;gap:clamp(16px,2.4vw,40px);width:max-content;padding-inline:44vw;direction:rtl}
.ctr-item{width:clamp(180px,22vw,320px);flex:none;border-radius:18px;overflow:hidden;background:var(--card, #fff);
  border:1px solid var(--line, #e4e4ee);will-change:transform,filter}
.ctr-item .ph{aspect-ratio:3/4;border-radius:0;font-size:0}
.ctr-item b{display:block;padding:12px 14px 14px;font-size:15px}
.ctr-cap{position:absolute;bottom:8vh;inset-inline:0;text-align:center;color:var(--muted, #6a6d85);font-size:15px}
</style>
</head>
<body>
<div class="ctr"><div class="ctr-stage">
  <div class="ctr-view"><div class="ctr-track">
    <article class="ctr-item"><div class="ph ph-a"></div><b>משרד עורכי דין</b></article>
    <article class="ctr-item"><div class="ph ph-c"></div><b>מותג קוסמטיקה</b></article>
    <article class="ctr-item"><div class="ph ph-d"></div><b>קורס דיגיטלי</b></article>
    <article class="ctr-item"><div class="ph ph-e"></div><b>פורטל לקוחות</b></article>
    <article class="ctr-item"><div class="ph ph-b"></div><b>קליניקה פרטית</b></article>
    <article class="ctr-item"><div class="ph ph-f"></div><b>יבואן ריהוט</b></article>
  </div></div>
  <p class="ctr-cap">גלול. מי שבמרכז גדל וחד, והשאר נסוגים.</p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const track=document.querySelector(".ctr-track"),view=document.querySelector(".ctr-view");
  const items=gsap.utils.toArray(".ctr-item");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dist=()=>track.scrollWidth-view.clientWidth;
  // בעברית הרצועה מתחילה בימין, ולכן היא נעה ל-x חיובי
  const move=gsap.fromTo(track,{x:-dist()},{x:0,ease:"none",
    scrollTrigger:{trigger:".ctr",start:"top top",end:"bottom bottom",scrub:.5,invalidateOnRefresh:true}});
  if(reduce)return;

  // הדעיכה נמדדת ביחידות של כרטיס אחד ולא של חצי מסך. עם חצי מסך גם השכן הצמוד
  // מקבל כמעט את אותו גודל, ואז אין באמת פריט אחד שתופס את תשומת הלב.
  const step=()=>{
    const first=items[0].getBoundingClientRect();
    const gap=items.length>1?Math.abs(items[1].getBoundingClientRect().left-first.left):first.width;
    return gap||first.width||1;
  };
  const paint=()=>{
    const mid=innerWidth/2,unit=step();
    items.forEach(el=>{
      const r=el.getBoundingClientRect();
      const d=Math.min(1,Math.abs(r.left+r.width/2-mid)/(unit*1.7)); // 0 במרכז, 1 בערך שני כרטיסים משם
      const f=1-d*d;                                             // דעיכה רכה בקצה, חדה במרכז
      gsap.set(el,{scale:.84+f*.24,opacity:.5+f*.5,
        filter:"blur("+((1-f)*2.4).toFixed(2)+"px)",zIndex:Math.round(f*10)});
    });
  };

  // הלולאה רצה רק כשהרצועה על המסך. בלי זה היא מודדת שישה אלמנטים בכל פריים
  // לכל אורך העמוד, גם כשאין מה לראות.
  let running=false;
  const startLoop=()=>{if(!running){running=true;gsap.ticker.add(paint)}};
  const stopLoop=()=>{if(running){running=false;gsap.ticker.remove(paint)}};
  ScrollTrigger.create({trigger:".ctr",start:"top bottom",end:"bottom top",
    onToggle:self=>self.isActive?startLoop():stopLoop()});
  paint();
})();
</script>
</body>
</html>
