<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B88 · גל קול שמתמלא עם הנגן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B88 · גל קול שמתמלא עם הנגן */
.aw{display:grid;place-items:center;padding-block:clamp(24px,4vw,64px)}
.aw-card{display:grid;gap:24px;width:min(760px,100%);padding:clamp(20px,3vw,32px);border-radius:24px;background:var(--card, #fff);box-shadow:0 16px 48px color-mix(in srgb,var(--ink, #16182b) 9%,transparent)}
.aw-who{display:flex;align-items:center;gap:16px}
.aw-ava{flex:none;width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 30%}
.aw-title{margin:0;font-size:clamp(20px,2vw,26px);font-weight:700;line-height:1.25}
.aw-by{margin:4px 0 0;color:var(--muted, #6a6d85);font-size:15px}
.aw-row{display:flex;align-items:center;gap:20px}
.aw-play{flex:none;display:grid;place-items:center;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);cursor:pointer;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
.aw-play svg{width:22px;height:22px;fill:currentColor}
.aw-play .i-pause,.aw-play[aria-pressed="true"] .i-play{display:none}
.aw-play[aria-pressed="true"] .i-pause{display:block}
@media (hover:hover) and (pointer:fine){.aw-play:hover{transform:scale(1.06)}}
.aw-play:focus-visible,.aw-bars:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:4px;border-radius:12px}
.aw-play:focus-visible{border-radius:50%}
.aw-bars{flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:88px;cursor:pointer;touch-action:none}
.aw-bars i{flex:1;min-width:2px;height:calc(var(--h) * 100%);border-radius:99px;background:color-mix(in srgb,var(--muted, #6a6d85) 38%,transparent);transition:background-color .2s cubic-bezier(.2,.6,.2,1)}
.aw-bars i.on{background:var(--accent, #4a3aff)}
.aw-time{flex:none;min-width:88px;margin:0;color:var(--muted, #6a6d85);font-size:15px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:end}
.aw-line{display:block;height:4px;border-radius:99px;background:color-mix(in srgb,var(--muted, #6a6d85) 24%,transparent);overflow:hidden}
.aw-line i{display:block;height:100%;border-radius:99px;background:var(--accent, #4a3aff);transform-origin:right center;transform:scaleX(var(--p,.375))}
.aw-quote{margin:0;max-width:56ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
@media(max-width:767px){
  .aw-row{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"p t" "b b";gap:16px}
  .aw-play{grid-area:p}.aw-time{grid-area:t;text-align:start}.aw-bars{grid-area:b;height:72px}
}
</style>
</head>
<body>

<div class="stage"><section class="aw" aria-label="הקלטה לדוגמה">
  <div class="aw-card">
    <div class="aw-who">
      <img class="aw-ava" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/dive/portrait.webp" alt="" width="56" height="56" loading="lazy" decoding="async">
      <div><p class="aw-title">איך מתחילים שיפוץ בלי להסתבך</p><p class="aw-by">נועה, מעצבת פנים · דוגמית קול</p></div>
    </div>
    <div class="aw-row">
      <button class="aw-play" type="button" aria-label="נגן" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="aw-bars" role="slider" tabindex="0" aria-label="מיקום בהקלטה" aria-valuemin="0" aria-valuemax="24" aria-valuenow="9" aria-valuetext="9 שניות מתוך 24"><i style="--h:0.32" class="on"></i><i style="--h:0.63" class="on"></i><i style="--h:0.65" class="on"></i><i style="--h:0.46" class="on"></i><i style="--h:0.78" class="on"></i><i style="--h:0.72" class="on"></i><i style="--h:0.72" class="on"></i><i style="--h:0.54" class="on"></i><i style="--h:0.68" class="on"></i><i style="--h:0.63" class="on"></i><i style="--h:0.48" class="on"></i><i style="--h:0.60" class="on"></i><i style="--h:0.52" class="on"></i><i style="--h:0.50" class="on"></i><i style="--h:0.36" class="on"></i><i style="--h:0.52" class="on"></i><i style="--h:0.46" class="on"></i><i style="--h:0.30" class="on"></i><i style="--h:0.32" class="on"></i><i style="--h:0.45" class="on"></i><i style="--h:0.40" class="on"></i><i style="--h:0.26"></i><i style="--h:0.41"></i><i style="--h:0.43"></i><i style="--h:0.34"></i><i style="--h:0.44"></i><i style="--h:0.44"></i><i style="--h:0.43"></i><i style="--h:0.38"></i><i style="--h:0.56"></i><i style="--h:0.46"></i><i style="--h:0.41"></i><i style="--h:0.53"></i><i style="--h:0.55"></i><i style="--h:0.41"></i><i style="--h:0.35"></i><i style="--h:0.52"></i><i style="--h:0.45"></i><i style="--h:0.38"></i><i style="--h:0.31"></i><i style="--h:0.47"></i><i style="--h:0.42"></i><i style="--h:0.32"></i><i style="--h:0.42"></i><i style="--h:0.44"></i><i style="--h:0.43"></i><i style="--h:0.53"></i><i style="--h:0.63"></i><i style="--h:0.68"></i><i style="--h:0.56"></i><i style="--h:0.63"></i><i style="--h:0.62"></i><i style="--h:0.64"></i><i style="--h:0.48"></i><i style="--h:0.94"></i><i style="--h:0.83"></i></div>
      <p class="aw-time" aria-hidden="true"><span class="aw-now">0:09</span> / <span>0:24</span></p>
    </div>
    <span class="aw-line" aria-hidden="true"><i></i></span>
    <p class="aw-quote">“הדבר הראשון שאני שואלת בפגישה הוא איך אתם רוצים להרגיש כשאתם נכנסים הביתה.”</p>
  </div>
</section></div>


<script>
(function(){
  const root=document.querySelector(".aw"),btn=root.querySelector(".aw-play"),box=root.querySelector(".aw-bars");
  const bars=[...box.children],now=root.querySelector(".aw-now"),card=root.querySelector(".aw-card");
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,rtl=getComputedStyle(root).direction==="rtl";
  const DUR=+box.getAttribute("aria-valuemax")||24,N=bars.length;
  let t=+box.getAttribute("aria-valuenow")||0,playing=false,base=0,t0=0,vis=true,raf=0,sec=-1,drag=false;
  const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
  // כאן מחברים שמע אמיתי: set(audio.currentTime) בכל timeupdate
  function set(s){
    t=Math.max(0,Math.min(DUR,s));
    const k=Math.round(t/DUR*N);
    bars.forEach((b,i)=>b.classList.toggle("on",i<k));
    now.textContent=fmt(t);card.style.setProperty("--p",(t/DUR).toFixed(4));
    const w=Math.floor(t);
    if(w!==sec){sec=w;box.setAttribute("aria-valuenow",w);box.setAttribute("aria-valuetext",w+" שניות מתוך "+DUR);}
  }
  // פעימה: רק העמודים סביב נקודת ההשמעה, ולא בהפחתת תנועה
  let lit=[];
  function pulse(ts){
    lit.forEach(i=>{bars[i].style.transform="";});lit=[];
    if(reduced||!playing)return;
    const k=Math.round(t/DUR*N);
    for(let i=Math.max(0,k-6);i<=Math.min(N-1,k+5);i++){
      const f=1+.38*Math.sin(ts/110-i*.9)*Math.max(0,1-Math.abs(i-k)/6);
      bars[i].style.transform="scaleY("+f.toFixed(3)+")";lit.push(i);
    }
  }
  function frame(ts){
    raf=0;if(!playing)return;
    set(base+(performance.now()-t0)/1000);pulse(ts);
    if(t>=DUR){stop();return;}
    if(vis)raf=requestAnimationFrame(frame);
  }
  function play(){
    if(t>=DUR-.05)set(0);
    base=t;t0=performance.now();playing=true;
    btn.setAttribute("aria-pressed","true");btn.setAttribute("aria-label","השהה");
    if(!raf)raf=requestAnimationFrame(frame);
  }
  function stop(){
    playing=false;if(raf)cancelAnimationFrame(raf);raf=0;pulse(0);
    btn.setAttribute("aria-pressed","false");btn.setAttribute("aria-label","נגן");
  }
  function seek(s){set(s);if(playing){base=t;t0=performance.now();}}
  const at=e=>{const r=box.getBoundingClientRect();let f=(e.clientX-r.left)/r.width;if(rtl)f=1-f;seek(Math.max(0,Math.min(1,f))*DUR);};
  btn.addEventListener("click",()=>playing?stop():play());
  box.addEventListener("pointerdown",e=>{drag=true;box.setPointerCapture(e.pointerId);at(e);});
  box.addEventListener("pointermove",e=>{if(drag)at(e);});
  box.addEventListener("pointerup",()=>{drag=false;});
  box.addEventListener("pointercancel",()=>{drag=false;});
  box.addEventListener("keydown",e=>{
    const fwd=rtl?"ArrowLeft":"ArrowRight",back=rtl?"ArrowRight":"ArrowLeft";
    if(e.key===fwd||e.key==="ArrowUp")seek(t+2);
    else if(e.key===back||e.key==="ArrowDown")seek(t-2);
    else if(e.key==="Home")seek(0);
    else if(e.key==="End")seek(DUR);
    else if(e.key===" "||e.key==="Enter")playing?stop():play();
    else return;
    e.preventDefault();
  });
  // הלולאה נעצרת כשהכרטיס מחוץ למסך, והשעון ממשיך, כך שהמילוי נכון כשחוזרים
  new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis&&playing&&!raf)raf=requestAnimationFrame(frame);},{rootMargin:"20% 0px"}).observe(root);
  set(t);
})();
</script>
</body>
</html>
