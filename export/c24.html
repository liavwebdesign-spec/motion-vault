<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C24 · כרטיס קשר שרוכב על מפה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C24 · כרטיס קשר שרוכב על מפה */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c24{display:grid;grid-template-columns:minmax(260px,380px) 1fr}
.c24 .map{grid-column:1 / -1;grid-row:1;min-height:clamp(340px,40cqi,480px);border-radius:var(--r, 14px);position:relative;overflow:hidden;
  background-color:color-mix(in srgb,var(--ink, #16182b) 6%,var(--bg, #f7f7fa));
  background-image:linear-gradient(28deg,transparent 46%,var(--card, #fff) 46% 48.5%,transparent 48.5%),linear-gradient(-58deg,transparent 60%,var(--card, #fff) 60% 62%,transparent 62%),linear-gradient(90deg,transparent 30%,var(--card, #fff) 30% 31.2%,transparent 31.2%),radial-gradient(circle at 18% 78%,color-mix(in srgb,var(--ink, #16182b) 10%,transparent) 0 64px,transparent 65px)}
.c24 .pin{position:absolute;top:40%;inset-inline-start:66%;width:24px;height:24px;border-radius:50% 50% 50% 0;background:var(--accent, #4a3aff);transform:rotate(-45deg);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent, #4a3aff) 20%,transparent)}
.c24 .card{grid-column:1;grid-row:1;align-self:center;position:relative;margin:clamp(16px,3cqi,40px);background:var(--card, #fff);border-radius:var(--r, 14px);padding:clamp(20px,2.6cqi,32px);box-shadow:0 18px 40px rgba(22,24,43,.12)}
.c24 dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.c24 dt{color:var(--muted, #6a6d85)}
.c24 dd{margin:0;font-weight:600}
.c24 dd a{color:inherit}
@container (max-width:767px){
  .c24{grid-template-columns:1fr;grid-template-rows:200px 48px auto}
  .c24 .map{grid-row:1 / 3;min-height:0}
  .c24 .card{grid-row:2 / 4;margin:0 12px}
}
</style>
</head>
<body>

<div class="cwrap cstage"><div class="c24">
  <div class="map" role="img" aria-label="מפה עם מיקום העסק"><span class="pin"></span></div>
  <div class="card"><h3 class="ttl">בואו להיפגש</h3><p class="lead">רחוב הדוגמה 12, תל אביב</p>
    <dl><dt>טלפון</dt><dd><a href="tel:+97230000000"><bdi dir="ltr">03-000-0000</bdi></a></dd><dt>שעות</dt><dd>ראשון עד חמישי, 9:00 עד 18:00</dd></dl>
    <span class="btn">לנווט לכאן</span></div>
</div></div>



</body>
</html>
