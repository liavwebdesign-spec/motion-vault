<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C22 · אינדקס שירותים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}

/* C22 · אינדקס שירותים */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c22{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.c22 a{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:clamp(12px,2.4cqi,32px);padding:clamp(10px,1.4cqi,16px) clamp(12px,2cqi,24px);border-radius:var(--r, 14px);color:inherit;text-decoration:none;transition:background-color .3s cubic-bezier(.2,.6,.2,1)}
.c22 .nm{font-size:clamp(34px,6.4cqi,88px);font-weight:800;line-height:1.05;letter-spacing:-.02em;transition:opacity .3s cubic-bezier(.2,.6,.2,1)}
.c22 .meta{color:var(--muted, #6a6d85);font-size:14px;white-space:nowrap;align-self:start;margin-top:.5em}
.c22 .pk{width:clamp(72px,10cqi,128px);aspect-ratio:4/3;border-radius:10px;transform:rotate(-3deg)}
.c22 .go{font-size:24px;line-height:1}
.c22 a:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
  .c22 .pk{opacity:0;transform:translateY(8px) rotate(-6deg) scale(.9);transition:opacity .3s cubic-bezier(.2,.6,.2,1),transform .4s cubic-bezier(.2,.6,.2,1)}
  .c22 a:hover,.c22 a:focus-visible{background-color:var(--card, #fff)}
  .c22 a:hover .pk,.c22 a:focus-visible .pk{opacity:1;transform:rotate(-3deg)}
  .c22:hover a:not(:hover) .nm{opacity:.35}
}
@media (prefers-reduced-motion:reduce){.c22 .pk{transform:rotate(-3deg) !important}}
@container (max-width:767px){
  .c22 a{grid-template-columns:1fr auto;grid-template-areas:"nm pk" "meta pk";row-gap:4px}
  .c22 .nm{grid-area:nm}.c22 .meta{grid-area:meta;margin-top:0}.c22 .pk{grid-area:pk;width:72px;opacity:1 !important;transform:rotate(-3deg) !important}.c22 .go{display:none}
}
</style>
</head>
<body>

<div class="cwrap cstage"><ul class="c22">
  <li><a href="#"><span class="nm">מיתוג</span><span class="meta">12 עבודות</span><span class="pk ph ph-a" aria-hidden="true"></span><span class="go" aria-hidden="true">←</span></a></li>
  <li><a href="#"><span class="nm">אתרים</span><span class="meta">38 עבודות</span><span class="pk ph ph-b" aria-hidden="true"></span><span class="go" aria-hidden="true">←</span></a></li>
  <li><a href="#"><span class="nm">חנויות</span><span class="meta">9 עבודות</span><span class="pk ph ph-c" aria-hidden="true"></span><span class="go" aria-hidden="true">←</span></a></li>
  <li><a href="#"><span class="nm">קמפיינים</span><span class="meta">21 עבודות</span><span class="pk ph ph-e" aria-hidden="true"></span><span class="go" aria-hidden="true">←</span></a></li>
  <li><a href="#"><span class="nm">מערכות</span><span class="meta">6 עבודות</span><span class="pk ph ph-d" aria-hidden="true"></span><span class="go" aria-hidden="true">←</span></a></li>
</ul></div>



</body>
</html>
