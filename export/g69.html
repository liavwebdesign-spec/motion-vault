<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G69 · חשיפת פיקסלים בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}

/* G69 · חשיפת פיקסלים בגלילה */
.px{height:280vh;position:relative}
.px-stage{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
.px-frame{position:relative;width:min(880px,92vw);aspect-ratio:16/10;border-radius:18px;overflow:hidden}
.px-img{position:absolute;inset:0;border-radius:0;font-size:0}
.px-grid{position:absolute;inset:0;display:grid}
.px-cell{background:var(--bg, #f7f7fa);will-change:opacity}
.px-cap{position:absolute;bottom:8vh;inset-inline:0;text-align:center;color:var(--muted, #6a6d85);font-size:15px}
</style>
</head>
<body>

<div class="px"><div class="px-stage">
  <div class="px-frame">
    <div class="ph px-img ph-c"></div>
    <div class="px-grid"></div>
  </div>
  <p class="px-cap">גלול. הריבועים נעלמים בסדר אקראי.</p>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const COLS=14, ROWS=9;
  const grid=document.querySelector(".px-grid");
  grid.style.gridTemplateColumns="repeat("+COLS+",1fr)";
  grid.style.gridTemplateRows="repeat("+ROWS+",1fr)";
  const cells=[];
  for(let i=0;i<COLS*ROWS;i++){
    const d=document.createElement("div");d.className="px-cell";grid.appendChild(d);cells.push(d);
  }
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){gsap.set(cells,{opacity:0});return;}
  gsap.to(cells,{opacity:0,ease:"none",
    // stagger אקראי עם from:"random" הוא מה שמונע תחושת מחיקה מסודרת
    stagger:{each:.012,from:"random"},
    scrollTrigger:{trigger:".px",start:"top top",end:"bottom bottom",scrub:.4}});
})();
</script>
</body>
</html>
