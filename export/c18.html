<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C18 · מדרגות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C18 · מדרגות */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c18{--rise:clamp(28px,6cqi,72px);list-style:none;margin:clamp(20px,3cqi,40px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.2cqi,16px)}
.c18 li{background:var(--card, #fff);border-radius:var(--r, 14px);padding:clamp(18px,2.4cqi,28px)}
.c18 li:nth-child(2){margin-top:var(--rise)}
.c18 li:nth-child(3){margin-top:calc(var(--rise) * 2)}
.c18 li:nth-child(4){margin-top:calc(var(--rise) * 3)}
.c18 .n{display:block;font-size:clamp(28px,3.4cqi,44px);font-weight:800;line-height:1;color:var(--muted, #6a6d85)}
.c18 h4{margin:14px 0 6px;font-size:clamp(17px,1.6cqi,20px)}
.c18 .end{background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
.c18 .end .n{color:inherit;opacity:.6}
.c18 .end .btn{background:var(--bg, #f7f7fa);color:var(--ink, #16182b)}
@container (max-width:767px){
  .c18{grid-template-columns:1fr;gap:12px}
  .c18 li{margin-top:0 !important}
  .c18 li:nth-child(2){margin-inline-start:16px}
  .c18 li:nth-child(3){margin-inline-start:32px}
  .c18 li:nth-child(4){margin-inline-start:48px}
}
</style>
</head>
<body>

<div class="cwrap cstage"><h3 class="ttl">ארבעה צעדים עד שזה באוויר</h3>
<ol class="c18">
  <li><span class="n">01</span><h4>שיחת היכרות</h4><div class="tx l"></div><div class="tx m"></div></li>
  <li><span class="n">02</span><h4>סקיצה ראשונה</h4><div class="tx l"></div><div class="tx s"></div></li>
  <li><span class="n">03</span><h4>תיקונים</h4><div class="tx m"></div><div class="tx l"></div></li>
  <li class="end"><span class="n">04</span><h4>עולים לאוויר</h4><div class="tx l"></div><span class="btn">להתחיל</span></li>
</ol></div>



</body>
</html>
