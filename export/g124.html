<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G124 · טבלת השוואה שמתמלאת בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G124 · טבלת השוואה שמתמלאת בגלילה */
.cmp{max-width:min(860px,94vw);margin-inline:auto;border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--card, #fff)}
.cmp-row{display:grid;grid-template-columns:1.6fr 1fr 1fr;align-items:center;border-bottom:1px solid var(--line, #e4e4ee);opacity:.35;translate:0 10px}
.cmp-row:last-child{border-bottom:0}
.cmp-row.head{opacity:1;translate:0;background:var(--bg, #f7f7fa);font-size:13px;color:var(--muted, #6a6d85);letter-spacing:.06em}
.cmp-row>div{padding:clamp(12px,1.6vw,20px)}
.cmp-row .us{background:color-mix(in srgb,var(--accent, #4a3aff) 7%,transparent);text-align:center}
.cmp-row .them{text-align:center;color:var(--muted, #6a6d85)}
.cmp-row b{font-size:clamp(15px,1.5vw,18px)}
.cmp svg{width:26px;height:26px;overflow:visible;vertical-align:middle}
.cmp .ok path{fill:none;stroke:var(--accent, #4a3aff);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cmp .no path{fill:none;stroke:var(--muted, #6a6d85);stroke-width:2.5;stroke-linecap:round}
@media(max-width:767px){.cmp-row{grid-template-columns:1.3fr 1fr 1fr}.cmp-row b{font-size:14px}.cmp svg{width:20px;height:20px}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><div class="cmp">
  <div class="cmp-row head"><div>מה מקבלים</div><div class="us">אצלנו</div><div class="them">בדרך הישנה</div></div>
  <div class="cmp-row"><div><b>אפיון לפני עיצוב</b></div><div class="us"><svg class="ok" viewBox="0 0 24 24"><path d="M4 13l5 5 11-12"/></svg></div><div class="them"><svg class="no" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
  <div class="cmp-row"><div><b>קופי שנכתב לגולש</b></div><div class="us"><svg class="ok" viewBox="0 0 24 24"><path d="M4 13l5 5 11-12"/></svg></div><div class="them"><svg class="no" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
  <div class="cmp-row"><div><b>מובייל קודם</b></div><div class="us"><svg class="ok" viewBox="0 0 24 24"><path d="M4 13l5 5 11-12"/></svg></div><div class="them"><svg class="no" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
  <div class="cmp-row"><div><b>מדידה מהיום הראשון</b></div><div class="us"><svg class="ok" viewBox="0 0 24 24"><path d="M4 13l5 5 11-12"/></svg></div><div class="them"><svg class="no" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
  <div class="cmp-row"><div><b>עלייה תוך שבועיים</b></div><div class="us"><svg class="ok" viewBox="0 0 24 24"><path d="M4 13l5 5 11-12"/></svg></div><div class="them"><svg class="no" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger, DrawSVGPlugin);

(function(){
  const rows=gsap.utils.toArray(".cmp-row:not(.head)");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(rows,{opacity:1,translate:"0 0"});return;}
  gsap.set(".cmp .ok path",{drawSVG:"0%"});
  ScrollTrigger.batch(rows,{start:"top 85%",once:true,onEnter:batch=>{
    batch.forEach((row,i)=>{
      gsap.timeline({delay:i*.12})
        .to(row,{opacity:1,translate:"0 0",duration:.45,ease:"power3.out"})
        .to(row.querySelector(".ok path"),{drawSVG:"100%",duration:.4,ease:"power2.inOut"},"-=.2")
        .to(row.querySelector(".no"),{opacity:.35,scale:.85,duration:.3},"-=.3");
    });
  }});
})();
</script>
</body>
</html>
