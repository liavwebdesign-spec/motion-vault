<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C28 · סגירה עם הוכחות סביב</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}

/* C28 · סגירה עם הוכחות סביב */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c28{display:grid;grid-template-columns:1fr minmax(0,460px) 1fr;grid-template-areas:"p1 p2 ." "p3 core p4" ". p5 p6";gap:clamp(14px,2.2cqi,30px) clamp(16px,3cqi,40px);align-items:center;padding-block:clamp(12px,2cqi,24px)}
.c28 .core{grid-area:core;text-align:center;padding-block:clamp(16px,3cqi,40px)}
.c28 .core .ttl{font-size:clamp(28px,3.6cqi,48px)}
.c28 .core .lead{margin-inline:auto;max-width:32ch}
.c28 .core .btn{background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);padding:12px 24px;font-size:15px}
.c28 .pf{background:var(--card, #fff);border-radius:16px;padding:16px 20px;font-size:15px;line-height:1.45;display:flex;align-items:center;gap:12px;max-width:280px;box-shadow:0 14px 34px rgba(22,24,43,.07)}
.c28 .pf b{font-size:clamp(22px,2.2cqi,28px);line-height:1;font-variant-numeric:tabular-nums}
.c28 .pf small{display:block;color:var(--muted, #6a6d85);font-size:13px}
.c28 .p1{grid-area:p1;justify-self:end;align-self:end}
.c28 .p2{grid-area:p2;justify-self:center;transform:translateX(-32px)}
.c28 .p3{grid-area:p3;justify-self:end}
.c28 .p4{grid-area:p4;justify-self:start;transform:translateY(-18px)}
.c28 .p5{grid-area:p5;justify-self:center;transform:translateX(36px)}
.c28 .p6{grid-area:p6;justify-self:start;align-self:start}
.c28 .avs{display:grid;grid-template-columns:repeat(3,18px);padding-inline-end:10px}
.c28 .avs i{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--card, #fff)}
@container (max-width:767px){
  .c28{grid-template-columns:1fr 1fr;grid-template-areas:"core core" "p1 p2" "p3 p4" "p5 p6"}
  .c28 .pf{justify-self:stretch;max-width:none;transform:none;flex-direction:column;align-items:flex-start;gap:6px}
}
</style>
</head>
<body>

<div class="cwrap cstage"><div class="c28">
  <div class="core"><h3 class="ttl">מוכנים להתחיל?</h3><p class="lead">שיחה של עשרים דקות, בלי התחייבות, ותצאו ממנה עם תוכנית.</p><span class="btn">לקבוע שיחה</span></div>
  <div class="pf p1"><b>4.9</b><span>ממוצע<small>212 ביקורות בגוגל</small></span></div>
  <div class="pf p2"><span class="avs" aria-hidden="true"><i class="ph ph-a"></i><i class="ph ph-c"></i><i class="ph ph-e"></i></span><span>340 עסקים<small>כבר עבדו איתנו</small></span></div>
  <div class="pf p3"><span>״הכי פשוט שהיה לנו״<small>דנה, סטודיו לעיצוב</small></span></div>
  <div class="pf p4"><b>48</b><span>שעות<small>עד סקיצה ראשונה</small></span></div>
  <div class="pf p5"><span>החזר מלא<small>אם הסקיצה לא מתאימה</small></span></div>
  <div class="pf p6"><b>1</b><span>איש קשר<small>מההתחלה ועד הסוף</small></span></div>
</div></div>



</body>
</html>
