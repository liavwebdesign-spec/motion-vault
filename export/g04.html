<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G04 · טקסט נחשף בגלילה: שלוש רמות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.center{text-align:center}

/* G04 · טקסט נחשף בגלילה: שלוש רמות */
.tstage h2{font-size:var(--fs-demo, clamp(36px, 3vw + 0.5rem, 76px));line-height:1.2;max-width:22ch;margin:0 auto clamp(120px,14vw,260px)}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage tight tstage center">
<h2 class="t-clip">רמה א: המילים עולות מתוך מסכה, מילה אחרי מילה, בקצב הגלילה</h2>
<h2 class="t-fade">רמה ב: המילים מתבהרות בעדינות משקיפות חלקית אל מלאה</h2>
<h2 class="t-wipe">רמה ג: הכותרת כולה נמחקת ונחשפת מהצד בתנועה אחת</h2>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger, SplitText);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הכותרות פשוט גלויות
  const st=(h,a,b)=>({trigger:h,start:a,end:b,scrub:1});
  const mm=gsap.matchMedia();
  mm.add({desk:"(min-width: 768px) and (prefers-reduced-motion: no-preference)",
          mob:"(max-width: 767px) and (prefers-reduced-motion: no-preference)"},ctx=>{
    const {desk,mob}=ctx.conditions;
    if(!desk&&!mob)return;
    const splits=[];
    // עברית: מפצלים למילים בלבד. בלי lines: ב-RTL הפיצול לשורות מזהה כל כותרת כשורה אחת
    const words=h=>{const s=new SplitText(h,{type:"words"});splits.push(s);return s.words;};
    // רמה ב: המילים מתבהרות. stagger 0.5 בטווין scrub הוא חלק ממרחק הגלילה, לא מילישניות
    const fade=h=>gsap.from(words(h),{opacity:.15,stagger:.5,scrollTrigger:st(h,"top 80%","top 30%")});
    // רמה א: המילים עולות מ-clip. בטלפון clip על מילים קטנות מרצד, ולכן שם היא מקבלת את רמה ב
    document.querySelectorAll(".t-clip").forEach(h=>{
      if(mob)return fade(h);
      gsap.from(words(h),{clipPath:"inset(100% 0% 0% 0%)",opacity:0,stagger:.5,scrollTrigger:st(h,"top 80%","top 30%")});
    });
    document.querySelectorAll(".t-fade").forEach(fade);
    // רמה ג: הכותרת כולה נמחקת מהצד, בלי פיצול. scrub: הגלילה היא העקומה, ולכן ease:"none"
    document.querySelectorAll(".t-wipe").forEach(h=>{
      gsap.from(h,{clipPath:"inset(0% 0% 0% 100%)",ease:"none",scrollTrigger:st(h,"top 70%","top 40%")});
    });
    return()=>splits.forEach(s=>s.revert());
  });
})();
</script>
</body>
</html>
