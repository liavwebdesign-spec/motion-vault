<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS42 · שני מישורי נקודות מוטים בעומק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS42 · שני מישורי נקודות מוטים בעומק */
.dp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center;gap:clamp(32px,6vw,96px);max-width:1100px;margin-inline:auto}
.dp-copy{display:grid;gap:16px;justify-items:start}
.dp-kicker{margin:0;font-size:15px;font-weight:600;color:var(--muted, #6a6d85)}
.dp-copy h2{margin:0;font-size:clamp(30px,3.6vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.dp-copy p:not(.dp-kicker){margin:0;max-width:40ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.dp-legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px}
.dp-legend li{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--card, #fff);font-size:14px;font-weight:600}
.dp-legend i{width:10px;height:10px;border-radius:50%;background:var(--ink, #16182b)}
.dp-legend li:nth-child(2) i{background:color-mix(in oklab,var(--ink, #16182b) 40%,var(--bg, #f7f7fa))}
.dp-scene{position:relative;overflow:hidden;height:clamp(340px,56vh,560px);border-radius:28px;background:var(--ink, #16182b);perspective:900px;perspective-origin:50% 40%}
.dp-rig{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(62deg) rotateZ(-28deg);transition:transform .9s cubic-bezier(.2,.6,.2,1);animation:dp-bob 8s cubic-bezier(.4,0,.2,1) infinite alternate}
.dp-plane,.dp-glow{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1.25;translate:-50% -50%}
.dp-plane{overflow:hidden;border-radius:18px;background:color-mix(in oklab,var(--dot) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--dot) 38%,transparent);transition:transform .9s cubic-bezier(.2,.6,.2,1)}
.dp-plane::before{content:"";position:absolute;inset:-18px;background:radial-gradient(circle,var(--dot) 0 2px,transparent 2.8px) 0 0 / 18px 18px}
.dp-top{--dot:var(--bg, #f7f7fa);transform:translateZ(90px)}
.dp-top::before{animation:dp-a 7s linear infinite}
.dp-bot{--dot:color-mix(in oklab,var(--bg, #f7f7fa) 62%,var(--ink, #16182b));transform:translateZ(-90px)}
.dp-bot::before{animation:dp-b 9s linear infinite}
.dp-glow{width:96%;background:radial-gradient(closest-side,color-mix(in oklab,var(--accent, #4a3aff) 80%,transparent),transparent)}
.dp-scene:hover .dp-rig{transform:rotateX(52deg) rotateZ(-16deg)}
.dp-scene:hover .dp-top{transform:translateZ(130px)}
.dp-scene:hover .dp-bot{transform:translateZ(-130px)}
/* כל מישור זז בדיוק אורך תא אחד (18px) בלולאה, ולכן אין קפיצה בחזרה להתחלה */
@keyframes dp-a{to{transform:translate(18px,0)}}
@keyframes dp-b{to{transform:translate(0,-18px)}}
@keyframes dp-bob{to{translate:0 -12px}}
@media(prefers-reduced-motion:reduce){.dp-rig,.dp-top::before,.dp-bot::before{animation:none}.dp-rig,.dp-plane{transition:none}}
@media(max-width:767px){.dp{grid-template-columns:minmax(0,1fr)}.dp-scene{height:clamp(300px,48svh,420px)}}
</style>
</head>
<body>

<div class="stage"><section class="dp">
  <div class="dp-copy">
    <p class="dp-kicker">תשתית נתונים לעסקים קטנים</p>
    <h2>הנתונים בשכבה אחת, הדוחות מעליה</h2>
    <p>אנחנו מחברים את מערכת הקופה, ההזמנות והחשבוניות למקום אחד, ובונים מעליו דוחות שבעל העסק יכול לקרוא בלי לבקש עזרה.</p>
    <ul class="dp-legend"><li><i></i>שכבת דוחות</li><li><i></i>שכבת נתונים</li></ul>
  </div>
  <div class="dp-scene" aria-hidden="true">
    <div class="dp-rig">
      <div class="dp-plane dp-top"></div>
      <div class="dp-glow"></div>
      <div class="dp-plane dp-bot"></div>
    </div>
  </div>
</section></div>



</body>
</html>
