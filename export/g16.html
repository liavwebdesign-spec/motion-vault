<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G16 · מילים מתרוקנות בהובר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.center{text-align:center}

/* G16 · מילים מתרוקנות בהובר */
.hovt{font-size:var(--fs-demo, clamp(36px, 3vw + 0.5rem, 76px));line-height:1.25;font-weight:800;max-width:22ch;margin-inline:auto;cursor:default}
</style>
</head>
<body>

<div class="stage tight center"><h2 class="hovt">כל מילה בכותרת הזאת מגיבה למגע העכבר שלך בנפרד ובזמן אמת</h2></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(SplitText);

(function(){
  if(typeof gsap==="undefined")return;
  // רק עם עכבר: במגע מילה שהוקשה נשארת חלולה עד ההקשה הבאה. בטלפון הכותרת רגילה
  gsap.matchMedia().add("(hover: hover) and (pointer: fine)",()=>{
    const splits=[];
    document.querySelectorAll(".hovt").forEach(h=>{
      // הצבע של הכותרת עצמה, נקרא בכל ריחוף ולא ערך קבוע: כותרת לבנה על הירו כהה חוזרת ללבן, גם אחרי החלפת ערכת צבע
      const base=()=>getComputedStyle(h).color;
      const split=new SplitText(h,{type:"words"});splits.push(split);
      gsap.set(split.words,{display:"inline-block"});
      split.words.forEach(w=>{
        w.addEventListener("mouseenter",()=>gsap.to(w,{color:"transparent","-webkit-text-stroke":"1.5px "+base(),duration:.15,overwrite:true}));
        w.addEventListener("mouseleave",()=>{const c=base();gsap.to(w,{color:c,"-webkit-text-stroke":"0px "+c,duration:.15,overwrite:true,
          onComplete:()=>{w.style.color="";w.style.webkitTextStroke="";}});});   // בסוף חוזרים לצבע שבא מה-CSS
      });
    });
    return()=>splits.forEach(s=>s.revert());
  });
})();
</script>
</body>
</html>
