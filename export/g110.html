<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G110 · טקסט שנכתב עם הגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G110 · טקסט שנכתב עם הגלילה */
.tw2{position:relative;height:220vh}
.tw2-pin{position:sticky;top:0;height:100vh;display:grid;place-items:center;padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.tw2 p{max-width:30ch;margin:0;font-size:clamp(24px,3.2vw,46px);font-weight:600;line-height:1.5;text-align:center}
.tw2 p .w{white-space:nowrap}
.tw2 p .c{opacity:.12}
.tw2 p .c.on{opacity:1}
.tw2 p .c.cur{position:relative}
.tw2 p .c.cur::after{content:"";position:absolute;inset-inline-end:-.06em;top:.12em;width:.08em;height:1em;background:var(--accent, #4a3aff);animation:tw2-b 1s steps(1) infinite}
.tw2 p .c.cur.pre::after{inset-inline-end:auto;inset-inline-start:-.1em}
.tw2 .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes tw2-b{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.tw2{height:auto}.tw2-pin{position:static;height:auto;min-height:70vh}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="tw2"><div class="tw2-pin"><p>אנחנו לא מוכרים אתר. אנחנו מוכרים את הרגע שבו מישהו קורא, מבין, ומרים טלפון.</p></div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הפסקה נשארת טקסט רגיל
  const tw=document.querySelector(".tw2"),p=tw.querySelector("p"),text=p.textContent.trim();
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    // עותק שלם לקורא מסך, ועותק מפוצל לעין: כל מילה עוטפת את האותיות שלה ולא נשברת באמצע
    const sr=document.createElement("span"),vis=document.createElement("span"),chars=[];
    sr.className="sr-only";sr.textContent=text;vis.setAttribute("aria-hidden","true");
    text.split(" ").forEach((word,i)=>{if(i)vis.append(" ");
      const w=document.createElement("span");w.className="w";
      [...word].forEach(ch=>{const c=document.createElement("span");c.className="c";c.textContent=ch;w.appendChild(c);chars.push(c);});
      vis.appendChild(w);});
    p.textContent="";p.append(sr,vis);
    const o={n:0};let last=-1;
    function paint(){const k=Math.round(o.n);if(k===last)return;last=k;
      // הסמן יושב אחרי האות האחרונה הגלויה; לפני שהכתיבה מתחילה הוא מחכה לפני האות הראשונה
      chars.forEach((c,i)=>{c.classList.toggle("on",i<k);c.classList.toggle("cur",k?i===k-1:!i);c.classList.toggle("pre",!k&&!i);});}
    gsap.to(o,{n:chars.length,ease:"none",onUpdate:paint,scrollTrigger:{trigger:tw,start:"top top",end:"bottom bottom",scrub:.4}});
    paint();
    return()=>{p.textContent=text;};
  });
})();
</script>
</body>
</html>
