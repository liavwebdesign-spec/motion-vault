<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G206 · כותרת מפוצלת בצבעים עם הבזק היפוך</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G206 · כותרת מפוצלת בצבעים עם הבזק היפוך */
.gl{max-width:1120px;margin-inline:auto}
.gl-box{display:grid;gap:24px;padding:clamp(32px,6vw,96px);border-radius:28px;background:var(--card, #fff)}
.gl-t{position:relative;margin:0;font-size:clamp(44px,8vw,124px);font-weight:700;line-height:1.05;letter-spacing:-.02em;text-wrap:balance;isolation:isolate}
.gl-b{position:relative;z-index:1}
.gl-r,.gl-c{position:absolute;inset:0;opacity:0;pointer-events:none;user-select:none}
.gl-r{color:var(--accent, #4a3aff)}
.gl-c{color:color-mix(in oklab,var(--accent, #4a3aff) 35%,var(--ink, #16182b))}
@supports (color:oklch(from red l c h)){.gl-c{color:oklch(from var(--accent, #4a3aff) l c calc(h + 180))}}
.gl-p{margin:0;max-width:46ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><div class="gl"><div class="gl-box">
  <h2 class="gl-t"><span class="gl-b">המלאי מתעדכן בזמן אמת</span><span class="gl-r" aria-hidden="true">המלאי מתעדכן בזמן אמת</span><span class="gl-c" aria-hidden="true">המלאי מתעדכן בזמן אמת</span></h2>
  <p class="gl-p">כל מכירה בחנות ובאתר יורדת מהמלאי באותו רגע, בלי ספירות בסוף היום.</p>
</div></div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP זו כותרת רגילה, בלי שכבות הצבע
  const root=document.querySelector(".gl"),box=root.querySelector(".gl-box"),title=root.querySelector(".gl-t"),
    R=root.querySelector(".gl-r"),C=root.querySelector(".gl-c");
  // בהפחתת תנועה הפונקציה לא רצה: אין היסטים ואין הבזק
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    let lock=0,tl=null;
    const rnd=(a,b)=>a+Math.random()*(b-a);
    // פגיעה אחת: חמישה היסטים אקראיים וקצרים, הבזק היפוך אחד של הכרטיס (בכניסה בלבד), וחזרה למנוחה
    const hit=flash=>{
      const now=performance.now();
      if(now<lock)return;lock=now+2500;      // לפחות 2.5 שניות בין פגיעות: אין הבזקים חוזרים
      if(tl)tl.kill();
      tl=gsap.timeline({onComplete:()=>gsap.set([R,C,box],{clearProps:"opacity,transform,filter"})});
      tl.set(title,{opacity:1},0);
      for(let i=0;i<5;i++){
        const k=1-i/6;
        tl.set(R,{opacity:.9,x:-rnd(8,20)*k,y:rnd(-4,4)*k},i*.07).set(C,{opacity:.9,x:rnd(8,20)*k,y:rnd(-4,4)*k},i*.07);
      }
      if(flash)tl.set(box,{filter:"invert(1) hue-rotate(180deg)"},.07).set(box,{clearProps:"filter"},.16);
      tl.to([R,C],{opacity:0,x:0,y:0,duration:.2,ease:"power2.out"},.4);
    };
    const hover=()=>hit(false);
    gsap.set(title,{opacity:0});
    box.addEventListener("pointerenter",hover);
    const st=ScrollTrigger.create({trigger:box,start:"top 82%",onEnter:()=>hit(true),onEnterBack:()=>hit(true)});
    return()=>{st.kill();box.removeEventListener("pointerenter",hover);if(tl)tl.kill();gsap.set([title,R,C,box],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
