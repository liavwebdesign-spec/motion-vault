<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G222 · שם שמתכווץ לקו דק ונפתח לסקשן הבא</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G222 · שם שמתכווץ לקו דק ונפתח לסקשן הבא */
/* בלי GSAP ובהפחתת תנועה: שני הסקשנים זה מתחת לזה. ההצמדה, הקו והחיתוך רק כשהמהלך רץ (.is-live) */
.so{position:relative}
.so-a{display:grid;place-content:center;justify-items:center;gap:16px;min-height:70svh;padding:var(--gutter, clamp(24px, 5vw, 96px));background:var(--ink, #16182b);color:var(--bg, #f7f7fa);text-align:center}
.so-word{margin:0;font-size:clamp(72px,14vw,220px);font-weight:700;line-height:1;letter-spacing:-.02em}
.so-tag{margin:0;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));color:color-mix(in oklab,var(--bg, #f7f7fa) 72%,transparent)}
.so-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px);min-height:80svh;padding:var(--gutter, clamp(24px, 5vw, 96px));background:var(--bg, #f7f7fa);color:var(--ink, #16182b)}
.so-txt{display:grid;gap:14px;max-width:40ch;justify-self:center}
.so-txt h2{margin:0;font-size:clamp(32px,3.8vw,60px);font-weight:700;line-height:1.08;text-wrap:balance}
.so-txt p{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.so-photo{margin:0;justify-self:center;width:100%;max-width:560px;aspect-ratio:5/4;max-height:68svh;overflow:hidden;border-radius:24px}
.so-photo img{display:block;width:100%;height:100%;object-fit:cover}
.so-line{display:none}
.so.is-live{height:300svh}
.so.is-live .so-pin{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--ink, #16182b)}
.so.is-live .so-a,.so.is-live .so-b{position:absolute;inset:0;min-height:0}
.so.is-live .so-b{clip-path:inset(50% 0 50% 0)}
.so.is-live .so-line{display:block;position:absolute;inset-inline:0;top:50%;height:2px;translate:0 -50%;z-index:2;pointer-events:none;
  background:var(--bg, #f7f7fa);box-shadow:0 0 24px 4px color-mix(in oklab,var(--accent, #4a3aff) 70%,transparent),0 0 2px 0 var(--bg, #f7f7fa);opacity:0}
@media(max-width:767px){
  .so-b{grid-template-columns:minmax(0,1fr);align-content:center;gap:20px}
  .so-photo{order:-1;aspect-ratio:16/10;max-height:34svh}
}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage full" style="padding-block:0"><div class="so">
  <div class="so-pin">
    <section class="so-a"><h2 class="so-word">סטודיו נור</h2><p class="so-tag">צילום אדריכלות ופנים</p></section>
    <section class="so-b">
      <div class="so-txt"><h2>מצלמים את הדירה כשהאור נכנס אליה</h2><p>כל צילום נקבע לשעה שבה החדר נראה הכי טוב. בדרך כלל זה בוקר, ולפעמים הרבה לפני שהדיירים קמים.</p></div>
      <figure class="so-photo"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s02/night-room.webp" alt="חדר שינה לבן עם מנורות קש תלויות" width="2000" height="1333" loading="lazy" decoding="async"></figure>
    </section>
    <span class="so-line" aria-hidden="true"></span>
  </div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;      // בלי GSAP שני הסקשנים זה מתחת לזה
  const root=document.querySelector(".so"),pin=root.querySelector(".so-pin"),A=root.querySelector(".so-a"),B=root.querySelector(".so-b"),
    word=root.querySelector(".so-word"),tag=root.querySelector(".so-tag"),line=root.querySelector(".so-line"),img=B.querySelector("img");
  // בהפחתת תנועה הפונקציה לא רצה, והסקשנים נשארים זה מתחת לזה
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("is-live");
    // הקו מתחיל ברוחב השם עצמו, כך שהמעבר מהשם לקו לא קופץ
    const ratio=()=>Math.min(word.offsetWidth/pin.clientWidth,1);
    gsap.set(line,{scaleX:ratio,opacity:0});
    const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6,invalidateOnRefresh:true}});
    tl.to({},{duration:.12})
      .to(tag,{opacity:0,duration:.1})
      .to(word,{scaleY:.012,scaleX:1.04,duration:.26,ease:"power3.in"},"<")
      .to(word,{opacity:0,duration:.04},">-.04")
      .to(line,{opacity:1,duration:.04},"<")
      .to(line,{scaleX:1,duration:.22,ease:"power2.out"},">")
      .to({},{duration:.1})
      .fromTo(B,{clipPath:"inset(50% 0% 50% 0%)"},{clipPath:"inset(0% 0% 0% 0%)",duration:.5,ease:"power2.inOut"})
      .fromTo(img,{scale:1.18},{scale:1,duration:.5},"<")
      .to(line,{opacity:0,duration:.14},"<.04")
      .to({},{duration:.1});
    return()=>{root.classList.remove("is-live");gsap.set([word,tag,line,B,img],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
