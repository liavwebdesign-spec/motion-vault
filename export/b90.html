<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B90 · גשם בלילה וקרן פנס שסורקת אותו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B90 · גשם בלילה וקרן פנס שסורקת אותו */
.rb{position:relative;isolation:isolate;display:grid;align-items:end;min-height:clamp(420px,64vh,620px);padding:clamp(32px,6vw,88px);background:var(--ink, #16182b);color:var(--bg, #f7f7fa);overflow:hidden}
.rb-art{position:absolute;inset:0;z-index:-1;overflow:hidden}
.rb-fb,.rb-cv{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s cubic-bezier(.2,.6,.2,1)}
.rb-fb{background:repeating-linear-gradient(104deg,transparent 0 23px,color-mix(in srgb,var(--bg, #f7f7fa) 13%,transparent) 23px 24px,transparent 24px 47px);-webkit-mask-image:linear-gradient(rgb(0 0 0),transparent 94%);mask-image:linear-gradient(rgb(0 0 0),transparent 94%)}
.rb-cv{opacity:0}
.rb-art.is-on .rb-cv{opacity:1}
.rb-art.is-on .rb-fb{opacity:0}
.rb-beam{position:absolute;top:0;right:0;width:200%;height:200%;transform-origin:100% 0;will-change:transform;background:conic-gradient(from 0deg at 100% 0,transparent 0 204deg,color-mix(in srgb,var(--bg, #f7f7fa) 20%,transparent) 224deg,color-mix(in srgb,var(--bg, #f7f7fa) 20%,transparent) 240deg,transparent 260deg 360deg);-webkit-mask-image:radial-gradient(circle farthest-corner at 100% 0,rgb(0 0 0) 20%,transparent 55%);mask-image:radial-gradient(circle farthest-corner at 100% 0,rgb(0 0 0) 20%,transparent 55%)}
.rb-flare{position:absolute;top:0;right:0;width:min(70vw,560px);aspect-ratio:1;translate:50% -50%;background:radial-gradient(circle,color-mix(in srgb,var(--bg, #f7f7fa) 60%,transparent),color-mix(in srgb,var(--bg, #f7f7fa) 14%,transparent) 30%,transparent 62%)}
.rb-in{display:grid;gap:20px;justify-items:start;justify-self:end;max-width:560px}
.rb-in h2{margin:0;font-size:clamp(30px,4vw,56px);line-height:1.12;text-wrap:balance}
.rb-in p{margin:0;max-width:44ch;color:color-mix(in srgb,var(--bg, #f7f7fa) 78%,transparent);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.rb-cta{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:99px;background:var(--bg, #f7f7fa);color:var(--ink, #16182b);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.rb-cta:hover{transform:translateY(-2px)}}
.rb-cta:focus-visible{outline:2px solid var(--bg, #f7f7fa);outline-offset:4px}
@media(max-width:767px){.rb-in{justify-self:stretch}}
@media(prefers-reduced-motion:reduce){.rb-fb,.rb-cv{transition:none}}
</style>
</head>
<body>

<div class="stage"><section class="rb" aria-labelledby="rb-h">
  <div class="rb-art" aria-hidden="true"><span class="rb-fb"></span><canvas class="rb-cv"></canvas><span class="rb-beam"></span><span class="rb-flare"></span></div>
  <div class="rb-in">
    <h2 id="rb-h">שומרים על העסק שלכם גם כשהכול חשוך</h2>
    <p>סיור לילי, מצלמות עם התראה בזמן אמת וצוות שמגיע תוך דקות. את הדוח אתם מקבלים כל בוקר בטלפון.</p>
    <a class="rb-cta" href="#rb-h">קבלו הצעה לאבטחה</a>
  </div>
</section></div>


<script>
(function(){
  const root=document.querySelector(".rb"),art=root.querySelector(".rb-art"),cv=art.querySelector(".rb-cv"),beam=art.querySelector(".rb-beam");
  const ctx=cv.getContext("2d"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LEAN=Math.tan(14*Math.PI/180),BASE=38;   // BASE: זווית מרכז הקרן מתחת לאופק, כשהיא לא מוסטת
  let W=0,H=0,drops=[],vis=false,raf=0,prev=0,rgb="230,230,240";
  // צבע הטיפות נקרא מהטוקן בזמן ריצה
  const probe=document.createElement("canvas").getContext("2d");
  function bgRGB(){
    probe.fillStyle="#000";probe.fillStyle=getComputedStyle(root).getPropertyValue("--bg").trim()||"#ccc";const h=probe.fillStyle;
    if(h.charAt(0)==="#")return[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)).join(",");
    return h.slice(h.indexOf("(")+1,h.lastIndexOf(")")).split(",").slice(0,3).map(parseFloat).join(",");
  }
  function seed(){
    const n=Math.round(Math.max(60,Math.min(160,W*H/5200)));let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
    drops=Array.from({length:n},()=>({x:r()*(W+H*LEAN),y:r()*H,l:12+r()*24,v:.55+r()*.9}));
  }
  // a: הסטת הקרן במעלות. כל טיפה מקבלת קבוצת שקיפות לפי הקרבה לציר הקרן, וכל קבוצה מצוירת בקריאה אחת
  function draw(dt,a){
    ctx.clearRect(0,0,W,H);
    const c=BASE-a,diag=Math.hypot(W,H),b=[[],[],[]];
    for(let i=0;i<drops.length;i++){
      const d=drops[i],sp=dt*(380+d.v*520);
      d.y+=sp;d.x-=sp*LEAN;
      if(d.y>H+d.l){d.y=-d.l;d.x=Math.random()*(W+H*LEAN);}
      const dx=W-d.x,ang=Math.atan2(d.y,dx)*57.2958,dist=Math.hypot(dx,d.y)/diag;
      const lit=Math.max(0,Math.min(1,1-(Math.abs(ang-c)-8)/20))*Math.max(0,1-dist*.9);
      b[lit>.5?2:lit>.16?1:0].push(d);
    }
    const al=[.13,.34,.7];
    for(let k=0;k<3;k++){
      ctx.strokeStyle="rgba("+rgb+","+al[k]+")";ctx.lineWidth=k===2?1.4:1;ctx.beginPath();
      for(let j=0;j<b[k].length;j++){const d=b[k][j];ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.l*LEAN,d.y+d.l);}
      ctx.stroke();
    }
  }
  function loop(now){
    raf=0;if(!vis)return;
    const dt=Math.min(.05,(now-prev)/1000||0);prev=now;
    const a=12*Math.sin(now/3400)+3;
    beam.style.transform="rotate("+a.toFixed(2)+"deg)";draw(dt,a);
    raf=requestAnimationFrame(loop);
  }
  function build(){
    const dpr=Math.min(2,devicePixelRatio||1),r=art.getBoundingClientRect();W=r.width;H=r.height;if(!W||!H)return;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    rgb=bgRGB();seed();draw(0,0);
  }
  new ResizeObserver(build).observe(art);
  new IntersectionObserver(es=>{
    vis=es[0].isIntersecting;
    if(vis){art.classList.add("is-on");if(!reduced&&!raf){prev=performance.now();raf=requestAnimationFrame(loop);}}
  },{rootMargin:"10% 0px"}).observe(root);
  if(reduced)art.classList.add("is-on");   // פריים אחד, בלי לולאה
  build();
})();
</script>
</body>
</html>
