<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LM7 · אוצר ההובר: לחיצה / הרמה / צמיחה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-a{background:linear-gradient(160deg,#3b5bdb,#748ffc)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding-inline:28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:500;font-size:16px;border:0;cursor:pointer;font-family:inherit}

/* LM7 · אוצר ההובר: לחיצה / הרמה / צמיחה */
.hv{display:flex;gap:var(--gap, clamp(16px, 1.6vw, 36px));justify-content:center;flex-wrap:wrap;align-items:center}
.hv .ph{width:220px;height:150px;font-size:15px;text-decoration:none}
/* משפחת ההובר של שכבת הבסיס (engine/motion.md 3). משפחה אחת לאלמנט.
   לונגהנדס ולא transition מקוצר, כדי לא לדרוס את המעבר של האלמנט עצמו. מעבר נוסף של המארח נכנס לאותה רשימה */
.press{transition-property:transform;transition-duration:.3s;transition-timing-function:cubic-bezier(.2,.6,.2,1)}
.liftd{transition-property:transform,box-shadow,border-color;transition-duration:.4s,.3s,.3s;transition-timing-function:cubic-bezier(.2,.6,.2,1)}
.grow{transition-property:transform,background-color,border-color,box-shadow,color;transition-duration:.3s,.18s,.18s,.18s,.18s;transition-timing-function:cubic-bezier(.2,.6,.2,1)}
/* צל וגבול: גם בהפחתת תנועה. הגבול נצבע רק בכרטיס שיש לו גבול, ומתכהה בגוון המשטח, לא במבטא */
@media (hover:hover) and (pointer:fine){
  .liftd:hover{box-shadow:0 14px 32px rgba(22,24,43,.14);border-color:color-mix(in srgb,var(--line, #e4e4ee),var(--ink, #16182b) 22%)}
}
.liftd:focus-visible{box-shadow:0 14px 32px rgba(22,24,43,.14);border-color:color-mix(in srgb,var(--line, #e4e4ee),var(--ink, #16182b) 22%)}
/* תזוזה: רק עם עכבר אמיתי (במגע ההובר נתקע) ורק כשתנועה מותרת */
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
  .press:hover{transform:scale(.97)}
  .liftd:hover{transform:translateY(-5px)}
  .grow:hover{transform:scale(1.06)}
}
/* המקבילה למקלדת, ולחיצת הכפתור (0.12 שנייה) */
@media (prefers-reduced-motion:no-preference){
  .press:focus-visible{transform:scale(.97)}
  .liftd:focus-visible{transform:translateY(-5px)}
  .grow:focus-visible{transform:scale(1.06)}
  .grow:active{transform:scale(.98);transition-duration:.12s,.18s,.18s,.18s,.18s}
}
</style>
</head>
<body>

<div class="stage tight"><div class="hv">
<a class="ph ph-c press" href="#"><span class="ph-l">מדיה: נלחצת פנימה</span></a>
<a class="ph ph-a liftd" href="#"><span class="ph-l">כרטיס תוכן: מתרומם</span></a>
<button class="gbtn grow">CTA: צומח</button>
</div></div>


<script>
document.querySelectorAll('.hv a[href="#"]').forEach(a=>a.addEventListener("click",e=>e.preventDefault()));
</script>
</body>
</html>
