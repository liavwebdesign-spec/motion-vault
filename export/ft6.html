<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FT6 · פוטר נחיתה בשורה אחת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* FT6 · פוטר נחיתה בשורה אחת */
/* ---- demo frame and page tail (scaffolding, not part of the footer) ---- */
.fx{margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--bg, #f7f7fa);isolation:isolate}
.fx-end{display:grid;gap:12px;padding:72px 32px}
.fx-end small{font-size:13px;font-weight:600;color:var(--muted, #6a6d85)}
.fx-end p{margin:0;max-width:52ch;font-size:16px;line-height:1.6;color:var(--muted, #6a6d85)}

/* ---- the mandatory atoms every footer carries ---- */
.ftw{font-size:15px;line-height:1.6}
.ftw a{color:inherit;text-decoration:none;transition:color .15s cubic-bezier(.2,.6,.2,1),opacity .15s cubic-bezier(.2,.6,.2,1)}
.ftw h3{margin:0 0 12px;font-size:14px;font-weight:600;opacity:.62}
.ftw ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ft-tel{unicode-bidi:isolate;font-weight:600}
.ft-legal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:13px}
.ft-legal p{margin:0;opacity:.7}
.ft-legal nav{display:flex;flex-wrap:wrap;gap:8px 20px}
.ft-legal nav a{opacity:.7}
.ft-credit{margin-inline-start:auto!important}
.ft-credit a{opacity:.7}
@media (hover:hover) and (pointer:fine){.ftw a:hover,.ft-legal nav a:hover,.ft-credit a:hover{opacity:1;color:var(--accent, #4a3aff)}}
.ft-dark{background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
@media (hover:hover) and (pointer:fine){.ft-dark a:hover,.ft-dark .ft-legal nav a:hover,.ft-dark .ft-credit a:hover{color:color-mix(in srgb,var(--accent, #4a3aff) 45%,var(--bg, #f7f7fa))}}
.ft-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 28px;border-radius:12px;border:0;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff)!important;
  font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .18s cubic-bezier(.2,.6,.2,1),background .2s cubic-bezier(.2,.6,.2,1)}
.ft-btn svg{width:18px;height:18px}
@media (hover:hover) and (pointer:fine){.ft-btn:hover{transform:translateY(-2px)}}
.ft-rv{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s cubic-bezier(.2,.6,.2,1);transition-delay:calc(var(--i,0) * 80ms)}
.is-in .ft-rv{opacity:1;transform:none}
@media (max-width:760px){.ft-credit{margin-inline-start:0!important;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.ftw *,.ft-rv{transition-duration:.01ms!important;transition-delay:0s!important}.ft-rv{opacity:1;transform:none}}
.ft6{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px;padding:28px 32px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
.ft6 b{font-size:18px}
.ft6 .ft-legal{flex:1 1 480px}
/* in a column the 480px flex-basis becomes a HEIGHT and stretches the footer to a screen: reset it (caught in the 500px shot) */
@media (max-width:760px){.ft6{padding:28px 20px;flex-direction:column;align-items:flex-start}.ft6 .ft-legal{flex:none}}
</style>
</head>
<body>

<div class="fx"><div class="fx-end"><small>הסקשן האחרון בעמוד</small><p>בדף נחיתה הסוגר עושה את העבודה, והפוטר רק עומד בחובות.</p></div>
<footer class="ftw ft6" id="ft6"><b>לוגו</b><a class="ft-tel" href="tel:+972500000000" dir="ltr">050-000-0000</a><div class="ft-legal"><p>© <span data-year>2026</span> סטודיו פילאטיס לדוגמה. כל הזכויות שמורות.</p><nav aria-label="מסמכים"><a href="#privacy">מדיניות פרטיות</a><a href="#accessibility">הצהרת נגישות</a></nav><p class="ft-credit"><a href="https://liavmatzri.co.il" rel="noopener" target="_blank">עוצב ופותח על ידי ליאב מצרי</a></p></div></footer></div>


<script>
document.querySelectorAll("[data-year]").forEach(function(e){e.textContent=new Date().getFullYear();});
function inView(el,f){
  function chk(){var r=el.getBoundingClientRect();if(r.top<innerHeight*.9&&r.bottom>0){off();f();}}
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);}
  addEventListener("scroll",chk,{passive:true});addEventListener("resize",chk);requestAnimationFrame(chk);setTimeout(chk,300);
}
</script>
</body>
</html>
