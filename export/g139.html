<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G139 · כותרת שנמחקת בקו ומוחלפת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G139 · כותרת שנמחקת בקו ומוחלפת */
.sk2{min-height:120vh;display:grid;place-items:center;padding-inline:var(--gutter, clamp(24px, 5vw, 96px));text-align:center}
.sk2-old{position:relative;display:inline-block;font-size:clamp(30px,5.5vw,76px);font-weight:800;line-height:1.15;color:var(--ink, #16182b);margin:0}
.sk2-old i{position:absolute;inset-inline:-.1em;top:50%;height:.12em;translate:0 -50%;background:var(--accent, #4a3aff);transform:scaleX(0);transform-origin:100% 50%;border-radius:4px}
html[dir="ltr"] .sk2-old i{transform-origin:0 50%}
.sk2-new{font-size:clamp(34px,6.5vw,92px);font-weight:900;line-height:1.1;color:var(--accent, #4a3aff);margin:.2em 0 0;opacity:0;translate:0 30px}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="sk2"><div>
  <h2 class="sk2-old">אתר שנראה טוב<i aria-hidden="true"></i></h2>
  <h2 class="sk2-new">אתר שמביא לקוחות</h2>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(".sk2-old i",{scaleX:1});gsap.set(".sk2-old",{opacity:.4});gsap.set(".sk2-new",{opacity:1,translate:"0 0"});return;}
  gsap.timeline({scrollTrigger:{trigger:".sk2",start:"top 60%",end:"center 40%",scrub:.5}})
    .to(".sk2-old i",{scaleX:1,duration:1,ease:"power3.inOut"})
    .to(".sk2-old",{opacity:.4,duration:.4},.5)
    .to(".sk2-new",{opacity:1,translate:"0 0",duration:.8,ease:"power3.out"},.6);
})();
</script>
</body>
</html>
