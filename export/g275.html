<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G275 · פסי תנועה אופקיים שחולפים מאחורי הנושא</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G275 · פסי תנועה אופקיים שחולפים מאחורי הנושא */
.sl{position:relative;height:260vh;height:260svh}
.sl-pin{position:sticky;top:0;height:100vh;height:100svh;overflow:clip;display:grid;grid-template-rows:auto minmax(0,1fr);gap:24px;padding:clamp(24px,4vw,56px);border-radius:clamp(20px,2.4vw,32px);background:color-mix(in oklab,var(--accent, #4a3aff) 7%,var(--card, #fff));color:var(--ink, #16182b)}
.sl-head{position:relative;z-index:2;display:grid;gap:10px;justify-items:center;text-align:center}
.sl-head h2{margin:0;font-size:clamp(26px,3.6vw,52px);font-weight:800;line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.sl-head p{margin:0;max-width:44ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.55}
.sl-track{position:relative;display:grid;place-items:center;min-height:0}
.sl-word{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(132px,31vw,460px);font-weight:900;line-height:.8;white-space:nowrap;color:transparent;-webkit-text-stroke:2px color-mix(in oklab,var(--ink, #16182b) 18%,transparent);pointer-events:none}
.sl-subject{position:relative;width:min(540px,76vw,calc((100svh - 280px) * 1.333));aspect-ratio:4 / 3;will-change:transform}
.sl-subject img{position:relative;z-index:1;display:block;width:100%;height:100%;border-radius:clamp(14px,1.6vw,24px);object-fit:cover}
/* הפסים יוצאים מהקצה הימני של התמונה, מאחוריה. הרוחב הסופי הוא זנב קצר (--v) */
/* פסי רקע שחולפים על פני כל הבמה בזמן הכניסה. מוצגים רק כשהמהלך חי (is-live) ונעים מחוץ למסך בסיום */
.sl-ghost{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.sl.is-live .sl-ghost{visibility:visible}
.sl-ghost i{position:absolute;left:0;top:var(--t);width:var(--w);height:var(--h);border-radius:2px;background:linear-gradient(90deg,var(--c,color-mix(in oklab,var(--ink, #16182b) 40%,transparent)),transparent);will-change:transform}
.sl-lines{position:absolute;inset:0;pointer-events:none}
.sl-lines i{position:absolute;left:calc(100% - 8px);top:var(--t);width:var(--v);height:var(--h);transform-origin:0 50%;border-radius:2px;background:linear-gradient(90deg,var(--c,color-mix(in oklab,var(--ink, #16182b) 55%,transparent)) 0 40%,transparent);will-change:transform}
@media(max-width:767px){.sl-pin{gap:16px;padding:24px 16px}.sl-subject{width:min(540px,76vw)}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="sl">
  <div class="sl-pin">
    <header class="sl-head">
      <h2>ואן מוכן לטיול, מהאיסוף ועד ההחזרה</h2>
      <p>מקבלים רכב נקי עם ציוד קמפינג מלא ומסלולים מוכנים, ומחזירים בכל אחד מהסניפים.</p>
    </header>
    <div class="sl-track">
      <span class="sl-word" aria-hidden="true">בדרך</span>
      <div class="sl-ghost" aria-hidden="true">
        <i style="--t:8%;--w:44%;--h:2px"></i>
        <i style="--t:22%;--w:58%;--h:3px"></i>
        <i style="--t:36%;--w:36%;--h:2px"></i>
        <i style="--t:48%;--w:64%;--h:2px;--c:var(--accent)"></i>
        <i style="--t:60%;--w:40%;--h:3px"></i>
        <i style="--t:71%;--w:52%;--h:2px"></i>
        <i style="--t:83%;--w:34%;--h:3px;--c:var(--accent)"></i>
        <i style="--t:93%;--w:60%;--h:2px"></i>
      </div>
      <div class="sl-subject">
        <div class="sl-lines" aria-hidden="true">
          <i style="--t:-8%;--v:46px;--h:2px" data-g="62"></i>
          <i style="--t:-2%;--v:18px;--h:3px" data-g="38"></i>
          <i style="--t:5%;--v:72px;--h:2px;--c:var(--accent)" data-g="80"></i>
          <i style="--t:12%;--v:30px;--h:2px" data-g="30"></i>
          <i style="--t:18%;--v:56px;--h:3px" data-g="54"></i>
          <i style="--t:24%;--v:22px;--h:2px" data-g="72"></i>
          <i style="--t:30%;--v:64px;--h:3px" data-g="34"></i>
          <i style="--t:37%;--v:38px;--h:2px;--c:var(--accent)" data-g="66"></i>
          <i style="--t:43%;--v:16px;--h:2px" data-g="44"></i>
          <i style="--t:49%;--v:80px;--h:3px" data-g="76"></i>
          <i style="--t:55%;--v:34px;--h:2px" data-g="36"></i>
          <i style="--t:62%;--v:52px;--h:2px" data-g="58"></i>
          <i style="--t:68%;--v:24px;--h:3px;--c:var(--accent)" data-g="70"></i>
          <i style="--t:75%;--v:68px;--h:2px" data-g="40"></i>
          <i style="--t:81%;--v:42px;--h:2px" data-g="60"></i>
          <i style="--t:89%;--v:20px;--h:3px" data-g="28"></i>
          <i style="--t:96%;--v:60px;--h:2px" data-g="50"></i>
          <i style="--t:104%;--v:28px;--h:2px;--c:var(--accent)" data-g="64"></i>
        </div>
        <img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s12/dusk-camp.webp" width="1000" height="1000" alt="ואן לבן בשטח פתוח בשעת שקיעה וחבורת חברים לידו" loading="lazy" decoding="async">
      </div>
    </div>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP התמונה במרכז וקצוות הפסים קצרים (במארקאפ)
  const root=document.querySelector(".sl"),track=root.querySelector(".sl-track"),subj=root.querySelector(".sl-subject"),word=root.querySelector(".sl-word"),lines=gsap.utils.toArray(".sl-lines i",root),ghosts=gsap.utils.toArray(".sl-ghost i",root);
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const half=()=>subj.offsetWidth/2;
    const GS=[.02,.12,0,.2,.07,.16,.04,.1],GD=[.62,.55,.7,.5,.66,.58,.72,.6];     // התחלה ומשך של כל פס רקע, בחלקי הטיימליין
    root.classList.add("is-live");
    const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6,invalidateOnRefresh:true}});
    // התמונה נכנסת מימין ומאטה. מהירות בעקומה הזו יורדת ליניארית, ולכן אורך הפסים יורד ב-ease:none
    tl.fromTo(subj,{x:()=>track.offsetWidth/2+half()*1.1},{x:0,duration:1,ease:"power1.out"},0);
    tl.fromTo(word,{xPercent:8},{xPercent:-8,duration:1},0);
    // פסי הרקע חולפים מימין לשמאל על פני כל הבמה במהירות קבועה, ויוצאים לפני שהתמונה נעצרת
    ghosts.forEach((el,i)=>{
      tl.fromTo(el,{x:()=>track.offsetWidth},{x:()=>-el.offsetWidth-40,duration:GD[i],ease:"none"},GS[i]);
    });
    lines.forEach((el,i)=>{
      const v=parseFloat(el.style.getPropertyValue("--v")),g=parseFloat(el.dataset.g);
      tl.fromTo(el,{scaleX:()=>(v+g*window.innerWidth/100)/v},{scaleX:1,duration:.62+(i%6)*.056},0);
    });
    return()=>{root.classList.remove("is-live");gsap.set([subj,word,...lines,...ghosts],{clearProps:"transform"});};
  });
})();
</script>
</body>
</html>
