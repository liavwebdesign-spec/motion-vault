<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS17 · פס התקדמות קריאה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS17 · פס התקדמות קריאה */
.rprog{position:fixed;top:0;inset-inline:0;height:4px;background:linear-gradient(90deg,#4a3aff,#c2255c);transform-origin:right;transform:scaleX(0);animation:grow linear;animation-timeline:scroll();z-index:99}
html[dir="ltr"] .rprog{transform-origin:left}
@keyframes grow{to{transform:scaleX(1)}}
.longtext{max-width:640px;margin-inline:auto;color:var(--muted, #6a6d85);padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.longtext p{margin:0 0 60vh}
</style>
</head>
<body>
<div class="rprog"></div>
<div class="stage tight longtext">
<p>גלול וצפה בפס למעלה מתמלא. אפס JavaScript.</p>
<p>הקסם: animation-timeline: scroll() קושר את האנימציה לגלילת העמוד.</p>
<p>וזה כל הסיפור.</p>
</div>


</body>
</html>
