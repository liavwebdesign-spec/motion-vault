<head>

<title>G268 · פסיפס צילומים שצץ מהמרכז עם מונים רצים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G268 · פסיפס צילומים שצץ מהמרכז עם מונים רצים */
.fm{position:relative;isolation:isolate;max-width:1180px;margin-inline:auto;overflow:hidden;border-radius:clamp(16px,2vw,28px);background:var(--card, #fff)}
.fm .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.fm-grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px}
.fm-t{position:relative;aspect-ratio:1;overflow:hidden;background:var(--line, #e4e4ee)}
.fm-t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fm::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 28%,color-mix(in oklab,var(--ink, #16182b) 66%,transparent) 100%)}
.fm-over{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:var(--gutter, clamp(24px, 5vw, 96px))}
.fm-card{display:grid;gap:16px;width:min(540px,100%);padding:clamp(20px,3vw,40px);border-radius:clamp(18px,2vw,28px);background:var(--card, #fff);color:var(--ink, #16182b);text-align:center;box-shadow:0 32px 60px -32px color-mix(in oklab,var(--ink, #16182b) 70%,transparent)}
.fm-nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.fm-nums p{margin:0;display:grid;gap:4px}
.fm-nums b{font-size:clamp(34px,5vw,64px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fm-nums span{color:var(--muted, #6a6d85);font-size:clamp(14px,1.2vw,17px);line-height:1.3}
.fm-cap{margin:0;color:var(--muted, #6a6d85);font-size:clamp(15px,1.3vw,18px);line-height:1.4}
@media(max-width:767px){
  .fm-grid{grid-template-columns:repeat(10,minmax(0,1fr))}
  .fm-over{padding:16px}
  .fm-card{gap:12px;padding:20px 16px}
  .fm-nums{gap:12px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;      // בלי GSAP הפסיפס המלא והמספרים הסופיים כבר במארקאפ
  const root=document.querySelector(".fm"),grid=root.querySelector(".fm-grid"),tiles=[...grid.children],card=root.querySelector(".fm-card"),nums=[...root.querySelectorAll(".fm-nums b")];
  const to=nums.map(b=>parseInt(b.dataset.to,10)),fmt=n=>Math.round(n).toLocaleString("he-IL");
  const r=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};      // סטייה קבועה לכל אריח, בלי Math.random
  // בהפחתת תנועה הפונקציה לא רצה, והפסיפס והמספרים נשארים
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const cols=getComputedStyle(grid).gridTemplateColumns.split(" ").length,rows=Math.ceil(tiles.length/cols),cx=(cols-1)/2,cy=(rows-1)/2;
    const o=nums.map(()=>({v:0}));
    nums.forEach(b=>{b.textContent="0";});
    const tl=gsap.timeline({paused:true});
    tiles.forEach((t,i)=>{
      const d=Math.hypot(i%cols-cx,Math.floor(i/cols)-cy),at=d*.055+r(i)*.2;      // הגל: המרחק מהמרכז ועוד סטייה קטנה
      tl.fromTo(t,{scale:.15+r(i+99)*.3,autoAlpha:0},{scale:1,autoAlpha:1,duration:.5+r(i+7)*.3,ease:"power3.out"},at);
    });
    nums.forEach((b,k)=>tl.to(o[k],{v:to[k],duration:2.2,ease:"power2.out",onUpdate:()=>{b.textContent=fmt(o[k].v);}},.2+k*.15));
    tl.fromTo(card,{autoAlpha:0,y:18,scale:.96},{autoAlpha:1,y:0,scale:1,duration:.7,ease:"power2.out"},.5);
    ScrollTrigger.create({trigger:root,start:"top 72%",once:true,onEnter:()=>tl.play()});
    return()=>{nums.forEach((b,k)=>{b.textContent=fmt(to[k]);});gsap.set([...tiles,card],{clearProps:"all"});};
  });
})();
</script>
