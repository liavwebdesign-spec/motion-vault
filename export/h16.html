<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>H16 · הירו עם טופס לידים בתוך ההירו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* H16 · הירו עם טופס לידים בתוך ההירו */
/* ---- demo frame and top row (scaffolding, not part of the hero) ---- */
.hf{position:relative;margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--bg, #f7f7fa);isolation:isolate}
.hf-top{position:absolute;inset-inline:0;top:0;z-index:6;display:flex;align-items:center;gap:24px;padding:20px 28px;font-size:15px;font-weight:500}
.hf-top b{font-size:18px;font-weight:800}
.hf-top nav{display:flex;gap:18px;margin-inline-start:auto;opacity:.8}
@media (max-width:760px){.hf-top nav{display:none}}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:12px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);text-decoration:none;
  font-size:16px;font-weight:600;white-space:nowrap;transition:transform .18s cubic-bezier(.2,.6,.2,1),box-shadow .3s cubic-bezier(.2,.6,.2,1)}
.hbtn.ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
@media (hover:hover) and (pointer:fine){.hbtn:hover{transform:translateY(-2px)}}
.hkick{font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.75}
.hlead{margin:0;font-size:clamp(17px,1.2vw,20px);line-height:1.55;opacity:.82}
.hmicro{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;opacity:.7}
.hcta{display:flex;flex-wrap:wrap;gap:12px}

/* the resting state is the visible one. opacity:1 on .rv also keeps the no-JS look identical to the look after the entrance */
.rv{opacity:1;transition:opacity .5s cubic-bezier(.2,.6,.2,1),transform .5s cubic-bezier(.2,.6,.2,1)}
.open-anim .rv{opacity:0;transform:translateY(18px);animation:rv-fs 0s 2.5s forwards}
/* --t0: on a page with a header, 0.2s so the header comes down first (motion.md 2) */
.is-in .rv{opacity:1;transform:none;transition-duration:.7s;transition-delay:calc(var(--t0,0s) + var(--i,0) * 90ms)}
.rv-on .rv{animation:none}
@keyframes rv-fs{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv,.is-in .rv{transition-duration:.01ms!important;transition-delay:0s!important}
  .hbtn{transition-duration:.01ms!important}.hbtn:hover{transform:none!important}}
.h16h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;min-height:min(84vh,760px);padding:88px 28px 28px;background:var(--bg, #f7f7fa)}
.h16-txt{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:24px;padding-block:24px 40px}
.h16h h3{margin:0;max-width:14ch;font-size:clamp(34px,min(4.4vw,7.8vh),70px);line-height:1.04;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.h16h .hlead{max-width:42ch}
.h16-box{align-self:stretch;display:flex;flex-direction:column}
/* the bar runs across the gap and 64px into the photo: one object, not a form beside a picture. A surface and a shadow, no border */
.h16-form{display:flex;align-items:stretch;gap:8px;width:calc(100% + 112px);padding:8px;border-radius:18px;background:var(--card, #fff);
  box-shadow:0 18px 48px -18px color-mix(in srgb,var(--ink, #16182b) 35%,transparent)}
.h16-form[hidden]{display:none}
.h16-f{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;padding:8px 16px;border-radius:12px;cursor:text;transition:background .2s cubic-bezier(.2,.6,.2,1)}
.h16-f span{font-size:12px;font-weight:600;color:var(--muted, #6a6d85)}
.h16-f input{width:100%;min-width:0;border:0;padding:0;background:none;color:var(--ink, #16182b);font:inherit;font-size:16px;font-weight:600;outline:none}
.h16-f input::placeholder{color:var(--muted, #6a6d85);font-weight:500;opacity:1}
.h16-f input[type="tel"]{text-align:right}
[dir="ltr"] .h16-f input[type="tel"]{text-align:left}
.h16-f:focus-within{background:color-mix(in srgb,var(--ink, #16182b) 6%,transparent)}
.h16-f[data-bad]{background:color-mix(in srgb,var(--accent, #4a3aff) 16%,transparent)}
.h16-form .hbtn{flex:none;border:0;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.h16-form .hbtn:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:3px}
.h16-done{margin:0;width:calc(100% + 112px);padding:20px 24px;border-radius:18px;background:var(--card, #fff);font-size:17px;font-weight:600;outline:none;
  box-shadow:0 18px 48px -18px color-mix(in srgb,var(--ink, #16182b) 35%,transparent)}
.h16-err{margin:0;font-size:14px;font-weight:600}
.h16-err:not(:empty){margin-top:12px}
.h16-vis{position:relative;border-radius:20px;overflow:hidden;background:var(--ink, #16182b);clip-path:inset(0 round 20px);transition:clip-path .9s cubic-bezier(.2,.6,.2,1)}
.h16-vis>img{width:100%;height:100%;object-fit:cover;object-position:40% 45%;display:block;transition:transform 1s cubic-bezier(.2,.6,.2,1)}
.open-anim .h16-vis{clip-path:inset(5% 8% round 20px);animation:h16v-fs 0s 2.5s forwards}
.open-anim .h16-vis>img{transform:scale(1.08);animation:rv-fs 0s 2.5s forwards}
.is-in .h16-vis{clip-path:inset(0 round 20px);transition-delay:var(--t0,0s)}
.is-in .h16-vis>img{transform:none;transition-delay:var(--t0,0s)}
.rv-on .h16-vis,.rv-on .h16-vis>img{animation:none}
@keyframes h16v-fs{to{clip-path:inset(0 round 20px)}}
/* a fact on the photo, not a decoration: the next free slot */
.h16-chip{position:absolute;inset-block-end:20px;inset-inline-end:20px;display:flex;flex-direction:column;gap:2px;margin:0;padding:12px 16px;border-radius:14px;background:var(--bg, #f7f7fa);color:var(--ink, #16182b);font-size:13px;
  box-shadow:0 12px 32px -12px color-mix(in srgb,var(--ink, #16182b) 40%,transparent)}
.h16-chip b{font-size:16px}
@media (prefers-reduced-motion:reduce){.h16-vis,.h16-vis>img{transition-duration:.01ms!important;transition-delay:0s!important}}
/* phone: the photo becomes a low band on top, the two fields sit side by side over a full-width button */
@media (max-width:860px){.h16h{grid-template-columns:1fr;gap:20px;min-height:0;padding:72px 20px 28px}
  .h16-vis{order:-1;height:clamp(150px,22vh,210px)}
  .h16-txt{padding-block:0;gap:16px}
  .h16h h3{font-size:clamp(28px,7.4vw,38px)}
  .h16-form,.h16-done{width:100%}
  .h16-form{flex-wrap:wrap}
  .h16-f{flex:1 1 40%}
  .h16-form .hbtn{flex:1 1 100%}
  .h16-chip{inset-block-end:12px;inset-inline-end:12px;padding:8px 12px}}
</style>
</head>
<body>

<script>if(matchMedia("(prefers-reduced-motion:no-preference)").matches)document.documentElement.classList.add("open-anim")</script>
<div class="hf"><div class="hf-top"><b>לוגו</b><nav><span>שירותים</span><span>פרויקטים</span><span>אודות</span></nav></div>
  <section class="h16h" id="h16">
    <div class="h16-txt">
      <span class="hkick rv">פיזיותרפיה ושיקום, רמת גן</span>
      <h3 class="rv">חוזרים לזוז בלי כאב, ובלי לחכות חודשיים לתור</h3>
      <p class="hlead rv">טיפול אישי של 45 דקות ותוכנית תרגילים לבית. משאירים שם וטלפון, ואנחנו מתקשרים לקבוע.</p>
      <div class="h16-box rv">
        <form class="h16-form" novalidate aria-label="השארת פרטים לתיאום תור">
          <label class="h16-f"><span>שם</span><input name="name" autocomplete="name" placeholder="השם שלך" enterkeyhint="next" aria-describedby="h16-err"></label>
          <label class="h16-f"><span>טלפון</span><input name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-0000000" dir="ltr" enterkeyhint="send" aria-describedby="h16-err"></label>
          <button class="hbtn" type="submit">קבעו לי תור</button>
        </form>
        <div aria-live="polite"><p class="h16-done" tabindex="-1" hidden></p></div>
        <p class="h16-err" id="h16-err" role="alert"></p>
      </div>
      <p class="hmicro rv"><span>מחזירים טלפון באותו יום</span><span>בלי התחייבות</span></p>
    </div>
    <div class="h16-vis">
      <img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s09/hero-corridor.webp" alt="פיזיותרפיסט וילדה עושים כיף במסדרון הקליניקה" fetchpriority="high" decoding="async">
      <p class="h16-chip rv"><span>תור פנוי השבוע</span><b>שלישי, 08:30</b></p>
    </div>
  </section>
</div>


<script>
// in view = fire. Measured directly on scroll and resize, not through IntersectionObserver:
// an observer does not update while the tab is throttled (and on a real site the hero is usually
// on screen at load anyway), and an entrance that never fires leaves the hero invisible.
function inView(el,f){
  var ro;
  function chk(){
    var r=el.getBoundingClientRect();
    if(r.top<innerHeight*.9&&r.bottom>0){off();f();}
  }
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);if(ro)ro.disconnect();}
  addEventListener("scroll",chk,{passive:true}); addEventListener("resize",chk);
  // a layout change with no scroll (a bar above it closes, a font swaps in) can also bring it into view
  if(window.ResizeObserver){ro=new ResizeObserver(chk);ro.observe(document.body);}
  requestAnimationFrame(chk); setTimeout(chk,300);
}
function enter(root){
  var els=root.querySelectorAll(".rv");
  els.forEach(function(el,i){if(!el.style.getPropertyValue("--i"))el.style.setProperty("--i",i);});
  // a script that ran late, after the 2.5s CSS failsafe already showed the hero: keep it shown, no second entrance
  if(els.length&&getComputedStyle(els[0]).opacity==="1")root.classList.add("is-in");
  root.classList.add("rv-on");
  inView(root,function(){root.classList.add("is-in");});
}
(function(){
  var root=document.getElementById("h16"); enter(root);
  var form=root.querySelector(".h16-form"), done=root.querySelector(".h16-done"), err=root.querySelector(".h16-err");
  var nm=form.querySelector('[name="name"]'), ph=form.querySelector('[name="tel"]');
  function mark(f,bad){f.parentNode.toggleAttribute("data-bad",bad); f.setAttribute("aria-invalid",String(bad));}
  [nm,ph].forEach(function(f){f.addEventListener("input",function(){if(f.getAttribute("aria-invalid")==="true")mark(f,false);});});
  // checked on send only, never while typing
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var n=nm.value.trim(), t=ph.value.replace(/\D/g,""), okN=n.length>1, okT=/^0\d{8,9}$/.test(t);
    mark(nm,!okN); mark(ph,!okT);
    if(!okN||!okT){err.textContent=okN?"מספר הטלפון לא נראה שלם. כדאי לבדוק את הקידומת":"חסר שם, כדי שנדע את מי לבקש בטלפון"; (okN?ph:nm).focus(); return;}
    err.textContent="";
    // in a project: send to the CRM first, and show the thanks only after it answered
    form.hidden=true; done.hidden=false; done.textContent="תודה, "+n+". נחזור אליך היום, עד 18:00."; done.focus();
  });
})();
</script>
</body>
</html>
