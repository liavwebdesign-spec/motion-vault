<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G255 · נרות מחירים שזורמים בזמן אמת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G255 · נרות מחירים שזורמים בזמן אמת */
.ca{--dn:color-mix(in oklab,var(--ink, #16182b) 55%,var(--card, #fff));max-width:1120px;margin-inline:auto;display:grid;gap:clamp(24px,4vw,48px)}
.ca .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ca-head{display:grid;gap:12px;max-width:54ch}
.ca-head h2{margin:0;font-size:clamp(28px,3.4vw,48px);line-height:1.12;text-wrap:balance}
.ca-head p{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.ca-card{margin:0;padding:clamp(16px,2.4vw,32px);border-radius:24px;background:var(--card, #fff);box-shadow:0 0 0 1px var(--line, #e4e4ee);display:grid;gap:clamp(16px,2.4vw,32px)}
.ca-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.ca-name{display:grid;gap:4px}
.ca-name b{font-size:clamp(18px,1.6vw,22px);line-height:1.25}
.ca-name small{color:var(--muted, #6a6d85);font-size:14px;line-height:1.4}
.ca-quote{display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.ca-big{font-size:clamp(48px,6.4vw,88px);font-weight:700;line-height:1;letter-spacing:-.02em}
.ca-cur{font-size:clamp(20px,2.4vw,32px);color:var(--muted, #6a6d85);font-weight:600}
.ca-chg{align-self:center;padding:6px 12px;border-radius:999px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in oklab,var(--accent, #4a3aff) 14%,var(--card, #fff));color:var(--accent, #4a3aff)}
.ca-chg.is-dn{background:color-mix(in oklab,var(--ink, #16182b) 10%,var(--card, #fff));color:var(--ink, #16182b)}
/* אזור הגרף: ריפוד פיזי לציר המחיר (בצד ההתחלה) ולתווית (בצד הסוף), והקנבס החי יושב על כל התיבה */
.ca-chart{position:relative;height:clamp(240px,46svh,460px);padding-inline:40px 72px}
.ca-plot{position:relative;height:100%}
.ca-svg{display:block;width:100%;height:100%}
.ca-svg:dir(rtl){transform:scaleX(-1)}
.ca-gl{fill:none;stroke:var(--line, #e4e4ee);stroke-width:1;stroke-dasharray:2 6;vector-effect:non-scaling-stroke}
.ca-wk{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
.ca-wk.u{stroke:var(--accent, #4a3aff)}
.ca-wk.d{stroke:var(--dn)}
.ca-bd.u{fill:var(--accent, #4a3aff)}
.ca-bd.d{fill:var(--dn)}
.ca-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent, #4a3aff);box-shadow:0 0 0 2px var(--card, #fff),0 0 0 7px color-mix(in oklab,var(--accent, #4a3aff) 22%,transparent)}
.ca-ov{position:absolute;inset:0}
.ca-ax{position:absolute;inset-inline-start:0;translate:0 -50%;font-size:12px;color:var(--muted, #6a6d85);font-variant-numeric:tabular-nums}
.ca-tag{position:absolute;inset-inline-end:0;translate:0 -50%;padding:6px 8px;border-radius:8px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ca-cv{position:absolute;inset:0;width:100%;height:100%}
/* המהלך רץ: הקנבס מחליף את ה-SVG הסטטי */
.ca.is-live .ca-plot,.ca.is-live .ca-ov{display:none}
@media(max-width:767px){
  .ca-chart{height:clamp(220px,40svh,320px);padding-inline:32px 64px}
  .ca-tag{font-size:12px}
}
</style>
</head>

  const MEAN=3.64,SUB=8,STEP_MS=110;
