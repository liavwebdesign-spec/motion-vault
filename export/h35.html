<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>H35 · הירו מצגת עם וילון בכיוון הקריאה וכותרת לכל תמונה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* H35 · הירו מצגת עם וילון בכיוון הקריאה וכותרת לכל תמונה */
/* ---- demo frame and top row (scaffolding, not part of the hero) ---- */
.hf{position:relative;margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--bg, #f7f7fa);isolation:isolate}
.hf-top{position:absolute;inset-inline:0;top:0;z-index:6;display:flex;align-items:center;gap:24px;padding:20px 28px;font-size:15px;font-weight:500}
.hf-top b{font-size:18px;font-weight:800}
.hf-top nav{display:flex;gap:18px;margin-inline-start:auto;opacity:.8}
@media (max-width:760px){.hf-top nav{display:none}}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:12px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);text-decoration:none;
  font-size:16px;font-weight:600;white-space:nowrap;transition:transform .18s cubic-bezier(.2,.6,.2,1),box-shadow .3s cubic-bezier(.2,.6,.2,1)}
.hbtn.ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
@media (hover:hover) and (pointer:fine){.hbtn:hover{transform:translateY(-2px)}}
.hkick{font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.75}
.hlead{margin:0;font-size:clamp(17px,1.2vw,20px);line-height:1.55;opacity:.82}
.hmicro{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;opacity:.7}
.hcta{display:flex;flex-wrap:wrap;gap:12px}

/* the resting state is the visible one. opacity:1 on .rv also keeps the no-JS look identical to the look after the entrance */
.rv{opacity:1;transition:opacity .5s cubic-bezier(.2,.6,.2,1),transform .5s cubic-bezier(.2,.6,.2,1)}
.open-anim .rv{opacity:0;transform:translateY(18px);animation:rv-fs 0s 2.5s forwards}
/* --t0: on a page with a header, 0.2s so the header comes down first (motion.md 2) */
.is-in .rv{opacity:1;transform:none;transition-duration:.7s;transition-delay:calc(var(--t0,0s) + var(--i,0) * 90ms)}
.rv-on .rv{animation:none}
@keyframes rv-fs{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv,.is-in .rv{transition-duration:.01ms!important;transition-delay:0s!important}
  .hbtn{transition-duration:.01ms!important}.hbtn:hover{transform:none!important}}

.hpp{width:44px;height:44px;flex:none;border:0;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  background:color-mix(in srgb,var(--ink, #16182b) 55%,transparent);color:var(--bg, #f7f7fa);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .18s cubic-bezier(.2,.6,.2,1)}
.hpp[hidden]{display:none}
.hpp svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hpp .i-play{display:none;fill:currentColor}
.hpp[aria-pressed="true"] .i-pause{display:none}
.hpp[aria-pressed="true"] .i-play{display:block}
.hpp:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.hpp:hover{background:color-mix(in srgb,var(--ink, #16182b) 75%,transparent)}}
.h35h{--off:inset(0 0 0 100%);position:relative;min-height:min(88vh,800px);display:flex;flex-direction:column;justify-content:flex-end;padding:112px 28px 28px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);overflow:clip;isolation:isolate}
/* הווילון נפתח מהצד שבו מתחילים לקרוא: ב-RTL מימין, ב-LTR משמאל */
[dir="ltr"] .h35h{--off:inset(0 100% 0 0)}
.h35-m{position:absolute;inset:0;z-index:0}
.h35-s{position:absolute;inset:0;margin:0;clip-path:var(--off);transition:none}
.h35-s img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);transition:transform 1.8s cubic-bezier(.2,.6,.2,1)}
/* החדשה מעל, נחשפת בכיוון הקריאה; הקודמת נשארת שלמה מתחתיה עד שהווילון נגמר */
.h35-s.is-on{z-index:2;clip-path:inset(0);transition:clip-path 1.1s cubic-bezier(.76,0,.24,1)}
.h35-s.is-on img,.h35-s.is-prev img{transform:none}
.h35-s.is-prev{z-index:1;clip-path:inset(0)}
/* הכניסה: גם התמונה הראשונה נכנסת בווילון. בלי JS היא פשוט שם */
.open-anim .h35-s.is-on{clip-path:var(--off);animation:h35w-fs 0s 2.5s forwards}
.open-anim .h35-s.is-on img{transform:scale(1.08)}
.is-in .h35-s.is-on{clip-path:inset(0);transition-delay:var(--t0,0s)}
.is-in .h35-s.is-on img{transform:none}
.rv-on .h35-s{animation:none}
@keyframes h35w-fs{to{clip-path:inset(0)}}
.h35-sh{position:absolute;inset:0;z-index:3;background:linear-gradient(to top,color-mix(in srgb,var(--ink, #16182b) 82%,transparent) 0%,color-mix(in srgb,var(--ink, #16182b) 38%,transparent) 45%,transparent 75%)}
.h35-bot{position:relative;z-index:4;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:32px}
.h35-txt{display:flex;flex-direction:column;align-items:flex-start;gap:20px;max-width:660px}
/* שלוש כותרות באותו תא: הגובה הוא של הארוכה, כך שהחלפה לא מזיזה את מה שמתחת */
.h35h h3{display:grid;margin:0;font-size:clamp(36px,min(4.8vw,7.8vh),78px);line-height:1.04;font-weight:700;letter-spacing:-.01em}
.h35-t{grid-area:1/1}
.h35-ln{display:block;overflow:hidden;padding-block:.04em}
.h35-ln>span{display:block;transform:translateY(105%);transition:transform .8s cubic-bezier(.2,.6,.2,1)}
.h35-t.is-on .h35-ln>span{transform:none;transition-delay:calc(.25s + var(--l) * 90ms)}
.h35-t.is-out .h35-ln>span{transform:translateY(-105%);transition-duration:.5s;transition-delay:0s}
/* כותרת שלא מוצגת ולא יוצאת: מוסתרת, וחוזרת למטה בלי מעבר כדי להיות מוכנה לפעם הבאה */
.h35-t:not(.is-on):not(.is-out){visibility:hidden}
.h35-t:not(.is-on):not(.is-out) .h35-ln>span{transition:none}
.open-anim .h35-t.is-on .h35-ln>span{transform:translateY(105%);animation:rv-fs 0s 2.5s forwards}
.is-in .h35-t.is-on .h35-ln>span{transform:none;transition-delay:calc(var(--t0,0s) + .25s + var(--l) * 90ms)}
.rv-on .h35-ln>span{animation:none}
.h35h .hlead{max-width:46ch;opacity:.9}
.h35-ctl{display:flex;align-items:center;gap:12px}
.h35-nav{width:48px;height:48px;flex:none;border:0;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  background:color-mix(in srgb,var(--bg, #f7f7fa) 16%,transparent);color:var(--bg, #f7f7fa);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .18s cubic-bezier(.2,.6,.2,1)}
.h35-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.h35-nav svg.flip,[dir="ltr"] .h35-nav svg{transform:scaleX(-1)}
[dir="ltr"] .h35-nav svg.flip{transform:none}
.h35-nav:focus-visible{outline:2px solid var(--bg, #f7f7fa);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.h35-nav:hover{background:color-mix(in srgb,var(--bg, #f7f7fa) 28%,transparent)}}
.h35-cnt{min-width:3.4em;font-size:15px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
/* פס הזמן הוא השעון: כשהוא מתמלא מגיעה התמונה הבאה, ועצירה שלו עוצרת הכל */
.h35-bar{position:relative;display:block;width:96px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--bg, #f7f7fa) 30%,transparent);overflow:hidden}
.h35-bar[hidden]{display:none}
.h35-bar i{position:absolute;inset:0;background:var(--bg, #f7f7fa);transform:scaleX(0);transform-origin:right}
[dir="ltr"] .h35-bar i{transform-origin:left}
.h35-bar.run i{animation:h35-fill 6s linear forwards}
@keyframes h35-fill{to{transform:scaleX(1)}}
.h35h.is-paused .h35-bar i,.h35h.is-off .h35-bar i,.h35h.is-hold .h35-bar i{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){
  .h35-s.is-on{transition-duration:.01ms}
  .h35-s img{transition:none;transform:none!important}
  .h35-ln>span{transition-duration:.01ms!important;transition-delay:0s!important}
}
@media (max-width:760px){
  .h35h{min-height:min(88vh,720px);padding:96px 20px 24px}
  .h35-bot{grid-template-columns:minmax(0,1fr);gap:24px}
  .h35h h3{font-size:clamp(30px,8.4vw,40px)}
  .h35-bar{width:64px}
}
</style>
</head>
<body>

<script>if(matchMedia("(prefers-reduced-motion:no-preference)").matches)document.documentElement.classList.add("open-anim")</script>
<div class="hf"><div class="hf-top" style="color:var(--bg)"><b>לוגו</b><nav><span>שירותים</span><span>פרויקטים</span><span>אודות</span></nav></div>
  <section class="h35h" id="h35" aria-roledescription="מצגת" aria-label="גלמפינג על החוף">
    <div class="h35-m" aria-hidden="true">
      <figure class="h35-s is-on"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/hero.webp" alt="" fetchpriority="high" decoding="async"></figure>
      <figure class="h35-s"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s12/dusk-camp.webp" alt="" decoding="async"></figure>
      <figure class="h35-s"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/sea.webp" alt="" decoding="async"></figure>
    </div>
    <span class="h35-sh"></span>
    <div class="h35-bot">
      <div class="h35-txt">
        <span class="hkick rv">גלמפינג על החוף, דור</span>
        <h3 aria-live="off">
          <span class="h35-t is-on"><span class="h35-ln"><span style="--l:0">אוהל עם נוף לים,</span></span><span class="h35-ln"><span style="--l:1">חמש דקות מהחוף</span></span></span>
          <span class="h35-t" aria-hidden="true"><span class="h35-ln"><span style="--l:0">ערב סביב האש,</span></span><span class="h35-ln"><span style="--l:1">אחרי יום בשקט</span></span></span>
          <span class="h35-t" aria-hidden="true"><span class="h35-ln"><span style="--l:0">בוקר עם קפה</span></span><span class="h35-ln"><span style="--l:1">מול הגלים</span></span></span>
        </h3>
        <p class="hlead rv">שמונה אוהלי ספארי עם מיטה אמיתית, מקלחת פרטית ומרפסת. ארוחת הבוקר מגיעה לאוהל.</p>
        <div class="hcta rv"><a class="hbtn" href="#h35">לבדיקת תאריכים</a><a class="hbtn ghost" href="#h35">האוהלים</a></div>
      </div>
      <div class="h35-ctl rv">
        <button class="h35-nav" type="button" data-step="-1" aria-label="התמונה הקודמת"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <button class="h35-nav" type="button" data-step="1" aria-label="התמונה הבאה"><svg viewBox="0 0 24 24" aria-hidden="true" class="flip"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <span class="h35-cnt" aria-hidden="true">1 / 3</span>
        <span class="h35-bar" hidden><i></i></span>
        <button class="hpp" type="button" aria-pressed="false" aria-label="עצירת ההחלפה" hidden><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
      </div>
    </div>
  </section>
</div>


<script>
// in view = fire. Measured directly on scroll and resize, not through IntersectionObserver:
// an observer does not update while the tab is throttled (and on a real site the hero is usually
// on screen at load anyway), and an entrance that never fires leaves the hero invisible.
function inView(el,f){
  var ro;
  function chk(){
    var r=el.getBoundingClientRect();
    if(r.top<innerHeight*.9&&r.bottom>0){off();f();}
  }
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);if(ro)ro.disconnect();}
  addEventListener("scroll",chk,{passive:true}); addEventListener("resize",chk);
  // a layout change with no scroll (a bar above it closes, a font swaps in) can also bring it into view
  if(window.ResizeObserver){ro=new ResizeObserver(chk);ro.observe(document.body);}
  requestAnimationFrame(chk); setTimeout(chk,300);
}
function enter(root){
  var els=root.querySelectorAll(".rv");
  els.forEach(function(el,i){if(!el.style.getPropertyValue("--i"))el.style.setProperty("--i",i);});
  // a script that ran late, after the 2.5s CSS failsafe already showed the hero: keep it shown, no second entrance
  if(els.length&&getComputedStyle(els[0]).opacity==="1")root.classList.add("is-in");
  root.classList.add("rv-on");
  inView(root,function(){root.classList.add("is-in");});
}
(function(){
  var root=document.getElementById("h35"); enter(root);
  var sl=[].slice.call(root.querySelectorAll(".h35-s")), tt=[].slice.call(root.querySelectorAll(".h35-t")),
      h3=root.querySelector("h3"), cnt=root.querySelector(".h35-cnt"), bar=root.querySelector(".h35-bar"),
      pp=root.querySelector(".hpp"), ctl=root.querySelector(".h35-ctl"), N=sl.length, cur=0, busy=false;
  // בהפחתת תנועה אין החלפה לבד: החצים עובדים, ופס הזמן וכפתור העצירה לא מופיעים כי אין מה לעצור
  var auto=matchMedia("(prefers-reduced-motion:no-preference)").matches;
  function restart(){if(!auto)return; bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");}
  function go(n){
    var nx=(n+N)%N, pv=cur;
    // נעילה עד שהווילון נגמר, כדי שלחיצות מהירות לא יערמו שלוש תמונות באמצע מעבר
    if(busy||nx===cur)return; busy=true; setTimeout(function(){busy=false;},1150);
    cur=nx;
    sl[cur].classList.remove("is-prev"); sl[pv].classList.remove("is-on"); sl[pv].classList.add("is-prev"); sl[cur].classList.add("is-on");
    setTimeout(function(){sl[pv].classList.remove("is-prev");},1150);
    tt[pv].classList.remove("is-on"); tt[pv].classList.add("is-out"); tt[pv].setAttribute("aria-hidden","true");
    tt[cur].classList.remove("is-out"); tt[cur].classList.add("is-on"); tt[cur].removeAttribute("aria-hidden");
    setTimeout(function(){tt[pv].classList.remove("is-out");},600);
    cnt.textContent=(cur+1)+" / "+N;
    restart();
  }
  [].forEach.call(root.querySelectorAll(".h35-nav"),function(b){
    b.addEventListener("click",function(){h3.setAttribute("aria-live","polite"); go(cur+Number(b.dataset.step));});
  });
  bar.querySelector("i").addEventListener("animationend",function(){go(cur+1);});
  if(auto){root.classList.add("is-auto"); bar.hidden=false; pp.hidden=false; restart();}
  pp.addEventListener("click",function(){var on=!root.classList.contains("is-paused"); root.classList.toggle("is-paused",on);
    pp.setAttribute("aria-pressed",String(on)); pp.setAttribute("aria-label",on?"הפעלת ההחלפה":"עצירת ההחלפה");});
  // מקלדת בתוך הפקדים עוצרת את השעון, כדי שהתמונה לא תתחלף מתחת לאצבע
  ctl.addEventListener("focusin",function(e){if(e.target.matches(":focus-visible"))root.classList.add("is-hold");});
  ctl.addEventListener("focusout",function(){root.classList.remove("is-hold");});
  if("IntersectionObserver" in window)new IntersectionObserver(function(es){root.classList.toggle("is-off",!es[0].isIntersecting);}).observe(root);
})();
</script>
</body>
</html>
