<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G205 · מילת הדגשה שנכנסת אחרונה בסגנון אחר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G205 · מילת הדגשה שנכנסת אחרונה בסגנון אחר */
.aw{max-width:1080px;margin-inline:auto;display:grid;gap:32px}
.aw-h{margin:0;font-size:clamp(42px,7.4vw,112px);font-weight:700;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.aw-l{display:block}
.aw-w{display:inline-block}
.aw-a{display:inline-block;white-space:nowrap;color:var(--accent, #4a3aff);font-style:italic;font-weight:400;letter-spacing:0}
.aw-p{margin:0;max-width:44ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><div class="aw">
  <h2 class="aw-h">
    <span class="aw-l"><span class="aw-w">מטבחים</span> <span class="aw-w">שנבנים</span> <span class="aw-w">לפי</span> <span class="aw-a">הבית שלכם</span></span>
    <span class="aw-l"><span class="aw-w">ומגיעים</span> <span class="aw-w">בזמן,</span> <span class="aw-a">בלי הפתעות</span></span>
  </h2>
  <p class="aw-p">נגרייה משפחתית בשרון. מתכננים איתכם בבית, מייצרים בנגרייה ומתקינים בתוך שבוע.</p>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הכותרת כבר מוצגת במלואה, עם הדגש
  const root=document.querySelector(".aw"),lines=[...root.querySelectorAll(".aw-l")],all=root.querySelectorAll(".aw-w,.aw-a");
  // בהפחתת תנועה הפונקציה לא רצה, והכותרת נשארת במצב הסופי
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const tl=gsap.timeline({paused:true});
    lines.forEach((l,i)=>{
      const base=l.querySelectorAll(".aw-w"),acc=l.querySelector(".aw-a");
      // המילים הרגילות קודם. הדגש מתחיל כשהאחרונה שלהן כמעט נחתה, והשורה הבאה אחרי שהדגש נחת
      tl.fromTo(base,{opacity:0,y:30,filter:"blur(8px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.65,ease:"power3.out",stagger:.075,clearProps:"filter"},i?">+.25":0)
        .fromTo(acc,{opacity:0,y:22,filter:"blur(14px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.85,ease:"power2.out",clearProps:"filter"},">-.2");
    });
    const st=ScrollTrigger.create({trigger:root,start:"top 85%",once:true,onEnter:()=>tl.play()});
    return()=>{st.kill();tl.kill();gsap.set(all,{clearProps:"opacity,transform,filter"});};
  });
})();
</script>
</body>
</html>
