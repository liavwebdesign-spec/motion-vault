<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G229 · לוגו שמתכווץ לאריח והשם נכתב לידו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G229 · לוגו שמתכווץ לאריח והשם נכתב לידו */
.tw{display:grid;place-items:center;min-height:clamp(380px,56vh,560px);padding-block:clamp(48px,6vw,96px)}
.tw-lock{display:flex;align-items:center;gap:clamp(16px,2.4vw,32px)}
.tw-tile{flex:none;display:grid;place-items:center;width:clamp(72px,10vw,128px);aspect-ratio:1;border-radius:24%;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff)}
.tw-tile b{font-size:clamp(44px,6.4vw,84px);font-weight:800;line-height:1}
.tw-txt{display:grid;gap:8px}
.tw-name{position:relative;width:max-content;margin:0;font-size:clamp(48px,7.5vw,112px);font-weight:800;line-height:1.05}
.tw-caret{position:absolute;inset-block:14% 10%;inset-inline-start:0;width:3px;border-radius:2px;background:var(--accent, #4a3aff);opacity:0}
.tw-tag{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.5}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="tw" aria-label="תורנו, קביעת תורים לעסקים קטנים">
  <div class="tw-lock">
    <span class="tw-tile" aria-hidden="true"><b>ת</b></span>
    <div class="tw-txt">
      <p class="tw-name"><span class="tw-word">תורנו</span><i class="tw-caret" aria-hidden="true"></i></p>
      <p class="tw-tag">קביעת תורים לעסקים קטנים</p>
    </div>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;   // בלי GSAP הלוגו כבר במצבו הסופי
  const root=document.querySelector(".tw"),lock=root.querySelector(".tw-lock"),tile=root.querySelector(".tw-tile");
  const word=root.querySelector(".tw-word"),caret=root.querySelector(".tw-caret"),tag=root.querySelector(".tw-tag");
  const sgn=getComputedStyle(root).direction==="rtl"?-1:1,W=()=>word.offsetWidth,steps="steps("+(word.textContent.trim().length)+")";
  // בהפחתת תנועה הפונקציה לא רצה
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const tl=gsap.timeline({paused:true});
    tl.fromTo(tile,{scale:2.4,x:()=>sgn*(lock.offsetWidth-tile.offsetWidth)/2,opacity:0},{opacity:1,duration:.5,ease:"power2.out"},0)
      .to(tile,{scale:1,x:0,duration:1,ease:"power3.inOut"},.7)
      .fromTo(word,{clipPath:"inset(0 0 0 100%)"},{clipPath:"inset(0 0 0 0%)",duration:.9,ease:steps},1.75)
      .fromTo(caret,{x:0},{x:()=>sgn*W(),duration:.9,ease:steps},1.75)
      .set(caret,{opacity:1},1.75)
      .fromTo(caret,{opacity:1},{opacity:0,duration:.22,repeat:4,yoyo:true,ease:"none",immediateRender:false},2.7)
      .fromTo(tag,{y:12,opacity:0},{y:0,opacity:1,duration:.8,ease:"power3.out"},2.9)
      .set(word,{clearProps:"clipPath"}).set(tile,{clearProps:"transform,opacity"}).set(tag,{clearProps:"transform,opacity"});
    const st=ScrollTrigger.create({trigger:root,start:"top 72%",end:"bottom 12%",
      onEnter:()=>tl.invalidate().restart(),onEnterBack:()=>tl.invalidate().restart(),onLeaveBack:()=>tl.pause(0)});
    return()=>{st.kill();tl.progress(1).kill();gsap.set(caret,{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
