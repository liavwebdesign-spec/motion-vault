<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G261 · צורות מקוננות שמסתובבות כמנהרה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G261 · צורות מקוננות שמסתובבות כמנהרה */
.nt{max-width:1100px;margin-inline:auto}
.nt-pin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(32px,6vw,96px)}
.nt-copy{display:grid;gap:16px;justify-items:start}
.nt-kicker{margin:0;font-size:15px;font-weight:600;color:var(--muted, #6a6d85)}
.nt-copy h2{margin:0;font-size:clamp(32px,4vw,56px);font-weight:700;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.nt-copy p:not(.nt-kicker){margin:0;max-width:40ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.nt-cta{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:600;text-decoration:none}
.nt-cta:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:4px}
.nt-vis{display:grid;place-items:center}
.nt-frame{position:relative;isolation:isolate;overflow:hidden;container-type:size;width:min(100%,560px);aspect-ratio:1;border-radius:28px;background:var(--bg, #f7f7fa);box-shadow:inset 0 0 0 1px var(--line, #e4e4ee)}
/* כל שכבה: גודל (--k) וזווית סופית (--r) מהמארקאפ. המרכוז ב-translate, כדי ש-GSAP יזיז רק סיבוב וגודל */
.nt-l{position:absolute;top:50%;left:50%;display:grid;place-items:center;width:calc(150% * var(--k));aspect-ratio:1;translate:-50% -50%;transform:rotate(var(--r, 14px));border-radius:4%;background:var(--c);box-shadow:0 0 0 2px var(--bg, #f7f7fa)}
.nt-l:nth-child(odd){--c:var(--accent, #4a3aff)}
.nt-l:nth-child(even){--c:var(--ink, #16182b)}
.nt-word{font-size:clamp(18px,6.4cqw,40px);font-weight:800;line-height:1;white-space:nowrap;color:var(--bg, #f7f7fa)}
.nt.is-live{height:260vh;height:260svh}
.nt.is-live .nt-pin{position:sticky;top:0;height:100vh;height:100svh}
@media(max-width:767px){
  .nt-pin{grid-template-columns:minmax(0,1fr);align-content:center;gap:24px}
  .nt-vis{order:-1}
  .nt-frame{width:min(100%,56svh)}
  .nt-copy h2{font-size:clamp(28px,8vw,36px)}
}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="nt">
  <div class="nt-pin">
    <div class="nt-copy">
      <p class="nt-kicker">סטודיו למחקר משתמשים</p>
      <h2>מחקר שיורד עד לשורש הבעיה</h2>
      <p>שבוע של ראיונות ובדיקות שימושיות, ניתוח של מה שהמשתמשים באמת עושים באתר, ובסופו מסמך קצר שאפשר לעבוד איתו.</p>
      <a class="nt-cta" href="#">לשיחת היכרות</a>
    </div>
    <div class="nt-vis" aria-hidden="true"><div class="nt-frame"><i class="nt-l" style="--k:1.000;--r:49deg"></i><i class="nt-l" style="--k:0.780;--r:42deg"></i><i class="nt-l" style="--k:0.608;--r:35deg"></i><i class="nt-l" style="--k:0.475;--r:28deg"></i><i class="nt-l" style="--k:0.370;--r:21deg"></i><i class="nt-l" style="--k:0.289;--r:14deg"></i><i class="nt-l" style="--k:0.225;--r:7deg"></i><i class="nt-l" style="--k:0.176;--r:0deg"><span class="nt-word">לעומק</span></i></div></div>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP נשארת המנהרה הגמורה, והמילה חדה
  const root=document.querySelector(".nt"),L=[...root.querySelectorAll(".nt-l")],word=root.querySelector(".nt-word");
  // בהפחתת תנועה הפונקציה לא רצה, והמנהרה נשארת במצב הסופי
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("is-live");
    const fin=L.map(el=>parseFloat(el.style.getPropertyValue("--r"))||0);
    // מצב ההתחלה נקבע מראש, כי בטווין עם stagger רק הפריט הראשון מקבל את מצב ההתחלה לפני שהגלילה מתחילה
    gsap.set(L,{scale:.04,autoAlpha:0,rotation:i=>fin[i]+(i%2?-170:170)});
    const tl=gsap.timeline({scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6,invalidateOnRefresh:true}});
    // מהפנימית החוצה, וכל שכבה מסתובבת בכיוון ההפוך לשכנה שלה
    tl.to(L,{scale:1,autoAlpha:1,rotation:i=>fin[i],duration:1.2,ease:"power3.out",stagger:{each:.1,from:"end"}},0)
      .fromTo(word,{autoAlpha:0,scale:.8,filter:"blur(12px)"},{autoAlpha:1,scale:1,filter:"blur(0px)",duration:.7,ease:"power2.out"},">-.5")
      .to({},{duration:.5});      // עצירה בסוף, כדי שהמנהרה הגמורה תישאר רגע על המסך
    return()=>{root.classList.remove("is-live");gsap.set(L.concat([word]),{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
