<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G251 · קשקוש על תמונה שמוחק את האובייקט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G251 · קשקוש על תמונה שמוחק את האובייקט */
.sc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:center;gap:clamp(32px,6vw,96px);max-width:1160px;margin-inline:auto}
.sc .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sc-txt{display:grid;gap:14px;max-width:36ch}
.sc-txt h3{margin:0;font-size:clamp(26px,2.6vw,40px);line-height:1.15;text-wrap:balance}
.sc-txt p{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.sc-img{position:relative;margin:0;justify-self:center;box-sizing:border-box;width:min(660px,100%);aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line, #e4e4ee);border-radius:20px;background:var(--card, #fff);box-shadow:0 28px 56px -32px color-mix(in srgb,var(--ink, #16182b) 36%,transparent)}
.sc-img img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.sc-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sc-sk{opacity:0}
.sc-sk path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:0}
.sc-halo{stroke:var(--bg, #f7f7fa);stroke-width:5.6}
.sc-line{stroke:var(--accent, #4a3aff);stroke-width:3.4}
.sc-chip{position:absolute;inset-block-start:16px;inset-inline-start:16px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-size:13px;font-weight:600;line-height:1}
.sc-chip svg{flex:none;width:16px;height:16px}
.sc-chip circle{fill:var(--accent, #4a3aff)}
.sc-chip path{fill:none;stroke:var(--accent-ink, #fff);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:767px){.sc{grid-template-columns:minmax(0,1fr)}.sc-txt{max-width:none}}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP: התמונה הנקייה והתווית (במארקאפ)
  const root=document.querySelector(".sc"),fig=root.querySelector(".sc-img"),pl=root.querySelector(".sc-pl"),pr=root.querySelector(".sc-pr"),
    skR=root.querySelector(".sc-skr"),skL=root.querySelector(".sc-skl"),chip=root.querySelector(".sc-chip"),
    lines=[...root.querySelectorAll(".sc-sk path")];
  // בהפחתת תנועה הפונקציה לא רצה, והתמונה נשארת נקייה
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    gsap.set([pl,pr],{opacity:0});gsap.set([skR,skL],{opacity:1});gsap.set(lines,{strokeDashoffset:1});
    gsap.set(chip,{autoAlpha:0,scale:.85,y:8});
    const tl=gsap.timeline({paused:true});
    // קשקוש נצבע, שכבת התיקון עולה והקשקוש דועך
    const erase=(sk,patch,at)=>{
      tl.to(sk.querySelectorAll("path"),{strokeDashoffset:0,duration:1.05,ease:"power1.inOut"},at);
      tl.to(patch,{opacity:1,duration:.6,ease:"power1.out"},at+1.1);
      tl.to(sk,{opacity:0,duration:.45,ease:"power1.in"},at+1.2);
    };
    erase(skR,pr,.4);
    erase(skL,pl,2.5);
    tl.to(chip,{autoAlpha:1,scale:1,y:0,duration:.5,ease:"power3.out"},">-=.1");
    const st=ScrollTrigger.create({trigger:fig,start:"top 65%",once:true,onEnter:()=>tl.play()});
    return()=>{st.kill();tl.kill();gsap.set([pl,pr,skR,skL,chip,...lines],{clearProps:"all"});};
  });
})();
</script>
