<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G111 · מסך טלפון מוצמד עם מסכים שמתחלפים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G111 · מסך טלפון מוצמד עם מסכים שמתחלפים */
.pm{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap, clamp(16px, 1.6vw, 36px));align-items:start;max-width:1000px;margin-inline:auto}
.pm-pin{position:sticky;top:0;height:100vh;display:grid;place-items:center}
.pm-phone{position:relative;width:min(280px,64vw);aspect-ratio:9/19;border-radius:38px;background:var(--ink, #16182b);padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.25)}
.pm-phone::before{content:"";position:absolute;top:22px;left:50%;translate:-50% 0;width:34%;height:22px;border-radius:12px;background:var(--ink, #16182b);z-index:3}
.pm-screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:var(--card, #fff)}
.pm-s{position:absolute;inset:0;padding:54px 18px 18px;display:grid;align-content:start;gap:12px;background:var(--card, #fff)}
.pm-s i{display:block;border-radius:10px;background:var(--bg, #f7f7fa);border:1px solid var(--line, #e4e4ee);height:16px}
.pm-s i.big{height:120px;background:var(--accent, #4a3aff);border:0;opacity:.85}
.pm-s i.mid{height:64px}
.pm-s b{font-size:15px;color:var(--ink, #16182b)}
.pm-steps{display:flex;flex-direction:column;gap:44vh;padding-block:36vh}
.pm-step{opacity:.3;transition:opacity .4s}
.pm-step.on{opacity:1}
.pm-step b{display:block;font-size:12px;color:var(--accent, #4a3aff);letter-spacing:.14em;margin-bottom:8px}
.pm-step h3{margin:0 0 8px;font-size:clamp(22px,2.6vw,36px)}
.pm-step p{margin:0;color:var(--muted, #6a6d85);line-height:1.7;max-width:36ch}
@media(max-width:767px){.pm{grid-template-columns:1fr}.pm-pin{height:46vh;top:0;z-index:2;background:var(--bg, #f7f7fa)}.pm-phone{width:min(40vw,190px)}.pm-steps{gap:26vh;padding-block:6vh 30vh}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage tight"><div class="pm">
  <div class="pm-pin"><div class="pm-phone"><div class="pm-screen">
    <div class="pm-s"><b>היום</b><i class="big"></i><i></i><i></i><i class="mid"></i></div>
    <div class="pm-s"><b>לידים</b><i class="mid"></i><i class="mid"></i><i class="mid"></i><i></i></div>
    <div class="pm-s"><b>דוחות</b><i></i><i class="big"></i><i></i><i></i><i></i></div>
  </div></div></div>
  <div class="pm-steps">
    <div class="pm-step"><b>01</b><h3>מסך הבית</h3><p>מה קרה היום, במבט אחד. בלי לחפור.</p></div>
    <div class="pm-step"><b>02</b><h3>לידים בזמן אמת</h3><p>כל פנייה נכנסת לרשימה עם מקור, שעה ומי מטפל.</p></div>
    <div class="pm-step"><b>03</b><h3>דוח שבועי</h3><p>כמה נכנס, כמה נסגר, ומה פתוח. נשלח לבד.</p></div>
  </div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const screens=gsap.utils.toArray(".pm-s"),steps=gsap.utils.toArray(".pm-step"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  screens.forEach((s,i)=>gsap.set(s,{yPercent:i?100:0}));
  let cur=0;
  function go(k){if(k===cur)return;const dir=k>cur?1:-1,prev=cur;cur=k;
    steps.forEach((s,i)=>s.classList.toggle("on",i===k));
    if(reduce){gsap.set(screens[prev],{yPercent:100});gsap.set(screens[k],{yPercent:0});return;}
    gsap.to(screens[prev],{yPercent:-100*dir,duration:.6,ease:"power3.inOut"});
    gsap.fromTo(screens[k],{yPercent:100*dir},{yPercent:0,duration:.6,ease:"power3.inOut"});}
  steps[0].classList.add("on");
  steps.forEach((s,i)=>ScrollTrigger.create({trigger:s,start:"top 60%",end:"bottom 40%",onEnter:()=>go(i),onEnterBack:()=>go(i)}));
})();
</script>
</body>
</html>
