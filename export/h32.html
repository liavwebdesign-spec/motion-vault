<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>H32 · הירו אירוע עם ספירה לאחור</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* H32 · הירו אירוע עם ספירה לאחור */
/* ---- demo frame and top row (scaffolding, not part of the hero) ---- */
.hf{position:relative;margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--bg, #f7f7fa);isolation:isolate}
.hf-top{position:absolute;inset-inline:0;top:0;z-index:6;display:flex;align-items:center;gap:24px;padding:20px 28px;font-size:15px;font-weight:500}
.hf-top b{font-size:18px;font-weight:800}
.hf-top nav{display:flex;gap:18px;margin-inline-start:auto;opacity:.8}
@media (max-width:760px){.hf-top nav{display:none}}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:12px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);text-decoration:none;
  font-size:16px;font-weight:600;white-space:nowrap;transition:transform .18s cubic-bezier(.2,.6,.2,1),box-shadow .3s cubic-bezier(.2,.6,.2,1)}
.hbtn.ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
@media (hover:hover) and (pointer:fine){.hbtn:hover{transform:translateY(-2px)}}
.hkick{font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.75}
.hlead{margin:0;font-size:clamp(17px,1.2vw,20px);line-height:1.55;opacity:.82}
.hmicro{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;opacity:.7}
.hcta{display:flex;flex-wrap:wrap;gap:12px}

/* the resting state is the visible one. opacity:1 on .rv also keeps the no-JS look identical to the look after the entrance */
.rv{opacity:1;transition:opacity .5s cubic-bezier(.2,.6,.2,1),transform .5s cubic-bezier(.2,.6,.2,1)}
.open-anim .rv{opacity:0;transform:translateY(18px);animation:rv-fs 0s 2.5s forwards}
/* --t0: on a page with a header, 0.2s so the header comes down first (motion.md 2) */
.is-in .rv{opacity:1;transform:none;transition-duration:.7s;transition-delay:calc(var(--t0,0s) + var(--i,0) * 90ms)}
.rv-on .rv{animation:none}
@keyframes rv-fs{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv,.is-in .rv{transition-duration:.01ms!important;transition-delay:0s!important}
  .hbtn{transition-duration:.01ms!important}.hbtn:hover{transform:none!important}}
.h32h{--fx:-1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:20px;min-height:min(86vh,780px);padding:96px 28px 40px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);overflow:hidden;isolation:isolate}
[dir="ltr"] .h32h{--fx:1}
/* the singer has to stand on the side away from the text: the photo is mirrored in Hebrew and kept as shot in English */
.h32-bg{position:absolute;inset:0;z-index:-2}
.h32-bg img{width:100%;height:100%;object-fit:cover;object-position:70% 40%;display:block;transform:scaleX(var(--fx));transition:transform 1.2s cubic-bezier(.2,.6,.2,1)}
.open-anim .h32-bg img{transform:scaleX(var(--fx)) scale(1.06);animation:h32i-fs 0s 2.5s forwards}
.is-in .h32-bg img{transform:scaleX(var(--fx));transition-delay:var(--t0,0s)}
.rv-on .h32-bg img{animation:none}
@keyframes h32i-fs{to{transform:scaleX(var(--fx))}}
/* the text sits in the bottom start corner, so the shade comes from that corner (heroes.md) */
.h32-scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(to top left,color-mix(in srgb,var(--ink, #16182b) 92%,transparent) 0%,color-mix(in srgb,var(--ink, #16182b) 74%,transparent) 45%,transparent 78%)}
[dir="ltr"] .h32-scrim{background:linear-gradient(to top right,color-mix(in srgb,var(--ink, #16182b) 92%,transparent) 0%,color-mix(in srgb,var(--ink, #16182b) 74%,transparent) 45%,transparent 78%)}
.h32h h3{margin:0;max-width:15ch;font-size:clamp(34px,min(4.4vw,7.8vh),66px);line-height:1.05;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.h32-date{margin:0;font-size:clamp(16px,1.2vw,19px);font-weight:600}
.h32-cd{display:flex;align-items:flex-end;gap:32px;margin:4px 0}
.h32-cd[hidden],.h32-end[hidden]{display:none}
.h32-lbl{align-self:center;font-size:15px;font-weight:600;opacity:.8}
.h32-u{display:flex;flex-direction:column;gap:4px}
/* tabular digits: a number that changes does not push its neighbours */
.h32-u b{font-size:clamp(40px,min(4.4vw,8vh),68px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.h32-u span{font-size:14px;opacity:.75}
.h32-u b.tk{animation:h32-tk .5s cubic-bezier(.2,.6,.2,1)}
@keyframes h32-tk{from{opacity:0;transform:translateY(-24%)}}
.h32-end{margin:0;font-size:18px;font-weight:700}
@media (prefers-reduced-motion:reduce){.h32-bg img{transition-duration:.01ms!important;transition-delay:0s!important}.h32-u b.tk{animation:none}}
/* phone: the singer above, the text and the count at the bottom across the full width */
@media (max-width:860px){.h32h{gap:14px;min-height:min(94vh,820px);padding:88px 20px 24px}
  .h32-bg img{object-position:80% 40%}
  .h32-scrim{background:linear-gradient(to top,color-mix(in srgb,var(--ink, #16182b) 92%,transparent) 0%,color-mix(in srgb,var(--ink, #16182b) 70%,transparent) 50%,transparent 80%)}
  .h32h h3{font-size:clamp(28px,7.6vw,38px)}
  .h32-cd{flex-wrap:wrap;gap:12px 24px}.h32-lbl{flex-basis:100%}.h32-u b{font-size:clamp(34px,10vw,44px)}
  .h32h .hcta{width:100%;flex-wrap:nowrap}.h32h .hcta .hbtn{flex:1;padding-inline:16px}}
</style>
</head>
<body>

<script>if(matchMedia("(prefers-reduced-motion:no-preference)").matches)document.documentElement.classList.add("open-anim")</script>
<div class="hf"><div class="hf-top" style="color:var(--bg)"><b>לוגו</b><nav><span>שירותים</span><span>פרויקטים</span><span>אודות</span></nav></div>
  <section class="h32h" id="h32">
    <div class="h32-bg"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/singer.webp" alt="זמרת שרה לתוך מיקרופון על במה, מאחוריה אורות מטושטשים" fetchpriority="high" decoding="async"></div>
    <span class="h32-scrim"></span>
    <span class="hkick rv">פסטיבל ערבי קיץ, גני יהושע</span>
    <h3 class="rv">שלושה ערבים של מוזיקה חיה, על הדשא ליד המים</h3>
    <p class="h32-date rv"><time datetime="2027-07-01T20:00+03:00">יום חמישי, 1 ביולי 2027, 20:00</time></p>
    <div class="h32-cd rv" role="timer" aria-label="הזמן שנשאר עד הפתיחה" hidden>
      <span class="h32-lbl">נפתח בעוד</span>
      <span class="h32-u"><b data-u="d">0</b><span>ימים</span></span>
      <span class="h32-u"><b data-u="h">0</b><span>שעות</span></span>
      <span class="h32-u"><b data-u="m">0</b><span>דקות</span></span>
    </div>
    <p class="h32-end" hidden>הערבים כבר התחילו. כרטיסים בכניסה, כל עוד נשארו.</p>
    <div class="hcta rv"><a class="hbtn" href="#h32">לכרטיסים</a><a class="hbtn ghost" href="#h32">התוכנייה</a></div>
    <p class="hmicro rv"><span>ילדים עד גיל 6 בחינם</span><span>חניה ליד הכניסה הצפונית</span></p>
  </section>
</div>


<script>
// in view = fire. Measured directly on scroll and resize, not through IntersectionObserver:
// an observer does not update while the tab is throttled (and on a real site the hero is usually
// on screen at load anyway), and an entrance that never fires leaves the hero invisible.
function inView(el,f){
  var ro;
  function chk(){
    var r=el.getBoundingClientRect();
    if(r.top<innerHeight*.9&&r.bottom>0){off();f();}
  }
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);if(ro)ro.disconnect();}
  addEventListener("scroll",chk,{passive:true}); addEventListener("resize",chk);
  // a layout change with no scroll (a bar above it closes, a font swaps in) can also bring it into view
  if(window.ResizeObserver){ro=new ResizeObserver(chk);ro.observe(document.body);}
  requestAnimationFrame(chk); setTimeout(chk,300);
}
function enter(root){
  var els=root.querySelectorAll(".rv");
  els.forEach(function(el,i){if(!el.style.getPropertyValue("--i"))el.style.setProperty("--i",i);});
  // a script that ran late, after the 2.5s CSS failsafe already showed the hero: keep it shown, no second entrance
  if(els.length&&getComputedStyle(els[0]).opacity==="1")root.classList.add("is-in");
  root.classList.add("rv-on");
  inView(root,function(){root.classList.add("is-in");});
}
(function(){
  var root=document.getElementById("h32"), cd=root.querySelector(".h32-cd"), end=root.querySelector(".h32-end"), time=root.querySelector(".h32-date time");
  var u={d:cd.querySelector('[data-u="d"]'),h:cd.querySelector('[data-u="h"]'),m:cd.querySelector('[data-u="m"]')};
  enter(root);
  // 20:00 in Israel on the opening night (UTC+3 in summer). In a project the date and the hour come from the event details in the panel
  var at=Date.UTC(2027,6,1,17,0);
  // a demo must never show an event that is over, so it moves on by a year; a project sets data-roll="0" and shows the ended line
  if(root.dataset.roll!=="0"&&at<=Date.now()){
    while(at<=Date.now()){var d=new Date(at); d.setUTCFullYear(d.getUTCFullYear()+1); at=d.getTime();}
    time.dateTime=new Date(at).toISOString();
    time.textContent=new Intl.DateTimeFormat("he-IL",{timeZone:"Asia/Jerusalem",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(at)+", 20:00";
  }
  function set(el,v,first){
    v=String(v); if(el.textContent===v)return; el.textContent=v;
    // only a digit that really changed slides in; the first render is part of the entrance
    if(!first){el.classList.remove("tk"); void el.offsetWidth; el.classList.add("tk");}
  }
  function tick(first){
    var left=at-Date.now();
    if(left<=0){cd.hidden=true; end.hidden=false; clearInterval(iv); return;}
    var m=Math.floor(left/60000);
    set(u.d,Math.floor(m/1440),first); set(u.h,Math.floor(m%1440/60),first); set(u.m,m%60,first);
  }
  // minutes are the smallest unit, so a check every 20 seconds is enough and nothing moves on its own every second
  var iv=setInterval(tick,20000);
  cd.hidden=false; tick(true);
})();
</script>
</body>
</html>
