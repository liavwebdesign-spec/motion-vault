<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS36 · כתם שמשנה צורה ומהפך את המילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS36 · כתם שמשנה צורה ומהפך את המילה */
.mb{display:grid;gap:24px;justify-items:center;text-align:center;padding:clamp(48px,6vw,96px) var(--gutter, clamp(24px, 5vw, 96px))}
.mb-k{margin:0;font-size:15px;font-weight:600;color:var(--muted, #6a6d85)}
.mb-field{position:relative;isolation:isolate;container-type:size;display:grid;place-items:center;width:100%;height:clamp(320px,60vh,600px)}
.mb-word{margin:0;font-size:clamp(80px,22cqw,300px);font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.mb-base{position:relative;z-index:1;color:var(--ink, #16182b)}
.mb-art{--s:min(50cqw,86cqh);position:absolute;inset:0;pointer-events:none}
.mb-blob{position:absolute;z-index:2;left:calc(50% - var(--s)/2);top:calc(50% - var(--s)/2);width:var(--s);height:var(--s);overflow:hidden;background:var(--accent, #4a3aff);border-radius:58% 42% 61% 39% / 46% 55% 45% 54%;transform:translate(calc(var(--s)*-.14),calc(var(--s)*-.05)) rotate(0deg);animation:mb-blob 18s cubic-bezier(.4,0,.2,1) infinite alternate}
/* העותק ההפוך: בגודל המסגרת, מוזז כך שמרכזו במרכז המסגרת, ורץ בתנועה ההופכית לכתם */
.mb-in{position:absolute;left:calc(var(--s)/2 - 50cqw);top:calc(var(--s)/2 - 50cqh);width:100cqw;height:100cqh;display:grid;place-items:center;transform:rotate(0deg) translate(calc(var(--s)*.14),calc(var(--s)*.05));animation:mb-inner 18s cubic-bezier(.4,0,.2,1) infinite alternate}
.mb-in .mb-word{color:var(--accent-ink, #fff)}
.mb-ring{position:absolute;z-index:0;width:calc(var(--s)*var(--g));height:calc(var(--s)*var(--g));left:calc(50% - var(--s)*var(--g)/2);top:calc(50% - var(--s)*var(--g)/2);border:1px solid color-mix(in srgb,var(--accent, #4a3aff) 55%,transparent);border-radius:58% 42% 61% 39% / 46% 55% 45% 54%;transform:translate(calc(var(--s)*-.14),calc(var(--s)*-.05)) rotate(0deg);animation:mb-blob 18s cubic-bezier(.4,0,.2,1) infinite alternate;animation-delay:var(--o)}
.mb-ring.r1{--g:1.12;--o:-4s}
.mb-ring.r2{--g:1.24;--o:-8s}
@keyframes mb-blob{
  0%{border-radius:58% 42% 61% 39% / 46% 55% 45% 54%;transform:translate(calc(var(--s)*-.14),calc(var(--s)*-.05)) rotate(0deg)}
  33%{border-radius:41% 59% 44% 56% / 58% 41% 59% 42%;transform:translate(calc(var(--s)*.16),calc(var(--s)*.07)) rotate(60deg)}
  66%{border-radius:62% 38% 52% 48% / 40% 62% 38% 60%;transform:translate(calc(var(--s)*-.05),calc(var(--s)*.12)) rotate(130deg)}
  100%{border-radius:48% 52% 38% 62% / 55% 45% 57% 43%;transform:translate(calc(var(--s)*.14),calc(var(--s)*-.09)) rotate(200deg)}
}
@keyframes mb-inner{
  0%{transform:rotate(0deg) translate(calc(var(--s)*.14),calc(var(--s)*.05))}
  33%{transform:rotate(-60deg) translate(calc(var(--s)*-.16),calc(var(--s)*-.07))}
  66%{transform:rotate(-130deg) translate(calc(var(--s)*.05),calc(var(--s)*-.12))}
  100%{transform:rotate(-200deg) translate(calc(var(--s)*-.14),calc(var(--s)*.09))}
}
.mb-lead{margin:0;max-width:44ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
@media(prefers-reduced-motion:reduce){.mb-blob,.mb-in,.mb-ring{animation:none}}
@media(max-width:767px){.mb{gap:16px}.mb-field{height:clamp(280px,48vh,420px)}}
</style>
</head>
<body>

<div class="stage"><section class="mb">
  <p class="mb-k">סטודיו קרמיקה, יפו</p>
  <div class="mb-field">
    <h2 class="mb-word mb-base">קרמיקה</h2>
    <div class="mb-art" aria-hidden="true">
      <div class="mb-ring r2"></div>
      <div class="mb-ring r1"></div>
      <div class="mb-blob"><div class="mb-in"><span class="mb-word">קרמיקה</span></div></div>
    </div>
  </div>
  <p class="mb-lead">סדנאות לקבוצות קטנות, כלים בהזמנה אישית וחנות עם כלי בית שנשרפו בתנור שלנו.</p>
</section></div>



</body>
</html>
