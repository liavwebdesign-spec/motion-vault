<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B146 · מעוף במסדרון שקירותיו, תקרתו ורצפתו תמונות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B146 · מעוף במסדרון שקירותיו, תקרתו ורצפתו תמונות */
.cr{position:relative}
.cr-s{display:grid;gap:clamp(24px,3vw,48px);padding:clamp(24px,4vw,64px) clamp(20px,5vw,72px)}
.cr-t{display:grid;gap:16px;justify-items:start}
.cr-k{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--accent, #4a3aff)}
.cr-t h2{margin:0;font-size:clamp(34px,4.4vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.cr-t p:not(.cr-k){margin:0;max-width:44ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
.cr-cta{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-weight:700;text-decoration:none}
.cr-cta:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.cr-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:16px}
.cr-i{margin:0}
.cr-i img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:12px}
.cr.is-on .cr-s{overflow-x:clip}
.cr.is-on .cr-v{position:relative;perspective:700px}
.cr.is-on .cr-g{display:block;position:absolute;inset:0;transform-style:preserve-3d}
.cr.is-on .cr-i{position:absolute;inset:0;margin:auto;height:fit-content;width:30vw}
.cr-e{display:grid;gap:16px;justify-items:start}
.cr-e h3{margin:0;font-size:clamp(34px,4.4vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.cr.is-on{height:560vh}
.cr.is-on .cr-s{position:sticky;top:0;height:100vh;padding:0;overflow:clip;background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
.cr.is-on .cr-v{position:absolute;inset:0}
.cr.is-on .cr-i img{height:100%;aspect-ratio:auto;border-radius:4px}
.cr.is-on .cr-t,.cr.is-on .cr-e{position:absolute;inset:0;margin:auto;height:fit-content;z-index:2;justify-items:center;text-align:center;padding-inline:clamp(20px,5vw,72px)}
.cr.is-on .cr-k{color:color-mix(in srgb,var(--bg, #f7f7fa) 78%,var(--ink, #16182b))}
.cr.is-on .cr-t p:not(.cr-k){color:color-mix(in srgb,var(--bg, #f7f7fa) 78%,transparent);text-align:center}
.cr.is-on .cr-e{opacity:0;pointer-events:none}
.cr.is-on .cr-cta{background:var(--bg, #f7f7fa);color:var(--ink, #16182b)}
</style>
</head>
<body>

<div class="stage"><section class="cr" data-cr><div class="cr-s">
  <div class="cr-t">
    <p class="cr-k">תערוכה</p>
    <h2>נכנסים לאט</h2>
    <p>עשר שנים של צילום, מסודרות כמו מסדרון אחד.</p>
    
  </div>
  <div class="cr-v" data-view><div class="cr-g" data-scene><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/sea.webp" width="2560" height="1706" alt="שמש נמוכה מעל ים כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s01/street-light.webp" width="1700" height="1138" alt="רחוב אבן בשקיעה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/hero.webp" width="2560" height="1707" alt="שמיים בפסים כתומים וכחולים" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/hero.webp" width="2560" height="1435" alt="אור שקיעה על קיר כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/glass.webp" width="2560" height="1440" alt="בניין זכוכית כחול מלמטה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s01/negatives.webp" width="1400" height="933" alt="רצועות נגטיב של פילם" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s07/ink-hands.webp" width="1000" height="1000" alt="ידיים פורשות דיו כתום" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/proj-b.webp" width="1200" height="1600" alt="פינה כהה עם מראה ועציץ" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s07/band-type.webp" width="2560" height="1000" alt="אותיות עופרת" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s07/hero-posters.webp" width="1100" height="1375" alt="כרזות דפוס בשחור לבן" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s02/dial-detail.webp" width="1600" height="1067" alt="חוגת טמפרטורה לבנה בתקריב" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s15/marble.webp" width="1600" height="1000" alt="שיש אדום כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/sea.webp" width="2560" height="1706" alt="שמש נמוכה מעל ים כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/room.webp" width="2200" height="1469" alt="חדר קריאה עם ספריה מוארת" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/hero.webp" width="2560" height="1707" alt="שמיים בפסים כתומים וכחולים" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s01/street-light.webp" width="1700" height="1138" alt="רחוב אבן בשקיעה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/glass.webp" width="2560" height="1440" alt="בניין זכוכית כחול מלמטה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/hero.webp" width="2560" height="1435" alt="אור שקיעה על קיר כהה" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s07/ink-hands.webp" width="1000" height="1000" alt="ידיים פורשות דיו כתום" loading="lazy" decoding="async" draggable="false"></figure><figure class="cr-i" data-i><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s01/negatives.webp" width="1400" height="933" alt="רצועות נגטיב של פילם" loading="lazy" decoding="async" draggable="false"></figure></div></div><div class="cr-e" data-end><h3>בסוף המסדרון יש דלת</h3><a class="cr-cta" href="#">לכרטיסים</a></div>
</div></section></div>


<script>
(function(){
function mod(v,n){return((v%n)+n)%n;}
function ss(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function mv3(root,o){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const view=root.querySelector("[data-view]"),scene=root.querySelector("[data-scene]"),all=[...root.querySelectorAll("[data-i]")];
  const phone=innerWidth<800,items=phone&&o.phoneN?all.slice(0,o.phoneN):all;
  all.slice(items.length).forEach(e=>e.remove());
  root.classList.add("is-on");
  const a={N:items.length,items,root,view,scene,phone,p:o.p0||0,q:o.q0||0,t:0,mx:0,my:0,w:1,h:1};
  let tp=a.p,tq=a.q,vp=0,vq=0,dn=false,lx=0,ly=0,last=0,idle=0,raf=0,seen=false,mxT=0,myT=0,first=true;
  const ease=o.ease||.09;
  function sp(){const r=root.getBoundingClientRect(),d=r.height-innerHeight;return d>0?Math.min(1,Math.max(0,-r.top/d)):0;}
  function size(){a.w=view.clientWidth||1;a.h=view.clientHeight||1;if(o.size)o.size(a);kick();}
  function frame(now){raf=0;if(!seen)return;
    const dt=Math.min(.05,last?(now-last)/1000:.016);last=now;a.t+=dt;
    if(o.range){const g=o.range(a);tp=g[0]+(g[1]-g[0])*sp();if(first){a.p=tp;first=false;}}
    if(o.drag&&!dn){tp+=vp;tq+=vq;vp*=.94;vq*=.94;if(idle>0)idle-=dt;else if(o.auto)tp+=o.auto*dt;}
    if(o.qMax)tq=Math.max(-o.qMax,Math.min(o.qMax,tq));
    a.p+=(tp-a.p)*ease;a.q+=(tq-a.q)*ease;a.mx+=(mxT-a.mx)*.06;a.my+=(myT-a.my)*.06;
    if(o.frame)o.frame(a);
    for(let i=0;i<a.N;i++)o.place(items[i],i,a);
    if(o.auto||o.always||dn||Math.abs(tp-a.p)>.0004||Math.abs(vp)>.00005||Math.abs(mxT-a.mx)>.002||Math.abs(myT-a.my)>.002)raf=requestAnimationFrame(frame);}
  function kick(){if(!raf&&seen){last=0;raf=requestAnimationFrame(frame);}}
  new IntersectionObserver(([e])=>{seen=e.isIntersecting;if(seen)kick();},{rootMargin:"120px"}).observe(root);
  new ResizeObserver(size).observe(view);
  addEventListener("scroll",kick,{passive:true});
  root.addEventListener("pointermove",e=>{const r=view.getBoundingClientRect();mxT=((e.clientX-r.left)/r.width-.5)*2;myT=((e.clientY-r.top)/r.height-.5)*2;kick();});
  if(o.drag){
    view.addEventListener("pointerdown",e=>{dn=true;lx=e.clientX;ly=e.clientY;vp=vq=0;view.style.cursor="grabbing";try{view.setPointerCapture(e.pointerId);}catch(_){}kick();});
    view.addEventListener("pointermove",e=>{if(!dn)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;vp=dx*o.drag;tp+=vp;if(o.dragQ){vq=dy*o.dragQ;tq+=vq;}});
    const up=()=>{dn=false;idle=1.4;view.style.cursor="";kick();};
    view.addEventListener("pointerup",up);view.addEventListener("pointercancel",up);
  }
  size();
}
const tEl=document.querySelector(".cr-t"),eEl=document.querySelector("[data-end]");
mv3(document.querySelector("[data-cr]"),{phoneN:12,ease:.08,
range:function(a){return [0,a.total||1];},
size:function(a){a.sp=a.h*.9;a.W=Math.max(a.w,a.h*.72);a.H=a.h;a.step=a.sp*.34;a.total=(a.N*.34+.9)*a.sp;a.far=a.sp*3.1;
a.items.forEach(function(e,i){const w=i%4,z=-(i+1.4)*a.step,dy=(i%8<4?-1:1)*a.H*.07,dx=(i%8<4?1:-1)*a.W*.08;e.dataset.z=z;
if(w===0||w===2){e.style.width=a.sp*.84+"px";e.style.height=a.H*.56+"px";e.style.transform="translate3d("+(w?a.W/2:-a.W/2)+"px,"+dy+"px,"+z+"px) rotateY("+(w?-90:90)+"deg)";}
else{e.style.width=a.W*.54+"px";e.style.height=a.sp*.84+"px";e.style.transform="translate3d("+dx+"px,"+(w===1?-a.H/2:a.H/2)+"px,"+z+"px) rotateX("+(w===1?-90:90)+"deg)";}});},
frame:function(a){a.scene.style.transform="translateZ("+a.p.toFixed(1)+"px) rotateZ("+(a.mx*.8).toFixed(2)+"deg)";const u=a.p/(a.total||1),f=1-ss(.015,.1,u),g=ss(.88,.985,u);
tEl.style.opacity=f.toFixed(3);tEl.style.transform="scale("+(1+(1-f)*.5).toFixed(3)+")";tEl.style.visibility=f<.01?"hidden":"visible";
eEl.style.opacity=g.toFixed(3);eEl.style.transform="scale("+(.86+g*.14).toFixed(3)+")";eEl.style.pointerEvents=g>.6?"auto":"none";},
place:function(e,i,a){const rel=+e.dataset.z+a.p,o=(1-ss(a.far*.55,a.far,-rel))*(1-ss(a.sp*.3,a.sp*.7,rel));e.style.opacity=o.toFixed(3);e.style.visibility=o<.01?"hidden":"visible";}});
})();
</script>
