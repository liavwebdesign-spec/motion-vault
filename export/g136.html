<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G136 · שתי תמונות שמתמזגות לאחת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-d{background:linear-gradient(160deg,#2b8a3e,#69db7c)}
.ph-e{background:linear-gradient(160deg,#e8590c,#ffa94d)}
.ph-l{background:rgba(16,18,43,.72);color:#fff;padding:.18em .7em;border-radius:999px;line-height:1.3;font-size:max(.78em,12px)}

/* G136 · שתי תמונות שמתמזגות לאחת */
/* בלי GSAP ובהפחתת תנועה: לפני ואחרי זו לצד זו, כל אחת עם תווית. השכבות והנעילה רק כשהמהלך רץ (.gsap-live) */
.dv{position:relative}
.dv-pin{padding-block:48px}
.dv-fig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;width:min(900px,92vw);margin-inline:auto}
.dv-fig .ph{position:relative;aspect-ratio:16/9;font-size:24px}
.dv-before{order:-1}
.dv-fig .ph::after,.dv-lbl{position:absolute;top:16px;inset-inline-start:16px;background:color-mix(in srgb,var(--bg, #f7f7fa) 92%,transparent);color:var(--ink, #16182b);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;z-index:2}
.dv-fig .ph::after{content:attr(data-label)}
.dv-lbl{display:none}
.dv.gsap-live{height:200vh}
.dv.gsap-live .dv-pin{position:sticky;top:0;height:100vh;display:grid;place-items:center;padding-block:0}
.dv.gsap-live .dv-fig{display:block;position:relative;aspect-ratio:16/9;border-radius:var(--r, 14px);overflow:hidden}
.dv.gsap-live .dv-fig .ph{position:absolute;inset:0;border-radius:0;will-change:transform,opacity}
.dv.gsap-live .dv-fig .ph::after{content:none}
.dv.gsap-live .dv-lbl{display:block}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="dv">
  <div class="dv-pin"><div class="dv-fig">
    <div class="ph ph-d dv-after" data-label="אחרי"><span class="ph-l">אחרי</span></div>
    <div class="ph ph-e dv-before" data-label="לפני"><span class="ph-l">לפני</span></div>
    <span class="dv-lbl">לפני</span>
  </div></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP שתי התמונות זו לצד זו
  const root=document.querySelector(".dv"),before=root.querySelector(".dv-before"),after=root.querySelector(".dv-after"),lbl=root.querySelector(".dv-lbl");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("gsap-live");
    // באמצע מתחלפת התווית, והשכבה העליונה (שכבר כמעט שקופה) מפסיקה לתפוס לחיצות שמיועדות ל"אחרי"
    gsap.timeline({scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6,onUpdate(s){const late=s.progress>.5;lbl.textContent=late?"אחרי":"לפני";before.style.pointerEvents=late?"none":"";}}})
      .to(before,{opacity:0,scale:1.12,ease:"power2.inOut",duration:1},0)
      .fromTo(after,{scale:1.08},{scale:1,ease:"power2.inOut",duration:1},0);
    return()=>{root.classList.remove("gsap-live");lbl.textContent="לפני";before.style.pointerEvents="";};
  });
})();
</script>
</body>
</html>
