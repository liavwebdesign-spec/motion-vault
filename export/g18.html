<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G18 · סצנת סיפור מוצמדת (Master Timeline)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G18 · סצנת סיפור מוצמדת (Master Timeline) */
.scene{height:100vh;background:#101223;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.scene .bgA,.scene .bgB{position:absolute;inset-inline:0;height:34%;border-radius:50% 50% 0 0/100% 100% 0 0;background:#2a2f55}
.scene .bgA{top:-12%;transform:rotate(180deg)}.scene .bgB{bottom:-12%}
.stitles{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.st1,.st2{color:#fff;font-size:var(--fs-demo, clamp(36px, 3vw + 0.5rem, 76px));font-weight:700;max-width:20ch;padding-inline:var(--gutter, clamp(24px, 5vw, 96px))}
.scene.gsap-live .st1,.scene.gsap-live .st2{position:absolute}
/* המדיה בגודל הסופי. הגלולה שממנה היא נפתחת היא חיתוך (--pill מ-1 ל-0) ו-scale, בלי להנפיש גובה או רדיוס */
.smedia{--pill:0;--pill-h:22vw;--pill-r:24px;position:relative;z-index:2;width:60vw;height:82vh;background:linear-gradient(135deg,#7048e8,#22b8cf);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700}
.scene.gsap-live .smedia{clip-path:inset(calc((100% - var(--pill-h)) / 2 * var(--pill)) 0px round calc(var(--pill-r) + (500vw - var(--pill-r)) * var(--pill)))}
@media(max-width:767px){.smedia{width:88vw;height:62vh;--pill-h:40vw;--pill-r:20px}}
/* בלי GSAP ובהפחתת תנועה: בלי נעילה, שתי הכותרות ואז המדיה, זו מתחת לזו */
.scene:not(.gsap-live){height:auto;flex-direction:column;gap:32px;padding-block:15vh}
.scene:not(.gsap-live) .stitles{position:relative;z-index:1;flex-direction:column;gap:16px}
.scene:not(.gsap-live) .smedia{height:60vh;border-radius:24px}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="scene">
<div class="bgA"></div><div class="bgB"></div>
<div class="stitles">
  <h2 class="st1">יש סיפורים שאי אפשר לספר בסקשן רגיל</h2>
  <h2 class="st2">בשביל זה בדיוק יש את הבמה הזאת</h2>
</div>
<div class="smedia">הווידאו שלך כאן</div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger, SplitText);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הסצנה סטטית: שתי הכותרות ואז המדיה
  const sc=document.querySelector(".scene");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    sc.classList.add("gsap-live");
    const t1=new SplitText(".st1",{type:"words"}),t2=new SplitText(".st2",{type:"words"});
    // אורך יחסי לגובה המסך: נעילה של 2.2 מסכים, בתוך התקרה של 2.5 מסכים לסצנה
    const vh=k=>()=>"+="+Math.round(innerHeight*k);
    const tl=gsap.timeline({scrollTrigger:{trigger:sc,start:"top 90%",end:vh(2.6),scrub:1}});
    ScrollTrigger.create({trigger:sc,start:"top top",end:vh(2.2),pin:true,scrub:1,anticipatePin:1});
    tl.from(".bgA",{y:"-10vw",duration:1},0)
      .from(".bgB",{y:"10vw",duration:1},0)
      .from(t1.words,{y:50,opacity:0,stagger:.05,duration:.5},"-=0.5")
      .to(".st1",{opacity:0,duration:.5},"+=0.3")
      .from(t2.words,{y:50,opacity:0,stagger:.05,duration:.5})
      .to(".st2",{opacity:0,duration:.4},"+=0.3")
      .from(".smedia",{opacity:0,duration:.3})
      .fromTo(".smedia",{scale:.2,"--pill":1},{scale:1,"--pill":0,duration:.8});
    return()=>{sc.classList.remove("gsap-live");t1.revert();t2.revert();};
  });
})();
</script>
</body>
</html>
