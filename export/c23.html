<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C23 · מספר אחד וסרגל שמפרק אותו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C23 · מספר אחד וסרגל שמפרק אותו */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.c23 .top{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 32px}
.c23 .big{margin:0;font-size:clamp(72px,13cqi,180px);font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.c23 .lbl{margin:0 0 .6em;max-width:22ch;font-size:clamp(17px,1.6cqi,22px);font-weight:600;line-height:1.35}
.c23 .bar,.c23 .leg{display:grid;grid-template-columns:46fr 28fr 18fr 8fr;gap:4px}
.c23 .bar{margin-top:clamp(24px,4cqi,48px);height:clamp(14px,1.6cqi,20px)}
.c23 .bar i{border-radius:6px}
.c23 .s1{background:var(--ink, #16182b)}
.c23 .s2{background:color-mix(in srgb,var(--ink, #16182b) 62%,var(--bg, #f7f7fa))}
.c23 .s3{background:color-mix(in srgb,var(--ink, #16182b) 36%,var(--bg, #f7f7fa))}
.c23 .s4{background:color-mix(in srgb,var(--ink, #16182b) 18%,var(--bg, #f7f7fa))}
.c23 .leg{list-style:none;margin:12px 0 0;padding:0;font-size:14px;color:var(--muted, #6a6d85)}
.c23 .leg b{display:block;color:var(--ink, #16182b);font-size:clamp(18px,1.8cqi,24px);font-variant-numeric:tabular-nums}
.c23 .leg li::before{content:none}
@container (max-width:767px){
  .c23 .leg{grid-template-columns:1fr 1fr;row-gap:14px}
  .c23 .leg li{display:grid;grid-template-columns:auto 1fr;column-gap:8px}
  .c23 .leg li::before{content:"";grid-row:1 / 3;width:12px;height:12px;border-radius:3px;margin-top:6px}
  .c23 .leg li:nth-child(1)::before{background:var(--ink, #16182b)}
  .c23 .leg li:nth-child(2)::before{background:color-mix(in srgb,var(--ink, #16182b) 62%,var(--bg, #f7f7fa))}
  .c23 .leg li:nth-child(3)::before{background:color-mix(in srgb,var(--ink, #16182b) 36%,var(--bg, #f7f7fa))}
  .c23 .leg li:nth-child(4)::before{background:color-mix(in srgb,var(--ink, #16182b) 18%,var(--bg, #f7f7fa))}
}
</style>
</head>
<body>

<div class="cwrap cstage"><div class="c23">
  <div class="top"><p class="big"><bdi dir="ltr">1,240</bdi></p><p class="lbl">פניות שהגיעו מהאתר בשנה האחרונה</p></div>
  <div class="bar" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i></div>
  <ul class="leg"><li><b>570</b>מחיפוש בגוגל</li><li><b>347</b>מאינסטגרם</li><li><b>223</b>מהמלצות</li><li><b>100</b>מקמפיינים</li></ul>
</div></div>



</body>
</html>
