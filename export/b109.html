<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B109 · שובל תמונות אחרי העכבר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B109 · שובל תמונות אחרי העכבר */
.it{position:relative;isolation:isolate;overflow:clip;display:grid;place-items:center;min-height:clamp(560px,56vw,720px);padding:clamp(56px,8vw,128px) clamp(20px,5vw,72px);border-radius:clamp(20px,2.4vw,32px);background:var(--bg, #f7f7fa);color:var(--ink, #16182b);text-align:center}
.it-txt{position:relative;z-index:2;display:grid;justify-items:center;gap:18px;max-width:36rem}
.it-k{margin:0;font-size:15px;font-weight:700;color:var(--accent, #4a3aff)}
.it-txt h2{margin:0;font-size:clamp(36px,5.2vw,76px);font-weight:900;line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.it-txt p{margin:0;max-width:40ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
.it-cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 28px;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-weight:600;text-decoration:none}
.it-cta:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.it-col img,.it-trail img{position:absolute;display:block;width:clamp(120px,13vw,200px);height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:14px;box-shadow:0 1px 2px color-mix(in srgb,var(--ink, #16182b) 6%,transparent),0 6px 20px color-mix(in srgb,var(--ink, #16182b) 5%,transparent)}
.it-col img{rotate:var(--r, 14px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),scale .6s cubic-bezier(.2,.6,.2,1)}
.it-col .c1{--r:-7deg;inset-block-start:8%;inset-inline-start:6%}
.it-col .c2{--r:6deg;inset-block-start:10%;inset-inline-end:7%}
.it-col .c3{--r:5deg;inset-block-end:9%;inset-inline-start:10%}
.it-col .c4{--r:-6deg;inset-block-end:8%;inset-inline-end:10%}
.it-col .c5{--r:3deg;inset-block-start:40%;inset-inline-end:1%;width:clamp(96px,10vw,150px)}
.it.is-moving .it-col img{opacity:0;scale:.9}
.it-trail{position:absolute;inset:0;z-index:1;pointer-events:none}
.it-trail img{left:0;top:0;opacity:0;will-change:transform,opacity}
@media(max-width:767px){.it{min-height:640px;padding-block:160px}.it-col img{width:clamp(88px,26vw,120px)}.it-col .c5{display:none}
  .it-col .c1{inset-block-start:4%}.it-col .c2{inset-block-start:5%}.it-col .c3{inset-block-end:4%}.it-col .c4{inset-block-end:5%}}
</style>
</head>
<body>

<div class="stage"><section class="it" data-it>
  <div class="it-col" aria-hidden="true">
    <img class="c1" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/dancers.webp" width="1500" height="1212" alt="" loading="lazy" decoding="async">
    <img class="c2" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/food.webp" width="1300" height="1000" alt="" loading="lazy" decoding="async">
    <img class="c3" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/hands.webp" width="2560" height="1400" alt="" loading="lazy" decoding="async">
    <img class="c4" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/hug.webp" width="1500" height="1100" alt="" loading="lazy" decoding="async">
    <img class="c5" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s06/singer.webp" width="1800" height="1012" alt="" loading="lazy" decoding="async">
  </div>
  <div class="it-trail" aria-hidden="true"></div>
  <div class="it-txt">
    <p class="it-k">פסטיבל הדרום, באמצע אוגוסט</p>
    <h2>שלושה ימים של מוזיקה, אוכל ואנשים</h2>
    <p>עשרים הופעות על שתי במות, שוק אוכל של שפים מהאזור ומתחם לילדים שפתוח עד השקיעה. הכרטיס לשלושת הימים כולל חניה והסעה.</p>
    <a class="it-cta" href="#">לכרטיסים</a>
  </div>
</section></div>


<script>
(function(){
  const root=document.querySelector("[data-it]");
  if(!root||matchMedia("(prefers-reduced-motion: reduce)").matches)return;   // נשאר הקולאז' הסטטי
  const trail=root.querySelector(".it-trail");
  const SRC=[...root.querySelectorAll(".it-col img")].map(i=>i.getAttribute("src"));
  const pool=[];
  for(let k=0;k<10;k++){const m=new Image();m.alt="";m.decoding="async";m.src=SRC[k%SRC.length];trail.append(m);pool.push(m);}
  let n=0,lx=null,ly=0,px=0,py=0,raf=0,back=0;
  const spawn=(x,y)=>{
    const m=pool[n++%pool.length],r=(Math.random()*16-8).toFixed(1);
    const at=s=>"translate(-50%,-50%) scale("+s+") rotate("+r+"deg)";
    m.style.left=x+"px";m.style.top=y+"px";
    m.getAnimations().forEach(a=>a.cancel());
    m.animate([{opacity:0,transform:at(.6)},{opacity:1,transform:at(1),offset:.2},{opacity:1,transform:at(1),offset:.55},{opacity:0,transform:at(.82)}],
      {duration:1300,easing:"cubic-bezier(.2,.6,.2,1)",fill:"both"});
  };
  const local=e=>{const b=root.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  const frame=()=>{raf=0;if(lx===null||Math.hypot(px-lx,py-ly)>90){lx=px;ly=py;spawn(px,py);}};
  root.addEventListener("pointermove",e=>{
    if(e.pointerType&&e.pointerType!=="mouse")return;
    [px,py]=local(e);
    clearTimeout(back);root.classList.add("is-moving");     // הקולאז' מפנה מקום לשובל
    if(!raf)raf=requestAnimationFrame(frame);
  });
  root.addEventListener("pointerleave",()=>{lx=null;clearTimeout(back);back=setTimeout(()=>root.classList.remove("is-moving"),1000);});
  // מגע: כל הקשה על שטח פנוי משאירה תמונה אחת
  root.addEventListener("pointerdown",e=>{
    if(!e.pointerType||e.pointerType==="mouse"||e.target.closest("a,button"))return;
    const [x,y]=local(e);spawn(x,y);
  });
})();
</script>
</body>
</html>
