<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G223 · תמונה מלאה שמצטמצמת לפאנל ליד טקסט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G223 · תמונה מלאה שמצטמצמת לפאנל ליד טקסט */
/* המצב הסופי: תמונה ומשטח כהה זה לצד זה. הסצנה הפותחת והמסלול רק כשהמהלך רץ (.is-live) */
.sp{position:relative}
.sp-pin{position:relative;display:flex;min-height:80svh;container-type:inline-size}
.sp-media{position:relative;flex:0 0 56%;overflow:hidden;background:var(--ink, #16182b)}
.sp-media figure{position:absolute;inset:0;margin:0}
.sp-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp-a{display:none}
.sp-a::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,color-mix(in oklab,var(--ink, #16182b) 78%,transparent),transparent 62%)}
.sp-a figcaption{position:absolute;z-index:1;inset-inline:0;bottom:0;display:grid;gap:8px;padding:var(--gutter, clamp(24px, 5vw, 96px));color:var(--bg, #f7f7fa)}
.sp-a h2{margin:0;font-size:clamp(34px,4.6vw,72px);font-weight:700;line-height:1.05;text-wrap:balance}
.sp-a p{margin:0;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px))}
.sp-panel{position:relative;flex:1;overflow:hidden;background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
.sp-in{position:absolute;inset-block:0;inset-inline-start:0;width:44cqw;box-sizing:border-box;display:grid;align-content:center;gap:16px;padding:var(--gutter, clamp(24px, 5vw, 96px))}
.sp-idx{margin:0;font-size:14px;color:color-mix(in oklab,var(--bg, #f7f7fa) 65%,transparent)}
.sp-in h3{margin:0;font-size:clamp(30px,3.4vw,52px);font-weight:700;line-height:1.08;text-wrap:balance}
.sp-in>p{margin:0;max-width:36ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.55;color:color-mix(in oklab,var(--bg, #f7f7fa) 80%,transparent)}
.sp-dl{display:grid;margin:8px 0 0}
.sp-dl>div{display:flex;justify-content:space-between;gap:16px;padding-block:14px;font-size:16px}
.sp-dl dt{color:color-mix(in oklab,var(--bg, #f7f7fa) 62%,transparent)}
.sp-dl dd{margin:0}
.sp-h1{top:14%}.sp-h2{top:86%}
.sp.is-live{height:320svh}
.sp.is-live .sp-pin{position:sticky;top:0;height:100svh;min-height:0;overflow:hidden}
.sp.is-live .sp-media{flex-basis:100%}
.sp.is-live .sp-a{display:block}
@media(max-width:767px){
  .sp-pin{flex-direction:column;container-type:normal}
  .sp-media{flex:0 0 46svh}
  .sp-in{position:relative;inset:auto;width:auto;align-content:start;padding-block:24px}
  .sp.is-live .sp-in{position:absolute;inset-block:0;inset-inline:0;width:auto}
  .sp-dl>div{padding-block:10px}
}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage full" style="padding-block:0"><div class="sp">
  <div class="sp-pin">
    <div class="sp-media">
      <figure class="sp-a" aria-hidden="true">
        <img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/proj-a.webp" alt="" width="1800" height="1200" loading="lazy" decoding="async">
        <figcaption><h2>בית פרטי ברמת השרון</h2><p>סלון שנפתח אל הנוף</p></figcaption>
      </figure>
      <figure class="sp-b"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/proj-c.webp" alt="מטבח כהה עם אי ושיש ותאורה תלויה" width="2400" height="1026" loading="lazy" decoding="async"></figure>
    </div>
    <aside class="sp-panel">
      <div class="sp-in">
        <p class="sp-idx">פרויקט 2 מתוך 4</p>
        <h3>מטבח בהרצליה</h3>
        <p>דירה של שבעים מטרים, שבה המטבח הפך מחדר צדדי לחדר שכולם מתכנסים בו.</p>
        <dl class="sp-dl"><div><dt>שטח</dt><dd>24 מ״ר</dd></div><div><dt>משך העבודה</dt><dd>שישה שבועות</dd></div><div><dt>חומרים</dt><dd>שיש, אלון ופלדה</dd></div></dl>
      </div>
    </aside>
  </div>
</div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;      // בלי GSAP נשאר המסך המפוצל הסופי
  const root=document.querySelector(".sp"),media=root.querySelector(".sp-media"),A=root.querySelector(".sp-a"),B=root.querySelector(".sp-b"),
    inner=root.querySelector(".sp-in");
  // בהפחתת תנועה הפונקציה לא רצה, והמסך המפוצל מוצג מיד
  gsap.matchMedia().add({desk:"(min-width:768px) and (prefers-reduced-motion: no-preference)",mob:"(max-width:767px) and (prefers-reduced-motion: no-preference)"},ctx=>{
    const mob=ctx.conditions.mob,rtl=getComputedStyle(root).direction==="rtl";
    root.classList.add("is-live");
    const tl=gsap.timeline({defaults:{ease:"power3.inOut"},scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6}});
    tl.to({},{duration:.12})
      .fromTo(B,{xPercent:rtl?100:-100},{xPercent:0,duration:.3},">")
      .to(A,{xPercent:rtl?-16:16,duration:.3},"<")
      .to({},{duration:.1})
      .fromTo(media,{flexBasis:"100%"},{flexBasis:mob?"46%":"56%",duration:.34},">")
      .fromTo(inner,{opacity:0,x:rtl?36:-36},{opacity:1,x:0,duration:.24,ease:"power2.out"},"<.12")
      .to({},{duration:.14});
    return()=>{root.classList.remove("is-live");gsap.set([media,A,B,inner],{clearProps:"all"});};
  });
})();
</script>
</body>
</html>
