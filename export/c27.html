<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C27 · מה כלול ומה לא</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* C27 · מה כלול ומה לא */
@property --pad{syntax:"<length>";inherits:true;initial-value:20px}
.cwrap{container-type:inline-size}
.cstage{--pad:clamp(20px,4cqi,64px);padding:clamp(36px,5cqi,80px) var(--pad)}
.tx{height:11px;border-radius:6px;background:#dfe0ea;margin:9px 0}
.tx.s{width:38%}.tx.m{width:62%}.tx.l{width:86%}
.ttl{font-size:clamp(22px,2.6cqi,34px);font-weight:700;margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted, #6a6d85);margin:0 0 14px;font-size:15px;line-height:1.6}
.btn{display:inline-block;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;margin-top:12px}
.cwrap .ph{font-size:clamp(14px,1.6cqi,20px)}
.mk{position:relative;display:inline-block;flex:none;width:20px;height:20px;border-radius:50%;vertical-align:middle}
.mk.y{background:var(--ink, #16182b)}
.mk.y::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--bg, #f7f7fa);border-width:0 2px 2px 0;transform:rotate(45deg)}
.mk.n::after{content:"";position:absolute;left:4px;top:9px;width:12px;height:2px;border-radius:2px;background:currentColor;opacity:.7}
.c27{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(16px,3cqi,40px);align-items:start;margin-top:clamp(20px,3cqi,40px)}
.c27 .in{background:var(--card, #fff);border-radius:var(--r, 14px);padding:clamp(20px,3cqi,40px)}
.c27 .out{padding:clamp(20px,3cqi,40px)}
.c27 h4{margin:0 0 16px;font-size:18px}
.c27 ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.c27 li{display:flex;align-items:center;gap:12px;font-size:16px}
.c27 .out li{color:var(--muted, #6a6d85)}
.c27 .add{margin:24px 0 0;font-size:14px;color:var(--muted, #6a6d85)}
.c27 .add a{color:var(--ink, #16182b);font-weight:700}
@container (max-width:767px){.c27{grid-template-columns:1fr;gap:8px}}
</style>
</head>
<body>

<div class="cwrap cstage"><h3 class="ttl">מה מקבלים, ומה לא</h3>
<div class="c27">
  <div class="in"><h4>כלול</h4><ul>
    <li><span class="mk y" aria-hidden="true"></span>עיצוב לפי המותג</li>
    <li><span class="mk y" aria-hidden="true"></span>כתיבת הטקסטים</li>
    <li><span class="mk y" aria-hidden="true"></span>התאמה לטלפון</li>
    <li><span class="mk y" aria-hidden="true"></span>חיבור לגוגל</li>
    <li><span class="mk y" aria-hidden="true"></span>הדרכה לעריכה עצמית</li>
    <li><span class="mk y" aria-hidden="true"></span>חודש ליווי אחרי ההשקה</li>
  </ul></div>
  <div class="out"><h4>לא כלול</h4><ul>
    <li><span class="mk n" aria-hidden="true"></span>צילום מקצועי</li>
    <li><span class="mk n" aria-hidden="true"></span>תרגום לשפות נוספות</li>
    <li><span class="mk n" aria-hidden="true"></span>ניהול קמפיינים</li>
    <li><span class="mk n" aria-hidden="true"></span>תחזוקה שוטפת</li>
  </ul><p class="add">צריכים משהו מכאן? <a href="#">יש תוספות במחיר קבוע</a></p></div>
</div></div>



</body>
</html>
