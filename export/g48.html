<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G48 · פסקה שנצבעת מילה-מילה בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G48 · פסקה שנצבעת מילה-מילה בגלילה */
.hl{max-width:min(880px,92vw);margin-inline:auto;padding-block:34vh}
.hl p{margin:0;font-size:clamp(24px,3.4vw,46px);line-height:1.5;font-weight:600}
/* צבע ההתחלה נגזר מהדיו ומהרקע של הפרויקט, כך שהוא שומר על 3:1 ומעלה בכל עור (ולא תלוי בכמה כהה --muted) */
.hl .w{color:color-mix(in srgb,var(--ink, #16182b) 62%,var(--bg,#fff));transition:none;position:relative;display:inline-block}
/* ההדגשה נפתחת מאחורי המילה. בעברית היא נפתחת מימין, מתחילת המילה */
.hl .mk{position:relative;z-index:0;display:inline-block;padding-inline:.14em;border-radius:.16em}
.hl .mk::before{content:"";position:absolute;inset:0;border-radius:.16em;background:var(--accent, #4a3aff);
  transform:scaleX(var(--fill,0));transform-origin:right center;z-index:-1}
.hl-foot{text-align:center;color:var(--muted, #6a6d85);font-size:14px;padding-bottom:12vh}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="hl"><p id="hl-src">אנחנו לא בונים אתרים יפים. אנחנו בונים אתרים שמביאים פניות. ההבדל הוא לא בעיצוב אלא בסדר: קודם מבינים את הלקוח, אחר כך כותבים, ורק בסוף פותחים כלי עיצוב.</p></div>
<p class="hl-foot">גלול לאט. כל מילה נצבעת בתורה.</p>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  // בלי GSAP (CDN חסום) הפסקה נשארת שלמה בצבע הטקסט הרגיל
  if(typeof gsap==="undefined")return;
  const p=document.getElementById("hl-src");
  const MARK=["פניות","בסדר","הלקוח"];          // מילות המפתח שיקבלו הדגשה
  const bare=w=>w.replace(/[.,:;!?"'׳״]/g,"");   // סימני פיסוק נדבקים למילה ושוברים השוואה
  // פיצול למילים בלבד. בעברית לא מפצלים לאותיות: זה שובר ניקוד וקוראי מסך
  const words=p.textContent.trim().split(/\s+/);
  p.textContent="";
  const marks=[];
  const spans=words.map((w,i)=>{
    const s=document.createElement("span");
    s.className="w";
    const core=bare(w);
    if(MARK.includes(core)){
      // ההדגשה עוטפת את המילה בלבד. סימן הפיסוק נשאר מחוץ לצבע
      const mk=document.createElement("span");
      mk.className="mk";mk.textContent=core;
      s.appendChild(mk);
      s.appendChild(document.createTextNode(w.slice(core.length)));
      marks.push({mk:mk,i:i});
    } else s.textContent=w;
    p.appendChild(s);
    if(i<words.length-1)p.appendChild(document.createTextNode(" "));
    return s;
  });
  const STEP=.35;
  const mm=gsap.matchMedia();
  mm.add("(prefers-reduced-motion: reduce)",()=>{
    gsap.set(spans,{color:"var(--ink)"});
    gsap.set(marks.map(m=>m.mk),{color:"var(--accent-ink)","--fill":1});
  });
  mm.add("(prefers-reduced-motion: no-preference)",()=>{
    // GSAP לא מפענח את color(srgb ...) שהדפדפן מחזיר ל-color-mix, והטווין היה קופץ ללבן ואז מחשיך.
    // לכן צבע ההתחלה מחושב פעם אחת ומומר ל-rgb
    const probe=document.createElement("span");
    probe.style.color="color-mix(in srgb, var(--ink) 62%, var(--bg, #fff))";
    p.appendChild(probe);
    const c=getComputedStyle(probe).color;
    probe.remove();
    const START=c.indexOf("color(")===0?"rgb("+c.match(/[\d.]+/g).slice(0,3).map(v=>Math.round(v*255))+")":c;
    gsap.set(spans,{color:START});
    const tl=gsap.timeline({scrollTrigger:{trigger:".hl",start:"top 78%",end:"bottom 62%",scrub:.4}});
    tl.to(spans,{color:"var(--ink)",duration:.4,stagger:STEP,ease:"none"},0);
    // ההדגשה של כל מילת מפתח נפתחת בדיוק בזמן שהמילה שלה נצבעת, והטקסט שעליה מתהפך באמצע הפתיחה:
    // חלון המעבר קצר מחצי מילה, כך שאין רגע של מילה אפורה על גוש צבע מלא
    marks.forEach(m=>{
      const at=m.i*STEP;
      tl.fromTo(m.mk,{"--fill":0},{"--fill":1,duration:.15,ease:"none"},at)
        .to(m.mk,{color:"var(--accent-ink)",duration:.04,ease:"none"},at+.08);
    });
  });
})();
</script>
</body>
</html>
