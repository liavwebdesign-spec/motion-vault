<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B97 · השתקפות מים מתנדנדת מתחת לתמונה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B97 · השתקפות מים מתנדנדת מתחת לתמונה */
.hw{--hs:clamp(380px,56vh,480px);--iw:max(100cqw,calc(var(--hs) / .473));position:relative;isolation:isolate;overflow:hidden;background:var(--ink, #16182b)}
.hw::after{content:"";display:block;height:calc(var(--hs) * .6)}
.hw-defs{position:absolute;width:0;height:0;overflow:hidden}
.hw-art{position:absolute;inset:0;z-index:-1;container-type:inline-size}
.hw-sky,.hw-flip{position:absolute;inset-inline:0;top:0;height:var(--hs);overflow:hidden}
.hw-art img{position:absolute;left:50%;bottom:calc(var(--iw) * -.1933);width:var(--iw);height:auto;max-width:none;transform:translateX(-50%)}
.hw-ref{--iw:calc(max(100cqw,var(--hs) / .473) + 64px)}
/* ההשתקפות: חלון נמוך יותר מעל קופסה הפוכה, בלי מרווח בקו האופק */
.hw-ref{position:absolute;inset-inline:-32px;top:var(--hs);height:calc(var(--hs) * .6);overflow:hidden;filter:url(#hw-rip);-webkit-mask-image:linear-gradient(var(--ink, #16182b) 18%,transparent);mask-image:linear-gradient(var(--ink, #16182b) 18%,transparent)}
.hw-flip{inset-inline:0;transform:scaleY(-1)}
.hw.is-ready .hw-ref{opacity:0;transition:opacity 1.2s cubic-bezier(.2,.6,.2,1)}
.hw.is-ready.is-in .hw-ref{opacity:1}
.hw-in{position:relative;z-index:1;display:grid;align-content:center;justify-items:start;gap:16px;min-height:var(--hs);padding:clamp(48px,6vw,88px) var(--gutter, clamp(24px, 5vw, 96px));color:#fff;background:linear-gradient(rgba(6,10,26,.5),rgba(6,10,26,.14))}
.hw-in>*{max-width:36ch}
.hw-k{margin:0;font-size:15px;font-weight:600;opacity:.85}
.hw h2{margin:0;font-size:clamp(34px,4.6vw,64px);line-height:1.08;text-wrap:balance}
.hw-lead{margin:0;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;opacity:.92}
.hw-btn{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.hw-btn:hover{transform:translateY(-2px)}}
.hw-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.hw.is-ready .hw-ref{transition:none}}
@media(max-width:767px){.hw{--hs:clamp(420px,64svh,520px)}}
</style>
</head>
<body>

<div class="stage"><section class="hw">
  <svg class="hw-defs" width="0" height="0" aria-hidden="true" focusable="false"><filter id="hw-rip" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence id="hw-turb" type="fractalNoise" baseFrequency="0.0055 0.092" numOctaves="2" seed="7" result="n"/><feColorMatrix in="n" type="matrix" values="1 0 0 0 0  0 0 0 0 .5  0 0 1 0 0  0 0 0 0 1" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="22" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <div class="hw-art" aria-hidden="true">
    <div class="hw-sky"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/hero.webp" alt="" width="2560" height="1707" loading="lazy" decoding="async"></div>
    <div class="hw-ref"><div class="hw-flip"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s08/hero.webp" alt="" width="2560" height="1707" loading="lazy" decoding="async"></div></div>
  </div>
  <div class="hw-in">
    <p class="hw-k">חדרי אירוח בחוף הצפוני</p>
    <h2>שמונה חדרים מול הים</h2>
    <p class="hw-lead">לכל חדר מרפסת שפונה מערבה, וארוחת הבוקר מוגשת עד אחת עשרה, במרחק דקה מהחוף.</p>
    <a class="hw-btn" href="#">בדיקת זמינות</a>
  </div>
</section></div>


<script>
(function(){
  const root=document.querySelector(".hw"),turb=document.getElementById("hw-turb");
  if(!turb||matchMedia("(prefers-reduced-motion: reduce)").matches)return;   // בלי JS ובהפחתת תנועה: ההשתקפות הסטטית
  const small=matchMedia("(max-width:767px)").matches,GAP=small?66:50;
  let vis=false,raf=0,last=0;
  // ההשתקפות עולה מקו האופק כשהסקשן נחשף
  root.classList.add("is-ready");
  // הגלים: התדר עצמו משתנה לאט, וכך הפסים נמרחים ונעים. עדכון ב-20 פעמים בשנייה מספיק, כי המסנן מחושב מחדש בכל עדכון
  function tick(now){
    raf=0;if(!vis||document.hidden)return;
    if(now-last>=GAP){last=now;const t=now/1000;
      turb.setAttribute("baseFrequency",(.0055+.0012*Math.sin(t*.35)).toFixed(5)+" "+(.092+.012*Math.sin(t*.5+1)).toFixed(5));}
    raf=requestAnimationFrame(tick);
  }
  const go=()=>{if(vis&&!document.hidden&&!raf)raf=requestAnimationFrame(tick);};
  new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis)root.classList.add("is-in");go();},{rootMargin:"10% 0px"}).observe(root);
  document.addEventListener("visibilitychange",go);
})();
</script>
</body>
</html>
