<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS40 · מערבולת אור בתוך טבעת זוהרת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS40 · מערבולת אור בתוך טבעת זוהרת */
.vx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(32px,6vw,96px);padding:clamp(48px,7vw,112px) clamp(24px,5vw,72px);border-radius:32px;background:radial-gradient(ellipse 58% 90% at 26% 50%,color-mix(in srgb,var(--accent, #4a3aff) 20%,transparent),transparent 72%),var(--ink, #16182b);color:var(--bg, #f7f7fa);overflow:hidden}
.vx-in{display:grid;gap:20px;justify-items:start}
.vx-in h2{margin:0;font-size:clamp(30px,4vw,56px);line-height:1.12;text-wrap:balance}
.vx-in p{margin:0;max-width:42ch;color:color-mix(in srgb,var(--bg, #f7f7fa) 78%,transparent);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.vx-cta{display:inline-flex;align-items:center;padding:14px 24px;border-radius:99px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.vx-cta:hover{transform:translateY(-2px)}}
.vx-cta:focus-visible{outline:2px solid var(--bg, #f7f7fa);outline-offset:4px}
.vx-art{position:relative;display:grid;place-items:center}
.vx-ring{position:relative;display:grid;place-items:center;width:min(440px,78vw);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent, #4a3aff) 55%,transparent),0 0 72px color-mix(in srgb,var(--accent, #4a3aff) 34%,transparent)}
.vx-disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;background:radial-gradient(closest-side,transparent 50%,color-mix(in srgb,var(--accent, #4a3aff) 22%,transparent) 100%);box-shadow:inset 0 0 64px color-mix(in srgb,var(--accent, #4a3aff) 36%,transparent)}
.vx-b{--r:calc(34% + var(--i) * 9%);--o:calc(var(--i) * -23deg);position:absolute;inset:0;border-radius:50%;filter:blur(2px);mix-blend-mode:screen;-webkit-mask-image:radial-gradient(closest-side,transparent var(--r, 14px),rgb(0 0 0) calc(var(--r, 14px) + 8%),rgb(0 0 0) calc(var(--r, 14px) + 12%),transparent calc(var(--r, 14px) + 22%));mask-image:radial-gradient(closest-side,transparent var(--r, 14px),rgb(0 0 0) calc(var(--r, 14px) + 8%),rgb(0 0 0) calc(var(--r, 14px) + 12%),transparent calc(var(--r, 14px) + 22%));background:conic-gradient(from var(--o),transparent 0deg,color-mix(in srgb,var(--accent, #4a3aff) 90%,transparent) 22deg,color-mix(in srgb,var(--bg, #f7f7fa) 70%,var(--accent, #4a3aff)) 34deg,transparent 62deg,transparent 132deg,color-mix(in srgb,var(--accent, #4a3aff) 65%,transparent) 160deg,transparent 188deg,transparent 252deg,color-mix(in srgb,var(--bg, #f7f7fa) 45%,var(--accent, #4a3aff)) 288deg,transparent 316deg,transparent 360deg);animation:vx-spin calc(9s + var(--i) * 4s) linear infinite}
.vx-orbit{position:absolute;inset:0;border-radius:50%;animation:vx-spin 6s linear infinite}
.vx-tail{position:absolute;inset:0;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,transparent 0deg 232deg,color-mix(in srgb,var(--accent, #4a3aff) 70%,transparent) 316deg,var(--bg, #f7f7fa) 358deg,transparent 360deg);-webkit-mask:linear-gradient(rgb(0 0 0) 0 0) content-box,linear-gradient(rgb(0 0 0) 0 0);-webkit-mask-composite:xor;mask:linear-gradient(rgb(0 0 0) 0 0) content-box exclude,linear-gradient(rgb(0 0 0) 0 0)}
.vx-head{position:absolute;top:-3px;left:50%;width:10px;height:10px;translate:-50% 0;border-radius:50%;background:var(--bg, #f7f7fa);box-shadow:0 0 14px 4px color-mix(in srgb,var(--accent, #4a3aff) 80%,transparent)}
.vx-orbit-glow{inset:-8px;filter:blur(7px);opacity:.8}
.vx-orbit-glow .vx-tail{padding:12px}
.vx-core{position:relative;display:grid;place-items:center;align-content:center;gap:4px;width:46%;aspect-ratio:1;padding:12px;border-radius:50%;background:radial-gradient(circle at 50% 24%,color-mix(in srgb,var(--accent, #4a3aff) 26%,var(--ink, #16182b)),var(--ink, #16182b) 70%);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent, #4a3aff) 50%,transparent),0 0 48px color-mix(in srgb,var(--accent, #4a3aff) 50%,transparent);text-align:center}
.vx-live{display:inline-flex;align-items:center;gap:8px;color:color-mix(in srgb,var(--bg, #f7f7fa) 82%,transparent);font-size:13px;font-weight:700;line-height:1.2}
.vx-live::before{content:"";width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--accent, #4a3aff) 45%,var(--bg, #f7f7fa));box-shadow:0 0 10px color-mix(in srgb,var(--accent, #4a3aff) 80%,transparent);animation:vx-live 1.8s cubic-bezier(.2,.6,.2,1) infinite alternate}
.vx-num{font-size:clamp(44px,5.4vw,68px);font-weight:800;line-height:1}
.vx-sub{color:color-mix(in srgb,var(--bg, #f7f7fa) 78%,transparent);font-size:14px;line-height:1.2}
.vx-pause{position:absolute;inset-block-end:0;inset-inline-end:0;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--bg, #f7f7fa) 14%,transparent);color:var(--bg, #f7f7fa);cursor:pointer;transition:background .2s cubic-bezier(.2,.6,.2,1)}
.vx-pause[hidden]{display:none}
.vx-pause svg{width:16px;height:16px;fill:currentColor}
.vx-pause .i-play,.vx-pause[aria-pressed="true"] .i-pause{display:none}
.vx-pause[aria-pressed="true"] .i-play{display:block}
@media (hover:hover) and (pointer:fine){.vx-pause:hover{background:color-mix(in srgb,var(--bg, #f7f7fa) 24%,transparent)}}
.vx-pause:focus-visible{outline:2px solid var(--bg, #f7f7fa);outline-offset:4px}
@keyframes vx-spin{from{rotate:0deg}to{rotate:360deg}}
@keyframes vx-live{to{opacity:.3}}
.vx.is-paused *,.vx.is-paused *::before,.vx.is-paused *::after{animation-play-state:paused}
@media(max-width:767px){.vx{grid-template-columns:minmax(0,1fr)}.vx-art{order:-1}.vx-sub{font-size:12px}.vx-live{font-size:12px}}
@media(prefers-reduced-motion:reduce){.vx *,.vx *::before,.vx *::after{animation:none}.vx-orbit{rotate:-40deg}.vx-pause{display:none}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="vx" aria-labelledby="vx-h">
  <div class="vx-in">
    <h2 id="vx-h">מענה ללקוחות גם כשהמשרד סגור</h2>
    <p>כל פנייה שמגיעה בלילה או בסוף שבוע מקבלת תשובה מיידית, ובבוקר מחכה לכם רשימה מסודרת של מי צריך שיחה.</p>
    <a class="vx-cta" href="#vx-h">ראו איך זה עובד</a>
  </div>
  <div class="vx-art">
    <div class="vx-ring">
      <span class="vx-disc" aria-hidden="true"><span class="vx-b" style="--i:0"></span><span class="vx-b" style="--i:1"></span><span class="vx-b" style="--i:2"></span><span class="vx-b" style="--i:3"></span><span class="vx-b" style="--i:4"></span><span class="vx-b" style="--i:5"></span><span class="vx-b" style="--i:6"></span></span>
      <span class="vx-orbit vx-orbit-glow" aria-hidden="true"><i class="vx-tail"></i></span>
      <span class="vx-orbit" aria-hidden="true"><i class="vx-tail"></i><i class="vx-head"></i></span>
      <div class="vx-core">
        <span class="vx-live">מענה אוטומטי</span>
        <b class="vx-num">37</b>
        <span class="vx-sub">פניות נענו הלילה</span>
      </div>
    </div>
    <button class="vx-pause" type="button" hidden aria-pressed="false" aria-label="השהיית התנועה"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>

<script>
(function(){
  const root=document.querySelector(".vx"),btn=root.querySelector(".vx-pause");
  let off=false,held=false;
  const sync=()=>root.classList.toggle("is-paused",off||held);
  // התנועה היא CSS בלבד. כאן רק עוצרים אותה כשהסקשן מחוץ למסך או כשלוחצים על הכפתור
  new IntersectionObserver(es=>{off=!es[0].isIntersecting;sync();},{rootMargin:"10% 0px"}).observe(root);
  // תנועה בלי סוף דורשת כפתור השהיה. בהפחתת תנועה אין תנועה ואין כפתור
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  btn.hidden=false;
  btn.addEventListener("click",()=>{
    held=!held;sync();
    btn.setAttribute("aria-pressed",String(held));
    btn.setAttribute("aria-label",held?"הפעלת התנועה":"השהיית התנועה");
  });
})();
</script>
</body>
</html>
