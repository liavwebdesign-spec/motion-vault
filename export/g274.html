<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G274 · שדה כוכבים שנמתח לפסים עם מהירות הגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G274 · שדה כוכבים שנמתח לפסים עם מהירות הגלילה */
.sf{position:relative;isolation:isolate;overflow:clip;display:grid;place-items:center;min-height:clamp(520px,58vw,720px);padding:clamp(48px,7vw,112px) clamp(20px,5vw,96px);border-radius:clamp(20px,2.4vw,32px);background:var(--ink, #16182b);color:var(--bg, #f7f7fa);text-align:center}
.sf-front{position:relative;display:grid;justify-items:center;gap:20px;max-width:46rem;text-shadow:0 0 .6em var(--ink, #16182b),0 0 1.3em var(--ink, #16182b)}
.sf-front h2{margin:0;font-size:clamp(36px,5.4vw,76px);font-weight:800;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.sf-front p{margin:0;max-width:38ch;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.sf-cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:600;text-decoration:none;text-shadow:none}
.sf-cv{position:absolute;inset:0;z-index:-1;width:100%;height:100%;display:block}
.sf-glow{position:absolute;inset:0;z-index:-1;margin:auto;width:min(900px,120%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--accent, #4a3aff) 34%,transparent),transparent 62%);opacity:.25;pointer-events:none}
/* המצב הסטטי: נקודות ופסים דקים שיוצאים מהמרכז. כשהקנבס פעיל (is-live) הם מוסתרים */
.sf-dots{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1.4px 1.4px at 8% 18%,color-mix(in oklab,var(--bg, #f7f7fa) 85%,transparent),transparent 100%),
    radial-gradient(1.2px 1.2px at 17% 74%,color-mix(in oklab,var(--bg, #f7f7fa) 70%,transparent),transparent 100%),
    radial-gradient(1.6px 1.6px at 26% 36%,color-mix(in oklab,var(--bg, #f7f7fa) 80%,transparent),transparent 100%),
    radial-gradient(1.2px 1.2px at 33% 88%,color-mix(in oklab,var(--bg, #f7f7fa) 60%,transparent),transparent 100%),
    radial-gradient(1.4px 1.4px at 41% 12%,color-mix(in oklab,var(--bg, #f7f7fa) 75%,transparent),transparent 100%),
    radial-gradient(1.2px 1.2px at 58% 84%,color-mix(in oklab,var(--bg, #f7f7fa) 65%,transparent),transparent 100%),
    radial-gradient(1.6px 1.6px at 67% 24%,color-mix(in oklab,var(--bg, #f7f7fa) 85%,transparent),transparent 100%),
    radial-gradient(1.2px 1.2px at 74% 62%,color-mix(in oklab,var(--bg, #f7f7fa) 60%,transparent),transparent 100%),
    radial-gradient(1.4px 1.4px at 83% 14%,color-mix(in oklab,var(--bg, #f7f7fa) 70%,transparent),transparent 100%),
    radial-gradient(1.4px 1.4px at 91% 78%,color-mix(in oklab,var(--bg, #f7f7fa) 80%,transparent),transparent 100%),
    radial-gradient(1.2px 1.2px at 95% 40%,color-mix(in oklab,var(--bg, #f7f7fa) 65%,transparent),transparent 100%),
    repeating-conic-gradient(from 3deg at 50% 50%,color-mix(in oklab,var(--bg, #f7f7fa) 26%,transparent) 0 .25deg,transparent .25deg 7deg);
  -webkit-mask-image:radial-gradient(ellipse at center,transparent 22%,#000 76%);mask-image:radial-gradient(ellipse at center,transparent 22%,#000 76%)}
.sf.is-live .sf-dots{display:none}
@media(max-width:767px){.sf{padding:56px 20px}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="sf">
  <div class="sf-dots" aria-hidden="true"></div>
  <canvas class="sf-cv" aria-hidden="true"></canvas>
  <div class="sf-glow" aria-hidden="true"></div>
  <div class="sf-front">
    <h2>משלוח באותו יום, בכל גוש דן והשרון</h2>
    <p>אוספים מהעסק בין שמונה בבוקר לשתיים בצהריים וממסרים עד הערב. הלקוח רואה איפה השליח נמצא בכל רגע, ואתם מקבלים אישור מסירה עם חתימה.</p>
    <a class="sf-cta" href="#">לשליחות ראשונה</a>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP נשאר השדה הסטטי של ה-CSS
  const root=document.querySelector(".sf"),cv=root.querySelector(".sf-cv"),glow=root.querySelector(".sf-glow"),front=root.querySelector(".sf-front");
  const ctx=cv.getContext("2d");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    // צבעי הטוקנים נפתרים פעם אחת (פיקסל אחד בקנבס), כך שהשדה מתאים לכל עור
    const px=document.createElement("canvas").getContext("2d",{willReadFrequently:true}),probe=document.createElement("i");
    px.canvas.width=px.canvas.height=1;probe.style.cssText="position:absolute;visibility:hidden;pointer-events:none";root.appendChild(probe);
    const rgb=name=>{probe.style.color="var("+name+")";px.clearRect(0,0,1,1);px.fillStyle=getComputedStyle(probe).color;px.fillRect(0,0,1,1);const d=px.getImageData(0,0,1,1).data;return d[0]+","+d[1]+","+d[2];};
    const COL=[rgb("--bg"),rgb("--accent")];
    const K=.24;                              // פיזור הכוכבים: ככל שגדול יותר הם רחוקים יותר מהמרכז
    let W=0,H=0,stars=[],v=0,target=0,raf=0,last=0,visible=false;
    const rnd=(a,b)=>a+Math.random()*(b-a);
    const spawn=(s,far)=>{s.x=rnd(-1,1);s.y=rnd(-1,1);s.z=far?1:rnd(.12,1);s.c=Math.random()<.16?1:0;return s;};
    const size=()=>{
      const r=root.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
      W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      const n=Math.max(150,Math.min(280,Math.round(W*H/3800)));
      while(stars.length<n)stars.push(spawn({}));
      stars.length=n;
    };
    const frame=now=>{
      raf=0;if(!visible)return;
      const dt=Math.min(50,now-(last||now)),k=dt/16.7;last=now;
      v+=(target-v)*Math.min(1,.09*k);target*=Math.pow(.93,k);       // המהירות מוחלקת ודועכת לבד
      ctx.clearRect(0,0,W,H);ctx.lineCap="round";
      const cx=W/2,cy=H/2,len=.004+v*.17,step=(.0011+v*.045)*k;
      for(const s of stars){
        s.z-=step;
        const f=K/s.z,x=cx+s.x*cx*f,y=cy+s.y*cy*f;
        if(s.z<=.1||Math.abs(x-cx)>cx*1.15||Math.abs(y-cy)>cy*1.15){spawn(s,true);continue;}
        const f2=K/(s.z+len),x2=cx+s.x*cx*f2,y2=cy+s.y*cy*f2;     // זנב הפס: המיקום מעט קודם
        const rx=(x-cx)/cx,ry=(y-cy)/cy,fade=Math.min(1,Math.max(0,(Math.sqrt(rx*rx+ry*ry)-.26)/.5));   // המרכז נשאר נקי
        const a=fade*(.25+.75*(1-s.z))*(.5+.5*Math.min(1,v*2+.4));
        if(a<.02)continue;
        ctx.strokeStyle="rgba("+COL[s.c]+","+a.toFixed(3)+")";ctx.lineWidth=.8+(1-s.z)*1.3;
        ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x,y);ctx.stroke();
      }
      glow.style.opacity=(.25+v*.75).toFixed(3);glow.style.transform="scale("+(1+v*.45).toFixed(3)+")";
      raf=requestAnimationFrame(frame);
    };
    const io=new IntersectionObserver(([e])=>{visible=e.isIntersecting;if(visible&&!raf){last=0;raf=requestAnimationFrame(frame);}},{threshold:0});
    const ro=new ResizeObserver(size);
    size();root.classList.add("is-live");visible=true;frame(performance.now());
    io.observe(root);ro.observe(root);
    const st=ScrollTrigger.create({trigger:root,start:"top bottom",end:"bottom top",onUpdate:self=>{target=Math.max(target,Math.min(1,Math.abs(self.getVelocity())/2600));}});
    gsap.fromTo(front,{yPercent:9},{yPercent:-9,ease:"none",scrollTrigger:{trigger:root,start:"top bottom",end:"bottom top",scrub:.6}});
    return()=>{io.disconnect();ro.disconnect();cancelAnimationFrame(raf);raf=0;visible=false;st.kill();root.classList.remove("is-live");ctx.clearRect(0,0,cv.width,cv.height);glow.style.opacity="";glow.style.transform="";probe.remove();};
  });
})();
</script>
</body>
</html>
