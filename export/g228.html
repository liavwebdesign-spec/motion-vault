<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G228 · שם מותג שמתחדד מטשטוש תנועה וטבעת שעוברת עליו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G228 · שם מותג שמתחדד מטשטוש תנועה וטבעת שעוברת עליו */
.rs{display:grid;place-items:center;align-content:center;gap:24px;min-height:clamp(380px,56vh,560px);padding-block:clamp(48px,6vw,96px);text-align:center}
.rs-defs{position:absolute;width:0;height:0}
.rs-w{position:relative;font-size:clamp(76px,13vw,200px);line-height:1}
.rs-word{margin:0;font-size:1em;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.rs-ring{position:absolute;top:50%;left:50%;width:1.45em;height:1.45em;translate:-50% -50%;border-radius:50%;border:2px solid var(--accent, #4a3aff);box-shadow:0 0 36px color-mix(in srgb,var(--accent, #4a3aff) 50%,transparent),inset 0 0 28px color-mix(in srgb,var(--accent, #4a3aff) 30%,transparent);opacity:0;pointer-events:none}
.rs-ring::after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent, #4a3aff) 45%,transparent)}
.rs-tag{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.5}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="rs" aria-label="אופק, הנהלת חשבונות לעסקים קטנים">
  <svg class="rs-defs" width="0" height="0" aria-hidden="true" focusable="false"><filter id="rs-blur" x="-30%" y="-20%" width="160%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter></svg>
  <div class="rs-w"><p class="rs-word">אופק</p><i class="rs-ring" aria-hidden="true"></i></div>
  <p class="rs-tag">הנהלת חשבונות לעסקים קטנים</p>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;   // בלי GSAP המילה חדה והטבעת שקופה (במארקאפ)
  const root=document.querySelector(".rs"),word=root.querySelector(".rs-word"),ring=root.querySelector(".rs-ring"),tag=root.querySelector(".rs-tag");
  const blur=root.querySelector("#rs-blur feGaussianBlur"),W=()=>word.offsetWidth;
  // בהפחתת תנועה הפונקציה לא רצה
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const tl=gsap.timeline({paused:true});
    tl.set(word,{filter:"url(#rs-blur)"},0)
      .fromTo(blur,{attr:{stdDeviation:"46 0"}},{attr:{stdDeviation:"0 0"},duration:1.4,ease:"power3.out"},0)
      .fromTo(word,{opacity:0,scale:1.06},{opacity:1,scale:1,duration:.7,ease:"power2.out"},0)
      .fromTo(ring,{x:()=>W()*.75,scale:.55},{x:()=>-W()*.75,scale:1.15,duration:1.5,ease:"power2.inOut"},.05)
      .fromTo(ring,{opacity:0},{opacity:1,duration:.3,ease:"none"},.05)
      .to(ring,{opacity:0,duration:.45,ease:"none"},1.1)
      .fromTo(tag,{y:10,opacity:0},{y:0,opacity:1,duration:.8,ease:"power3.out"},1.25)
      .set(word,{clearProps:"filter,transform,opacity"})
      .set(tag,{clearProps:"transform,opacity"});
    const st=ScrollTrigger.create({trigger:root,start:"top 72%",end:"bottom 12%",
      onEnter:()=>tl.invalidate().restart(),onEnterBack:()=>tl.invalidate().restart(),onLeaveBack:()=>tl.pause(0)});
    return()=>{st.kill();tl.progress(1).kill();blur.setAttribute("stdDeviation","0 0");word.style.filter="";};
  });
})();
</script>
</body>
</html>
