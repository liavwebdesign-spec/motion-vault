<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G227 · סמל שנפתח כמניפה ונעצר על הלוגו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G227 · סמל שנפתח כמניפה ונעצר על הלוגו */
.pf{display:grid;place-items:center;min-height:clamp(380px,56vh,560px);padding-block:clamp(48px,6vw,96px)}
.pf-lock{display:flex;align-items:center;gap:clamp(20px,3vw,40px)}
.pf-mark{flex:none;width:clamp(112px,16vw,208px);height:auto;overflow:visible}
.pf-o{fill:var(--accent, #4a3aff)}
.pf-i{fill:color-mix(in srgb,var(--accent, #4a3aff) 36%,var(--bg, #f7f7fa))}
.pf-hub{fill:var(--bg, #f7f7fa)}
.pf-txt{display:grid;gap:8px}
.pf-name{margin:0;font-size:clamp(52px,7.4vw,112px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.pf-tag{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.5}
@media(max-width:767px){.pf-lock{flex-direction:column;text-align:center}.pf-txt{justify-items:center}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="pf" aria-label="פריחה, קליניקה לטיפול משלים">
  <div class="pf-lock">
    <svg class="pf-mark" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <g class="pf-fan"><path class="pf-o" d="M60 60C71 48 72 24 60 6C48 24 49 48 60 60Z" transform="rotate(0 60 60)"/><path class="pf-o" d="M60 60C71 48 72 24 60 6C48 24 49 48 60 60Z" transform="rotate(60 60 60)"/><path class="pf-o" d="M60 60C71 48 72 24 60 6C48 24 49 48 60 60Z" transform="rotate(120 60 60)"/><path class="pf-o" d="M60 60C71 48 72 24 60 6C48 24 49 48 60 60Z" transform="rotate(180 60 60)"/><path class="pf-o" d="M60 60C71 48 72 24 60 6C48 24 49 48 60 60Z" transform="rotate(240 60 60)"/><path class="pf-o" d="M60 60C71 48 72 24 60 6C48 24 49 48 60 60Z" transform="rotate(300 60 60)"/><path class="pf-i" d="M60 60C67 52 67 39 60 27C53 39 53 52 60 60Z" transform="rotate(30 60 60)"/><path class="pf-i" d="M60 60C67 52 67 39 60 27C53 39 53 52 60 60Z" transform="rotate(90 60 60)"/><path class="pf-i" d="M60 60C67 52 67 39 60 27C53 39 53 52 60 60Z" transform="rotate(150 60 60)"/><path class="pf-i" d="M60 60C67 52 67 39 60 27C53 39 53 52 60 60Z" transform="rotate(210 60 60)"/><path class="pf-i" d="M60 60C67 52 67 39 60 27C53 39 53 52 60 60Z" transform="rotate(270 60 60)"/><path class="pf-i" d="M60 60C67 52 67 39 60 27C53 39 53 52 60 60Z" transform="rotate(330 60 60)"/></g>
      <circle class="pf-hub" cx="60" cy="60" r="5"/>
    </svg>
    <div class="pf-txt"><p class="pf-name">פריחה</p><p class="pf-tag">קליניקה לטיפול משלים, הרצליה</p></div>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;   // בלי GSAP הלוגו כבר שלם (במארקאפ)
  const root=document.querySelector(".pf"),svg=root.querySelector(".pf-mark"),fan=svg.querySelector(".pf-fan"),hub=svg.querySelector(".pf-hub");
  const outer=[...svg.querySelectorAll(".pf-o")],inner=[...svg.querySelectorAll(".pf-i")];
  const name=root.querySelector(".pf-name"),tag=root.querySelector(".pf-tag");
  // הזווית הסופית של כל עלה נקראת מהמארקאפ
  const ang=els=>els.map(e=>parseFloat((e.getAttribute("transform")||"").replace("rotate(",""))||0);
  const A1=ang(outer),A2=ang(inner),O={svgOrigin:"60 60"};
  // בהפחתת תנועה הפונקציה לא רצה, והלוגו השלם מוצג מיד
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const tl=gsap.timeline({paused:true,defaults:{ease:"power3.out"}});
    tl.fromTo(fan,{rotation:-140,scale:.5,opacity:0,...O},{rotation:0,scale:1,opacity:1,duration:1.5,...O},0)
      .fromTo(outer,{rotation:0,...O},{rotation:i=>A1[i],duration:1.2,stagger:.07,...O},.1)
      .fromTo(inner,{rotation:0,...O},{rotation:i=>A2[i],duration:1.2,stagger:.07,...O},.35)
      .fromTo(hub,{scale:0,...O},{scale:1,duration:.6,...O},.9)
      .fromTo(name,{clipPath:"inset(0 0 0 100%)",x:24},{clipPath:"inset(0 0 0 0%)",x:0,duration:.9,ease:"power3.inOut"},1)
      .fromTo(tag,{y:12,opacity:0},{y:0,opacity:1,duration:.8},1.55)
      .set([name,tag],{clearProps:"clipPath,transform,opacity"});
    const st=ScrollTrigger.create({trigger:root,start:"top 72%",end:"bottom 12%",
      onEnter:()=>tl.restart(),onEnterBack:()=>tl.restart(),onLeaveBack:()=>tl.pause(0)});
    return()=>{st.kill();tl.progress(1).kill();};
  });
})();
</script>
</body>
</html>
