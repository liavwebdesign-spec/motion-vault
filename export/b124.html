<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B124 · תמונה מאחורי זכוכית מחורצת שמתבהרת בעכבר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B124 · תמונה מאחורי זכוכית מחורצת שמתבהרת בעכבר */
.fl{display:grid;gap:clamp(24px,3vw,48px);padding:clamp(24px,4vw,64px) clamp(20px,5vw,72px)}
.fl-tx{display:grid;gap:16px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end;column-gap:clamp(24px,4vw,64px)}
.fl-k{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--accent, #4a3aff);grid-column:1/-1}
.fl-tx h2{margin:0;font-size:clamp(34px,4.4vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.fl-side{display:grid;gap:16px;justify-items:start}
.fl-side p{margin:0;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
.fl-cta{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-weight:700;text-decoration:none}
.fl-cta:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:3px}
.fl-m{position:relative;overflow:hidden;border-radius:clamp(16px,2vw,28px);aspect-ratio:16/8;background:var(--surface,var(--bg, #f7f7fa));}
.fl-m img,.fl-m canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fl-m img{object-fit:cover}
.fl-m canvas{opacity:0;transition:opacity .7s cubic-bezier(.2,.6,.2,1)}
.fl.is-gl .fl-m canvas{opacity:1}

@media(max-width:800px){.fl{grid-template-columns:minmax(0,1fr)}.fl-tx{grid-template-columns:minmax(0,1fr)}.fl-m{aspect-ratio:4/5}}
@media(prefers-reduced-motion:reduce){.fl-m canvas{transition:none}}
</style>
</head>
<body>

<div class="stage"><section class="fl" data-fl>
  <div class="fl-tx">
    <p class="fl-k">סטודיו לעיצוב פנים</p>
    <h2>בית שנראה טוב גם כשאף אחד לא מסתכל</h2>
    <div class="fl-side"><p>תכנון וליווי של דירות ובתים פרטיים, מהסקיצה הראשונה ועד הכרית האחרונה על הספה.</p><a class="fl-cta" href="#">לתיק העבודות</a></div>
  </div>
  <div class="fl-m">
    <img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s13/proj-a.webp" width="1800" height="1200" alt="סלון כהה עם ספה נמוכה, מנורות תלויות וחלון גבוה" decoding="async" loading="lazy">
    <canvas aria-hidden="true"></canvas>
  </div>
</section></div>


<script>

    "float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec2(17.,9.);a*=.5;}return s;}\n"+

    mx+=(tm-mx)*(o.ease||.09);my+=(tn-my)*(o.ease||.09);api.H+=(api.th-api.H)*.06;

</script>
