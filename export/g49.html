<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G49 · וידאו שמתקדם עם הגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* G49 · וידאו שמתקדם עם הגלילה */
.vs{position:relative;height:320vh}
.vs-stick{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden;background:#0e0f16}
.vs-video{width:min(92vw,960px);border-radius:var(--r, 14px);display:block}
/* שכבת קריאות מתחת לכיתוב: בצילום אמיתי בהיר הטקסט הלבן לא נשען על הווידאו */
.vs-cap{position:absolute;inset-inline:0;bottom:11vh;padding-block:24px;text-align:center;color:#fff;pointer-events:none;
  background:linear-gradient(transparent,rgba(0,0,0,.45) 40%,transparent)}
.vs-cap b,.vs-cap span{pointer-events:auto}
.vs-cap b{display:block;font-size:clamp(22px,3.4vw,42px);margin-bottom:6px}
.vs-cap span{font-size:15px;opacity:.75}
/* מוטבע ומעוגל. רצועה בגובה 4 פיקסלים שנמתחת מקצה לקצה המסך נקראת כקו מפריד תועה
   ולא כמד התקדמות, במיוחד כשהיא ריקה בתחילת הגלילה. */
.vs-bar{position:absolute;inset-inline:clamp(16px,6vw,80px);bottom:clamp(14px,2.5vh,26px);
  height:5px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.14)}
/* המילוי נחשף ב-clip-path ולא ב-width, כדי שכל עדכון גלילה לא יהיה layout. בעמוד עברי הוא מתמלא מימין */
.vs-bar i{display:block;height:100%;width:100%;border-radius:999px;background:var(--accent, #4a3aff);clip-path:inset(0 0 0 100% round 999px)}
.vs-after{padding:14vh var(--gutter, clamp(24px, 5vw, 96px));max-width:min(680px,92vw);margin-inline:auto;text-align:center;color:var(--muted, #6a6d85);font-size:17px;line-height:1.9}
</style>
</head>
<body>

<div class="vs">
  <div class="vs-stick">
    <video class="vs-video" src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/scrub.mp4" poster="https://liavwebdesign-spec.github.io/motion-vault/assets/media/scrub.jpg"
           muted playsinline preload="metadata" aria-label="הדגמה: וידאו שמתקדם עם הגלילה"></video>
    <div class="vs-cap"><b>הגלילה היא הנגן</b><span>גלול למטה ולמעלה. הסרטון עוקב.</span></div>
    <div class="vs-bar"><i></i></div>
  </div>
</div>
<p class="vs-after">בסרטון אמיתי זה יהיה מוצר שמסתובב, מכונה שעובדת או בית שנבנה. הקובץ חייב להיות מקודד לחיפוש מהיר, אחרת התנועה מקרטעת.</p>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  const v=document.querySelector(".vs-video"),bar=document.querySelector(".vs-bar i");
  // הקובץ כבד בכוונה (כל פריים keyframe), ולכן הוא יורד במלואו רק כשהסקשן מתקרב למסך
  if("IntersectionObserver" in window)new IntersectionObserver(([e],o)=>{if(e.isIntersecting){v.preload="auto";o.disconnect();}},{rootMargin:"100% 0px"}).observe(v);
  else v.preload="auto";
  if(typeof gsap==="undefined")return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let target=0,current=0,dur=0,ready=false,st=null;
  function start(){
    dur=v.duration||0; if(!dur||st)return;
    ready=true;
    st=ScrollTrigger.create({
      trigger:".vs",start:"top top",end:"bottom bottom",scrub:true,
      onUpdate:self=>{target=self.progress*dur;bar.style.clipPath="inset(0 0 0 "+((1-self.progress)*100).toFixed(1)+"% round 999px)";}
    });
    ScrollTrigger.refresh();
  }
  v.addEventListener("loadedmetadata",start);
  if(v.readyState>=1)start();
  // iOS לא מרשה קפיצה בזמן לפני שהווידאו התנגן פעם אחת, ולכן דוחפים play ומיד pause
  const kick=()=>{const p=v.play();if(p&&p.then)p.then(()=>v.pause()).catch(()=>{});};
  addEventListener("touchstart",kick,{once:true,passive:true});
  addEventListener("click",kick,{once:true});
  // החלקה: מתקרבים אל היעד בהדרגה במקום להציב currentTime בכל אירוע גלילה
  gsap.ticker.add(()=>{
    if(!ready)return;
    if(reduce){v.currentTime=target;return;}
    current+=(target-current)*.18;
    if(Math.abs(target-current)<.004)current=target;
    if(v.seeking)return;
    v.currentTime=current;
  });
})();
</script>
</body>
</html>
