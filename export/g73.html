<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G73 · טקסט מתפענח (Scramble)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G73 · טקסט מתפענח (Scramble) */
.scr{text-align:center;max-width:26ch;margin-inline:auto}
.scr-kick{display:block;font-size:13px;letter-spacing:.18em;color:var(--muted, #6a6d85);margin-bottom:14px;font-variant-numeric:tabular-nums}
.scr h2{font-size:var(--fs-demo, clamp(36px, 3vw + 0.5rem, 76px));line-height:1.1;margin:0 0 30px;font-weight:800;min-height:1.1em}
.scr-nav{display:flex;justify-content:center;gap:clamp(14px,3vw,36px);flex-wrap:wrap}
.scr-nav a{font-weight:600;font-size:17px;color:var(--ink, #16182b);padding:8px 4px;border-bottom:2px solid transparent;font-variant-ligatures:none;min-width:5ch;text-align:center}
.scr-nav a:hover{border-color:var(--accent, #4a3aff)}
</style>
</head>
<body>

<div class="stage"><div class="scr">
  <span class="scr-kick" data-scr="מאז 2016 · 40+ פרויקטים">·········</span>
  <h2 data-scr="אתרים שמביאים לקוחות">····· ······· ······</h2>
  <nav class="scr-nav"><a href="#" data-scr="עבודות">עבודות</a><a href="#" data-scr="שירותים">שירותים</a><a href="#" data-scr="אודות">אודות</a><a href="#" data-scr="צור קשר">צור קשר</a></nav>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger, ScrambleTextPlugin);

(function(){
  const HEB="אבגדהוזחטיכלמנסעפצקרשת0123456789";   // רעש בעברית, אחרת המעבר לטיני וצורם
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const items=[...document.querySelectorAll("[data-scr]")];
  if(reduce){items.forEach(el=>el.textContent=el.dataset.scr);return;}
  ScrollTrigger.create({trigger:".scr",start:"top 80%",once:true,onEnter(){
    items.forEach((el,i)=>gsap.to(el,{duration:1.1,delay:i*.12,scrambleText:{text:el.dataset.scr,chars:HEB,speed:.6,revealDelay:.25}}));
  }});
  if(matchMedia("(hover:hover) and (pointer:fine)").matches){
    document.querySelectorAll(".scr-nav a").forEach(a=>a.addEventListener("mouseenter",()=>{
      gsap.to(a,{duration:.55,overwrite:true,scrambleText:{text:a.dataset.scr,chars:HEB,speed:1}});
    }));
  }
})();
</script>
</body>
</html>
