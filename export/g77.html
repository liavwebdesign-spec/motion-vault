<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G77 · כותרת מקו מתאר למילוי בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G77 · כותרת מקו מתאר למילוי בגלילה */
.ol{max-width:min(1000px,94vw);margin-inline:auto;padding-block:16vh}
.ol h2{font-size:clamp(38px,7.5vw,120px);line-height:1.05;margin:0;font-weight:800;text-align:center}
.ol .w{display:inline-block;margin-inline:.12em;color:transparent;-webkit-text-stroke:1.6px var(--ink, #16182b);paint-order:stroke fill}
@media(max-width:767px){.ol .w{-webkit-text-stroke-width:1px}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><div class="ol"><h2><span class="w">לא</span><span class="w">עוד</span><span class="w">אתר.</span><br><span class="w">מכונה</span><span class="w">שמייצרת</span><span class="w">פניות.</span></h2></div></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  const words=gsap.utils.toArray(".ol .w");
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16182b";
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(words,{color:ink});return;}
  gsap.to(words,{color:ink,stagger:.35,ease:"none",scrollTrigger:{trigger:".ol",start:"top 75%",end:"bottom 45%",scrub:.5}});
})();
</script>
</body>
</html>
