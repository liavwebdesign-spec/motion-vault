<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G171 · מרכז עם שותפים שמשלמים אליו ומספר שעולה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G171 · מרכז עם שותפים שמשלמים אליו ומספר שעולה */
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);align-items:center;gap:clamp(32px,6vw,96px);max-width:1120px;margin-inline:auto}
.hb-txt{display:grid;gap:16px;max-width:36ch}
.hb-txt h2{margin:0;font-size:clamp(30px,3.4vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.hb-lead{margin:0;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.hb-total{display:grid;gap:4px;margin:12px 0 0}
.hb-total b{font-size:clamp(44px,5.6vw,84px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hb-total small{font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));color:var(--muted, #6a6d85)}
.hb-fig{margin:0}
.hb-svg{display:block;width:100%;height:auto;overflow:visible}
.hb-spoke{stroke:var(--muted, #6a6d85);stroke-width:2;stroke-linecap:round;stroke-dasharray:.1 8;opacity:.55}
.hb-halo{fill:none;stroke:var(--line, #e4e4ee);stroke-width:2}
.hb-hub rect{fill:var(--accent, #4a3aff)}
.hb-hub path{fill:none;stroke:var(--accent-ink, #fff);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.hb-n circle{fill:var(--card, #fff);stroke:var(--line, #e4e4ee);stroke-width:2}
.hb-n.is-tint circle{fill:color-mix(in srgb,var(--accent, #4a3aff) 14%,var(--card, #fff))}
.hb-n text{fill:var(--ink, #16182b);font-size:17px;font-weight:600;text-anchor:middle;font-family:inherit}
.hb-chip{opacity:0}
.hb-chip.is-keep{opacity:1}
.hb-chip rect{fill:var(--accent, #4a3aff)}
.hb-chip text{fill:var(--accent-ink, #fff);font-size:17px;font-weight:700;text-anchor:middle;direction:ltr;unicode-bidi:isolate;font-family:inherit}
.hb-dot{fill:var(--accent, #4a3aff);opacity:0}
.hb .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:767px){.hb{grid-template-columns:minmax(0,1fr)}.hb-txt{max-width:none}.hb-n text{font-size:23px}.hb-chip text{font-size:22px}}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הרשת מוגמרת והסכום הסופי כבר במארקאפ
  const root=document.querySelector(".hb"),svg=root.querySelector(".hb-svg"),out=root.querySelector(".hb-total b");
  const nodes=[...svg.querySelectorAll(".hb-n")],spokes=[...svg.querySelectorAll(".hb-spoke")],chips=[...svg.querySelectorAll(".hb-chip")];
  const dot=svg.querySelector(".hb-dot"),hub=svg.querySelector(".hb-hub"),halo=svg.querySelector(".hb-halo");
  const fmt=v=>"₪"+Math.round(v).toLocaleString("en-US"),final=parseInt(out.dataset.final,10);
  const sum=chips.reduce((s,c)=>s+(+c.dataset.amt),0),base=final-sum;
  // סדר קבוע (בלי אקראי), והשורות שנשארות פתוחות בסוף אחרונות
  const order=[...chips.filter(c=>!c.classList.contains("is-keep")).sort((a,b)=>(a.dataset.amt*7%13)-(b.dataset.amt*7%13)),...chips.filter(c=>c.classList.contains("is-keep"))];
  // בהפחתת תנועה הפונקציה לא רצה, והרשת נשארת במצבה הסופי
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    const o={v:base},draw=()=>{out.textContent=fmt(o.v);};
    draw();gsap.set(chips,{autoAlpha:0});
    const tl=gsap.timeline({scrollTrigger:{trigger:root,start:"top 72%",once:true}});
    tl.from(hub,{scale:.7,autoAlpha:0,transformOrigin:"50% 50%",duration:.5,ease:"power2.out"})
      .from(nodes,{scale:0,autoAlpha:0,transformOrigin:"50% 50%",duration:.4,ease:"power2.out",stagger:.04},.1)
      .from(spokes,{autoAlpha:0,duration:.4,stagger:.04},.2);
    let t=1.1,cum=base;
    order.forEach(c=>{
      const x=+c.dataset.x,y=+c.dataset.y;cum+=+c.dataset.amt;
      tl.fromTo(c,{autoAlpha:0,y:8},{autoAlpha:1,y:0,duration:.3,ease:"power2.out"},t)
        .fromTo(dot,{x,y,autoAlpha:1},{x:0,y:0,duration:.8,ease:"power1.in"},t+.15)
        .set(dot,{autoAlpha:0},t+.95)
        .fromTo(halo,{scale:1},{scale:1.1,transformOrigin:"50% 50%",duration:.18,yoyo:true,repeat:1,ease:"power1.out"},t+.95)
        .to(o,{v:cum,duration:.45,ease:"power1.out",onUpdate:draw},t+.95);
      if(!c.classList.contains("is-keep"))tl.to(c,{autoAlpha:0,duration:.3},t+1.7);
      t+=.46;
    });
    return()=>{out.textContent=fmt(final);};
  });
})();
</script>
