<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FT4 · פוטר עם סוגר שנמס לתוכו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* FT4 · פוטר עם סוגר שנמס לתוכו */
/* ---- demo frame and page tail (scaffolding, not part of the footer) ---- */
.fx{margin-inline:var(--gutter, clamp(24px, 5vw, 96px));border:1px solid var(--line, #e4e4ee);border-radius:var(--r, 14px);overflow:hidden;background:var(--bg, #f7f7fa);isolation:isolate}
.fx-end{display:grid;gap:12px;padding:72px 32px}
.fx-end small{font-size:13px;font-weight:600;color:var(--muted, #6a6d85)}
.fx-end p{margin:0;max-width:52ch;font-size:16px;line-height:1.6;color:var(--muted, #6a6d85)}

/* ---- the mandatory atoms every footer carries ---- */
.ftw{font-size:15px;line-height:1.6}
.ftw a{color:inherit;text-decoration:none;transition:color .15s cubic-bezier(.2,.6,.2,1),opacity .15s cubic-bezier(.2,.6,.2,1)}
.ftw h3{margin:0 0 12px;font-size:14px;font-weight:600;opacity:.62}
.ftw ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ft-tel{unicode-bidi:isolate;font-weight:600}
.ft-legal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:13px}
.ft-legal p{margin:0;opacity:.7}
.ft-legal nav{display:flex;flex-wrap:wrap;gap:8px 20px}
.ft-legal nav a{opacity:.7}
.ft-credit{margin-inline-start:auto!important}
.ft-credit a{opacity:.7}
@media (hover:hover) and (pointer:fine){.ftw a:hover,.ft-legal nav a:hover,.ft-credit a:hover{opacity:1;color:var(--accent, #4a3aff)}}
.ft-dark{background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
@media (hover:hover) and (pointer:fine){.ft-dark a:hover,.ft-dark .ft-legal nav a:hover,.ft-dark .ft-credit a:hover{color:color-mix(in srgb,var(--accent, #4a3aff) 45%,var(--bg, #f7f7fa))}}
.ft-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 28px;border-radius:12px;border:0;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff)!important;
  font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .18s cubic-bezier(.2,.6,.2,1),background .2s cubic-bezier(.2,.6,.2,1)}
.ft-btn svg{width:18px;height:18px}
@media (hover:hover) and (pointer:fine){.ft-btn:hover{transform:translateY(-2px)}}
.ft-rv{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s cubic-bezier(.2,.6,.2,1);transition-delay:calc(var(--i,0) * 80ms)}
.is-in .ft-rv{opacity:1;transform:none}
@media (max-width:760px){.ft-credit{margin-inline-start:0!important;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.ftw *,.ft-rv{transition-duration:.01ms!important;transition-delay:0s!important}.ft-rv{opacity:1;transform:none}}
/* the footer colour sits under the photo too: if the image fails (or is slow), the white headline is still on dark */
.ft4-close{position:relative;isolation:isolate;overflow:hidden;min-height:min(70vh,560px);display:flex;flex-direction:column;justify-content:flex-end;gap:24px;padding:96px 32px 56px;color:var(--bg, #f7f7fa);background-color:var(--ink, #16182b)}
.ft4-close::before{content:"";position:absolute;inset:0;z-index:-2;background:url(https://liavwebdesign-spec.github.io/motion-vault/assets/media/demo-b.jpg) center/cover;transform:scale(1.06);transition:transform 1.6s cubic-bezier(.2,.6,.2,1)}
.ft4-close.is-in::before{transform:none}
/* the seam rule: the gradient's 0% stop is EXACTLY the footer colour, so there is nothing to see where they meet */
.ft4-close::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--ink, #16182b) 0%,color-mix(in srgb,var(--ink, #16182b) 72%,transparent) 38%,transparent 78%)}
.ft4-close h2{margin:0;max-width:15ch;font-size:clamp(38px,5vw,80px);line-height:1}
.ft4-close .ft-btn{align-self:flex-start}
.ft4{display:grid;gap:40px;padding:8px 32px 40px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa)}
.ft4-row{display:flex;flex-wrap:wrap;gap:24px 56px}
.ft4-row>div{display:grid;gap:4px}
.ft4-row h3{margin:0 0 4px}
@media (max-width:760px){.ft4-close{padding:88px 20px 40px}.ft4{padding:8px 20px 32px}}
</style>
</head>
<body>

<div class="fx">
<section class="ft4-close" id="ft4c"><h2 class="ft-rv">בית שמרגיש נכון בשמונה בבוקר</h2><a class="ft-btn ft-rv" style="--i:1" href="#ft4c">לפגישת היכרות <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a></section>
<footer class="ftw ft4" id="ft4">
  <div class="ft4-row">
    <div><h3>סטודיו</h3><span>הנביאים 12, חיפה</span><a class="ft-tel" href="tel:+97240000000" dir="ltr">04-000-0000</a></div>
    <div><h3>ניווט</h3><a href="#ft4">פרויקטים</a><a href="#ft4">הסטודיו</a><a href="#ft4">תהליך</a></div>
    <div><h3>עקבו</h3><a href="#ft4">אינסטגרם</a><a href="#ft4">פינטרסט</a></div>
  </div>
  <div class="ft-legal"><p>© <span data-year>2026</span> סטודיו לאדריכלות לדוגמה. כל הזכויות שמורות.</p><nav aria-label="מסמכים"><a href="#privacy">מדיניות פרטיות</a><a href="#accessibility">הצהרת נגישות</a></nav><p class="ft-credit"><a href="https://liavmatzri.co.il" rel="noopener" target="_blank">עוצב ופותח על ידי ליאב מצרי</a></p></div>
</footer></div>


<script>
document.querySelectorAll("[data-year]").forEach(function(e){e.textContent=new Date().getFullYear();});
function inView(el,f){
  function chk(){var r=el.getBoundingClientRect();if(r.top<innerHeight*.9&&r.bottom>0){off();f();}}
  function off(){removeEventListener("scroll",chk);removeEventListener("resize",chk);}
  addEventListener("scroll",chk,{passive:true});addEventListener("resize",chk);requestAnimationFrame(chk);setTimeout(chk,300);
}
(function(){var c=document.getElementById("ft4c");inView(c,function(){c.classList.add("is-in");});})();
</script>
</body>
</html>
