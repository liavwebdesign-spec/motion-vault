<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS24 · מרקר שנמתח מאחורי מילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS24 · מרקר שנמתח מאחורי מילה */
.mk-wrap{max-width:24ch;margin-inline:auto;font-size:clamp(28px,3.4vw,58px);font-weight:800;line-height:1.35;text-align:center}
.mk{
  background-image:linear-gradient(var(--mk,#d9ff5c),var(--mk,#d9ff5c));
  background-repeat:no-repeat;
  background-position:right 0.06em center;
  background-size:0% 62%;
  padding-inline:.12em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.mk--ink{--mk:#c9c6ff}
@supports (animation-timeline: view()){
  .mk{animation:mk-grow linear both;animation-timeline:view();animation-range:entry 25% cover 42%}
}
@supports not (animation-timeline: view()){
  .mk{background-size:100% 62%}
}
@keyframes mk-grow{from{background-size:0% 62%}to{background-size:100% 62%}}
@media (prefers-reduced-motion: reduce){.mk{animation:none;background-size:100% 62%}}
.mk-hover{margin-top:18px;font-size:17px;font-weight:500;color:var(--muted, #6a6d85);text-align:center}
.mk-hover b{font-weight:700;color:var(--ink, #16182b);background-image:linear-gradient(#ffd6e7,#ffd6e7);background-repeat:no-repeat;background-position:right center;background-size:0% 58%;transition:background-size .45s cubic-bezier(.2,.8,.2,1);padding-inline:.1em}
.mk-hover:hover b{background-size:100% 58%}
</style>
</head>
<body>
<div class="stage"><p class="mk-wrap">אנחנו לא מוכרים אתר. אנחנו מוכרים <span class="mk">תוצאה שאפשר למדוד</span> בסוף החודש.</p></div>
<div class="stage"><p class="mk-wrap">כל פרויקט מתחיל ב<span class="mk mk--ink">אפיון</span>, לא בעיצוב.</p>
<p class="mk-hover">יש גם וריאנט הובר: העבר עכבר על <b>המילה הזאת</b> ותראה.</p></div>


</body>
</html>
