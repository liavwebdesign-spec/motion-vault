<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B59 · רשימה חיה שפריטים נכנסים אליה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B59 · רשימה חיה שפריטים נכנסים אליה */
.al{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:12px;height:380px;overflow:hidden;
  mask-image:linear-gradient(180deg,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent)}
.al-item{display:flex;align-items:center;gap:14px;background:var(--card, #fff);border:1px solid var(--line, #e4e4ee);border-radius:16px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.06);will-change:transform}
.al-item.enter{animation:al-in .55s cubic-bezier(.2,.6,.2,1) both}
@keyframes al-in{from{opacity:0;transform:scale(.92) translateY(-10px)}}
.al-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.al-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.al-t b{font-size:15px}.al-t span{font-size:13px;color:var(--muted, #6a6d85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-time{margin-inline-start:auto;font-size:12px;color:var(--muted, #6a6d85);flex:none}
.al-ctrl{display:flex;justify-content:center;margin-top:16px}
.al-play{width:44px;height:44px;border-radius:50%;border:1px solid var(--line, #e4e4ee);background:var(--card, #fff);color:var(--ink, #16182b);cursor:pointer;display:grid;place-items:center;transition:border-color .18s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.al-play:hover{border-color:var(--ink, #16182b)}}
.al-play:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:2px}
.al-play svg{width:16px;height:16px}
.al-play .i-play,.al-play[aria-pressed="false"] .i-pause{display:none}
.al-play[aria-pressed="false"] .i-play{display:block}
@media (prefers-reduced-motion: reduce){.al-item.enter{animation:none}.al-play{transition:none}}
</style>
</head>
<body>

<div class="stage tight"><div class="al" role="log" aria-live="off" aria-label="פעילות אחרונה"></div>
<div class="al-ctrl"><button class="al-play" type="button" aria-pressed="true" aria-label="עצירת העדכון האוטומטי"><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg><svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button></div></div>


<script>
(function(){
  const list=document.querySelector(".al"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const feed=[["ליד חדש","דנה מחיפה השאירה פרטים בטופס","ph-a"],["תשלום התקבל","חשבונית 2041 שולמה","ph-d"],["פגישה נקבעה","יום שלישי 10:00 עם רועי","ph-b"],["הודעת וואטסאפ","\"אפשר הצעת מחיר?\"","ph-c"],["ביקור חוזר","לקוח מ-2024 חזר לעמוד המחירים","ph-e"]];
  let i=0;
  function add(){
    const [t,s,c]=feed[i++%feed.length];
    const before=new Map([...list.children].map(el=>[el,el.getBoundingClientRect().top]));
    const el=document.createElement("div");el.className="al-item enter";
    el.innerHTML='<span class="al-ic '+c+'">'+t[0]+'</span><div class="al-t"><b>'+t+'</b><span>'+s+'</span></div><span class="al-time">עכשיו</span>';
    list.prepend(el);
    if(!reduce){before.forEach((top,node)=>{const d=top-node.getBoundingClientRect().top;if(!d)return;
      node.animate([{transform:"translateY("+d+"px)"},{transform:"none"}],{duration:500,easing:"cubic-bezier(.2,.6,.2,1)"});});}
    [...list.children].slice(6).forEach(n=>n.remove());
    el.addEventListener("animationend",()=>el.classList.remove("enter"),{once:true});
  }
  add();add();add();
  // הלולאה רק כשלא עצרו אותה בכפתור, כשהרשימה על המסך, לא בריחוף ולא בלשונית מוסתרת. בתנועה מופחתת מתחילים עצורים
  const play=document.querySelector(".al-play");
  let t=null,seen=false,paused=reduce;
  const run=()=>{if(!t&&seen&&!paused&&!document.hidden&&!list.matches(":hover"))t=setInterval(add,2200);},stop=()=>{clearInterval(t);t=null;};
  // WCAG 2.2.2: עדכון אוטומטי שנמשך יותר מחמש שניות חייב כפתור עצירה גלוי; ריחוף ויציאה מהמסך לא מספיקים
  const setPlay=()=>{play.setAttribute("aria-pressed",String(!paused));play.setAttribute("aria-label",paused?"הפעלת העדכון האוטומטי":"עצירת העדכון האוטומטי");};
  play.addEventListener("click",()=>{paused=!paused;setPlay();paused?stop():run();});
  setPlay();
  if("IntersectionObserver" in window)new IntersectionObserver(es=>{seen=es[es.length-1].isIntersecting;seen?run():stop();}).observe(list);
  else{seen=true;run();}
  list.addEventListener("mouseenter",stop);list.addEventListener("mouseleave",run);
  document.addEventListener("visibilitychange",()=>document.hidden?stop():run());
})();
</script>
</body>
</html>
