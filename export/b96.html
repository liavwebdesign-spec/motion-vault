<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B96 · שדה קווים קצרים שזורם ומתעקל סביב הסמן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B96 · שדה קווים קצרים שזורם ומתעקל סביב הסמן */
.hf{position:relative;isolation:isolate;overflow:hidden;display:grid;align-items:center;min-height:clamp(420px,66vh,640px);padding:clamp(48px,6vw,96px) var(--gutter, clamp(24px, 5vw, 96px))}
.hf-art{position:absolute;inset:0;z-index:-1;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,var(--ink, #16182b) 52%,transparent 100%);mask-image:radial-gradient(ellipse at 50% 50%,var(--ink, #16182b) 52%,transparent 100%)}
.hf-svg,.hf-cv{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s cubic-bezier(.2,.6,.2,1)}
.hf-svg path{fill:none;stroke-width:1.6;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.6}
.hf-l0{stroke:var(--accent, #4a3aff)}
.hf-l1{stroke:color-mix(in srgb,var(--accent, #4a3aff) 75%,var(--ink, #16182b))}
.hf-l2{stroke:color-mix(in srgb,var(--accent, #4a3aff) 50%,var(--ink, #16182b))}
.hf-l3{stroke:color-mix(in srgb,var(--accent, #4a3aff) 28%,var(--ink, #16182b))}
.hf-l4{stroke:color-mix(in srgb,var(--accent, #4a3aff) 10%,var(--ink, #16182b))}
.hf-cv{opacity:0}
.hf-art.is-on .hf-cv{opacity:1}
.hf-art.is-on .hf-svg{opacity:0}
.hf-in{position:relative;display:grid;gap:16px;justify-items:start;max-width:38ch}
/* שכבת רקע רכה מאחורי הטקסט: קו אף פעם לא עובר חד מתחת למילה */
.hf-in::before{content:"";position:absolute;inset:-48px -64px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--bg, #f7f7fa) 96%,transparent) 55%,transparent)}
.hf-k{margin:0;font-size:15px;font-weight:600;color:var(--muted, #6a6d85)}
.hf h2{margin:0;font-size:clamp(34px,4.6vw,64px);line-height:1.08;text-wrap:balance}
.hf-lead{margin:0;font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6;color:var(--muted, #6a6d85)}
.hf-btn{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.hf-btn:hover{transform:translateY(-2px)}}
.hf-btn:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.hf-svg,.hf-cv{transition:none}}
@media(max-width:767px){.hf{min-height:480px}.hf-in::before{inset:0;border-radius:16px;background:color-mix(in srgb,var(--bg, #f7f7fa) 92%,transparent);box-shadow:0 0 28px 20px color-mix(in srgb,var(--bg, #f7f7fa) 92%,transparent)}}
</style>
</head>

          let df=(((b-a)%PI)+PI)%PI;if(df>PI/2)df-=PI;   // הסיבוב הקצר ביותר, כי לקו אין כיוון
          a+=w*w*M.k*df;
        }
      }
      ang[i]=a;bk[i]=Math.min(4,(((a%PI)+PI)%PI/PI*5)|0);
    }
    ctx.clearRect(0,0,W,H);ctx.lineWidth=1.6;ctx.lineCap="round";ctx.globalAlpha=.7;
    for(let b=0;b<5;b++){
      ctx.strokeStyle=COL[b];ctx.beginPath();
      for(let i=0;i<N;i++){if(bk[i]!==b)continue;const c=Math.cos(ang[i])*h,s=Math.sin(ang[i])*h;ctx.moveTo(cx[i]-c,cy[i]-s);ctx.lineTo(cx[i]+c,cy[i]+s);}
      ctx.stroke();
    }
  }
  function build(){
    const dpr=Math.min(2,devicePixelRatio||1),r=art.getBoundingClientRect();W=r.width;H=r.height;if(!W||!H)return;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    step=W<600?26:30;const cols=Math.ceil(W/step),rows=Math.ceil(H/step);N=cols*rows;
    cx=new Float32Array(N);cy=new Float32Array(N);ang=new Float32Array(N);bk=new Uint8Array(N);
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const k=j*cols+i;cx[k]=(i+.5)*step+(W-cols*step)/2;cy[k]=(j+.5)*step+(H-rows*step)/2;}
    colors();frame(.4);
  }
  function loop(now){
    M.x+=(M.tx-M.x)*.14;M.y+=(M.ty-M.y)*.14;M.k+=(M.tk-M.k)*.08;
    frame((now-t0)/1000+.4);
    raf=running?requestAnimationFrame(loop):0;
  }
  function sync(){running=!reduced&&vis&&!document.hidden;if(running&&!raf)raf=requestAnimationFrame(loop);}
  root.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const r=art.getBoundingClientRect();M.tx=e.clientX-r.left;M.ty=e.clientY-r.top;if(M.tk<.01){M.x=M.tx;M.y=M.ty;}M.tk=1;});
  root.addEventListener("pointerleave",()=>{M.tk=0;});
  document.addEventListener("visibilitychange",sync);
  new ResizeObserver(build).observe(art);
  new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis){art.classList.add("is-on");colors();}sync();},{rootMargin:"20% 0px"}).observe(root);
  if(reduced)art.classList.add("is-on");   // פריים אחד, בלי לולאה
  build();
})();
</script>
