<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G260 · דגם אריגה שמצייר את עצמו קו אחר קו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* G260 · דגם אריגה שמצייר את עצמו קו אחר קו */
.ho{position:relative;max-width:1100px;margin-inline:auto}
.ho-pin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px);padding:clamp(32px,5vw,72px) 0}
.ho-copy{display:grid;gap:16px;justify-items:start}
.ho-k{margin:0;font-size:15px;font-weight:600;color:var(--muted, #6a6d85)}
.ho h2{margin:0;font-size:clamp(28px,3.4vw,48px);line-height:1.12;text-wrap:balance}
.ho-lead{margin:0;max-width:40ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.ho-btn{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.ho-btn:hover{transform:translateY(-2px)}}
.ho-btn:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:3px}
.ho-art{justify-self:center;width:min(100%,76svh);aspect-ratio:1 / 1;overflow:hidden;border-radius:24px;background:var(--ink, #16182b)}
.ho-svg{display:block;width:100%;height:100%}
.ho-svg:dir(ltr){transform:scaleX(-1)}
.ho-s{fill:none;stroke:var(--bg, #f7f7fa);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;opacity:.92}
.ho-dot{fill:var(--accent, #4a3aff)}
.ho-fr{fill:none;stroke:var(--bg, #f7f7fa);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:0;opacity:.7}
/* המהלך רץ: הסקשן גבוה והבמה נעוצה במסך, והגלילה מציירת את הדגם */
.ho.is-live{height:280vh}
.ho.is-live .ho-pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
@media(max-width:767px){
  .ho-pin{grid-template-columns:minmax(0,1fr);align-content:center;gap:16px}
  .ho-copy{gap:12px}
  .ho-art{width:min(100%,46svh)}
}
</style>
</head>

<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined")return;   // בלי GSAP נשאר הדגם המלא
  gsap.registerPlugin(ScrollTrigger);
  const root=document.querySelector(".ho"),segs=[...root.querySelectorAll(".ho-s")],dots=[...root.querySelectorAll(".ho-dot")],fr=root.querySelector(".ho-fr");
  // בהפחתת תנועה הפונקציה לא רצה, והדגם המלא נשאר
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("is-live");
    gsap.set(segs,{strokeDashoffset:1});gsap.set(fr,{strokeDashoffset:1});
    gsap.set(dots,{scale:0,transformOrigin:"50% 50%"});
    const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6,invalidateOnRefresh:true}});
    // כל קטע מצייר את החלק שלו מהקו (a עד b) בתוך משך הקו, כך שהציור זורם במהירות אחידה לאורך כל קו
    segs.forEach(s=>{
      const d=s.dataset,a=+d.a,b=+d.b,dur=+d.d,start=(+d.f?.4:0)+(+d.o)/14*.5;
      tl.to(s,{strokeDashoffset:0,duration:dur*(b-a)},start+dur*a);
    });
    tl.to(dots,{scale:1,duration:.2,ease:"power2.out",stagger:{amount:.3,from:"center"}},1.35)
      .to(fr,{strokeDashoffset:0,duration:.5},1.5);
    return()=>{
      if(tl.scrollTrigger)tl.scrollTrigger.kill();tl.kill();
      root.classList.remove("is-live");
      gsap.set([...segs,...dots,fr],{clearProps:"all"});
    };
  });
})();
</script>
