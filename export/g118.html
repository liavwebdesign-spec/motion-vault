<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G118 · אלכסון צבע שמסתובב מאחורי העמוד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G118 · אלכסון צבע שמסתובב מאחורי העמוד */
.dg{position:relative}
.dg-bg{position:sticky;top:0;height:100vh;margin-bottom:-100vh;overflow:hidden;z-index:0;pointer-events:none}
.dg-pane{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;translate:-50% -50%;background:linear-gradient(90deg,var(--ink, #16182b) 0 50%,var(--accent, #4a3aff) 50% 100%);will-change:transform;opacity:.94}
.dg-body{position:relative;z-index:1}
.dg-sec{min-height:100vh;display:grid;align-content:center;padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));color:var(--bg, #f7f7fa)}
.dg-sec:nth-child(even){justify-items:end;text-align:end;color:var(--accent-ink, #fff)}
.dg-sec h2{margin:0 0 10px;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px));max-width:20ch}
.dg-sec p{margin:0;max-width:40ch;opacity:.85;line-height:1.7}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="dg">
  <div class="dg-bg" aria-hidden="true"><div class="dg-pane"></div></div>
  <div class="dg-body">
    <section class="dg-sec"><h2>צד אחד של הסיפור</h2><p>מה שהיה: אתר יפה שאף אחד לא פנה דרכו.</p></section>
    <section class="dg-sec"><h2>והצד השני</h2><p>מה שיש: עמוד שמסביר, ומספרים שעולים.</p></section>
    <section class="dg-sec"><h2>הגבול ביניהם זז</h2><p>כל גלילה מטה את הקו קצת. זה כל הרעיון.</p></section>
  </div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const a=matchMedia("(max-width:767px)").matches?8:14;
  gsap.fromTo(".dg-pane",{rotate:-a},{rotate:a,ease:"none",scrollTrigger:{trigger:".dg",start:"top top",end:"bottom bottom",scrub:.8}});
})();
</script>
</body>
</html>
