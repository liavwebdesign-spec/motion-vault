<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B101 · תמונות ממוזערות: פוסלים ושומרים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B101 · תמונות ממוזערות: פוסלים ושומרים */
@property --vk-a{syntax:"<angle>";inherits:false;initial-value:360deg}
.vk{max-width:820px;margin-inline:auto;display:grid;gap:clamp(24px,3vw,32px)}
.vk .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.vk-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:center;gap:clamp(16px,3vw,32px);padding:clamp(20px,2.4vw,32px);border-radius:clamp(20px,2.4vw,32px);background:var(--card, #fff)}
.vk-lab{margin:0 0 8px;color:var(--muted, #6a6d85);font-size:clamp(16px,1.3vw,19px)}
.vk-val{margin:0;font-size:clamp(56px,7vw,104px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vk-chart{display:block;width:100%;height:auto;aspect-ratio:320 / 96;overflow:visible}
.vk-line{fill:none;stroke:var(--accent, #4a3aff);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.vk-dot{fill:var(--accent, #4a3aff)}
.vk-set{min-width:0;margin:0;padding:0;border:0}
.vk-set legend{margin:0 0 16px;padding:0;font-size:clamp(20px,2vw,28px);font-weight:700;line-height:1.2}
.vk-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
.vk-o{position:relative;display:grid;gap:4px;align-content:start;cursor:pointer}
.vk-ph{position:relative;display:block;border-radius:18px}
.vk-ph img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:inherit;transition:opacity .35s cubic-bezier(.2,.6,.2,1),filter .35s cubic-bezier(.2,.6,.2,1)}
.vk-o.is-out .vk-ph img{opacity:.38;filter:grayscale(1)}
.vk-o input:focus-visible + .vk-ph{outline:3px solid var(--ink, #16182b);outline-offset:6px}
.vk-x{position:absolute;inset-block-start:50%;inset-inline-start:50%;display:grid;place-items:center;width:clamp(40px,22%,64px);aspect-ratio:1;margin:calc(clamp(40px,22%,64px) / -2) 0 0 0;border-radius:50%;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);opacity:0;transform:scale(.4);transition:transform .3s cubic-bezier(.2,.6,.2,1),opacity .2s cubic-bezier(.2,.6,.2,1)}
.vk-x svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.vk-o.is-out .vk-x{opacity:1;transform:scale(1)}
.vk-ring{position:absolute;inset:-6px;border:3px solid var(--accent, #4a3aff);border-radius:22px;pointer-events:none;-webkit-mask:conic-gradient(from 0deg,black var(--vk-a),transparent 0);mask:conic-gradient(from 0deg,black var(--vk-a),transparent 0);transition:--vk-a .8s cubic-bezier(.76,0,.24,1)}
.vk-o:not(.is-win) .vk-ring{--vk-a:0deg}
.vk-w{position:absolute;inset-block-start:10px;inset-inline-start:10px;padding:4px 12px;border-radius:99px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-size:14px;font-weight:700;opacity:0;transform:translateY(6px);transition:transform .35s cubic-bezier(.2,.6,.2,1),opacity .35s cubic-bezier(.2,.6,.2,1)}
.vk-o.is-win .vk-w{opacity:1;transform:translateY(0)}
.vk-nm{margin-top:8px;font-size:clamp(16px,1.4vw,19px);font-weight:600;line-height:1.3}
.vk-r{color:var(--muted, #6a6d85);font-size:15px;font-variant-numeric:tabular-nums}
@media(max-width:767px){
  .vk-card{grid-template-columns:minmax(0,1fr)}
  .vk-ph{border-radius:12px}
  .vk-ring{inset:-4px;border-radius:15px}
  .vk-nm{font-size:15px}
  .vk-w{font-size:12px;padding:2px 8px;inset-block-start:6px;inset-inline-start:6px}
}
@media(prefers-reduced-motion:reduce){.vk-ph img,.vk-x,.vk-ring,.vk-w{transition:none}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="vk" aria-labelledby="vk-h">
  <div class="vk-card">
    <div>
      <p class="vk-lab">אחוז קלקות על המודעה, שבוע בדיקה</p>
      <p class="vk-val">4.1%</p>
    </div>
    <svg class="vk-chart" viewBox="0 0 320 96" aria-hidden="true">
      <path class="vk-line" pathLength="1" d="M316 69.4 L264 61 L212 54.2 L160 44.1 L108 35.6 L56 27.2 L4 18.8"/>
      <circle class="vk-dot" cx="4" cy="18.8" r="5"/>
    </svg>
  </div>
  <fieldset class="vk-set">
    <legend id="vk-h">איזו תמונה נשארת במודעה?</legend>
    <div class="vk-opts">
      <label class="vk-o is-out">
        <input class="sr-only" type="radio" name="vk" value="0">
        <span class="vk-ph"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s11/cones-yellow.webp" width="1400" height="1050" alt="" loading="lazy" decoding="async" style="object-position:50% 50%"><span class="vk-x" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></span><span class="vk-ring" aria-hidden="true"></span><span class="vk-w" aria-hidden="true">נשארת</span></span>
        <span class="vk-nm">קונוסים על רקע צהוב</span><span class="vk-r">1.4% קלקות</span>
      </label>
      <label class="vk-o is-out">
        <input class="sr-only" type="radio" name="vk" value="1">
        <span class="vk-ph"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s11/magenta-cone.webp" width="1000" height="1000" alt="" loading="lazy" decoding="async" style="object-position:50% 50%"><span class="vk-x" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></span><span class="vk-ring" aria-hidden="true"></span><span class="vk-w" aria-hidden="true">נשארת</span></span>
        <span class="vk-nm">גביע ריק על רקע מג'נטה</span><span class="vk-r">1.9% קלקות</span>
      </label>
      <label class="vk-o is-win">
        <input class="sr-only" type="radio" name="vk" value="2" checked>
        <span class="vk-ph"><img src="https://liavwebdesign-spec.github.io/motion-vault/assets/media/real/s11/hero-scoops.webp" width="1400" height="1750" alt="" loading="lazy" decoding="async" style="object-position:50% 50%"><span class="vk-x" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></span><span class="vk-ring" aria-hidden="true"></span><span class="vk-w" aria-hidden="true">נשארת</span></span>
        <span class="vk-nm">שלושה כדורי גלידה</span><span class="vk-r">4.1% קלקות</span>
      </label>
    </div>
  </fieldset>
  <p class="vk-live sr-only" role="status"></p>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>

<script>
(function(){
  const root=document.querySelector(".vk"),opts=[...root.querySelectorAll(".vk-o")],inputs=opts.map(o=>o.querySelector("input"));
  const val=root.querySelector(".vk-val"),line=root.querySelector(".vk-line"),dot=root.querySelector(".vk-dot"),live=root.querySelector(".vk-live");
  const D=[{"name":"קונוסים על רקע צהוב","v":1.4,"d":"M316 72.8 L264 69.4 L212 71.1 L160 66 L108 67.7 L56 64.4 L4 64.4","x":4,"y":64.4},{"name":"גביע ריק על רקע מג'נטה","v":1.9,"d":"M316 71.1 L264 67.7 L212 62.7 L160 64.4 L108 59.3 L56 57.6 L4 55.9","x":4,"y":55.9},{"name":"שלושה כדורי גלידה","v":4.1,"d":"M316 69.4 L264 61 L212 54.2 L160 44.1 L108 35.6 L56 27.2 L4 18.8","x":4,"y":18.8}];      // לכל תמונה: שם, ערך, נתיב הקו ונקודת הסוף
  const reduce=matchMedia("(prefers-reduced-motion: reduce)"),EASE="cubic-bezier(.2,.6,.2,1)";
  const fmt=n=>n.toFixed(1)+"%";
  let shown=D[2].v,raf=0,timers=[];
  function setVal(to,animate){
    cancelAnimationFrame(raf);
    if(!animate||reduce.matches){shown=to;val.textContent=fmt(to);return;}
    const from=shown,t0=performance.now(),dur=700;
    (function step(t){
      const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
      shown=from+(to-from)*e;val.textContent=fmt(shown);
      if(k<1)raf=requestAnimationFrame(step);
    })(t0);
  }
  function draw(i,animate){
    line.setAttribute("d",D[i].d);dot.setAttribute("cx",D[i].x);dot.setAttribute("cy",D[i].y);
    if(!animate||reduce.matches)return;
    line.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:700,easing:EASE});
    dot.animate([{opacity:0},{opacity:0,offset:.8},{opacity:1}],{duration:700,easing:EASE});
  }
  function mark(i){opts.forEach((o,k)=>{o.classList.toggle("is-win",k===i);o.classList.toggle("is-out",k!==i);});}
  function stop(){timers.forEach(clearTimeout);timers=[];line.style.visibility="";dot.style.visibility="";}
  // בחירה של מבקר: מבטלת את הרצף אם הוא באמצע, ומציגה מיד את הזוכה החדש
  inputs.forEach((inp,i)=>inp.addEventListener("change",()=>{
    stop();mark(i);draw(i,true);setVal(D[i].v,true);
    live.textContent="נבחרה התמונה: "+D[i].name+", "+fmt(D[i].v)+" קלקות";
  }));
  // הרצף בכניסה למסך: נייטרלי, X ראשון, X שני, ואז הזוכה עם המספר והקו
  if(reduce.matches||!("IntersectionObserver" in window))return;
  opts.forEach(o=>o.classList.remove("is-out","is-win"));
  val.textContent=fmt(0);line.style.visibility="hidden";dot.style.visibility="hidden";
  const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  const io=new IntersectionObserver(es=>{
    if(!es.some(e=>e.isIntersecting))return;
    io.disconnect();
    at(500,()=>opts[0].classList.add("is-out"));
    at(1100,()=>opts[1].classList.add("is-out"));
    at(1800,()=>{opts[2].classList.add("is-win");line.style.visibility="";dot.style.visibility="";draw(2,true);setVal(D[2].v,true);});
  },{threshold:.6});
  io.observe(root.querySelector(".vk-opts"));
})();
</script>
</body>
</html>
