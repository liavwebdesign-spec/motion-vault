<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS26 · קיר אריחים נסחף בפרספקטיבה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS26 · קיר אריחים נסחף בפרספקטיבה */
.dw{position:relative;height:clamp(360px,60vh,560px);overflow:hidden;border-radius:var(--r, 14px);background:var(--ink, #16182b);perspective:900px;
  mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)}
.dw-grid{position:absolute;inset:-10% -4%;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;transform:rotateX(14deg) rotateZ(-4deg) scale(1.08);transform-style:preserve-3d}
.dw-col{display:flex;flex-direction:column;gap:14px;animation:dw-up 26s linear infinite}
.dw-col:nth-child(2n){animation-duration:34s;animation-direction:reverse}
.dw-col:nth-child(3n){animation-duration:30s}
.dw-tile{aspect-ratio:4/3;border-radius:12px;background:color-mix(in srgb,var(--bg, #f7f7fa) 8%,transparent);border:1px solid color-mix(in srgb,var(--bg, #f7f7fa) 10%,transparent);display:grid;place-items:center;color:color-mix(in srgb,var(--bg, #f7f7fa) 60%,transparent);font-weight:700;font-size:14px;
  transition:transform .5s cubic-bezier(.2,.6,.2,1),background-color .4s}
@keyframes dw-up{to{transform:translateY(-50%)}}
@media (hover:hover) and (pointer:fine){
  .dw-col:hover{animation-play-state:paused}
  .dw-tile:hover{transform:translateZ(40px) scale(1.04);background:rgba(255,255,255,.14)}
}
.dw-over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--bg, #f7f7fa);pointer-events:none;padding:24px}
.dw-over h2{margin:0;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px));text-shadow:0 2px 24px rgba(0,0,0,.5);pointer-events:auto}
/* phone: five narrow columns are shorter than the wall, so the -50% loop opened empty holes; three taller columns cover it */
@media (max-width:767px){.dw-grid{grid-template-columns:repeat(3,1fr)}.dw-col:nth-child(n+4){display:none}.dw-tile{aspect-ratio:3/4}}
@media (prefers-reduced-motion: reduce){.dw-col{animation:none}}
</style>
</head>
<body>

<div class="stage tight"><div class="dw">
  <div class="dw-grid" aria-hidden="true">
    <div class="dw-col"><div class="dw-tile">1</div><div class="dw-tile">2</div><div class="dw-tile">3</div><div class="dw-tile">4</div><div class="dw-tile">1</div><div class="dw-tile">2</div><div class="dw-tile">3</div><div class="dw-tile">4</div></div>
    <div class="dw-col"><div class="dw-tile">5</div><div class="dw-tile">6</div><div class="dw-tile">7</div><div class="dw-tile">8</div><div class="dw-tile">5</div><div class="dw-tile">6</div><div class="dw-tile">7</div><div class="dw-tile">8</div></div>
    <div class="dw-col"><div class="dw-tile">9</div><div class="dw-tile">10</div><div class="dw-tile">11</div><div class="dw-tile">12</div><div class="dw-tile">9</div><div class="dw-tile">10</div><div class="dw-tile">11</div><div class="dw-tile">12</div></div>
    <div class="dw-col"><div class="dw-tile">13</div><div class="dw-tile">14</div><div class="dw-tile">15</div><div class="dw-tile">16</div><div class="dw-tile">13</div><div class="dw-tile">14</div><div class="dw-tile">15</div><div class="dw-tile">16</div></div>
    <div class="dw-col"><div class="dw-tile">17</div><div class="dw-tile">18</div><div class="dw-tile">19</div><div class="dw-tile">20</div><div class="dw-tile">17</div><div class="dw-tile">18</div><div class="dw-tile">19</div><div class="dw-tile">20</div></div>
  </div>
  <div class="dw-over"><h2>יותר מארבעים פרויקטים שעלו לאוויר</h2></div>
</div></div>



</body>
</html>
