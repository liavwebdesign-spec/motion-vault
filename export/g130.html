<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G130 · צמצם מצלמה שנפתח בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-b{background:linear-gradient(160deg,#5f3dc4,#9775fa)}

/* G130 · צמצם מצלמה שנפתח בגלילה */
/* בלי GSAP ובהפחתת תנועה: הירו רגיל, התמונה מלאה. הנעילה, הטבעת וההנחיה רק כשהמהלך רץ (.gsap-live) */
.ir{position:relative}
.ir-pin{position:relative;height:100vh;overflow:hidden;background:var(--ink, #16182b);display:grid;place-items:center}
.ir.gsap-live{height:200vh}
.ir.gsap-live .ir-pin{position:sticky;top:0}
.ir-img{position:absolute;inset:0}
.ir.gsap-live .ir-img{will-change:clip-path}
.ir-img .ph{position:absolute;inset:0;border-radius:0;font-size:0}
.ir-ring{display:none;position:absolute;width:min(60vmin,520px);aspect-ratio:1;border-radius:50%;border:1px solid color-mix(in srgb,var(--bg, #f7f7fa) 25%,transparent);pointer-events:none}
.ir.gsap-live .ir-ring{display:block}
.ir-txt{position:relative;z-index:1;text-align:center;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.5)}
.ir-txt h2{margin:0 0 8px;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px))}
.ir-txt p{display:none;margin:0;opacity:.85}
.ir.gsap-live .ir-txt p{display:block}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="ir">
  <div class="ir-pin"><div class="ir-img"><div class="ph ph-b"></div></div><div class="ir-ring"></div>
  <div class="ir-txt"><h2>סטודיו לצילום</h2><p>גלול כדי לפתוח את הצמצם</p></div></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP התמונה מלאה, כמו הירו רגיל
  const root=document.querySelector(".ir"),img=root.querySelector(".ir-img");
  gsap.matchMedia().add("(prefers-reduced-motion: no-preference)",()=>{
    root.classList.add("gsap-live");
    // מתומן סדיר בפיקסלים. r הוא אחוז מחצי האלכסון: ב-100 המעגל החסום שלו עובר את פינות המסך.
    // היעד 125, כך שהתמונה מלאה כבר בכ-90% מהגלילה ונשארת רגע מלאה לפני שהנעילה משתחררת
    let W=1,H=1;const o={r:4};
    const draw=()=>{const R=o.r/100*Math.hypot(W,H)/2/Math.cos(Math.PI/8),pts=[];
      for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;pts.push((W/2+Math.cos(a)*R).toFixed(1)+"px "+(H/2+Math.sin(a)*R).toFixed(1)+"px");}
      img.style.clipPath="polygon("+pts.join(",")+")";};
    const measure=()=>{W=img.offsetWidth;H=img.offsetHeight;draw();};   // נמדד ב-refresh, לא בכל פריים
    measure();ScrollTrigger.addEventListener("refreshInit",measure);
    gsap.timeline({scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.5},onUpdate:draw})
      .to(o,{r:125,ease:"power2.in",duration:1})
      .to(".ir-ring",{scale:2.4,opacity:0,duration:.8},0)
      .to(".ir-txt p",{opacity:0,duration:.2},0);
    return()=>{ScrollTrigger.removeEventListener("refreshInit",measure);img.style.clipPath="";root.classList.remove("gsap-live");};
  });
})();
</script>
</body>
</html>
