<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G144 · תמונה שנקרעת לשניים וחושפת טקסט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:var(--r, 14px)}
.ph-c{background:linear-gradient(160deg,#0b7285,#3bc9db)}

/* G144 · תמונה שנקרעת לשניים וחושפת טקסט */
/* בלי GSAP ובהפחתת תנועה: מצב הסוף, הכותרת על הרקע. הנעילה ושני החצאים רק כשהמהלך רץ (.gsap-live) */
.tr{position:relative}
.tr-pin{position:relative;height:100vh;overflow:hidden;display:grid;place-items:center;background:var(--ink, #16182b)}
.tr.gsap-live{height:200vh}
.tr.gsap-live .tr-pin{position:sticky;top:0}
.tr-half{display:none;position:absolute;inset:0;will-change:transform}
.tr.gsap-live .tr-half{display:block}
.tr-half .ph{position:absolute;inset:0;border-radius:0;font-size:0}
.tr-half.l{clip-path:polygon(0 0,50.25% 0,48.25% 8%,53.25% 16%,47.25% 24%,52.25% 32%,48.25% 40%,53.25% 48%,47.25% 56%,52.25% 64%,48.25% 72%,53.25% 80%,47.25% 88%,52.25% 96%,50.25% 100%,0 100%)}
.tr-half.r{clip-path:polygon(49.75% 0,100% 0,100% 100%,49.75% 100%,51.75% 96%,46.75% 88%,52.75% 80%,47.75% 72%,51.75% 64%,46.75% 56%,52.75% 48%,47.75% 40%,51.75% 32%,46.75% 24%,52.75% 16%,47.75% 8%)}
.tr-txt{position:relative;text-align:center;color:var(--bg, #f7f7fa);max-width:26ch;padding:24px}
.tr-txt h2{margin:0 0 8px;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px))}
.tr-txt p{margin:0;opacity:.8}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="tr">
  <div class="tr-pin">
    <div class="tr-txt"><h2>מה שמאחורי התמונה</h2><p>גלול כדי לקרוע.</p></div>
    <div class="tr-half l"><div class="ph ph-c"></div></div>
    <div class="tr-half r"><div class="ph ph-c"></div></div>
  </div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
if (typeof gsap !== "undefined") gsap.registerPlugin(ScrollTrigger);

(function(){
  if(typeof gsap==="undefined")return;      // בלי GSAP הכותרת גלויה על הרקע
  const root=document.querySelector(".tr");
  // בהפחתת תנועה אף תנאי לא מתקיים: נשאר מצב הסוף
  gsap.matchMedia().add({desk:"(min-width:768px) and (prefers-reduced-motion: no-preference)",mob:"(max-width:767px) and (prefers-reduced-motion: no-preference)"},ctx=>{
    root.classList.add("gsap-live");
    const d=ctx.conditions.mob?60:100;
    gsap.timeline({scrollTrigger:{trigger:root,start:"top top",end:"bottom bottom",scrub:.6}})
      .to(".tr-half.l",{xPercent:-d,rotate:-3,duration:1,ease:"power2.in"},0)
      .to(".tr-half.r",{xPercent:d,rotate:3,duration:1,ease:"power2.in"},0)
      .fromTo(".tr-txt",{opacity:0,scale:.9},{opacity:1,scale:1,duration:.6,ease:"power3.out"},.35);
    return()=>root.classList.remove("gsap-live");
  });
})();
</script>
</body>
</html>
