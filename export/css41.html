<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS41 · צל עלים שמתנדנד על קיר ועל מסגרת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS41 · צל עלים שמתנדנד על קיר ועל מסגרת */
.hl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px);max-width:1100px;margin-inline:auto;padding:clamp(32px,5vw,72px) 0}
.hl-wall{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;aspect-ratio:1 / 1;border-radius:24px;background:color-mix(in srgb,var(--accent, #4a3aff) 7%,var(--card, #fff))}
.hl-frame{margin:0;width:52%;padding:20px;border:8px solid var(--muted, #6a6d85);background:var(--bg, #f7f7fa);box-shadow:0 24px 40px color-mix(in srgb,var(--ink, #16182b) 22%,transparent)}
.hl-frame img{display:block;width:100%;height:auto;aspect-ratio:4 / 5;object-fit:cover}
.hl-shadow{position:absolute;inset:0;z-index:1;pointer-events:none;color:var(--ink, #16182b)}
.hl-sh{position:absolute;inset:0;width:100%;height:100%;transform-origin:100% 0}
.hl-sh1{opacity:.22;animation:hl-sway1 17s cubic-bezier(.4,0,.2,1) infinite alternate}
.hl-sh2{opacity:.14;animation:hl-sway2 11s cubic-bezier(.4,0,.2,1) infinite alternate;animation-delay:-5s}
@keyframes hl-sway1{from{transform:rotate(-2.4deg) translate(-16px,6px)}to{transform:rotate(2.2deg) translate(14px,-8px)}}
@keyframes hl-sway2{from{transform:rotate(2deg) translate(12px,-4px) scale(1.04)}to{transform:rotate(-2.6deg) translate(-14px,8px) scale(1.04)}}
.hl-copy{display:grid;gap:16px;justify-items:start}
.hl-k{margin:0;font-size:15px;font-weight:600;color:var(--muted, #6a6d85)}
.hl h2{margin:0;font-size:clamp(28px,3.4vw,48px);line-height:1.12;text-wrap:balance}
.hl-lead{margin:0;max-width:40ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.hl-price{margin:0;font-size:20px;font-weight:700}
.hl-btn{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:700;text-decoration:none;transition:transform .2s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover) and (pointer:fine){.hl-btn:hover{transform:translateY(-2px)}}
.hl-btn:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.hl-sh{animation:none}}
@media(max-width:767px){.hl{grid-template-columns:minmax(0,1fr)}.hl-frame{width:58%}}
</style>
