<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G75 · בלוב רקע שמשנה צורה בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G75 · בלוב רקע שמשנה צורה בגלילה */
.blb{position:relative;min-height:120vh;display:grid;place-items:center;overflow:hidden}
.blb svg{position:absolute;width:min(70vw,720px);height:auto;inset-inline-start:50%;top:50%;translate:-50% -50%;z-index:0;opacity:.9;will-change:transform}
html[dir="rtl"] .blb svg{translate:50% -50%}
.blb path{fill:var(--accent, #4a3aff)}
.blb-copy{position:relative;z-index:1;text-align:center;max-width:30ch;padding:clamp(26px,4vw,48px);background:color-mix(in srgb,var(--bg, #f7f7fa) 78%,transparent);backdrop-filter:blur(14px);border-radius:24px}
.blb-copy h2{margin:0 0 12px;font-size:var(--fs-h2, clamp(28px, 1.9vw + 0.5rem, 52px))}
.blb-copy p{margin:0;color:var(--muted, #6a6d85)}
@media(max-width:767px){.blb svg{width:90vw;top:30%}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="blb">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <path class="blb-shape" d="M300 80C400 60 520 130 540 240C560 350 500 470 400 510C300 550 170 520 110 430C50 340 80 210 160 140C210 95 250 90 300 80Z"/>
    <path class="blb-b" style="display:none" d="M320 60C440 80 540 200 520 320C500 440 400 540 280 540C160 540 60 460 60 340C60 220 130 130 220 90C260 72 290 55 320 60Z"/>
    <path class="blb-c" style="display:none" d="M260 70C380 40 500 90 550 190C600 290 540 400 460 470C380 540 240 560 150 490C60 420 40 300 90 200C130 120 200 85 260 70Z"/>
  </svg>
  <div class="blb-copy"><h2>טיפול שמתאים לקצב שלך</h2><p>בלי תור של חודשיים, בלי טפסים. פגישה ראשונה תוך שבוע.</p></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger, MorphSVGPlugin);

(function(){
  const shape=document.querySelector(".blb-shape");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  gsap.timeline({scrollTrigger:{trigger:".blb",start:"top bottom",end:"bottom top",scrub:1}})
    .to(shape,{morphSVG:".blb-b",ease:"none"})
    .to(shape,{morphSVG:".blb-c",ease:"none"});
  gsap.to(".blb svg",{rotate:40,ease:"none",scrollTrigger:{trigger:".blb",start:"top bottom",end:"bottom top",scrub:1}});
})();
</script>
</body>
</html>
