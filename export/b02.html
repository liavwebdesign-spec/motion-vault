<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B02 · Count-Up (מספר שסופר)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}
.center{text-align:center}

/* B02 · Count-Up (מספר שסופר) */
.cnums{display:flex;gap:clamp(40px,5vw,110px);flex-wrap:wrap;justify-content:center}
.cnum{font-size:clamp(48px,4vw,96px);font-weight:700}
.cnums small{display:block;color:var(--muted, #6a6d85);font-size:15px;text-align:center}
</style>
</head>
<body>
<div class="stage tight center"><div class="cnums">
<div><span class="cnum" data-count="340" data-suffix="+">0</span><small>לקוחות</small></div>
<div><span class="cnum" data-count="97" data-suffix="%">0</span><small>שביעות רצון</small></div>
<div><span class="cnum" data-count="12" data-suffix="">0</span><small>שנות ניסיון</small></div>
</div></div>

<script>
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(!e.isIntersecting)return;
  const el=e.target,to=+el.dataset.count,sfx=el.dataset.suffix||"";let t0=null;
  function step(ts){if(!t0)t0=ts;const p=Math.min((ts-t0)/900,1);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+sfx;
    if(p<1)requestAnimationFrame(step);}
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches)requestAnimationFrame(step);
  else el.textContent=to+sfx;
  io.unobserve(el);
})},{threshold:.6});
document.querySelectorAll(".cnum").forEach(el=>io.observe(el));
</script>
</body>
</html>
