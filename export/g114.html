<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G114 · חתימה שנכתבת בגלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* G114 · חתימה שנכתבת בגלילה */
.sg{max-width:min(640px,92vw);margin-inline:auto;padding-block:16vh 30vh;text-align:center}
.sg p{font-size:clamp(18px,1.8vw,24px);line-height:1.7;color:var(--muted, #6a6d85);margin:0 0 30px}
.sg svg{width:min(360px,80vw);height:auto;overflow:visible;display:block;margin-inline:auto}
.sg path{fill:none;stroke:var(--ink, #16182b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sg-by{margin-top:10px;opacity:0;translate:0 8px}
.sg-by b{display:block;font-size:17px}
.sg-by span{font-size:14px;color:var(--muted, #6a6d85)}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="sg">
  <p>הבטחתי לעצמי שכל פרויקט יסתיים באתר שאני הייתי רוצה לקבל. עד היום זה הסטנדרט.</p>
  <svg viewBox="0 0 360 120" aria-label="חתימה"><path class="sg-path" d="M20 80 C 40 20, 60 20, 70 70 S 90 110, 110 60 C 120 40, 130 40, 135 65 C 140 90, 150 95, 165 55 C 175 30, 185 35, 190 60 C 195 85, 205 90, 220 60 C 235 30, 250 40, 255 70 C 260 95, 275 95, 290 55 C 300 30, 320 40, 340 60"/></svg>
  <div class="sg-by"><b>ליאב מצרי</b><span>מייסד</span></div>
</div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger, DrawSVGPlugin);

(function(){
  const path=document.querySelector(".sg-path");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(".sg-by",{opacity:1,translate:"0 0"});return;}
  gsap.set(path,{drawSVG:"0%"});
  gsap.timeline({scrollTrigger:{trigger:".sg svg",start:"top 80%",end:"top 30%",scrub:.5}})
    .to(path,{drawSVG:"100%",ease:"none",duration:1})
    .to(".sg-by",{opacity:1,translate:"0 0",duration:.25},.85);
})();
</script>
</body>
</html>
