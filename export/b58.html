<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B58 · דוק אייקונים שמתנפחים ליד הסמן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}


/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* B58 · דוק אייקונים שמתנפחים ליד הסמן */
.dk-wrap{display:flex;justify-content:center;padding-block:60px 30px}
.dk{display:flex;align-items:flex-end;gap:10px;padding:10px calc(14px + var(--g,0px));border-radius:22px;background:var(--card, #fff);border:1px solid var(--line, #e4e4ee);box-shadow:0 18px 50px rgba(0,0,0,.12);
  transition:padding .18s cubic-bezier(.2,.6,.2,1) /* qa-allow: layout, the dock grows with its icons like the macOS dock */}
.dk a{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--bg, #f7f7fa);color:var(--ink, #16182b);font-weight:700;font-size:12px;text-decoration:none;
  transform-origin:bottom center;transform:translateX(var(--tx,0px)) scale(var(--s,1));transition:transform .18s cubic-bezier(.2,.6,.2,1);position:relative}
.dk a::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;translate:-50% 4px;background:var(--ink, #16182b);color:var(--bg, #f7f7fa);font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .2s,translate .2s;pointer-events:none}
@media (hover:hover) and (pointer:fine){.dk a:hover::after{opacity:1;translate:-50% 0}}
.dk a:focus-visible{outline:2px solid var(--accent, #4a3aff);outline-offset:2px}
@media (max-width:420px){.dk{gap:6px;padding:8px calc(10px + var(--g,0px))}.dk a{width:44px;height:44px}}
@media (prefers-reduced-motion: reduce){.dk,.dk a{transition:none}}
</style>
</head>
<body>

<div class="stage tight"><div class="dk-wrap"><nav class="dk" aria-label="ניווט מהיר">
  <a href="#" data-tip="בית">בית</a><a href="#" data-tip="עבודות">עבודות</a><a href="#" data-tip="שירותים">שירות</a><a href="#" data-tip="בלוג">בלוג</a><a href="#" data-tip="אודות">אודות</a><a href="#" data-tip="צור קשר">קשר</a>
</nav></div></div>


<script>
(function(){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches)return;
  const dock=document.querySelector(".dk"),icons=[...dock.querySelectorAll("a")],RANGE=140,MAX=1.7;
  function paint(x){
    // מרכז הפריסה של כל אייקון: המלבן על המסך פחות ההזזה הנוכחית (גם באמצע טרנזישן). ה-scale מהמרכז-תחתית לא מזיז אותו לרוחב
    const c=icons.map(a=>{const r=a.getBoundingClientRect();return r.left+r.width/2-new DOMMatrixReadOnly(getComputedStyle(a).transform).m41;});
    const s=c.map(v=>{const d=Math.abs(x-v);return d>RANGE?1:1+(MAX-1)*Math.cos((d/RANGE)*Math.PI/2);});   // קוסינוס: רך במרכז, מתאפס בקצה הטווח
    const W=icons[0].offsetWidth,ex=s.map(v=>(v-1)*W),G=ex.reduce((a,b)=>a+b,0);
    // דחיפת השכנים: כל אייקון זז בחצי מהגדילה שלו ועוד כל מה שגדל לפניו (לפי מיקום פיזי, משמאל לימין), והשורה נשארת ממורכזת
    const ord=c.map((v,i)=>i).sort((i,j)=>c[i]-c[j]);let acc=0;
    ord.forEach(i=>{icons[i].style.setProperty("--tx",(acc+ex[i]/2-G/2).toFixed(1)+"px");icons[i].style.setProperty("--s",s[i].toFixed(3));acc+=ex[i];});
    dock.style.setProperty("--g",(G/2).toFixed(1)+"px");
  }
  dock.addEventListener("mousemove",e=>paint(e.clientX));
  dock.addEventListener("mouseleave",()=>{icons.forEach(a=>{a.style.setProperty("--s",1);a.style.setProperty("--tx","0px");});dock.style.setProperty("--g","0px");});
})();
</script>
</body>
</html>
