<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSS43 · פסי אזהרה אלכסוניים עם תיבת מילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --accent-ink: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
/* כמו בכל פרויקט של התורה: מה שנכנס מהצד לא פותח גלילה אופקית (30.9.2026, g17 כיווץ את כל העמוד בטלפון) */
html,body{overflow-x:clip}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== פיגום של הדמו בלבד. מחקו את .mv-runway ואת שני ה-div כשמעתיקים. ===== */
.mv-runway{height:70vh;display:grid;place-items:center;color:#66697a;font-size:14px}

/* ===== הרכיב ===== */
/* מחלקות עזר של המאגר שהרכיב הזה משתמש בהן */
.stage{padding:var(--sec, clamp(120px, 12vw, 260px)) var(--gutter, clamp(24px, 5vw, 96px));position:relative}
.stage.tight{padding-block:clamp(48px,5vw,90px)}
.stage.full{padding-inline:0}

/* CSS43 · פסי אזהרה אלכסוניים עם תיבת מילה */
.hz{max-width:1100px;margin-inline:auto}
.hz-band{--p:48.08px;position:relative;isolation:isolate;display:grid;place-items:center;overflow:hidden;min-height:clamp(320px,58vh,540px);padding:24px;border-radius:24px}
/* התזוזה (68px, -68px) היא בדיוק תקופה אחת של הפסים (96.16px) לאורך האלכסון, ולכן הלולאה חלקה */
.hz-band::before{content:"";position:absolute;inset:-80px;z-index:-1;background:repeating-linear-gradient(45deg,var(--accent, #4a3aff) 0 var(--p),var(--ink, #16182b) var(--p) calc(var(--p) * 2));animation:hz-slide 7s linear infinite}
@keyframes hz-slide{to{transform:translate(68px,-68px)}}
.hz-box{display:grid;justify-items:center;gap:8px;padding:28px 56px;background:var(--bg, #f7f7fa);color:var(--ink, #16182b);text-align:center;transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.hz-box:hover{transform:scale(1.03)}
.hz-word{margin:0;font-size:clamp(44px,9vw,120px);font-weight:800;line-height:1;letter-spacing:-.01em}
.hz-offer{margin:0;font-size:clamp(18px,2vw,26px);font-weight:600}
@supports (animation-timeline:view()){
  .hz-box{animation:hz-pop linear both;animation-timeline:view();animation-range:entry 0% entry 70%;animation-timing-function:cubic-bezier(.05,.7,.1,1)}
}
@keyframes hz-pop{from{scale:.8;opacity:0}to{scale:1;opacity:1}}
.hz-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 48px;padding-top:24px}
.hz-foot p{margin:0;max-width:52ch;color:var(--muted, #6a6d85);font-size:var(--fs-body, clamp(17px, 0.6vw + 0.7rem, 22px));line-height:1.6}
.hz-cta{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;background:var(--accent, #4a3aff);color:var(--accent-ink, #fff);font-weight:600;text-decoration:none}
.hz-cta:focus-visible{outline:2px solid var(--ink, #16182b);outline-offset:4px}
@media(prefers-reduced-motion:reduce){.hz-band::before,.hz-box{animation:none}.hz-box{transition:none}}
@media(max-width:767px){.hz-band{padding:16px}.hz-box{padding:24px 28px}}
</style>
</head>
<body>
<div class="mv-runway">גלול למטה, הרכיב מתחיל כאן ↓</div>
<div class="stage"><section class="hz">
  <div class="hz-band">
    <div class="hz-box"><h2 class="hz-word">פינוי מלאי</h2><p class="hz-offer">עד 40% הנחה על כל התצוגה</p></div>
  </div>
  <div class="hz-foot">
    <p>ספות, שולחנות אוכל וכורסאות מדגמי השנה שעברה, בסלון התצוגה ברמת גן עד סוף החודש.</p>
    <a class="hz-cta" href="#">לצפייה בדגמים</a>
  </div>
</section></div>
<div class="mv-runway">סוף הרכיב. נסה גם לגלול חזרה למעלה ↑</div>


</body>
</html>
