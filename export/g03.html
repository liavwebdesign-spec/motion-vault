<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G03 · חור מסכה שנפתח על מדיה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ===== טוקנים. בפרויקט אמיתי מוחקים את הבלוק הזה והרכיב יורש את הטוקנים שלכם. ===== */
:root{
  --gutter: clamp(24px, 5vw, 96px);
  --fs-h1: clamp(26px, 1.6vw + 0.5rem, 40px);
  --fs-h2: clamp(28px, 1.9vw + 0.5rem, 52px);
  --fs-demo: clamp(36px, 3vw + 0.5rem, 76px);
  --fs-body: clamp(17px, 0.6vw + 0.7rem, 22px);
  --sec: clamp(120px, 12vw, 260px);
  --gap: clamp(16px, 1.6vw, 36px);
  --ink: #16182b;
  --muted: #6a6d85;
  --bg: #f7f7fa;
  --line: #e4e4ee;
  --accent: #4a3aff;
  --card: #fff;
  --r: 14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Heebo",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.35;color:var(--ink);background:var(--bg)}
img{max-width:100%}

/* ===== הרכיב ===== */
/* G03 · חור מסכה שנפתח על מדיה */
.maskv{--mask-size:16vw;position:relative;height:100vh;
-webkit-mask-image:radial-gradient(circle var(--mask-size) at 50% 50%,#000 0 50%,transparent 50% 100%);
mask-image:radial-gradient(circle var(--mask-size) at 50% 50%,#000 0 50%,transparent 50% 100%);
-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
-webkit-mask-size:100% 100%;mask-size:100% 100%;transition:all 0s}
.maskv .inner{position:absolute;inset:0;background:linear-gradient(135deg,#3b2667,#bc78ec);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(26px,3vw,46px);font-weight:700}
@media(max-width:767px){.maskv{--mask-size:140px}}
</style>
</head>
<body>
<div class="maskv"><div class="inner">המדיה שלך כאן</div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

gsap.timeline({scrollTrigger:{trigger:".maskv",start:"top top",end:"+=800",scrub:1,pin:true,anticipatePin:1}})
.to(".maskv",{"--mask-size":"250vw",ease:"none"},0);
</script>
</body>
</html>
