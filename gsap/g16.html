<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>G16 · מילים מתרוקנות בהובר | Motion Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/vault.css">
<style>
.hovt{font-size:var(--fs-demo);line-height:1.25;font-weight:800;max-width:22ch;margin-inline:auto;cursor:default}
</style>
</head>
<body>
<div class="vtop"><div class="vtop-in">
  <a class="vback" href="../index.html">→ לכל המאגר</a>
  <h1><span class="vid">G16</span> · מילים מתרוקנות בהובר</h1>
  <span class="chip cat-gsap">GSAP</span>
  <span class="chip">GSAP · SplitText · text-stroke</span>
  <span class="chip st-pending">ממתין לאישור</span>
</div></div>
<div class="vintro">
  <p>מרחפים על מילה בכותרת והיא הופכת למתאר חלול; עוזבים והיא מתמלאת חזרה.</p>
  <p class="when"><b>מתי משתמשים:</b> כותרת הירו אינטראקטיבית. עובד מצוין בעברית. במובייל כבוי.</p>
</div>

<div class="stage tight center"><h2 class="hovt">כל מילה בכותרת הזאת מגיבה למגע העכבר שלך בנפרד ובזמן אמת</h2></div>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);
const split=new SplitText(".hovt",{type:"words"});
gsap.set(split.words,{display:"inline-block"});
split.words.forEach(w=>{
  w.addEventListener("mouseenter",()=>gsap.to(w,{color:"transparent","-webkit-text-stroke":"1.5px #16182b",duration:.15}));
  w.addEventListener("mouseleave",()=>gsap.to(w,{color:"#16182b","-webkit-text-stroke":"0px transparent",duration:.15}));
});
</script>
</body>
</html>
