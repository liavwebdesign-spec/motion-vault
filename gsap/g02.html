<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G02 · חשיפת תמונה במסכה בגלילה | Motion Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/vault.css">
<style>
.paint{--reveal:0%;--feather:10%;width:min(680px,80vw);height:clamp(300px,36vw,520px);margin-inline:auto;
-webkit-mask-image:linear-gradient(to top,#000 0%,#000 var(--reveal),transparent calc(var(--reveal) + var(--feather)),transparent 100%);
mask-image:linear-gradient(to top,#000 0%,#000 var(--reveal),transparent calc(var(--reveal) + var(--feather)),transparent 100%);
-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%;font-size:26px}
</style>
</head>
<body>
<div class="vtop"><div class="vtop-in">
  <a class="vback" href="../index.html">→ לכל המאגר</a>
  <h1><span class="vid">G02</span> · חשיפת תמונה במסכה בגלילה</h1>
  <span class="chip cat-gsap">GSAP</span>
  <span class="chip">GSAP · ScrollTrigger</span>
  <span class="chip st-pending">ממתין לאישור</span>
</div></div>
<div class="vintro">
  <p>התמונה נצבעת מלמטה למעלה עם קצה מעומעם, בקצב הגלילה, קדימה ואחורה.</p>
  <p class="when"><b>מתי משתמשים:</b> תמונת שיא, לפני/אחרי, ויז'ואל הירו משני.</p>
</div>
<div class="runway">גלול למטה, הדמו מגיע ↓</div>
<div class="stage"><div class="paint ph ph-e">התמונה נצבעת</div></div>
<div class="runway">עוד מסלול גלילה. נסה גם חזרה למעלה ↑</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const state={val:0};
gsap.to(state,{val:100,ease:"none",
  scrollTrigger:{trigger:".paint",start:"top 85%",end:"top 25%",scrub:true},
  onUpdate:()=>document.querySelector(".paint").style.setProperty("--reveal",state.val+"%")});
</script>
</body>
</html>
